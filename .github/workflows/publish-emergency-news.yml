name: Publish Source-Only News

on:
  pull_request:
    paths:
      - "scripts/publish_emergency_news.py"
      - "scripts/enforce_homepage_photo_only.py"
      - "scripts/homepage-photo-only.js"
      - "tests/test_publish_emergency_news.py"
      - "tests/test_homepage_photo_only.py"
      - ".github/workflows/publish-emergency-news.yml"
  push:
    branches: [main]
    paths:
      - "scripts/publish_emergency_news.py"
      - "scripts/enforce_homepage_photo_only.py"
      - "scripts/homepage-photo-only.js"
      - "tests/test_publish_emergency_news.py"
      - "tests/test_homepage_photo_only.py"
      - ".github/workflows/publish-emergency-news.yml"
      - "pl/aktualnosci.html"
      - "en/news.html"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: emergency-news-publication
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install feedparser requests
      - name: Validate layout-preserving publisher
        run: |
          python -m py_compile scripts/publish_emergency_news.py scripts/enforce_homepage_photo_only.py
          python -m unittest tests.test_publish_emergency_news tests.test_homepage_photo_only -v
          node --check scripts/homepage-photo-only.js

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser requests

      - name: Refresh news content in preserved PL and EN layouts
        id: build
        run: |
          set -euo pipefail
          marker="source-only-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "marker=${marker}" >> "$GITHUB_OUTPUT"
          python scripts/publish_emergency_news.py --marker "${marker}"
          python scripts/enforce_homepage_photo_only.py
          grep -F '/scripts/homepage-photo-only.js?v=ai-outlook-compact-2' pl/index.html
          grep -F '/scripts/homepage-photo-only.js?v=ai-outlook-compact-2' en/index.html
          if grep -F '/scripts/homepage-photo-only.js?v=1' pl/index.html en/index.html; then
            echo "::error::Old AI Outlook asset version remains in homepage HTML."
            exit 1
          fi

      - name: Commit and push content-only refresh
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pl/aktualnosci.html en/news.html \
            pl/index.html en/index.html \
            pl/home_brief.json en/home_brief.json \
            data/emergency_news_status.json
          if git diff --cached --quiet; then
            echo "::error::Source-only publisher produced no content changes."
            exit 1
          fi
          git commit -m "chore(news): refresh PL and EN content without layout changes"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
              git rebase origin/main
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not push refreshed news after 5 attempts."
          exit 1

      - name: Verify news and homepage markers on production
        run: |
          python scripts/publish_emergency_news.py \
            --verify \
            --marker "${{ steps.build.outputs.marker }}" \
            --base-url https://briefrooms.com
