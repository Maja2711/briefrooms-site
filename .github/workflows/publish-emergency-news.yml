name: Publish Emergency News

on:
  push:
    branches: [main]
    paths:
      - "scripts/publish_emergency_news.py"
      - ".github/workflows/publish-emergency-news.yml"
  workflow_dispatch:
  schedule:
    - cron: "5 */2 * * *"

permissions:
  contents: write

concurrency:
  group: emergency-news-publication
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser requests

      - name: Validate emergency publisher
        run: python -m py_compile scripts/publish_emergency_news.py

      - name: Build fresh PL and EN pages
        id: build
        run: |
          set -euo pipefail
          marker="emergency-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "marker=${marker}" >> "$GITHUB_OUTPUT"
          python scripts/publish_emergency_news.py --marker "${marker}"

      - name: Commit and push emergency pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pl/aktualnosci.html en/news.html data/emergency_news_status.json
          if git diff --cached --quiet; then
            echo "::error::Emergency publisher produced no changes."
            exit 1
          fi
          git commit -m "chore(news): publish emergency PL and EN headlines"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
              git rebase origin/main
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not push emergency news after 5 attempts."
          exit 1

      - name: Verify production marker
        run: |
          python scripts/publish_emergency_news.py \
            --verify \
            --marker "${{ steps.build.outputs.marker }}" \
            --base-url https://briefrooms.com
