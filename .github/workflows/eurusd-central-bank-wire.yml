name: EURUSD Fed ECB Wire SHADOW

on:
  workflow_dispatch:
  schedule:
    # Entire weekday: includes Fed/ECB statement, conference and both DST gaps.
    # GitHub cron can be delayed; this is polling, never live speech streaming.
    - cron: "3-58/5 * * * 1-5"
  pull_request:
    paths:
      - "scripts/eurusd*cb*"
      - "scripts/eurusd_central_bank*"
      - "scripts/publish_eurusd_cb_wire.py"
      - "scripts/daily_eurusd*"
      - "scripts/update_weekly_live_prices_fast.py"
      - "scripts/investments_weekly_v5.py"
      - "scripts/eurusd-cb-risk-public.js"
      - "workers/eurusd-cb-wire/**"
      - "docs/EURUSD*"
      - "tests/test_eurusd*"
      - "tests/test_daily_eurusd*"
      - "data/investments/eurusd_cb_risk_policy.json"
      - ".github/workflows/eurusd-central-bank-wire.yml"
  push:
    branches: [main]
    paths:
      - "scripts/eurusd*cb*"
      - "scripts/eurusd_central_bank*"
      - "scripts/publish_eurusd_cb_wire.py"
      - "scripts/eurusd-cb-risk-public.js"
      - "workers/eurusd-cb-wire/**"
      - "docs/EURUSD*"
      - "tests/test_eurusd_cb*"
      - "data/investments/eurusd_cb_risk_policy.json"
      - ".github/workflows/eurusd-central-bank-wire.yml"

permissions:
  contents: read

concurrency:
  group: eurusd-cb-wire-${{ github.event_name == 'pull_request' && github.ref || 'canonical' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install requests pandas numpy yfinance
      - name: Verify shared facts, engine adapters and immutable lifecycle
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          python -m unittest discover -s tests -p 'test_eurusd_cb*.py' -v
          python -m unittest tests.test_eurusd_central_bank_wire tests.test_eurusd_weekly_cb_event_adapter tests.test_eurusd_daily_cb_event_adapter -v
          python -m unittest tests.test_daily_eurusd_belief_first tests.test_daily_eurusd_lifecycle tests.test_daily_eurusd_macro_fast tests.test_daily_eurusd_macro_event_risk tests.test_daily_eurusd_fast_lifecycle tests.test_daily_eurusd_persistence tests.test_daily_eurusd_production_record tests.test_daily_eurusd_production_policy_integration tests.test_daily_eurusd_execution_cost_integration tests.test_audit_intraday_risk_exits tests.test_investments_weekly_v5 tests.test_no_retroactive_execution tests.test_wes_v5_history_seal tests.test_execution_price_engine -v
          python scripts/validate_architecture_bootstrap.py
          node --check scripts/eurusd-cb-risk-public.js
          node --test tests/test_eurusd_cb_risk_public.js tests/test_eurusd_cb_wire_worker.js tests/test_investments_weekly_public.js

  collect:
    # Poll on schedule independently of heavy PR/commit validation; on a
    # relevant main push run once to bootstrap/recover source collection.
    # This job never executes a trading engine or writes a trade.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Collect official wire without executing either trading engine
        id: wire
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          set +e
          python scripts/eurusd_central_bank_wire.py --output data/investments/eurusd_central_bank_wire.json
          result=$?
          if [ "$result" != 0 ] && [ "$result" != 2 ]; then exit "$result"; fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: Publish only shared wire and immutable receipt with optimistic concurrency
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
          GH_TOKEN: ${{ github.token }}
        run: |
          # Consumer audit is optional; its failure cannot take down the wire.
          if python scripts/eurusd_cb_shadow_observe.py --output "$RUNNER_TEMP/eurusd-daily-cb-risk.json"; then
            python scripts/publish_eurusd_cb_wire.py --daily-risk "$RUNNER_TEMP/eurusd-daily-cb-risk.json" || python scripts/publish_eurusd_cb_wire.py
          else
            echo "RECOVERY_REQUIRED: Daily observation unavailable; preserving shared wire"
            python scripts/publish_eurusd_cb_wire.py
          fi
      - name: Retain source health and latency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-cb-wire-${{ github.run_id }}
          path: |
            data/investments/eurusd_central_bank_wire.json
            data/investments/eurusd_cb_wire_journal/
          retention-days: 30
      - name: Signal source outage after preserving the audit
        if: steps.wire.outputs.result == '2'
        run: exit 1
