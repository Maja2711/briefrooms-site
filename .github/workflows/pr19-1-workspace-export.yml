name: PR19.1 Semantic Validation

on:
  push:
    branches:
      - agent/entity-semantic-eligibility-pr19-1
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile semantic hardening modules
        id: compile
        continue-on-error: true
        run: |
          PYTHONPATH=scripts:. python -m py_compile \
            scripts/entity_semantic_eligibility.py \
            scripts/brace_company_entity_framework.py \
            scripts/brace_entity_evidence_interpretation_semantic.py \
            scripts/brace_entity_belief_state_forecast_semantic.py \
            scripts/brace_entity_calibration_diagnostics_semantic.py \
            scripts/investment_semantics_world_state_semantic.py \
            scripts/brace_entity_belief_shadow_bridge_semantic.py \
            scripts/belief_epistemic_causal_graph_semantic.py
      - name: Run focused semantic migration tests
        id: tests
        continue-on-error: true
        run: PYTHONPATH=scripts:. python -m unittest tests.test_entity_semantic_eligibility -v
      - name: Publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          state=success
          description="PR19.1 semantic validation passed"
          if [ "$COMPILE_OUTCOME" != "success" ] || [ "$TEST_OUTCOME" != "success" ]; then
            state=failure
            description="PR19.1 semantic validation failed"
          fi
          python - "$state" "$description" <<'PY'
          import json, os, sys, urllib.request
          state, description = sys.argv[1:3]
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}"
          payload = json.dumps({
              "state": state,
              "context": "pr19.1/semantic-tests",
              "description": description,
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions",
          }).encode()
          req = urllib.request.Request(url, data=payload, method="POST", headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              print(response.status)
          PY
          test "$state" = success
