name: Seal Current WES Pending Decision

on:
  push:
    branches: [main]
    paths:
      - "scripts/migrate_wes_pending_decisions.py"
      - "scripts/wes_decision_ledger.py"
      - "data/investments/wes_decision_ledger.json"
      - ".github/workflows/wes-decision-ledger-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investment-weekly-positions
  cancel-in-progress: false

jobs:
  seal-current-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Seal active legacy pending decisions without changing economics
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          set -euo pipefail
          python -m py_compile scripts/wes_decision_ledger.py scripts/migrate_wes_pending_decisions.py
          python scripts/migrate_wes_pending_decisions.py
          python scripts/migrate_wes_pending_decisions.py --check

      - name: Persist migration atomically
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/wes_decision_ledger.json data/investments/weekly
          if git diff --cached --quiet; then
            echo "No active legacy WES pending decision to seal."
            exit 0
          fi
          python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD
          git commit -m "Seal current WES pending decision"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main; then
              python scripts/migrate_wes_pending_decisions.py --check
              if git push origin HEAD:main; then
                exit 0
              fi
            fi
            git rebase --abort || true
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 3))
          done
