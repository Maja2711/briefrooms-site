name: Fix BRACE Executed Sale UI

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: fix-brace-executed-sale-ui
  cancel-in-progress: false

jobs:
  apply-fix:
    if: github.event.issue.title == 'Fix BRACE executed sale UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconcile executed sale in BRACE public state and UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # 1. Public publisher: completed orders are no longer pending/current positions.
          path = root / 'scripts/brace_portfolio_user_control.py'
          text = path.read_text(encoding='utf-8')
          old = 'PAPER = ENGINE_DATA_ROOT / "paper_portfolio.json"\nANALYSIS = ENGINE_DATA_ROOT / "analysis.json"'
          new = 'PAPER = ENGINE_DATA_ROOT / "paper_portfolio.json"\nORDERS = ENGINE_DATA_ROOT / "paper_orders.json"\nANALYSIS = ENGINE_DATA_ROOT / "analysis.json"'
          assert old in text
          text = text.replace(old, new, 1)
          old = '''    snapshot["control_authorization"] = deepcopy(dict(auth))
    snapshot["position_recommendations"] = deepcopy((pending.get("recommendations") or [])[:20])
    snapshot["learning_loop"] = learning_public_state()
'''
          new = '''    orders = read_json(ORDERS)
    paper = read_json(PAPER)
    executed_orders = [
        order for order in (orders.get("orders") or [])
        if order.get("status") == "PAPER_EXECUTED"
    ]
    executed_decision_ids = {str(order.get("decision_id") or "") for order in executed_orders}
    executed_instruments = {str(order.get("sell_instrument") or "") for order in executed_orders}
    active_instruments = {
        str(position.get("id") or "")
        for position in (paper.get("positions") or [])
        if position.get("status") == "active"
    }
    snapshot["pending_decisions"] = [
        deepcopy(decision) for decision in (snapshot.get("pending_decisions") or [])
        if str(decision.get("decision_id") or "") not in executed_decision_ids
    ]
    snapshot["completed_decisions"] = [
        {
            "decision_id": order.get("decision_id"),
            "action": order.get("action"),
            "instrument": order.get("sell_instrument"),
            "confidence": order.get("confidence"),
            "rationale_pl": order.get("rationale_pl"),
            "rationale_en": order.get("rationale_en"),
            "status": order.get("status"),
            "executed_at": order.get("executed_at"),
            "execution": deepcopy(order.get("execution") or {}),
            "order_id": order.get("order_id"),
        }
        for order in executed_orders
    ]
    snapshot["control_authorization"] = deepcopy(dict(auth))
    snapshot["position_recommendations"] = [
        deepcopy(recommendation)
        for recommendation in (pending.get("recommendations") or [])
        if str(recommendation.get("instrument") or "") in active_instruments
        and str(recommendation.get("instrument") or "") not in executed_instruments
    ][:20]
    snapshot["learning_loop"] = learning_public_state()
'''
          assert old in text
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 2. Bilingual overlay: show completed sale and remove stale current-position cards.
          path = root / 'scripts/portfolio-10k-decision-overlay.js'
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "  const lang = window.BR_PORTFOLIO_10K?.lang === 'en' ? 'en' : 'pl';\n",
              "  const lang = window.BR_PORTFOLIO_10K?.lang === 'en' ? 'en' : 'pl';\n  const locale = lang === 'en' ? 'en-US' : 'pl-PL';\n",
              1,
          )
          text = text.replace(
              "    tableExit: 'PLANOWANA SPRZEDAŻ',\n",
              "    tableExit: 'PLANOWANA SPRZEDAŻ',\n    tableCompleted: 'SPRZEDAŻ ZREALIZOWANA',\n    noPending: 'Brak decyzji oczekujących na wykonanie.',\n    completedPrefix: 'Pozycja została sprzedana w portfelu modelowym',\n    completedAt: 'Realizacja',\n    completedPrice: 'cena',\n",
              1,
          )
          text = text.replace(
              "    tableExit: 'SELL PLANNED',\n",
              "    tableExit: 'SELL PLANNED',\n    tableCompleted: 'SALE COMPLETED',\n    noPending: 'No decisions are awaiting execution.',\n    completedPrefix: 'The position was sold in the model portfolio',\n    completedAt: 'Executed',\n    completedPrice: 'price',\n",
              1,
          )
          old = '''    for (const decision of publicState?.pending_decisions || []) {
      if (!['EXIT', 'REDUCE', 'REPLACE', 'ADD'].includes(String(decision.action || ''))) continue;
'''
          new = '''    const sourceDecisions = [
      ...(publicState?.pending_decisions || []),
      ...(publicState?.completed_decisions || []),
    ];
    for (const decision of sourceDecisions) {
      if (!['EXIT', 'REDUCE', 'REPLACE', 'ADD'].includes(String(decision.action || ''))) continue;
'''
          assert old in text
          text = text.replace(old, new, 1)
          marker = '''  function currentPlan(decision) {
'''
          helper = '''  function isExecuted(decision) {
    return decision?.order?.status === 'PAPER_EXECUTED' || decision?.status === 'PAPER_EXECUTED';
  }

  function executionSummary(decision) {
    const order = decision?.order || decision || {};
    const symbol = symbolFor(decision?.instrument);
    const parts = [`${COPY.completedPrefix}: ${symbol}.`];
    const executedAt = order.executed_at || decision?.executed_at;
    if (executedAt) {
      const date = new Date(executedAt);
      if (!Number.isNaN(date.valueOf())) parts.push(`${COPY.completedAt}: ${date.toLocaleString(locale)}.`);
    }
    const price = Number(order.execution?.price ?? decision?.execution?.price);
    if (Number.isFinite(price)) parts.push(`${COPY.completedPrice}: ${price.toLocaleString(locale, {maximumFractionDigits: 4})}.`);
    return parts.join(' ');
  }

'''
          assert marker in text
          text = text.replace(marker, helper + marker, 1)

          start = text.index('  function applyLatestDecision(decisions) {')
          end = text.index('\n  function applyAll(decisions) {', start)
          replacement = '''  function applyLatestDecision(decisions) {
    const root = document.getElementById('brace-decisions');
    if (!root) return false;
    const exit = [...decisions.values()].find(item => item.action === 'EXIT');
    if (!exit) return false;
    const executed = isExecuted(exit);
    const symbol = symbolFor(exit.instrument);
    const id = `${executed ? 'executed' : 'pending'}-${exit.decision_id}`;
    for (const existing of root.querySelectorAll('[data-current-decision]')) {
      if (existing.dataset.currentDecision?.endsWith(String(exit.decision_id)) && existing.dataset.currentDecision !== id) existing.remove();
    }
    let row = root.querySelector(`[data-current-decision="${id}"]`);
    if (row) return false;
    row = document.createElement('div');
    row.className = `decision-row ${executed ? 'completed-exit-decision' : 'current-exit-decision'}`;
    row.dataset.currentDecision = id;
    const label = executed ? COPY.tableCompleted : COPY.tableExit;
    const detail = executed
      ? executionSummary(exit)
      : ((lang === 'pl' ? exit.rationale_pl : exit.rationale_en) || '');
    row.innerHTML = `<span class="signal EXIT ${executed ? 'execution-complete' : ''}">${esc(label)}</span><span><strong>${esc(symbol)}</strong><br><small>${esc(detail)}</small></span><b>${Math.round(Number(exit.confidence || 0) * 100)}%</b>`;
    root.prepend(row);
    return true;
  }

  function applyCompletedState(decisions) {
    let changed = false;
    for (const [instrument, decision] of decisions) {
      if (!isExecuted(decision)) continue;
      const symbol = symbolFor(instrument);
      const braceRoot = document.getElementById('brace-positions');
      for (const card of braceRoot?.querySelectorAll('.brace-position') || []) {
        if (card.querySelector('.symbol')?.textContent?.trim() === symbol) {
          card.remove();
          changed = true;
        }
      }
      const controlRoot = document.getElementById('brace-control-root');
      for (const card of controlRoot?.querySelectorAll('.control-recommendations .recommendation') || []) {
        if (card.querySelector('b')?.textContent?.trim() === symbol) {
          card.remove();
          changed = true;
        }
      }
      const pendingSection = controlRoot?.querySelector('.control-columns > section:nth-child(3)');
      for (const row of pendingSection?.querySelectorAll('.control-list article') || []) {
        const content = row.textContent.toLowerCase();
        if (content.includes(String(instrument).toLowerCase()) || content.includes(symbol.toLowerCase())) {
          row.remove();
          changed = true;
        }
      }
      const pendingList = pendingSection?.querySelector('.control-list');
      if (pendingList && !pendingList.children.length) {
        pendingList.outerHTML = `<p class="brace-empty">${esc(COPY.noPending)}</p>`;
        changed = true;
      }
    }
    return changed;
  }
'''
          text = text[:start] + replacement + text[end:]
          old = '''  function applyAll(decisions) {
    applyPortfolioTable(decisions);
    applyAnalyticsCards(decisions);
    applyMaterialReportLabels(decisions);
    applyLatestDecision(decisions);
  }
'''
          new = '''  function applyAll(decisions) {
    const actionable = new Map([...decisions].filter(([, decision]) => !isExecuted(decision)));
    applyPortfolioTable(actionable);
    applyAnalyticsCards(actionable);
    applyMaterialReportLabels(actionable);
    applyLatestDecision(decisions);
    applyCompletedState(decisions);
  }
'''
          assert old in text
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 3. Cache-bust only the changed overlay in the PL and EN portfolio rooms.
          patcher = root / 'scripts/patch_portfolio_10k_hourly_ui.py'
          text = patcher.read_text(encoding='utf-8')
          text = text.replace('portfolio-10k-decision-overlay.js?v=2', 'portfolio-10k-decision-overlay.js?v=3')
          patcher.write_text(text, encoding='utf-8')
          for page in [root / 'pl/inwestycje/portfel-10k.html', root / 'en/investing/portfolio-10k.html']:
            html = page.read_text(encoding='utf-8')
            html = re.sub(r'portfolio-10k-decision-overlay\.js\?v=\d+', 'portfolio-10k-decision-overlay.js?v=3', html)
            page.write_text(html, encoding='utf-8')
          PY

      - name: Republish reconciled BRACE public state
        run: python scripts/brace_portfolio_user_control.py --republish

      - name: Validate targeted change
        run: |
          node --check scripts/portfolio-10k-decision-overlay.js
          python -m py_compile scripts/brace_portfolio_user_control.py scripts/patch_portfolio_10k_hourly_ui.py
          python - <<'PY'
          import json
          from pathlib import Path
          public = json.loads(Path('data/portfolio10k/public/brace_engine_public.json').read_text())
          assert not any(d.get('instrument') == 'novo' for d in public.get('pending_decisions', []))
          completed = [d for d in public.get('completed_decisions', []) if d.get('instrument') == 'novo']
          assert completed and completed[0].get('status') == 'PAPER_EXECUTED'
          assert not any(r.get('instrument') == 'novo' for r in public.get('position_recommendations', []))
          overlay = Path('scripts/portfolio-10k-decision-overlay.js').read_text()
          assert 'SPRZEDAŻ ZREALIZOWANA' in overlay and 'SALE COMPLETED' in overlay
          assert 'applyCompletedState' in overlay
          for page in [Path('pl/inwestycje/portfel-10k.html'), Path('en/investing/portfolio-10k.html')]:
              assert 'portfolio-10k-decision-overlay.js?v=3' in page.read_text()
          print('Executed Novo sale is reconciled in PL and EN UI state.')
          PY

      - name: Commit targeted fix and remove one-time workflow
        run: |
          rm .github/workflows/fix-brace-executed-sale-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/brace_portfolio_user_control.py \
                  scripts/portfolio-10k-decision-overlay.js \
                  scripts/patch_portfolio_10k_hourly_ui.py \
                  data/portfolio10k/public/brace_engine_public.json \
                  pl/inwestycje/portfel-10k.html \
                  en/investing/portfolio-10k.html \
                  .github/workflows/fix-brace-executed-sale-ui.yml
          git commit -m "Show completed Novo sale across BRACE views"
          git pull --rebase origin main
          git push origin main

      - name: Close trigger issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Applied and validated: Novo is shown as a completed paper sale, removed from current-position assessments, and no longer listed as awaiting execution in PL or EN.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
