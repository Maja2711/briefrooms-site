name: Temporary Taste Skill smoke
on:
  push:
    branches:
      - chore/taste-skill-briefrooms-20261021
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate vendored scripts and data
        shell: bash
        run: |
          set -euo pipefail
          dir=.agents/skills/design-taste-frontend
          count="$(find "$dir" -type f | wc -l)"
          test "$count" -eq 38
          find "$dir/scripts" -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node --input-type=module -e "import{readdirSync,readFileSync}from'node:fs';for(const f of readdirSync('$dir/library'))if(f.endsWith('.json'))JSON.parse(readFileSync('$dir/library/'+f,'utf8'));console.log('All JSON valid')"
          node "$dir/scripts/draw.mjs" --list sectors > /tmp/taste-sectors.log
          node "$dir/scripts/draw.mjs" --list roles > /tmp/taste-roles.log
          test -s /tmp/taste-sectors.log
          test -s /tmp/taste-roles.log
      - name: Browser inspector smoke (reports may contain aesthetic findings)
        shell: bash
        run: |
          set -euo pipefail
          dir=.agents/skills/design-taste-frontend
          command -v google-chrome || command -v chromium || command -v chromium-browser
          mkdir -p .taste-skill
          cat > .taste-skill/smoke.html <<'HTML'
          <!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BriefRooms Taste smoke fixture</title></head><body><header><h1>BriefRooms</h1><p>Test narzędzia, nie ocena projektu.</p></header><main><section><h2>Test</h2><p>Content used to verify the inspector runs in Chrome.</p></section></main></body></html>
          HTML
          set +e
          timeout 90s node "$dir/scripts/inspect.mjs" .taste-skill/smoke.html --out .taste-skill/inspect-smoke --widths 1440,768,390 --json > /tmp/taste-inspect.log 2>&1
          rc=$?
          set -e
          cat /tmp/taste-inspect.log | tail -n 30
          if [ "$rc" -gt 1 ]; then echo "Inspector crash/timeout: $rc"; exit 1; fi
          node --input-type=module -e "import{readFileSync}from'node:fs';let r=JSON.parse(readFileSync('.taste-skill/inspect-smoke/report.json'));if(r.viewports?.length!==3)process.exit(1);console.log('Inspector OK, viewports:',r.viewports.length,'design findings:',r.findings?.length)"
      - name: Baseline real PL and EN pages in local browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/taste-local-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 3
          for lang in pl en; do
            set +e
            timeout 120s node .agents/skills/design-taste-frontend/scripts/inspect.mjs "http://127.0.0.1:8000/$lang/" --out ".taste-skill/inspect-$lang" --widths 1440,768,390 --json > "/tmp/taste-inspect-$lang.log" 2>&1
            rc=$?
            set -e
            if [ "$rc" -gt 1 ]; then
              echo "$lang inspector failed with code $rc"
              tail -n 45 "/tmp/taste-inspect-$lang.log"
              exit 1
            fi
            LANG_TO_CHECK="$lang" node --input-type=module -e "import{readFileSync}from'node:fs';let l=process.env.LANG_TO_CHECK;let r=JSON.parse(readFileSync('.taste-skill/inspect-'+l+'/report.json'));if(r.viewports?.length!==3)process.exit(1);console.log(l+': 3 viewports, '+(r.findings?.length||0)+' existing design findings (not a test failure)')"
          done
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taste-smoke
          path: |
            .taste-skill/inspect-smoke/
            /tmp/taste-inspect.log
          if-no-files-found: ignore
          retention-days: 3
