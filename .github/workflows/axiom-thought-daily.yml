name: Morning AXIOM Daily

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. Two runs make publication robust across CET/CEST;
    # the publisher is idempotent and exits if Warsaw's date is already present.
    - cron: "10 4 * * *"
    - cron: "10 5 * * *"

permissions:
  contents: write

concurrency:
  group: morning-axiom-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AXIOM_THOUGHT_MODEL: gemini-3.5-flash
      AXIOM_THOUGHT_FALLBACK_MODEL: gemini-3.5-flash-lite\n      AXIOM_THOUGHT_MAX_ATTEMPTS: "10"\n      AXIOM_THOUGHT_RESERVE_TARGET: "10"
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: pip install requests

      - name: Generate and quality-gate Morning AXIOM
        run: python scripts/publish_axiom_thought.py

      - name: Commit publication when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/home/axiom-thought.json data/home/axiom-thoughts-history.jsonl data/home/axiom-thought-reserve.json; then
            echo "No publication change required."
            exit 0
          fi
          python scripts/axiom_thought_guard.py
          git config user.name "briefrooms-bot"
          git config user.email "briefrooms-bot@users.noreply.github.com"
          git add data/home/axiom-thought.json data/home/axiom-thoughts-history.jsonl data/home/axiom-thought-reserve.json
          git commit -m "content: publish Morning AXIOM $(TZ=Europe/Warsaw date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
