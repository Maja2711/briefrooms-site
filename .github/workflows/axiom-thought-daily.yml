name: Morning AXIOM Daily

on:
  workflow_dispatch:
  # Independent completed workflows act as a recovery clock when GitHub skips
  # all cron slots for this workflow. Neither workflow receives AXIOM write access.
  workflow_run:
    workflows:
      - "Production Investment Event Intelligence"
      - "BRs R2 Shadow Archive Pilot"
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/axiom-thought-daily.yml"
      - "scripts/publish_axiom_thought.py"
      - "scripts/axiom_thought_guard.py"
      - "data/home/axiom-thought-reserve.json"
      - "tests/test_axiom_thought_guard.py"
  schedule:
    # Stagger away from :00/:30, where GitHub scheduled workflows are most prone
    # to queueing. Publisher is idempotent by Warsaw date, so recovery windows
    # are safe. 03:07 UTC is 05:07 Warsaw in CEST and 04:07 in CET.
    - cron: "7 3 * * *"
    - cron: "23 3 * * *"
    - cron: "41 3 * * *"
    - cron: "7 4 * * *"
    - cron: "29 4 * * *"
    - cron: "53 4 * * *"
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  # One publisher at a time across schedule, dispatch, push and recovery.
  group: morning-axiom-daily
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.publication_change.outputs.changed }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AXIOM_THOUGHT_MODEL: gemini-3.6-flash
      AXIOM_THOUGHT_FALLBACK_MODEL: gemini-3.5-flash-lite
      AXIOM_THOUGHT_MAX_ATTEMPTS: "12"
      AXIOM_THOUGHT_RESERVE_TARGET: "10"
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - name: Publish from reserve or generate live
        run: python scripts/publish_axiom_thought.py --mode publish
      - name: Verify today's publication
        run: python scripts/publish_axiom_thought.py --mode verify
      - name: Report whether a new day was published
        id: publication_change
        shell: bash
        run: |
          if git diff --quiet -- data/home/axiom-thought.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Persist scheduler heartbeat
        shell: bash
        run: |
          # Avoid a new commit for every recovery event after today's publication.
          if git diff --quiet -- data/home/axiom-thought.json; then
            echo 'AXIOM unchanged; heartbeat remains attached to publication'
            exit 0
          fi
          printf '{"date":"%s","event":"%s","run_id":"%s","sha":"%s"}\\n' "$(TZ=Europe/Warsaw date +%F)" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" "$GITHUB_SHA" > data/home/axiom-thought-heartbeat.json
      - name: Commit publication atomically
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/home/axiom-thought.json data/home/axiom-thoughts-history.jsonl data/home/axiom-thought-reserve.json data/home/axiom-thought-heartbeat.json; then exit 0; fi
          git config user.name "briefrooms-bot"
          git config user.email "briefrooms-bot@users.noreply.github.com"
          git add data/home/axiom-thought.json data/home/axiom-thoughts-history.jsonl data/home/axiom-thought-reserve.json data/home/axiom-thought-heartbeat.json
          git commit -m "content: publish Morning AXIOM $(TZ=Europe/Warsaw date +%F)"
          for n in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((n*5))
          done
          exit 1

  reserve:
    needs: publish
    # Refill must never block deployment of a successfully published thought.
    # Recovery runs only publish; they must not repeatedly call costly AI refill.
    if: needs.publish.result == 'success' && (needs.publish.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AXIOM_THOUGHT_MODEL: gemini-3.6-flash
      AXIOM_THOUGHT_FALLBACK_MODEL: gemini-3.5-flash-lite
      AXIOM_THOUGHT_MAX_ATTEMPTS: "12"
      AXIOM_THOUGHT_RESERVE_TARGET: "10"
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - name: Build independent validated reserve
        run: python scripts/publish_axiom_thought.py --mode refill
      - name: Commit reserve independently
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/home/axiom-thought-reserve.json; then exit 0; fi
          git config user.name "briefrooms-bot"
          git config user.email "briefrooms-bot@users.noreply.github.com"
          git add data/home/axiom-thought-reserve.json
          git commit -m "content: refill Morning AXIOM reserve"
          for n in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((n*5))
          done
          exit 1

  semantic-smoke:
    # Read-only live API health is advisory: it may raise an alarm, but must not
    # block Pages deployment after the publisher itself has passed its guard.
    continue-on-error: true
    # Runs on authorized main pushes and manual dispatch; never on untrusted PRs.
    # Read-only and independent of publication or history mutation.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AXIOM_THOUGHT_MODEL: gemini-3.6-flash
      AXIOM_THOUGHT_FALLBACK_MODEL: gemini-3.5-flash-lite
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - name: Live semantic veto E2E (no writes)
        run: python scripts/publish_axiom_thought.py --mode smoke
