name: Stock Trading Fixed Notional Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/stock-trading-fixed-notional-validation.yml"
      - ".github/workflows/stock-trading-v2-production.yml"
      - "data/investments/stock_trading_policy.json"
      - "data/investments/stock_trading_portfolio.json"
      - "assets/stock-trading-room.css"
      - "assets/stock-trading-ticket-fixes-v2.css"
      - "scripts/stock_trading_portfolio.py"
      - "scripts/stock_trading_quote_enricher.py"
      - "scripts/audit_stock_trading_ui.py"
      - "scripts/stock_trading_v2_production_bridge.py"
      - "scripts/stock-trading-public.js"
      - "tests/test_stock_trading_portfolio.py"
      - "tests/test_stock_trading_quote_enricher.py"
      - "tests/test_stock_trading_quote_enricher.py"
      - "tests/test_stock_trading_v2_production_bridge.py"
      - "docs/ARCHITECTURE_MAP_EN.md"
      - "docs/ARCHITECTURE_MAP_PL.md"
      - "docs/STOCK_TRADING_FIXED_NOTIONAL_EN.md"
      - "docs/STOCK_TRADING_FIXED_NOTIONAL_PL.md"
      - "pl/inwestycje/stock-trading.html"
      - "en/investing/stock-trading.html"
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock-trading-fixed-notional-validation.yml"
      - "data/investments/stock_trading_policy.json"
      - "data/investments/stock_trading_portfolio.json"
      - "assets/stock-trading-room.css"
      - "assets/stock-trading-ticket-fixes-v2.css"
      - "scripts/stock_trading_portfolio.py"
      - "scripts/stock_trading_quote_enricher.py"
      - "scripts/audit_stock_trading_ui.py"
      - "scripts/stock-trading-public.js"
      - "tests/test_stock_trading_portfolio.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile fixed-notional runtime
        run: |
          python -m py_compile             scripts/stock_trading_portfolio.py             scripts/stock_trading_quote_enricher.py             scripts/stock_trading_v2_production_bridge.py             scripts/audit_stock_trading_ui.py             tests/test_stock_trading_portfolio.py             tests/test_stock_trading_quote_enricher.py             tests/test_stock_trading_v2_production_bridge.py
          node --check scripts/stock-trading-public.js

      - name: Validate policy contract
        run: |
          python -m json.tool data/investments/stock_trading_policy.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("data/investments/stock_trading_policy.json").read_text(encoding="utf-8"))
          expected = {"GPW": "PLN", "US": "USD"}
          for market, currency in expected.items():
              cfg = p["markets"][market]
              assert cfg["target_position_notional"] == 5000
              assert cfg["position_currency"] == currency
              assert cfg["fractional_quantity_allowed"] is True
              assert cfg["quantity_precision"] == 8
              assert cfg["sizing_policy_version"] == "FIXED_NOTIONAL_V1"
          print("FIXED_NOTIONAL_POLICY_OK")
          PY

      - name: Validate normalized 5K trade history
        run: |
          python -m json.tool data/investments/stock_trading_portfolio.json >/dev/null
          python scripts/stock_trading_portfolio.py --mode verify
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("data/investments/stock_trading_portfolio.json").read_text(encoding="utf-8"))
          expected = {"GPW": "PLN", "US": "USD"}
          for market, currency in expected.items():
              for row in p["markets"][market].get("closed_positions", []):
                  assert row["history_normalization_version"] == "FIXED_NOTIONAL_HISTORY_V1"
                  assert row["history_position_currency"] == currency
                  assert row["history_target_position_notional"] == 5000
                  q = float(row["history_normalized_quantity"])
                  entry = float(row["entry"])
                  exit_price = float(row["exit_price"])
                  pnl = float(row["history_normalized_pnl_amount"])
                  assert abs(entry * q - 5000.0) <= 0.05
                  assert abs((exit_price - entry) * q - pnl) <= 0.02
          print("FIXED_5K_HISTORY_OK")
          PY

      - name: Run targeted Stock Trading tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest             tests.test_stock_trading_portfolio             tests.test_stock_trading_quote_enricher             tests.test_stock_trading_v2_production_bridge -v

      - name: Install Chromium for laptop UI audit
        run: |
          python -m pip install playwright==1.54.0
          python -m playwright install chromium

      - name: Validate Stock Trading laptop layouts
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/stock-trading-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/pl/inwestycje/stock-trading.html >/dev/null; then
              break
            fi
            sleep 1
          done
          python -u scripts/audit_stock_trading_ui.py

      - name: Upload Stock Trading UI evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stock-trading-ui-audit
          path: |
            data/internal/stock_trading_ui_audit.json
            data/internal/stock_trading_ui_screenshots/*.png
          if-no-files-found: error
