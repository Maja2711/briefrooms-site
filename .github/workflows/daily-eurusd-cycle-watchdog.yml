name: Daily EURUSD Cycle Watchdog

on:
  pull_request:
    paths:
      - "scripts/daily_eurusd_cycle_watchdog.py"
      - "scripts/daily_eurusd_decision_record.py"
      - "tests/test_daily_eurusd_cycle_watchdog.py"
      - ".github/workflows/daily-eurusd-cycle-watchdog.yml"
  workflow_dispatch:
  schedule:
    # GitHub cron is a fallback only. The independent Cloudflare heartbeat
    # dispatches this same watchdog every five minutes.
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/daily_eurusd_cycle_watchdog.py"
      - "scripts/daily_eurusd_decision_record.py"
      - "tests/test_daily_eurusd_cycle_watchdog.py"
      - ".github/workflows/daily-eurusd-cycle-watchdog.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: daily-eurusd-cycle-watchdog
  cancel-in-progress: false

jobs:
  validate-watchdog:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Daily EURUSD liveness guard
        run: |
          set -euo pipefail
          python -m py_compile scripts/daily_eurusd_cycle_watchdog.py
          python -m unittest tests/test_daily_eurusd_cycle_watchdog.py -v

  monitor-daily-eurusd-cycle:
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate guard before live check
        run: |
          set -euo pipefail
          python -m py_compile scripts/daily_eurusd_cycle_watchdog.py
          python -m unittest tests/test_daily_eurusd_cycle_watchdog.py -v

      - name: Inspect Belief and Epistemic runtime artifacts
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/daily-eurusd-readiness.json

          latest_artifact() {
            local name="$1"
            local target="$2"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" \
              -o "$target"
          }

          latest_artifact "belief-core-shadow-state" /tmp/belief-artifacts.json
          latest_artifact "belief-epistemic-state" /tmp/epistemic-artifacts.json

          python - <<'PY'
          import json, os
          from pathlib import Path

          def latest(path):
              rows=json.loads(Path(path).read_text()).get("artifacts", [])
              rows=[x for x in rows if not x.get("expired")]
              rows.sort(key=lambda x: x.get("created_at", ""), reverse=True)
              return rows[0] if rows else {}

          belief=latest("/tmp/belief-artifacts.json")
          epistemic=latest("/tmp/epistemic-artifacts.json")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as h:
              h.write(f"belief_created_at={belief.get('created_at','')}\n")
              h.write(f"belief_artifact_id={belief.get('id','')}\n")
              h.write(f"epistemic_created_at={epistemic.get('created_at','')}\n")
              h.write(f"epistemic_artifact_id={epistemic.get('id','')}\n")
          print("BELIEF_ARTIFACT", belief.get("id"), belief.get("created_at"))
          print("EPISTEMIC_ARTIFACT", epistemic.get("id"), epistemic.get("created_at"))
          PY

          epistemic_id="$(python -c 'import json; from pathlib import Path; rows=[x for x in json.loads(Path("/tmp/epistemic-artifacts.json").read_text()).get("artifacts",[]) if not x.get("expired")]; rows.sort(key=lambda x:x.get("created_at",""), reverse=True); print(rows[0].get("id","") if rows else "")')"
          if [ -n "$epistemic_id" ]; then
            mkdir -p /tmp/daily-epistemic-artifact /tmp/daily-epistemic-state
            curl -fsSL -L \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${epistemic_id}/zip" \
              -o /tmp/daily-epistemic.zip
            unzip -q /tmp/daily-epistemic.zip -d /tmp/daily-epistemic-artifact
            if [ -f /tmp/daily-epistemic-artifact/belief-epistemic-state.tgz ]; then
              tar -xzf /tmp/daily-epistemic-artifact/belief-epistemic-state.tgz -C /tmp/daily-epistemic-state
              if [ -s /tmp/daily-epistemic-state/daily_eurusd_readiness.json ]; then
                cp /tmp/daily-epistemic-state/daily_eurusd_readiness.json /tmp/daily-eurusd-readiness.json
              fi
            fi
          fi

      - name: Inspect actual recent Belief Epistemic Daily workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          base="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          result={"schema_version":"daily-eurusd-workflow-health-v1","workflows":{},"errors":[]}
          for workflow in ("belief-core-shadow-live.yml","belief-epistemic-state.yml","daily-eurusd-monitor.yml"):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+"/actions/workflows/"+workflow+"/runs?branch=main&per_page=12",headers=headers),timeout=15) as response:
                      runs=json.load(response).get("workflow_runs",[])
                  result["workflows"][workflow]=[{key:run.get(key) for key in ("id","event","status","conclusion","created_at","run_started_at","updated_at","html_url")} for run in runs]
              except Exception as exc:
                  result["errors"].append({"workflow":workflow,"error_type":type(exc).__name__})
          with open("/tmp/daily-eurusd-workflow-health.json","w",encoding="utf-8") as output:
              json.dump(result,output)
          print("DAILY_EURUSD_WORKFLOW_HEALTH",{k:[{"id":r.get("id"),"status":r.get("status"),"conclusion":r.get("conclusion")} for r in v[:3]] for k,v in result["workflows"].items()})
          print("DAILY_EURUSD_WORKFLOW_TELEMETRY_ERRORS",result["errors"])
          PY

      - name: Check staged Daily EURUSD pipeline freshness
        id: liveness
        shell: bash
        env:
          BELIEF_CREATED_AT: ${{ steps.upstream.outputs.belief_created_at }}
          EPISTEMIC_CREATED_AT: ${{ steps.upstream.outputs.epistemic_created_at }}
        run: |
          set +e
          args=(
            --mode check
            --pipeline
            --max-age-minutes 15
            --belief-max-age-minutes 30
            --epistemic-max-age-minutes 20
            --belief-created-at "$BELIEF_CREATED_AT"
            --epistemic-created-at "$EPISTEMIC_CREATED_AT"
            --epistemic-readiness /tmp/daily-eurusd-readiness.json
            --workflow-health /tmp/daily-eurusd-workflow-health.json
          )
          python scripts/daily_eurusd_cycle_watchdog.py "${args[@]}" | tee /tmp/daily-eurusd-cycle-watchdog.json
          rc=${PIPESTATUS[0]}
          set -e

          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path("/tmp/daily-eurusd-cycle-watchdog.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as h:
              h.write(f"status={p.get('status','unknown')}\n")
              h.write(f"recovery_stage={p.get('recovery_stage','NONE')}\n")
              h.write(f"stale={'true' if p.get('status') == 'stale' else 'false'}\n")
              h.write(f"daily_sla_breached={'true' if p.get('daily_sla',{}).get('breached') else 'false'}\n")
              h.write(f"daily_sla_incident_class={p.get('daily_sla',{}).get('incident_class','UNKNOWN')}\n")
          print("DAILY_EURUSD_PIPELINE", p.get("status"), p.get("recovery_stage"), p.get("reasons"))
          print("DAILY_EURUSD_HARD_15M_SLA", p.get("daily_sla", {}))
          PY

          # A fresh but epistemically unqualified state is a legitimate no-trade
          # condition, not an infrastructure failure.
          if [ "$rc" -ne 0 ]; then
            echo "Daily EURUSD pipeline requires staged recovery."
          fi

      - name: Dispatch exactly one recovery stage
        if: steps.liveness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_STAGE: ${{ steps.liveness.outputs.recovery_stage }}
        shell: bash
        run: |
          set -euo pipefail
          case "$RECOVERY_STAGE" in
            BELIEF) workflow="belief-core-shadow-live.yml" ;;
            EPISTEMIC) workflow="belief-epistemic-state.yml" ;;
            DAILY) workflow="daily-eurusd-monitor.yml" ;;
            *) echo "No recovery stage selected"; exit 0 ;;
          esac

          active_count() {
            local status="$1"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?status=${status}&per_page=10" \
              | python -c 'import json,sys; print(len(json.load(sys.stdin).get("workflow_runs", [])))'
          }

          running="$(active_count in_progress)"
          queued="$(active_count queued)"
          if [ "$running" -gt 0 ] || [ "$queued" -gt 0 ]; then
            echo "RECOVERY_ALREADY_ACTIVE stage=$RECOVERY_STAGE workflow=$workflow running=$running queued=$queued"
          else
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -d '{"ref":"main"}'
            echo "RECOVERY_DISPATCHED stage=$RECOVERY_STAGE workflow=$workflow"
          fi

          echo "::error::Daily EURUSD pipeline stale at stage $RECOVERY_STAGE. Recovery is staged; downstream runs only after upstream success."
          exit 1

      - name: Report healthy but unqualified Epistemic state
        if: steps.liveness.outputs.status == 'upstream_unqualified'
        run: |
          echo "Daily EURUSD pipeline is alive; Epistemic profile is currently not qualified for a new Daily decision. No recovery loop is created."

      - name: Raise hard Daily EURUSD 15-minute SLA alarm
        if: always() && steps.liveness.outputs.daily_sla_breached == 'true'
        env:
          INCIDENT_CLASS: ${{ steps.liveness.outputs.daily_sla_incident_class }}
        run: |
          echo "::error title=DAILY EURUSD 15M SLA BREACH::Published Daily state exceeded 15 minutes. Incident class=$INCIDENT_CLASS. Check independent pipeline and GitHub workflow health logs."
          exit 1
