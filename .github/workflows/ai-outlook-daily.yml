name: AI Outlook Daily — Gemini

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate today's verified Gemini PL and EN forecasts"
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - "scripts/update_ai_outlook.py"
      - "scripts/update_ai_outlook_v2.py"
      - "scripts/update_ai_outlook_v3.py"
      - "scripts/publish_ai_outlook_gemini.py"
      - "scripts/ai_outlook_engine.py"
      - "scripts/ai_outlook_metrics.py"
      - "scripts/check_ai_provider.py"
      - "scripts/comment_quality.py"
      - "scripts/sitecustomize.py"
      - "scripts/ai-outlook-governance-guard.js"
      - "scripts/ai-outlook-freshness-guard.js"
      - "scripts/homepage-photo-only.js"
      - "scripts/enforce_homepage_photo_only.py"
      - "tests/test_ai_outlook.py"
      - "tests/test_ai_outlook_v3.py"
      - "tests/test_ai_outlook_engine.py"
      - "tests/test_ai_outlook_metrics.py"
      - "tests/test_ai_provider_preflight.py"
      - "tests/test_publish_ai_outlook_gemini.py"
      - "tests/test_homepage_photo_only.py"
      - ".github/workflows/ai-outlook-daily.yml"
  schedule:
    # Main edition: 07:35 CEST / 06:35 CET in Warsaw.
    - cron: "35 5 * * *"
    # Recovery attempts. They are no-ops after a verified Gemini edition exists.
    - cron: "35 7 * * *"
    - cron: "35 9 * * *"
    - cron: "35 11 * * *"

permissions:
  contents: write

concurrency:
  group: ai-outlook-daily-gemini
  cancel-in-progress: false

jobs:
  publish-ai-outlook:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Publish governed and freshness-checked homepage assets
        run: |
          set -euo pipefail
          python scripts/enforce_homepage_photo_only.py
          grep -F '/scripts/ai-outlook-freshness-guard.js?v=daily-v1' pl/index.html
          grep -F '/scripts/ai-outlook-freshness-guard.js?v=daily-v1' en/index.html
          grep -F '/scripts/ai-outlook-governance-guard.js?v=governance-v3' pl/index.html
          grep -F '/scripts/ai-outlook-governance-guard.js?v=governance-v3' en/index.html
          grep -F '/scripts/homepage-photo-only.js?v=ai-outlook-daily-5' pl/index.html
          grep -F '/scripts/homepage-photo-only.js?v=ai-outlook-daily-5' en/index.html

      - name: Validate Gemini-only publication contract
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_ai_outlook \
            tests.test_ai_outlook_v3 \
            tests.test_ai_outlook_engine \
            tests.test_ai_outlook_metrics \
            tests.test_ai_provider_preflight \
            tests.test_publish_ai_outlook_gemini \
            tests.test_homepage_photo_only -v
          python -m py_compile \
            scripts/update_ai_outlook.py \
            scripts/update_ai_outlook_v2.py \
            scripts/update_ai_outlook_v3.py \
            scripts/publish_ai_outlook_gemini.py \
            scripts/ai_outlook_engine.py \
            scripts/ai_outlook_metrics.py \
            scripts/check_ai_provider.py \
            scripts/comment_quality.py \
            scripts/sitecustomize.py \
            scripts/enforce_homepage_photo_only.py
          node --check scripts/homepage-photo-only.js
          node --check scripts/ai-outlook-governance-guard.js
          node --check scripts/ai-outlook-freshness-guard.js
          grep -F 'AI Outlook requires Gemini' scripts/publish_ai_outlook_gemini.py
          grep -F 'generation_mode") != "ai_primary"' scripts/publish_ai_outlook_gemini.py
          grep -F 'String(payload.date || '\''\'') === warsawDateKey' scripts/ai-outlook-freshness-guard.js

      - name: Verify Gemini credentials and endpoint
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_GENERATION_MODEL: gemini-3.5-flash-lite
          GEMINI_REVIEW_MODEL: gemini-3.5-flash-lite
          GEMINI_MIN_INTERVAL_SECONDS: "8"
        run: |
          set -euo pipefail
          python - <<'PY'
          from comment_quality import get_ai_runtime
          from publish_ai_outlook_gemini import require_gemini

          runtime = get_ai_runtime()
          require_gemini(runtime)
          print(
              f"Gemini runtime configured: generation={runtime.generation_model} "
              f"review={runtime.review_model}"
          )
          PY
          python scripts/check_ai_provider.py
          sleep 8

      - name: Generate today's independent PL and EN Gemini editions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_GENERATION_MODEL: gemini-3.5-flash-lite
          GEMINI_REVIEW_MODEL: gemini-3.5-flash-lite
          GEMINI_MIN_INTERVAL_SECONDS: "8"
        shell: bash
        run: |
          set -euo pipefail
          ARGS=""
          if [[ "${{ github.event_name }}" == "push" ]]; then
            ARGS="--force"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]]; then
            ARGS="--force"
          fi
          python scripts/publish_ai_outlook_gemini.py $ARGS
          python scripts/publish_ai_outlook_gemini.py --validate-only --require-today

      - name: Verify Gemini provenance, freshness and language isolation
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          payload = json.loads(Path('data/ai_outlook.json').read_text(encoding='utf-8'))
          status = json.loads(Path('data/ai_outlook_status.json').read_text(encoding='utf-8'))
          provider = json.loads(Path('data/ai_outlook_provider_status.json').read_text(encoding='utf-8'))
          today = datetime.now(ZoneInfo('Europe/Warsaw')).date().isoformat()

          assert payload.get('date') == today
          assert payload.get('schema_version') == 2
          assert payload.get('edition_policy') == 'independent-per-language'
          assert payload.get('generation_mode') == 'ai_primary'
          assert payload.get('ai_provider') == 'gemini'
          assert str(payload.get('ai_model') or '').startswith('gemini-')
          assert status.get('date') == today
          assert status.get('mode') == 'ai_primary'
          assert status.get('provider') == 'gemini'
          assert provider.get('date') == today
          assert provider.get('status') == 'healthy'
          assert provider.get('provider') == 'gemini'
          assert provider.get('publication_mode') == 'ai_primary'

          for language in ('pl', 'en'):
              edition = payload.get(language) or {}
              assert edition.get('source_language') == language
              assert str(edition.get('forecast_id') or '').startswith(today + '-' + language + '-')
              sources = edition.get('sources') or []
              assert sources and all(source.get('source_language') == language for source in sources)

          print(
              'Verified Gemini AI Outlook: '
              f"model={payload['ai_model']} PL={payload['pl']['forecast_id']} "
              f"EN={payload['en']['forecast_id']}"
          )
          PY

      - name: Refresh public calibration counters
        run: |
          python scripts/ai_outlook_metrics.py
          python scripts/ai_outlook_metrics.py --validate-only

      - name: Commit Gemini forecast and status atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pl/index.html en/index.html
          git add data/ai_outlook.json \
                  data/ai_outlook_status.json \
                  data/ai_outlook_provider_status.json \
                  data/ai_outlook_history \
                  data/ai_outlook_metrics.json
          git add data/internal/ai_outlook_audit 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Today's verified Gemini AI Outlook is already current."
          else
            git commit -m "Publish verified daily Gemini AI Outlook"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
                git rebase origin/main
              fi
              if git push origin HEAD:main; then
                break
              fi
              if [[ "$attempt" == "5" ]]; then
                echo "::error::Could not publish Gemini AI Outlook after 5 attempts."
                exit 1
              fi
              sleep $((attempt * 4))
            done
          fi

      - name: Verify today's Gemini edition on production
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo('Europe/Warsaw')).date().isoformat()
          data_url = 'https://briefrooms.com/data/ai_outlook.json'
          provider_url = 'https://briefrooms.com/data/ai_outlook_provider_status.json'
          pages = {
              'pl': 'https://briefrooms.com/pl/',
              'en': 'https://briefrooms.com/en/',
          }
          headers = {
              'User-Agent': 'BriefRooms Gemini AI Outlook verifier/1.0',
              'Cache-Control': 'no-cache',
          }
          last_errors = []
          observed = {}
          passed = False

          for attempt in range(1, 37):
              token = f'{int(time.time())}-{attempt}'
              errors = []
              try:
                  request = urllib.request.Request(f'{data_url}?verify={token}', headers=headers)
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.loads(response.read().decode('utf-8'))
                  provider_request = urllib.request.Request(
                      f'{provider_url}?verify={token}', headers=headers
                  )
                  with urllib.request.urlopen(provider_request, timeout=20) as response:
                      provider = json.loads(response.read().decode('utf-8'))

                  observed = {
                      'date': payload.get('date'),
                      'generated_at': payload.get('generated_at'),
                      'generation_mode': payload.get('generation_mode'),
                      'ai_provider': payload.get('ai_provider'),
                      'ai_model': payload.get('ai_model'),
                      'provider_status': provider.get('status'),
                      'provider_date': provider.get('date'),
                      'pl_forecast_id': (payload.get('pl') or {}).get('forecast_id'),
                      'en_forecast_id': (payload.get('en') or {}).get('forecast_id'),
                  }
                  if payload.get('date') != today:
                      errors.append(f"data date={payload.get('date')!r}")
                  if payload.get('schema_version') != 2:
                      errors.append('schema is not v2')
                  if payload.get('generation_mode') != 'ai_primary':
                      errors.append('publication is not ai_primary')
                  if payload.get('ai_provider') != 'gemini':
                      errors.append('publication provider is not Gemini')
                  if provider.get('status') != 'healthy' or provider.get('provider') != 'gemini':
                      errors.append('Gemini provider status is not healthy')
                  if provider.get('date') != today:
                      errors.append('Gemini provider status is stale')
                  for language in ('pl', 'en'):
                      edition = payload.get(language) or {}
                      if edition.get('source_language') != language:
                          errors.append(f'{language} source language mismatch')
                      if not str(edition.get('forecast_id') or '').startswith(today + '-' + language + '-'):
                          errors.append(f'{language} forecast ID mismatch')
              except Exception as exc:
                  errors.append(f'data: {exc}')

              for language, url in pages.items():
                  try:
                      request = urllib.request.Request(f'{url}?aioutlook={token}', headers=headers)
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = response.read().decode('utf-8', 'replace')
                      required = (
                          '/scripts/ai-outlook-freshness-guard.js?v=daily-v1',
                          '/scripts/ai-outlook-governance-guard.js?v=governance-v3',
                          '/scripts/homepage-photo-only.js?v=ai-outlook-daily-5',
                      )
                      for asset in required:
                          if asset not in body:
                              errors.append(f'{language}: missing {asset}')
                  except Exception as exc:
                      errors.append(f'{language} page: {exc}')

              if not errors:
                  passed = True
                  break
              last_errors = errors
              time.sleep(10)

          status = {
              'schema_version': 'ai-outlook-production-status-v2',
              'status': 'passed' if passed else 'failed',
              'date': today,
              'required_provider': 'gemini',
              'required_mode': 'ai_primary',
              'observed': observed,
              'homepage_assets': {
                  'freshness_guard': 'daily-v1',
                  'governance_guard': 'governance-v3',
                  'renderer': 'ai-outlook-daily-5',
              },
              'errors': [] if passed else last_errors,
          }
          Path('data/ai_outlook_production_status.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(status, ensure_ascii=False))
          if not passed:
              raise SystemExit('Production Gemini AI Outlook verification failed: ' + '; '.join(last_errors))
          PY

      - name: Commit production verification
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai_outlook_production_status.json
          if git diff --cached --quiet; then
            echo "Production verification status is already current."
            exit 0
          fi
          git commit -m "Verify Gemini AI Outlook on production"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "::error::Could not publish Gemini production verification."
          exit 1
