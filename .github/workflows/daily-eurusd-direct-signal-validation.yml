name: Validate Daily EURUSD Belief-First Direction Authority

on:
  pull_request:
    paths:
      - "scripts/daily_eurusd_lifecycle.py"
      - "scripts/daily_eurusd_spot.py"
      - "scripts/daily_eurusd_spot_v12.py"
      - "scripts/daily_eurusd_spot_v13.py"
      - "scripts/daily_eurusd_spot_v18.py"
      - "scripts/daily_eurusd_spot_v19.py"
      - "scripts/daily_eurusd_belief_decision.py"
      - "scripts/belief_epistemic_state.py"
      - "scripts/epistemic_consumer_interface.py"
      - "scripts/daily_eurusd_experiment.py"
      - "scripts/daily_eurusd_experiment_v12.py"
      - "tests/test_daily_eurusd_lifecycle.py"
      - "tests/test_daily_eurusd_direct_signal.py"
      - "tests/test_daily_eurusd_a_fallback.py"
      - "tests/test_daily_eurusd_belief_first.py"
      - "tests/test_epistemic_consumer_interface.py"
      - ".github/workflows/daily-eurusd-monitor.yml"
      - ".github/workflows/daily-eurusd-direct-signal-validation.yml"
  push:
    branches: [main]
    paths:
      - "scripts/daily_eurusd_spot_v12.py"
      - "scripts/daily_eurusd_spot_v13.py"
      - "scripts/daily_eurusd_spot_v18.py"
      - "scripts/daily_eurusd_spot_v19.py"
      - "scripts/daily_eurusd_belief_decision.py"
      - "tests/test_daily_eurusd_direct_signal.py"
      - "tests/test_daily_eurusd_a_fallback.py"
      - "tests/test_daily_eurusd_belief_first.py"
      - ".github/workflows/daily-eurusd-monitor.yml"
      - ".github/workflows/daily-eurusd-direct-signal-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Daily EURUSD authority runtime
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/daily_engine_contract.py \
            scripts/daily_eurusd_lifecycle.py \
            scripts/daily_eurusd_spot.py \
            scripts/daily_eurusd_spot_v12.py \
            scripts/daily_eurusd_spot_v13.py \
            scripts/daily_eurusd_spot_v18.py \
            scripts/daily_eurusd_spot_v19.py \
            scripts/daily_eurusd_belief_decision.py \
            scripts/belief_epistemic_state.py \
            scripts/epistemic_consumer_interface.py \
            scripts/daily_eurusd_experiment.py \
            scripts/daily_eurusd_experiment_v12.py
      - name: Run legacy isolation plus Belief-first authority tests
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_daily_eurusd_lifecycle \
            tests.test_daily_eurusd_direct_signal \
            tests.test_daily_eurusd_a_fallback \
            tests.test_daily_eurusd_belief_first \
            tests.test_epistemic_consumer_interface -v
      - name: Assert production workflow uses Belief-first final direction authority
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/daily-eurusd-monitor.yml').read_text()
          required=[
              'scripts/daily_eurusd_spot_v19.py',
              'scripts/daily_eurusd_belief_decision.py',
              'BELIEF_EPISTEMIC_STATE=',
              'DAILY_EURUSD_REQUIRE_EPISTEMIC=1',
              'tests.test_daily_eurusd_a_fallback',
              'tests.test_daily_eurusd_belief_first',
              'EURUSD_V19_BELIEF_FIRST_OK',
              'tests.test_daily_eurusd_direct_signal',
              'tests.test_daily_eurusd_contextual_production_policy',
              'PUSH_VALIDATION_ONLY_NO_TRADING_STATE_MUTATION',
          ]
          missing=[item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Belief-first production contract missing: {missing}')
          forbidden=[
              'PR25_NATIVE_OR_A_WORKFLOW_CONTRACT_OK',
          ]
          leaked=[item for item in forbidden if item in text]
          if leaked:
              raise SystemExit(f'legacy fallback authority contract leaked: {leaked}')
          print('DAILY_EURUSD_BELIEF_FIRST_DIRECTION_AUTHORITY_OK')
          PY
