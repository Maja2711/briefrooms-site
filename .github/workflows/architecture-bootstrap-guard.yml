name: Architecture Bootstrap Guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate architecture bootstrap
        run: python3 scripts/validate_architecture_bootstrap.py
