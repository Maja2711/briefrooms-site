name: Architecture Bootstrap Guard

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "10 6 * * *"

permissions:
  contents: read

jobs:
  validate-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Stock Trading research branch
        run: git fetch origin stock-trading-v2:refs/remotes/origin/stock-trading-v2

      - name: Validate architecture bootstrap
        run: python3 scripts/validate_architecture_bootstrap.py

      - name: Validate Architecture Reconciliation 1.5
        run: python3 scripts/validate_architecture_reconciliation.py --research-ref origin/stock-trading-v2
