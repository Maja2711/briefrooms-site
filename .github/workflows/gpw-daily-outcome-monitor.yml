name: Monitor PL GPW Daily Trade Outcomes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gpw-daily-outcome-monitor.yml"
      - "scripts/gpw_daily_outcome_monitor.py"
      - "tests/test_gpw_daily_outcome_monitor.py"
      - "scripts/gpw-daily-pick-public.js"
      - "data/investments/gpw_daily_pick_history/**"
  schedule:
    - cron: "*/10 7-16 * * 1-5"

permissions:
  contents: write
  pages: write

concurrency:
  group: gpw-daily-outcome-monitor
  cancel-in-progress: false

jobs:
  settle-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate outcome monitor contract
        run: |
          python -m py_compile scripts/gpw_daily_outcome_monitor.py scripts/gpw_daily_pick.py
          python -m unittest tests.test_gpw_daily_outcome_monitor -v

      - name: Resolve pending GPW trades and rebuild durable history
        run: python scripts/gpw_daily_outcome_monitor.py

      - name: Commit outcomes, metrics and history index
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/gpw_daily_pick.json \
                  data/investments/gpw_daily_pick_metrics.json \
                  data/investments/gpw_daily_pick_history_index.json 2>/dev/null || true
          git add data/investments/gpw_daily_pick_history 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Settle GPW daily trade outcomes"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 4))
          done
          exit 1

      - name: Request fresh Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            CODE="$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")"
            if [[ "$CODE" == "201" ]]; then exit 0; fi
            if [[ "$CODE" != "409" ]]; then cat /tmp/pages.json; exit 1; fi
            sleep 10
          done
          exit 1
