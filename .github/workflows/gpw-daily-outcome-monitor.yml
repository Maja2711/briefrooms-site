name: Monitor PL GPW Daily Trade Outcomes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gpw-daily-outcome-monitor.yml"
      - "scripts/gpw_daily_outcome_monitor.py"
      - "scripts/gpw_daily_apply_manual_evidence.py"
      - "scripts/daily_stock_timestamp_integrity.py"
      - "scripts/build_daily_stock_history_index.py"
      - "scripts/daily-stock-markets-public.js"
      - "tests/test_gpw_daily_outcome_monitor.py"
      - "scripts/gpw-daily-pick-public.js"
      - "data/internal/gpw_daily_pick_evidence/**"
      - "data/investments/gpw_daily_pick_history/**"
      - "data/investments/us_daily_stock_history/**"
  schedule:
    - cron: "*/10 7-16 * * 1-5"

permissions:
  contents: write
  pages: write

concurrency:
  group: gpw-daily-outcome-monitor
  cancel-in-progress: false

jobs:
  settle-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate outcome monitor contract
        run: |
          python -m py_compile scripts/gpw_daily_outcome_monitor.py scripts/gpw_daily_apply_manual_evidence.py scripts/gpw_daily_pick.py scripts/gpw_daily_control_loop.py scripts/daily_stock_timestamp_integrity.py scripts/build_daily_stock_history_index.py
          python -m unittest tests.test_gpw_daily_outcome_monitor -v
          node --check scripts/gpw-daily-pick-public.js
          node --check scripts/daily-stock-markets-public.js

      - name: Apply explicit broker evidence receipts
        run: python scripts/gpw_daily_apply_manual_evidence.py

      - name: Resolve pending GPW trades and rebuild durable history
        run: |
          python scripts/gpw_daily_outcome_monitor.py
          python scripts/daily_stock_timestamp_integrity.py --market gpw

      - name: Refresh bounded learning snapshot from settled history immediately
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from scripts import gpw_daily_pick as gpw
          from scripts.gpw_daily_control_loop import build_learning_snapshot
          config=gpw.load_config()
          history=gpw.all_history()
          now=datetime.now(ZoneInfo('Europe/Warsaw'))
          learning=build_learning_snapshot(history,config,now=now)
          gpw.atomic_json(Path('data/investments/gpw_daily_pick_learning.json'),learning)
          current=gpw.load_json(gpw.PUBLIC_PATH)
          current['learning']={
            'method':learning.get('method'),
            'resolved_trades':learning.get('resolved_trades',0),
            'adaptation_active':bool(learning.get('adaptation_active')),
            'minimum_sample':learning.get('minimum_sample'),
            'recent_average_r':learning.get('recent_average_r'),
            'last_lesson':learning.get('last_lesson'),
            'weights_frozen':True,
            'event_learning_method':(current.get('learning') or {}).get('event_learning_method','event_family_bayesian_shrinkage_v1'),
            'event_expectancy':(current.get('learning') or {}).get('event_expectancy',[]),
          }
          gpw.atomic_json(gpw.PUBLIC_PATH,current)
          print(json.dumps(current['learning'],ensure_ascii=False,indent=2))
          PY

      - name: Rebuild shared GPW and US Daily Stock history index
        run: python scripts/build_daily_stock_history_index.py

      - name: Cache-bust GPW history-enabled client
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('pl/inwestycje/portfel-10k.html')
          text=path.read_text(encoding='utf-8')
          import re
          updated=re.sub(r'/scripts/gpw-daily-pick-public\.js\?v=\d+', '/scripts/gpw-daily-pick-public.js?v=5', text)
          if updated != text:
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit outcomes, metrics, learning and history index
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/gpw_daily_pick.json data/investments/gpw_daily_pick_metrics.json data/investments/gpw_daily_pick_learning.json data/investments/gpw_daily_pick_history_index.json data/investments/daily_stock_history_index.json pl/inwestycje/portfel-10k.html 2>/dev/null || true
          git add data/investments/gpw_daily_pick_history 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Settle GPW daily trade outcomes"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 4))
          done
          exit 1

      - name: Request fresh Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            CODE="$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")"
            if [[ "$CODE" == "201" ]]; then exit 0; fi
            if [[ "$CODE" != "409" ]]; then cat /tmp/pages.json; exit 1; fi
            sleep 10
          done
          exit 1
