name: One-shot Portfolio 10K accounting hardening

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-portfolio-accounting-hardening.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-portfolio-accounting-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run deterministic accounting tests
        run: |
          python -m py_compile scripts/portfolio_10k_cash_yield.py scripts/portfolio_10k_cash_yield_backfill.py scripts/sync_portfolio_10k_paper_mtm.py scripts/portfolio_10k_ledger_parity_gate.py
          python -m unittest tests.test_portfolio_10k_cash_yield -v
          python -m unittest tests.test_portfolio_10k_accounting_hardening -v

      - name: Apply one-time ledger-derived interest correction
        run: python scripts/portfolio_10k_cash_yield_backfill.py

      - name: Enforce public-paper quantity, cash and yield parity
        run: python scripts/portfolio_10k_ledger_parity_gate.py

      - name: Write auditable receipt
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          public=json.loads(Path('data/investments/portfolio_10k.json').read_text(encoding='utf-8'))
          paper=json.loads(Path('data/portfolio10k/paper_portfolio.json').read_text(encoding='utf-8'))
          usd=json.loads(Path('data/investments/portfolio_10k_usd.json').read_text(encoding='utf-8'))
          pub={p['id']:p for p in public.get('positions',[]) if p.get('status')=='active'}
          pap={p['id']:p for p in paper.get('positions',[]) if p.get('status') in {'active','paper_active'}}
          gaps={k:abs(float(pub[k]['quantity'])-float(pap[k]['quantity'])) for k in sorted(pub)}
          receipt={'schema_version':'portfolio-10k-accounting-hardening-audit-v1','audited_at':datetime.now(timezone.utc).isoformat(timespec='seconds'),'status':'PASS','execution_authority':(public.get('execution_reconciliation') or {}).get('execution_authority'),'active_ids':sorted(pub),'max_quantity_gap':max(gaps.values(),default=0.0),'public_deployable_cash_pln':public.get('base_cash_pln'),'paper_cash_pln':paper.get('cash_pln'),'pln_interest_accrued':public.get('cash_interest_accrued_pln'),'pln_corrections':public.get('cash_yield_corrections',[]),'usd_cash':usd.get('cash_usd',usd.get('cash_pln')),'usd_interest_accrued':usd.get('cash_interest_accrued_usd'),'usd_corrections':usd.get('cash_yield_corrections',[]),'pre_execution_mtm_sync_required':True,'hard_gate_quantity_cash_yield_parity':True}
          Path('data/internal/portfolio_10k_accounting_hardening_audit.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY

      - name: Commit correction and receipt
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/portfolio_10k.json data/investments/portfolio_10k_usd.json data/portfolio10k/paper_portfolio.json data/internal/portfolio_10k_accounting_hardening_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply audited Portfolio 10K accounting hardening"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1

# retry 2: import-safe backfill
