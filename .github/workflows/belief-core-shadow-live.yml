name: Belief Core Live Shadow Collection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/belief-core-shadow-live.yml"
      - "scripts/belief_core_live.py"
      - "scripts/belief_market_data_adapter.py"
      - "scripts/belief_wes_assets_adapter.py"
      - "tests/test_belief_wes_assets.py"
      - "docs/BELIEF_WES_ASSET_COVERAGE.md"
      - "scripts/belief_geopolitical_forecast_adapter.py"
      - "scripts/belief_geopolitical_live.py"
      - "tests/test_belief_geopolitical_forecast_adapter.py"
      - "tests/test_belief_core_geopolitical_live.py"
      - "docs/BELIEF_GSE_GEOPOLITICAL_ADAPTER.md"
  schedule:
    # Covers 09:30-16:20 America/New_York across EDT and EST.
    # The Python scheduler decides whether a run is inside the market window.
    - cron: "7,37 13-22 * * 1-5"

permissions:
  contents: read
  actions: write

concurrency:
  group: belief-core-live-shadow
  cancel-in-progress: false

env:
  ARTIFACT_NAME: belief-core-shadow-state
  GSE_ARTIFACT_NAME: gse-shadow-state

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current production code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare runtime state paths
        run: |
          echo "STATE_DIR=$RUNNER_TEMP/belief_core_state" >> "$GITHUB_ENV"
          echo "GSE_STATE_DIR=$RUNNER_TEMP/gse_state" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/belief_core_state" "$RUNNER_TEMP/gse_state"

      - name: Restore latest Belief Core shadow state artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > "$RUNNER_TEMP/artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/artifacts.json" <<'PY'
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text())
          rows=[x for x in payload.get("artifacts", []) if not x.get("expired")]
          rows.sort(key=lambda x: x.get("created_at", ""), reverse=True)
          print(rows[0]["id"] if rows else "")
          PY
          )
          if [ -z "$artifact_id" ]; then
            echo "No previous Belief Core state artifact; starting a new shadow ledger."
            exit 0
          fi
          echo "Restoring Belief Core artifact id=$artifact_id"
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o "$RUNNER_TEMP/belief-state.zip"
          mkdir -p "$RUNNER_TEMP/belief-state-artifact"
          unzip -q "$RUNNER_TEMP/belief-state.zip" -d "$RUNNER_TEMP/belief-state-artifact"
          test -f "$RUNNER_TEMP/belief-state-artifact/belief-core-state.tgz"
          tar -xzf "$RUNNER_TEMP/belief-state-artifact/belief-core-state.tgz" -C "$STATE_DIR"

      - name: Restore latest cumulative GSE shadow state read-only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${GSE_ARTIFACT_NAME}&per_page=100"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > "$RUNNER_TEMP/gse-artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/gse-artifacts.json" <<'PY'
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text())
          rows=[x for x in payload.get("artifacts", []) if not x.get("expired")]
          rows.sort(key=lambda x: x.get("created_at", ""), reverse=True)
          print(rows[0]["id"] if rows else "")
          PY
          )
          if [ -z "$artifact_id" ]; then
            echo "No GSE artifact available; geopolitical adapter will record unavailable telemetry only."
            exit 0
          fi
          echo "Restoring read-only GSE artifact id=$artifact_id"
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o "$RUNNER_TEMP/gse-state.zip"
          mkdir -p "$RUNNER_TEMP/gse-state-artifact"
          unzip -q "$RUNNER_TEMP/gse-state.zip" -d "$RUNNER_TEMP/gse-state-artifact"
          test -f "$RUNNER_TEMP/gse-state-artifact/gse-state.tgz"
          tar -xzf "$RUNNER_TEMP/gse-state-artifact/gse-state.tgz" -C "$GSE_STATE_DIR"

      - name: Validate Belief Core and adapters before collection
        run: |
          python -m py_compile \
            scripts/belief_core.py \
            scripts/belief_calibration.py \
            scripts/belief_adapter_contract.py \
            scripts/belief_market_data_adapter.py \
            scripts/belief_technical_adapter.py \
            scripts/belief_liquidity_adapter.py \
            scripts/belief_regime_adapter.py \
            scripts/belief_wes_assets_adapter.py \
            scripts/belief_geopolitical_forecast_adapter.py \
            scripts/belief_geopolitical_live.py \
            scripts/belief_core_live.py
          python -m unittest \
            tests/test_belief_core.py \
            tests/test_belief_core_adapters.py \
            tests/test_belief_core_live.py \
            tests/test_belief_wes_assets.py \
            tests/test_belief_core_geopolitical_live.py \
            tests/test_belief_geopolitical_forecast_adapter.py -v
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import belief_core_live as live
          import belief_geopolitical_live as geo_live
          import belief_geopolitical_forecast_adapter as geo_adapter
          import belief_wes_assets_adapter as wes_assets
          assert live.MODE == 'shadow'
          assert live.TRADE_EXECUTION_ENABLED is False
          assert live.POLICY_OUTPUT_ENABLED is False
          assert live.AUTOMATIC_TUNING_ENABLED is False
          assert geo_live.MODE == 'shadow'
          assert geo_live.TRADE_EXECUTION_ENABLED is False
          assert geo_live.POLICY_OUTPUT_ENABLED is False
          assert geo_live.DECISION_ENGINE_CONNECTED is False
          assert geo_adapter.GeopoliticalForecastAdapter.v2_evidence_enabled is False
          coverage=wes_assets.coverage_report()
          assert coverage['decision_influence'] is False
          assert coverage['eurusd']['rate_differential_claimed'] is False
          assert coverage['btc']['on_chain_claimed'] is False
          print('Belief Core + GSE + WES asset adapter safety invariants: PASS')
          PY

      - name: Ingest qualified frozen GSE forecasts into Belief shadow state
        run: |
          python scripts/belief_geopolitical_live.py \
            --state-dir "$STATE_DIR" \
            --gse-state-dir "$GSE_STATE_DIR"

      - name: Run 30-minute shadow collection cycle
        run: python scripts/belief_core_live.py --state-dir "$STATE_DIR"

      - name: Validate persisted shadow state
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['STATE_DIR'])
          state=json.loads((root/'state.json').read_text())
          dashboard=json.loads((root/'dashboard.json').read_text())
          scheduler=json.loads((root/'scheduler.json').read_text())
          assert state['schema_version'] == 2
          controls=dashboard['controls']
          assert controls['decision_engine_connected'] is False
          assert controls['trade_execution_enabled'] is False
          assert controls['policy_output_enabled'] is False
          assert controls['automatic_tuning_enabled'] is False
          assert scheduler['last_status']['mode'] == 'shadow'
          coverage=scheduler['last_status']['wes_asset_coverage']
          assert coverage['decision_influence'] is False
          assert coverage['eurusd']['rate_differential_claimed'] is False
          assert coverage['btc']['on_chain_claimed'] is False
          geo=scheduler['last_geopolitical_status']
          assert geo['mode'] == 'shadow'
          assert geo['decision_engine_connected'] is False
          assert geo['trade_execution_enabled'] is False
          assert geo['policy_output_enabled'] is False
          print('Belief Core state validation: PASS')
          print('Last status:', scheduler['last_status'])
          print('Geopolitical adapter status:', geo)
          PY

      - name: Pack cumulative state
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/belief-core-state.tgz" -C "$STATE_DIR" .
          ls -lh "$RUNNER_TEMP/belief-core-state.tgz"

      - name: Store cumulative shadow state outside repository
        uses: actions/upload-artifact@v4
        with:
          name: belief-core-shadow-state
          path: ${{ runner.temp }}/belief-core-state.tgz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Keep rolling artifact backups
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > "$RUNNER_TEMP/artifacts-after.json"
          python - "$RUNNER_TEMP/artifacts-after.json" > "$RUNNER_TEMP/delete-artifacts.txt" <<'PY'
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text())
          rows=[x for x in payload.get('artifacts', []) if not x.get('expired')]
          rows.sort(key=lambda x: x.get('created_at',''), reverse=True)
          for row in rows[48:]:
              print(row['id'])
          PY
          while read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            curl -fsSL -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done < "$RUNNER_TEMP/delete-artifacts.txt"
