name: Validate US Daily Research Compatibility

on:
  pull_request:
    paths:
      - "scripts/us_daily_stock.py"
      - "scripts/us_daily_stock_runtime.py"
      - "scripts/us_daily_stock_position_lifecycle.py"
      - "scripts/us_daily_stock_position_monitor.py"
      - "scripts/build_daily_stock_history_index.py"
      - "tests/test_us_daily_stock.py"
      - "tests/test_us_daily_stock_position_lifecycle.py"
      - ".github/workflows/us-daily-stock-en.yml"
      - ".github/workflows/us-daily-stock-position-monitor.yml"
      - ".github/workflows/us-daily-stock-position-validation.yml"
  push:
    branches-ignore: [main]
    paths:
      - "scripts/us_daily_stock.py"
      - "scripts/us_daily_stock_runtime.py"
      - "scripts/us_daily_stock_position_lifecycle.py"
      - "scripts/us_daily_stock_position_monitor.py"
      - "scripts/build_daily_stock_history_index.py"
      - "tests/test_us_daily_stock.py"
      - "tests/test_us_daily_stock_position_lifecycle.py"
      - ".github/workflows/us-daily-stock-en.yml"
      - ".github/workflows/us-daily-stock-position-monitor.yml"
      - ".github/workflows/us-daily-stock-position-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile position-aware runtime
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/us_daily_stock.py \
            scripts/us_daily_stock_runtime.py \
            scripts/us_daily_stock_position_lifecycle.py \
            scripts/us_daily_stock_position_monitor.py \
            scripts/build_daily_stock_history_index.py

      - name: Run US selector and lifecycle tests
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_us_daily_stock \
            tests.test_us_daily_stock_position_lifecycle -v

      - name: Assert legacy US path cannot own production admission
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          lifecycle=Path('scripts/us_daily_stock_position_lifecycle.py').read_text(encoding='utf-8')
          runtime=Path('scripts/us_daily_stock_runtime.py').read_text(encoding='utf-8')
          monitor=Path('.github/workflows/us-daily-stock-position-monitor.yml').read_text(encoding='utf-8')
          v2prod=Path('.github/workflows/stock-trading-v2-production.yml').read_text(encoding='utf-8')
          daily=Path('.github/workflows/us-daily-stock-en.yml').read_text(encoding='utf-8')
          history=Path('scripts/build_daily_stock_history_index.py').read_text(encoding='utf-8')
          portfolio=Path('scripts/stock_trading_portfolio.py').read_text(encoding='utf-8')
          bridge=Path('scripts/stock_trading_v2_production_bridge.py').read_text(encoding='utf-8')
          policy=json.loads(Path('data/investments/stock_trading_policy.json').read_text(encoding='utf-8'))
          assert 'max_open_positions' in lifecycle
          assert 'reconcile_open_position' in runtime
          assert 'canonical_history_payloads' in history
          assert '*/5 13-21 * * 1-5' in monitor
          assert 'stock_trading_portfolio.py --mode run --market US' in monitor
          assert 'group: stock-trading-state-writer' in monitor
          assert 'group: stock-trading-state-writer' in v2prod
          assert 'us-daily-stock-en' not in monitor
          assert policy['champion_engine']=='v2'
          assert policy['legacy_candidate_admission_enabled'] is False
          assert '--mode sync-candidates' not in daily
          assert 'git add data/investments/stock_trading_portfolio.json' not in daily
          assert 'v2_production_bridge_only' in portfolio
          assert 'candidate_admission_authorized' in portfolio
          assert 'authority="v2_production_bridge"' in bridge
          print('US_DAILY_RESEARCH_ONLY_SINGLE_ADMISSION_AUTHORITY_OK')
          PY
