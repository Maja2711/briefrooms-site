name: Validate US Daily Stock Lifecycle and Generation Routing

on:
  pull_request:
    paths:
      - "scripts/us_daily_stock.py"
      - "scripts/us_daily_stock_runtime.py"
      - "scripts/us_daily_stock_position_lifecycle.py"
      - "scripts/us_daily_stock_position_monitor.py"
      - "scripts/stock_trading_portfolio.py"
      - "scripts/stock_trading_generation_router.py"
      - "scripts/stock_trading_generation_promotion.py"
      - "scripts/build_daily_stock_history_index.py"
      - "tests/test_us_daily_stock.py"
      - "tests/test_us_daily_stock_position_lifecycle.py"
      - "tests/test_stock_trading_portfolio.py"
      - "tests/test_stock_trading_generation_promotion.py"
      - ".github/workflows/us-daily-stock-en.yml"
      - ".github/workflows/us-daily-stock-position-monitor.yml"
      - ".github/workflows/us-daily-stock-position-validation.yml"
  push:
    branches-ignore: [main]
    paths:
      - "scripts/us_daily_stock.py"
      - "scripts/us_daily_stock_runtime.py"
      - "scripts/us_daily_stock_position_lifecycle.py"
      - "scripts/us_daily_stock_position_monitor.py"
      - "scripts/stock_trading_portfolio.py"
      - "scripts/stock_trading_generation_router.py"
      - "scripts/stock_trading_generation_promotion.py"
      - "scripts/build_daily_stock_history_index.py"
      - "tests/test_us_daily_stock.py"
      - "tests/test_us_daily_stock_position_lifecycle.py"
      - "tests/test_stock_trading_portfolio.py"
      - "tests/test_stock_trading_generation_promotion.py"
      - ".github/workflows/us-daily-stock-en.yml"
      - ".github/workflows/us-daily-stock-position-monitor.yml"
      - ".github/workflows/us-daily-stock-position-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile lifecycle and generation routing runtime
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/us_daily_stock.py \
            scripts/us_daily_stock_runtime.py \
            scripts/us_daily_stock_position_lifecycle.py \
            scripts/us_daily_stock_position_monitor.py \
            scripts/stock_trading_portfolio.py \
            scripts/stock_trading_generation_promotion.py \
            scripts/stock_trading_generation_router.py \
            scripts/build_daily_stock_history_index.py

      - name: Run legacy lifecycle, canonical portfolio and generation tests
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_us_daily_stock \
            tests.test_us_daily_stock_position_lifecycle \
            tests.test_stock_trading_portfolio \
            tests.test_stock_trading_generation_promotion -v

      - name: Assert legacy lifecycle remains safe and production uses canonical generation router
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          lifecycle=Path('scripts/us_daily_stock_position_lifecycle.py').read_text(encoding='utf-8')
          runtime=Path('scripts/us_daily_stock_runtime.py').read_text(encoding='utf-8')
          monitor=Path('.github/workflows/us-daily-stock-position-monitor.yml').read_text(encoding='utf-8')
          daily=Path('.github/workflows/us-daily-stock-en.yml').read_text(encoding='utf-8')
          router=Path('scripts/stock_trading_generation_router.py').read_text(encoding='utf-8')
          history=Path('scripts/build_daily_stock_history_index.py').read_text(encoding='utf-8')

          # Keep PR26 lifecycle behavior tested for historical/legacy records.
          assert 'max_open_positions' in lifecycle
          assert 'HOLD_NO_NEW_ENTRY' in lifecycle
          assert 'SUPPRESSED_DUPLICATE_SIGNAL' in lifecycle
          assert 'ROTATION_SCORE_EDGE = 10.0' in lifecycle
          assert 'ROTATION_MIN_CURRENT_R = 0.25' in lifecycle
          assert 'same_symbol_hold' in lifecycle
          assert 'reconcile_open_position' in runtime
          assert 'position_action' in runtime
          assert '*/5 13-21 * * 1-5' in monitor
          assert 'us-daily-stock-en' in monitor
          assert 'canonical_history_payloads' in history

          # Production entry authority has migrated to the shared canonical
          # Stock Trading portfolio, with V1/V2 selected by the formal bridge.
          assert 'stock_trading_generation_router.py --mode apply --market US' in daily
          assert 'stock_trading_portfolio.json' in daily
          assert 'apply_entry_source' in router
          assert 'available_slots' in router
          assert 'replacement_authority_enabled' in router
          assert 'v2_definition_not_proven_fail_closed' in router
          print('US_CANONICAL_GENERATION_ROUTING_CONTRACT_OK')
          PY
