name: Localize Daily Stock PL EN

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-stock-bilingual-localization.yml"
      - "scripts/daily_stock_bilingual_localization.py"
      - "scripts/daily-stock-language-guard.js"
      - "scripts/daily-gpw-en-public.js"
      - "tests/test_daily_stock_bilingual_localization.py"
      - "pl/inwestycje/daily-trading.html"
      - "en/investing/daily-trading.html"
  workflow_run:
    workflows:
      - "Publish PL GPW Daily Pick"
      - "Publish EN US Daily Stock"
      - "Monitor US Daily Stock Position"
    types: [completed]
  schedule:
    - cron: "*/30 7-21 * * 1-5"

permissions:
  contents: write
  pages: write

concurrency:
  group: daily-stock-bilingual-localization
  cancel-in-progress: true

jobs:
  localize:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_GENERATION_MODEL: gemini-3.5-flash-lite
      GEMINI_REVIEW_MODEL: gemini-3.5-flash-lite
      GEMINI_MIN_INTERVAL_SECONDS: "8"

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Validate bilingual localization contract
        run: |
          set -euo pipefail
          python -m unittest tests.test_daily_stock_bilingual_localization -v
          python -m py_compile scripts/daily_stock_bilingual_localization.py
          node --check scripts/daily-stock-language-guard.js
          node --check scripts/daily-gpw-en-public.js

      - name: Localize current GPW and US Daily selections
        run: |
          set -euo pipefail
          python scripts/daily_stock_bilingual_localization.py --market gpw
          python scripts/daily_stock_bilingual_localization.py --market us

      - name: Verify target-language payloads
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          checks = [
              ('gpw', Path('data/investments/gpw_daily_pick.json'), 'TRANSAKCJA', 'en'),
              ('us', Path('data/investments/us_daily_stock.json'), 'TRADE', 'pl'),
          ]
          for market, path, trade_decision, target in checks:
              payload = json.loads(path.read_text(encoding='utf-8'))
              if payload.get('decision') != trade_decision:
                  print('LOCALIZATION_SKIP_NON_TRADE', market, payload.get('decision'))
                  continue
              selection = payload.get('selection') or {}
              localized = (selection.get('localized') or {}).get(target) or {}
              assert localized.get('language') == target, (market, localized)
              assert str(localized.get('thesis') or '').strip()
              assert str(localized.get('why_now') or '').strip()
              assert str(localized.get('activation') or '').strip()
              source_ids = {str(row.get('id')) for row in (selection.get('sources') or []) if row.get('id')}
              summaries = localized.get('source_summaries') or {}
              assert source_ids.issubset(set(summaries)), (market, source_ids, summaries)
              print('LOCALIZATION_OK', market, selection.get('ticker') or selection.get('symbol'), target, localized.get('translation_mode'))
          PY

      - name: Commit localized display state
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/gpw_daily_pick.json data/investments/us_daily_stock.json 2>/dev/null || true
          git add data/investments/gpw_daily_pick_history data/investments/us_daily_stock_history 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Localize Daily Stock display copy"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt*3))
          done
          exit 1

      - name: Request fresh Pages build
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'push'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            CODE="$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")"
            if [[ "$CODE" == "201" ]]; then exit 0; fi
            if [[ "$CODE" != "409" ]]; then cat /tmp/pages.json; exit 1; fi
            sleep 10
          done
          exit 1
