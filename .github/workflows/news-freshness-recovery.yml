name: News Freshness Recovery
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
  actions: write
concurrency:
  group: news-freshness-recovery
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check published freshness and recover if needed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, subprocess, urllib.request
          from datetime import datetime, timezone
          repo = os.environ['GH_REPO']
          headers = {'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'BriefRooms-news-recovery'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=15) as response:
                  return json.load(response)
          status = get('https://raw.githubusercontent.com/'+repo+'/main/data/news/status.json')
          feeds = [get('https://raw.githubusercontent.com/'+repo+'/main/data/news/'+lang+'.json') for lang in ('pl','en')]
          marker = status.get('marker')
          if not marker or any(feed.get('marker') != marker for feed in feeds):
              stale = True
              print('::warning::News markers differ; recovery required')
          else:
              generated = [datetime.fromisoformat(str(x['generated_at']).replace('Z','+00:00')) for x in [status,*feeds]]
              age = max((datetime.now(timezone.utc)-t).total_seconds()/60 for t in generated)
              stale = age > 70
              print(f'News age: {age:.1f} minutes; recovery threshold: 70 minutes')
          if not stale:
              raise SystemExit(0)
          runs = get('https://api.github.com/repos/'+repo+'/actions/workflows/publish-news.yml/runs?per_page=20')['workflow_runs']
          if any(run['status'] in ('queued','in_progress','waiting','pending','requested') for run in runs):
              print('Publisher already active; avoiding duplicate dispatch')
              raise SystemExit(0)
          print('Dispatching recovery publisher')
          subprocess.run(['gh','workflow','run','publish-news.yml','--repo',repo,'--ref','main'],check=True)
          PY
