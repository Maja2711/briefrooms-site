name: One-shot Portfolio 10K control contract repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-portfolio-10k-control-contract.yml"
      - "scripts/patch_portfolio_control_contract_once.py"

permissions:
  contents: write

concurrency:
  group: portfolio-control-contract-repair
  cancel-in-progress: false

jobs:
  repair-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply deterministic contract repair
        run: python scripts/patch_portfolio_control_contract_once.py
      - name: Validate repaired BRACE contract
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q tests/test_brace_portfolio_engine.py tests/test_brace_portfolio_self_learning.py
      - name: Commit repaired test contract and remove one-shot files
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-portfolio-10k-control-contract.yml
          rm -f scripts/patch_portfolio_control_contract_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_brace_portfolio_engine.py \
                  .github/workflows/one-shot-portfolio-10k-control-contract.yml \
                  scripts/patch_portfolio_control_contract_once.py
          git commit -m "Align BRACE tests with authorised paper control"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
          exit 1

