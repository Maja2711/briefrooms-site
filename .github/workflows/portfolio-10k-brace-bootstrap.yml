name: Bootstrap BRACE 2.0 Learning

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/portfolio-10k-brace-bootstrap.yml"
      - "pl/inwestycje/portfel-10k.html"
      - "en/investing/portfolio-10k.html"
      - "scripts/audit_investment_rooms_fast.py"
      - "scripts/portfolio-10k-dashboard.js"
      - "scripts/portfolio-10k-dashboard-en.js"
      - "scripts/site-header.js"
      - "scripts/ai-tournament-public.js"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: investment-room-pr-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out audited PR
        uses: actions/checkout@v4

      - name: Locate Chrome
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser

      - name: Start local BriefRooms site
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/briefrooms-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/pl/inwestycje/portfel-10k.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/briefrooms-http.log
          exit 1

      - name: Open and verify all 18 PL/EN investment views
        id: room_audit
        continue-on-error: true
        run: python3 scripts/audit_investment_rooms_fast.py

      - name: Print complete diagnostic report
        if: always()
        run: cat data/investments/investment_room_full_audit.json

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investment-room-full-audit
          path: data/investments/investment_room_full_audit.json
          if-no-files-found: error

      - name: Fail when any room or tab is broken
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/investments/investment_room_full_audit.json').read_text(encoding='utf-8'))
          if not report.get('passed'):
              for language, result in report.get('results', {}).items():
                  print(language, 'passed=', result.get('passed'))
                  print('navigation=', result.get('navigation_order'))
                  for tab in result.get('tabs', []):
                      if not tab.get('passed'):
                          print('FAILED TAB:', language, tab)
              raise SystemExit('Investment room full audit failed')
          print('All 18 PL/EN investment views passed.')
          PY
