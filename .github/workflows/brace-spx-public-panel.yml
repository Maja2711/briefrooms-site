name: BRACE-SPX Public Panel

on:
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    branches:
      - main
    paths:
      - "scripts/install_brace_spx_public_panel.py"
      - "scripts/brace-spx-generation3-card.js"
      - "pl/inwestycje/brace-spx-lab.html"
      - "en/investing/brace-spx-lab.html"
      - ".github/workflows/brace-spx-public-panel.yml"

permissions:
  contents: write

concurrency:
  group: brace-spx-public-panel-main
  cancel-in-progress: false

jobs:
  install-and-validate:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'BRACE-SPX panel')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tabs and Generation 3 blocks
        run: python scripts/install_brace_spx_public_panel.py

      - name: Validate public integration
        run: |
          python -m py_compile scripts/publish_brace_spx_public.py scripts/install_brace_spx_public_panel.py
          python -m unittest -v tests/test_brace_spx_public_boundary.py
          python scripts/install_brace_spx_public_panel.py --check
          test -f scripts/brace-spx-generation3-card.js

      - name: Persist generated scenario blocks
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pl/inwestycje/spx-scenariusze-2026.html en/investing/spx-scenarios-2026.html sitemap.xml
          if git diff --cached --quiet; then
            echo "BRACE-SPX Generation 3 blocks are already current."
            exit 0
          fi
          git commit -m "Show BRACE-SPX Generation 3 on S&P scenario pages"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 15))
          done
          exit 1
