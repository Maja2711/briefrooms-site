name: Deploy Trading Push Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/trading-push/**"
      - ".github/workflows/deploy-trading-push-backend.yml"

permissions:
  contents: write

concurrency:
  group: deploy-trading-push-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Install backend dependencies
        working-directory: workers/trading-push
        run: npm install --no-audit --no-fund
      - name: Validate backend
        working-directory: workers/trading-push
        run: npm run check
      - name: Deploy Worker and Durable Object
        working-directory: workers/trading-push
        run: npx wrangler deploy
      - name: Bootstrap VAPID secrets once
        working-directory: workers/trading-push
        run: |
          set -euo pipefail
          npx wrangler secret list --format json > /tmp/wrangler-secrets.json
          node - <<'NODE'
          const fs = require("fs");
          const rows = JSON.parse(fs.readFileSync("/tmp/wrangler-secrets.json", "utf8"));
          const names = new Set((Array.isArray(rows) ? rows : []).map((x) => String(x?.name || "")));
          const missing = ["VAPID_PRIVATE_KEY", "VAPID_PUBLIC_KEY"].filter((name) => !names.has(name));
          if (missing.length === 1) {
            console.error("Incomplete VAPID key pair. Restore the original missing secret; automatic key rotation would invalidate device subscriptions.");
            process.exit(1);
          }
          fs.writeFileSync("/tmp/vapid-missing.json", JSON.stringify(missing));
          console.log(missing.length ? `Missing VAPID secrets: ${missing.join(", ")}` : "Existing VAPID keys detected and preserved.");
          NODE
          missing_count="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/vapid-missing.json','utf8')).length")"
          if [ "$missing_count" -eq 2 ]; then
            npx web-push generate-vapid-keys --json > /tmp/vapid.json
            PUB="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/vapid.json','utf8')).publicKey")"
            PRIV="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/vapid.json','utf8')).privateKey")"
            printf '%s' "$PUB" | npx wrangler secret put VAPID_PUBLIC_KEY
            printf '%s' "$PRIV" | npx wrangler secret put VAPID_PRIVATE_KEY
            echo "VAPID keys created once because both were absent."
          fi
      - name: Redeploy after secret verification
        working-directory: workers/trading-push
        run: npx wrangler deploy

      - name: Verify production push health
        working-directory: workers/trading-push
        run: |
          set -euo pipefail
          # Deployment validation is read-only; never replay real transitions
          # or broadcast notifications merely to test a backend deployment.
          curl --fail --silent --show-error --connect-timeout 5 --max-time 25 --retry 5 --retry-delay 2 https://briefrooms-trading-push.szczerbinski0577.workers.dev/health -o /tmp/push-health.json
          node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/push-health.json","utf8")); if(!j.ok || !j.ready || j.service !== "briefrooms-trading-push" || j.notification_transport_version !== "commit-bound-durable-v3" || j.durable_alarm_retry !== true || j.durable_outbox !== true || j.durable_retry !== true || j.delivery_ack_required !== false || j.delivery_ack_optional !== true || j.provider_acceptance_terminal !== true || j.device_render_ack_retry !== false || j.max_delivery_attempts !== 5 || j.max_delivery_age_ms !== 600000 || j.max_provider_accepted_sends_per_delivery !== 1 || j.inbox !== true || !j.delivery_states) { console.error(j); process.exit(1); } console.log(j)'
          curl --fail --silent --show-error --connect-timeout 5 --max-time 25 --retry 5 --retry-delay 2 \
            "https://briefrooms-trading-push.szczerbinski0577.workers.dev/inbox?limit=1" \
            -o /tmp/push-inbox.json
          node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/push-inbox.json","utf8")); if(!j.ok || j.schema_version !== "briefrooms-notification-inbox-v1" || !Array.isArray(j.events)) { console.error(j); process.exit(1); } console.log("PRODUCTION_DURABLE_INBOX_OK", j.events.length)'

      - name: Diagnose latest real Daily notification (read-only, no replay)
        run: |
          set -euo pipefail
          event_id="$(python - <<'PY'
          import json
          from pathlib import Path
          events=json.loads(Path("data/notifications/trading-events.json").read_text()).get("events",[])
          daily=[row for row in events if row.get("engine")=="daily" and row.get("event_type") in ("OPEN","CLOSE")]
          print(daily[-1].get("event_id","") if daily else "")
          PY
          )"
          if [[ ! "$event_id" =~ ^[0-9a-f]{24}$ ]]; then
            echo "DELIVERY_AUDIT no recent Daily event"
            exit 0
          fi
          code=$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
            --get --data-urlencode "event_id=$event_id" \
            -o /tmp/push-event-delivery.json -w '%{http_code}' \
            "https://briefrooms-trading-push.szczerbinski0577.workers.dev/event-delivery-summary" || true)
          python - "$code" <<'PY'
          import json,sys
          from pathlib import Path
          j=json.loads(Path("/tmp/push-event-delivery.json").read_text())
          safe={key:j.get(key) for key in (
            "ok","event_id","engine","event_type","event_at","inbox_stored_at",
            "recipients_initialized_at","recipients_initial_count",
            "seeded_without_delivery","migrated_from_legacy_complete",
            "deliveries","first_provider_accepted_at","first_device_ack_at","error"
          )}
          print("PRODUCTION_EVENT_DELIVERY_AUDIT",json.dumps(safe,separators=(",",":")))
          if sys.argv[1] not in ("200","404"):
            raise SystemExit("Unexpected delivery audit HTTP status")
          PY

      - name: Verify authenticated GitHub connection without trading transitions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --connect-timeout 5 --max-time 25 \
            --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://briefrooms-trading-push.szczerbinski0577.workers.dev/verify-commit?sha=${GITHUB_SHA}" \
            -o /tmp/push-github-verification.json -w '%{http_code}' || true)
          node - "$GITHUB_SHA" "$code" <<'NODE'
          const fs = require("fs");
          let j;
          try { j = JSON.parse(fs.readFileSync("/tmp/push-github-verification.json", "utf8")); }
          catch { console.error("GITHUB_CONNECTION_INVALID_RESPONSE"); process.exit(1); }
          const ok = process.argv[3] === "200" && j.ok === true
            && j.sha === process.argv[2] && j.authenticated === true && j.read_only === true;
          const errorCode = /^(?:GITHUB|COMMIT|INVALID|SYNC)_[A-Z0-9_]{1,64}$/.test(j.error_code || "")
            ? j.error_code : "UNCLASSIFIED_RESPONSE";
          console.log("PRODUCTION_GITHUB_CONNECTION", JSON.stringify({
            ok, sha: ok ? j.sha : null, authenticated: ok, read_only: ok,
            http_status: process.argv[3], error_code: ok ? null : errorCode,
          }));
          if (!ok) process.exit(1);
          NODE

      - name: Verify canonical production EURUSD 1m feed
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://briefrooms-trading-push.szczerbinski0577.workers.dev/market/eurusd \
            -o /tmp/eurusd-market.json
          node - <<'NODE'
          const fs=require("fs");
          const j=JSON.parse(fs.readFileSync("/tmp/eurusd-market.json","utf8"));
          const yahoo = String(j.source || "").includes("Yahoo Finance");
          const valid = j.ok === true && j.ohlc_1m === true && yahoo && Number.isFinite(Number(j.price));
          if (!valid) {
            console.error("CANONICAL_EURUSD_1M_FEED_NOT_READY", j);
            process.exit(1);
          }
          console.log("CANONICAL_EURUSD_1M_FEED_OK", j.source, j.price, j.high, j.low, j.timestamp);
          NODE

      - name: Persist public push health snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Health is derived observability state. On a concurrent main update,
          # recompute it from the fresh head instead of rebasing a stale snapshot.
          for attempt in 1 2 3 4; do
            git fetch --quiet origin main
            git reset --hard origin/main

            curl --fail --silent --show-error --retry 5 --retry-delay 2 \
              https://briefrooms-trading-push.szczerbinski0577.workers.dev/health \
              -o /tmp/push-health.json

            mkdir -p data/notifications
            node - <<'NODE'
          const fs=require("fs");
          const j=JSON.parse(fs.readFileSync("/tmp/push-health.json","utf8"));
          j.snapshot_at=new Date().toISOString();
          fs.writeFileSync("data/notifications/trading-push-health.json", JSON.stringify(j,null,2)+"\n");
          NODE

            git add data/notifications/trading-push-health.json
            if git diff --cached --quiet; then
              echo "Push health snapshot unchanged"
              exit 0
            fi

            git commit -m "Update trading push health snapshot"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Health snapshot push conflict (${attempt}/4); recomputing from fresh main."
            sleep $((attempt * 2))
          done

          echo "Unable to persist refreshed push health snapshot" >&2
          exit 1
