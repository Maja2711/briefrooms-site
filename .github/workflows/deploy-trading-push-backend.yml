name: Deploy Trading Push Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/trading-push/**"
      - ".github/workflows/deploy-trading-push-backend.yml"

permissions:
  contents: write

concurrency:
  group: deploy-trading-push-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Install backend dependencies
        working-directory: workers/trading-push
        run: npm install --no-audit --no-fund
      - name: Validate backend
        working-directory: workers/trading-push
        run: npm run check
      - name: Deploy Worker and Durable Object
        working-directory: workers/trading-push
        run: npx wrangler deploy
      - name: Bootstrap VAPID secrets once
        working-directory: workers/trading-push
        run: |
          set -euo pipefail
          npx wrangler secret list --format json > /tmp/wrangler-secrets.json
          node - <<'NODE'
          const fs = require("fs");
          const rows = JSON.parse(fs.readFileSync("/tmp/wrangler-secrets.json", "utf8"));
          const names = new Set((Array.isArray(rows) ? rows : []).map((x) => String(x?.name || "")));
          const missing = ["VAPID_PRIVATE_KEY", "VAPID_PUBLIC_KEY"].filter((name) => !names.has(name));
          fs.writeFileSync("/tmp/vapid-missing.json", JSON.stringify(missing));
          console.log(missing.length ? `Missing VAPID secrets: ${missing.join(", ")}` : "Existing VAPID keys detected and preserved.");
          NODE
          missing_count="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/vapid-missing.json','utf8')).length")"
          if [ "$missing_count" -gt 0 ]; then
            npx web-push generate-vapid-keys --json > /tmp/vapid.json
            PUB="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/vapid.json','utf8')).publicKey")"
            PRIV="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/vapid.json','utf8')).privateKey")"
            printf '%s' "$PUB" | npx wrangler secret put VAPID_PUBLIC_KEY
            printf '%s' "$PRIV" | npx wrangler secret put VAPID_PRIVATE_KEY
            echo "VAPID keys created once because one or both were genuinely missing."
          fi
      - name: Redeploy after secret verification
        working-directory: workers/trading-push
        run: npx wrangler deploy

      - name: Verify production push health
        working-directory: workers/trading-push
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://briefrooms-trading-push.szczerbinski0577.workers.dev/health -o /tmp/push-health.json
          node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/push-health.json","utf8")); if(!j.ok || !j.ready || j.durable_outbox !== true || j.durable_retry !== true || j.delivery_ack_required !== true || j.delivery_ack_optional !== false || j.provider_acceptance_terminal !== false || j.device_render_ack_retry !== true || j.max_delivery_attempts !== 5 || j.inbox !== true || !j.delivery_states) { console.error(j); process.exit(1); } console.log(j)'
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            "https://briefrooms-trading-push.szczerbinski0577.workers.dev/inbox?limit=1" \
            -o /tmp/push-inbox.json
          node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/push-inbox.json","utf8")); if(!j.ok || j.schema_version !== "briefrooms-notification-inbox-v1" || !Array.isArray(j.events)) { console.error(j); process.exit(1); } console.log("PRODUCTION_DURABLE_INBOX_OK", j.events.length)'

      - name: Verify production Daily commit sync path
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" \
              -o /tmp/main-head.json
            sha=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/main-head.json','utf8')).sha")
            code=$(curl --silent --show-error \
              -o /tmp/sync-daily.json \
              -w "%{http_code}" \
              -H "content-type: application/json" \
              --data "{\"sha\":\"$sha\",\"engines\":[\"daily\"]}" \
              https://briefrooms-trading-push.szczerbinski0577.workers.dev/sync-trading || true)
            cat /tmp/sync-daily.json
            if [ "$code" = "200" ]; then
              node - <<'NODE'
          const fs=require("fs");
          const j=JSON.parse(fs.readFileSync("/tmp/sync-daily.json","utf8"));
          const d=j.dispatch || {};
          const daily=j.engine_status?.daily || {};
          if (j.ok !== true || Number(d.failed || 0) !== 0 || Number(d.pending || 0) !== 0 ||
              !Array.isArray(j.engines) || !j.engines.includes("daily") || !Number.isFinite(Number(daily.open_after))) {
            console.error("PRODUCTION_DAILY_SYNC_NOT_READY", j);
            process.exit(1);
          }
          console.log("PRODUCTION_DAILY_SYNC_OK", j.sha, j.status, j.event_count || 0, daily.open_after, d.sent || 0);
          NODE
              exit 0
            fi
            sleep "$attempt"
          done
          echo "Production Daily sync path failed verification" >&2
          exit 1

      - name: Verify commit-bound all-channel sync endpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" \
            -o /tmp/main-head-all-channels.json
          sha=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/main-head-all-channels.json','utf8')).sha")
          code=$(curl --silent --show-error \
            -o /tmp/sync-trading.json \
            -w "%{http_code}" \
            -H "content-type: application/json" \
            --data "{\"sha\":\"$sha\",\"engines\":[\"daily\",\"weekly\",\"stock\"]}" \
            https://briefrooms-trading-push.szczerbinski0577.workers.dev/sync-trading || true)
          cat /tmp/sync-trading.json
          test "$code" = "200"
          node - <<'NODE'
          const fs=require("fs");
          const j=JSON.parse(fs.readFileSync("/tmp/sync-trading.json","utf8"));
          const d=j.dispatch || {};
          const engines=new Set(j.engines || []);
          if (j.ok !== true || Number(d.failed || 0) !== 0 || Number(d.pending || 0) !== 0 ||
              !engines.has("daily") || !engines.has("weekly") || !engines.has("stock")) {
            console.error("COMMIT_BOUND_ALL_CHANNEL_SYNC_NOT_READY", j);
            process.exit(1);
          }
          console.log("COMMIT_BOUND_ALL_CHANNEL_SYNC_OK", j.sha, j.status, j.event_count || 0, d.sent || 0);
          NODE

      - name: Verify canonical production EURUSD 1m feed
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://briefrooms-trading-push.szczerbinski0577.workers.dev/market/eurusd \
            -o /tmp/eurusd-market.json
          node - <<'NODE'
          const fs=require("fs");
          const j=JSON.parse(fs.readFileSync("/tmp/eurusd-market.json","utf8"));
          const yahoo = String(j.source || "").includes("Yahoo Finance");
          const valid = j.ok === true && j.ohlc_1m === true && yahoo && Number.isFinite(Number(j.price));
          if (!valid) {
            console.error("CANONICAL_EURUSD_1M_FEED_NOT_READY", j);
            process.exit(1);
          }
          console.log("CANONICAL_EURUSD_1M_FEED_OK", j.source, j.price, j.high, j.low, j.timestamp);
          NODE

      - name: Persist public push health snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Health is derived observability state. On a concurrent main update,
          # recompute it from the fresh head instead of rebasing a stale snapshot.
          for attempt in 1 2 3 4; do
            git fetch --quiet origin main
            git reset --hard origin/main

            curl --fail --silent --show-error --retry 5 --retry-delay 2 \
              https://briefrooms-trading-push.szczerbinski0577.workers.dev/health \
              -o /tmp/push-health.json

            mkdir -p data/notifications
            node - <<'NODE'
          const fs=require("fs");
          const j=JSON.parse(fs.readFileSync("/tmp/push-health.json","utf8"));
          j.snapshot_at=new Date().toISOString();
          fs.writeFileSync("data/notifications/trading-push-health.json", JSON.stringify(j,null,2)+"\n");
          NODE

            git add data/notifications/trading-push-health.json
            if git diff --cached --quiet; then
              echo "Push health snapshot unchanged"
              exit 0
            fi

            git commit -m "Update trading push health snapshot"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Health snapshot push conflict (${attempt}/4); recomputing from fresh main."
            sleep $((attempt * 2))
          done

          echo "Unable to persist refreshed push health snapshot" >&2
          exit 1
