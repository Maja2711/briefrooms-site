name: Patch AI Outlook Compact

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  issues: read

concurrency:
  group: patch-ai-outlook-compact
  cancel-in-progress: false

jobs:
  patch-and-deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.title == 'Patch AI Outlook compact asset'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch homepage asset URL
        run: python scripts/enforce_homepage_photo_only.py

      - name: Validate compact homepage contract
        run: |
          python -m unittest tests.test_homepage_photo_only -v
          python -m py_compile scripts/enforce_homepage_photo_only.py
          node --check scripts/homepage-photo-only.js
          grep -F '/scripts/homepage-photo-only.js?v=ai-outlook-compact-2' pl/index.html
          grep -F '/scripts/homepage-photo-only.js?v=ai-outlook-compact-2' en/index.html
          if grep -F '/scripts/homepage-photo-only.js?v=1' pl/index.html en/index.html; then
            echo 'Old cached asset version is still present.' >&2
            exit 1
          fi

      - name: Commit patched homepages
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pl/index.html en/index.html
          if git diff --cached --quiet; then
            echo 'Homepage asset URL is already current.'
          else
            git commit -m 'Publish compact AI Outlook homepages'
            git pull --rebase origin main
            git push
          fi

      - name: Request GitHub Pages build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            code="$(curl --silent --show-error \
              --output /tmp/pages-build.json \
              --write-out '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")"
            cat /tmp/pages-build.json || true
            case "$code" in
              201) exit 0 ;;
              409) sleep 10 ;;
              *) echo "Unexpected Pages response: HTTP ${code}" >&2; exit 1 ;;
            esac
          done
          exit 1

      - name: Verify production parity
        shell: bash
        run: >-
          python scripts/verify_production.py
          --expected-sha "$(git rev-parse HEAD)"
          --base-url https://briefrooms.com
          --attempts 48
          --interval 10
          --timeout 20
