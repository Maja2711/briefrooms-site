name: Experiment Registry

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/experiment_registry.py"
      - "scripts/experiment_registry_learning_extension.py"
      - "scripts/install_experiment_registry_ui.py"
      - "scripts/portfolio-10k-experiment-registry.js"
      - "scripts/portfolio-10k-experience-store.js"
      - "assets/experiment-registry.css"
      - "assets/experience-store.css"
      - "scripts/portfolio-10k-navigation-guard.js"
      - "data/investments/experiment_registry.json"
      - "data/investments/eurusd_abc_learning_public.json"
      - ".github/workflows/experiment-registry.yml"
  pull_request:
    paths:
      - "scripts/experiment_registry.py"
      - "scripts/experiment_registry_learning_extension.py"
      - "scripts/install_experiment_registry_ui.py"
      - "tests/test_experiment_registry.py"
      - "tests/test_experiment_registry_abc_learning.py"
      - "scripts/portfolio-10k-experiment-registry.js"
      - "scripts/portfolio-10k-experience-store.js"
      - "assets/experiment-registry.css"
      - "assets/experience-store.css"
      - "scripts/portfolio-10k-navigation-guard.js"
      - "data/investments/experiment_registry.json"
      - "data/investments/eurusd_abc_learning_public.json"
      - ".github/workflows/experiment-registry.yml"

permissions:
  contents: write

concurrency:
  group: experiment-registry
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registry builder
        run: |
          python -m py_compile \
            scripts/experiment_registry.py \
            scripts/experiment_registry_learning_extension.py \
            scripts/install_experiment_registry_ui.py
          python -m unittest \
            tests.test_experiment_registry \
            tests.test_experiment_registry_abc_learning -v
      - name: Build canonical registry
        run: python scripts/experiment_registry_learning_extension.py
      - name: Validate Portfolio10K UI installer
        run: |
          python scripts/install_experiment_registry_ui.py
          grep -q 'portfolio-10k-navigation-guard.js?v=7' pl/inwestycje/portfel-10k.html
          grep -q 'portfolio-10k-navigation-guard.js?v=7' en/investing/portfolio-10k.html
          grep -q 'portfolio-10k-experience-store.js?v=1' pl/inwestycje/portfel-10k.html
          grep -q 'portfolio-10k-experience-store.js?v=1' en/investing/portfolio-10k.html
      - name: Validate frontend JavaScript
        run: |
          node --check scripts/portfolio-10k-experiment-registry.js
          node --check scripts/portfolio-10k-experience-store.js
          node --check scripts/portfolio-10k-navigation-guard.js
      - name: Validate canonical registry contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/investments/experiment_registry.json').read_text())
          ids={x['id'] for x in p['experiments']}
          assert p['schema_version'] == 'briefrooms-experiment-registry-v1'
          assert p['authority']['read_only'] is True
          assert p['authority']['production_decision_influence'] is False
          assert p['authority']['automatic_promotion'] is False
          assert len(p['experiments']) == 7
          assert 'ai-tournament-2026-02' not in ids
          assert all(x['category'] != 'benchmark' for x in p['experiments'])
          assert p['benchmark_policy']['benchmark_is_experiment_category'] is False
          assert p['benchmark_policy']['fx']['applicability'] == 'NOT_APPLICABLE'
          assert p['benchmark_policy']['crypto']['applicability'] == 'NOT_APPLICABLE'
          assert all(x['system_class'] == 'LAB' for x in p['experiments'])
          assert all(x['production_impact'] is False for x in p['experiments'])
          abc=next(x for x in p['experiments'] if x['id']=='eurusd-abc-live-shadow')
          learning=(abc.get('details') or {}).get('learning_loop') or {}
          assert learning.get('automatic_policy_mutation') is False
          assert learning.get('decision_influence') is False
          print('Experiment Registry:', p['summary'])
          print('EURUSD A/B/C learning:', learning.get('episode_count'), learning.get('available'))
          PY

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh canonical registry and Portfolio10K Lab assets
        run: |
          python scripts/experiment_registry_learning_extension.py
          python scripts/install_experiment_registry_ui.py
      - name: Publish only when source state changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/experiment_registry.json pl/inwestycje/portfel-10k.html en/investing/portfolio-10k.html
          if git diff --cached --quiet; then
            echo "Experiment Registry and Lab UI already current."
            exit 0
          fi
          git commit -m "Refresh Experiment Registry"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
