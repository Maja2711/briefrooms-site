name: One-shot BRACE execution history sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-brace-execution-history-sync.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: one-shot-brace-execution-history-sync
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test history authority
        run: |
          set -euo pipefail
          python -m unittest tests.test_brace_execution_history_sync -v
          python -m py_compile scripts/install_brace_execution_history_sync.py
          node --check scripts/portfolio-10k-executed-decisions-history-sync.js

      - name: Install on PL and EN
        run: |
          set -euo pipefail
          python scripts/install_brace_execution_history_sync.py
          grep -q '/scripts/portfolio-10k-executed-decisions-history-sync.js?v=1' pl/inwestycje/portfel-10k.html
          grep -q '/scripts/portfolio-10k-executed-decisions-history-sync.js?v=1' en/investing/portfolio-10k.html

      - name: Verify latest executed decision source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/portfolio10k/paper_portfolio.json').read_text(encoding='utf-8'))
          groups={}
          for tx in p.get('transactions',[]):
              if tx.get('executed_at') and tx.get('side') in {'BUY','SELL'}:
                  groups.setdefault(tx.get('order_id') or tx.get('transaction_id'),[]).append(tx)
          latest=max(groups.values(),key=lambda rows:max(r.get('executed_at','') for r in rows))
          assert {r['side'] for r in latest} == {'BUY','SELL'}
          assert {r['instrument_id'] for r in latest} == {'spgi','jpm'}
          print('LATEST_EXECUTION_OK: SPGI.US -> JPM.US')
          PY

      - name: Commit PL and EN frontend and self-remove
        id: commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-brace-execution-history-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pl/inwestycje/portfel-10k.html \
            en/investing/portfolio-10k.html \
            .github/workflows/one-shot-brace-execution-history-sync.yml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Sync BRACE overview with executed transaction history"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt*4))
          done
          exit 1

      - name: Request fresh Pages build
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            CODE="$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")"
            if [[ "$CODE" == "201" ]]; then exit 0; fi
            if [[ "$CODE" != "409" ]]; then cat /tmp/pages.json; exit 1; fi
            sleep 10
          done
          exit 1

      - name: Verify production PL and EN
        run: |
          python - <<'PY'
          import json,time,urllib.request
          headers={'User-Agent':'BriefRooms-BRACE-history-sync/1.0','Cache-Control':'no-cache'}
          pages=[
              'https://briefrooms.com/pl/inwestycje/portfel-10k.html',
              'https://briefrooms.com/en/investing/portfolio-10k.html',
          ]
          for attempt in range(1,43):
              token=f'{int(time.time())}-{attempt}'
              try:
                  htmls=[]
                  for page in pages:
                      req=urllib.request.Request(f'{page}?v={token}',headers=headers)
                      with urllib.request.urlopen(req,timeout=20) as r:
                          htmls.append(r.read().decode('utf-8',errors='replace'))
                  req=urllib.request.Request(f'https://briefrooms.com/data/portfolio10k/paper_portfolio.json?v={token}',headers=headers)
                  with urllib.request.urlopen(req,timeout=20) as r:
                      p=json.load(r)
                  groups={}
                  for tx in p.get('transactions',[]):
                      if tx.get('executed_at') and tx.get('side') in {'BUY','SELL'}:
                          groups.setdefault(tx.get('order_id') or tx.get('transaction_id'),[]).append(tx)
                  latest=max(groups.values(),key=lambda rows:max(x.get('executed_at','') for x in rows))
                  source_ok={x['instrument_id'] for x in latest} == {'spgi','jpm'} and {x['side'] for x in latest} == {'BUY','SELL'}
                  pages_ok=all('portfolio-10k-executed-decisions-history-sync.js?v=1' in html for html in htmls)
                  if pages_ok and source_ok:
                      print('PRODUCTION_BRACE_HISTORY_SYNC_OK: PL + EN, SPGI.US -> JPM.US')
                      raise SystemExit(0)
              except Exception as exc:
                  print('attempt',attempt,type(exc).__name__,str(exc)[:160])
              time.sleep(10)
          raise SystemExit('BRACE executed-decision history sync not visible on production in time')
          PY
