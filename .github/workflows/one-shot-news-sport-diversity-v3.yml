name: One-shot news sport diversity v3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-news-sport-diversity-v3.yml"
      - "data/news/polish_sport_watchlist.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-news-sport-diversity-v3
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply source changes safely
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          def exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: exact match count={count} for {old[:90]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          def rx(path: str, pattern: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: regex match count={count} for {pattern[:90]!r}")
              p.write_text(updated, encoding="utf-8", newline="\n")

          exact("scripts/publish_live_news.py", "TARGET = 6\n", "TARGET = 9\n")

          watchlist_block = dedent(r'''
              SPORT_WATCHLIST_PATH = ROOT / "data" / "news" / "polish_sport_watchlist.json"
              SPORT_DIVERSITY_POLICY_VERSION = "pl-sport-diversity-v1"


              def _load_sport_watchlist() -> dict[str, Any]:
                  payload = json.loads(SPORT_WATCHLIST_PATH.read_text(encoding="utf-8"))
                  if payload.get("schema_version") != "pl-sport-watchlist-v1":
                      raise RuntimeError("Polish sport watchlist schema is missing or outdated")
                  if not payload.get("athletes"):
                      raise RuntimeError("Polish sport watchlist is empty")
                  return payload


              SPORT_WATCHLIST = _load_sport_watchlist()
              TRACKED_ATHLETES = sorted(
                  SPORT_WATCHLIST.get("athletes") or [],
                  key=lambda item: int(item.get("rank") or 9999),
              )
              SPORT_SELECTION_POLICY = SPORT_WATCHLIST.get("selection_policy") or {}
              MAX_STORIES_PER_TRACKED_ATHLETE = int(
                  SPORT_SELECTION_POLICY.get("max_stories_per_tracked_athlete") or 2
              )
              SOFT_MAX_STORIES_PER_DISCIPLINE = int(
                  SPORT_SELECTION_POLICY.get("soft_max_stories_per_discipline") or 4
              )


              def _alias_regex(aliases: list[str]) -> re.Pattern[str]:
                  escaped = [re.escape(str(alias).strip()) for alias in aliases if str(alias).strip()]
                  return re.compile(r"(?<!\w)(?:" + "|".join(escaped) + r")(?!\w)", re.IGNORECASE)


              TRACKED_ATHLETE_PATTERNS = [
                  (athlete, _alias_regex(list(athlete.get("aliases") or [athlete.get("name")])))
                  for athlete in TRACKED_ATHLETES
              ]
              _top_aliases = [
                  alias
                  for athlete in TRACKED_ATHLETES
                  if int(athlete.get("rank") or 9999) <= 6
                  for alias in (athlete.get("aliases") or [athlete.get("name")])
                  if alias
              ]
              POLISH_MARQUEE_RE = _alias_regex(_top_aliases)

              SPORT_DISCIPLINE_PATTERNS = (
                  ("tennis", re.compile(r"\b(?:tenis|WTA|ATP|US Open|Wimbledon|Roland Garros|Australian Open)\b", re.IGNORECASE)),
                  ("football", re.compile(r"\b(?:piłk|pilk|Liga Mistrzów|Champions League|Barcelona|La Liga|Ekstraklasa)\b", re.IGNORECASE)),
                  ("volleyball", re.compile(r"\b(?:siatk|PlusLiga|Liga Narodów|Liga Narodow)\b", re.IGNORECASE)),
                  ("speedway", re.compile(r"\b(?:żuż|zuz|speedway|Grand Prix na żużlu|Grand Prix na zuzlu)\b", re.IGNORECASE)),
                  ("athletics", re.compile(r"\b(?:lekkoatlet|młot|mlot|400 m|800 m|1500 m)\b", re.IGNORECASE)),
                  ("sport_climbing", re.compile(r"\b(?:wspinacz|climbing)\b", re.IGNORECASE)),
                  ("ski_jumping", re.compile(r"\b(?:skok(?:i|ach|ów|ow) narciarsk|Turniej Czterech Skoczni)\b", re.IGNORECASE)),
                  ("cycling", re.compile(r"\b(?:kolar|Tour de France|Giro d.Italia|Vuelta)\b", re.IGNORECASE)),
              )


              def _matched_tracked_athletes(story: dict[str, Any]) -> list[dict[str, Any]]:
                  text = _story_text(story)
                  return [
                      athlete
                      for athlete, pattern in TRACKED_ATHLETE_PATTERNS
                      if pattern.search(text)
                  ]


              def _sport_discipline(story: dict[str, Any]) -> str:
                  tracked = _matched_tracked_athletes(story)
                  if tracked:
                      best = min(tracked, key=lambda item: int(item.get("rank") or 9999))
                      if best.get("sport"):
                          return str(best["sport"])
                  text = _story_text(story)
                  for discipline, pattern in SPORT_DISCIPLINE_PATTERNS:
                      if pattern.search(text):
                          return discipline
                  return "other"


              def _tracked_rank_bonus(story: dict[str, Any]) -> float:
                  tracked = _matched_tracked_athletes(story)
                  if not tracked:
                      return 0.0
                  rank = min(int(item.get("rank") or 9999) for item in tracked)
                  return max(20.0, 125.0 - (rank - 1) * 4.5)


              POLISH_SPORT_CONTEXT_RE
          ''').lstrip()
          rx(
              "scripts/publish_live_news_filtered.py",
              r'POLISH_MARQUEE_RE = re\.compile\(.*?\n\)\nPOLISH_SPORT_CONTEXT_RE',
              watchlist_block,
          )

          scoring_block = dedent(r'''
              def sport_hot_score(
                  story: dict[str, Any],
                  now: datetime,
                  entity_support: dict[str, int] | None = None,
              ) -> float:
                  """Rank PL sport by freshness, Polish relevance and current news heat."""
                  current = now.astimezone(timezone.utc)
                  published = _published_at(story)
                  age_hours = 24.0 if published is None else max(
                      0.0, (current - published).total_seconds() / 3600.0
                  )
                  freshness = max(0.0, 60.0 - age_hours * 5.0)

                  text = _story_text(story)
                  live = _is_live_sport(story)
                  future = _is_future_sport(story)
                  tracked = _matched_tracked_athletes(story)
                  rank_bonus = _tracked_rank_bonus(story)
                  polish = bool(tracked) or bool(POLISH_SPORT_CONTEXT_RE.search(text))
                  major = bool(MAJOR_SPORT_EVENT_RE.search(text))

                  support = entity_support or {}
                  max_support = max(
                      (support.get(token, 1) for token in _sport_entities(story)),
                      default=1,
                  )
                  cross_source_heat = max(0, max_support - 1)

                  score = freshness + rank_bonus + min(cross_source_heat, 4) * 80
                  if major:
                      score += 35
                  if polish:
                      score += 35
                  if future:
                      score -= 220
                  elif live:
                      score += 50
                      if tracked:
                          score += 180 + rank_bonus * 0.35
                      elif cross_source_heat >= 1 and polish:
                          score += 280
                      elif cross_source_heat >= 2:
                          score += 180
                      elif polish:
                          score += 60
                  return score


              def _is_pl_config
          ''').lstrip()
          rx(
              "scripts/publish_live_news_filtered.py",
              r'def sport_hot_score\(.*?\n\n\ndef _is_pl_config',
              scoring_block,
          )

          selection_block = dedent(r'''
              def select_sections(
                  config: list[tuple[str, str, list[tuple[str, str]]]],
                  fetched: dict[str, list[dict[str, Any]]],
                  previous: dict[str, Any],
                  now: datetime,
              ) -> tuple[dict[str, list[dict[str, Any]]], dict[str, Any]]:
                  """Select nine stories; PL Sport additionally enforces name diversity."""
                  selected: dict[str, list[dict[str, Any]]] = {}
                  health: dict[str, Any] = {}
                  previous_sections = (
                      previous.get("sections")
                      if isinstance(previous.get("sections"), dict)
                      else {}
                  )
                  global_seen: set[str] = set()
                  pl_mode = _is_pl_config(config)

                  for section_id, _, _ in config:
                      source_candidates = list(fetched.get(section_id) or [])
                      sport_mode = pl_mode and section_id == "sport"
                      if sport_mode:
                          support = _sport_entity_support(source_candidates)
                          candidates = sorted(
                              source_candidates,
                              key=lambda story: (
                                  sport_hot_score(story, now, support),
                                  base.story_time(story),
                              ),
                              reverse=True,
                          )
                      else:
                          candidates = sorted(
                              source_candidates,
                              key=base.story_time,
                              reverse=True,
                          )

                      items: list[dict[str, Any]] = []
                      local_seen: set[str] = set()
                      athlete_counts: dict[str, int] = {}
                      discipline_counts: dict[str, int] = {}
                      live_athletes_seen: set[str] = set()
                      deferred_discipline: list[dict[str, Any]] = []

                      def try_add(story: dict[str, Any], *, discipline_cap: bool) -> str:
                          identity = base.normalized_identity(story)
                          if (
                              not identity
                              or identity in local_seen
                              or identity in global_seen
                              or not story.get("image")
                          ):
                              return "skip"

                          tracked_names: list[str] = []
                          discipline = "other"
                          if sport_mode:
                              tracked_names = [
                                  str(item.get("name") or "")
                                  for item in _matched_tracked_athletes(story)
                                  if item.get("name")
                              ]
                              if any(
                                  athlete_counts.get(name, 0) >= MAX_STORIES_PER_TRACKED_ATHLETE
                                  for name in tracked_names
                              ):
                                  return "athlete_cap"
                              discipline = _sport_discipline(story)
                              if (
                                  discipline_cap
                                  and discipline != "other"
                                  and discipline_counts.get(discipline, 0)
                                  >= SOFT_MAX_STORIES_PER_DISCIPLINE
                              ):
                                  return "discipline_cap"
                              if _is_live_sport(story) and any(
                                  name in live_athletes_seen for name in tracked_names
                              ):
                                  return "live_duplicate"

                          local_seen.add(identity)
                          global_seen.add(identity)
                          items.append(story)
                          if sport_mode:
                              for name in tracked_names:
                                  athlete_counts[name] = athlete_counts.get(name, 0) + 1
                              discipline_counts[discipline] = (
                                  discipline_counts.get(discipline, 0) + 1
                              )
                              if _is_live_sport(story):
                                  live_athletes_seen.update(tracked_names)
                          return "added"

                      for story in candidates:
                          result = try_add(story, discipline_cap=sport_mode)
                          if result == "discipline_cap":
                              deferred_discipline.append(story)
                          if len(items) >= base.TARGET:
                              break

                      if sport_mode and len(items) < base.TARGET:
                          for story in deferred_discipline:
                              try_add(story, discipline_cap=False)
                              if len(items) >= base.TARGET:
                                  break

                      carried = 0
                      if len(items) < base.TARGET:
                          old_items = (
                              previous_sections.get(section_id, [])
                              if isinstance(previous_sections.get(section_id), list)
                              else []
                          )
                          for old in old_items:
                              try:
                                  published = datetime.fromisoformat(
                                      str(old.get("published_at") or "").replace("Z", "+00:00")
                                  )
                                  if published.tzinfo is None:
                                      published = published.replace(tzinfo=timezone.utc)
                                  if now - published.astimezone(timezone.utc) > base.MAX_CARRY_AGE:
                                      continue
                              except Exception:
                                  continue
                              copy = dict(old)
                              copy["carried_forward"] = True
                              if try_add(copy, discipline_cap=False) == "added":
                                  carried += 1
                              if len(items) >= base.TARGET:
                                  break

                      if len(items) < base.TARGET:
                          raise RuntimeError(
                              f"section {section_id} has only {len(items)} publishable stories; "
                              f"target is {base.TARGET}"
                          )

                      selected[section_id] = items[:base.TARGET]
                      times = [
                          base.story_time(item)
                          for item in items
                          if base.story_time(item) > 0
                      ]
                      section_health: dict[str, Any] = {
                          "count": len(selected[section_id]),
                          "fresh_count": len(selected[section_id]) - carried,
                          "carried_count": carried,
                          "newest_source_at": (
                              datetime.fromtimestamp(max(times), tz=timezone.utc).isoformat(
                                  timespec="seconds"
                              )
                              if times
                              else None
                          ),
                      }
                      if sport_mode:
                          section_health["tracked_athletes"] = athlete_counts
                          section_health["discipline_mix"] = discipline_counts
                          section_health["diversity_policy"] = SPORT_DIVERSITY_POLICY_VERSION
                      health[section_id] = section_health

                  return selected, health


              def round_robin
          ''').lstrip()
          rx(
              "scripts/publish_live_news_filtered.py",
              r'def select_sections\(.*?\n\n\ndef round_robin',
              selection_block,
          )

          exact(
              "scripts/publish_live_news_filtered.py",
              "            if _is_live_sport(story) or POLISH_MARQUEE_RE.search(text):\n",
              "            if _is_live_sport(story) or _matched_tracked_athletes(story):\n",
          )
          exact(
              "scripts/publish_live_news_filtered.py",
              '            "mode": "live_polish_star_plus_cross_source_heat",\n'
              '            "homepage_promotion_threshold": HOME_HOT_SPORT_THRESHOLD,\n'
              '            "extra_sources": [source for source, _ in PL_SPORT_EXTRA_FEEDS],\n',
              '            "mode": "ranked_polish_athletes_plus_cross_source_heat_and_diversity",\n'
              '            "homepage_promotion_threshold": HOME_HOT_SPORT_THRESHOLD,\n'
              '            "extra_sources": [source for source, _ in PL_SPORT_EXTRA_FEEDS],\n'
              '            "watchlist_version": SPORT_WATCHLIST.get("schema_version"),\n'
              '            "watchlist_path": "/data/news/polish_sport_watchlist.json",\n'
              '            "tracked_athletes": len(TRACKED_ATHLETES),\n'
              '            "max_stories_per_tracked_athlete": MAX_STORIES_PER_TRACKED_ATHLETE,\n'
              '            "soft_max_stories_per_discipline": SOFT_MAX_STORIES_PER_DISCIPLINE,\n'
              '            "section_target": base.TARGET,\n',
          )
          exact(
              "scripts/publish_live_news_filtered.py",
              '            if hot_priority.get("mode") != "live_polish_star_plus_cross_source_heat":\n'
              '                raise RuntimeError("pl sports hot-priority policy missing or outdated")\n',
              '            if hot_priority.get("mode") != "ranked_polish_athletes_plus_cross_source_heat_and_diversity":\n'
              '                raise RuntimeError("pl sports diversity policy missing or outdated")\n'
              '            if hot_priority.get("watchlist_version") != "pl-sport-watchlist-v1":\n'
              '                raise RuntimeError("pl sports watchlist missing or outdated")\n'
              '            if int(hot_priority.get("section_target") or 0) != base.TARGET:\n'
              '                raise RuntimeError("pl sports section target is inconsistent")\n',
          )

          test_content = dedent(r'''
              from __future__ import annotations

              import unittest
              from datetime import datetime, timedelta, timezone

              from scripts import publish_live_news as base
              from scripts import publish_live_news_filtered as news


              def story(title: str, index: int, now: datetime) -> dict:
                  return {
                      "title": title,
                      "link": f"https://example.com/sport-{index}",
                      "image": f"https://example.com/sport-{index}.jpg",
                      "source": f"Source {index % 4}",
                      "summary": title,
                      "published_at": (now - timedelta(minutes=index)).isoformat(),
                      "published_at_basis": "source",
                  }


              class PolishSportDiversityTests(unittest.TestCase):
                  def test_target_and_watchlist(self) -> None:
                      self.assertEqual(base.TARGET, 9)
                      names = {item["name"] for item in news.TRACKED_ATHLETES}
                      self.assertIn("Hubert Hurkacz", names)
                      self.assertIn("Maja Chwalińska", names)

                  def test_graduated_priority(self) -> None:
                      now = datetime(2026, 9, 1, 9, 0, tzinfo=timezone.utc)
                      hurkacz = story("Hubert Hurkacz w turnieju ATP", 1, now)
                      chwalinska = story("Maja Chwalińska w turnieju WTA", 1, now)
                      self.assertGreater(
                          news.sport_hot_score(hurkacz, now),
                          news.sport_hot_score(chwalinska, now),
                      )

                  def test_diverse_nine(self) -> None:
                      now = datetime(2026, 9, 1, 9, 0, tzinfo=timezone.utc)
                      sport = [
                          story(f"Iga Świątek wiadomość {i} z US Open", i, now)
                          for i in range(6)
                      ] + [
                          story("Hubert Hurkacz wraca do ATP", 20, now),
                          story("Maja Chwalińska awansuje w WTA", 21, now),
                          story("Robert Lewandowski zdobywa bramkę dla Barcelony", 22, now),
                          story("Tomasz Fornal prowadzi Polskę w siatkówce", 23, now),
                          story("Bartosz Zmarzlik wygrywa Grand Prix na żużlu", 24, now),
                          story("Natalia Bukowiecka w finale 400 m", 25, now),
                          story("Katarzyna Niewiadoma na trasie wyścigu kolarskiego", 26, now),
                          story("Polski zespół z ważnym zwycięstwem", 27, now),
                      ]
                      politics = [
                          story(f"Polityka {i}", 100 + i, now)
                          for i in range(9)
                      ]
                      selected, _ = news.select_sections(
                          [("polityka", "Polityka", []), ("sport", "Sport", [])],
                          {"polityka": politics, "sport": sport},
                          {"sections": {}},
                          now,
                      )
                      rows = selected["sport"]
                      self.assertEqual(len(rows), 9)
                      self.assertLessEqual(
                          sum("Świątek" in item["title"] for item in rows),
                          2,
                      )
                      titles = " ".join(item["title"] for item in rows)
                      self.assertIn("Hubert Hurkacz", titles)
                      self.assertIn("Maja Chwalińska", titles)
                      tracked = {
                          athlete["name"]
                          for item in rows
                          for athlete in news._matched_tracked_athletes(item)
                      }
                      self.assertGreaterEqual(len(tracked), 5)


              if __name__ == "__main__":
                  unittest.main()
          ''').lstrip()
          Path("tests/test_news_sport_diversity.py").write_text(
              test_content,
              encoding="utf-8",
              newline="\n",
          )
          PY
      - name: Test migration
        run: |
          set -euo pipefail
          python -m pip install --quiet feedparser requests
          python -m py_compile scripts/publish_live_news.py scripts/publish_live_news_filtered.py
          python -m unittest tests.test_publish_live_news tests.test_news_sport_diversity -v
      - name: Commit source changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/publish_live_news.py scripts/publish_live_news_filtered.py tests/test_news_sport_diversity.py data/news/polish_sport_watchlist.json
          git commit -m "fix(news): enforce sport diversity and nine-card sections"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep $((attempt * 3)); continue; }
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          exit 1
