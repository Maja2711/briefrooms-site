name: Audit PR17 Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/audit-pr17-runtime.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify first post-merge PR17 production artifact
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_AT: "2026-08-20T12:16:14Z"
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, os, subprocess, tarfile, tempfile, time, urllib.parse, urllib.request, zipfile
          from datetime import datetime
          from pathlib import Path

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          merged_at=datetime.fromisoformat(os.environ['MERGED_AT'].replace('Z','+00:00'))
          headers={
              'Authorization': f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'BriefRooms-PR17-Runtime-Audit/1.0',
          }
          def dt(x): return datetime.fromisoformat(str(x).replace('Z','+00:00'))
          def api_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          def api_bytes(url):
              p=subprocess.run([
                  'curl','-fsSL','-L',
                  '-H',f'Authorization: Bearer {token}',
                  '-H','Accept: application/vnd.github+json',
                  '-H','X-GitHub-Api-Version: 2022-11-28',url,
              ],check=True,stdout=subprocess.PIPE)
              return p.stdout

          name='brace-entity-belief-shadow-bridge-state'
          q=urllib.parse.quote(name,safe='')
          artifact=None
          for _ in range(48):
              data=api_json(f'https://api.github.com/repos/{repo}/actions/artifacts?name={q}&per_page=100')
              rows=[x for x in data.get('artifacts',[]) if not x.get('expired')]
              rows.sort(key=lambda x:x.get('created_at',''), reverse=True)
              if rows and dt(rows[0]['created_at']) >= merged_at:
                  artifact=rows[0]
                  break
              time.sleep(5)
          assert artifact is not None, 'No fresh PR17 artifact after merge'
          run_id=(artifact.get('workflow_run') or {}).get('id')
          assert run_id, artifact
          run=api_json(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}')
          assert run.get('status')=='completed' and run.get('conclusion')=='success', run
          assert run.get('name')=='BRACE Entity Belief Prospective Shadow Bridge', run.get('name')

          raw=api_bytes(artifact['archive_download_url'])
          with tempfile.TemporaryDirectory() as tmp:
              root=Path(tmp)
              with zipfile.ZipFile(io.BytesIO(raw)) as zf: zf.extractall(root/'zip')
              tgz=root/'zip'/'brace-entity-belief-shadow-bridge-state.tgz'
              assert tgz.exists()
              out=root/'state'; out.mkdir()
              with tarfile.open(tgz,'r:gz') as tf: tf.extractall(out,filter='data')
              report=json.loads((out/'BRACE_ENTITY_BELIEF_WITH_WITHOUT_REPORT.json').read_text())
              state=json.loads((out/'BRACE_ENTITY_BELIEF_SHADOW_BRIDGE_STATE.json').read_text())

              assert report['mode']=='research_shadow'
              assert report['bridge_phase']=='A_COMPUTED_NOT_CONSUMED'
              assert report['active_decision_influence'] is False
              assert report['primary_modifier_contract']['score_point_ceiling']==2.0
              assert report['primary_modifier_contract']['engine_consumes_modifier'] is False
              assert report['primary_modifier_contract']['candidate_ranking_override'] is False
              assert report['primary_modifier_contract']['new_sizing_instruction'] is False
              assert report['primary_modifier_contract']['veto'] is False
              assert report['primary_modifier_contract']['forced_exit'] is False
              assert report['promotion_readiness']['status']=='NOT_ELIGIBLE_FOR_PROMOTION_REVIEW'
              assert report['promotion_readiness']['eligible_for_promotion_review'] is False
              assert report['promotion_readiness']['automatic_promotion'] is False
              assert report['promotion_evidence_standard']['effective_n_threshold_defined_here'] is False
              assert report['safety_controls'] and all(v is False for v in report['safety_controls'].values())

              econ=report['with_without_economics']
              assert 'ENGINE_ORIGINAL_WITHOUT_BELIEF' in econ
              assert 'ENGINE_PLUS_HYPOTHETICAL_BELIEF_WITH_BELIEF' in econ
              assert 'DELTA' in econ
              assert set(econ['required_drawdown_fields'])=={
                  'max_drawdown_without','max_drawdown_with','drawdown_change','drawdown_improvement'
              }
              assert econ['transaction_cost_bps']==5.0
              assert econ['horizon_days']==7
              assert report['anti_hindsight']['historical_decision_backfill'] is False
              assert report['anti_hindsight']['historical_belief_backfill'] is False
              assert report['anti_hindsight']['forecast_must_have_prospective_pr16_1_binding'] is True
              assert report['anti_hindsight']['decision_world_state_must_preexist_decision'] is True

              pre=set(state.get('pre_activation_decision_set_ids') or [])
              paired_ids={x['decision_set_id'] for x in (state.get('pair_sets') or {}).values()}
              assert not (pre & paired_ids)
              for pair in (state.get('pair_sets') or {}).values():
                  assert pair['engine_consumed_belief'] is False
                  assert pair['hypothetical_only'] is True
                  assert pair['historical_backfill'] is False
                  assert pair['promotion_authority'] is False
                  for item in pair['items']:
                      assert abs(float(item['belief_modifier_score_points'])) <= 2.0 + 1e-12
                      if item['without_action']=='EXIT': assert item['with_action']=='EXIT'
                      if item['with_action_raw']=='EXIT' and item['without_action']!='EXIT': assert item['with_action']!='EXIT'

              print('PR17_RUNTIME_AUDIT=PASS')
              print(json.dumps({
                  'run_id':run_id,
                  'event':run.get('event'),
                  'artifact_id':artifact['id'],
                  'artifact_created_at':artifact['created_at'],
                  'activation_only_this_run':report['sample']['activation_only_this_run'],
                  'decision_sets_seen_total':report['sample']['decision_sets_seen_total'],
                  'pre_activation_decision_sets_total':report['sample']['pre_activation_decision_sets_total'],
                  'pair_sets_total':report['sample']['pair_sets_total'],
                  'terminal_unpaired_sets_total':report['sample']['terminal_unpaired_sets_total'],
                  'economic_outcomes_total':report['sample']['economic_outcomes_total'],
                  'matured_economic_outcomes':report['sample']['matured_economic_outcomes'],
                  'without_pnl':econ['ENGINE_ORIGINAL_WITHOUT_BELIEF']['pnl_pln'],
                  'with_pnl':econ['ENGINE_PLUS_HYPOTHETICAL_BELIEF_WITH_BELIEF']['pnl_pln'],
                  'delta_pnl':econ['DELTA']['pnl_pln'],
                  'status':report['promotion_readiness']['status'],
              },indent=2,sort_keys=True))
          PY
