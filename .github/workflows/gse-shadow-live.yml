name: Geopolitical Scenario Engine Shadow

on:
  workflow_dispatch:
    inputs:
      force_freeze:
        description: "Force a forecast freeze outside the normal 6-hour window"
        required: false
        default: "false"
  push:
    branches: [main]
    paths:
      - ".github/workflows/gse-shadow-live.yml"
      - "scripts/geopolitical_scenario_engine.py"
      - "scripts/gse_historical_analogue.py"
      - "data/gse/historical_event_catalog.json"
      - "tests/test_geopolitical_scenario_engine.py"
      - "tests/test_gse_historical_analogue.py"
      - "docs/GEOPOLITICAL_SCENARIO_ENGINE.md"
      - "docs/GSE_HISTORICAL_ANALOGUE_V2.md"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: gse-live-shadow
  cancel-in-progress: false

env:
  ARTIFACT_NAME: gse-shadow-state

jobs:
  gse-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current production code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare GSE state directory
        run: |
          echo "GSE_STATE_DIR=$RUNNER_TEMP/gse_state" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/gse_state"

      - name: Restore latest cumulative GSE state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > "$RUNNER_TEMP/gse-artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/gse-artifacts.json" <<'PY'
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text())
          rows=[x for x in payload.get("artifacts", []) if not x.get("expired")]
          rows.sort(key=lambda x: x.get("created_at", ""), reverse=True)
          print(rows[0]["id"] if rows else "")
          PY
          )
          if [ -z "$artifact_id" ]; then
            echo "No previous GSE artifact; bootstrapping a new shadow state."
            exit 0
          fi
          echo "Restoring GSE artifact id=$artifact_id"
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o "$RUNNER_TEMP/gse-state.zip"
          mkdir -p "$RUNNER_TEMP/gse-artifact"
          unzip -q "$RUNNER_TEMP/gse-state.zip" -d "$RUNNER_TEMP/gse-artifact"
          test -f "$RUNNER_TEMP/gse-artifact/gse-state.tgz"
          tar -xzf "$RUNNER_TEMP/gse-artifact/gse-state.tgz" -C "$GSE_STATE_DIR"

      - name: Validate GSE v1 and historical analogue v2 code
        run: |
          python -m py_compile \
            scripts/geopolitical_scenario_engine.py \
            scripts/gse_historical_analogue.py
          python -m unittest \
            tests.test_geopolitical_scenario_engine \
            tests.test_gse_historical_analogue -v
          python - <<'PY'
          import geopolitical_scenario_engine as gse
          import gse_historical_analogue as v2
          assert gse.MODE == 'shadow'
          assert gse.FORECAST_HORIZONS_H == (24, 168, 720)
          assert gse.FREEZE_HOURS_UTC == (0, 6, 12, 18)
          assert v2.MODE == 'shadow'
          assert v2.MAX_OVERLAY_WEIGHT == 0.20
          print('GSE v1/v2 safety and cadence invariants: PASS')
          PY
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts

      - name: Run GSE v1 shadow cycle
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          args=(--state-dir "$GSE_STATE_DIR")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_freeze }}" = "true" ]; then
            args+=(--force-freeze)
          fi
          python scripts/geopolitical_scenario_engine.py "${args[@]}"

      - name: Resolve latest historical catalogue
        run: |
          if [ -f "$GSE_STATE_DIR/gse_historical_event_catalog_effective.json" ]; then
            echo "GSE_HISTORICAL_CATALOG=$GSE_STATE_DIR/gse_historical_event_catalog_effective.json" >> "$GITHUB_ENV"
            echo "Using expanded machine-verified historical catalogue."
          else
            echo "GSE_HISTORICAL_CATALOG=$GITHUB_WORKSPACE/data/gse/historical_event_catalog.json" >> "$GITHUB_ENV"
            echo "Using curated historical catalogue fallback."
          fi

      - name: Run GSE historical analogue v2 research overlay
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          python scripts/gse_historical_analogue.py \
            --state-dir "$GSE_STATE_DIR" \
            --catalog "$GSE_HISTORICAL_CATALOG"

      - name: Validate persisted GSE v1 and v2 shadow state
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['GSE_STATE_DIR'])
          state=json.loads((root/'gse_state.json').read_text())
          calibration=json.loads((root/'gse_calibration.json').read_text())
          v2_state=json.loads((root/'gse_v2_state.json').read_text())
          v2_calibration=json.loads((root/'gse_v2_calibration.json').read_text())
          library=json.loads((root/'gse_historical_analogue_library.json').read_text())
          assert state['schema_version'] == 1
          assert state['mode'] == 'shadow'
          controls=state['controls']
          assert controls['trade_execution_enabled'] is False
          assert controls['policy_output_enabled'] is False
          assert controls['automatic_tuning_enabled'] is False
          assert controls['decision_engine_connected'] is False
          assert calibration['automatic_tuning_enabled'] is False
          assert v2_state['mode'] == 'shadow'
          assert v2_state['controls']['v1_forecast_modified'] is False
          assert v2_state['controls']['trade_execution_enabled'] is False
          assert v2_state['controls']['policy_output_enabled'] is False
          assert v2_state['controls']['automatic_tuning_enabled'] is False
          assert v2_state['controls']['decision_engine_connected'] is False
          assert v2_state['controls']['belief_core_connected'] is False
          assert v2_calibration['controls']['v1_forecast_modified'] is False
          assert v2_calibration['controls']['automatic_tuning_enabled'] is False
          assert library['decision_influence'] is False
          assert library['automatic_tuning_enabled'] is False
          discovery=root/'gse_historical_discovery_state.json'
          if discovery.exists():
              d=json.loads(discovery.read_text())
              c=d['controls']
              assert c['market_outcomes_used_for_event_selection'] is False
              assert c['automatic_tuning_enabled'] is False
              assert c['decision_engine_connected'] is False
              assert c['belief_core_connected'] is False
              assert c['trade_execution_enabled'] is False
              assert c['policy_output_enabled'] is False
              if d.get('target_met'):
                  assert int(d['effective_verified_cluster_n']) >= 100
          print('GSE persisted v1/v2 shadow validation: PASS')
          print('GSE historical catalogue:', os.environ.get('GSE_HISTORICAL_CATALOG'))
          print('GSE v1 last status:', state['last_status'])
          print('GSE v2 state:', v2_state)
          print('GSE v2 paired calibration:', v2_calibration['overall'])
          PY

      - name: Pack cumulative GSE state
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/gse-state.tgz" -C "$GSE_STATE_DIR" .
          ls -lh "$RUNNER_TEMP/gse-state.tgz"

      - name: Store cumulative GSE shadow state
        uses: actions/upload-artifact@v4
        with:
          name: gse-shadow-state
          path: ${{ runner.temp }}/gse-state.tgz
          if-no-files-found: error
          retention-days: 60
          compression-level: 0

      - name: Keep rolling GSE backups
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > "$RUNNER_TEMP/gse-artifacts-after.json"
          python - "$RUNNER_TEMP/gse-artifacts-after.json" > "$RUNNER_TEMP/gse-delete.txt" <<'PY'
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text())
          rows=[x for x in payload.get('artifacts', []) if not x.get('expired')]
          rows.sort(key=lambda x: x.get('created_at',''), reverse=True)
          for row in rows[72:]:
              print(row['id'])
          PY
          while read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            curl -fsSL -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done < "$RUNNER_TEMP/gse-delete.txt"
