name: Geopolitical Scenario Engine Shadow

on:
  workflow_dispatch:
    inputs:
      force_freeze:
        description: "Force a forecast freeze outside the normal 6-hour window"
        required: false
        default: "false"
  push:
    branches: [main]
    paths:
      - ".github/workflows/gse-shadow-live.yml"
      - "scripts/geopolitical_scenario_engine.py"
      - "scripts/gse_historical_analogue.py"
      - "scripts/gse_v2_learning_loop.py"
      - "scripts/gse_v2_fast_cycle.py"
      - "scripts/gse_publish_learning_review_status.py"
      - "scripts/gse_v2_public_lab_projection.py"
      - "scripts/gse-lab.js"
      - "data/gse/historical_event_catalog.json"
      - "tests/test_geopolitical_scenario_engine.py"
      - "tests/test_gse_historical_analogue.py"
      - "tests/test_gse_v2_fast_cycle.py"
      - "tests/test_gse_publish_learning_review_status.py"
      - "tests/test_gse_v2_public_lab_projection.py"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: gse-live-shadow
  cancel-in-progress: false

env:
  ARTIFACT_NAME: gse-shadow-state
  PUBLIC_REVIEW_STATUS_PATH: data/gse/gse_v2_learning_review_status.json
  PUBLIC_LAB_PATH: data/gse/gse_v2_lab_public.json

jobs:
  gse-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare GSE state
        run: |
          echo "GSE_STATE_DIR=$RUNNER_TEMP/gse_state" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/gse_state"

      - name: Restore latest cumulative GSE state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$api" > "$RUNNER_TEMP/gse-artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/gse-artifacts.json" <<'PY'
          import json,sys
          from pathlib import Path
          p=json.loads(Path(sys.argv[1]).read_text())
          rows=[x for x in p.get('artifacts',[]) if not x.get('expired')]
          rows.sort(key=lambda x:x.get('created_at',''), reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
          )
          if [ -n "$artifact_id" ]; then
            curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$RUNNER_TEMP/gse-state.zip"
            mkdir -p "$RUNNER_TEMP/gse-artifact"
            unzip -q "$RUNNER_TEMP/gse-state.zip" -d "$RUNNER_TEMP/gse-artifact"
            test -f "$RUNNER_TEMP/gse-artifact/gse-state.tgz"
            tar -xzf "$RUNNER_TEMP/gse-artifact/gse-state.tgz" -C "$GSE_STATE_DIR"
          fi

      - name: Validate hourly GSE pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/geopolitical_scenario_engine.py scripts/gse_historical_analogue.py scripts/gse_v2_learning_loop.py scripts/gse_v2_fast_cycle.py scripts/gse_publish_learning_review_status.py scripts/gse_v2_public_lab_projection.py
          python -m unittest tests.test_geopolitical_scenario_engine tests.test_gse_historical_analogue tests.test_gse_v2_fast_cycle tests.test_gse_publish_learning_review_status tests.test_gse_v2_public_lab_projection -v
          node --check scripts/gse-lab.js

      - name: Run GSE v1 scan forecast and verification
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          args=(--state-dir "$GSE_STATE_DIR")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_freeze }}" = "true" ]; then args+=(--force-freeze); fi
          python scripts/geopolitical_scenario_engine.py "${args[@]}"

      - name: Resolve latest historical catalogue
        run: |
          if [ -f "$GSE_STATE_DIR/gse_historical_event_catalog_effective.json" ]; then
            echo "GSE_HISTORICAL_CATALOG=$GSE_STATE_DIR/gse_historical_event_catalog_effective.json" >> "$GITHUB_ENV"
          else
            echo "GSE_HISTORICAL_CATALOG=$GITHUB_WORKSPACE/data/gse/historical_event_catalog.json" >> "$GITHUB_ENV"
          fi

      - name: Ensure historical research bootstrap exists
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          if [ ! -s "$GSE_STATE_DIR/gse_v2_historical_walkforward.json" ] || [ ! -s "$GSE_STATE_DIR/gse_v2_policy_proposal.json" ] || [ ! -s "$GSE_STATE_DIR/gse_v2_enriched_library.json" ]; then
            echo "Advanced cache missing; running one full bootstrap cycle."
            python scripts/gse_historical_analogue.py --state-dir "$GSE_STATE_DIR" --catalog "$GSE_HISTORICAL_CATALOG"
            python scripts/gse_v2_learning_loop.py --state-dir "$GSE_STATE_DIR" --catalog "$GSE_HISTORICAL_CATALOG" --refresh-days 7
            echo "GSE_BOOTSTRAPPED=1" >> "$GITHUB_ENV"
          else
            echo "GSE_BOOTSTRAPPED=0" >> "$GITHUB_ENV"
          fi

      - name: Run fast prospective GSE v2 learning
        if: env.GSE_BOOTSTRAPPED != '1'
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python scripts/gse_v2_fast_cycle.py --state-dir "$GSE_STATE_DIR" --catalog "$GSE_HISTORICAL_CATALOG"

      - name: Prove a fresh Learning Ledger row exists
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          root=Path(os.environ['GSE_STATE_DIR'])
          g=json.loads((root/'gse_state.json').read_text())
          rows=[json.loads(x) for x in (root/'gse_v2_learning_ledger.jsonl').read_text().splitlines() if x.strip()]
          assert rows
          def dt(v): return datetime.fromisoformat(str(v).replace('Z','+00:00')).astimezone(timezone.utc)
          scan=dt(g['last_run_at']); learning=max(dt(x['recorded_at']) for x in rows); now=datetime.now(timezone.utc)
          assert learning >= scan-timedelta(minutes=2), (scan,learning)
          assert now-learning < timedelta(minutes=20), learning
          print('scan=',scan.isoformat(),'learning=',learning.isoformat(),'cycles=',len(rows))
          PY

      - name: Build review status
        id: review
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          previous=""
          if [ -f "$PUBLIC_REVIEW_STATUS_PATH" ]; then previous="$PUBLIC_REVIEW_STATUS_PATH"; fi
          python scripts/gse_publish_learning_review_status.py --state-dir "$GSE_STATE_DIR" --output "$PUBLIC_REVIEW_STATUS_PATH" ${previous:+--previous "$previous"}
          cp "$PUBLIC_REVIEW_STATUS_PATH" "$GSE_STATE_DIR/gse_v2_learning_review_status.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          from pathlib import Path
          p=json.loads(Path(os.environ['PUBLIC_REVIEW_STATUS_PATH']).read_text())
          print(f"required={str(bool(p.get('review_required'))).lower()}")
          print(f"transition={p.get('transition') or 'unknown'}")
          PY

      - name: Build public Lab from this exact state
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/gse_v2_public_lab_projection.py --state-dir "$GSE_STATE_DIR" --catalog "$GSE_HISTORICAL_CATALOG" --output "$PUBLIC_LAB_PATH"
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          p=json.loads(Path(os.environ['PUBLIC_LAB_PATH']).read_text())
          assert p['schema_version']=='gse-v2-public-lab-v2'
          assert p['engine']['decision_influence'] is False
          assert p['learning_timeline']
          def dt(v): return datetime.fromisoformat(str(v).replace('Z','+00:00')).astimezone(timezone.utc)
          assert dt(p['activity']['last_learning_at']) >= dt(p['activity']['last_scan_at'])-timedelta(minutes=2)
          assert datetime.now(timezone.utc)-dt(p['activity']['last_learning_at']) < timedelta(minutes=20)
          print('activity=',p['activity'])
          print('latest_learning=',p['learning_timeline'][0])
          PY

      - name: Validate zero-authority and ledger chain
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import gse_v2_learning_loop as l
          root=Path(os.environ['GSE_STATE_DIR']); s=json.loads((root/'gse_v2_learning_state.json').read_text()); c=s['controls']
          assert s['mode']=='shadow'; assert not c['automatic_tuning_enabled']; assert not c['automatic_promotion_enabled']; assert not c['decision_engine_connected']; assert not c['belief_core_connected']; assert not c['trade_execution_enabled']; assert not c['policy_output_enabled']
          l._validate_ledger(l.read_jsonl(root/'gse_v2_learning_ledger.jsonl'))
          PY

      - name: Pack exact post-learning state
        run: tar -czf "$RUNNER_TEMP/gse-state.tgz" -C "$GSE_STATE_DIR" .

      - name: Store exact post-learning state
        uses: actions/upload-artifact@v4
        with:
          name: gse-shadow-state
          path: ${{ runner.temp }}/gse-state.tgz
          if-no-files-found: error
          retention-days: 60
          compression-level: 0

      - name: Publish every cycle to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$PUBLIC_REVIEW_STATUS_PATH" "$PUBLIC_LAB_PATH"
          if git diff --cached --quiet; then echo "No public diff."; exit 0; fi
          git commit -m "Update GSE learning cycle and Lab projection"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; sleep $((attempt*2)); continue; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1

      - name: Notify human review
        if: steps.review.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_TRANSITION: ${{ steps.review.outputs.transition }}
        run: |
          title="GSE v2 human review required"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          body="GSE v2 requires human review. Transition: ${REVIEW_TRANSITION}. No parameter was automatically applied; GSE remains shadow-only. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -z "$issue" ]; then gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; elif [ "$REVIEW_TRANSITION" != "unchanged" ]; then gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"; fi

      - name: Workflow summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,os
          from pathlib import Path
          p=Path(os.environ['PUBLIC_LAB_PATH'])
          print('## GSE hourly learning cycle')
          if p.exists():
              d=json.loads(p.read_text()); a=d.get('activity') or {}; s=d.get('summary') or {}
              print(f"- Last scan: `{a.get('last_scan_at')}`")
              print(f"- Last learning: `{a.get('last_learning_at')}`")
              print(f"- Last verification: `{a.get('last_verification_at')}`")
              print(f"- Learning cycles: `{s.get('learning_cycles')}`")
          PY
