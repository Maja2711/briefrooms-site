name: Geopolitical Scenario Engine Shadow

on:
  workflow_dispatch:
    inputs:
      force_freeze:
        description: "Force a forecast freeze outside the normal 6-hour window"
        required: false
        default: "false"
  push:
    branches: [main]
    paths:
      - ".github/workflows/gse-shadow-live.yml"
      - "scripts/geopolitical_scenario_engine.py"
      - "scripts/gse_historical_analogue.py"
      - "scripts/gse_v2_learning_loop.py"
      - "scripts/gse_publish_learning_review_status.py"
      - "scripts/gse_v2_public_lab_projection.py"
      - "scripts/gse-lab.js"
      - "data/gse/historical_event_catalog.json"
      - "tests/test_geopolitical_scenario_engine.py"
      - "tests/test_gse_historical_analogue.py"
      - "tests/test_gse_v2_learning_loop.py"
      - "tests/test_gse_publish_learning_review_status.py"
      - "tests/test_gse_v2_public_lab_projection.py"
      - "pl/geo/gse-lab.html"
      - "en/geo/gse-lab.html"
      - "docs/GEOPOLITICAL_SCENARIO_ENGINE.md"
      - "docs/GSE_HISTORICAL_ANALOGUE_V2.md"
      - "docs/GSE_V2_ADVANCED_LEARNING_LOOP.md"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: gse-live-shadow
  cancel-in-progress: false

env:
  ARTIFACT_NAME: gse-shadow-state
  PUBLIC_REVIEW_STATUS_PATH: data/gse/gse_v2_learning_review_status.json
  PUBLIC_LAB_PATH: data/gse/gse_v2_lab_public.json

jobs:
  gse-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout current production code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare GSE state directory
        run: |
          echo "GSE_STATE_DIR=$RUNNER_TEMP/gse_state" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/gse_state"

      - name: Restore latest cumulative GSE state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > "$RUNNER_TEMP/gse-artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/gse-artifacts.json" <<'PY'
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text())
          rows=[x for x in payload.get("artifacts", []) if not x.get("expired")]
          rows.sort(key=lambda x: x.get("created_at", ""), reverse=True)
          print(rows[0]["id"] if rows else "")
          PY
          )
          if [ -z "$artifact_id" ]; then
            echo "No previous GSE artifact; bootstrapping a new shadow state."
            exit 0
          fi
          echo "Restoring GSE artifact id=$artifact_id"
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o "$RUNNER_TEMP/gse-state.zip"
          mkdir -p "$RUNNER_TEMP/gse-artifact"
          unzip -q "$RUNNER_TEMP/gse-state.zip" -d "$RUNNER_TEMP/gse-artifact"
          test -f "$RUNNER_TEMP/gse-artifact/gse-state.tgz"
          tar -xzf "$RUNNER_TEMP/gse-artifact/gse-state.tgz" -C "$GSE_STATE_DIR"

      - name: Validate complete GSE pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/geopolitical_scenario_engine.py \
            scripts/gse_historical_analogue.py \
            scripts/gse_v2_learning_loop.py \
            scripts/gse_publish_learning_review_status.py \
            scripts/gse_v2_public_lab_projection.py
          python -m json.tool data/gse/historical_event_catalog.json >/dev/null
          python -m unittest \
            tests.test_geopolitical_scenario_engine \
            tests.test_gse_historical_analogue \
            tests.test_gse_v2_learning_loop \
            tests.test_gse_publish_learning_review_status \
            tests.test_gse_v2_public_lab_projection -v
          node --check scripts/gse-lab.js
          python - <<'PY'
          import geopolitical_scenario_engine as gse
          import gse_historical_analogue as analogue
          import gse_v2_learning_loop as learning
          assert gse.MODE == 'shadow'
          assert gse.FORECAST_HORIZONS_H == (24, 168, 720)
          assert gse.FREEZE_HOURS_UTC == (0, 6, 12, 18)
          assert analogue.MODE == 'shadow'
          assert analogue.MAX_OVERLAY_WEIGHT == 0.20
          assert learning.MODE == 'shadow'
          assert learning.HORIZONS_H == (24, 168, 720)
          assert learning.ACTIVE_RESEARCH_POLICY['max_overlay_weight'] <= 0.20
          print('Complete GSE safety invariants: PASS')
          PY

      - name: Run GSE v1 shadow scan forecast and verification cycle
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          args=(--state-dir "$GSE_STATE_DIR")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_freeze }}" = "true" ]; then
            args+=(--force-freeze)
          fi
          python scripts/geopolitical_scenario_engine.py "${args[@]}"

      - name: Resolve latest historical catalogue
        run: |
          if [ -f "$GSE_STATE_DIR/gse_historical_event_catalog_effective.json" ]; then
            echo "GSE_HISTORICAL_CATALOG=$GSE_STATE_DIR/gse_historical_event_catalog_effective.json" >> "$GITHUB_ENV"
            echo "Using expanded machine-verified historical catalogue."
          else
            echo "GSE_HISTORICAL_CATALOG=$GITHUB_WORKSPACE/data/gse/historical_event_catalog.json" >> "$GITHUB_ENV"
            echo "Using curated historical catalogue fallback."
          fi

      - name: Run GSE historical analogue research overlay
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          python scripts/gse_historical_analogue.py \
            --state-dir "$GSE_STATE_DIR" \
            --catalog "$GSE_HISTORICAL_CATALOG"

      - name: Run advanced GSE v2 learning loop
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          python scripts/gse_v2_learning_loop.py \
            --state-dir "$GSE_STATE_DIR" \
            --catalog "$GSE_HISTORICAL_CATALOG" \
            --refresh-days 7

      - name: Prove this run wrote a fresh Learning Ledger cycle
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          root=Path(os.environ['GSE_STATE_DIR'])
          gse=json.loads((root/'gse_state.json').read_text())
          ledger=[]
          for line in (root/'gse_v2_learning_ledger.jsonl').read_text().splitlines():
              if line.strip(): ledger.append(json.loads(line))
          assert ledger, 'Learning Ledger is empty'
          def dt(value):
              return datetime.fromisoformat(str(value).replace('Z','+00:00')).astimezone(timezone.utc)
          scan=dt(gse['last_run_at'])
          latest=max((dt(row['recorded_at']) for row in ledger))
          now=datetime.now(timezone.utc)
          assert latest >= scan - timedelta(minutes=2), f'Latest learning {latest} predates scan {scan}'
          assert now - latest < timedelta(minutes=30), f'Learning cycle is stale: {latest}'
          print('Fresh GSE learning cycle:', latest.isoformat())
          print('GSE scan:', scan.isoformat())
          print('Learning cycles:', len(ledger))
          PY

      - name: Build auditable review status
        id: review_status
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          previous=""
          if [ -f "$PUBLIC_REVIEW_STATUS_PATH" ]; then previous="$PUBLIC_REVIEW_STATUS_PATH"; fi
          python scripts/gse_publish_learning_review_status.py \
            --state-dir "$GSE_STATE_DIR" \
            --output "$PUBLIC_REVIEW_STATUS_PATH" \
            ${previous:+--previous "$previous"}
          cp "$PUBLIC_REVIEW_STATUS_PATH" "$GSE_STATE_DIR/gse_v2_learning_review_status.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          p=json.loads(Path(os.environ['PUBLIC_REVIEW_STATUS_PATH']).read_text())
          print(f"review_required={str(bool(p.get('review_required'))).lower()}")
          print(f"transition={p.get('transition') or 'unknown'}")
          PY

      - name: Build safe public GSE Lab projection from this exact cycle
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/gse_v2_public_lab_projection.py \
            --state-dir "$GSE_STATE_DIR" \
            --catalog "$GSE_HISTORICAL_CATALOG" \
            --output "$PUBLIC_LAB_PATH"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          p=json.loads(Path(os.environ['PUBLIC_LAB_PATH']).read_text())
          assert p['schema_version'] == 'gse-v2-public-lab-v2'
          assert p['engine']['decision_influence'] is False
          assert p['public_boundary']['raw_evidence_exposed'] is False
          assert p['public_boundary']['private_forecasts_exposed'] is False
          scan=datetime.fromisoformat(p['activity']['last_scan_at'].replace('Z','+00:00'))
          learning=datetime.fromisoformat(p['activity']['last_learning_at'].replace('Z','+00:00'))
          now=datetime.now(timezone.utc)
          assert learning >= scan - timedelta(minutes=2)
          assert now - learning < timedelta(minutes=30)
          assert p['learning_timeline']
          print('Public activity:', p['activity'])
          print('Newest public learning row:', p['learning_timeline'][0])
          PY

      - name: Validate zero-authority boundary
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          root=Path(os.environ['GSE_STATE_DIR'])
          state=json.loads((root/'gse_state.json').read_text())
          advanced=json.loads((root/'gse_v2_learning_state.json').read_text())
          policy=json.loads((root/'gse_v2_policy_proposal.json').read_text())
          calibration=json.loads((root/'gse_v2_regime_calibration.json').read_text())
          assert state['mode']=='shadow' and advanced['mode']=='shadow'
          controls=advanced['controls']
          assert not controls['automatic_tuning_enabled']
          assert not controls['policy_proposal_auto_apply_enabled']
          assert not controls['automatic_promotion_enabled']
          assert not controls['decision_engine_connected']
          assert not controls['belief_core_connected']
          assert not controls['trade_execution_enabled']
          assert not controls['policy_output_enabled']
          assert not controls['v1_forecast_modified']
          assert policy['automatically_applied'] is False
          assert policy['active_policy_unchanged'] is True
          assert calibration['controls']['automatic_tuning_enabled'] is False
          sys.path.insert(0,'scripts')
          import gse_v2_learning_loop as l
          rows=l.read_jsonl(root/'gse_v2_learning_ledger.jsonl')
          l._validate_ledger(rows)
          print('GSE zero-authority + ledger-chain validation: PASS')
          PY

      - name: Pack exact post-learning cumulative GSE state
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/gse-state.tgz" -C "$GSE_STATE_DIR" .
          ls -lh "$RUNNER_TEMP/gse-state.tgz"

      - name: Store exact post-learning cumulative GSE state
        uses: actions/upload-artifact@v4
        with:
          name: gse-shadow-state
          path: ${{ runner.temp }}/gse-state.tgz
          if-no-files-found: error
          retention-days: 60
          compression-level: 0

      - name: Publish review status and GSE Lab projection to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$PUBLIC_REVIEW_STATUS_PATH" "$PUBLIC_LAB_PATH"
          if git diff --cached --quiet; then
            echo "GSE public state already current."
            exit 0
          fi
          git commit -m "Update GSE learning cycle and Lab projection"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:main; then
              echo "GSE cycle published to main."
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "::error::Could not publish GSE cycle after retries"
          exit 1

      - name: Notify human review through GitHub issue
        if: steps.review_status.outputs.review_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_TRANSITION: ${{ steps.review_status.outputs.transition }}
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/gse-review-body.md"
          import json, os
          from pathlib import Path
          p=json.loads(Path(os.environ['PUBLIC_REVIEW_STATUS_PATH']).read_text())
          pp=p.get('policy_proposal') or {}
          print('# GSE v2 — human review required')
          print()
          print(f"Status: **{p.get('status')}**")
          print(f"Transition: `{p.get('transition')}`")
          print(f"Review kind: `{p.get('review_kind')}`")
          print(f"Candidate: `{json.dumps(pp.get('candidate'), sort_keys=True)}`")
          print(f"Holdout ΔBrier candidate-active: `{pp.get('holdout_delta_brier_candidate_minus_active')}`")
          print(f"Prospective paired N: `{(p.get('prospective') or {}).get('paired_n')}`")
          print(f"Prospective ΔBrier v2-v1: `{(p.get('prospective') or {}).get('delta_brier_v2_minus_v1')}`")
          print('No parameter was automatically applied. GSE remains shadow-only.')
          print(f"Run: {((p.get('run') or {}).get('run_url') or 'n/a')}")
          PY
          title="GSE v2 human review required"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -z "$issue" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/gse-review-body.md"
          elif [ "$REVIEW_TRANSITION" != "unchanged" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/gse-review-body.md"
          else
            echo "Review issue already open; no duplicate notification."
          fi

      - name: Add GSE cycle to workflow summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          lab=Path(os.environ['PUBLIC_LAB_PATH'])
          review=Path(os.environ['PUBLIC_REVIEW_STATUS_PATH'])
          print('## GSE complete cycle')
          if lab.exists():
              p=json.loads(lab.read_text())
              print(f"- Last scan: `{(p.get('activity') or {}).get('last_scan_at')}`")
              print(f"- Last learning: `{(p.get('activity') or {}).get('last_learning_at')}`")
              print(f"- Last verification: `{(p.get('activity') or {}).get('last_verification_at')}`")
              print(f"- Learning cycles: `{(p.get('summary') or {}).get('learning_cycles')}`")
          if review.exists():
              r=json.loads(review.read_text())
              print(f"- Review status: **{r.get('status')}**")
          PY

      - name: Keep rolling GSE backups
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$api" > "$RUNNER_TEMP/gse-artifacts-after.json"
          python - "$RUNNER_TEMP/gse-artifacts-after.json" > "$RUNNER_TEMP/gse-delete.txt" <<'PY'
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text())
          rows=[x for x in payload.get('artifacts', []) if not x.get('expired')]
          rows.sort(key=lambda x: x.get('created_at',''), reverse=True)
          for row in rows[72:]: print(row['id'])
          PY
          while read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            curl -fsSL -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done < "$RUNNER_TEMP/gse-delete.txt"
