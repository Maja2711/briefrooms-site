name: Verify EURUSD rates evidence artifact (read-only)
on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-us-rates-evidence-20261015.yml"
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check source-timestamped US Treasury and Fed Funds evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,io,zipfile,tarfile,urllib.request,json,datetime
          host="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(host+path,headers=headers),timeout=30) as rsp:
                  return rsp.read()
          manifest=json.loads(get("/actions/artifacts?name=belief-core-shadow-state&per_page=12"))
          artifact=next((x for x in sorted(manifest.get("artifacts",[]),key=lambda x:x.get("created_at",""),reverse=True) if not x.get("expired") and x.get("created_at","")>="2026-10-15T17:41:00Z"),None)
          assert artifact, "No post-fix verified Belief Core artifact"
          print("RATES_ARTIFACT",json.dumps({"id":artifact.get("id"),"created_at":artifact.get("created_at"),"run":artifact.get("workflow_run")}))
          raw=get("/actions/artifacts/"+str(artifact["id"])+"/zip")
          z=zipfile.ZipFile(io.BytesIO(raw))
          print("RATES_ARCHIVE_NAMES",z.namelist()[:10])
          packed=next(n for n in z.namelist() if n.endswith("belief-core-state.tgz"))
          with tarfile.open(fileobj=io.BytesIO(z.read(packed)),mode="r:gz") as t:
              names=[n for n in t.getnames() if n.endswith("/state.json") or n=="state.json"]
              assert names,"No Belief state JSON"
              state=json.load(t.extractfile(names[0]))
          bid="eurusd.us_rates_pressure.supportive"
          b=state.get("beliefs",{})
          belief=b.get(bid) if isinstance(b,dict) else next((x for x in b if x.get("belief_id")==bid),{})
          ids=set(belief.get("representative_evidence_ids",[]))
          rows=[r for r in state.get("evidence",[]) if r.get("belief_id")==bid and r.get("evidence_id") in ids]
          asof=belief.get("last_updated")
          print("RATES_BELIEF",json.dumps({"last_updated":asof,"freshness_score":belief.get("freshness_score"),"probability":belief.get("probability"),"representative_count":len(ids)}))
          source_types={"rates_proxy_intraday","fed_funds_policy_expectations_intraday"}
          confirmed=[]
          for e in rows:
              md=e.get("metadata") or {}
              report={"evidence_id":e.get("evidence_id"),"type":e.get("evidence_type"),"observed_at":e.get("observed_at"),"reliability":e.get("reliability"),"proxies":md.get("proxies"),"proxy":md.get("proxy"),"timestamp_source":md.get("timestamp_source"),"serial":md.get("serial_state_snapshot"),"source_ref":e.get("source_ref")}
              print("RATES_REP",json.dumps(report))
              if e.get("evidence_type") in source_types and asof:
                  source_time=datetime.datetime.fromisoformat(e["observed_at"].replace("Z","+00:00"))
                  ref_time=datetime.datetime.fromisoformat(asof.replace("Z","+00:00"))
                  age=(ref_time-source_time).total_seconds()/60
                  verified=(0<=age<=90 and (e.get("reliability") or 0)>=0.6 and md.get("serial_state_snapshot") is True and (md.get("proxy")=="ZQ=F" or md.get("proxies")==["ZT=F","ZN=F"]))
                  confirmed.append({"id":e.get("evidence_id"),"age_min":round(age,2),"verified":verified,"proxies":md.get("proxies"),"proxy":md.get("proxy")})
          print("RATES_VERIFIED",json.dumps(confirmed))
          assert any(x["verified"] for x in confirmed),"No source-verified intraday rate evidence"
          PY
