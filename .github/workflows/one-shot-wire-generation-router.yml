name: One-shot wire generation router

on:
  push:
    branches: [feat/stock-trading-v2-generation-promotion]
    paths:
      - ".github/workflows/one-shot-wire-generation-router.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stock-trading-v2-generation-promotion
          fetch-depth: 0
      - name: Route all canonical portfolio admissions through proven generation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              for old,new in replacements:
                  if old not in text:
                      raise SystemExit(f'Expected block not found in {path}: {old[:100]!r}')
                  text=text.replace(old,new,1)
              p.write_text(text,encoding='utf-8')

          common_paths='''      - "scripts/stock_trading_generation_router.py"\n      - "scripts/stock_trading_generation_promotion.py"\n      - "data/investments/stock_trading_generation_config.json"\n      - "data/investments/stock_trading_generation_state.json"\n      - "data/investments/stock_trading_v2_opportunity/**"\n      - "tests/test_stock_trading_generation_promotion.py"\n'''
          expr='$'+'{{ steps.market.outputs.value }}'
          old_portfolio=f'python scripts/stock_trading_portfolio.py --mode run --market "{expr}"'
          new_portfolio=f'python scripts/stock_trading_generation_router.py --mode review-and-apply --market "{expr}"'

          patch('.github/workflows/stock-trading-portfolio.yml', [
              ('      - "scripts/stock_trading_portfolio.py"\n', '      - "scripts/stock_trading_portfolio.py"\n'+common_paths),
              ('python -m py_compile scripts/stock_trading_portfolio.py scripts/stock_trading_quote_enricher.py',
               'python -m py_compile scripts/stock_trading_portfolio.py scripts/stock_trading_quote_enricher.py scripts/stock_trading_generation_promotion.py scripts/stock_trading_generation_router.py'),
              ('python -m unittest tests.test_stock_trading_portfolio tests.test_stock_trading_quote_enricher -v',
               'python -m unittest tests.test_stock_trading_portfolio tests.test_stock_trading_quote_enricher tests.test_stock_trading_generation_promotion -v'),
              (old_portfolio,new_portfolio),
          ])

          patch('.github/workflows/gpw-daily-pick-pl.yml', [
              ('      - "scripts/stock_trading_portfolio.py"\n', '      - "scripts/stock_trading_portfolio.py"\n'+common_paths),
              ('            tests.test_stock_trading_portfolio -v',
               '            tests.test_stock_trading_portfolio \\\n            tests.test_stock_trading_generation_promotion -v'),
              ('            scripts/stock_trading_portfolio.py\n',
               '            scripts/stock_trading_portfolio.py \\\n            scripts/stock_trading_generation_promotion.py \\\n            scripts/stock_trading_generation_router.py\n'),
              ('          python scripts/stock_trading_portfolio.py --mode sync-candidates --market GPW',
               '          python scripts/stock_trading_generation_router.py --mode apply --market GPW'),
          ])

          patch('.github/workflows/us-daily-stock-en.yml', [
              ('      - "scripts/stock_trading_portfolio.py"\n', '      - "scripts/stock_trading_portfolio.py"\n'+common_paths),
              ('            tests.test_stock_trading_portfolio -v',
               '            tests.test_stock_trading_portfolio \\\n            tests.test_stock_trading_generation_promotion -v'),
              ('            scripts/stock_trading_portfolio.py \\\n            scripts/daily_stock_rejected_candidate_freeze.py',
               '            scripts/stock_trading_portfolio.py \\\n            scripts/stock_trading_generation_promotion.py \\\n            scripts/stock_trading_generation_router.py \\\n            scripts/daily_stock_rejected_candidate_freeze.py'),
              ('          python scripts/stock_trading_portfolio.py --mode sync-candidates --market US',
               '          python scripts/stock_trading_generation_router.py --mode apply --market US'),
          ])
          PY
          git rm .github/workflows/one-shot-wire-generation-router.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/stock-trading-portfolio.yml .github/workflows/gpw-daily-pick-pl.yml .github/workflows/us-daily-stock-en.yml
          git commit -m "Route production portfolio through V1-vs-V2 generation authority"
          git pull --rebase origin feat/stock-trading-v2-generation-promotion
          git push origin HEAD:feat/stock-trading-v2-generation-promotion
