name: One-shot install EN US Daily Stock

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-us-daily-stock-en-install.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: one-shot-us-daily-stock-en-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate engine and frontend
        run: |
          set -euo pipefail
          python -m py_compile scripts/us_daily_stock.py scripts/install_us_daily_stock_en.py
          python -m unittest tests.test_us_daily_stock -v
          node --check scripts/us-daily-stock-public.js
          python -m json.tool data/investments/us_daily_stock_config.json >/dev/null
          python -m json.tool data/investments/us_daily_stock.json >/dev/null
      - name: Install widget
        run: |
          python scripts/install_us_daily_stock_en.py
          grep -q 'id="us-daily-stock-root"' en/investing/portfolio-10k.html
          grep -q '/scripts/us-daily-stock-public.js?v=1' en/investing/portfolio-10k.html
          grep -q '/assets/gpw-daily-pick.css?v=1' en/investing/portfolio-10k.html
      - name: Commit frontend and self-remove
        id: commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-us-daily-stock-en-install.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/investing/portfolio-10k.html .github/workflows/one-shot-us-daily-stock-en-install.yml
          git commit -m "Install EN US Daily Stock frontend"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt*4))
          done
          exit 1
      - name: Request Pages build
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            CODE="$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${{ github.token }}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")"
            if [[ "$CODE" == "201" ]]; then exit 0; fi
            if [[ "$CODE" != "409" ]]; then cat /tmp/pages.json; exit 1; fi
            sleep 10
          done
          exit 1
      - name: Verify production widget
        run: |
          python - <<'PY'
          import time, urllib.request
          headers={'User-Agent':'BriefRooms-US-Daily-Stock-installer/1.0','Cache-Control':'no-cache'}
          for attempt in range(1,37):
              token=f'{int(time.time())}-{attempt}'
              try:
                  req=urllib.request.Request(f'https://briefrooms.com/en/investing/portfolio-10k.html?v={token}',headers=headers)
                  with urllib.request.urlopen(req,timeout=20) as r:
                      html=r.read().decode('utf-8',errors='replace')
                  if 'id="us-daily-stock-root"' in html and 'us-daily-stock-public.js' in html:
                      print('US_DAILY_STOCK_FRONTEND_OK')
                      raise SystemExit(0)
              except Exception as exc:
                  print(attempt,type(exc).__name__,str(exc)[:120])
              time.sleep(10)
          raise SystemExit('US Daily Stock widget not visible on production in time')
          PY
