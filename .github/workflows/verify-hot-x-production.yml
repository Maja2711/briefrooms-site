name: Verify Hot X Production

on:
  push:
    branches: [main]
    paths:
      - "data/hot_tweets.json"
      - ".github/workflows/verify-hot-x-production.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hot-x-production-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify current Hot X feed on production
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          local = json.loads(Path('data/hot_tweets.json').read_text(encoding='utf-8'))
          expected_updated = local['updated_at']
          expected_urls = [item['tweet_url'] for item in local['items']]
          result = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'expected_updated_at': expected_updated,
              'expected_item_count': len(expected_urls),
              'expected_first_url': expected_urls[0],
              'production_url': 'https://briefrooms.com/data/hot_tweets.json',
              'status': 'failed',
              'attempts': 0,
          }
          last_error = ''
          for attempt in range(1, 41):
              result['attempts'] = attempt
              try:
                  url = f"https://briefrooms.com/data/hot_tweets.json?verify={int(time.time())}-{attempt}"
                  request = urllib.request.Request(
                      url,
                      headers={
                          'User-Agent': 'BriefRooms-Hot-X-Production-Verifier/1.0',
                          'Cache-Control': 'no-cache',
                      },
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      production = json.loads(response.read().decode('utf-8'))
                  production_urls = [item.get('tweet_url') for item in production.get('items') or []]
                  if (
                      production.get('updated_at') == expected_updated
                      and production_urls == expected_urls
                  ):
                      result.update({
                          'status': 'passed',
                          'production_updated_at': production.get('updated_at'),
                          'production_item_count': len(production_urls),
                          'production_first_url': production_urls[0] if production_urls else '',
                      })
                      break
                  last_error = (
                      f"production mismatch: updated_at={production.get('updated_at')!r}, "
                      f"items={len(production_urls)}, first={production_urls[0] if production_urls else ''!r}"
                  )
              except Exception as exc:
                  last_error = f"{type(exc).__name__}: {exc}"
              time.sleep(15)
          result['last_error'] = last_error
          Path('data/hot_x_production_status.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          if result['status'] != 'passed':
              raise SystemExit(last_error or 'Hot X production verification failed')
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Commit production verification status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f data/hot_x_production_status.json ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hot_x_production_status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(hot-x): record production verification"
          for attempt in 1 2 3; do
            git fetch origin main
            if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
              git rebase origin/main
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
