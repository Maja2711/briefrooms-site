name: TEMP Weekly Lifecycle Validation

on:
  push:
    branches:
      - "fix/weekly-lifecycle-contract-20260921"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/weekly-lifecycle-contract-20260921"
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: python -m pip install --upgrade pip yfinance pandas numpy
      - name: Syntax
        run: |
          python -m py_compile scripts/audit_weekly_model.py scripts/audit_weekly_model_runtime.py scripts/investments_weekly_v5.py scripts/investments_weekly_v5_finalize.py
          node --check scripts/investments-weekly-public.js
      - name: Regression tests
        run: |
          node --test tests/test_investments_weekly_public.js
          python -m unittest \
            tests/test_audit_weekly_integrity.py \
            tests.test_audit_weekly_model_runtime \
            tests/test_investments_weekly_v5.py \
            tests.test_wes_lifecycle_expired_no_entry
      - name: Real ledger integrity
        run: |
          python scripts/audit_weekly_model_runtime.py
          python scripts/verify_weekly_close_deadline.py
