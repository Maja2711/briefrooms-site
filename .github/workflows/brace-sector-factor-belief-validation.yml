name: BRACE Sector-Factor Belief Validation

on:
  pull_request:
    paths:
      - ".github/workflows/brace-sector-factor-belief.yml"
      - ".github/workflows/brace-sector-factor-belief-validation.yml"
      - "scripts/brace_sector_factor_belief.py"
      - "tests/test_brace_sector_factor_belief.py"
      - "docs/BRACE_SECTOR_FACTOR_BELIEF.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test PR11 sector-factor layer
        run: |
          PYTHONPATH=scripts python -m py_compile scripts/brace_sector_factor_belief.py
          PYTHONPATH=scripts python -m unittest tests.test_brace_sector_factor_belief -v
      - name: Assert taxonomy and governance boundary
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from brace_sector_factor_belief import (
              SECTOR_FACTOR_BELIEF_IDS,
              capabilities,
              safety_controls,
          )
          expected = (
              'sector.technology.leadership',
              'sector.financials.leadership',
              'sector.health_care.leadership',
              'sector.consumer_discretionary.leadership',
              'sector.consumer_staples.leadership',
              'sector.communication_services.leadership',
              'sector.semiconductors.leadership',
              'factor.growth.leadership',
              'factor.quality.leadership',
              'factor.momentum.leadership',
              'factor.small_cap.leadership',
          )
          assert SECTOR_FACTOR_BELIEF_IDS == expected
          assert all(v is False for v in safety_controls().values())
          caps=capabilities()
          assert caps['sector_factor_shadow_collection_enabled'] is True
          assert caps['with_without_bridge_enabled'] is False
          assert caps['promotion_gate_enabled'] is False
          assert caps['company_entity_beliefs_enabled'] is False
          print('PR11 taxonomy + governance contract: PASS')
          PY
