name: Validate Daily EURUSD A-B-C Experiment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/daily_eurusd_experiment.py"
      - "scripts/daily_eurusd_experiment_v12.py"
      - "scripts/daily_eurusd_experiment_v13.py"
      - "scripts/daily_eurusd_abc_settler.py"
      - "scripts/daily_eurusd_abc_durability.py"
      - "tests/test_daily_eurusd_experiment.py"
      - "tests/test_daily_eurusd_abc_settler.py"
      - "tests/test_daily_eurusd_abc_trade_path.py"
      - "tests/test_daily_eurusd_abc_trade_path_settler.py"
      - "tests/test_daily_eurusd_abc_durability.py"
      - "docs/DAILY_EURUSD_ABC_EXPERIMENT.md"
      - ".github/workflows/daily-eurusd-abc-validation.yml"
      - ".github/workflows/daily-eurusd-abc-live-shadow.yml"
  push:
    branches-ignore: [main]
    paths:
      - "scripts/daily_eurusd_experiment.py"
      - "scripts/daily_eurusd_experiment_v12.py"
      - "scripts/daily_eurusd_experiment_v13.py"
      - "scripts/daily_eurusd_abc_settler.py"
      - "scripts/daily_eurusd_abc_durability.py"
      - "tests/test_daily_eurusd_experiment.py"
      - "tests/test_daily_eurusd_abc_settler.py"
      - "tests/test_daily_eurusd_abc_trade_path.py"
      - "tests/test_daily_eurusd_abc_trade_path_settler.py"
      - "tests/test_daily_eurusd_abc_durability.py"
      - "docs/DAILY_EURUSD_ABC_EXPERIMENT.md"
      - ".github/workflows/daily-eurusd-abc-validation.yml"
      - ".github/workflows/daily-eurusd-abc-live-shadow.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
    steps:
      - name: Checkout candidate code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile experiment, trade path, settler and durability entrypoints
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/belief_market_data_adapter.py \
            scripts/daily_eurusd_experiment.py \
            scripts/daily_eurusd_experiment_v12.py \
            scripts/daily_eurusd_experiment_v13.py \
            scripts/daily_eurusd_abc_settler.py \
            scripts/daily_eurusd_abc_durability.py \
            scripts/research_state_durability.py

      - name: Run A-B-C prospective, trade-path, settler and durability tests
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_daily_eurusd_experiment \
            tests.test_daily_eurusd_abc_trade_path \
            tests.test_daily_eurusd_abc_trade_path_settler \
            tests.test_daily_eurusd_abc_settler \
            tests.test_daily_eurusd_abc_durability -v

      - name: Assert v1.3 isolation, zero-authority, risk parity and append-only contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import daily_eurusd_experiment_v12 as v12
          import daily_eurusd_experiment_v13 as abc
          import daily_eurusd_abc_durability as durability

          assert abc.base.MODE == "research_shadow"
          assert v12.ENGINE_VERSION == "eurusd-daily-abc-v1.2.0"
          assert abc.base.ENGINE_VERSION == "eurusd-daily-abc-v1.2.0"
          assert abc.ENGINE_VERSION == "eurusd-daily-abc-v1.3.0"
          assert abc.BOLLINGER_WINDOW == 30
          assert abc.BOLLINGER_STDDEV_LEVELS == (1.0, 2.0, 3.0)
          assert abc.ATR_30M_WINDOW == 26
          assert abc.ATR_MULTIPLE == 1.35
          assert abc.RISK_FLOOR_PERCENT == 0.0027
          assert abc.REWARD_RISK == 1.8
          assert abc.POSITION_HORIZON_MINUTES == 1440
          assert abc.MONITOR_INTERVAL == "1m"
          assert abc.TERMINAL_PATH_STATUSES == {"CLOSED", "AMBIGUOUS", "NO_TRADE", "UNAVAILABLE"}
          assert abs(sum(abc.TECHNICAL_WEIGHTS.values()) - 1.0) < 1e-12
          assert abs(sum(abc.BELIEF_WEIGHTS.values()) - 1.0) < 1e-12
          assert abc.HYBRID_TECHNICAL_WEIGHT == 0.70
          assert abc.HYBRID_BELIEF_CONTEXT_WEIGHT == 0.30
          assert "eurusd.trend.bullish" not in abc.HYBRID_CONTEXT_BELIEF_IDS
          spec=durability.rsd.LAYERS[durability.LAYER_ID]
          assert spec.primary_artifact == "daily-eurusd-abc-live-shadow-state"
          print("Daily EURUSD A/B/C v1.3 + PR24 isolated trade-path invariants: PASS")
          PY

      - name: Assert production workflow remains shadow-only and settles every five minutes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/daily-eurusd-abc-live-shadow.yml').read_text()
          assert 'contents: read' in text
          assert 'contents: write' not in text
          assert 'git push' not in text
          assert 'daily_eurusd_experiment_v13.py' in text
          assert 'daily_eurusd_abc_settler.py' in text
          assert 'test_daily_eurusd_abc_trade_path' in text
          assert 'belief-core-shadow-state' in text
          assert 'research_boundary' in text
          assert '12,42 13-22 * * 1-5' in text
          assert '2,7,17,22,27,32,37,47,52,57 * * * 1-5' in text
          assert 'Settlement-only run: Belief restore intentionally skipped.' in text
          assert "steps.cycle.outputs.state_changed == 'true'" in text
          assert '/actions/artifacts/${artifact_id}/zip' in text
          assert 'daily_eurusd_abc_durability.py verify' in text
          assert 'trade_plan_sha256' in text
          assert 'virtual_only' in text
          print('PR24 live-shadow five-minute point + terminal virtual-trade settlement contract: PASS')
          PY
