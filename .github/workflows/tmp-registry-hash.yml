name: Temporary Registry Hash
on:
  push:
    branches: ["retire/timesfm-controlled"]
permissions:
  contents: read
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=json.loads(Path("data/investments/learning_engine_registry_v1.json").read_text())
          p.pop("registry_sha256",None)
          raw=json.dumps(p,ensure_ascii=False,sort_keys=True,separators=(",",":"),default=str)
          print("EXPECTED_REGISTRY_SHA256="+hashlib.sha256(raw.encode("utf-8")).hexdigest())
          PY
