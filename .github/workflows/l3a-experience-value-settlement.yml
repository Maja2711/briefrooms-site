name: L3-A Experience Value Settlement

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Belief Calibration Foundation"]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: belief-core-live-shadow
  cancel-in-progress: false

env:
  BELIEF_ARTIFACT_NAME: belief-core-shadow-state

jobs:
  settle:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate settlement contracts
        run: |
          python -m py_compile scripts/l3a_experience_lineage.py scripts/l3a_research_executor.py scripts/l3a_settlement.py
          python -m unittest tests.test_l3a_experience_lineage tests.test_l3a_executor_e2e -v

      - name: Prepare state path
        run: |
          echo "STATE_DIR=$RUNNER_TEMP/belief_core_state" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/belief_core_state" "$RUNNER_TEMP/belief-artifact"

      - name: Restore triggering calibrated Belief state
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" > "$RUNNER_TEMP/a.json"
          id=$(python - "$RUNNER_TEMP/a.json" <<'PY'
          import json,sys
          from pathlib import Path
          rows=json.loads(Path(sys.argv[1]).read_text()).get("artifacts",[])
          rows=[x for x in rows if x.get("name")=="belief-core-shadow-state" and not x.get("expired")]
          print(rows[0]["id"] if rows else "")
          PY
          )
          test -n "$id"
          curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$id/zip" -o "$RUNNER_TEMP/state.zip"
          unzip -q "$RUNNER_TEMP/state.zip" -d "$RUNNER_TEMP/belief-artifact"
          test -f "$RUNNER_TEMP/belief-artifact/belief-core-state.tgz"
          tar -xzf "$RUNNER_TEMP/belief-artifact/belief-core-state.tgz" -C "$STATE_DIR"

      - name: Restore latest Belief state for manual or push run
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${BELIEF_ARTIFACT_NAME}&per_page=100"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api" > "$RUNNER_TEMP/a.json"
          id=$(python - "$RUNNER_TEMP/a.json" <<'PY'
          import json,sys
          from pathlib import Path
          rows=[x for x in json.loads(Path(sys.argv[1]).read_text()).get("artifacts",[]) if not x.get("expired")]
          rows.sort(key=lambda x:x.get("created_at",""),reverse=True)
          print(rows[0]["id"] if rows else "")
          PY
          )
          test -n "$id"
          curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$id/zip" -o "$RUNNER_TEMP/state.zip"
          unzip -q "$RUNNER_TEMP/state.zip" -d "$RUNNER_TEMP/belief-artifact"
          test -f "$RUNNER_TEMP/belief-artifact/belief-core-state.tgz"
          tar -xzf "$RUNNER_TEMP/belief-artifact/belief-core-state.tgz" -C "$STATE_DIR"

      - name: Settle L3-A only from real Verification rows
        run: |
          python scripts/l3a_settlement.py --state-dir "$STATE_DIR" --output "$RUNNER_TEMP/L3A_SETTLEMENT_SUMMARY.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ["STATE_DIR"])/"L3A_EXPERIENCE_STATE.json"
          p=json.loads(path.read_text()) if path.exists() else {"records":[]}
          for r in p["records"]:
              if r.get("research_result_status")=="SETTLED":
                  fm=r["future_metrics"]
                  assert fm["verification_id"]
                  assert fm["brier_score"] is not None
                  assert fm["pre_research_counterfactual_brier"] is not None
                  assert fm["brier_gain_vs_pre_research"] is not None
          print("L3-A real Verification settlement contract PASS")
          PY

      - name: Pack settled cumulative state
        run: tar -czf "$RUNNER_TEMP/belief-core-state.tgz" -C "$STATE_DIR" .

      - uses: actions/upload-artifact@v4
        with:
          name: belief-core-shadow-state
          path: ${{ runner.temp }}/belief-core-state.tgz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: l3a-experience-value-settlement
          path: ${{ runner.temp }}/L3A_SETTLEMENT_SUMMARY.json
          if-no-files-found: error
          retention-days: 30
