name: Publish US Stock Candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/us-daily-stock-en.yml"
      - "scripts/daily_stock_core.py"
      - "scripts/daily_stock_us_adapter.py"
      - "scripts/us_daily_stock.py"
      - "scripts/us_stock_candidate.py"
      - "scripts/stock_trading_portfolio.py"
      - "scripts/daily_stock_rejected_candidate_freeze.py"
      - "scripts/build_daily_stock_history_index.py"
      - "scripts/us-daily-stock-public.js"
      - "scripts/daily-stock-markets-public.js"
      - "scripts/daily-stock-position-ux.js"
      - "data/investments/us_daily_stock_config.json"
      - "data/investments/stock_trading_policy.json"
      - "tests/test_daily_stock_core.py"
      - "tests/test_daily_stock_rejected_candidate_freeze.py"
      - "tests/test_us_daily_stock.py"
      - "tests/test_stock_trading_portfolio.py"
      - "en/investing/stock-trading.html"
      - "pl/inwestycje/stock-trading.html"
  schedule:
    - cron: "36 13 * * 1-5"
    - cron: "42 13 * * 1-5"
    - cron: "36 14 * * 1-5"
    - cron: "42 14 * * 1-5"
    - cron: "5 15 * * 1-5"
    - cron: "5 16 * * 1-5"
    - cron: "5 17 * * 1-5"
    - cron: "5 18 * * 1-5"
    - cron: "5 19 * * 1-5"
    - cron: "5 20 * * 1-5"

permissions:
  contents: write
  pages: write

concurrency:
  group: us-stock-candidate
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_GENERATION_MODEL: gemini-3.5-flash-lite
      GEMINI_REVIEW_MODEL: gemini-3.5-flash-lite
      GEMINI_MIN_INTERVAL_SECONDS: "8"

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Validate US candidate and Stock Trading contracts
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_daily_stock_core \
            tests.test_daily_stock_rejected_candidate_freeze \
            tests.test_us_daily_stock \
            tests.test_stock_trading_portfolio -v
          python -m py_compile \
            scripts/daily_stock_core.py \
            scripts/daily_stock_us_adapter.py \
            scripts/us_daily_stock.py \
            scripts/us_stock_candidate.py \
            scripts/stock_trading_portfolio.py \
            scripts/daily_stock_rejected_candidate_freeze.py \
            scripts/build_daily_stock_history_index.py
          python -m json.tool data/investments/us_daily_stock_config.json >/dev/null
          python -m json.tool data/investments/stock_trading_policy.json >/dev/null
          node --check scripts/us-daily-stock-public.js
          node --check scripts/daily-stock-markets-public.js
          node --check scripts/daily-stock-position-ux.js

      - name: Run no-forced-trade US candidate engine
        run: |
          set -euo pipefail
          python scripts/us_stock_candidate.py --mode auto
          python scripts/us_stock_candidate.py --mode validate
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/investments/us_daily_stock.json').read_text(encoding='utf-8'))
          decision=p.get('decision')
          if decision not in {'TRADE','NO_TRADE','DATA_ERROR','PENDING'}:
              raise SystemExit(f'Unexpected US stock decision: {decision}')
          if decision=='TRADE':
              s=p.get('selection') or {}
              if float(s.get('score') or 0)<72:
                  raise SystemExit('US Stock Trading cannot lower the 72 entry threshold')
              if s.get('valid_until') is not None or s.get('time_stop') is not None:
                  raise SystemExit('US Stock Trading candidate cannot have a fixed holding deadline')
              if s.get('holding_policy')!='OPEN_ENDED_MODEL_CONTROLLED':
                  raise SystemExit('US Stock Trading holding policy is not open-ended')
          print('US_STOCK_CANDIDATE_OK',decision,(p.get('selection') or {}).get('symbol'))
          PY

      - name: Feed canonical US Stock Trading portfolio
        run: |
          set -euo pipefail
          python scripts/stock_trading_portfolio.py --mode sync-candidates --market US
          python scripts/stock_trading_portfolio.py --mode verify

      - name: Freeze rejected US candidates for research only
        run: |
          set -euo pipefail
          python scripts/daily_stock_rejected_candidate_freeze.py --market us
          python scripts/daily_stock_rejected_candidate_freeze.py --market us --verify

      - name: Rebuild shared candidate history index
        run: python scripts/build_daily_stock_history_index.py

      - name: Commit US candidate and canonical portfolio state
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/us_daily_stock.json data/investments/us_daily_stock_metrics.json data/investments/daily_stock_history_index.json
          git add data/investments/us_daily_stock_history 2>/dev/null || true
          git add data/investments/stock_trading_portfolio.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Publish US Stock Trading candidate state"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt*4))
          done
          exit 1

      - name: Request fresh Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            CODE="$(curl --silent --show-error --output /tmp/us-pages.json --write-out '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")"
            if [[ "$CODE" == "201" ]]; then exit 0; fi
            if [[ "$CODE" != "409" ]]; then cat /tmp/us-pages.json; exit 1; fi
            sleep 10
          done
          exit 1
