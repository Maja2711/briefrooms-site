name: P2 Shadow Watchdog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p2-shadow-watchdog.yml"
      - "scripts/hypothesis_shadow_watchdog.py"
      - "scripts/nyse_session_calendar.py"
      - "scripts/hypothesis_challenger_engine.py"
      - "tests/test_hypothesis_shadow_watchdog.py"
  schedule:
    - cron: "7,37 * * * *"
  workflow_run:
    workflows:
      - "Belief Calibration Foundation"
      - "Belief Core Live Shadow Collection"
    types: [completed]

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: p2-shadow-watchdog-readonly
  cancel-in-progress: false

jobs:
  monitor:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT: belief-core-shadow-state
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare independent watchdog
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          set -euo pipefail
          python -m unittest tests.test_hypothesis_shadow_watchdog \
            tests.test_hypothesis_challenger_engine -q
          echo "P2_STATE=$RUNNER_TEMP/p2-monitor" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/p2-monitor"

      - name: Restore last independent source SLA checkpoint
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?name=p2-shadow-source-sla-checkpoint&per_page=100" \
            > "$RUNNER_TEMP/p2-sla-artifacts.json"
          aid=$(python - "$RUNNER_TEMP/p2-sla-artifacts.json" <<'PY'
          import json,sys
          from pathlib import Path
          rows=[r for r in json.loads(Path(sys.argv[1]).read_text()).get("artifacts",[])
                if not r.get("expired")]
          rows.sort(key=lambda r:r.get("created_at",""), reverse=True)
          print(rows[0]["id"] if rows else "")
          PY
          )
          if [[ -n "$aid" ]]; then
            curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip" \
              -o "$RUNNER_TEMP/p2-sla-previous.zip"
            unzip -p "$RUNNER_TEMP/p2-sla-previous.zip" P2_SLA_CHECKPOINT.json \
              > "$RUNNER_TEMP/P2_SLA_PREVIOUS.json"
            test -s "$RUNNER_TEMP/P2_SLA_PREVIOUS.json"
          else
            echo "No prior independent SLA checkpoint; checking the current US session."
          fi

      - name: Restore latest canonical Belief state read-only
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT&per_page=100" \
            > "$RUNNER_TEMP/p2-artifacts.json"
          aid=$(python - "$RUNNER_TEMP/p2-artifacts.json" <<'PY'
          import json,sys
          from pathlib import Path
          rows=[x for x in json.loads(Path(sys.argv[1]).read_text()).get("artifacts",[])
                if not x.get("expired")]
          rows.sort(key=lambda x:x.get("created_at",""),reverse=True)
          print(rows[0]["id"] if rows else "")
          PY
          )
          [[ -n "$aid" ]] || { echo "::error::Canonical Belief artifact unavailable"; exit 2; }
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip" \
            -o "$RUNNER_TEMP/p2-belief.zip"
          mkdir -p "$RUNNER_TEMP/p2-extracted"
          unzip -q "$RUNNER_TEMP/p2-belief.zip" -d "$RUNNER_TEMP/p2-extracted"
          test -s "$RUNNER_TEMP/p2-extracted/belief-core-state.tgz"
          tar -xzf "$RUNNER_TEMP/p2-extracted/belief-core-state.tgz" -C "$P2_STATE"
          test -s "$P2_STATE/state.json"

      - name: Run independent watchdog audit
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          set -euo pipefail
          python scripts/hypothesis_shadow_watchdog.py \
            --monitor --state-dir "$P2_STATE" \
            --sla-checkpoint "$RUNNER_TEMP/P2_SLA_PREVIOUS.json" \
            --output "$RUNNER_TEMP/P2_MONITOR.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads((Path(os.environ["RUNNER_TEMP"])/"P2_MONITOR.json").read_text())
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("## P2.1 Shadow Watchdog\n\n")
              out.write("**" + p["status"] + "** · " + p["readiness"] + "\n\n")
              out.write("**PRODUCTION E2E:** " + p["production_e2e_status"] + "\n\n")
              for k,v in p["summary"].items():
                  out.write("- " + k + ": **" + str(v) + "**\n")
              for alert in p["alerts"]:
                  out.write("- **" + alert["severity"] + " " + alert["code"] + "**: " + str(alert["count"]) + "\n")
              target_candidate = next(
                  (c for c in p.get("candidates", [])
                   if c.get("hypothesis_id") == "btc.volatility.benign"), None)
              if target_candidate is not None:
                  out.write("\n### First BTC volatility Shadow freeze\n\n")
                  freeze = target_candidate.get("first_shadow_freeze_proof")
                  if freeze:
                      from datetime import datetime
                      def dt(value):
                          return datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                      assert all(freeze.get(k) for k in (
                          "forecast_id", "shadow_forecast_id", "event_id",
                          "source_snapshot_sha256", "forecast_at", "frozen_at", "target_at"))
                      assert dt(target_candidate["activation_boundary"]) < dt(freeze["forecast_at"])
                      assert dt(freeze["forecast_at"]) <= dt(freeze["frozen_at"]) < dt(freeze["target_at"])
                      out.write("- First freeze observed; watchdog status: **" + p["status"] + "**\n")
                      for field in ("candidate_id", "hypothesis_id"):
                          out.write("- " + field + ": \`" + str(target_candidate[field]) + "\`\n")
                      for field in ("event_id", "forecast_id", "shadow_forecast_id",
                                    "forecast_at", "frozen_at", "target_at", "source_snapshot_sha256"):
                          out.write("- " + field + ": \`" + str(freeze[field]) + "\`\n")
                  else:
                      out.write("- **PENDING:** no immutable first-freeze proof yet\n")
              if p["production_e2e_status"] == "PASS":
                  proof = p["production_e2e_proof"]
                  assert proof and proof["source_verification_id"] and proof["source_snapshot_sha256"]
                  out.write("\n### Real Yahoo OOS settlement — E2E PASS\n\n")
                  for field in ("candidate_id", "event_id", "forecast_id",
                                "shadow_forecast_id", "source_verification_id",
                                "frozen_at", "target_at", "verified_at",
                                "control_brier", "challenger_brier", "source_snapshot_sha256"):
                      out.write("- " + field + ": \`" + str(proof[field]) + "\`\n")
          PY

      - name: Write sanitized independent source SLA checkpoint
        if: always()
        run: |
          set -euo pipefail
          [[ -s "$RUNNER_TEMP/P2_MONITOR.json" ]] || exit 0
          python - <<'PY'
          import json,os
          from pathlib import Path
          temp=Path(os.environ["RUNNER_TEMP"])
          report=json.loads((temp/"P2_MONITOR.json").read_text(encoding="utf-8"))
          checkpoint={
              "schema_version": "briefrooms-p2-snapshot-sla-checkpoint-v1",
              "generated_at": report["generated_at"],
              "unresolved_missing_slot_keys":
                  report["source_sla"]["unresolved_missing_slot_keys"],
          }
          (temp/"P2_SLA_CHECKPOINT.json").write_text(
              json.dumps(checkpoint, sort_keys=True, indent=2)+"\n",
              encoding="utf-8")
          PY

      - name: Persist independent source SLA checkpoint across sessions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-shadow-source-sla-checkpoint
          path: ${{ runner.temp }}/P2_SLA_CHECKPOINT.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Dispatch collector recovery if source stopped
        if: always()
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/P2_MONITOR.json" || exit 0
          if ! python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads((Path(os.environ["RUNNER_TEMP"])/"P2_MONITOR.json").read_text())
          codes=set(p["alert_codes"])
          always_recoverable = codes & {
              "COLLECTOR_STALE_DURING_MARKET", "BASELINE_FORECAST_MISSING_AFTER_SLOT",
              "SOURCE_FORECASTS_MISSING_AFTER_CONFIRMED_SLOT",
          }
          # A prior-day/after-close missing snapshot stays FAIL, but another
          # FX-only collector run cannot retroactively satisfy its US slot.
          current_prefix = "wes-assets:" + p["session"]["session_date_ny"] + ":"
          active_snapshot_gap = (
              "MARKET_SNAPSHOT_SLA_BREACHED" in codes
              and p["session"]["market_window_active"]
              and any(key.startswith(current_prefix)
                      for key in p["source_sla"]["unresolved_missing_slot_keys"])
          )
          raise SystemExit(0 if always_recoverable or active_snapshot_gap else 1)
          PY
          then exit 0; fi
          # Rate-limit recovery: never duplicate a collector fired within 90m.
          if gh run list --workflow "Belief Core Live Shadow Collection" \
             --json createdAt --limit 10 | python -c '
          import json,sys
          from datetime import datetime,timezone
          now=datetime.now(timezone.utc)
          rows=json.load(sys.stdin)
          recent=any(
              (now-datetime.fromisoformat(x["createdAt"].replace("Z","+00:00"))).total_seconds()<5400
              for x in rows if x.get("createdAt")
          )
          sys.exit(0 if recent else 1)
          '; then
            echo "P2_RECOVERY_RATE_LIMIT: recent collector already running/recent"
          else
            echo "::warning title=P2 recovery::Dispatching Belief source collection"
            gh workflow run belief-core-shadow-live.yml --ref main
          fi

      - name: Deduplicated critical alert and recovery resolution
        if: always()
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/P2_MONITOR.json"
          [[ -s "$file" ]] || { echo "::error::P2 monitor report missing"; exit 2; }
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads((Path(os.environ["RUNNER_TEMP"])/"P2_MONITOR.json").read_text())
          b=Path(os.environ["RUNNER_TEMP"])/"p2-issue.md"
          lines=[
              "# P2.1 Shadow Watchdog: collection or settlement stall",
              "",
              "Computed from the latest canonical cumulative Belief Core artifact.",
              "- Generated at: "+p["generated_at"],
              "- Status: "+p["status"],
              "- Actual settlement proof: "+p["readiness"],
              "- Production E2E: "+p["production_e2e_status"],
              "- NYSE calendar: "+str(p["session"].get("holiday_proof")),
              "- Scheduled slots due: "+str(p["session"].get("due_slots")),
              "- Active market-window: "+str(p["session"]["market_window_active"]),
              "",
              "## Counters",
          ]
          lines += ["- "+k+": "+str(v) for k,v in p["summary"].items()]
          lines += ["", "## Alerts (sanitized)"]
          lines += ["- "+a["severity"]+" "+a["code"]+" candidate="+str(a["candidate_id"])+
                    " n="+str(a["count"])+" / "+a["reason"] for a in p["alerts"]]
          lines += ["", "No historical Shadow freeze may be fabricated or backdated."]
          b.write_text("\n".join(lines)+"\n")
          PY
          title="P2.1 Shadow Watchdog: collection or settlement stall"
          issue=$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title=="P2.1 Shadow Watchdog: collection or settlement stall") | .number' \
            2>/dev/null | head -n 1 || true)
          health=$(python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads((Path(os.environ["RUNNER_TEMP"])/"P2_MONITOR.json").read_text())
          print(p["status"])
          PY
          )
          if [[ "$health" == "FAIL" ]]; then
            if [[ -z "$issue" ]]; then
              gh issue create --title "$title" --body-file "$RUNNER_TEMP/p2-issue.md" ||
                echo "::warning::Issue API unavailable, Actions alarm still active"
            else
              echo "P2_ALERT_ALREADY_OPEN=$issue"
            fi
            echo "::error title=P2.1 Shadow Watchdog::Critical stale, missed freeze or Verification fault"
            exit 2
          fi
          if [[ -n "$issue" ]]; then
            gh issue close "$issue" --comment "P2 watchdog recovered ($health), verified by the latest independent run." ||
              echo "::warning::Cannot close prior watchdog issue"
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads((Path(os.environ["RUNNER_TEMP"])/"P2_MONITOR.json").read_text())
          if p["production_e2e_status"] == "PASS":
              proof = p["production_e2e_proof"]
              assert proof and proof["source_verification_id"] and proof["source_snapshot_sha256"]
              print("P2.1 PRODUCTION E2E PASS: immutable prospective Shadow to real market Verification",
                    "candidate=", proof["candidate_id"],
                    "frozen_at=", proof["frozen_at"], "target_at=", proof["target_at"],
                    "verified_at=", proof["verified_at"],
                    "control_brier=", proof["control_brier"],
                    "challenger_brier=", proof["challenger_brier"])
          else:
              print("P2.1 PRODUCTION E2E", p["production_e2e_status"],
                    p["readiness"], "no prospective live settlement proof")
          PY
          if [[ "$health" == "WARN" ]]; then
            echo "::warning title=P2.1 Shadow Watchdog::Noncritical market/source freshness warning"
          else
            echo "P2_SHADOW_INDEPENDENT_WATCHDOG_PASS"
          fi
