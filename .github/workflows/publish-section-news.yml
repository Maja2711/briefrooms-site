name: Publish Section News Fast Lane

on:
  schedule:
    - cron: "45 */4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/publish_section_news.py"
      - "tests/test_publish_section_news.py"
      - ".github/workflows/publish-section-news.yml"
  push:
    branches: [main]
    paths:
      - "scripts/publish_section_news.py"
      - "tests/test_publish_section_news.py"
      - ".github/workflows/publish-section-news.yml"

permissions:
  contents: write

concurrency:
  group: news-publication
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate fast-lane contract
        run: |
          python -m py_compile scripts/publish_section_news.py
          python -m unittest tests.test_publish_section_news -v

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STAGE_DIR: /tmp/briefrooms-section-news/${{ github.run_id }}-${{ github.run_attempt }}
      PUBLICATION_ID: section-${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONPATH: scripts
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install feed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser python-dateutil requests

      - name: Build and validate PL and EN section news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_GENERATION_MODEL: gemini-3.5-flash-lite
          GEMINI_REVIEW_MODEL: gemini-3.5-flash-lite
          GEMINI_MIN_INTERVAL_SECONDS: "7"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_AI_MODEL: gpt-4o-mini
          NEWS_AI_REVIEW_MODEL: gpt-4.1-mini
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --ff-only origin/main
          python scripts/publish_section_news.py \
            --publish \
            --stage-dir "${STAGE_DIR}" \
            --publication-id "${PUBLICATION_ID}"

      - name: Commit fresh section news only
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pl/aktualnosci.html \
            en/news.html \
            data/news_story_history_pl.json \
            data/news_story_history_en.json \
            data/news_section_publication_status.json
          if git diff --cached --quiet; then
            echo "::error::Fast lane produced no section-news change."
            exit 1
          fi
          git commit -m "chore(news): publish PL and EN section pages"
          for attempt in 1 2 3; do
            git fetch origin main
            if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
              git rebase origin/main
            fi
            if git push origin HEAD:main; then
              break
            fi
            if [[ "${attempt}" == "3" ]]; then
              echo "::error::Could not push section news after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 10))
          done
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify both pages on production
        run: |
          python scripts/publish_section_news.py \
            --verify \
            --publication-id "${PUBLICATION_ID}" \
            --base-url https://briefrooms.com \
            --attempts 40 \
            --interval 15 \
            --timeout 20

      - name: Upload fast-lane diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section-news-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.STAGE_DIR }}/diagnostics
          if-no-files-found: warn
          retention-days: 30
