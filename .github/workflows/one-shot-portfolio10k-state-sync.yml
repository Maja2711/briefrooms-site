name: One-shot Portfolio 10K state sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-portfolio10k-state-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio10k-state-sync
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Patch canonical state wiring and frontend
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:90]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          # BRACE live analysis must use the actual paper holdings while paper control is active.
          replace_once(
              'scripts/brace_portfolio_engine.py',
              'from brace_portfolio_scoring import score_instrument\n',
              'from brace_portfolio_scoring import score_instrument\nfrom brace_portfolio_state_sync import live_analysis_portfolio\n',
          )
          replace_once(
              'scripts/brace_portfolio_engine.py',
              '    registry = read_json(REGISTRY_PATH)\n    universe = read_json(UNIVERSE_PATH)\n',
              '    registry = read_json(REGISTRY_PATH)\n    paper_portfolio = read_json(PAPER_PATH)\n    analysis_portfolio = (\n        baseline_before\n        if mode == "research"\n        else live_analysis_portfolio(registry, baseline_before, paper_portfolio)\n    )\n    universe = read_json(UNIVERSE_PATH)\n',
          )
          replace_once(
              'scripts/brace_portfolio_engine.py',
              '        analysis, optimization = _analysis_from_market(\n            baseline_before, universe, market, config, now\n        )\n',
              '        analysis, optimization = _analysis_from_market(\n            analysis_portfolio, universe, market, config, now\n        )\n',
          )
          replace_once(
              'scripts/brace_portfolio_engine.py',
              '            record = shadow_record(pending, baseline_before.get("positions") or [], now)\n',
              '            record = shadow_record(pending, analysis_portfolio.get("positions") or [], now)\n',
          )

          # Public control snapshot: only current holdings are assessed; decision queue is reconciled.
          replace_once(
              'scripts/brace_portfolio_user_control.py',
              'from brace_portfolio_publish import build_public_snapshot, publish\n',
              'from brace_portfolio_publish import build_public_snapshot, publish\nfrom brace_portfolio_state_sync import (\n    active_position_ids,\n    filter_position_recommendations,\n    reconcile_public_decisions,\n)\n',
          )
          replace_once(
              'scripts/brace_portfolio_user_control.py',
              'PENDING = ENGINE_DATA_ROOT / "pending_decisions.json"\nSHADOW = ENGINE_DATA_ROOT / "shadow_log.json"\n',
              'PENDING = ENGINE_DATA_ROOT / "pending_decisions.json"\nORDERS = ENGINE_DATA_ROOT / "paper_orders.json"\nSHADOW = ENGINE_DATA_ROOT / "shadow_log.json"\n',
          )
          replace_once(
              'scripts/brace_portfolio_user_control.py',
              '    pending = read_json(PENDING)\n    snapshot = build_public_snapshot(\n        registry, read_json(ANALYSIS), pending, read_json(SHADOW), read_json(HISTORY),\n        read_json(OPERATIONAL), config, now, PAPER.exists(),\n    )\n    snapshot["control_authorization"] = deepcopy(dict(auth))\n    snapshot["position_recommendations"] = deepcopy((pending.get("recommendations") or [])[:20])\n',
              '    pending = read_json(PENDING)\n    paper = read_json(PAPER)\n    orders = read_json(ORDERS)\n    snapshot = build_public_snapshot(\n        registry, read_json(ANALYSIS), pending, read_json(SHADOW), read_json(HISTORY),\n        read_json(OPERATIONAL), config, now, PAPER.exists(),\n    )\n    snapshot["control_authorization"] = deepcopy(dict(auth))\n    snapshot["active_portfolio_ids"] = sorted(active_position_ids(paper))\n    snapshot["portfolio_state_source"] = "data/portfolio10k/paper_portfolio.json"\n    snapshot["position_recommendations"] = filter_position_recommendations(\n        pending.get("recommendations") or [], paper\n    )[:20]\n    snapshot["pending_decisions"] = reconcile_public_decisions(\n        pending.get("decisions") or [], paper, orders, limit=10\n    )\n',
          )

          # Frontend: call the decision list what it is and show execution state explicitly.
          replace_once(
              'scripts/portfolio-10k-control-public.js',
              "    pending:'Decyzja do wykonania (paper)', recommendations:'Ocena każdej pozycji', history:'Historia kontroli',\n",
              "    pending:'Decyzje BRACE (paper)', recommendations:'Ocena każdej pozycji', history:'Historia kontroli',\n",
          )
          replace_once(
              'scripts/portfolio-10k-control-public.js',
              "    pending:'Decision awaiting paper execution', recommendations:'Position-by-position assessment',\n",
              "    pending:'BRACE decisions (paper)', recommendations:'Position-by-position assessment',\n",
          )
          replace_once(
              'scripts/portfolio-10k-control-public.js',
              "  function decisions(items){\n    if(!items?.length)return `<p class=\"brace-empty\">${esc(T.noDecisions)}</p>`;\n    return `<div class=\"control-list\">${items.slice(0,5).map(item=>`<article><div><b>${esc(actionLabel(item.action))}${item.instrument?' · '+esc(item.instrument):''}</b><span>${esc(lang==='pl'?item.rationale_pl:item.rationale_en)}</span></div><strong>${esc(T.confidence)} ${pct(item.confidence)}</strong></article>`).join('')}</div>`;\n  }\n",
              "  function decisions(items){\n    const visible=(items||[]).filter(item=>['PENDING','EXECUTED','ALREADY_APPLIED'].includes(String(item.execution_status||'')));\n    if(!visible.length)return `<p class=\"brace-empty\">${esc(T.noDecisions)}</p>`;\n    return `<div class=\"control-list\">${visible.slice(0,6).map(item=>{\n      const source=item.instrument||item.instrument_id||'';\n      const replacement=item.replacement_instrument||item.replacement_instrument_id||'';\n      const route=String(item.action||'')==='REPLACE'&&replacement?`${source} → ${replacement}`:source;\n      const done=['EXECUTED','ALREADY_APPLIED'].includes(String(item.execution_status||''));\n      const state=done?(lang==='pl'?'WYKONANE':'EXECUTED'):(lang==='pl'?'OCZEKUJE':'PENDING');\n      const note=String(item.execution_status||'')==='ALREADY_APPLIED'?(lang==='pl'?'Stan portfela już odzwierciedla tę zmianę.':'The current portfolio state already reflects this change.'):'';\n      return `<article data-execution-status=\"${esc(item.execution_status||'')}\"><div><b>${esc(actionLabel(item.action))}${route?' · '+esc(route):''}</b><span>${esc(lang==='pl'?item.rationale_pl:item.rationale_en)}${note?' '+esc(note):''}</span></div><strong>${esc(state)} · ${esc(T.confidence)} ${pct(item.confidence)}</strong></article>`;\n    }).join('')}</div>`;\n  }\n",
          )
          replace_once(
              'scripts/portfolio-10k-control-public.js',
              "    const loop=data.learning_loop||{};\n",
              "    const loop=data.learning_loop||{};\n    const activeIds=new Set((data.active_portfolio_ids||[]).map(value=>String(value||'').toLowerCase()));\n    const positionRecommendations=(data.position_recommendations||[]).filter(item=>!activeIds.size||activeIds.has(String(item.instrument||item.instrument_id||'').toLowerCase()));\n",
          )
          replace_once(
              'scripts/portfolio-10k-control-public.js',
              '${recommendations(data.position_recommendations)}</section>',
              '${recommendations(positionRecommendations)}</section>',
          )

          # Legacy BRACE position cards are an old snapshot. Suppress that duplicate live-position block
          # whenever the governed BRACE controller is active; the control panel above is authoritative.
          replace_once(
              'scripts/portfolio-10k-brace-public.js',
              "    const [live, backtest] = await Promise.allSettled([\n      json('/data/investments/portfolio_10k_brace.json'),\n      json('/data/investments/portfolio_10k_brace_backtest.json')\n    ]);\n    if (live.status === 'fulfilled') {\n      renderSummary(live.value);\n      renderLearning(live.value);\n      renderPositions(live.value);\n",
              "    const [live, backtest, control] = await Promise.allSettled([\n      json('/data/investments/portfolio_10k_brace.json'),\n      json('/data/investments/portfolio_10k_brace_backtest.json'),\n      json('/data/portfolio10k/public/brace_engine_public.json')\n    ]);\n    const controlled = control.status === 'fulfilled' && ['PROBATIONARY_CONTROL','ACTIVE_PAPER_CONTROL','ACTIVE_CONTROL'].includes(String(control.value?.controller_status || ''));\n    if (live.status === 'fulfilled') {\n      renderSummary(live.value);\n      renderLearning(live.value);\n      if (controlled && positions) {\n        positions.hidden = true;\n        const heading = positions.previousElementSibling;\n        if (heading?.classList?.contains('brace-section-title')) heading.hidden = true;\n      } else {\n        renderPositions(live.value);\n      }\n",
          )

          # Cache-bust both language variants together.
          for page in ('pl/inwestycje/portfel-10k.html', 'en/investing/portfolio-10k.html'):
              replace_once(page, '/scripts/portfolio-10k-control-public.js?v=4', '/scripts/portfolio-10k-control-public.js?v=5')
              replace_once(page, '/scripts/portfolio-10k-brace-public.js?v=2', '/scripts/portfolio-10k-brace-public.js?v=3')

          Path('tests/test_brace_portfolio_state_sync.py').write_text('''from __future__ import annotations\n\nimport unittest\n\nfrom scripts.brace_portfolio_state_sync import (\n    active_position_ids,\n    filter_position_recommendations,\n    live_analysis_portfolio,\n    reconcile_public_decisions,\n)\n\n\nclass PortfolioStateSyncTests(unittest.TestCase):\n    def setUp(self) -> None:\n        self.paper = {\n            "positions": [\n                {"id": "fwia", "status": "active", "quantity": 10},\n                {"id": "jpm", "status": "paper_active", "quantity": 3},\n            ],\n            "closed_positions": [{"id": "spgi", "quantity": 5}],\n            "transactions": [],\n        }\n\n    def test_live_control_uses_paper_holdings(self) -> None:\n        baseline = {"positions": [{"id": "spgi", "status": "active", "quantity": 5}]}\n        registry = {"controller_state": "PROBATIONARY_CONTROL"}\n        selected = live_analysis_portfolio(registry, baseline, self.paper)\n        self.assertIs(selected, self.paper)\n        self.assertEqual(active_position_ids(selected), {"fwia", "jpm"})\n\n    def test_closed_position_is_not_published_as_live_assessment(self) -> None:\n        rows = [\n            {"instrument": "spgi", "action": "WATCH"},\n            {"instrument": "jpm", "action": "HOLD"},\n        ]\n        self.assertEqual(filter_position_recommendations(rows, self.paper), [{"instrument": "jpm", "action": "HOLD"}])\n\n    def test_decision_queue_is_reconciled_with_actual_portfolio_state(self) -> None:\n        decisions = [\n            {"decision_id": "replace-spgi", "action": "REPLACE", "instrument": "spgi", "replacement_instrument": "jpm"},\n            {"decision_id": "expired-add", "action": "ADD", "instrument": "sxr8"},\n            {"decision_id": "waiting-add", "action": "ADD", "instrument": "sxrz"},\n        ]\n        orders = {"orders": [\n            {"decision_id": "replace-spgi", "status": "FAILED", "failure_reason": "INSTRUMENT_NOT_AVAILABLE"},\n            {"decision_id": "expired-add", "status": "EXPIRED", "failure_reason": "SIGNAL_EXPIRED"},\n            {"decision_id": "waiting-add", "status": "WAITING_FOR_MARKET", "failure_reason": "MARKET_CLOSED"},\n        ]}\n        result = reconcile_public_decisions(decisions, self.paper, orders)\n        by_id = {item["decision_id"]: item for item in result}\n        self.assertEqual(by_id["replace-spgi"]["execution_status"], "ALREADY_APPLIED")\n        self.assertEqual(by_id["waiting-add"]["execution_status"], "PENDING")\n        self.assertNotIn("expired-add", by_id)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8', newline='\n')
          PY

      - name: Install dependencies
        run: python -m pip install --upgrade pip yfinance pandas numpy pytest

      - name: Validate state reconciliation
        run: |
          python -m py_compile scripts/brace_portfolio_state_sync.py scripts/brace_portfolio_engine.py scripts/brace_portfolio_user_control.py
          python -m pytest -q tests/test_brace_portfolio_state_sync.py tests/test_brace_portfolio_engine.py
          node --check scripts/portfolio-10k-control-public.js
          node --check scripts/portfolio-10k-brace-public.js
          grep -F 'analysis_portfolio' scripts/brace_portfolio_engine.py
          grep -F 'active_portfolio_ids' scripts/brace_portfolio_user_control.py
          grep -F 'WYKONANE' scripts/portfolio-10k-control-public.js

      - name: Rebuild current BRACE analysis from live paper holdings
        env:
          BRACE_TESTS_PASSED: "1"
        run: |
          python scripts/brace_portfolio_engine.py --mode weekly --network
          python scripts/brace_portfolio_user_control.py --republish

      - name: Verify public snapshot is clean
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paper=json.loads(Path('data/portfolio10k/paper_portfolio.json').read_text())
          public=json.loads(Path('data/portfolio10k/public/brace_engine_public.json').read_text())
          active={str(p.get('id','')).lower() for p in paper.get('positions',[]) if float(p.get('quantity') or 0)>0 and 'closed' not in str(p.get('status','')).lower() and 'sold' not in str(p.get('status','')).lower()}
          assessed={str(p.get('instrument') or p.get('instrument_id') or '').lower() for p in public.get('position_recommendations',[])}
          if 'spgi' in assessed:
              raise SystemExit('SPGI is still present in live position assessment')
          if not assessed.issubset(active):
              raise SystemExit(f'Non-active assessments remain: {sorted(assessed-active)}')
          if 'jpm' in active and 'jpm' not in assessed:
              raise SystemExit('JPM is active but missing from live BRACE assessment')
          decisions={d.get('decision_id'):d for d in public.get('pending_decisions',[])}
          stale='rotation-3928c5c4628af6ea'
          if stale in decisions and decisions[stale].get('execution_status') not in {'EXECUTED','ALREADY_APPLIED'}:
              raise SystemExit('SPGI->JPM stale decision is not marked completed')
          if any(d.get('order_status') in {'EXPIRED','FAILED'} and d.get('execution_status') not in {'ALREADY_APPLIED','EXECUTED'} for d in decisions.values()):
              raise SystemExit('Expired/failed unexecuted decision leaked into frontend')
          print('active=',sorted(active))
          print('assessed=',sorted(assessed))
          print('public decisions=',[(d.get('decision_id'),d.get('execution_status')) for d in public.get('pending_decisions',[])])
          PY

      - name: Commit clean state and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-portfolio10k-state-sync.yml
          git add scripts/brace_portfolio_state_sync.py scripts/brace_portfolio_engine.py scripts/brace_portfolio_user_control.py \
            scripts/portfolio-10k-control-public.js scripts/portfolio-10k-brace-public.js \
            tests/test_brace_portfolio_state_sync.py pl/inwestycje/portfel-10k.html en/investing/portfolio-10k.html data/portfolio10k
          git commit -m "fix(portfolio10k): make frontend reflect canonical BRACE state"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep $((attempt*3)); continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*4))
          done
          exit 1
