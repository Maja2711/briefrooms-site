name: Private Saxo SIM EURUSD Daily cycle (isolated D1 Free)
# No broker orders, no private data in Git or Actions artifacts.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Select initial D1 schema setup or one private EURUSD cycle'
        required: true
        type: choice
        default: run
        options:
          - run
          - initialize
  schedule:
    - cron: "*/5 * * * *"
  pull_request:
    paths:
      - "scripts/saxo_private_daily_d1_runner.py"
      - "tests/test_saxo_private_daily_d1_runner.py"
      - "tests/test_saxo_private_primary.py"
      - "tests/test_saxo_private_execution_exit.py"
      - "scripts/execution_price_engine.py"
      - "scripts/saxo_private_feed.py"
      - "scripts/saxo_private_chart.py"
      - "tests/test_saxo_private_chart.py"
      - ".github/workflows/saxo-private-eurusd-daily-d1-cycle.yml"
  push:
    branches: [main]
    paths:
      - "scripts/saxo_private_daily_d1_runner.py"
      - "tests/test_saxo_private_daily_d1_runner.py"
      - "tests/test_saxo_private_primary.py"
      - "tests/test_saxo_private_execution_exit.py"
      - "scripts/execution_price_engine.py"
      - "scripts/saxo_private_feed.py"
      - "scripts/saxo_private_chart.py"
      - "tests/test_saxo_private_chart.py"
      - ".github/workflows/saxo-private-eurusd-daily-d1-cycle.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: isolated-private-saxo-eurusd-daily-d1-cycle
  cancel-in-progress: false

jobs:
  regression:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline validation without Saxo or D1 network access
        run: |
          set -euo pipefail
          python -m unittest tests.test_saxo_private_github_artifacts tests.test_saxo_private_daily_d1_runner tests.test_saxo_private_daily_runner tests.test_saxo_private_feed tests.test_saxo_private_primary tests.test_saxo_private_execution_exit tests.test_saxo_private_chart -q
          python -m py_compile scripts/saxo_private_daily_runner.py scripts/saxo_private_daily_d1_runner.py scripts/saxo_private_github_artifacts.py scripts/saxo_private_chart.py

  private-storage-preflight:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PRIVATE_ENABLED: ${{ vars.SAXO_PRIVATE_AUTO_ENABLED }}
      PRIVATE_DATABASE: ${{ vars.SAXO_PRIVATE_D1_DATABASE_ID }}
      PRIVATE_TOKEN: ${{ secrets.SAXO_PRIVATE_D1_API_TOKEN }}
      STREAM_PASSWORD: ${{ secrets.SAXO_PRIVATE_BASIC_PASSWORD }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SAXO_PRIVATE_D1_DATABASE_ID: ${{ vars.SAXO_PRIVATE_D1_DATABASE_ID }}
      SAXO_PRIVATE_D1_API_TOKEN: ${{ secrets.SAXO_PRIVATE_D1_API_TOKEN }}
      SAXO_PRIVATE_BASIC_PASSWORD: ${{ secrets.SAXO_PRIVATE_BASIC_PASSWORD }}
      SAXO_STREAM_PRIMARY: "1"
      SAXO_PRIVATE_STREAM_URL: "https://briefrooms-saxo-eurusd-stream.szczerbinski0577.workers.dev/saxo/quote"
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Report only private D1 activation readiness
        shell: bash
        run: |
          if [ -n "$PRIVATE_DATABASE" ] && [ -n "$PRIVATE_TOKEN" ]; then
            echo "PRIVATE_D1_CREDENTIALS_CONFIGURED=TRUE"
          else
            echo "PRIVATE_D1_CREDENTIALS_CONFIGURED=FALSE"
          fi
          if [ -n "$STREAM_PASSWORD" ]; then
            echo "PRIVATE_SAXO_STREAM_AUTH_CONFIGURED=TRUE"
          else
            echo "PRIVATE_SAXO_STREAM_AUTH_CONFIGURED=FALSE"
          fi
          if [ "$PRIVATE_ENABLED" = "true" ]; then
            echo "PRIVATE_AUTO_SCHEDULE_ENABLED=TRUE"
          else
            echo "PRIVATE_AUTO_SCHEDULE_ENABLED=FALSE"
          fi
      - name: Read-only private D1 initialization and live streaming quote checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          # These checks never create state, persist quotes, print prices or
          # write to public repositories. Errors carry fixed categories only.
          try:
              from saxo_private_daily_d1_runner import D1
              result=D1().query("SELECT generation FROM private_saxo_eurusd_daily WHERE id=1")
              rows=result.get("results",[])
              ok=len(rows)==1 and type(rows[0].get("generation")) is int and rows[0]["generation"]>=0
          except Exception:
              ok=False
          print("PRIVATE_D1_ROW_INITIALIZED=" + str(ok).upper())
          try:
              from saxo_private_feed import fetch_private_saxo_quote
              now=datetime.now(timezone.utc)
              q=fetch_private_saxo_quote(now=now)
              age=(now-q["observed_at"]).total_seconds()
              ok=(0 <= age <= 15 and 0.8 < q["bid"] < q["ask"] < 1.5)
          except Exception:
              ok=False
          print("PRIVATE_SAXO_STREAM_BID_ASK_FRESH=" + str(ok).upper())
          PY

  initialize-private-d1:
    # A missing persisted state is never auto-reinitialized by the scheduler.
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && inputs.operation == 'initialize'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SAXO_PRIVATE_D1_DATABASE_ID: ${{ vars.SAXO_PRIVATE_D1_DATABASE_ID }}
      SAXO_PRIVATE_D1_API_TOKEN: ${{ secrets.SAXO_PRIVATE_D1_API_TOKEN }}
      SAXO_PRIVATE_D1_BOOTSTRAP_ALLOWED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Initialize private EURUSD-only D1 row exactly once
        run: python scripts/saxo_private_daily_d1_runner.py --initialize

  private-paper-cycle:
    # Activation is an explicit owner opt-in after isolated D1 database is ready.
    # Never execute on PRs or code push; do not bypass the enable flag.
    if: >-
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'run'))
      && github.ref == 'refs/heads/main'
      && vars.SAXO_PRIVATE_AUTO_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
      BRIEFROOMS_PRIVATE_RUNTIME: "1"
      SAXO_PRIVATE_PRIMARY: "1"
      # Keep off until private Chart API entitlements + history cutover are proven.
      SAXO_CHART_PRIMARY: ${{ vars.SAXO_CHART_PRIMARY }}
      # Dedicated Saxo SIM STREAM is mandatory for private Daily EPE.
      # Not used in the public Daily price widget or any other instrument.
      SAXO_STREAM_PRIMARY: "1"
      SAXO_PRIVATE_STREAM_URL: "https://briefrooms-saxo-eurusd-stream.szczerbinski0577.workers.dev/saxo/quote"
      SAXO_PRIVATE_QUALITY_GATE: "0"
      SAXO_PRIVATE_AUTO_ENABLED: ${{ vars.SAXO_PRIVATE_AUTO_ENABLED }}
      SAXO_PRIVATE_BASIC_USER: admin
      # Native streaming workflow binds this existing GitHub secret to
      # the isolated worker SAXO_STREAM_BASIC_PASSWORD internally.
      SAXO_PRIVATE_BASIC_PASSWORD: ${{ secrets.SAXO_PRIVATE_BASIC_PASSWORD }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SAXO_PRIVATE_D1_DATABASE_ID: ${{ vars.SAXO_PRIVATE_D1_DATABASE_ID }}
      SAXO_PRIVATE_D1_API_TOKEN: ${{ secrets.SAXO_PRIVATE_D1_API_TOKEN }}
    steps:
      - name: Checkout private runtime code, never store Saxo states in checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore the same upstream Belief and Epistemic context as public Daily
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io
          import json
          import os
          import pathlib
          import tarfile
          import urllib.request
          import zipfile

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          from saxo_private_github_artifacts import read_github_api

          def api(url):
              return read_github_api(url, token)

          for label, artifact, tar_name, destination, env_key, state_name in (
              ("BELIEF", "belief-core-shadow-state", "belief-core-state.tgz",
               "belief_core_state", "BELIEF_CORE_STATE", "state.json"),
              ("EPISTEMIC", "belief-epistemic-state", "belief-epistemic-state.tgz",
               "belief_epistemic_state", "BELIEF_EPISTEMIC_STATE", "epistemic_state.json"),
          ):
              result = json.loads(api(f"https://api.github.com/repos/{repo}/actions/artifacts?name={artifact}&per_page=100"))
              rows = [item for item in result.get("artifacts", []) if not item.get("expired")]
              rows.sort(key=lambda r: r.get("created_at", ""), reverse=True)
              if not rows:
                  print(label + "_CONTEXT=UNAVAILABLE")
                  continue
              payload = api(f"https://api.github.com/repos/{repo}/actions/artifacts/{rows[0]['id']}/zip")
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  data = archive.read(tar_name)
              target = temp / destination
              target.mkdir(parents=True, exist_ok=True)
              # Reject links, absolute paths, parent traversal and unexpected files.
              with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as tar:
                  for member in tar.getmembers():
                      resolved = (target / member.name).resolve()
                      if not resolved.is_relative_to(target.resolve()) or member.issym() or member.islnk():
                          raise ValueError("unsafe_context_archive")
                  tar.extractall(target)
              file = target / state_name
              if not file.is_file() or not file.stat().st_size:
                  raise ValueError("missing_context_state")
              with pathlib.Path(os.environ["GITHUB_ENV"]).open("a") as out:
                  out.write(env_key + "=" + str(file) + "\n")
              print(label + "_CONTEXT=RESTORED")
          PY
      - name: Set strict live and epistemic execution guards
        shell: bash
        run: |
          echo "DAILY_EURUSD_REQUIRE_EPISTEMIC=1" >> "$GITHUB_ENV"
          echo "NO_RETROACTIVE_EXECUTION=1" >> "$GITHUB_ENV"
          echo "NO_RETROACTIVE_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Check current private Saxo SIM BID/ASK without exposing prices or credentials
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timezone
          from saxo_private_feed import fetch_private_saxo_quote
          # This check runs only in the opted-in private process. Execution
          # obtains a fresh quote again; this does not authorize broker orders.
          clock = datetime.now(timezone.utc)
          try:
              quote = fetch_private_saxo_quote(now=clock)
              age = (clock - quote["observed_at"]).total_seconds()
              assert 0 <= age <= 15, "quote_stale_for_private_paper_execution"
              assert 0.8 < float(quote["bid"]) < float(quote["ask"]) < 1.5
          except Exception:
              print("SAXO_PRIVATE_SIM_BID_ASK=UNAVAILABLE_OR_STALE")
              raise SystemExit(1)
          print("SAXO_PRIVATE_SIM_BID_ASK=FRESH_NONREDISTRIBUTABLE_SIM")
          PY
      - name: Read sealed private D1 state; run EURUSD Daily; verify atomic conditional D1 commit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/saxo_private_daily_d1_runner.py
      - name: Confirm no private state can be committed to public checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- data/investments/eurusd_daily_spot.json data/investments/eurusd_daily_history.json; then
            echo "RESULT=BLOCKED_PUBLIC_DAILY_ARTIFACT_MUTATED" >&2
            exit 1
          fi
          echo "PUBLIC_DAILY_ARTIFACTS_UNMODIFIED=TRUE"
