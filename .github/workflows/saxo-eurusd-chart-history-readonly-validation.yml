name: Saxo EURUSD Chart Canonical H1 D1 Read-Only Validation
# Historical BID/ASK OHLC are independently sampled price sides, never a live quote spread.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/saxo-eurusd-chart-history-readonly-validation.yml"]
permissions:
  contents: read
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      BRIEFROOMS_PRIVATE_RUNTIME: "1"
      SAXO_PRIVATE_PRIMARY: "1"
      SAXO_STREAM_PRIMARY: "1"
      SAXO_CHART_PRIMARY: "1"
      SAXO_PRIVATE_BASIC_PASSWORD: ${{ secrets.SAXO_PRIVATE_BASIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate complete private 5d 1m and 10d 30m Chart history, no persistence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from saxo_private_chart import SaxoPrivateChartClient
          client=SaxoPrivateChartClient()
          failed=False
          # Private diagnostics classify *only the magnitude* of a page
          # boundary revision. No market prices/timestamps or raw payloads.
          try:
              first_version,first,_=client._page(30,1200,None)
              first_oldest=first[0]
              second_version,second,_=client._page(30,1200,first_oldest["Time"])
              overlap=[x for x in second if x.get("Time")==first_oldest.get("Time")]
              fields=("OpenBid","OpenAsk","HighBid","HighAsk",
                      "LowBid","LowAsk","CloseBid","CloseAsk")
              if len(overlap)!=1:
                  kind="BOUNDARY_MISSING_OR_DUPLICATE"
              else:
                  d=max(abs(float(overlap[0][field])-float(first_oldest[field]))
                        for field in fields)
                  kind=("EXACT" if d==0 else
                        "ROUNDING_LT_1E6" if d<0.000001 else
                        "SMALL_LT_1E5" if d<0.00001 else
                        "MEDIUM_LT_1E4" if d<0.0001 else "MATERIAL_GTE_1E4")
              print("SAXO_CHART_60D_BOUNDARY="+kind)
              print("SAXO_CHART_60D_VERSION="+
                    ("SAME" if first_version==second_version else "CHANGED"))
          except Exception:
              print("SAXO_CHART_60D_BOUNDARY=UNAVAILABLE")
          for range_,interval in (
              ("5d","1m"),("10d","30m"),
              ("6mo","1d"),("2y","1d")
          ):
              try:
                  bars=client.bars("EURUSD=X",range_,interval)
                  # Never print source prices, times, count, symbols or Saxo headers.
                  min_bars={
                      ("5d","1m"):200,("10d","30m"):65,
                      ("6mo","1d"):60,
                      ("2y","1d"):200,
                  }[(range_,interval)]
                  ok=len(bars)>=min_bars
              except Exception as error:
                  ok=False
                  # The adapter uses only predefined non-sensitive codes.
                  from saxo_private_chart import SaxoChartUnavailable
                  reason=str(error) if isinstance(error,SaxoChartUnavailable) else "unknown_failure"
                  if reason.startswith("saxo_chart_") and reason.replace("_","").islower() and len(reason)<70:
                      print("SAXO_PRIVATE_CHART_"+range_.upper()+"_"+interval.upper()+"_REASON="+reason)
                  else:
                      print("SAXO_PRIVATE_CHART_"+range_.upper()+"_"+interval.upper()+"_REASON=unknown_failure")
              print("SAXO_PRIVATE_CHART_FULL_"+range_.upper()+"_"+interval.upper()+"="+
                    ("PASS" if ok else "BLOCKED"))
              if not ok: failed=True
          print("SAXO_PRIVATE_CHART_FULL_HISTORY="+
                ("PASS" if not failed else "BLOCKED"))
          if failed:
              raise SystemExit(1)
          PY
