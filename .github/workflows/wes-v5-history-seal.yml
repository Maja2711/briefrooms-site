name: Seal WES v5 Historical Artifacts

on:
  push:
    branches: [main]
    paths:
      - "scripts/wes_v5_history_seal.py"
      - "scripts/migrate_wes_v5_history_seals.py"
      - "data/investments/wes_v5_history_seal_manifest.json"
      - ".github/workflows/wes-v5-history-seal.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investment-weekly-positions
  cancel-in-progress: false

jobs:
  seal-history:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Seal WES v5 forecast legs and settlements
        run: |
          set -euo pipefail
          python -m py_compile scripts/wes_v5_history_seal.py scripts/migrate_wes_v5_history_seals.py scripts/audit_weekly_model.py
          python -m unittest tests.test_wes_v5_history_seal -v
          python scripts/migrate_wes_v5_history_seals.py
          python scripts/migrate_wes_v5_history_seals.py --check

      - name: Persist P1 seals through NO RETROACTIVE airlock
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/weekly data/investments/wes_v5_history_seal_manifest.json
          if git diff --cached --quiet; then
            echo "No WES v5 history seal changes."
            exit 0
          fi
          python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD
          git commit -m "Seal WES v5 historical artifacts"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main; then
              python scripts/migrate_wes_v5_history_seals.py --check
              if git push origin HEAD:main; then
                exit 0
              fi
            fi
            git rebase --abort || true
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 3))
          done
