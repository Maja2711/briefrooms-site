name: Probe Saxo SIM private quote independently from Worker status

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/saxo-direct-quote-probe.yml"

permissions:
  contents: read

jobs:
  quote-probe:
    if: github.repository == 'Maja2711/briefrooms-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SAXO_PRIVATE_BASIC_PASSWORD: ${{ secrets.SAXO_PRIVATE_BASIC_PASSWORD }}
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - name: Private quote response and freshness audit (no quote values logged)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from saxo_private_feed import SAXO_WORKER_URL, validate_private_saxo_snapshot
          secret=os.environ.get("SAXO_PRIVATE_BASIC_PASSWORD") or ""
          if not secret:
              print("RESULT=BLOCKED_MISSING_GITHUB_SECRET")
              raise SystemExit(2)
          authorization="Basic "+base64.b64encode(("admin:"+secret).encode("utf-8")).decode("ascii")
          def read(url):
              req=urllib.request.Request(url,headers={
                  "Authorization":authorization,
                  "Accept":"application/json",
                  "Cache-Control":"no-store",
              })
              try:
                  with urllib.request.urlopen(req,timeout=12) as response:
                      return response.status, response.read(16384)
              except urllib.error.HTTPError as e:
                  return e.code, e.read(4096)
              except Exception:
                  return -1, b""
          for label,url in (
              ("STATUS","https://briefrooms-saxo-eurusd.szczerbinski0577.workers.dev/status"),
              ("QUOTE",SAXO_WORKER_URL)
          ):
              status,body=read(url)
              print(label+"_HTTP_STATUS="+str(status))
              if status==200 and label=="QUOTE":
                  try:
                      quote=validate_private_saxo_snapshot(json.loads(body))
                      if quote["source"]=="SAXO_SIM" and quote["redistributable"] is False:
                          print("QUOTE_CONTRACT=FRESH_BID_ASK_VALIDATED")
                      else:
                          print("QUOTE_CONTRACT=INVALID")
                  except Exception:
                      print("QUOTE_CONTRACT=INVALID_OR_STALE")
              elif status==403:
                  try:
                      obj=json.loads(body)
                      if isinstance(obj,dict):
                          print(label+"_ERROR_HAS_STATUS="+str("status" in obj).upper())
                          print(label+"_ERROR_HAS_MESSAGE="+str("message" in obj).upper())
                  except Exception:
                      print(label+"_ERROR_JSON=INVALID")
          print("RESULT=PRIVATE_ENDPOINT_REACHABILITY_CHECKED")
          PY
