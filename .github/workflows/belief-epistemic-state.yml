name: Belief Epistemic State Projection

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Belief Core Live Shadow Collection"]
    types: [completed]
  pull_request:
    paths:
      - "scripts/belief_epistemic_state.py"
      - "scripts/belief_epistemic_live.py"
      - "scripts/canonical_epistemic_state.py"
      - "scripts/canonical_epistemic_state_builder.py"
      - "tests/test_belief_epistemic_state.py"
      - "tests/test_canonical_epistemic_state.py"
      - ".github/workflows/belief-epistemic-state.yml"
      - "docs/BELIEF_EPISTEMIC_STATE.md"
      - "docs/PR32A_CANONICAL_EPISTEMIC_STATE_EN.md"
      - "docs/PR32A_CANONICAL_EPISTEMIC_STATE_PL.md"

permissions:
  contents: read
  actions: read

concurrency:
  group: belief-epistemic-state-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
    steps:
      - name: Checkout authoritative main code after live run
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout PR or manual ref
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Epistemic State contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/belief_epistemic_state.py \
            scripts/belief_epistemic_live.py \
            scripts/canonical_epistemic_state.py \
            scripts/canonical_epistemic_state_builder.py
          python -m unittest \
            tests.test_belief_epistemic_state \
            tests.test_canonical_epistemic_state -v

      - name: Restore triggering Belief Core state
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/belief-state-artifact" "$RUNNER_TEMP/belief_core_state"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            > "$RUNNER_TEMP/artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/artifacts.json" <<'PY'
          import json, sys
          from pathlib import Path
          rows=json.loads(Path(sys.argv[1]).read_text()).get('artifacts', [])
          rows=[x for x in rows if x.get('name') == 'belief-core-shadow-state' and not x.get('expired')]
          print(rows[0]['id'] if rows else '')
          PY
          )
          test -n "$artifact_id"
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o "$RUNNER_TEMP/belief-state.zip"
          unzip -q "$RUNNER_TEMP/belief-state.zip" -d "$RUNNER_TEMP/belief-state-artifact"
          test -f "$RUNNER_TEMP/belief-state-artifact/belief-core-state.tgz"
          tar -xzf "$RUNNER_TEMP/belief-state-artifact/belief-core-state.tgz" -C "$RUNNER_TEMP/belief_core_state"
          echo "STATE_DIR=$RUNNER_TEMP/belief_core_state" >> "$GITHUB_ENV"

      - name: Restore cumulative prior Epistemic State history
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=belief-epistemic-state&per_page=100"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > "$RUNNER_TEMP/epistemic-artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/epistemic-artifacts.json" <<'PY'
          import json, sys
          from pathlib import Path
          rows=json.loads(Path(sys.argv[1]).read_text()).get('artifacts', [])
          rows=[x for x in rows if not x.get('expired')]
          rows.sort(key=lambda x: x.get('created_at',''), reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
          )
          if [ -z "$artifact_id" ]; then
            echo "No prior Epistemic State artifact; starting prospective history."
            exit 0
          fi
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o "$RUNNER_TEMP/epistemic-state.zip"
          mkdir -p "$RUNNER_TEMP/epistemic-state-artifact"
          unzip -q "$RUNNER_TEMP/epistemic-state.zip" -d "$RUNNER_TEMP/epistemic-state-artifact"
          test -f "$RUNNER_TEMP/epistemic-state-artifact/belief-epistemic-state.tgz"
          mkdir -p "$RUNNER_TEMP/prior-epistemic-state"
          tar -xzf "$RUNNER_TEMP/epistemic-state-artifact/belief-epistemic-state.tgz" -C "$RUNNER_TEMP/prior-epistemic-state"
          if [ -f "$RUNNER_TEMP/prior-epistemic-state/epistemic_state_history.jsonl" ]; then
            cp "$RUNNER_TEMP/prior-epistemic-state/epistemic_state_history.jsonl" "$STATE_DIR/epistemic_state_history.jsonl"
          fi

      - name: Build authoritative Epistemic State projection
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          python scripts/belief_epistemic_live.py --state-dir "$STATE_DIR" --print-summary
          test -f "$STATE_DIR/epistemic_state.json"
          test -f "$STATE_DIR/epistemic_state_history.jsonl"
          test -f "$STATE_DIR/epistemic_drilldown_index.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['STATE_DIR'])
          state=json.loads((root/'epistemic_state.json').read_text())
          assert state['contract_version'] == 'belief-epistemic-state-v1'
          assert state['authority']['llm_may_ignore_aggregate'] is False
          assert state['authority']['llm_may_override_probability'] is False
          assert state['controls']['belief_core_writeback_enabled'] is False
          assert state['controls']['llm_override_enabled'] is False
          history=[x for x in (root/'epistemic_state_history.jsonl').read_text().splitlines() if x.strip()]
          assert history
          print('Aggregate Authority Principle: PASS')
          print('Epistemic history rows:', len(history))
          PY

      - name: Build PR32A canonical EpistemicState
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          python scripts/canonical_epistemic_state_builder.py --state-dir "$STATE_DIR" --print-summary
          test -s "$STATE_DIR/canonical_epistemic_state.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['STATE_DIR'])
          state=json.loads((root/'canonical_epistemic_state.json').read_text(encoding='utf-8'))
          assert state['contract_version'] == 'briefrooms-epistemic-state-v1'
          assert state['state_id'].startswith('eps-')
          assert len(state['state_hash']) == 64
          assert state['provenance_path'] == 'state->belief->evidence->observation->source'
          assert state['authority']['decision_authority'] is False
          assert state['authority']['risk_limit_authority'] is False
          assert state['authority']['trade_execution_authority'] is False
          assert state['authority']['belief_core_writeback_enabled'] is False
          assert state['authority']['automatic_tuning_enabled'] is False
          print('PR32A_CANONICAL_EPISTEMIC_STATE_PASS', state['state_id'])
          PY

      - name: Pack cumulative Epistemic State runtime artifact
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/belief-epistemic-state.tgz" -C "$STATE_DIR" \
            epistemic_state.json \
            epistemic_state_history.jsonl \
            epistemic_drilldown_index.json \
            canonical_epistemic_state.json

      - name: Store cumulative Epistemic State outside repository
        if: github.event_name == 'workflow_run'
        uses: actions/upload-artifact@v4
        with:
          name: belief-epistemic-state
          path: ${{ runner.temp }}/belief-epistemic-state.tgz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
