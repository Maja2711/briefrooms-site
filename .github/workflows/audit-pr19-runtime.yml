name: Audit PR19 Runtime

on:
  pull_request:
    paths:
      - ".github/workflows/audit-pr19-runtime.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify first post-merge PR19 production artifact
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_AT: "2026-08-20T13:51:17Z"
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, os, subprocess, tarfile, tempfile, time, urllib.parse, urllib.request, zipfile
          from datetime import datetime
          from pathlib import Path

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          merged_at=datetime.fromisoformat(os.environ['MERGED_AT'].replace('Z','+00:00'))
          headers={
              'Authorization': f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'BriefRooms-PR19-Runtime-Audit/1.0',
          }
          def dt(x): return datetime.fromisoformat(str(x).replace('Z','+00:00'))
          def api_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          def api_bytes(url):
              p=subprocess.run([
                  'curl','-fsSL','-L',
                  '-H',f'Authorization: Bearer {token}',
                  '-H','Accept: application/vnd.github+json',
                  '-H','X-GitHub-Api-Version: 2022-11-28',url,
              ],check=True,stdout=subprocess.PIPE)
              return p.stdout

          name='belief-epistemic-causal-graph-state'
          q=urllib.parse.quote(name,safe='')
          artifact=None
          for _ in range(60):
              data=api_json(f'https://api.github.com/repos/{repo}/actions/artifacts?name={q}&per_page=100')
              rows=[x for x in data.get('artifacts',[]) if not x.get('expired')]
              rows.sort(key=lambda x:x.get('created_at',''), reverse=True)
              if rows and dt(rows[0]['created_at']) >= merged_at:
                  artifact=rows[0]
                  break
              time.sleep(5)
          assert artifact is not None, 'No fresh PR19 artifact after merge'
          run_id=(artifact.get('workflow_run') or {}).get('id')
          assert run_id, artifact
          run=api_json(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}')
          assert run.get('status')=='completed' and run.get('conclusion')=='success', run
          assert run.get('name')=='Belief Epistemic Causal Graph Shadow', run.get('name')

          raw=api_bytes(artifact['archive_download_url'])
          with tempfile.TemporaryDirectory() as tmp:
              root=Path(tmp)
              with zipfile.ZipFile(io.BytesIO(raw)) as zf: zf.extractall(root/'zip')
              tgz=root/'zip'/'belief-epistemic-causal-graph-state.tgz'
              assert tgz.exists()
              out=root/'state'; out.mkdir()
              with tarfile.open(tgz,'r:gz') as tf: tf.extractall(out,filter='data')
              report=json.loads((out/'BELIEF_EPISTEMIC_CAUSAL_GRAPH_REPORT.json').read_text())
              state=json.loads((out/'BELIEF_EPISTEMIC_CAUSAL_GRAPH_STATE.json').read_text())

              assert report['mode']=='research_shadow'
              assert report['active_decision_influence'] is False
              assert report['graph_runtime']['causal_status']=='UNVERIFIED_HYPOTHESIS'
              assert report['graph_runtime']['causal_proof'] is False
              assert report['graph_runtime']['correlation_to_causation_inference'] is False
              assert report['sample']['verified_causal_edges']==0
              assert report['research_boundary']['graph_edges_are_hypotheses_not_causal_proof'] is True
              assert report['research_boundary']['operational_correctness_is_not_automatically_causal_validation'] is True
              assert report['research_boundary']['entity_fundamental_correctness_is_not_economic_value'] is True
              assert report['research_boundary']['miv_score_enabled'] is False
              assert report['research_boundary']['alpha_score_enabled'] is False
              assert report['research_boundary']['engine_specific_trust_enabled'] is False
              assert report['prospective_binding']['first_run_existing_forecasts_cursor_only'] is True
              assert report['prospective_binding']['graph_snapshot_must_preexist_forecast'] is True
              assert report['prospective_binding']['epistemic_contract_must_preexist_forecast'] is True
              assert report['prospective_binding']['terminal_unbound_never_retroactively_bound'] is True
              assert report['promotion']['status']=='NOT_ELIGIBLE_FOR_PROMOTION_REVIEW'
              assert report['promotion']['eligible_for_promotion_review'] is False
              assert report['promotion']['automatic_promotion'] is False
              assert report['promotion']['effective_n_threshold_defined_here'] is False
              assert report['safety_controls'] and all(v is False for v in report['safety_controls'].values())
              assert report['measurement_epistemics']['explicit_claim_outcome_gap_count'] > 0

              pre=set(state.get('pre_activation_forecast_ids') or [])
              bindings=state.get('forecast_bindings') or {}
              assert not (pre & set(bindings))
              snapshots=state.get('graph_snapshots') or {}
              assert snapshots
              for binding in bindings.values():
                  assert binding['prospective'] is True
                  assert binding['historical_backfill'] is False
                  assert binding['retroactive_causal_classification'] is False
                  assert binding['decision_influence'] is False
                  assert binding['promotion_authority'] is False
                  snap=snapshots[binding['graph_snapshot_id']]
                  assert dt(snap['created_at']) <= dt(binding['forecast_at'])
                  ref=snap['contract_index'][binding['belief_id']]
                  assert ref['epistemic_contract_id']==binding['epistemic_contract_id']
                  assert ref['immutable_sha256']==binding['epistemic_contract_sha256']
              for row in (state.get('terminal_unbound_forecasts') or {}).values():
                  assert row['terminal_no_retroactive_binding'] is True
              for edge in report['graph']['edges']:
                  assert edge['causal_status']=='UNVERIFIED_HYPOTHESIS'
                  assert edge['causal_proof'] is False
                  assert edge['decision_influence'] is False
              for contract in report['contracts'].values():
                  for key in ('causal_assumptions','transmission_path','falsifiers','alternative_explanations','unknowns','regime_dependencies'):
                      assert contract[key], (contract['belief_id'], key)
                  assert any(x['machine_testable'] is True for x in contract['falsifiers'])
                  assert contract['causal_proof'] is False
                  assert contract['decision_influence'] is False

              summary={
                  'run_id':run_id,
                  'event':run.get('event'),
                  'artifact_id':artifact['id'],
                  'artifact_created_at':artifact['created_at'],
                  'canonical_beliefs_total':report['sample']['canonical_beliefs_total'],
                  'beliefs_by_layer':report['sample']['beliefs_by_layer'],
                  'graph_nodes':report['sample']['graph_nodes'],
                  'graph_edges':report['sample']['graph_edges'],
                  'verified_causal_edges':report['sample']['verified_causal_edges'],
                  'explicit_claim_outcome_gap_count':report['measurement_epistemics']['explicit_claim_outcome_gap_count'],
                  'pr15_forecasts_visible':report['sample']['pr15_forecasts_visible'],
                  'pre_activation_forecasts_total':report['sample']['pre_activation_forecasts_total'],
                  'forecast_bindings_total':report['sample']['forecast_bindings_total'],
                  'terminal_unbound_forecasts_total':report['sample']['terminal_unbound_forecasts_total'],
                  'graph_snapshots_total':report['graph_runtime']['graph_snapshots_total'],
                  'new_graph_snapshot_this_run':report['graph_runtime']['new_graph_snapshot_this_run'],
                  'promotion_status':report['promotion']['status'],
              }
              print('PR19_RUNTIME_AUDIT=PASS')
              print(json.dumps(summary,indent=2,sort_keys=True))
          PY
