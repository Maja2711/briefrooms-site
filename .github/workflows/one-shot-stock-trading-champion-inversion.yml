name: One-shot Stock Trading Champion Inversion

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-stock-trading-champion-inversion.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-trading-champion-inversion-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply Champion Inversion and repair v1 challenger defects
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          def replace_once(path, old, new):
              p = root / path
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected migration anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) US v1 shadow: no arbitrary 09:45 cutoff.  It scans throughout
          # the regular session and treats score as ranking, never as a veto.
          p = root / 'data/investments/us_daily_stock_config.json'
          cfg = json.loads(p.read_text(encoding='utf-8'))
          cfg['policy_version'] = 'us-short-horizon-en-v1.1-continuous-shadow'
          cfg['publication_cutoff'] = None
          cfg['continuous_session_scan'] = True
          cfg['top_candidates_for_news'] = max(12, int(cfg.get('top_candidates_for_news') or 0))
          p.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          replace_once(
              'scripts/us_daily_stock.py',
              '''    start = parse_clock(config["analysis_not_before"])\n    cutoff = parse_clock(config["publication_cutoff"])\n''',
              '''    start = parse_clock(config["analysis_not_before"])\n    cutoff_raw = config.get("publication_cutoff")\n    cutoff = parse_clock(cutoff_raw) if cutoff_raw else None\n'''
          )
          replace_once(
              'scripts/us_daily_stock.py',
              '''    if now.time() >= cutoff:\n        current = load_json(PUBLIC_PATH)\n        if isinstance(current, dict) and current.get("date") == now.date().isoformat() and current.get("decision") in {"TRADE", "NO_TRADE"}:\n            return current\n        return base_payload(now, config, "DATA_ERROR", f"No validated signal was completed before {config['publication_cutoff']} ET.")\n''',
              '''    # Continuous Stock Trading / v1-shadow scan: an arbitrary morning\n    # publication cutoff must never turn the rest of the US session into CASH.\n    # A cutoff remains supported only for explicitly legacy configurations.\n    if cutoff is not None and not bool(config.get("continuous_session_scan", False)) and now.time() >= cutoff:\n        current = load_json(PUBLIC_PATH)\n        if isinstance(current, dict) and current.get("date") == now.date().isoformat() and current.get("decision") in {"TRADE", "NO_TRADE"}:\n            return current\n        return base_payload(now, config, "DATA_ERROR", f"No validated signal was completed before {config['publication_cutoff']} ET.")\n'''
          )
          replace_once(
              'scripts/us_daily_stock.py',
              '''    review_rejections = []\n    approved = None\n    for score, candidate, analysis in eligible:\n        review = gemini_review(candidate, analysis, score)\n        if review.get("approved"):\n            approved = (score, candidate, analysis, review)\n            break\n        review_rejections.append({"symbol": candidate["symbol"], "score": score, "reason": review.get("reason")})\n    if approved is None:\n        payload = base_payload(now, config, "NO_TRADE", "All eligible candidates failed the independent integrity review.")\n        payload["data_quality"] = {"status": "healthy", "complete_ratio": round(ratio, 4), "expected_session": expected.isoformat(), "review_rejections": review_rejections}\n        return payload\n\n    score, candidate, analysis, review = approved\n    candidate = reprice(candidate, now=now)\n''',
              '''    review_rejections = []\n    execution_rejections = []\n    approved = None\n    for score, candidate, analysis in eligible:\n        review = gemini_review(candidate, analysis, score)\n        if not review.get("approved"):\n            review_rejections.append({"symbol": candidate["symbol"], "score": score, "reason": review.get("reason")})\n            continue\n        # Approval is not terminal.  Revalidate execution geometry here; if\n        # rank #1 fails, continue to rank #2, #3... instead of ending the scan.\n        try:\n            repriced = reprice(candidate, now=now)\n            entry = float((repriced.get("market_snapshot") or {}).get("last") or repriced.get("reference_price") or 0.0)\n            stop = float(repriced.get("stop") or 0.0)\n            risk_percent = (entry - stop) / entry if entry > 0 else 99.0\n            if entry <= 0 or not stop < entry or risk_percent <= 0 or risk_percent > float(config["maximum_risk_percent"]):\n                raise PublicationError("fresh execution geometry outside hard risk limit")\n            candidate = repriced\n        except Exception as exc:\n            execution_rejections.append({"symbol": candidate.get("symbol"), "score": score, "reason": f"{type(exc).__name__}: {str(exc)[:180]}"})\n            continue\n        approved = (score, candidate, analysis, review)\n        break\n    if approved is None:\n        payload = base_payload(now, config, "NO_TRADE", "All eligible candidates failed independent review or fresh execution revalidation.")\n        payload["data_quality"] = {"status": "healthy", "complete_ratio": round(ratio, 4), "expected_session": expected.isoformat(), "review_rejections": review_rejections, "execution_rejections": execution_rejections}\n        return payload\n\n    score, candidate, analysis, review = approved\n'''
          )
          replace_once(
              'scripts/us_daily_stock.py',
              '''        "provider_failures": failures, "provider_usage": providers, "analysis_rejections": rejects, "review_rejections": review_rejections,\n''',
              '''        "provider_failures": failures, "provider_usage": providers, "analysis_rejections": rejects, "review_rejections": review_rejections, "execution_rejections": execution_rejections,\n'''
          )

          # Legacy runtime wrapper must also respect continuous-session mode.
          replace_once(
              'scripts/us_daily_stock_runtime.py',
              '''def _generate_with_recovery(now: datetime, config: dict[str, Any]) -> dict[str, Any]:\n    normal_cutoff = us.parse_clock(config["publication_cutoff"])\n''',
              '''def _generate_with_recovery(now: datetime, config: dict[str, Any]) -> dict[str, Any]:\n    if bool(config.get("continuous_session_scan", False)) or not config.get("publication_cutoff"):\n        return us.generate(now)\n    normal_cutoff = us.parse_clock(config["publication_cutoff"])\n'''
          )

          # US adapter: score 72 is a ranking target, not a hard admission veto.
          p = root / 'scripts/us_stock_candidate.py'
          text = p.read_text(encoding='utf-8')
          old_block = '''    if score < target:\n        cash = us.base_payload(\n            now,\n            config,\n            "NO_TRADE",\n            f"Best reviewed US candidate scored {score:.2f}, below the {target:.0f} Stock Trading admission threshold. CASH remains valid.",\n        )\n        cash["locked"] = True\n        cash["candidate_watch"] = {\n            "symbol": selection.get("symbol"),\n            "score": score,\n            "required_score": target,\n            "reason": "entry_score_below_threshold",\n        }\n        cash["data_quality"] = result.get("data_quality") or {}\n        cash["metrics"] = result.get("metrics") or us.metric_summary()\n        return cash\n\n'''
          if old_block not in text:
              raise SystemExit('US score-veto block not found')
          text = text.replace(old_block, '', 1)
          text = text.replace(
              'f"Qualified US Stock Trading candidate: score {score:.2f} met the {target:.0f} threshold. "',
              'f"Qualified US Stock Trading candidate: score {score:.2f}; {target:.0f} is a ranking target, not an admission veto. "',
              1,
          )
          old_validate = '''    if float(selection.get("score") or 0.0) < float(config["target_score"]):\n        raise us.PublicationError("US Stock Trading cannot publish a below-threshold trade.")\n'''
          if old_validate not in text:
              raise SystemExit('US validation score-veto block not found')
          text = text.replace(old_validate, '', 1)
          text = text.replace(
              'This adapter changes only the trading contract: score below the configured target\nis CASH/NO_TRADE, a qualified setup has no fixed holding deadline, and the actual\nposition is owned by stock_trading_portfolio.py (up to three US positions).',
              'This adapter changes only the trading contract: score is a ranking/conviction\nfeature rather than a hard veto, a qualified setup has no fixed holding deadline,\nand v1 writes only to its isolated shadow challenger portfolio after inversion.',
              1,
          )
          p.write_text(text, encoding='utf-8')

          # Production policy now names v2 Champion and prevents legacy candidate
          # admission into the canonical book.  Hard safety gates stay intact.
          p = root / 'data/investments/stock_trading_policy.json'
          policy = json.loads(p.read_text(encoding='utf-8'))
          policy['policy_version'] = 'stock-trading-v2-champion-canary-v1'
          policy['champion_engine'] = 'v2'
          policy['challenger_engine'] = 'v1'
          policy['legacy_candidate_admission_enabled'] = False
          policy['score_policy'] = 'ranking_not_hard_admission_gate'
          for market in ('GPW', 'US'):
              policy['markets'][market]['minimum_entry_score'] = 0
          p.write_text(json.dumps(policy, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Canonical portfolio reviews v2 positions only; v1 candidate admission
          # is explicitly opt-in for the isolated challenger runtime.
          replace_once(
              'scripts/stock_trading_portfolio.py',
              '''    payload = _load(_candidate_path(market, policy), {})\n    if isinstance(payload, Mapping):\n        updated, admission = admit_candidate(updated, market, payload, now=now, policy=policy)\n        audits.append(admission)\n''',
              '''    if bool(policy.get("legacy_candidate_admission_enabled", True)):\n        payload = _load(_candidate_path(market, policy), {})\n        if isinstance(payload, Mapping):\n            updated, admission = admit_candidate(updated, market, payload, now=now, policy=policy)\n            audits.append(admission)\n'''
          )
          replace_once(
              'scripts/stock_trading_portfolio.py',
              '''    if args.mode == "sync-candidates":\n        actions = []\n''',
              '''    if args.mode == "sync-candidates":\n        if policy.get("legacy_candidate_admission_enabled") is False:\n            raise SystemExit("Legacy v1 candidate admission is disabled in the canonical v2 Champion portfolio; use stock_trading_v1_shadow.py.")\n        actions = []\n'''
          )

          # GPW v1 shadow: search the ranked universe rather than selecting a
          # negative-EV rank #1 and letting the portfolio reject it afterward.
          replace_once(
              'scripts/gpw_mandatory_daily.py',
              '''    opening_top_candidates = max(1, int(policy.get("opening_confirmation_top_candidates", 8)))\n''',
              '''    opening_top_candidates = int(policy.get("opening_confirmation_top_candidates", 0))\n'''
          )
          replace_once(
              'scripts/gpw_mandatory_daily.py',
              '''    for candidate in ranked:\n        if len(evaluated) >= opening_top_candidates:\n            break\n''',
              '''    for candidate in ranked:\n        if opening_top_candidates > 0 and len(evaluated) >= opening_top_candidates:\n            break\n'''
          )
          replace_once(
              'scripts/gpw_mandatory_daily.py',
              '''                enriched = ev.apply_dynamic_target(enriched, model)\n                final_score, ev_weight = ev.blend_score(opening_adjusted, model, config)\n''',
              '''                conservative_ev = model.get("conservative_ev_r")\n                if conservative_ev is not None and float(conservative_ev) <= 0.0:\n                    candidate_errors[symbol] = "non_positive_conservative_expected_value"\n                    continue\n                enriched = ev.apply_dynamic_target(enriched, model)\n                final_score, ev_weight = ev.blend_score(opening_adjusted, model, config)\n'''
          )
          p = root / 'data/investments/gpw_mandatory_daily_config.json'
          gpw_cfg = json.loads(p.read_text(encoding='utf-8'))
          gpw_cfg['opening_confirmation_top_candidates'] = 0
          gpw_cfg['candidate_search_policy'] = 'search_ranked_universe_until_all_hard_gates_including_conservative_ev_pass'
          p.write_text(json.dumps(gpw_cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Workflows: v1 continues running, but only as shadow challenger.
          p = root / '.github/workflows/us-daily-stock-en.yml'
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '''              if float(s.get('score') or 0)<72:\n                  raise SystemExit('US Stock Trading cannot lower the 72 entry threshold')\n''',
              '''              # Score is a ranking/conviction feature, not a hard veto.\n''',
              1,
          )
          text = text.replace(
              '''      - name: Feed canonical US Stock Trading portfolio\n        run: |\n          set -euo pipefail\n          python scripts/stock_trading_portfolio.py --mode sync-candidates --market US\n          python scripts/stock_trading_portfolio.py --mode verify\n''',
              '''      - name: Feed isolated v1 US shadow challenger\n        run: |\n          set -euo pipefail\n          python scripts/stock_trading_v1_shadow.py --market US\n          python scripts/stock_trading_v1_shadow.py --verify\n          python scripts/stock_trading_portfolio.py --mode verify\n''',
              1,
          )
          text = text.replace(
              '''            scripts/stock_trading_portfolio.py \\\n            scripts/daily_stock_rejected_candidate_freeze.py \\\n''',
              '''            scripts/stock_trading_portfolio.py \\\n            scripts/stock_trading_v1_shadow.py \\\n            scripts/daily_stock_rejected_candidate_freeze.py \\\n''',
              1,
          )
          text = text.replace(
              '''          git add data/investments/stock_trading_portfolio.json 2>/dev/null || true\n''',
              '''          git add data/investments/stock_trading_v1_shadow_portfolio.json 2>/dev/null || true\n''',
              1,
          )
          p.write_text(text, encoding='utf-8')

          p = root / '.github/workflows/gpw-daily-pick-pl.yml'
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '''            scripts/stock_trading_portfolio.py\n''',
              '''            scripts/stock_trading_portfolio.py \\\n            scripts/stock_trading_v1_shadow.py\n''',
              1,
          )
          text = text.replace(
              '''          python scripts/stock_trading_portfolio.py --mode sync-candidates --market GPW\n          python scripts/stock_trading_portfolio.py --mode verify\n''',
              '''          python scripts/stock_trading_v1_shadow.py --market GPW\n          python scripts/stock_trading_v1_shadow.py --verify\n          python scripts/stock_trading_portfolio.py --mode verify\n''',
              1,
          )
          text = text.replace(
              '''          git add data/investments/stock_trading_portfolio.json 2>/dev/null || true\n''',
              '''          git add data/investments/stock_trading_v1_shadow_portfolio.json 2>/dev/null || true\n''',
              1,
          )
          p.write_text(text, encoding='utf-8')

          p = root / '.github/workflows/stock-trading-portfolio.yml'
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'python -m py_compile scripts/stock_trading_portfolio.py scripts/stock_trading_quote_enricher.py',
              'python -m py_compile scripts/stock_trading_portfolio.py scripts/stock_trading_quote_enricher.py scripts/stock_trading_v1_shadow.py scripts/stock_trading_v2_production_bridge.py',
              1,
          )
          text = text.replace(
              'python -m unittest tests.test_stock_trading_portfolio tests.test_stock_trading_quote_enricher -v',
              'python -m unittest tests.test_stock_trading_portfolio tests.test_stock_trading_quote_enricher tests.test_stock_trading_v2_production_bridge -v',
              1,
          )
          text = text.replace(
              '''          python scripts/stock_trading_quote_enricher.py --market "${{ steps.market.outputs.value }}" --verify\n          python scripts/stock_trading_portfolio.py --mode verify\n''',
              '''          python scripts/stock_trading_quote_enricher.py --market "${{ steps.market.outputs.value }}" --verify\n          python scripts/stock_trading_v1_shadow.py --market "${{ steps.market.outputs.value }}"\n          python scripts/stock_trading_v1_shadow.py --verify\n          python scripts/stock_trading_portfolio.py --mode verify\n''',
              1,
          )
          text = text.replace(
              '''          git add -- data/investments/stock_trading_portfolio.json\n''',
              '''          git add -- data/investments/stock_trading_portfolio.json data/investments/stock_trading_v1_shadow_portfolio.json\n''',
              1,
          )
          p.write_text(text, encoding='utf-8')

          # Update obsolete recovery tests to the continuous-session contract.
          p = root / 'tests/test_us_daily_stock.py'
          text = p.read_text(encoding='utf-8')
          start = text.find('    def test_runtime_recovery_extends_only_operational_cutoff(self):')
          end = text.find('\n\nif __name__', start)
          if start < 0 or end < 0:
              raise SystemExit('US runtime cutoff test block not found')
          replacement = '''    def test_runtime_continuous_session_has_no_operational_cutoff(self):\n        cfg = us.load_json(us.CONFIG_PATH)\n        self.assertIsNone(cfg["publication_cutoff"])\n        self.assertTrue(cfg["continuous_session_scan"])\n        now = datetime(2026, 8, 19, 15, 15, tzinfo=NY)\n        observed = {"calls": 0}\n\n        def fake_generate(moment):\n            observed["calls"] += 1\n            return us.base_payload(moment, cfg, "NO_TRADE", "continuous scan")\n\n        with patch.object(us, "generate", side_effect=fake_generate):\n            payload = runtime._generate_with_recovery(now, cfg)\n        self.assertEqual(observed["calls"], 1)\n        self.assertEqual(payload["decision"], "NO_TRADE")\n\n'''
          p.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Validate repaired challenger and v2 production boundary
        run: |
          set -euo pipefail
          python -m json.tool data/investments/us_daily_stock_config.json >/dev/null
          python -m json.tool data/investments/stock_trading_policy.json >/dev/null
          python -m json.tool data/investments/gpw_mandatory_daily_config.json >/dev/null
          python -m json.tool data/investments/stock_trading_v2_production_config.json >/dev/null
          python -m py_compile \
            scripts/us_daily_stock.py \
            scripts/us_daily_stock_runtime.py \
            scripts/us_stock_candidate.py \
            scripts/gpw_mandatory_daily.py \
            scripts/stock_trading_portfolio.py \
            scripts/stock_trading_v1_shadow.py \
            scripts/stock_trading_v2_production_bridge.py
          python -m unittest \
            tests.test_us_daily_stock \
            tests.test_stock_trading_portfolio \
            tests.test_stock_trading_v2_production_bridge \
            tests.test_gpw_mandatory_daily -v
          python - <<'PY'
          import json
          from pathlib import Path
          us=json.loads(Path('data/investments/us_daily_stock_config.json').read_text())
          pol=json.loads(Path('data/investments/stock_trading_policy.json').read_text())
          gpw=json.loads(Path('data/investments/gpw_mandatory_daily_config.json').read_text())
          assert us['publication_cutoff'] is None
          assert us['continuous_session_scan'] is True
          assert pol['champion_engine']=='v2'
          assert pol['challenger_engine']=='v1'
          assert pol['legacy_candidate_admission_enabled'] is False
          assert pol['markets']['US']['minimum_entry_score']==0
          assert pol['markets']['GPW']['minimum_entry_score']==0
          assert gpw['opening_confirmation_top_candidates']==0
          print('CHAMPION_INVERSION_MIGRATION_OK')
          PY

      - name: Commit migration and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-stock-trading-champion-inversion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/investments/us_daily_stock_config.json \
            data/investments/stock_trading_policy.json \
            data/investments/gpw_mandatory_daily_config.json \
            scripts/us_daily_stock.py \
            scripts/us_daily_stock_runtime.py \
            scripts/us_stock_candidate.py \
            scripts/gpw_mandatory_daily.py \
            scripts/stock_trading_portfolio.py \
            tests/test_us_daily_stock.py \
            .github/workflows/us-daily-stock-en.yml \
            .github/workflows/gpw-daily-pick-pl.yml \
            .github/workflows/stock-trading-portfolio.yml \
            .github/workflows/one-shot-stock-trading-champion-inversion.yml
          git commit -m "Stock Trading: invert Champion and repair v1 shadow search"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt*4))
          done
          exit 1
