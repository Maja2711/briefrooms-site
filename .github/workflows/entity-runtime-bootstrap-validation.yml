name: Entity Runtime Bootstrap Validation

on:
  pull_request:
    paths:
      - ".github/workflows/brace-entity-evidence-interpretation.yml"
      - ".github/workflows/brace-entity-belief-state-forecast.yml"
      - ".github/workflows/entity-runtime-bootstrap-validation.yml"
      - "tests/test_entity_runtime_bootstrap_workflows.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert PR14 and PR15 production bootstrap triggers
        run: python -m unittest tests.test_entity_runtime_bootstrap_workflows -v
