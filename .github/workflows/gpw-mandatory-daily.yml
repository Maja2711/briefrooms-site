name: Enforce GPW Daily Selection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/gpw_mandatory_daily.py"
      - "data/investments/gpw_mandatory_daily_config.json"
      - "tests/test_gpw_mandatory_daily.py"
      - ".github/workflows/gpw-mandatory-daily.yml"
  schedule:
    # Warsaw guard in the script makes these safe across CET/CEST.
    - cron: "25 7 * * 1-5"
    - cron: "40 7 * * 1-5"
    - cron: "55 7 * * 1-5"
    - cron: "10 8 * * 1-5"
    - cron: "25 8 * * 1-5"

permissions:
  contents: write
  pages: write

concurrency:
  group: gpw-mandatory-daily
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate mandatory selector runtime
        run: |
          set -euo pipefail
          python -m py_compile scripts/gpw_mandatory_daily.py
          python -m json.tool data/investments/gpw_mandatory_daily_config.json >/dev/null

      - name: Enforce one GPW selection when primary engine is empty
        run: python scripts/gpw_mandatory_daily.py

      - name: Validate resulting GPW payload
        run: python scripts/gpw_mandatory_daily.py --validate

      - name: Persist mandatory GPW state
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/gpw_daily_pick.json data/investments/gpw_daily_pick_metrics.json 2>/dev/null || true
          git add data/investments/gpw_daily_pick_history data/internal/gpw_daily_pick_audit 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Enforce GPW mandatory daily selection"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          exit 1

      - name: Request fresh Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            CODE="$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")"
            if [[ "$CODE" == "201" ]]; then exit 0; fi
            if [[ "$CODE" != "409" ]]; then cat /tmp/pages.json; exit 1; fi
            sleep 10
          done
          exit 1
