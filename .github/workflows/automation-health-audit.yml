name: Audit Automation Health

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/automation_health_audit.py"
      - "tests/test_automation_health_audit.py"
      - "tests/test_automation_workflow_ownership.py"
      - ".github/workflows/automation-health-audit.yml"
  schedule:
    - cron: "42 * * * *"

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: automation-health-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read Actions and published-data health
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
        run: python scripts/automation_health_audit.py --sync-issues

      - name: Validate public registry
        run: python scripts/automation_health_audit.py --validate-only

      - name: Publish sanitized health state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/system/automation_status.json data/system/automation_incidents.json
          if git diff --cached --quiet; then
            echo "No automation health change to publish."
            exit 0
          fi
          git commit -m "Update automation health registry"
          if ! git diff --quiet; then
            echo "::error::Health audit left unstaged files; refusing a partial publication."
            git status --short
            exit 1
          fi
          git pull --rebase origin main
          git push origin HEAD:main
