name: Daily Market Alert

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - open
          - preclose
          - ui-only
  push:
    branches: [main]
    paths:
      - "scripts/update_daily_market_alert.py"
      - "scripts/run_daily_market_alert_resilient.py"
      - "scripts/daily_market_alert_editorial_v2.py"
      - "scripts/patch_daily_alert_ui.py"
      - "data/investments/daily_market_alert_editorial_spec.json"
      - "tests/test_daily_market_alert.py"
      - "tests/test_daily_market_alert_quality.py"
      - "scripts/check_daily_market_alert.py"
      - ".github/workflows/daily-market-alert.yml"
  schedule:
    # Two governed editions per NYSE session. Candidate UTC times cover EDT and EST.
    # Non-matching DST candidates exit without publishing.
    - cron: "0 14 * * 1-5"
    - cron: "0 15 * * 1-5"
    - cron: "30 16 * * 1-5"
    - cron: "30 17 * * 1-5"
    - cron: "30 19 * * 1-5"
    - cron: "30 20 * * 1-5"

permissions:
  contents: write

concurrency:
  group: investment-alert
  cancel-in-progress: false

jobs:
  build-daily-market-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install governed alert dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser pandas_market_calendars

      - name: Test daily alert contract
        run: |
          python -m unittest tests.test_daily_market_alert tests.test_daily_market_alert_quality tests.test_daily_market_alert_watchdog -v
          python -m py_compile scripts/run_daily_market_alert_resilient.py scripts/daily_market_alert_editorial_v2.py scripts/patch_daily_alert_ui.py
          python -m json.tool data/investments/daily_market_alert_editorial_spec.json >/dev/null

      - name: Patch Daily Market Alert interface
        run: python scripts/patch_daily_alert_ui.py

      - name: Resolve run mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            MODE="catchup"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          else
            MODE="auto"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved mode: $MODE"

      - name: Generate or check Daily Market Alert
        if: steps.mode.outputs.mode != 'ui-only'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_AI_MODEL: gpt-4o-mini
          NEWS_AI_REVIEW_MODEL: gpt-4.1-mini
          BR_ALERT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: python scripts/run_daily_market_alert_resilient.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Validate generated alert
        if: steps.mode.outputs.mode != 'ui-only'
        run: |
          test -f data/investments/daily_market_alert.json
          python scripts/run_daily_market_alert_resilient.py --validate-only

      - name: Commit interface or alert updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/site-header.js pl/inwestycje.html en/investing.html
          git add data/investments/daily_market_alert.json data/investments/daily_alert_history 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No Daily Market Alert changes to commit."
          else
            git commit -m "Update Daily Market Alert"
            if ! git diff --quiet; then
              echo "::error::Alert generator left unstaged files; refusing a partial publication."
              git status --short
              exit 1
            fi
            git pull --rebase origin main
            git push
          fi
