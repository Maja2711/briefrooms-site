name: Daily Market Alert

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: catchup
        type: choice
        options:
          - catchup
          - auto
          - open
          - preclose
          - ui-only
  push:
    branches: [main]
    paths:
      - "scripts/update_daily_market_alert.py"
      - "scripts/run_daily_market_alert_resilient.py"
      - "scripts/daily_market_alert_editorial_v2.py"
      - "scripts/daily_market_alert_materiality.py"
      - "scripts/daily_market_alert_materiality_upgrade.py"
      - "scripts/patch_daily_alert_ui.py"
      - "data/investments/daily_market_alert_editorial_spec.json"
      - "tests/test_daily_market_alert.py"
      - "tests/test_daily_market_alert_quality.py"
      - "tests/test_daily_market_alert_materiality.py"
      - "scripts/check_daily_market_alert.py"
      - ".github/workflows/daily-market-alert.yml"
  schedule:
    # Run away from the busiest :00/:30 boundaries. Delayed scheduled jobs are
    # allowed to finish instead of being cancelled by the next catch-up run.
    - cron: "7,37 14-20 * * 1-5"

permissions:
  contents: write

concurrency:
  group: investment-alert-v2
  cancel-in-progress: false

jobs:
  build-daily-market-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install governed alert dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser pandas_market_calendars

      - name: Test daily alert, editorial and materiality contracts
        if: github.event_name != 'schedule'
        run: |
          python -m unittest \
            tests.test_daily_market_alert \
            tests.test_daily_market_alert_quality \
            tests.test_daily_market_alert_materiality \
            tests.test_daily_market_alert_watchdog -v
          python -m py_compile \
            scripts/run_daily_market_alert_resilient.py \
            scripts/daily_market_alert_editorial_v2.py \
            scripts/daily_market_alert_materiality.py \
            scripts/daily_market_alert_materiality_upgrade.py \
            scripts/patch_daily_alert_ui.py
          python -m json.tool data/investments/daily_market_alert_editorial_spec.json >/dev/null

      - name: Patch Daily Market Alert interface
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'ui-only'
        run: python scripts/patch_daily_alert_ui.py

      - name: Resolve run mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          else
            MODE="catchup"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved mode: $MODE"

      - name: Generate bilingual Daily Market Alert
        if: steps.mode.outputs.mode != 'ui-only'
        env:
          # Reliability first: deterministic PL and EN copy is built from the
          # same validated market snapshot when an AI provider is unavailable.
          OPENAI_API_KEY: ""
        shell: bash
        run: python scripts/run_daily_market_alert_resilient.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Validate generated PL and EN alert
        if: steps.mode.outputs.mode != 'ui-only'
        run: |
          test -f data/investments/daily_market_alert.json
          python scripts/run_daily_market_alert_resilient.py --validate-only
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path('data/investments/daily_market_alert.json').read_text(encoding='utf-8')
          )
          assert payload.get('materiality_contract', {}).get('version') == '1.0.0'
          assert payload.get('editorial_quality', {}).get('passed') is True
          assert payload.get('market_regime', {}).get('pl')
          assert payload.get('market_regime', {}).get('en')
          assert payload.get('summary', {}).get('pl')
          assert payload.get('summary', {}).get('en')
          assert {item.get('id') for item in payload.get('instruments', [])} == {
              'sp500', 'brent', 'us10y'
          }
          for item in payload['instruments']:
              assert item.get('reason', {}).get('pl')
              assert item.get('reason', {}).get('en')
          PY

      - name: Commit only Daily Market Alert data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "${{ steps.mode.outputs.mode }}" == "ui-only" ]]; then
            git add scripts/site-header.js pl/inwestycje.html en/investing.html
          else
            git add data/investments/daily_market_alert.json
            git add data/investments/daily_alert_history 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "No Daily Market Alert changes to commit."
            exit 0
          fi
          git commit -m "Update Daily Market Alert"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "::error::Could not publish Daily Market Alert after 5 attempts."
          exit 1
