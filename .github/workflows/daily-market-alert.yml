name: Daily Market Alert

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: catchup
        type: choice
        options:
          - catchup
          - auto
          - open
          - preclose
          - ui-only
  push:
    branches: [main]
    paths:
      - "scripts/update_daily_market_alert.py"
      - "scripts/run_daily_market_alert_resilient.py"
      - "scripts/daily_market_alert_editorial_v2.py"
      - "scripts/daily_market_alert_materiality.py"
      - "scripts/daily_market_alert_materiality_upgrade.py"
      - "scripts/patch_daily_alert_ui.py"
      - "data/investments/daily_market_alert_editorial_spec.json"
      - "tests/test_daily_market_alert.py"
      - "tests/test_daily_market_alert_quality.py"
      - "tests/test_daily_market_alert_materiality.py"
      - "scripts/check_daily_market_alert.py"
      - ".github/workflows/daily-market-alert.yml"
  schedule:
    # Catch-up runs throughout the NYSE session. The Python gate skips duplicates
    # and switches to the pre-close edition when that window is reached.
    - cron: "*/30 14-20 * * 1-5"

permissions:
  contents: write

concurrency:
  group: investment-alert
  cancel-in-progress: true

jobs:
  build-daily-market-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install governed alert dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser pandas_market_calendars

      - name: Test daily alert, editorial and materiality contracts
        run: |
          python -m unittest \
            tests.test_daily_market_alert \
            tests.test_daily_market_alert_quality \
            tests.test_daily_market_alert_materiality \
            tests.test_daily_market_alert_watchdog -v
          python -m py_compile \
            scripts/run_daily_market_alert_resilient.py \
            scripts/daily_market_alert_editorial_v2.py \
            scripts/daily_market_alert_materiality.py \
            scripts/daily_market_alert_materiality_upgrade.py \
            scripts/patch_daily_alert_ui.py
          python -m json.tool data/investments/daily_market_alert_editorial_spec.json >/dev/null

      - name: Patch Daily Market Alert interface
        run: python scripts/patch_daily_alert_ui.py

      - name: Resolve run mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          else
            MODE="catchup"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved mode: $MODE"

      - name: Generate Daily Market Alert
        if: steps.mode.outputs.mode != 'ui-only'
        env:
          # Reliability first: the deterministic bilingual path uses only
          # validated market data and is independent of an AI provider.
          OPENAI_API_KEY: ""
        shell: bash
        run: python scripts/run_daily_market_alert_resilient.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Validate generated alert
        if: steps.mode.outputs.mode != 'ui-only'
        run: |
          test -f data/investments/daily_market_alert.json
          python scripts/run_daily_market_alert_resilient.py --validate-only
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('data/investments/daily_market_alert.json').read_text())
          assert payload.get('materiality_contract', {}).get('version') == '1.0.0'
          assert payload.get('editorial_quality', {}).get('passed') is True
          assert {item.get('id') for item in payload.get('instruments', [])} == {'sp500', 'brent', 'us10y'}
          PY

      - name: Commit interface or alert updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/site-header.js pl/inwestycje.html en/investing.html
          git add data/investments/daily_market_alert.json data/investments/daily_alert_history 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No Daily Market Alert changes to commit."
            exit 0
          fi
          git commit -m "Update Daily Market Alert"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "::error::Could not publish Daily Market Alert after 5 attempts."
          exit 1
