name: Research State Durability Heartbeat

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-state-durability-heartbeat.yml"
      - "scripts/research_state_durability.py"
      - "tests/test_research_state_durability.py"
      - "tests/test_research_state_durability_workflows.py"
      - "docs/RESEARCH_STATE_DURABILITY.md"
  schedule:
    - cron: "15 6 * * 0"

permissions:
  contents: read
  actions: read

concurrency:
  group: research-state-durability-heartbeat
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - layer: pr10_broad_market
            archive: brace-broad-market-belief-state.tgz
          - layer: pr11_sector_factor
            archive: brace-sector-factor-belief-state.tgz
          - layer: pr12_company_entity
            archive: brace-company-entity-framework-state.tgz
          - layer: pr13_primary_source
            archive: brace-entity-primary-source-evidence-state.tgz
          - layer: pr14_interpretation
            archive: brace-entity-evidence-interpretation-state.tgz
          - layer: pr15_belief_forecast
            archive: brace-entity-belief-state-forecast-state.tgz
          - layer: pr16_calibration
            archive: brace-entity-calibration-diagnostics-state.tgz
          - layer: pr16_1_world_state
            archive: investment-semantics-world-state.tgz
          - layer: pr17_entity_bridge
            archive: brace-entity-belief-shadow-bridge-state.tgz
          - layer: pr19_epistemic_graph
            archive: belief-epistemic-causal-graph-state.tgz
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh immutable research-state checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/research-state-${{ matrix.layer }}"
          output="$RUNNER_TEMP/${{ matrix.archive }}"
          mkdir -p "$state_dir"
          PYTHONPATH=scripts:. python scripts/research_state_durability.py refresh \
            --layer "${{ matrix.layer }}" \
            --state-dir "$state_dir" \
            --output "$output"
          test -s "$output"
      - name: Upload independent durability checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: research-state-durability-${{ matrix.layer }}
          path: ${{ runner.temp }}/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
