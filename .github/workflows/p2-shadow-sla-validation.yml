name: P2 Shadow Snapshot SLA Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/hypothesis_shadow_watchdog.py"
      - "scripts/nyse_session_calendar.py"
      - "scripts/hypothesis_challenger_engine.py"
      - "tests/test_hypothesis_shadow_watchdog.py"
      - "tests/test_hypothesis_challenger_engine.py"
      - ".github/workflows/p2-shadow-watchdog.yml"
      - ".github/workflows/p2-shadow-sla-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-sla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test independent P2 snapshot watchdog
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          set -euo pipefail
          python -m py_compile scripts/hypothesis_shadow_watchdog.py scripts/nyse_session_calendar.py
          python -m unittest tests.test_hypothesis_shadow_watchdog tests.test_hypothesis_challenger_engine -v
