name: WES Continuous / RSI Validation

on:
  pull_request:
    paths:
      - "scripts/investments_wes.py"
      - "scripts/investments_wes_runner.py"
      - "scripts/investments_wes_lifecycle.py"
      - "scripts/investments_weekly_v5.py"
      - "scripts/verify_weekly_close_deadline.py"
      - "scripts/audit_intraday_risk_exits.py"
      - "scripts/enforce_weekly_risk_exit_lock.py"
      - "scripts/eurusd_central_bank_event_risk.py"
      - "scripts/wes_blocker_watchdog.py"
      - "tests/test_investments_wes.py"
      - "tests/test_eurusd_cb_event_risk.py"
      - "tests/test_verify_weekly_close_deadline.py"
      - "tests/test_wes_blocker_watchdog.py"
      - ".github/workflows/wes-continuous-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-continuous-wes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deterministic WES test dependencies
        run: python -m pip install yfinance pandas numpy requests
      - name: Compile all changed code
        run: |
          python -m py_compile \
            scripts/investments_wes.py \
            scripts/investments_wes_runner.py \
            scripts/investments_wes_lifecycle.py \
            scripts/investments_wes_guarded_lifecycle.py \
            scripts/investments_weekly_v5.py \
            scripts/verify_weekly_close_deadline.py \
            scripts/audit_intraday_risk_exits.py \
            scripts/enforce_weekly_risk_exit_lock.py \
            scripts/eurusd_central_bank_event_risk.py \
            scripts/wes_blocker_watchdog.py \
            scripts/wes_cycle_watchdog.py
      - name: Run WES and CB policy regression suites
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          python -m unittest -v \
            tests.test_investments_wes \
            tests.test_investments_weekly_v5 \
            tests.test_wes_lifecycle_expired_no_entry \
            tests.test_verify_weekly_close_deadline \
            tests.test_eurusd_cb_event_risk \
            tests.test_eurusd_weekly_cb_event_adapter \
            tests.test_wes_cycle_watchdog \
            tests.test_wes_blocker_watchdog \
            tests.test_audit_intraday_risk_exits \
            tests.test_no_retroactive_execution \
            tests.test_automation_workflow_ownership
