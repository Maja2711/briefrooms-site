name: Publish Daily EURUSD A-B-C PL Projection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/daily_eurusd_abc_public_projection.py"
      - "scripts/daily-eurusd-abc-lab-pl.js"
      - "pl/inwestycje/daily-trading.html"
      - ".github/workflows/daily-eurusd-abc-public-pl.yml"
  workflow_run:
    workflows: ["Daily EURUSD A-B-C Live Shadow"]
    types: [completed]
  schedule:
    # Fallback refresh. Primary path is workflow_run after a successful PR20 live-shadow cycle.
    - cron: "17,47 13-22 * * 1-5"

permissions:
  contents: write
  actions: read
  statuses: write

concurrency:
  group: daily-eurusd-abc-public-pl
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore verified private PR20 A/B/C state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "ABC_STATE_DIR=$RUNNER_TEMP/eurusd_abc_private" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/eurusd_abc_private"
          python scripts/daily_eurusd_abc_durability.py restore \
            --layer pr20_eurusd_abc \
            --state-dir "$RUNNER_TEMP/eurusd_abc_private"
          python scripts/daily_eurusd_abc_durability.py verify \
            --layer pr20_eurusd_abc \
            --state-dir "$RUNNER_TEMP/eurusd_abc_private"

      - name: Build sanitized Polish frontend projection
        run: |
          set -euo pipefail
          python scripts/daily_eurusd_abc_public_projection.py \
            --state "$ABC_STATE_DIR/EURUSD_DAILY_ABC_STATE.json" \
            --report "$ABC_STATE_DIR/EURUSD_DAILY_ABC_REPORT.json" \
            --output data/investments/eurusd_abc_public_pl.json
          python scripts/daily_eurusd_abc_public_projection.py \
            --output data/investments/eurusd_abc_public_pl.json \
            --validate
          python -m json.tool data/investments/eurusd_abc_public_pl.json >/dev/null
          node --check scripts/daily-eurusd-abc-lab-pl.js

      - name: Persist only sanitized public projection
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/investments/eurusd_abc_public_pl.json
          if git diff --cached --quiet; then
            echo "No A/B/C public projection change"
            exit 0
          fi
          git commit -m "Publish Daily EURUSD A-B-C PL projection"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Projection push attempt ${attempt} failed; rebasing on latest main"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          echo "Unable to publish sanitized A/B/C projection" >&2
          exit 1

      - name: Publish PL projection status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          state=failure
          if [ "$JOB_STATUS" = "success" ]; then state=success; fi
          target_sha="$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ] && [ -n "${SOURCE_HEAD_SHA:-}" ]; then
            target_sha="$SOURCE_HEAD_SHA"
          fi
          STATE="$state" TARGET_SHA="$target_sha" python - <<'PY'
          import json, os, urllib.request
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['TARGET_SHA']}"
          payload=json.dumps({
              'state': os.environ['STATE'],
              'context': 'daily-eurusd-abc-pl-projection/publish',
              'description': 'PL A/B/C frontend projection published' if os.environ['STATE'] == 'success' else 'PL A/B/C frontend projection failed',
              'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(url, data=payload, method='POST', headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              print(response.status)
          PY
          test "$state" = success
