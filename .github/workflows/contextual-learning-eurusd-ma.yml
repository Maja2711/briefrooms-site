name: Validate Contextual Learning and EURUSD MA Research

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/weekly-context-loop-integrity
    paths:
      - "scripts/investments_weekly_v5.py"
      - "scripts/investments_weekly_macro.py"
      - "scripts/investments_weekly_ma_structure.py"
      - "scripts/investments_wes.py"
      - "tests/test_contextual_learning.py"
      - "tests/test_investments_weekly_v4.py"
      - "tests/test_investments_weekly_v5.py"
      - "tests/test_investments_wes.py"
      - "tests/test_automation_workflow_ownership.py"
      - ".github/workflows/investments-wes.yml"
      - "data/investments/multi_instrument_exposure_policy.json"
      - ".github/workflows/contextual-learning-eurusd-ma.yml"

permissions:
  contents: write

concurrency:
  group: contextual-learning-eurusd-ma-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip yfinance pandas numpy
      - name: Validate contextual learning and weekly integrity
        run: |
          python -m py_compile \
            scripts/investments_weekly.py \
            scripts/investments_weekly_v2.py \
            scripts/investments_weekly_v3.py \
            scripts/investments_weekly_v4.py \
            scripts/investments_weekly_v5.py \
            scripts/investments_weekly_macro.py \
            scripts/investments_wes.py \
            scripts/investments_wes_runner.py \
            scripts/ensure_current_week_forecast.py \
            scripts/daily_position_review.py \
            scripts/apply_instrument_validation_gate.py \
            scripts/audit_weekly_model_runtime.py \
            scripts/render_simple_investments.py \
            scripts/verify_weekly_close_deadline.py
          node --check scripts/investments-weekly-public.js
          node --check scripts/investments-weekly-governance.js
          node --check scripts/investments-wes-public.js
          node --test tests/test_investments_weekly_public.js
          python -m unittest \
            tests/test_contextual_learning.py \
            tests/test_investments_wes.py \
            tests/test_investments_weekly_v4.py \
            tests/test_investments_weekly_v5.py \
            tests/test_investments_weekly_macro.py \
            tests/test_audit_weekly_integrity.py \
            tests/test_verify_weekly_close_deadline.py \
            tests.test_automation_workflow_ownership.AutomationWorkflowOwnershipTests.test_weekly_schedule_runs_full_lifecycle_and_blocks_weekend_exposure \
            tests.test_automation_workflow_ownership.AutomationWorkflowOwnershipTests.test_weekly_settlement_paths_are_independent_queued_and_fail_closed
      - name: Validate live EURUSD MA structure integration
        if: github.ref == 'refs/heads/main'
        run: python scripts/validate_eurusd_ma_structure.py
      - name: Research EURUSD MA 30 60 100 200 daily
        if: github.ref == 'refs/heads/main'
        run: python scripts/investments_weekly_eurusd_ma_research.py
      - name: Research EURUSD MA multi-timeframe weekly fit
        if: github.ref == 'refs/heads/main'
        run: python scripts/run_eurusd_ma_multitimeframe_research.py
      - name: Research EURUSD SMA versus EMA and hybrid
        if: github.ref == 'refs/heads/main'
        run: python scripts/investments_weekly_eurusd_sma_ema_research.py
      - name: Decide next MA research action
        if: github.ref == 'refs/heads/main'
        run: python scripts/decide_eurusd_ma_research.py
      - name: Commit validation research and decision reports
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/eurusd_ma_structure_validation.json data/investments/eurusd_ma_30_60_100_200_research.json data/investments/eurusd_ma_multitimeframe_research.json data/investments/eurusd_sma_vs_ema_research.json data/investments/eurusd_ma_research_decision.json
          if git diff --cached --quiet; then
            echo "No MA validation/research/decision change to commit."
            exit 0
          fi
          git commit -m "Validate EURUSD MA research decision loop"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1
