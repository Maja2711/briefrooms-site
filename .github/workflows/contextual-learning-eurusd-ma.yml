name: Validate Contextual Learning and EURUSD MA Research

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/wes-persist-context-state
    paths:
      - ".github/workflows/investments-wes.yml"
      - "tests/test_investments_wes.py"
      - ".github/workflows/contextual-learning-eurusd-ma.yml"

permissions:
  contents: write

concurrency:
  group: contextual-learning-eurusd-ma-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip yfinance pandas numpy
      - name: Validate WES publication fix
        run: |
          python -m py_compile scripts/investments_wes.py scripts/investments_weekly_v5.py
          python -m unittest tests/test_investments_wes.py
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/investments-wes.yml').read_text(encoding='utf-8')
          assert 'data/investments/multi_instrument_exposure_state_v5.json' in source
          assert 'data/investments/multi_instrument_exposure_report_v5.json' in source
          assert 'if ! git diff --quiet; then' in source
          print('WES publication staging guard OK')
          PY
