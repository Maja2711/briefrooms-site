name: ARIS Shadow Periodic Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "scripts/belief_aris_shadow_report.py"
      - "tests/test_belief_aris_shadow_report.py"
      - ".github/workflows/belief-aris-shadow-report.yml"
      - "docs/BELIEF_ARIS_SHADOW_REPORT.md"

permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate report engine
        run: |
          python -m py_compile scripts/belief_aris_shadow_report.py
          python -m unittest tests/test_belief_aris_shadow_report.py -v

      - name: Restore recent ARIS shadow artifacts
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aris-shadow-input"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=belief-aris-shadow&per_page=100" \
            > "$RUNNER_TEMP/aris-artifacts.json"
          python - "$RUNNER_TEMP/aris-artifacts.json" "$RUNNER_TEMP/artifact-ids.txt" <<'PY'
          import json, sys
          from pathlib import Path
          rows=json.loads(Path(sys.argv[1]).read_text()).get('artifacts', [])
          rows=[x for x in rows if not x.get('expired')]
          rows.sort(key=lambda x:x.get('created_at',''), reverse=True)
          Path(sys.argv[2]).write_text('\n'.join(str(x['id']) for x in rows[:60]))
          print('ARIS shadow artifacts selected:', min(60, len(rows)))
          PY
          n=0
          while read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            n=$((n+1))
            dest="$RUNNER_TEMP/aris-shadow-input/run-$n"
            mkdir -p "$dest/zip" "$dest/state"
            curl -fsSL -L \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o "$dest/artifact.zip"
            unzip -q "$dest/artifact.zip" -d "$dest/zip"
            if [ -f "$dest/zip/belief-aris-shadow.tgz" ]; then
              tar -xzf "$dest/zip/belief-aris-shadow.tgz" -C "$dest/state"
            fi
          done < "$RUNNER_TEMP/artifact-ids.txt"
          find "$RUNNER_TEMP/aris-shadow-input" -name aris_belief_shadow.json -print | wc -l

      - name: Build periodic report
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/aris-shadow-report"
          python scripts/belief_aris_shadow_report.py \
            --input-dir "$RUNNER_TEMP/aris-shadow-input" \
            --output-dir "$RUNNER_TEMP/aris-shadow-report"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'aris-shadow-report'
          r=json.loads((root/'ARIS_SHADOW_REPORT.json').read_text())
          assert r['mode'] == 'research_shadow'
          assert r['authority']['decision_influence'] is False
          assert r['authority']['belief_core_writeback_enabled'] is False
          assert r['authority']['automatic_promotion_enabled'] is False
          assert r['authority']['automatic_tuning_enabled'] is False
          print('ARIS periodic report:', r['sample'], r['recommendation'])
          PY

      - name: Store periodic ARIS shadow report
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: belief-aris-shadow-report
          path: ${{ runner.temp }}/aris-shadow-report/
          if-no-files-found: error
          retention-days: 180
