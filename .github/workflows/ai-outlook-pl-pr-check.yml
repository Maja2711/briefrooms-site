name: Polish AI Outlook Quality Check

on:
  pull_request:
    paths:
      - ".github/workflows/ai-outlook-pl-pr-check.yml"
      - "scripts/ai_outlook_pl_quality.py"
      - "scripts/repair_ai_outlook_pl_20260806.py"
      - "scripts/publish_ai_outlook_gemini.py"
      - "tests/test_ai_outlook_pl_quality.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run semantic tests
        run: |
          set -euo pipefail
          python -m unittest tests.test_ai_outlook_pl_quality -v
          python -m py_compile \
            scripts/ai_outlook_pl_quality.py \
            scripts/repair_ai_outlook_pl_20260806.py \
            scripts/publish_ai_outlook_gemini.py
      - name: Test PL-only repair against repository data
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('data/ai_outlook.json').read_text(encoding='utf-8'))
          Path('/tmp/en-before.json').write_text(
              json.dumps(payload['en'], ensure_ascii=False, sort_keys=True),
              encoding='utf-8',
          )
          PY
          python scripts/repair_ai_outlook_pl_20260806.py
          python scripts/publish_ai_outlook_gemini.py --validate-only --require-today
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('data/ai_outlook.json').read_text(encoding='utf-8'))
          before = Path('/tmp/en-before.json').read_text(encoding='utf-8')
          after = json.dumps(payload['en'], ensure_ascii=False, sort_keys=True)
          assert after == before
          assert payload['pl']['forecast_id'] == '2026-08-06-pl-cash-access-quality-v1'
          print('PL-only repair contract passed.')
          PY
