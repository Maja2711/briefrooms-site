name: AI Tournament Daily

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild output; closed sessions remain append-only"
        required: false
        default: false
        type: boolean
  schedule:
    # Always after the regular US close. 21:45 UTC = 23:45 CEST / 22:45 CET.
    - cron: "45 21 * * 1-5"
    # Recovery audit 90 minutes later.
    - cron: "15 23 * * 1-5"
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - "scripts/ai_tournament_engine.py"
      - "scripts/ai_tournament_parts/**"
      - "scripts/ai-tournament-public.js"
      - "scripts/install_ai_tournament_ui.py"
      - "tests/test_ai_tournament.py"
      - "data/ai_tournament/config.json"
      - ".github/workflows/ai-tournament-daily.yml"

permissions:
  contents: write

concurrency:
  group: ai-tournament-daily
  cancel-in-progress: false

jobs:
  install-ui:
    if: github.event_name == 'issues' && github.event.issue.title == 'Install AI Tournament UI'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and validate UI
        run: |
          python scripts/install_ai_tournament_ui.py
          python -m unittest tests.test_ai_tournament -v
          node --check scripts/ai-tournament-public.js
          grep -F '/scripts/ai-tournament-public.js?v=1' pl/inwestycje/portfel-10k.html
          grep -F '/scripts/ai-tournament-public.js?v=1' en/investing/portfolio-10k.html
      - name: Commit UI installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pl/inwestycje/portfel-10k.html en/investing/portfolio-10k.html
          if git diff --cached --quiet; then
            echo "AI Tournament UI already installed."
            exit 0
          fi
          git commit -m "Install AI Tournament leaderboard UI"
          git pull --rebase origin main
          git push

  validate:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate tournament engine
        run: |
          python -m unittest tests.test_ai_tournament -v
          python -m py_compile scripts/ai_tournament_engine.py scripts/install_ai_tournament_ui.py
          node --check scripts/ai-tournament-public.js
          python scripts/ai_tournament_engine.py validate

  run-tournament:
    if: github.event_name != 'issues'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade requests yfinance pandas
      - name: Run latest closed market session
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_TOURNAMENT_MODEL: ${{ vars.OPENAI_TOURNAMENT_MODEL }}
          ANTHROPIC_TOURNAMENT_MODEL: ${{ vars.ANTHROPIC_TOURNAMENT_MODEL }}
          GEMINI_TOURNAMENT_MODEL: ${{ vars.GEMINI_TOURNAMENT_MODEL }}
          DEEPSEEK_TOURNAMENT_MODEL: ${{ vars.DEEPSEEK_TOURNAMENT_MODEL }}
        shell: bash
        run: |
          ARGS=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]]; then
            ARGS="--force"
          fi
          python scripts/ai_tournament_engine.py run $ARGS
          python scripts/ai_tournament_engine.py validate
      - name: Commit daily standings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai_tournament
          if git diff --cached --quiet; then
            echo "No new closed market session or no tournament changes."
            exit 0
          fi
          git commit -m "Update AI Tournament daily standings"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1
