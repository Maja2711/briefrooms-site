name: AI Tournament Daily

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Tournament action"
        required: true
        default: run
        type: choice
        options:
          - preflight
          - run
  issues:
    types: [opened]
  schedule:
    # Pre-open readiness + self-healing recovery: 09:00 New York / 15:00 Warsaw during EDT.
    - cron: "0 13 * * 1-5"
    # Primary valuation after the regular US session is fully closed.
    - cron: "45 21 * * 1-5"
    # Recovery audit 90 minutes later; append-only and idempotent.
    - cron: "15 23 * * 1-5"
  push:
    branches: [main]
    paths:
      - "scripts/ai_tournament_engine.py"
      - "scripts/ai_tournament_manual_mode.py"
      - "scripts/ai_tournament_manual_bootstrap.py"
      - "scripts/ai_tournament_buy_hold_round.py"
      - "scripts/ai_tournament_submission_intake.py"
      - "scripts/ai_tournament_parts/**"
      - "scripts/ai_tournament_cash_interest.py"
      - "scripts/ai-tournament-public.js"
      - "scripts/ai-tournament-readiness.js"
      - "scripts/install_ai_tournament_ui.py"
      - "tests/test_ai_tournament.py"
      - "tests/test_ai_tournament_ui.py"
      - "tests/test_ai_tournament_cash_interest.py"
      - "tests/test_ai_tournament_submission_intake.py"
      - "tests/test_ai_tournament_buy_hold_round.py"
      - "data/ai_tournament/config.json"
      - "data/ai_tournament/manual_mode.json"
      - "data/ai_tournament/cash_rate_policy.json"
      - "data/ai_tournament/commitments/**"
      - "data/ai_tournament/submissions/**"
      - "data/ai_tournament/intake/**"
      - "data/ai_tournament/intake_campaign.json"
      - ".github/workflows/ai-tournament-daily.yml"

permissions:
  contents: write

concurrency:
  group: ai-tournament-daily
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tournament dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests yfinance pandas pandas_market_calendars
      - name: Test repository and locked campaign
        run: |
          python -m unittest \
            tests.test_ai_tournament \
            tests.test_ai_tournament_ui \
            tests.test_ai_tournament_cash_interest \
            tests.test_ai_tournament_submission_intake \
            tests.test_ai_tournament_buy_hold_round -v
          python -m py_compile \
            scripts/ai_tournament_engine.py \
            scripts/ai_tournament_manual_mode.py \
            scripts/ai_tournament_manual_bootstrap.py \
            scripts/ai_tournament_buy_hold_round.py \
            scripts/ai_tournament_submission_intake.py \
            scripts/ai_tournament_cash_interest.py \
            scripts/install_ai_tournament_ui.py
          node --check scripts/ai-tournament-public.js
          node --check scripts/ai-tournament-readiness.js
      - name: Strict preflight
        run: python scripts/ai_tournament_buy_hold_round.py preflight
      - name: Validate immutable operating contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('data/ai_tournament/config.json').read_text(encoding='utf-8'))
          mode = json.loads(Path('data/ai_tournament/manual_mode.json').read_text(encoding='utf-8'))
          assert config['tournament_id'] == 'briefrooms-ai-tournament-2026-02'
          assert config['start_date'] == '2026-08-04'
          assert config['end_date'] == '2026-11-04'
          assert config['starting_capital_pln'] == 10000.0
          assert config['starting_capital_usd'] == 10000.0
          assert config['rules']['buy_and_hold'] is True
          assert mode['mode'] == 'manual_locked_buy_and_hold'
          assert mode['api_calls_enabled'] is False
          assert mode['rebalancing_allowed'] is False
          assert mode['execution_policy'] == 'single_purchase_at_2026-08-04_us_regular_session_open'
          assert mode['cash_interest']['benchmark'] == 'IORB'
          assert len(config['universe']) == 55
          print('Immutable dual-account campaign contract validated.')
          PY

  deploy-ui:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install current tournament renderers
        run: python scripts/install_ai_tournament_ui.py
      - name: Validate installed renderers
        run: |
          grep -q 'ai-tournament-public.js?v=5' pl/inwestycje/portfel-10k.html
          grep -q 'ai-tournament-public.js?v=5' en/investing/portfolio-10k.html
          grep -q 'ai-tournament-readiness.js?v=5' pl/inwestycje/portfel-10k.html
          grep -q 'ai-tournament-readiness.js?v=5' en/investing/portfolio-10k.html
      - name: Commit UI deployment
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pl/inwestycje/portfel-10k.html en/investing/portfolio-10k.html
          if git diff --cached --quiet; then
            echo "AI Tournament UI already current."
          else
            git commit -m "Deploy AI Tournament UI v5"
            git pull --rebase origin main
            git push
          fi

  preopen-readiness:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 13 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && inputs.command == 'preflight')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tournament dependencies
        run: python -m pip install requests yfinance pandas pandas_market_calendars
      - name: Install current tournament renderers
        run: python scripts/install_ai_tournament_ui.py
      - name: Run fail-closed pre-open audit
        run: python scripts/ai_tournament_buy_hold_round.py preflight > data/ai_tournament/preflight.json
      - name: Self-heal latest completed session
        run: |
          set -euo pipefail
          python scripts/ai_tournament_buy_hold_round.py run
          python scripts/ai_tournament_buy_hold_round.py validate
      - name: Commit readiness and recovered tournament state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ai_tournament
          git add pl/inwestycje/portfel-10k.html en/investing/portfolio-10k.html
          if git diff --cached --quiet; then
            echo "AI Tournament already current for the latest completed session."
            exit 0
          fi
          git commit -m "Recover AI Tournament latest completed session"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          echo "::error::Could not publish AI Tournament pre-open recovery."
          exit 1

  run-tournament:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule != '0 13 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && inputs.command == 'run') ||
      (github.event_name == 'issues' && github.event.issue.title == 'Run AI Tournament recovery')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tournament dependencies
        run: python -m pip install requests yfinance pandas pandas_market_calendars
      - name: Install current tournament renderers
        run: python scripts/install_ai_tournament_ui.py
      - name: Verify all immutable submissions
        run: python scripts/ai_tournament_buy_hold_round.py preflight
      - name: Run canonical paper-trading round
        run: python scripts/ai_tournament_buy_hold_round.py run
      - name: Validate append-only tournament state
        run: python scripts/ai_tournament_buy_hold_round.py validate
      - name: Commit tournament state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ai_tournament
          git add pl/inwestycje/portfel-10k.html en/investing/portfolio-10k.html
          if git diff --cached --quiet; then
            echo "No AI Tournament state change to commit."
          else
            git commit -m "Update locked AI Tournament state"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 4))
            done
            echo "::error::Could not publish AI Tournament state."
            exit 1
          fi
