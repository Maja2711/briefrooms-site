name: AI Tournament Daily

on:
  workflow_dispatch:
  issues:
    types: [opened]
  schedule:
    # Primary valuation after the regular US session is fully closed.
    - cron: "45 21 * * 1-5"
    # Recovery audit 90 minutes later; idempotent when the round already exists.
    - cron: "15 23 * * 1-5"
  push:
    branches: [main]
    paths:
      - "scripts/ai_tournament_engine.py"
      - "scripts/ai_tournament_manual_mode.py"
      - "scripts/ai_tournament_manual_bootstrap.py"
      - "scripts/ai_tournament_parts/**"
      - "scripts/ai_tournament_cash_interest.py"
      - "scripts/generate_brace_manual_submission.py"
      - "scripts/ai-tournament-public.js"
      - "scripts/install_ai_tournament_ui.py"
      - "tests/test_ai_tournament.py"
      - "tests/test_ai_tournament_cash_interest.py"
      - "tests/test_generate_brace_manual_submission.py"
      - "data/ai_tournament/config.json"
      - "data/ai_tournament/manual_mode.json"
      - "data/ai_tournament/cash_rate_policy.json"
      - "data/ai_tournament/commitments/**"
      - "data/ai_tournament/submissions/**"
      - "data/ai_tournament/brace_selection_audit.json"
      - "data/ai_tournament/.brace-generation-trigger"
      - ".github/workflows/ai-tournament-daily.yml"

permissions:
  contents: write

concurrency:
  group: ai-tournament-daily
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository contract
        run: |
          python -m unittest tests.test_ai_tournament -v
          python -m unittest tests.test_ai_tournament_cash_interest -v
          python -m unittest tests.test_generate_brace_manual_submission -v
          python -m py_compile \
            scripts/ai_tournament_engine.py \
            scripts/ai_tournament_manual_mode.py \
            scripts/ai_tournament_manual_bootstrap.py \
            scripts/ai_tournament_cash_interest.py \
            scripts/generate_brace_manual_submission.py \
            scripts/install_ai_tournament_ui.py
          node --check scripts/ai-tournament-public.js
          node --check scripts/portfolio-10k-material-reports-public.js
          python - <<'PY'
          import json
          from pathlib import Path
          mode = json.loads(Path('data/ai_tournament/manual_mode.json').read_text(encoding='utf-8'))
          policy = json.loads(Path('data/ai_tournament/cash_rate_policy.json').read_text(encoding='utf-8'))
          config = json.loads(Path('data/ai_tournament/config.json').read_text(encoding='utf-8'))
          assert mode['mode'] == 'manual_locked_buy_and_hold'
          assert mode['api_calls_enabled'] is False
          assert mode['cash_interest']['enabled'] is True
          assert mode['cash_interest']['benchmark'] == 'IORB'
          assert policy['day_count'] == 'ACT/365'
          assert policy['compounding'] == 'daily'
          assert policy['accrual_calendar'] == 'calendar_days'
          assert config['rules']['buy_and_hold'] is True
          assert config['universe_version'] == 'briefrooms-ai-55-v1'
          assert len(config['universe']) == 55
          assert not {'SPY','QQQ','IWM','GLD','TLT'}.intersection(config['universe'])
          print('Manual locked buy-and-hold contract validated.')
          PY

  generate-brace:
    if: >-
      (github.event_name == 'issues' &&
       github.event.issue.title == 'Generate BRACE tournament portfolio') ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[generate-brace]'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen-market dependencies
        run: python -m pip install --upgrade yfinance pandas
      - name: Generate and lock BRACE decision
        run: |
          set -euo pipefail
          if [[ -f data/ai_tournament/submissions/brace.json ]]; then
            python scripts/generate_brace_manual_submission.py validate
          else
            python scripts/generate_brace_manual_submission.py generate
            python scripts/generate_brace_manual_submission.py validate
          fi
      - name: Commit immutable BRACE submission
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/ai_tournament/submissions/brace.json \
            data/ai_tournament/commitments/brace.json \
            data/ai_tournament/brace_selection_audit.json
          if git diff --cached --quiet; then
            echo "BRACE portfolio was already locked and validated."
            exit 0
          fi
          git commit -m "Lock BRACE AI Tournament portfolio"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          echo "::error::Could not publish the locked BRACE portfolio."
          exit 1

  run-tournament:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen-market dependencies
        run: python -m pip install --upgrade yfinance pandas

      - name: Verify reveals and prepare immutable first-open targets
        id: bootstrap
        continue-on-error: true
        run: python scripts/ai_tournament_manual_bootstrap.py

      - name: Run completed market round
        if: steps.bootstrap.outcome == 'success'
        run: python scripts/ai_tournament_engine.py run

      - name: Validate completed tournament state
        if: steps.bootstrap.outcome == 'success'
        run: python scripts/ai_tournament_engine.py validate

      - name: Validate blocked public status
        if: steps.bootstrap.outcome != 'success'
        run: |
          python -m json.tool data/ai_tournament/public.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          public = json.loads(Path('data/ai_tournament/public.json').read_text(encoding='utf-8'))
          assert public['tournament']['status'] == 'BLOCKED_MISSING_REVEALED_SUBMISSIONS'
          assert public['readiness']['ready'] is False
          print('Tournament is truthfully blocked because full reveals are missing.')
          PY

      - name: Commit tournament state or truthful blocked status
        if: steps.bootstrap.outcome != 'success' || success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "${{ steps.bootstrap.outcome }}" == "success" ]]; then
            git add -A data/ai_tournament
          else
            git add data/ai_tournament/public.json
          fi
          if git diff --cached --quiet; then
            echo "No AI Tournament state change to commit."
          else
            git commit -m "Update AI Tournament state"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [[ "$attempt" == "5" ]]; then
                echo "::error::Could not publish AI Tournament state."
                exit 1
              fi
              sleep $((attempt * 4))
            done
          fi

      - name: Fail visibly when locked reveals are incomplete
        if: steps.bootstrap.outcome != 'success'
        run: |
          echo "::error::AI Tournament cannot start because one or more full locked submissions are absent or fail their commitment hash."
          exit 1
