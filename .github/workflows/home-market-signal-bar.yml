name: Publish Homepage Market Signal Bar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/home-weekly-top-position.js"
      - "scripts/install_home_market_signal_bar.py"
      - "tests/test_home_weekly_top_position.js"
      - ".github/workflows/home-market-signal-bar.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: homepage-market-signal-bar
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test canonical homepage signal selection
        run: |
          set -euo pipefail
          node --check scripts/home-weekly-top-position.js
          node --test tests/test_home_weekly_top_position.js
          python -m py_compile scripts/install_home_market_signal_bar.py
          python scripts/install_home_market_signal_bar.py
          python scripts/install_home_market_signal_bar.py --check

      - name: Commit homepage asset version
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pl/index.html en/index.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "fix(home): canonicalize trading signal source"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt*4))
          done
          exit 1

      - name: Request Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            code="$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")"
            if [[ "$code" == "201" ]]; then exit 0; fi
            if [[ "$code" != "409" ]]; then cat /tmp/pages.json; exit 1; fi
            sleep 8
          done
          exit 1

      - name: Verify production homepage and canonical feeds
        run: |
          python - <<'PY'
          import json,time,urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          headers={'User-Agent':'BriefRooms-Homepage-Market-Signal-Verifier/2.0','Cache-Control':'no-cache'}
          pages={'pl':'https://briefrooms.com/pl/','en':'https://briefrooms.com/en/'}
          client='https://briefrooms.com/scripts/home-weekly-top-position.js?v=5'
          portfolio_url='https://briefrooms.com/data/investments/stock_trading_portfolio.json'
          last={}
          success=False
          for attempt in range(1,31):
            ok=True
            token=f'{int(time.time())}-{attempt}'
            for lang,url in pages.items():
              try:
                req=urllib.request.Request(url+f'?marketbar={token}',headers=headers)
                with urllib.request.urlopen(req,timeout=20) as r:
                  body=r.read().decode('utf-8',errors='replace')
                page_ok='/scripts/home-weekly-top-position.js?v=5' in body and 'br-share-strip' in body
                last[lang]={'page':page_ok}
                ok = ok and page_ok
              except Exception as exc:
                last[lang]={'error':f'{type(exc).__name__}: {exc}'}
                ok=False
            try:
              req=urllib.request.Request(client+'&verify='+token,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:
                script=r.read().decode('utf-8',errors='replace')
              client_ok=(
                'WEEKLY_ALLOWLIST' in script and
                'stock_trading_portfolio.json' in script and
                'gpw_daily_pick.json' not in script and
                'us_daily_stock.json' not in script and
                'BRIEFROOMS STOCK TRADING · OPEN' in script
              )
              last['client']={'served':client_ok,'version':5}
              ok = ok and client_ok
            except Exception as exc:
              last['client']={'error':f'{type(exc).__name__}: {exc}'}
              ok=False
            try:
              req=urllib.request.Request(portfolio_url+f'?v={token}',headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:
                portfolio=json.load(r)
              markets=portfolio.get('markets') or {}
              feed_ok=isinstance(markets,dict) and all(
                isinstance((markets.get(m) or {}).get('open_positions'),list)
                for m in ('GPW','US')
              )
              last['stock_trading_portfolio']={
                'feed':feed_ok,
                'updated_at':portfolio.get('updated_at'),
                'gpw_open':len((markets.get('GPW') or {}).get('open_positions') or []),
                'us_open':len((markets.get('US') or {}).get('open_positions') or []),
              }
              ok = ok and feed_ok
            except Exception as exc:
              last['stock_trading_portfolio']={'error':f'{type(exc).__name__}: {exc}'}
              ok=False
            if ok:
              success=True
              break
            time.sleep(10)
          receipt={
            'schema_version':'home-market-signal-production-v2',
            'verified_at':datetime.now(timezone.utc).isoformat(timespec='seconds'),
            'status':'passed' if success else 'failed',
            'asset_version':5,
            'priority':['open_canonical_weekly','open_stock_trading_portfolio'],
            'weekly_allowlist':['eurusd','sp500_futures','btcusd'],
            'legacy_daily_feeds_excluded':True,
            'stock_label':'BRIEFROOMS STOCK TRADING · OPEN',
            'checks':last,
          }
          Path('data/home_market_signal_production_status.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          if not success:
            raise SystemExit('Homepage market signal production verification failed')
          PY

      - name: Commit production verification receipt
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/home_market_signal_production_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(home): verify canonical market signal production"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*4))
          done
          exit 1
