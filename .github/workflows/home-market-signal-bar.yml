name: Publish Homepage Market Signal Bar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/install_home_market_signal_bar.py"
      - ".github/workflows/home-market-signal-bar.yml"
      - "pl/index.html"
      - "en/index.html"

permissions:
  contents: write
  pages: write

concurrency:
  group: homepage-market-signal-bar
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate interaction hotfix
        run: |
          set -euo pipefail
          python -m py_compile scripts/install_home_market_signal_bar.py
          python scripts/install_home_market_signal_bar.py
          python scripts/install_home_market_signal_bar.py --check
          grep -q "MARKET_SIGNAL_DISABLED_INTERACTION_HOTFIX" pl/index.html
          grep -q "MARKET_SIGNAL_DISABLED_INTERACTION_HOTFIX" en/index.html
          ! grep -q "home-market-signal-v6.js" pl/index.html
          ! grep -q "home-market-signal-guard-v1.js" pl/index.html
          ! grep -q "home-weekly-top-position.js" pl/index.html

      - name: Commit homepage hotfix installation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pl/index.html en/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "hotfix(home): keep market signal disabled"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*4))
          done
          exit 1

      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code="$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")"
            if [[ "$code" == "201" ]]; then exit 0; fi
            if [[ "$code" != "409" ]]; then cat /tmp/pages.json; exit 1; fi
            sleep 8
          done
          exit 1

      - name: Verify production interaction hotfix
        run: |
          python - <<'PY'
          import time, urllib.request
          headers={'User-Agent':'BriefRooms-Interaction-Hotfix-Verifier/1.0','Cache-Control':'no-cache'}
          pages={'pl':'https://briefrooms.com/pl/','en':'https://briefrooms.com/en/'}
          forbidden=('home-market-signal-v6.js','home-market-signal-guard-v1.js','home-weekly-top-position.js')
          ok=False
          for attempt in range(1,31):
              all_ok=True
              token=f'{int(time.time())}-{attempt}'
              for lang,url in pages.items():
                  try:
                      req=urllib.request.Request(url+f'?interaction_hotfix={token}',headers=headers)
                      with urllib.request.urlopen(req,timeout=20) as r:
                          body=r.read().decode('utf-8',errors='replace')
                      page_ok=(
                          'MARKET_SIGNAL_DISABLED_INTERACTION_HOTFIX' in body
                          and not any(x in body for x in forbidden)
                          and 'href="/pl/aktualnosci.html"' in body if lang=='pl' else 'MARKET_SIGNAL_DISABLED_INTERACTION_HOTFIX' in body and not any(x in body for x in forbidden)
                      )
                      all_ok=all_ok and page_ok
                  except Exception:
                      all_ok=False
              if all_ok:
                  ok=True
                  break
              time.sleep(10)
          if not ok:
              raise SystemExit('Production interaction hotfix verification failed')
          print('PRODUCTION_INTERACTION_HOTFIX_OK')
          PY
