name: Homepage Market Signal Asset Health
# The Daily/Weekly engines remain available in Investments. The redesigned homepage
# no longer mounts the legacy market-signal bar, so this workflow validates the
# retained client and feeds without rewriting PL/EN homepage HTML.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/home-weekly-top-position.js"
      - "tests/test_home_weekly_top_position.js"
      - ".github/workflows/home-market-signal-bar.yml"

permissions:
  contents: read

concurrency:
  group: homepage-market-signal-bar
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test retained signal-selection client
        run: |
          set -euo pipefail
          node --check scripts/home-weekly-top-position.js
          node --test tests/test_home_weekly_top_position.js

      - name: Confirm signal data remains available but homepage mount is retired
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in ('data/investments/gpw_daily_pick.json', 'data/investments/us_daily_stock.json'):
              payload = json.loads(Path(path).read_text(encoding='utf-8'))
              assert isinstance(payload, dict)
              assert payload.get('decision'), f'{path}: decision missing'
          for path in ('pl/index.html', 'en/index.html'):
              source = Path(path).read_text(encoding='utf-8')
              assert 'class="br-home"' in source
              assert '/scripts/home-weekly-top-position.js' not in source
          print('Daily/Weekly signal assets are retained and intentionally live inside Investments, not the homepage.')
          PY
