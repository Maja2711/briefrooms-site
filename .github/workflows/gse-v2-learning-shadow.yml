name: GSE v2 Advanced Historical Learning

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Geopolitical Scenario Engine Shadow"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "scripts/gse_v2_learning_loop.py"
      - "scripts/gse_publish_learning_review_status.py"
      - "tests/test_gse_v2_learning_loop.py"
      - "tests/test_gse_publish_learning_review_status.py"
      - "data/gse/historical_event_catalog.json"
      - "docs/GSE_V2_ADVANCED_LEARNING_LOOP.md"
      - ".github/workflows/gse-v2-learning-shadow.yml"

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: gse-live-shadow
  cancel-in-progress: false

env:
  ARTIFACT_NAME: gse-shadow-state
  PUBLIC_REVIEW_STATUS_PATH: data/gse/gse_v2_learning_review_status.json

jobs:
  learn:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current production code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare GSE state directory
        run: |
          echo "GSE_STATE_DIR=$RUNNER_TEMP/gse_state" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/gse_state"

      - name: Restore latest cumulative GSE state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$api" > "$RUNNER_TEMP/gse-artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/gse-artifacts.json" <<'PY'
          import json,sys
          from pathlib import Path
          p=json.loads(Path(sys.argv[1]).read_text())
          r=[x for x in p.get("artifacts",[]) if not x.get("expired")]
          r.sort(key=lambda x:x.get("created_at",""),reverse=True)
          print(r[0]["id"] if r else "")
          PY
          )
          test -n "$artifact_id"
          curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$RUNNER_TEMP/gse-state.zip"
          mkdir -p "$RUNNER_TEMP/gse-artifact"
          unzip -q "$RUNNER_TEMP/gse-state.zip" -d "$RUNNER_TEMP/gse-artifact"
          test -f "$RUNNER_TEMP/gse-artifact/gse-state.tgz"
          tar -xzf "$RUNNER_TEMP/gse-artifact/gse-state.tgz" -C "$GSE_STATE_DIR"
          test -f "$GSE_STATE_DIR/gse_forecasts.jsonl"
          test -f "$GSE_STATE_DIR/gse_historical_analogue_library.json"

      - name: Validate advanced learning and review observability
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/gse_v2_learning_loop.py scripts/gse_publish_learning_review_status.py
          python -m json.tool data/gse/historical_event_catalog.json >/dev/null
          python -m unittest tests.test_gse_v2_learning_loop tests.test_gse_publish_learning_review_status -v
          python - <<'PY'
          import gse_v2_learning_loop as l
          assert l.MODE=="shadow"
          assert l.HORIZONS_H==(24,168,720)
          assert l.ACTIVE_RESEARCH_POLICY["max_overlay_weight"]<=0.20
          PY

      - name: Resolve latest historical catalogue
        run: |
          if [ -f "$GSE_STATE_DIR/gse_historical_event_catalog_effective.json" ]; then
            echo "GSE_HISTORICAL_CATALOG=$GSE_STATE_DIR/gse_historical_event_catalog_effective.json" >> "$GITHUB_ENV"
          else
            echo "GSE_HISTORICAL_CATALOG=$GITHUB_WORKSPACE/data/gse/historical_event_catalog.json" >> "$GITHUB_ENV"
          fi

      - name: Run advanced historical learning loop
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python scripts/gse_v2_learning_loop.py --state-dir "$GSE_STATE_DIR" --catalog "$GSE_HISTORICAL_CATALOG" --refresh-days 7

      - name: Validate learned state and zero-authority boundary
        run: |
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          root=Path(os.environ["GSE_STATE_DIR"])
          s=json.loads((root/"gse_v2_learning_state.json").read_text())
          h=json.loads((root/"gse_v2_historical_walkforward.json").read_text())
          p=json.loads((root/"gse_v2_policy_proposal.json").read_text())
          c=json.loads((root/"gse_v2_regime_calibration.json").read_text())
          lib=json.loads((root/"gse_v2_enriched_library.json").read_text())
          z=s["controls"]
          assert s["mode"]=="shadow"
          assert not z["automatic_tuning_enabled"] and not z["policy_proposal_auto_apply_enabled"] and not z["automatic_promotion_enabled"]
          assert not z["decision_engine_connected"] and not z["belief_core_connected"] and not z["trade_execution_enabled"] and not z["policy_output_enabled"] and not z["v1_forecast_modified"]
          assert p["automatically_applied"] is False and p["active_policy_unchanged"] is True
          assert lib["market_outcomes_used_for_event_selection"] is False and lib["decision_influence"] is False
          assert c["controls"]["automatic_tuning_enabled"] is False and h["automatic_tuning_applied"] is False
          sys.path.insert(0,"scripts")
          import gse_v2_learning_loop as l
          rows=l.read_jsonl(root/"gse_v2_learning_ledger.jsonl")
          l._validate_ledger(rows)
          assert rows
          discovery=root/'gse_historical_discovery_state.json'
          if discovery.exists():
              d=json.loads(discovery.read_text())
              assert d['controls']['market_outcomes_used_for_event_selection'] is False
              if d.get('target_met'):
                  assert int(d['effective_verified_cluster_n']) >= 100
          print("Historical catalogue",os.environ.get("GSE_HISTORICAL_CATALOG"))
          print("Historical",s["historical"])
          print("Prospective",s["prospective"])
          print("Readiness",s["readiness"])
          print("Policy",p["status"])
          PY

      - name: Publish auditable learning review status
        id: review_status
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          previous=""
          if [ -f "$PUBLIC_REVIEW_STATUS_PATH" ]; then previous="$PUBLIC_REVIEW_STATUS_PATH"; fi
          python scripts/gse_publish_learning_review_status.py \
            --state-dir "$GSE_STATE_DIR" \
            --output "$RUNNER_TEMP/gse-v2-learning-review-status.json" \
            ${previous:+--previous "$previous"}
          cp "$RUNNER_TEMP/gse-v2-learning-review-status.json" "$PUBLIC_REVIEW_STATUS_PATH"
          cp "$RUNNER_TEMP/gse-v2-learning-review-status.json" "$GSE_STATE_DIR/gse_v2_learning_review_status.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          from pathlib import Path
          p=json.loads((Path(os.environ['RUNNER_TEMP'])/'gse-v2-learning-review-status.json').read_text())
          print(f"review_required={str(bool(p.get('review_required'))).lower()}")
          print(f"transition={p.get('transition') or 'unknown'}")
          print(f"status={p.get('status') or 'unknown'}")
          PY

      - name: Persist learning review status to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$PUBLIC_REVIEW_STATUS_PATH"
          if git diff --cached --quiet; then
            echo "GSE v2 review status unchanged."
            exit 0
          fi
          git commit -m "Update GSE v2 learning review status"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo "Unable to publish GSE v2 learning review status" >&2
          exit 1

      - name: Notify human review through GitHub issue
        if: steps.review_status.outputs.review_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_TRANSITION: ${{ steps.review_status.outputs.transition }}
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/gse-review-body.md"
          import json,os
          from pathlib import Path
          p=json.loads((Path(os.environ['RUNNER_TEMP'])/'gse-v2-learning-review-status.json').read_text())
          pp=p.get('policy_proposal') or {}
          print('# GSE v2 — human review required')
          print()
          print(f"Status: **{p.get('status')}**")
          print(f"Transition: `{p.get('transition')}`")
          print(f"Review kind: `{p.get('review_kind')}`")
          print()
          print('## Candidate')
          print('```json')
          print(json.dumps(pp.get('candidate'), indent=2, sort_keys=True))
          print('```')
          print(f"Holdout ΔBrier candidate-active: `{pp.get('holdout_delta_brier_candidate_minus_active')}`")
          print(f"Prospective paired N: `{(p.get('prospective') or {}).get('paired_n')}`")
          print(f"Prospective ΔBrier v2-v1: `{(p.get('prospective') or {}).get('delta_brier_v2_minus_v1')}`")
          print(f"Calibration bias: `{(p.get('prospective') or {}).get('calibration_bias_v2_regime')}`")
          print()
          print('No parameter was automatically applied. GSE remains shadow-only.')
          print(f"Run: {((p.get('run') or {}).get('run_url') or 'n/a')}")
          PY
          title="GSE v2 human review required"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -z "$issue" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/gse-review-body.md"
          elif [ "$REVIEW_TRANSITION" != "unchanged" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/gse-review-body.md"
          else
            echo "Review issue already open; no duplicate notification."
          fi

      - name: Add GSE review status to workflow summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/gse-v2-learning-review-status.json" ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,os
          from pathlib import Path
          p=json.loads((Path(os.environ['RUNNER_TEMP'])/'gse-v2-learning-review-status.json').read_text())
          print('## GSE v2 learning status')
          print(f"- Status: **{p.get('status')}**")
          print(f"- Human review required: **{p.get('review_required')}**")
          print(f"- Transition: `{p.get('transition')}`")
          print(f"- Policy proposal: `{(p.get('policy_proposal') or {}).get('status')}`")
          print(f"- Prospective paired N: `{(p.get('prospective') or {}).get('paired_n')}`")
          PY
          fi

      - name: Pack cumulative GSE state
        run: tar -czf "$RUNNER_TEMP/gse-state.tgz" -C "$GSE_STATE_DIR" .

      - name: Store cumulative GSE shadow state
        uses: actions/upload-artifact@v4
        with:
          name: gse-shadow-state
          path: ${{ runner.temp }}/gse-state.tgz
          if-no-files-found: error
          retention-days: 60
          compression-level: 0
