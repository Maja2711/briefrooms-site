name: GSE v2 Advanced Historical Learning (Manual Repair)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: gse-live-shadow
  cancel-in-progress: false

env:
  ARTIFACT_NAME: gse-shadow-state
  PUBLIC_REVIEW_STATUS_PATH: data/gse/gse_v2_learning_review_status.json
  PUBLIC_LAB_PATH: data/gse/gse_v2_lab_public.json

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore latest cumulative GSE state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "GSE_STATE_DIR=$RUNNER_TEMP/gse_state" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/gse_state"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$api" > "$RUNNER_TEMP/gse-artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/gse-artifacts.json" <<'PY'
          import json,sys
          from pathlib import Path
          p=json.loads(Path(sys.argv[1]).read_text())
          rows=[x for x in p.get('artifacts',[]) if not x.get('expired')]
          rows.sort(key=lambda x:x.get('created_at',''), reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
          )
          test -n "$artifact_id"
          curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$RUNNER_TEMP/gse-state.zip"
          mkdir -p "$RUNNER_TEMP/gse-artifact"
          unzip -q "$RUNNER_TEMP/gse-state.zip" -d "$RUNNER_TEMP/gse-artifact"
          test -f "$RUNNER_TEMP/gse-artifact/gse-state.tgz"
          tar -xzf "$RUNNER_TEMP/gse-artifact/gse-state.tgz" -C "$GSE_STATE_DIR"
          test -f "$GSE_STATE_DIR/gse_state.json"
          test -f "$GSE_STATE_DIR/gse_historical_analogue_library.json"

      - name: Validate advanced learning code
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          python -m py_compile scripts/gse_v2_learning_loop.py scripts/gse_publish_learning_review_status.py scripts/gse_v2_public_lab_projection.py
          python -m unittest tests.test_gse_v2_learning_loop tests.test_gse_publish_learning_review_status tests.test_gse_v2_public_lab_projection -v

      - name: Resolve latest historical catalogue
        run: |
          if [ -f "$GSE_STATE_DIR/gse_historical_event_catalog_effective.json" ]; then
            echo "GSE_HISTORICAL_CATALOG=$GSE_STATE_DIR/gse_historical_event_catalog_effective.json" >> "$GITHUB_ENV"
          else
            echo "GSE_HISTORICAL_CATALOG=$GITHUB_WORKSPACE/data/gse/historical_event_catalog.json" >> "$GITHUB_ENV"
          fi

      - name: Run one explicit repair learning cycle
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python scripts/gse_v2_learning_loop.py --state-dir "$GSE_STATE_DIR" --catalog "$GSE_HISTORICAL_CATALOG" --refresh-days 7

      - name: Build review status and Lab projection
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          previous=""
          if [ -f "$PUBLIC_REVIEW_STATUS_PATH" ]; then previous="$PUBLIC_REVIEW_STATUS_PATH"; fi
          python scripts/gse_publish_learning_review_status.py --state-dir "$GSE_STATE_DIR" --output "$PUBLIC_REVIEW_STATUS_PATH" ${previous:+--previous "$previous"}
          cp "$PUBLIC_REVIEW_STATUS_PATH" "$GSE_STATE_DIR/gse_v2_learning_review_status.json"
          python scripts/gse_v2_public_lab_projection.py --state-dir "$GSE_STATE_DIR" --catalog "$GSE_HISTORICAL_CATALOG" --output "$PUBLIC_LAB_PATH"

      - name: Pack and store repaired cumulative state
        run: tar -czf "$RUNNER_TEMP/gse-state.tgz" -C "$GSE_STATE_DIR" .

      - name: Upload repaired cumulative state
        uses: actions/upload-artifact@v4
        with:
          name: gse-shadow-state
          path: ${{ runner.temp }}/gse-state.tgz
          if-no-files-found: error
          retention-days: 60
          compression-level: 0

      - name: Publish repaired public state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$PUBLIC_REVIEW_STATUS_PATH" "$PUBLIC_LAB_PATH"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Repair GSE v2 learning and Lab state"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; sleep $((attempt*2)); continue; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
