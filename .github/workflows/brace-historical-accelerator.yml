name: Accelerate BRACE Historical Learning

on:
  workflow_dispatch: {}
  schedule:
    # Runs after the standard Sunday BRACE review.
    - cron: "20 8 * * 0"
  pull_request:
    paths:
      - "scripts/brace_historical_accelerator.py"
      - "tests/test_brace_historical_accelerator.py"
      - "scripts/portfolio_10k_brace_learning.py"
      - "tests/test_portfolio_10k_brace_learning.py"
      - "data/investments/portfolio_10k_brace_memory.json"
      - ".github/workflows/brace-historical-accelerator.yml"
  push:
    branches: [main]
    paths:
      - "scripts/brace_historical_accelerator.py"
      - "scripts/brace_historical_seed_calibration.py"
      - "scripts/brace_historical_publish.py"
      - "tests/test_brace_historical_accelerator.py"
      - "tests/test_brace_historical_seed_calibration.py"
      - ".github/workflows/brace-historical-accelerator.yml"

permissions:
  contents: write

concurrency:
  group: brace-portfolio-research
  cancel-in-progress: false

jobs:
  validate-compact-memory:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate BRACE historical data reliability and compact memory
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest pandas numpy yfinance
          python -m py_compile scripts/portfolio_10k_brace_learning.py scripts/brace_historical_accelerator.py
          python -m pytest -q tests/test_portfolio_10k_brace_learning.py tests/test_brace_historical_accelerator.py tests/test_brace_historical_seed_calibration.py
      - name: Independently verify full backup, all records and unchanged learning
        if: github.head_ref == 'fix/brace-memory-compact-lossless-20261009'
        run: |
          set -euo pipefail
          git fetch --quiet origin refs/heads/backup/brace-memory-full-pre-compact-20261009:refs/remotes/origin/backup/brace-memory-full-pre-compact-20261009
          python - <<'PY'
          import copy
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          import portfolio_10k_brace_learning as learning

          memory_path = 'data/investments/portfolio_10k_brace_memory.json'
          pinned = 'origin/backup/brace-memory-full-pre-compact-20261009'
          blob = subprocess.check_output(['git', 'rev-parse', f'{pinned}:{memory_path}'], text=True).strip()
          assert blob == 'b7857af184b380b9ed5a1dd1cc39cf5ee7cf3df4', blob
          baseline_bytes = subprocess.check_output(['git', 'show', f'{pinned}:{memory_path}'])
          current_bytes = Path(memory_path).read_bytes()
          before, after = json.loads(baseline_bytes), json.loads(current_bytes)
          assert before == after, 'BRACE original-vs-compacted semantic mismatch'
          assert len(before['decisions']) == len(after['decisions']) == 139
          assert len(before['outcome_events']) == len(after['outcome_events']) == 192
          assert len(before['audit']) == len(after['audit']) == 20
          assert before['reliability'] == after['reliability']
          assert before['historical_training'] == after['historical_training']
          assert len(current_bytes) < 1_000_000
          learning._now = lambda: '2026-10-09T00:00:00+00:00'
          old_recalculated, new_recalculated = copy.deepcopy(before), copy.deepcopy(after)
          assert learning.rebuild_reliability(old_recalculated) == learning.rebuild_reliability(new_recalculated)
          assert learning.learning_summary(old_recalculated) == learning.learning_summary(new_recalculated)
          print('BRACE_MEMORY_BACKUP_SEMANTIC_PARITY_PASS')
          print('original_bytes', len(baseline_bytes), 'compact_bytes', len(current_bytes))
          print('sha256_original', hashlib.sha256(baseline_bytes).hexdigest())
          print('sha256_compact', hashlib.sha256(current_bytes).hexdigest())
          print('decisions', len(after['decisions']), 'outcomes', len(after['outcome_events']))
          PY

  train-validate-and-apply:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip yfinance pandas numpy pytest

      - name: Validate accelerator and BRACE suite
        run: |
          python -m py_compile scripts/brace_historical_accelerator.py scripts/brace_historical_seed_calibration.py scripts/brace_historical_publish.py
          python -m pytest -q tests/test_brace_historical_accelerator.py tests/test_brace_historical_seed_calibration.py tests/test_portfolio_10k_brace*.py

      - name: Train on the longest honest price history
        run: python scripts/brace_historical_accelerator.py --start 1995-01-01 --patience 18

      - name: Calibrate lessons to validated strength
        run: python scripts/brace_historical_seed_calibration.py

      - name: Rebuild current BRACE snapshot
        run: python scripts/portfolio_10k_brace.py

      - name: Apply historical seed and live adaptive learning
        run: python scripts/portfolio_10k_brace_learning_runtime.py

      - name: Publish historical-learning audit state
        run: python scripts/brace_historical_publish.py

      - name: Refresh no-look-ahead BRACE-Lite backtest
        run: python scripts/portfolio_10k_brace_backtest.py

      - name: Recheck champion-challenger promotion gate
        run: python scripts/portfolio_10k_brace_promotion.py

      - name: Commit trained memory and transparent outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/investments/portfolio_10k_brace_historical_learning.json \
            data/investments/portfolio_10k_brace_memory.json \
            data/investments/portfolio_10k_brace.json \
            data/investments/portfolio_10k_brace_backtest.json
          if git diff --cached --quiet; then
            echo "BRACE historical learning outputs already current."
          else
            git commit -m "Train BRACE on guarded historical lessons"
            git pull --rebase origin main
            git push
          fi
