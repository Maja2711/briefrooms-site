name: BRACE Portfolio Hourly Safety Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "31 6-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: portfolio-10k-automation
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start immutable LIVE execution clock
        run: |
          echo "NO_RETROACTIVE_EXECUTION=1" >> "$GITHUB_ENV"
          echo "NO_RETROACTIVE_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Install paper quote dependency
        run: python -m pip install --upgrade pip yfinance pandas pytest

      - name: Validate BRACE integrity controls and execution invariant
        run: |
          python -m pytest -q tests/test_brace_portfolio_engine.py -k "baseline or fallback or execution"
          python -m pytest -q tests/test_brace_portfolio_pending_lifecycle.py
          python -m unittest tests.test_no_retroactive_execution -v

      - name: Check freshness, limits and fallback before execution
        env:
          BRACE_TESTS_PASSED: "1"
        run: python scripts/brace_portfolio_engine.py --mode monitor

      - name: Execute eligible model-only paper orders
        run: python scripts/brace_portfolio_execution.py --network

      - name: Reconcile state after paper execution
        env:
          BRACE_TESTS_PASSED: "1"
        run: python scripts/brace_portfolio_engine.py --mode monitor

      - name: Republish reconciled BRACE control projection
        run: python scripts/brace_portfolio_user_control.py --republish

      - name: Commit validated monitoring state through NO RETROACTIVE airlock
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio10k
          if git diff --cached --quiet; then
            echo "No BRACE monitoring changes to commit."
            exit 0
          fi
          # NO RETROACTIVE EXECUTION: no BRACE paper fill may be created in the past.
          python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
          git commit -m "Update BRACE safety monitor"
          for attempt in 1 2 3; do
            if git pull --rebase origin main; then
              python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD^ --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
              if git push origin HEAD:main; then
                exit 0
              fi
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brace-monitor-diagnostics
          path: data/portfolio10k
          retention-days: 14
