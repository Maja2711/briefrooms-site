name: Portfolio 10K Freshness Guardian

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 6-21 * * 1-5"
  push:
    branches: [main]
    paths:
      - ".github/workflows/portfolio-10k-guardian.yml"
      - ".github/workflows/portfolio-10k-hourly-prices.yml"
      - "scripts/portfolio_10k_hard_gate.py"
      - "scripts/validate_portfolio_10k_state.py"
      - "scripts/reconcile_portfolio_10k_executions.py"

permissions:
  contents: write

concurrency:
  group: portfolio-market-data
  cancel-in-progress: false

jobs:
  repair-stale-core:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decide whether primary hourly publication is stale
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=json.loads(Path('data/investments/portfolio_10k.json').read_text())
          raw=str(p.get('last_updated_at') or '').replace('Z','+00:00')
          try:
              dt=datetime.fromisoformat(raw)
              if dt.tzinfo is None: dt=dt.replace(tzinfo=timezone.utc)
              age=(datetime.now(timezone.utc)-dt.astimezone(timezone.utc)).total_seconds()/60
          except Exception:
              age=10**9
          repair=age > 70
          print(f'Portfolio MTM age: {age:.1f} min; repair={repair}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'NEED_REPAIR={1 if repair else 0}\n')
          PY

      - name: Install market dependencies only for repair
        if: env.NEED_REPAIR == '1'
        run: python -m pip install --upgrade pip yfinance pandas numpy

      - name: Repair stale mark-to-market core
        if: env.NEED_REPAIR == '1'
        run: |
          python scripts/reconcile_portfolio_10k_executions.py
          python scripts/portfolio_10k_hourly_prices.py
          python scripts/build_portfolio_10k_usd.py
          python scripts/fix_portfolio_10k_usd_reviews.py
          python scripts/portfolio_10k_guardian.py
          python scripts/portfolio_10k_hard_gate.py
          python scripts/render_portfolio_10k_static.py

      - name: Publish repaired core and PL/EN snapshots
        if: env.NEED_REPAIR == '1'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/portfolio_10k.json \
                  data/investments/portfolio_10k_usd.json \
                  data/portfolio10k/guardian_state.json \
                  pl/inwestycje/portfel-10k.html \
                  en/investing/portfolio-10k.html
          if git diff --cached --quiet; then
            echo "Guardian found stale data but repair produced no diff."
            exit 1
          fi
          git commit -m "Guardian repair Portfolio 10K freshness"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
          exit 1

      - name: Legacy audit cannot block guardian publication
        if: env.NEED_REPAIR == '1'
        continue-on-error: true
        run: |
          python -m unittest tests.test_validate_portfolio_10k_state -v
          python scripts/validate_portfolio_10k_state.py

      - name: Freshness receipt
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=json.loads(Path('data/investments/portfolio_10k.json').read_text())
          raw=str(p.get('last_updated_at') or '').replace('Z','+00:00')
          dt=datetime.fromisoformat(raw)
          if dt.tzinfo is None: dt=dt.replace(tzinfo=timezone.utc)
          age=(datetime.now(timezone.utc)-dt.astimezone(timezone.utc)).total_seconds()/60
          print(f'Committed/public Portfolio 10K age: {age:.1f} min')
          if age > 75:
              raise SystemExit('Portfolio 10K freshness SLA still violated')
          PY
