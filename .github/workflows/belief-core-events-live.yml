name: Belief Core News Macro Shadow Collection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/belief-core-events-live.yml"
      - "scripts/belief_external_live.py"
      - "scripts/belief_news_event_adapter.py"
      - "scripts/belief_macro_calendar_adapter.py"
      - "scripts/belief_macro_data_adapter.py"
      - "scripts/belief_llm_interpreter.py"
      - "tests/test_belief_core_news_macro.py"
      - "tests/test_belief_macro_data_adapter.py"
  schedule:
    # 30-minute primary-source/event scan from US pre-market through early evening.
    # Wide UTC coverage handles both EDT and EST; source timestamps remain explicit.
    - cron: "2,32 12-23 * * 1-5"

permissions:
  contents: read
  actions: write

# Must match the market-data workflow group: both jobs mutate one cumulative
# Belief Core state artifact and therefore must never write concurrently.
concurrency:
  group: belief-core-live-shadow
  cancel-in-progress: false

env:
  ARTIFACT_NAME: belief-core-shadow-state

jobs:
  collect-events:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_GENERATION_MODEL: gemini-3.5-flash
      GEMINI_REVIEW_MODEL: gemini-3.5-flash
      GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite
      GEMINI_MIN_INTERVAL_SECONDS: "8"
      BELIEF_SEC_ENABLED: "1"

    steps:
      - name: Checkout current production code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LLM transport dependency
        run: pip install requests

      - name: Prepare runtime state path
        run: |
          echo "STATE_DIR=$RUNNER_TEMP/belief_core_state" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/belief_core_state"

      - name: Restore latest cumulative shadow state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > "$RUNNER_TEMP/artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/artifacts.json" <<'PY'
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text())
          rows=[x for x in payload.get("artifacts", []) if not x.get("expired")]
          rows.sort(key=lambda x: x.get("created_at", ""), reverse=True)
          print(rows[0]["id"] if rows else "")
          PY
          )
          if [ -z "$artifact_id" ]; then
            echo "No previous Belief Core state artifact; starting a new shadow ledger."
            exit 0
          fi
          echo "Restoring artifact id=$artifact_id"
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o "$RUNNER_TEMP/belief-state.zip"
          mkdir -p "$RUNNER_TEMP/belief-state-artifact"
          unzip -q "$RUNNER_TEMP/belief-state.zip" -d "$RUNNER_TEMP/belief-state-artifact"
          test -f "$RUNNER_TEMP/belief-state-artifact/belief-core-state.tgz"
          tar -xzf "$RUNNER_TEMP/belief-state-artifact/belief-core-state.tgz" -C "$STATE_DIR"

      - name: Validate News Macro adapters before collection
        run: |
          python -m py_compile \
            scripts/belief_core.py \
            scripts/belief_adapter_contract.py \
            scripts/belief_llm_interpreter.py \
            scripts/belief_news_event_adapter.py \
            scripts/belief_macro_calendar_adapter.py \
            scripts/belief_macro_data_adapter.py \
            scripts/belief_external_live.py
          python -m unittest \
            tests.test_belief_core_news_macro \
            tests.test_belief_macro_data_adapter -v
          python - <<'PY'
          import belief_core_live as live
          assert live.MODE == 'shadow'
          assert live.TRADE_EXECUTION_ENABLED is False
          assert live.POLICY_OUTPUT_ENABLED is False
          assert live.AUTOMATIC_TUNING_ENABLED is False
          print('Belief Core event adapter safety invariants: PASS')
          PY

      - name: Run News Event Macro Calendar and Macro Data shadow cycle
        run: python scripts/belief_external_live.py --state-dir "$STATE_DIR"

      - name: Validate persisted shadow state
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['STATE_DIR'])
          state=json.loads((root/'state.json').read_text())
          dashboard=json.loads((root/'dashboard.json').read_text())
          scheduler=json.loads((root/'scheduler.json').read_text())
          assert state['schema_version'] == 2
          assert dashboard['mode'] == 'shadow'
          controls=dashboard['controls']
          assert controls['decision_engine_connected'] is False
          assert controls['trade_execution_enabled'] is False
          assert controls['policy_output_enabled'] is False
          assert controls['automatic_tuning_enabled'] is False
          assert scheduler['last_external_status']['mode'] == 'shadow'
          assert 'macro_data_observations' in scheduler['last_external_status']
          assert 'macro_data_evidence' in scheduler['last_external_status']
          print('Belief Core external state validation: PASS')
          print('Last external status:', scheduler['last_external_status'])
          PY

      - name: Pack cumulative state
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/belief-core-state.tgz" -C "$STATE_DIR" .
          ls -lh "$RUNNER_TEMP/belief-core-state.tgz"

      - name: Store cumulative shadow state outside repository
        uses: actions/upload-artifact@v4
        with:
          name: belief-core-shadow-state
          path: ${{ runner.temp }}/belief-core-state.tgz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Keep rolling artifact backups
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > "$RUNNER_TEMP/artifacts-after.json"
          python - "$RUNNER_TEMP/artifacts-after.json" > "$RUNNER_TEMP/delete-artifacts.txt" <<'PY'
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text())
          rows=[x for x in payload.get('artifacts', []) if not x.get('expired')]
          rows.sort(key=lambda x: x.get('created_at',''), reverse=True)
          for row in rows[48:]:
              print(row['id'])
          PY
          while read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            curl -fsSL -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done < "$RUNNER_TEMP/delete-artifacts.txt"
