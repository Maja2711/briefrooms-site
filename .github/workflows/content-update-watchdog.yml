name: Content update watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "25 * * * *"

permissions:
  actions: read
  contents: write
  issues: write
  models: read

concurrency:
  group: content-publication-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      publisher_active: ${{ steps.publisher.outputs.active }}
      recovery_needed: ${{ steps.recovery.outputs.recovery_needed }}
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Detect an active atomic publisher
        id: publisher
        uses: actions/github-script@v7
        with:
          script: |
            const activeStates = new Set([
              "queued",
              "in_progress",
              "waiting",
              "pending",
              "requested"
            ]);
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "publish-news.yml",
              per_page: 100
            });
            const active = response.data.workflow_runs.filter(
              run => activeStates.has(run.status)
            );
            core.setOutput("active", active.length > 0 ? "true" : "false");
            if (active.length > 0) {
              core.info(
                `Atomic publisher already active: ${active.map(run => `#${run.id} (${run.status})`).join(", ")}`
              );
            } else {
              core.info("No atomic publisher is currently active.");
            }

      - name: Inspect fetch, publication and production health
        id: watch
        run: |
          python scripts/content_update_watchdog.py \
            --base-url https://briefrooms.com \
            --attempts 3 \
            --interval 10 \
            --github-output "$GITHUB_OUTPUT" \
            --output "$RUNNER_TEMP/content-update-health.json"

      - name: Decide whether recovery may start
        id: recovery
        env:
          HEALTH_RECOVERY_NEEDED: ${{ steps.watch.outputs.recovery_needed }}
          PUBLISHER_ACTIVE: ${{ steps.publisher.outputs.active }}
        run: |
          if [[ "$HEALTH_RECOVERY_NEEDED" == "true" && "$PUBLISHER_ACTIVE" != "true" ]]; then
            echo "recovery_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "recovery_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload watchdog diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: content-watchdog-${{ github.run_id }}
          path: ${{ runner.temp }}/content-update-health.json
          retention-days: 30

  recover:
    needs: check
    if: needs.check.outputs.recovery_needed == 'true'
    uses: ./.github/workflows/publish-news.yml
    with:
      recovery: true
    secrets: inherit

  postcheck:
    needs: [check, recover]
    if: >-
      always() &&
      needs.check.result == 'success' &&
      needs.check.outputs.publisher_active != 'true' &&
      (needs.recover.result == 'success' || needs.recover.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main after optional recovery
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Require healthy production after recovery
        run: |
          python scripts/content_update_watchdog.py \
            --strict \
            --base-url https://briefrooms.com \
            --attempts 12 \
            --interval 10 \
            --output "$RUNNER_TEMP/content-update-health-final.json"

  alarm:
    needs: [check, recover, postcheck]
    if: >-
      always() &&
      needs.check.outputs.publisher_active != 'true' &&
      needs.postcheck.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Create or update the single publication alarm
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[ALARM] BriefRooms atomic news publication failed";
            const body = [
              "The PL+EN publication watchdog could not confirm a current atomic release.",
              "",
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Checked main commit: ${context.sha}`,
              "",
              "Existing production content was left unchanged; no timestamp was fabricated."
            ].join("\n");
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

  resolve-alarm:
    needs: postcheck
    if: needs.postcheck.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Close a resolved publication alarm
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[ALARM] BriefRooms atomic news publication failed";
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Resolved by watchdog run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed"
              });
            }
