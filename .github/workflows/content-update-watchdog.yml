name: Content update watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "25 * * * *"
  push:
    branches: [main]
    paths:
      - "data/content_update_contract.json"
      - "config/workflow_templates/build-home-brief.yml"
      - "config/workflow_templates/hot-x-topics.yml"
      - "scripts/content_update_watchdog.py"
      - "scripts/protect_home_feed.py"
      - "scripts/comment_quality.py"
      - "scripts/read_and_summarize_articles.py"
      - "scripts/validate_brief_quality.py"
      - "scripts/generate_permanent_briefs.py"
      - "scripts/home-briefs.js"
      - "tests/test_comment_quality.py"
      - "tests/test_permanent_briefs.py"
      - "tests/test_homepage_static.py"
      - "tests/test_home_briefs.js"
      - "scripts/validate_hot_x_comments.py"
      - ".github/workflows/build-home-brief.yml"
      - ".github/workflows/hot-x-topics.yml"
      - ".github/workflows/content-update-watchdog.yml"
      - "scripts/validate_news_home_publish.py"
      - "tests/test_validate_news_home_publish.py"

permissions:
  contents: write
  issues: write
  models: read

concurrency:
  group: content-publishing
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync latest main before health check
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install recovery dependencies
        run: python -m pip install --upgrade pip feedparser requests

      - name: Test PL and EN comment quality contract
        run: python -m unittest discover -s tests -p "test_comment_quality.py"

      - name: Test permanent brief archive
        run: python -m unittest discover -s tests -p "test_permanent_briefs.py"

      - name: Test static homepage briefs and resilient browser refresh
        run: |
          python -m unittest discover -s tests -p "test_homepage_static.py"
          node --test tests/test_home_briefs.js

      - name: Check schedules, staleness and last-good data
        id: watch
        run: python scripts/content_update_watchdog.py --github-output "$GITHUB_OUTPUT"

      - name: Recover stale homepage and news feeds
        if: steps.watch.outputs.home_stale == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_AI_MODEL: gpt-4o-mini
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: openai/gpt-4o-mini
          GITHUB_MODELS_REVIEW_MODEL: openai/gpt-4.1-mini
          GITHUB_MODELS_FALLBACK_MODEL: mistral-ai/mistral-medium-2505
          GITHUB_MODELS_FALLBACK_REVIEW_MODEL: cohere/cohere-command-a
          GITHUB_MODELS_MIN_INTERVAL_SECONDS: "12"
        run: |
          python scripts/protect_home_feed.py --backup
          for attempt in 1 2 3; do
            if python scripts/build_home_brief_pl.py; then break; fi
            if [[ "$attempt" == "3" ]]; then
              echo "::error::PL homepage recovery failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 60))
          done
          for attempt in 1 2 3; do
            if python scripts/build_home_brief_en.py; then break; fi
            if [[ "$attempt" == "3" ]]; then
              echo "::error::EN homepage recovery failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 60))
          done
          python scripts/read_and_summarize_articles.py
          python scripts/enforce_brief_length.py
          python scripts/remove_urgent_badge_categories.py
          python scripts/validate_brief_quality.py
          python scripts/dedupe_home_brief_stories.py
          python scripts/hide_urgent_home_labels.py
          python scripts/patch_brief_comment_source.py
          python scripts/protect_home_feed.py --validate
          python scripts/generate_permanent_briefs.py

      - name: Recover stale Hot X feed
        if: steps.watch.outputs.hot_x_stale == 'true'
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_AI_MODEL: gpt-4o-mini
        run: |
          python scripts/validate_hot_x_comments.py --backup
          python scripts/update_hot_x_2x_daily.py
          python scripts/translate_hot_x_pl.py
          python scripts/validate_hot_x_comments.py --validate --require-fresh-posts
          python scripts/patch_hot_x_loader.py

      - name: Recheck content health after recovery
        run: |
          python scripts/content_update_watchdog.py
          python scripts/validate_news_home_publish.py --lang pl --max-age-minutes 360
          python scripts/validate_news_home_publish.py --lang en --max-age-minutes 360

      - name: Commit watchdog repairs and recovered content
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main
          if ! git diff --quiet HEAD..origin/main -- .github/workflows/content-update-watchdog.yml .github/workflows/build-home-brief.yml config/workflow_templates/build-home-brief.yml data/content_update_contract.json scripts/content_update_watchdog.py scripts/build_home_brief_pl.py scripts/build_home_brief_en.py scripts/read_and_summarize_articles.py scripts/comment_quality.py scripts/enforce_brief_length.py scripts/remove_urgent_badge_categories.py scripts/validate_brief_quality.py scripts/dedupe_home_brief_stories.py scripts/hide_urgent_home_labels.py scripts/patch_brief_comment_source.py scripts/protect_home_feed.py scripts/generate_permanent_briefs.py scripts/home-briefs.js tests/test_comment_quality.py tests/test_permanent_briefs.py tests/test_homepage_static.py tests/test_home_briefs.js; then
            echo "::error::Recovery code changed during watchdog run; refusing stale output."
            exit 1
          fi
          git add .github/workflows/build-home-brief.yml .github/workflows/hot-x-topics.yml data/content_update_health.json data/hot_tweets.json pl/home_brief.json en/home_brief.json pl/index.html en/index.html pl/brief.html en/brief.html pl/briefy en/briefs data/permanent_briefs_pl.json data/permanent_briefs_en.json sitemap.xml .cache
          if git diff --cached --quiet; then
            echo "No watchdog changes to commit."
          else
            git commit -m "Repair content update availability"
            for attempt in 1 2 3; do
              git pull --rebase -X ours origin main
              if git push; then exit 0; fi
              sleep $((attempt * 30))
            done
            echo "::error::Could not push watchdog repair after 3 attempts"
            exit 1
          fi

  alarm:
    needs: watchdog
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create or update content publication alarm
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[ALARM] BriefRooms content publication failed";
            const body = [
              "The independent content watchdog could not restore a valid PL/EN publication.",
              "",
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: ${context.sha}`,
              "",
              "The run is red by design: stale or incomplete content was not silently accepted."
            ].join("\n");
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

  resolve-alarm:
    needs: watchdog
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Close resolved content publication alarm
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[ALARM] BriefRooms content publication failed";
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Resolved automatically by successful watchdog run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed"
              });
            }
