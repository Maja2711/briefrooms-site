name: Stock Trading v2 Closed Learning Loop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock-trading-v2-learning-loop.yml"
  schedule:
    # After both GPW and US regular sessions on weekdays. The loop is daily;
    # discovery itself runs continuously during sessions.
    - cron: "25 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: stock-trading-v2-research-writer
  cancel-in-progress: false

jobs:
  validate_push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate learning code without settling or writing evidence
        run: python -B -m unittest tests.test_stock_trading_v2_cash_edge_learning tests.test_stock_trading_v2_learning_health

  learn:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out Stock Trading v2 with production history available
        id: research_checkout
        uses: actions/checkout@v4
        with:
          ref: stock-trading-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read current production snapshots from main without merging main
        run: |
          set -euo pipefail
          git fetch origin main
          mkdir -p /tmp/stock-trading-v2-production
          for path in \
            data/investments/gpw_daily_pick.json \
            data/investments/us_daily_stock.json \
            data/investments/stock_trading_portfolio.json \
            data/investments/stock_trading_policy.json \
            data/investments/stock_trading_component_trials.json \
            data/investments/stock_trading_v2_production_config.json \
            data/investments/gpw_daily_pick_config.json \
            data/investments/stock_trading_champion_manifest.json; do
              if git cat-file -e "origin/main:$path" 2>/dev/null; then
                git show "origin/main:$path" > "/tmp/stock-trading-v2-production/$(basename "$path")"
              fi
          done
          test -f /tmp/stock-trading-v2-production/stock_trading_champion_manifest.json
          test -f /tmp/stock-trading-v2-production/gpw_daily_pick_config.json
          test -f /tmp/stock-trading-v2-production/stock_trading_policy.json
          if [[ ! -f /tmp/stock-trading-v2-production/stock_trading_component_trials.json ]]; then
            printf '{"schema_version":"stock-trading-component-trials-v1","trials":{}}\n' > /tmp/stock-trading-v2-production/stock_trading_component_trials.json
          fi
          # Read data only from the pinned main commit. Never execute research-supplied code as main.
          mkdir -p /tmp/stock-trading-v2-native-inputs
          if git cat-file -e origin/main:data/investments/stock_trading_v2_production_replay_frames 2>/dev/null; then
            git archive origin/main data/investments/stock_trading_v2_production_replay_frames | tar -x -C /tmp/stock-trading-v2-native-inputs
          fi
          ls -la /tmp/stock-trading-v2-production

      - name: Verify v2 learning machinery before mutation
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/briefrooms_market_relationship_outcomes.py \
            scripts/briefrooms_trigger_deep_belief.py \
            scripts/briefrooms_trigger_deep_belief_learning.py \
            scripts/stock_trading_v2_challenger_factory.py \
            scripts/stock_trading_v2_exact_replay.py \
            scripts/stock_trading_v2_replay_tournament.py \
            scripts/stock_trading_v2_exact_challenger_eval.py \
            scripts/test_stock_trading_v2_challenger_factory.py
          python scripts/test_stock_trading_v2_challenger_factory.py
          python -m unittest \
            tests.test_briefrooms_market_relationship_outcomes \
            tests.test_briefrooms_trigger_deep_belief \
            tests.test_briefrooms_trigger_deep_belief_learning -v

      - name: Freeze candidate and canonical admission experience prospectively
        run: |
          set -euo pipefail
          ingest_preserving_freeze() {
            local market="$1"
            local payload="$2"
            local log
            log=$(mktemp)
            if python scripts/stock_trading_v2_experience_store.py --market "$market" --payload "$payload" >"$log" 2>&1; then
              cat "$log"
              rm -f "$log"
              return 0
            fi
            cat "$log"
            if grep -Fq "legacy freeze/source payload hash mismatch" "$log"; then
              echo "ANTI_HINDSIGHT_PRESERVE: $market source changed after an immutable freeze; preserving frozen experience and continuing."
              rm -f "$log"
              return 0
            fi
            rm -f "$log"
            return 1
          }
          if [[ -f /tmp/stock-trading-v2-production/gpw_daily_pick.json ]]; then
            ingest_preserving_freeze GPW /tmp/stock-trading-v2-production/gpw_daily_pick.json
          fi
          if [[ -f /tmp/stock-trading-v2-production/us_daily_stock.json ]]; then
            ingest_preserving_freeze US /tmp/stock-trading-v2-production/us_daily_stock.json
          fi
          POLICY_ARG=""
          if [[ -f /tmp/stock-trading-v2-production/stock_trading_policy.json ]]; then
            POLICY_ARG="--policy /tmp/stock-trading-v2-production/stock_trading_policy.json"
          fi
          # shellcheck disable=SC2086
          python scripts/stock_trading_v2_admission_ledger.py $POLICY_ARG

      - name: Freeze actual HOLD and EXIT portfolio-management decisions
        run: |
          set -euo pipefail
          if [[ -f /tmp/stock-trading-v2-production/stock_trading_portfolio.json ]]; then
            python scripts/stock_trading_v2_position_experience.py \
              --state /tmp/stock-trading-v2-production/stock_trading_portfolio.json
          else
            echo "No production portfolio state available; skipping position-experience ingest."
          fi

      - name: Freeze registered cohorts before settlement
        run: |
          python scripts/stock_trading_v2_exact_challenger_eval.py \
            --challengers data/investments/stock_trading_v2_challengers \
            --experience-root data/investments/stock_trading_v2_experience \
            --admission-root data/investments/stock_trading_v2_admission \
            --outcome-root data/investments/stock_trading_v2_outcomes \
            --output-root data/investments/stock_trading_v2_challenger_evaluations \
            --trial-receipts /tmp/stock-trading-v2-production/stock_trading_component_trials.json \
            --replay-frame-root /tmp/stock-trading-v2-native-inputs/data/investments/stock_trading_v2_production_replay_frames \
            --freeze-cohorts-only

      - name: Settle matured multi-horizon actual and counterfactual outcomes
        run: |
          set -euo pipefail
          python scripts/stock_trading_v2_outcome_replay.py
          python scripts/stock_trading_v2_outcome_replay.py --verify

      - name: Settle matured relationship-trigger follow-through
        run: |
          set -euo pipefail
          python scripts/briefrooms_market_relationship_outcomes.py \
            --history-root data/investments/market_relationship_trigger_history \
            --outcome-root data/investments/market_relationship_trigger_outcomes \
            --report data/investments/market_relationship_trigger_learning.json
          python scripts/briefrooms_market_relationship_outcomes.py \
            --outcome-root data/investments/market_relationship_trigger_outcomes \
            --report data/investments/market_relationship_trigger_learning.json \
            --verify

      - name: Join targeted deep research to prospective Trigger outcomes
        run: |
          set -euo pipefail
          python scripts/briefrooms_trigger_deep_belief_learning.py \
            --research-root data/investments/market_relationship_deep_belief_history \
            --outcome-root data/investments/market_relationship_trigger_outcomes \
            --report data/investments/market_relationship_deep_belief_learning.json
          python scripts/briefrooms_trigger_deep_belief_learning.py \
            --report data/investments/market_relationship_deep_belief_learning.json \
            --verify

      - name: Measure opportunity regret and gate attribution
        run: |
          set -euo pipefail
          python scripts/stock_trading_v2_regret_engine.py
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.stock_trading_v2_regret_engine import validate_report
          path=Path('data/investments/stock_trading_v2_learning/regret_report.json')
          payload=json.loads(path.read_text(encoding='utf-8'))
          validate_report(payload)
          print('REGRET_REPORT_OK', len(payload.get('gate_attribution') or {}), len(payload.get('challenger_hypotheses') or []))
          PY

      - name: Build exact Challenger artifacts and run Replay Tournament
        run: |
          set -euo pipefail
          # Preserve the legacy semantic learner for research continuity. Only
          # exact Factory winners can become automatically deployable.
          python scripts/stock_trading_v2_policy_learner.py
          python scripts/stock_trading_v2_challenger_factory.py \
            --report data/investments/stock_trading_v2_learning/regret_report.json \
            --manifest /tmp/stock-trading-v2-production/stock_trading_champion_manifest.json \
            --gpw-config /tmp/stock-trading-v2-production/gpw_daily_pick_config.json \
            --policy /tmp/stock-trading-v2-production/stock_trading_policy.json
          python scripts/stock_trading_v2_challenger_factory.py \
            --report data/investments/stock_trading_v2_learning/regret_report.json \
            --manifest /tmp/stock-trading-v2-production/stock_trading_champion_manifest.json \
            --gpw-config /tmp/stock-trading-v2-production/gpw_daily_pick_config.json \
            --policy /tmp/stock-trading-v2-production/stock_trading_policy.json \
            --verify
          python scripts/stock_trading_v2_replay_tournament.py \
            --experience-root data/investments/stock_trading_v2_experience \
            --admission-root data/investments/stock_trading_v2_admission \
            --outcome-root data/investments/stock_trading_v2_outcomes \
            --promotion-config data/investments/statistical_promotion_gate_v2_config.json \
            --replay-frame-root /tmp/stock-trading-v2-native-inputs/data/investments/stock_trading_v2_production_replay_frames \
            --challengers data/investments/stock_trading_v2_challengers

      - name: Evaluate fresh holdouts and cryptographically bind exact artifacts
        run: |
          set -euo pipefail
          python scripts/stock_trading_v2_policy_learner.py --verify
          python scripts/briefrooms_market_relationship_outcomes.py \
            --outcome-root data/investments/market_relationship_trigger_outcomes \
            --report data/investments/market_relationship_trigger_learning.json \
            --verify
          python scripts/briefrooms_trigger_deep_belief_learning.py \
            --report data/investments/market_relationship_deep_belief_learning.json \
            --verify
          python scripts/stock_trading_v2_challenger_eval.py
          python scripts/stock_trading_v2_exact_challenger_eval.py \
            --challengers data/investments/stock_trading_v2_challengers \
            --experience-root data/investments/stock_trading_v2_experience \
            --admission-root data/investments/stock_trading_v2_admission \
            --outcome-root data/investments/stock_trading_v2_outcomes \
            --replay-frame-root /tmp/stock-trading-v2-native-inputs/data/investments/stock_trading_v2_production_replay_frames \
            --trial-receipts /tmp/stock-trading-v2-production/stock_trading_component_trials.json \
            --output-root data/investments/stock_trading_v2_challenger_evaluations

      - name: Verify all immutable stores
        run: |
          set -euo pipefail
          python scripts/stock_trading_v2_experience_store.py --verify
          python scripts/stock_trading_v2_admission_ledger.py --verify
          python scripts/stock_trading_v2_position_experience.py --verify
          python scripts/stock_trading_v2_outcome_replay.py --verify
          python scripts/stock_trading_v2_policy_learner.py --verify

      - name: Verify original immutable research history bytes before persistence
        id: immutable_history
        if: always() && steps.research_checkout.outcome == 'success'
        run: |
          set -euo pipefail
          # New append-only evidence is allowed. Previously tracked decisions,
          # admissions and terminal outcomes must remain byte-identical to HEAD.
          paths=(
            data/investments/stock_trading_v2_experience
            data/investments/stock_trading_v2_admission
            data/investments/stock_trading_v2_admission_epochs
            data/investments/stock_trading_v2_admission_retrospective
            data/investments/stock_trading_v2_position_experience
            data/investments/stock_trading_v2_position_observations
            data/investments/stock_trading_v2_outcomes
          )
          if ! git diff --quiet --diff-filter=DMRTUXB HEAD -- "${paths[@]}"; then
            git diff --name-only --diff-filter=DMRTUXB HEAD -- "${paths[@]}"
            echo "IMMUTABLE_HISTORY_CHANGED: refusing research persistence."
            exit 1
          fi
          git ls-files -s -- "${paths[@]}" > /tmp/stock-trading-v2-immutable-history.txt
          echo "IMMUTABLE_HISTORY_PRESERVED"

      - name: Record separate settlement regret and evaluation watermarks even after failure
        if: always() && steps.research_checkout.outcome == 'success'
        env:
          LEARNING_JOB_STATUS: ${{ job.status }}
        run: python scripts/stock_trading_v2_learning_health.py --workflow-status "$LEARNING_JOB_STATUS"

      - name: Commit closed-loop research evidence and diagnostic progress
        id: persist_evidence
        if: always() && steps.research_checkout.outcome == 'success' && steps.immutable_history.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            data/investments/stock_trading_v2_experience \
            data/investments/stock_trading_v2_admission \
            data/investments/stock_trading_v2_admission_epochs \
            data/investments/stock_trading_v2_admission_retrospective \
            data/investments/stock_trading_v2_position_experience \
            data/investments/stock_trading_v2_position_observations \
            data/investments/stock_trading_v2_outcomes \
            data/investments/stock_trading_v2_learning \
            data/investments/stock_trading_v2_factory_candidates \
            data/investments/stock_trading_v2_tournaments \
            data/investments/stock_trading_v2_challengers \
            data/investments/stock_trading_v2_challenger_evaluations \
            data/investments/market_relationship_trigger_outcomes \
            data/investments/market_relationship_trigger_learning.json \
            data/investments/market_relationship_deep_belief_learning.json; do
              if [[ -e "$path" ]]; then
                git add "$path"
              fi
          done
          if git diff --cached --quiet; then
            echo "No new learning evidence."
            exit 0
          fi
          git commit -m "Stock Trading v2: advance exact Challenger learning loop"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin stock-trading-v2 && git push origin HEAD:stock-trading-v2; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin stock-trading-v2
            git rebase origin/stock-trading-v2
            sleep $((attempt*3))
          done
          exit 1

      - name: Record failed persistence in retained health diagnostics
        if: always() && steps.research_checkout.outcome == 'success' && steps.persist_evidence.outcome == 'failure'
        run: python scripts/stock_trading_v2_learning_health.py --workflow-status failure

      - name: Preserve learning diagnostics even when evidence cannot be pushed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-trading-v2-learning-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/investments/stock_trading_v2_learning/learning_health.json
            /tmp/stock-trading-v2-immutable-history.txt
          if-no-files-found: warn
          retention-days: 14
