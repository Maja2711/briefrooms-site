name: Update Weekly Live Prices
# NO RETROACTIVE EXECUTION

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_weekly_live_prices_fast.py"
      - "scripts/investments_weekly_v5.py"
      - "scripts/execution_price_engine.py"
      - "scripts/audit_intraday_risk_exits.py"
      - "scripts/sync_trading_push_commit.sh"
      - "scripts/no_retroactive_execution.py"
      - "scripts/verify_no_retroactive_execution.py"
      - ".github/workflows/weekly-live-prices.yml"
  schedule:
    # Dedicated fast path for Weekly Trading current-price marks.
    # Offset it from the slower Investment Room quote workflow.
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"

permissions:
  contents: write

concurrency:
  group: weekly-live-prices
  # Never create a five-minute cancellation loop. One run may finish and the
  # newest pending run will follow if GitHub Actions was temporarily delayed.
  cancel-in-progress: false

jobs:
  validate-push-handoff:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate notification handoff without executing trading
        run: |
          set -euo pipefail
          bash -n scripts/sync_trading_push_commit.sh
          python -m unittest tests.test_trading_push_handoff -v

  update-weekly-live-prices:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install WES market-data dependencies
        run: python -m pip install --disable-pip-version-check yfinance pandas numpy

      - name: Start immutable LIVE execution clock
        run: |
          echo "NO_RETROACTIVE_EXECUTION=1" >> "$GITHUB_ENV"
          echo "NO_RETROACTIVE_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Atomic WES price ENTRY SL TP
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_weekly_live_prices_fast.py scripts/investments_weekly_v5.py scripts/audit_intraday_risk_exits.py
          python scripts/update_weekly_live_prices_fast.py
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          report=Path("data/investments/multi_instrument_exposure_report_v5.json")
          data=json.loads(report.read_text(encoding="utf-8"))
          checked=datetime.fromisoformat(str(data["checked_at"]).replace("Z","+00:00"))
          started=datetime.fromisoformat(os.environ["NO_RETROACTIVE_RUN_STARTED_AT"].replace("Z","+00:00"))
          if checked.astimezone(timezone.utc) < started:
              raise SystemExit(f"WES_FAIL stale report: {checked.isoformat()} < {started.isoformat()}")
          print("WES_EXECUTOR_FRESH", checked.isoformat())
          PY

      - name: Persist atomic WES execution
        id: atomic_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "changed=false" >> "$GITHUB_OUTPUT"
          git add data/investments/live_prices.json data/investments/weekly data/investments/intraday_risk_audit.json data/investments/multi_instrument_exposure_report_v5.json data/investments/multi_instrument_exposure_state_v5.json data/notifications/wes-event-outbox.json
          if ! git diff --cached --quiet; then
            python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
            git commit -m "Execute WES live ENTRY SL TP"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # The atomic stage can commit the full SL/TP outbox already. The later
      # price-only commit may then be a no-op; never gate lifecycle push on it.
      - name: Dispatch atomic WES lifecycle transition to Web Push
        if: steps.atomic_commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_API: https://briefrooms-trading-push.szczerbinski0577.workers.dev
        run: bash scripts/sync_trading_push_commit.sh "${{ steps.atomic_commit.outputs.sha }}" weekly

      - name: Validate Weekly live-price snapshot
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/investments/live_prices.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          expected = {"eurusd", "sp500_futures", "btcusd"}
          prices = data.get("prices") or {}
          missing = sorted(expected - set(prices))
          if missing:
              raise SystemExit(f"Missing instruments: {', '.join(missing)}")

          valid = []
          fresh = []
          for key in sorted(expected):
              rec = prices.get(key) or {}
              try:
                  price = float(rec.get("price"))
              except (TypeError, ValueError):
                  price = 0.0
              if price <= 0:
                  continue
              raw = rec.get("current_price_updated_at") or rec.get("timestamp")
              try:
                  stamp = datetime.fromisoformat(str(raw).replace("Z", "+00:00"))
              except Exception:
                  continue
              if stamp.tzinfo is None:
                  continue
              age = (datetime.now(timezone.utc) - stamp.astimezone(timezone.utc)).total_seconds()
              if age < -60:
                  continue
              valid.append(key)
              if rec.get("fresh") is True:
                  fresh.append(key)

          if set(valid) != expected:
              raise SystemExit(f"Invalid Weekly live prices: valid={valid}")
          if "eurusd" not in fresh:
              raise SystemExit(f"EUR/USD is not fresh in Weekly live-price snapshot: fresh={fresh}")
          print(f"Weekly live-price snapshot OK; fresh={','.join(fresh)}")
          PY

      - name: Commit Weekly live prices
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/live_prices.json data/investments/weekly data/investments/intraday_risk_audit.json data/notifications/wes-event-outbox.json
          if git diff --cached --quiet; then
            echo "No Weekly live-price or SL/TP state changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
          git commit -m "Update Weekly prices and 5m risk exits"

          for attempt in 1 2 3 4 5; do
            if git -c rebase.autoStash=true pull --rebase origin main; then
              python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD^ --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
              if git push origin HEAD:main; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            git rebase --abort || true
            echo "Push failed (${attempt}/5); retrying..."
            sleep $((attempt * 2))
          done

          echo "Unable to push Weekly live prices after 5 attempts" >&2
          exit 1

      - name: Dispatch persisted Weekly price/risk transition to Web Push immediately
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_API: https://briefrooms-trading-push.szczerbinski0577.workers.dev
        run: bash scripts/sync_trading_push_commit.sh "${{ steps.commit.outputs.sha }}" weekly
