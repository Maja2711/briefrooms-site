name: Update Weekly Live Prices
# NO RETROACTIVE EXECUTION

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_weekly_live_prices_fast.py"
      - "scripts/investments_weekly_v5.py"
      - "scripts/execution_price_engine.py"
      - "scripts/fse_intraday_fast.py"
      - "tests/test_fse_intraday_fast.py"
      - "scripts/audit_intraday_risk_exits.py"
      - "scripts/sync_trading_push_commit.sh"
      - "scripts/no_retroactive_execution.py"
      - "scripts/verify_no_retroactive_execution.py"
      - ".github/workflows/weekly-live-prices.yml"
  schedule:
    # Dedicated fast path for Weekly Trading current-price marks.
    # Offset it from the slower Investment Room quote workflow.
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"

permissions:
  contents: write

concurrency:
  group: weekly-live-prices
  # Never create a five-minute cancellation loop. One run may finish and the
  # newest pending run will follow if GitHub Actions was temporarily delayed.
  cancel-in-progress: false

jobs:
  update-weekly-live-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start immutable LIVE execution clock
        run: |
          echo "NO_RETROACTIVE_EXECUTION=1" >> "$GITHUB_ENV"
          echo "NO_RETROACTIVE_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Validate clean EURUSD frontend contract
        run: |
          node --check scripts/daily-eurusd-live-price.js
          node --check scripts/daily-eurusd-spot-public.js
          node --check scripts/investments-weekly-browser-live.js
          node --check scripts/investments-weekly-public.js
          python -m unittest tests/test_weekly_browser_live_contract.py

      - name: Refresh Weekly live prices
        run: |
          python scripts/update_weekly_live_prices_fast.py
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path("data/investments/live_prices.json").read_text())["prices"]["eurusd"]
          print("EURUSD_AUDIT", json.dumps({
              "price": row.get("price"),
              "timestamp": row.get("timestamp"),
              "source": row.get("source"),
              "fresh": row.get("fresh"),
          }, ensure_ascii=False))
          PY

      - name: Execute critical WES ENTRY immediately after live price refresh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/investments_weekly_v5.py scripts/execution_price_engine.py scripts/no_retroactive_execution.py
          python scripts/investments_weekly_v5.py --mode ensure-exposure

      - name: Execute critical WES SL TP immediately after ENTRY
        run: |
          set -euo pipefail
          python -m py_compile scripts/audit_intraday_risk_exits.py
          python scripts/audit_intraday_risk_exits.py --persist-report on_close

      - name: Persist critical WES execution state before Shadow diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/live_prices.json data/investments/weekly data/investments/intraday_risk_audit.json
          if git diff --cached --quiet; then
            echo "No critical WES execution state changes"
          else
            python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
            git commit -m "Execute Weekly ENTRY SL TP from live price"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Refresh FSE intraday fast projection
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/fse_intraday_fast.py
          python -m unittest tests.test_fse_intraday_fast -v
          python scripts/fse_intraday_fast.py --root . --public data/investments/fse_intraday_public.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=json.loads(Path("data/investments/fse_intraday_public.json").read_text())
          assert p["mode"]=="SHADOW_ONLY"
          assert p["production_impact"] is False
          assert p["cadence_minutes"]==5
          assert all(v is False for v in p["authority"].values())
          age=(datetime.now(timezone.utc)-datetime.fromisoformat(p["generated_at"].replace("Z","+00:00"))).total_seconds()
          if age < -60 or age > 8*60:
              raise SystemExit(f"FSE fast projection stale at publication: age={age:.0f}s")
          print("FSE_INTRADAY_FAST_PASS")
          PY

      - name: Execute pending Weekly ENTRY from fresh 5-minute market evidence
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/investments_weekly_v5.py scripts/execution_price_engine.py scripts/no_retroactive_execution.py
          python -m unittest tests.test_execution_price_engine -v
          python scripts/investments_weekly_v5.py --mode ensure-exposure
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path("data/investments/weekly").glob("*.json"), reverse=True)
          if not files:
              raise SystemExit("No Weekly state file after ENTRY execution")
          week=json.loads(files[0].read_text(encoding="utf-8"))
          for item in week.get("instruments") or []:
              pending=item.get("pending_entry_decision")
              if item.get("trade_status") == "pending" and isinstance(pending, dict):
                  plan=pending.get("entry_price_plan") or {}
                  print("WES_PENDING_ENTRY", item.get("instrument_id"), plan.get("execution_mode"), plan.get("target_price"), plan.get("expires_at"))
              elif item.get("trade_status") == "open":
                  print("WES_OPEN", item.get("instrument_id"), item.get("direction"), item.get("entry_price"), item.get("entry_captured_at"))
          PY

      - name: Monitor frozen Weekly SL/TP from 5-minute OHLC
        run: |
          set -euo pipefail
          python -m py_compile scripts/audit_intraday_risk_exits.py
          python scripts/audit_intraday_risk_exits.py --persist-report on_close

      - name: Validate Weekly live-price snapshot
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/investments/live_prices.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          expected = {"eurusd", "sp500_futures", "btcusd"}
          prices = data.get("prices") or {}
          missing = sorted(expected - set(prices))
          if missing:
              raise SystemExit(f"Missing instruments: {', '.join(missing)}")

          valid = []
          fresh = []
          for key in sorted(expected):
              rec = prices.get(key) or {}
              try:
                  price = float(rec.get("price"))
              except (TypeError, ValueError):
                  price = 0.0
              if price <= 0:
                  continue
              raw = rec.get("current_price_updated_at") or rec.get("timestamp")
              try:
                  stamp = datetime.fromisoformat(str(raw).replace("Z", "+00:00"))
              except Exception:
                  continue
              if stamp.tzinfo is None:
                  continue
              age = (datetime.now(timezone.utc) - stamp.astimezone(timezone.utc)).total_seconds()
              if age < -60:
                  continue
              valid.append(key)
              if rec.get("fresh") is True:
                  fresh.append(key)

          if set(valid) != expected:
              raise SystemExit(f"Invalid Weekly live prices: valid={valid}")
          if "eurusd" not in fresh:
              raise SystemExit(f"EUR/USD is not fresh in Weekly live-price snapshot: fresh={fresh}")
          print(f"Weekly live-price snapshot OK; fresh={','.join(fresh)}")
          PY

      - name: Commit Weekly live prices
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/live_prices.json data/investments/weekly data/investments/intraday_risk_audit.json data/investments/fse_intraday_public.json
          if git diff --cached --quiet; then
            echo "No Weekly live-price, FSE fast, or SL/TP state changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
          git commit -m "Update Weekly prices, FSE fast view and 5m risk exits"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main; then
              python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD^ --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
              if git push origin HEAD:main; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            git rebase --abort || true
            echo "Push failed (${attempt}/5); retrying..."
            sleep $((attempt * 2))
          done

          echo "Unable to push Weekly live prices after 5 attempts" >&2
          exit 1

      - name: Dispatch persisted Weekly price/risk transition to Web Push immediately
        if: steps.commit.outputs.changed == 'true'
        env:
          PUSH_API: https://briefrooms-trading-push.szczerbinski0577.workers.dev
        run: bash scripts/sync_trading_push_commit.sh "${{ steps.commit.outputs.sha }}" weekly
