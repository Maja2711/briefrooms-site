name: AI Tournament UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-tournament-ui.yml"
      - "scripts/ai-tournament-public.js"
      - "scripts/ai-tournament-readiness.js"
      - "scripts/ai-tournament-company-profiles.js"
      - "scripts/install_ai_tournament_ui.py"
      - "tests/test_ai_tournament_ui.py"
      - "data/ai_tournament/company_profiles.json"
      - "data/ai_tournament/config.json"

permissions:
  contents: write

concurrency:
  group: ai-tournament-ui
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate tournament UI and company profiles
        run: |
          set -euo pipefail
          node --check scripts/ai-tournament-public.js
          node --check scripts/ai-tournament-readiness.js
          node --check scripts/ai-tournament-company-profiles.js
          python -m unittest tests.test_ai_tournament_ui -v
          python -m py_compile scripts/install_ai_tournament_ui.py
          grep -F '<details class="aitx-thesis">' scripts/ai-tournament-public.js
          grep -F 'role="dialog" aria-modal="true"' scripts/ai-tournament-company-profiles.js
          grep -F 'MutationObserver' scripts/ai-tournament-company-profiles.js
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('data/ai_tournament/config.json').read_text(encoding='utf-8'))
          profiles = json.loads(Path('data/ai_tournament/company_profiles.json').read_text(encoding='utf-8'))
          assert profiles['schema_version'] == 'ai-tournament-company-profiles-v1'
          assert set(profiles['profiles']) == set(config['universe'])
          assert len(profiles['profiles']) == 55
          print('All 55 tournament tickers have bilingual company profiles.')
          PY

      - name: Install v5 and company profiles on PL and EN pages
        run: |
          set -euo pipefail
          python scripts/install_ai_tournament_ui.py
          for page in pl/inwestycje/portfel-10k.html en/investing/portfolio-10k.html; do
            grep -q 'ai-tournament-public.js?v=5' "$page"
            grep -q 'ai-tournament-readiness.js?v=5' "$page"
            grep -q 'ai-tournament-company-profiles.js?v=1' "$page"
          done

      - name: Commit installed pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pl/inwestycje/portfel-10k.html en/investing/portfolio-10k.html
          if git diff --cached --quiet; then
            echo "AI Tournament UI v5 already installed."
          else
            git commit -m "Deploy AI Tournament company profile popups"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                break
              fi
              if [[ "$attempt" == "5" ]]; then
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi

      - name: Verify public PL and EN pages and profile data
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          pages = {
              'pl': 'https://briefrooms.com/pl/inwestycje/portfel-10k.html',
              'en': 'https://briefrooms.com/en/investing/portfolio-10k.html',
          }
          assets = {
              'renderer': 'https://briefrooms.com/scripts/ai-tournament-public.js',
              'profiles_script': 'https://briefrooms.com/scripts/ai-tournament-company-profiles.js',
              'profiles_data': 'https://briefrooms.com/data/ai_tournament/company_profiles.json',
          }
          headers = {
              'User-Agent': 'BriefRooms AI Tournament UI verifier/2.0',
              'Cache-Control': 'no-cache',
          }
          passed = False
          observed = {}
          last_errors = []

          for attempt in range(1, 31):
              token = f'{int(time.time())}-{attempt}'
              errors = []
              observed = {'attempt': attempt}

              for language, url in pages.items():
                  try:
                      request = urllib.request.Request(f'{url}?aitprofiles={token}', headers=headers)
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = response.read().decode('utf-8', errors='replace')
                      required = (
                          'ai-tournament-public.js?v=5',
                          'ai-tournament-readiness.js?v=5',
                          'ai-tournament-company-profiles.js?v=1',
                      )
                      found = all(item in body for item in required)
                      observed[f'{language}_assets'] = found
                      if not found:
                          errors.append(f'{language} page still uses older tournament assets')
                  except Exception as exc:
                      errors.append(f'{language}: {exc}')

              try:
                  request = urllib.request.Request(f"{assets['renderer']}?v=5&verify={token}", headers=headers)
                  with urllib.request.urlopen(request, timeout=20) as response:
                      script = response.read().decode('utf-8', errors='replace')
                  markers = '<details class="aitx-thesis">' in script and 'class="aitx-overview"' in script
                  observed['redesign_markers'] = markers
                  if not markers:
                      errors.append('public renderer does not contain redesign markers')
              except Exception as exc:
                  errors.append(f'renderer: {exc}')

              try:
                  request = urllib.request.Request(f"{assets['profiles_script']}?v=1&verify={token}", headers=headers)
                  with urllib.request.urlopen(request, timeout=20) as response:
                      profile_script = response.read().decode('utf-8', errors='replace')
                  markers = (
                      'ait-company-modal' in profile_script and
                      'MutationObserver' in profile_script and
                      "event.key === 'Escape'" in profile_script
                  )
                  observed['profile_script_markers'] = markers
                  if not markers:
                      errors.append('public company profile script is incomplete')
              except Exception as exc:
                  errors.append(f'profiles script: {exc}')

              try:
                  request = urllib.request.Request(f"{assets['profiles_data']}?verify={token}", headers=headers)
                  with urllib.request.urlopen(request, timeout=20) as response:
                      profile_data = json.loads(response.read().decode('utf-8'))
                  count = len(profile_data.get('profiles') or {})
                  schema_ok = profile_data.get('schema_version') == 'ai-tournament-company-profiles-v1'
                  observed['profile_count'] = count
                  observed['profile_schema'] = schema_ok
                  if count != 55 or not schema_ok:
                      errors.append(f'public profile data invalid: count={count}, schema={schema_ok}')
              except Exception as exc:
                  errors.append(f'profiles data: {exc}')

              if not errors:
                  passed = True
                  last_errors = []
                  break
              last_errors = errors
              time.sleep(10)

          status = {
              'schema_version': 'ai-tournament-ui-status-v2',
              'status': 'passed' if passed else 'failed',
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'renderer_version': '5',
              'company_profiles_version': '1',
              'observed': observed,
              'errors': last_errors,
          }
          path = Path('data/ai_tournament/ui_production_status.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(status, ensure_ascii=False))
          if not passed:
              raise SystemExit('AI Tournament company profile verification failed')
          PY

      - name: Commit production verification
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai_tournament/ui_production_status.json
          if git diff --cached --quiet; then
            echo "Production verification unchanged."
          else
            git commit -m "Verify AI Tournament company profiles on production"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
