name: AI Tournament UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-tournament-ui.yml"
      - "scripts/ai-tournament-public.js"
      - "scripts/ai-tournament-readiness.js"
      - "scripts/ai-tournament-company-profiles.js"
      - "scripts/ai-tournament-summary.js"
      - "scripts/install_ai_tournament_ui.py"
      - "tests/test_ai_tournament_ui.py"
      - "data/ai_tournament/company_profiles.json"
      - "data/ai_tournament/config.json"

permissions:
  contents: write

concurrency:
  group: ai-tournament-ui
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate tournament UI
        run: |
          set -euo pipefail
          node --check scripts/ai-tournament-public.js
          node --check scripts/ai-tournament-readiness.js
          node --check scripts/ai-tournament-company-profiles.js
          node --check scripts/ai-tournament-summary.js
          python -m unittest tests.test_ai_tournament_ui -v
          python -m py_compile scripts/install_ai_tournament_ui.py
          python - <<'PY'
          import json
          from pathlib import Path

          renderer = Path('scripts/ai-tournament-public.js').read_text(encoding='utf-8')
          profiles_script = Path('scripts/ai-tournament-company-profiles.js').read_text(encoding='utf-8')
          summary_script = Path('scripts/ai-tournament-summary.js').read_text(encoding='utf-8')
          config = json.loads(Path('data/ai_tournament/config.json').read_text(encoding='utf-8'))
          profiles = json.loads(Path('data/ai_tournament/company_profiles.json').read_text(encoding='utf-8'))

          assert '<details class="aitx-thesis">' in renderer
          assert 'role="dialog" aria-modal="true"' in profiles_script
          assert 'MutationObserver' in profiles_script
          assert 'Najważniejsze liczby bez powtarzania rankingu' in summary_script
          assert summary_script.count('class="ait-summary-stat"') == 4
          assert profiles['schema_version'] == 'ai-tournament-company-profiles-v1'
          assert set(profiles['profiles']) == set(config['universe'])
          assert len(profiles['profiles']) == 55
          print('Tournament redesign, company profiles and distinct summary statistics are valid.')
          PY

      - name: Install UI assets on PL and EN pages
        run: |
          set -euo pipefail
          python scripts/install_ai_tournament_ui.py
          python - <<'PY'
          from pathlib import Path

          required = (
              'ai-tournament-public.js?v=5',
              'ai-tournament-readiness.js?v=5',
              'ai-tournament-company-profiles.js?v=1',
              'ai-tournament-summary.js?v=1',
          )
          for path in (
              Path('pl/inwestycje/portfel-10k.html'),
              Path('en/investing/portfolio-10k.html'),
          ):
              body = path.read_text(encoding='utf-8')
              for asset in required:
                  assert asset in body, f'{asset} missing in {path}'
          print('PL and EN pages load all tournament UI assets.')
          PY

      - name: Commit installed pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pl/inwestycje/portfel-10k.html en/investing/portfolio-10k.html
          if git diff --cached --quiet; then
            echo "AI Tournament UI assets already installed."
          else
            git commit -m "Deploy distinct AI Tournament summary statistics"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                break
              fi
              if [[ "$attempt" == "5" ]]; then
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi

      - name: Verify production
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          pages = {
              'pl': 'https://briefrooms.com/pl/inwestycje/portfel-10k.html',
              'en': 'https://briefrooms.com/en/investing/portfolio-10k.html',
          }
          assets = {
              'renderer': 'https://briefrooms.com/scripts/ai-tournament-public.js',
              'profiles': 'https://briefrooms.com/scripts/ai-tournament-company-profiles.js',
              'summary': 'https://briefrooms.com/scripts/ai-tournament-summary.js',
              'profile_data': 'https://briefrooms.com/data/ai_tournament/company_profiles.json',
          }
          headers = {
              'User-Agent': 'BriefRooms AI Tournament UI verifier/3.0',
              'Cache-Control': 'no-cache',
          }
          passed = False
          observed = {}
          last_errors = []

          for attempt in range(1, 31):
              token = f'{int(time.time())}-{attempt}'
              errors = []
              observed = {'attempt': attempt}

              for language, url in pages.items():
                  try:
                      request = urllib.request.Request(f'{url}?aitsummary={token}', headers=headers)
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = response.read().decode('utf-8', errors='replace')
                      required = (
                          'ai-tournament-public.js?v=5',
                          'ai-tournament-readiness.js?v=5',
                          'ai-tournament-company-profiles.js?v=1',
                          'ai-tournament-summary.js?v=1',
                      )
                      found = all(item in body for item in required)
                      observed[f'{language}_assets'] = found
                      if not found:
                          errors.append(f'{language} page still uses older tournament assets')
                  except Exception as exc:
                      errors.append(f'{language}: {exc}')

              checks = {
                  'renderer': ('<details class="aitx-thesis">', 'class="aitx-overview"'),
                  'profiles': ('ait-company-modal', 'MutationObserver', "event.key === 'Escape'"),
                  'summary': ('ait-summary-grid', 'Lead over second', 'Average return', 'Best-to-worst spread'),
              }
              for key, markers in checks.items():
                  try:
                      request = urllib.request.Request(f"{assets[key]}?verify={token}", headers=headers)
                      with urllib.request.urlopen(request, timeout=20) as response:
                          script = response.read().decode('utf-8', errors='replace')
                      ok = all(marker in script for marker in markers)
                      observed[f'{key}_markers'] = ok
                      if not ok:
                          errors.append(f'{key} script is incomplete')
                  except Exception as exc:
                      errors.append(f'{key}: {exc}')

              try:
                  request = urllib.request.Request(f"{assets['profile_data']}?verify={token}", headers=headers)
                  with urllib.request.urlopen(request, timeout=20) as response:
                      profile_data = json.loads(response.read().decode('utf-8'))
                  count = len(profile_data.get('profiles') or {})
                  schema_ok = profile_data.get('schema_version') == 'ai-tournament-company-profiles-v1'
                  observed['profile_count'] = count
                  observed['profile_schema'] = schema_ok
                  if count != 55 or not schema_ok:
                      errors.append(f'profile data invalid: count={count}, schema={schema_ok}')
              except Exception as exc:
                  errors.append(f'profile data: {exc}')

              if not errors:
                  passed = True
                  last_errors = []
                  break
              last_errors = errors
              time.sleep(10)

          status = {
              'schema_version': 'ai-tournament-ui-status-v3',
              'status': 'passed' if passed else 'failed',
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'renderer_version': '5',
              'company_profiles_version': '1',
              'summary_version': '1',
              'observed': observed,
              'errors': last_errors,
          }
          path = Path('data/ai_tournament/ui_production_status.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(status, ensure_ascii=False))
          if not passed:
              raise SystemExit('AI Tournament UI production verification failed')
          PY

      - name: Commit production verification
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai_tournament/ui_production_status.json
          if git diff --cached --quiet; then
            echo "Production verification unchanged."
          else
            git commit -m "Verify distinct AI Tournament summary on production"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
