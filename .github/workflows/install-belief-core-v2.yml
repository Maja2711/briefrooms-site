name: Install Belief Core v2

on:
  push:
    branches:
      - agent/belief-core-v2
    paths:
      - ".github/workflows/install-belief-core-v2.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/belief-core-v2
          fetch-depth: 0
      - name: Install Belief Core v2 files
        run: |
          printf '%s' '' | base64 -d > /tmp/belief-core-v2.tgz
          tar -xzf /tmp/belief-core-v2.tgz -C .
      - name: Validate v2
        run: |
          python -m py_compile scripts/belief_core.py scripts/belief_core_v2.py scripts/belief_core_shadow.py scripts/belief_core_verify.py
          python -m unittest discover -s tests -p 'test_belief_core.py' -v
      - name: Commit v2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/belief_core.py scripts/belief_core_v2.py scripts/belief_core_shadow.py scripts/belief_core_verify.py tests/test_belief_core.py docs/BELIEF_CORE.md .github/workflows/belief-core-tests.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build Belief Core v2 calibration engine"
          git push origin HEAD:agent/belief-core-v2
