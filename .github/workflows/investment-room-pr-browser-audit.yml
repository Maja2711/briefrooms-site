name: Investment Room Controlled Browser Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "data/investments/browser_audit_trigger.txt"
      - "pl/inwestycje/portfel-10k.html"
      - "en/investing/portfolio-10k.html"
      - "scripts/portfolio-10k-*.js"
      - "scripts/ai-tournament-*.js"
      - "scripts/site-header.js"
      - "scripts/audit_investment_rooms_probe.py"
      - ".github/workflows/investment-room-pr-browser-audit.yml"

permissions:
  contents: read

concurrency:
  group: investment-room-controlled-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audited browser
        run: |
          python -m pip install --upgrade pip playwright==1.54.0
          python -m playwright install --with-deps chromium
      - name: Start current PR site locally
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/briefrooms-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/pl/inwestycje/portfel-10k.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/briefrooms-http.log
          exit 1
      - name: Probe every PL and EN investment option
        id: audit
        continue-on-error: true
        run: timeout 90s python -u scripts/audit_investment_rooms_probe.py
      - name: Print complete report
        if: always()
        run: cat data/portfolio10k/investment_room_full_audit.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investment-room-controlled-browser-audit
          path: data/portfolio10k/investment_room_full_audit.json
          if-no-files-found: error
      - name: Require every option to pass
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/portfolio10k/investment_room_full_audit.json').read_text(encoding='utf-8'))
          if not report.get('passed'):
              raise SystemExit('Controlled investment room browser audit failed')
          print('Both languages and all 18 views passed')
          PY
