name: LAB Observatory Freshness Watch

on:
  workflow_dispatch:
  schedule:
    # Independent read-only heartbeat; does not depend on Observatory runs.
    - cron: "13,43 * * * *"

permissions:
  contents: read

jobs:
  snapshot-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Alert on stale or missing LAB snapshot
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          source=Path("data/investments/shadow_engines_public.json")
          if not source.is_file():
              raise SystemExit("LAB_OBSERVATORY_MISSING: Shadow snapshot file does not exist")
          payload=json.loads(source.read_text(encoding="utf-8"))
          raw=payload.get("generated_at")
          if not raw:
              raise SystemExit("LAB_OBSERVATORY_STALE: no generated_at timestamp")
          try:
              generated=datetime.fromisoformat(raw.replace("Z", "+00:00"))
              if generated.tzinfo is None:
                  raise ValueError("timestamp missing timezone")
              age=(datetime.now(timezone.utc)-generated).total_seconds()/60
          except (TypeError, ValueError) as exc:
              raise SystemExit(f"LAB_OBSERVATORY_STALE: invalid timestamp: {exc}")
          print(f"LAB snapshot age: {age:.1f} min")
          if age > 90:
              raise SystemExit(f"LAB_OBSERVATORY_STALE: publication older than 90 minutes ({age:.1f} min)")
          if age < -5:
              raise SystemExit("LAB_OBSERVATORY_CLOCK_INVALID: generated_at is in the future")
          PY
