name: Audit Delayed Investment Room Navigation

on:
  push:
    branches: [main]
    paths:
      - 'data/portfolio10k/delayed-navigation-trigger.txt'

permissions:
  contents: write

concurrency:
  group: delayed-investment-room-navigation-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test delayed real clicks
        run: |
          set +e
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          from datetime import datetime, timezone
          import json, time

          pages = {
              'PL': 'https://briefrooms.com/pl/inwestycje/portfel-10k.html',
              'EN': 'https://briefrooms.com/en/investing/portfolio-10k.html',
          }
          report = {
              'schema_version': 'investment-room-delayed-navigation-v1',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'passed': False,
              'languages': {},
          }
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for lang, url in pages.items():
                  page = browser.new_page(viewport={'width': 1680, 'height': 936})
                  page_errors = []
                  page.on('pageerror', lambda exc: page_errors.append(str(exc)))
                  page.goto(f'{url}?delayed-nav={time.time()}', wait_until='domcontentloaded', timeout=30000)
                  page.wait_for_function("document.body.dataset.investmentData === 'ready'", timeout=25000)
                  page.wait_for_timeout(8000)
                  checks = []
                  targets = [
                      ('.i10k-side-nav [data-tab="agents"]', 'agents'),
                      ('.i10k-tabs [data-tab="portfolio"]', 'portfolio'),
                      ('.i10k-tabs [data-tab="benchmark"]', 'benchmark'),
                      ('.agents-wide [data-tab="agents"]', 'agents'),
                      ('.i10k-side-nav [data-tab="history"]', 'history'),
                  ]
                  for selector, expected in targets:
                      locator = page.locator(selector).first
                      box = locator.bounding_box()
                      hit = None
                      if box:
                          hit = page.evaluate("""({x,y}) => {
                            const el = document.elementFromPoint(x,y);
                            return el ? {
                              tag: el.tagName,
                              tab: el.closest('[data-tab]')?.dataset?.tab || null,
                              cls: String(el.className || '')
                            } : null;
                          }""", {'x': box['x'] + box['width']/2, 'y': box['y'] + box['height']/2})
                      click_error = None
                      try:
                          locator.click(timeout=10000)
                      except Exception as exc:
                          click_error = str(exc)
                      page.wait_for_timeout(500)
                      active = page.locator(f'.i10k-panel[data-panel="{expected}"]').first
                      checks.append({
                          'selector': selector,
                          'expected': expected,
                          'hash': page.evaluate('location.hash'),
                          'active': 'active' in (active.get_attribute('class') or '').split(),
                          'visible': active.is_visible(),
                          'hit': hit,
                          'guard': page.evaluate("document.body.dataset.investmentNavigationGuard || ''"),
                          'click_error': click_error,
                      })
                  report['languages'][lang] = {
                      'guard_script_present': page.locator('script[src*="portfolio-10k-navigation-guard.js?v=1"]').count() == 1,
                      'guard_state': page.evaluate("document.body.dataset.investmentNavigationGuard || ''"),
                      'page_errors': page_errors,
                      'checks': checks,
                  }
                  page.close()
              browser.close()

          failures = []
          for lang, result in report['languages'].items():
              if not result['guard_script_present'] or result['guard_state'] != 'active' or result['page_errors']:
                  failures.append(f'{lang}:guard')
              for check in result['checks']:
                  if check['click_error'] or not check['active'] or not check['visible'] or check['hash'] != '#'+check['expected']:
                      failures.append(f"{lang}:{check['selector']}")
          report['failures'] = failures
          report['passed'] = not failures
          Path('data/portfolio10k/delayed_navigation_report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
          exit 0
      - name: Publish audit report
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/portfolio10k/delayed_navigation_report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record delayed Investment Room navigation audit'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Require pass
        run: |
          python - <<'PY'
          import json
          data=json.load(open('data/portfolio10k/delayed_navigation_report.json',encoding='utf-8'))
          raise SystemExit(0 if data.get('passed') else 1)
          PY
