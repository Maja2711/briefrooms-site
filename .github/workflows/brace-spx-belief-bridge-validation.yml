name: BRACE-SPX Belief Bridge Validation

on:
  pull_request:
    paths:
      - "scripts/brace_spx_belief_bridge.py"
      - "tests/test_brace_spx_belief_bridge.py"
      - "docs/BRACE_SPX_BELIEF_READ_ONLY_BRIDGE.md"
      - ".github/workflows/brace-spx-belief-bridge.yml"
      - ".github/workflows/brace-spx-belief-bridge-validation.yml"

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bridge
        run: python -m py_compile scripts/brace_spx_belief_bridge.py
      - name: Run bridge tests
        run: python -m unittest tests.test_brace_spx_belief_bridge -v
      - name: Run existing Belief Core regression suite
        run: |
          python -m unittest discover -s tests -p 'test_belief_core*.py' -v
          python -m unittest tests.test_belief_geopolitical_forecast_adapter -v
      - name: Assert static safety invariants
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import brace_spx_belief_bridge as bridge
          assert bridge.MODE == 'shadow'
          assert len(bridge.SPX_BELIEF_IDS) == 5
          assert all(value is False for value in bridge.controls().values())
          print('Static shadow-only invariants: PASS')
          PY
      - name: Validate against latest production Belief and BRACE-SPX formats read-only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/belief"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=belief-core-shadow-state&per_page=100"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api" > "$RUNNER_TEMP/artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/artifacts.json" <<'PY'
          import json,sys
          from pathlib import Path
          rows=[x for x in json.loads(Path(sys.argv[1]).read_text()).get('artifacts',[]) if not x.get('expired')]
          rows.sort(key=lambda x:x.get('created_at',''), reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
          )
          test -n "$artifact_id"
          curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$RUNNER_TEMP/belief.zip"
          mkdir -p "$RUNNER_TEMP/belief-zip"
          unzip -q "$RUNNER_TEMP/belief.zip" -d "$RUNNER_TEMP/belief-zip"
          tar -xzf "$RUNNER_TEMP/belief-zip/belief-core-state.tgz" -C "$RUNNER_TEMP/belief"
          test -f "$RUNNER_TEMP/belief/state.json"

          git fetch --depth=1 origin brace-spx-research
          git show origin/brace-spx-research:data/shadow/brace_spx_generation6_shadow.json > "$RUNNER_TEMP/brace.json"

          PYTHONPATH=scripts python - "$RUNNER_TEMP/belief/state.json" "$RUNNER_TEMP/brace.json" <<'PY'
          import json,sys
          from pathlib import Path
          import brace_spx_belief_bridge as bridge
          belief=json.loads(Path(sys.argv[1]).read_text())
          brace_raw=json.loads(Path(sys.argv[2]).read_text())
          brace=bridge.brace_specialist_state(brace_raw)
          brace_at=bridge._dt((brace.get('source') or {}).get('updated_at'))
          assert (brace.get('source') or {}).get('generation_id') == bridge.GENERATION_ID
          assert brace_at is not None
          frozen=bridge.select_frozen_belief_state(belief, brace_at)
          assert frozen['reason'] in {
              'latest_complete_frozen_spx_belief_set',
              'no_complete_point_in_time_spx_belief_set',
              'belief_snapshot_too_old_at_brace_state',
              'belief_snapshot_probability_or_confidence_missing',
          }
          assert all(value is False for value in bridge.controls().values())
          print('Real BRACE-SPX:', brace['source']['status'], brace['source']['updated_at'], 'available=', brace['available'])
          print('Real point-in-time Belief selection:', frozen['reason'], 'set=', frozen.get('forecast_set_id'))
          print('Production artifact format compatibility: PASS')
          PY
