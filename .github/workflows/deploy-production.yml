name: Deploy production from main

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/system/**"
  workflow_dispatch:
  issues:
    types: [opened]
  schedule:
    - cron: "27 */2 * * *"
  workflow_run:
    # Commits pushed with GITHUB_TOKEN do not emit another push workflow event.
    # Every canonical publisher therefore requests a Pages build explicitly here.
    workflows:
      - "Publish PL and EN News"
      - "Update Hot X Topics"
      - "Daily Market Alert"
      - "AI Outlook Gemini Daily"
      - "Publish PL GPW Daily Pick"
      - "AI Tournament Daily"
      - "Refresh Portfolio 10K Hourly Prices"
      - "Open Fresh 10K Positions"
      - "Update 10K Model Portfolio"
      - "Build Governed Investments Weekly Forecasts"
      - "Governed Weekly Paper Exposure Watch"
      - "Update Investment Room Quotes"
      - "Publish EN YouTube Recommendations"
      - "Audit Automation Health"
      - "BRACE Portfolio Daily Learning"
      - "BRACE Portfolio Hourly Safety Monitor"
      - "BRACE Portfolio Research and Promotion"
      - "Bootstrap BRACE 2.0 Learning"
      - "Accelerate BRACE Historical Learning"
      - "BRACE-SPX Research Engine"
      - "BRACE-SPX Public Panel"
      - "BRACE-SPX Generation 3 Scenario Panel"
      - "BRACE-SPX Generation 4 Archive"
      - "BRACE-SPX Generation 5"
    types: [completed]

permissions:
  contents: read
  pages: write

concurrency:
  # Keep one deployment alive; the pending run checks out the newest main.
  group: briefrooms-production-pages
  cancel-in-progress: ${{ github.event_name == 'issues' }}

jobs:
  deploy-and-verify:
    if: >-
      (github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'issues' ||
      github.event.issue.title == 'Trigger BriefRooms production parity')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Validate static homepage contract
        run: |
          python -m unittest discover -s tests -p "test_homepage_static.py"
          python -m unittest tests/test_root_language_redirect.py
          python -m unittest tests/test_verify_production.py

      - name: Confirm actual Pages publishing source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            > /tmp/pages.json
          python - <<'PY'
          import json
          from pathlib import Path

          pages = json.loads(Path('/tmp/pages.json').read_text())
          source = pages.get('source') or {}
          actual = (pages.get('build_type'), source.get('branch'), source.get('path'))
          expected = ('legacy', 'main', '/')
          if actual != expected:
              raise SystemExit(
                  f'Unexpected GitHub Pages source {actual!r}; expected {expected!r}'
              )
          print('GitHub Pages source is legacy main/.')
          PY

      - name: Request build from latest main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            http_code="$(curl --silent --show-error \
              --output /tmp/pages-build.json \
              --write-out '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")"
            cat /tmp/pages-build.json || true
            case "$http_code" in
              201)
                echo 'Queued a fresh GitHub Pages build from the latest main.'
                exit 0
                ;;
              409)
                echo "Pages is busy with an older build (${attempt}/36); retrying in 10 seconds."
                sleep 10
                ;;
              *)
                echo "Unexpected Pages build response: HTTP ${http_code}" >&2
                exit 1
                ;;
            esac
          done
          echo 'Pages stayed busy; a fresh build from latest main was not queued.' >&2
          exit 1

      - name: Verify production equals current main
        shell: bash
        run: >-
          python scripts/verify_production.py
          --expected-sha "$(git rev-parse HEAD)"
          --base-url https://briefrooms.com
          --attempts 48
          --interval 10
          --timeout 20
