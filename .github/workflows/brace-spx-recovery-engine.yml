name: BRACE-SPX Research Engine

on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Number of genuinely new v2 candidates"
        required: false
        default: "36"
  schedule:
    - cron: "23 * * * *"
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: brace-spx-hourly-sealed-research
  cancel-in-progress: false

jobs:
  research:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'BRACE-SPX research')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: brace-spx-research
          fetch-depth: 0

      - name: Persist immediate start marker
        run: |
          mkdir -p data/research
          printf '{\n  "status": "started",\n  "generation_id": "spx-sealed-v2",\n  "started_at": "%s",\n  "event": "%s",\n  "run_id": "%s"\n}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.event_name }}" "${{ github.run_id }}" \
            > data/research/brace_spx_generation2_started.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/research/brace_spx_generation2_started.json
          git commit -m "Mark BRACE-SPX v2 run started"
          git fetch origin brace-spx-research
          git rebase origin/brace-spx-research
          git push origin HEAD:brace-spx-research

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies with retry
        id: install
        continue-on-error: true
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --upgrade pip numpy pandas yfinance scikit-learn pytest; then exit 0; fi
            sleep $((attempt * 30))
          done
          exit 1

      - name: Validate governance and v2 engine
        id: validate
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          python -m py_compile \
            scripts/brace_spx_research.py \
            scripts/brace_spx_generation_research.py \
            scripts/brace_spx_generation2_research.py \
            scripts/brace_spx_v1_governance_resolution.py \
            scripts/brace_spx_research_controls.py \
            scripts/brace_spx_selection_audit.py \
            scripts/brace_spx_statistical_governance.py
          python -m pytest -q \
            tests/test_brace_spx_generation_research.py \
            tests/test_brace_spx_generation2_research.py \
            tests/test_brace_spx_research_controls.py \
            tests/test_brace_spx_selection_audit.py \
            tests/test_brace_spx_statistical_governance.py
          python scripts/brace_spx_v1_governance_resolution.py

      - name: Run sealed generation 2 batch
        id: research
        if: steps.validate.outcome == 'success'
        continue-on-error: true
        env:
          BUDGET: ${{ github.event.inputs.budget || '36' }}
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if python scripts/brace_spx_generation2_research.py --start 1993-01-01 --budget "$BUDGET" 2>&1 | tee data/research/brace_spx_generation2.log; then exit 0; fi
            sleep $((attempt * 45))
          done
          exit 1

      - name: Audit generation 2 selection
        id: audit
        if: steps.research.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/brace_spx_selection_audit.py \
            --ledger data/research/brace_spx_generation2_experiments.json \
            --report data/research/brace_spx_generation2_research.json \
            --output data/research/brace_spx_generation2_selection_audit.json

      - name: Reconcile without downgrading public evidence
        id: reconcile
        if: steps.research.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/brace_spx_statistical_governance.py \
            --active-report data/research/brace_spx_generation2_research.json \
            --public-snapshot data/public/brace_spx_public.json \
            --output data/research/brace_spx_generation2_reconciliation.json

      - name: Write final status
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          RESEARCH_OUTCOME: ${{ steps.research.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          RECONCILE_OUTCOME: ${{ steps.reconcile.outcome }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path("data/research")
          report = {}
          path = root / "brace_spx_generation2_research.json"
          if path.exists():
              try: report = json.loads(path.read_text(encoding="utf-8"))
              except Exception: pass
          status = {
              "status": "finished",
              "finished_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "run_id": os.environ.get("RUN_ID"),
              "generation_id": "spx-sealed-v2",
              "stages": {
                  "install": os.environ.get("INSTALL_OUTCOME") or "not_started",
                  "validate": os.environ.get("VALIDATE_OUTCOME") or "not_started",
                  "research": os.environ.get("RESEARCH_OUTCOME") or "not_started",
                  "audit": os.environ.get("AUDIT_OUTCOME") or "not_started",
                  "reconcile": os.environ.get("RECONCILE_OUTCOME") or "not_started",
              },
              "experiments_total": report.get("experiments_total"),
              "experiments_remaining": report.get("experiments_remaining"),
              "report_generated_at": report.get("generated_at"),
          }
          (root / "brace_spx_generation2_status.json").write_text(json.dumps(status, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Snapshot generated evidence
        if: always()
        run: |
          rm -rf /tmp/brace-spx-output
          mkdir -p /tmp/brace-spx-output
          for path in \
            data/research/brace_spx_v1_governance_resolution.json \
            data/research/brace_spx_generation2_research.json \
            data/research/brace_spx_generation2_experiments.json \
            data/research/brace_spx_generation2_manifest.json \
            data/research/brace_spx_generation2_selection_audit.json \
            data/research/brace_spx_generation2_reconciliation.json \
            data/research/brace_spx_generation2_started.json \
            data/research/brace_spx_generation2_status.json \
            data/research/brace_spx_generation2.log
          do
            if [ -e "$path" ]; then cp --parents "$path" /tmp/brace-spx-output; fi
          done

      - name: Upload emergency evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brace-spx-v2-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: /tmp/brace-spx-output/data/research

      - name: Persist results conflict-safely
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin brace-spx-research
            git reset --hard origin/brace-spx-research
            if [ -d /tmp/brace-spx-output/data ]; then cp -R /tmp/brace-spx-output/data/. data/; fi
            find data/research -maxdepth 1 -type f \( -name 'brace_spx_v1_governance_resolution.json' -o -name 'brace_spx_generation2*' \) -print0 | xargs -0 -r git add -f
            if git diff --cached --quiet; then echo "No new BRACE-SPX v2 changes."; exit 0; fi
            git commit -m "Persist BRACE-SPX sealed generation 2 batch"
            if git push origin HEAD:brace-spx-research; then exit 0; fi
            sleep $((attempt * 20))
          done
          exit 1

      - name: Fail visibly on critical failure
        if: >-
          always() &&
          (steps.install.outcome != 'success' ||
           steps.validate.outcome != 'success' ||
           steps.research.outcome != 'success')
        run: exit 1
