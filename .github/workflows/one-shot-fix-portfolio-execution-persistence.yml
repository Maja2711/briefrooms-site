name: One-shot fix Portfolio 10K execution persistence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-fix-portfolio-execution-persistence.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: one-shot-fix-portfolio-execution-persistence
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Patch durable execution reconciliation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Patch anchor missing in {path}: {old[:100]!r}')
              text=text.replace(old,new,1)
              p.write_text(text,encoding='utf-8')

          path='scripts/reconcile_portfolio_10k_executions.py'
          replace_once(
              path,
              'from typing import Any\nfrom zoneinfo import ZoneInfo\n',
              'from typing import Any\nfrom zoneinfo import ZoneInfo\n\nfrom portfolio_10k_execution_ledger import authoritative_executions\n',
          )
          replace_once(
              path,
              '''def find_position(positions: list[dict[str, Any]], position_id: str) -> dict[str, Any] | None:\n    return next((p for p in positions if instrument_id(p) == position_id), None)\n\n\ndef sync_active_position(''',
              '''def find_position(positions: list[dict[str, Any]], position_id: str) -> dict[str, Any] | None:\n    return next((p for p in positions if instrument_id(p) == position_id), None)\n\n\ndef execution_reflected(\n    active_positions: list[dict[str, Any]],\n    existing_closed: dict[str, dict[str, Any]],\n    paper_active: dict[str, dict[str, Any]],\n    order: dict[str, Any],\n) -> bool:\n    """Verify that an applied marker matches the actual public holdings state."""\n    action = str(order.get("action") or "").upper()\n    sell_id = str(order.get("sell_instrument") or "").strip().lower()\n    buy_id = str(order.get("buy_instrument") or "").strip().lower()\n\n    def active_matches(position_id: str) -> bool:\n        current = find_position(active_positions, position_id)\n        paper_source = paper_active.get(position_id)\n        if current is None or paper_source is None:\n            return False\n        return abs(finite(current.get("quantity")) - finite(paper_source.get("quantity"))) <= 1e-8\n\n    if action == "ADD":\n        return bool(buy_id) and active_matches(buy_id)\n    if action == "REDUCE":\n        return bool(sell_id) and active_matches(sell_id)\n    if action == "EXIT":\n        return bool(sell_id) and find_position(active_positions, sell_id) is None and sell_id in existing_closed\n    if action == "REPLACE":\n        return (\n            bool(sell_id and buy_id)\n            and find_position(active_positions, sell_id) is None\n            and sell_id in existing_closed\n            and active_matches(buy_id)\n        )\n    return False\n\n\ndef sync_active_position(''',
          )
          replace_once(
              path,
              '''    executed = [\n        order for order in orders.get("orders", [])\n        if str(order.get("status")) == "PAPER_EXECUTED"\n        and str(order.get("action")) in SUPPORTED_ACTIONS\n    ]\n''',
              '''    executed = authoritative_executions(paper, orders)\n''',
          )
          replace_once(
              path,
              '''        if order_id and order_id in applied:\n            # Critical idempotency guarantee: never let an old execution snapshot\n            # overwrite current quotes/timestamps on subsequent hourly runs.\n            continue\n''',
              '''        if order_id and order_id in applied and execution_reflected(\n            active_positions, existing_closed, paper_active, order\n        ):\n            # Idempotency applies only when the public holdings really reflect the\n            # durable execution. A stale marker must repair, not suppress, state.\n            continue\n''',
          )
          replace_once(
              path,
              '"version": "2.2.0-idempotent-freshness-safe",',
              '"version": "3.0.0-transaction-ledger-authority",',
          )
          replace_once(
              path,
              '"source_paper_portfolio": "/data/portfolio10k/paper_portfolio.json",',
              '"source_paper_portfolio": "/data/portfolio10k/paper_portfolio.json",\n        "execution_authority": "paper_portfolio.transactions",\n        "queue_role": "paper_orders_fallback_only",',
          )

          path='scripts/brace_portfolio_execution.py'
          replace_once(
              path,
              '''                "asset_type": meta.get("asset_type"),\n                    "status": "paper_active",\n                    "quantity": round(quantity, 8),''',
              '''                "asset_type": meta.get("asset_type"),\n                    "status": "paper_active",\n                    "target_weight": round(target_weight, 8),\n                    "quantity": round(quantity, 8),''',
          )
          replace_once(
              path,
              '''        if position:\n            position["quantity"] = round(''',
              '''        if position:\n            if target_weight > 0:\n                position["target_weight"] = round(target_weight, 8)\n            position["quantity"] = round(''',
          )
          replace_once(
              path,
              '''        "asset_type": buy_meta.get("asset_type"),\n        "status": "paper_active",\n        "quantity": round(buy_quantity, 8),''',
              '''        "asset_type": buy_meta.get("asset_type"),\n        "status": "paper_active",\n        "target_weight": round(float(result.get("target_weight") or 0.0), 8),\n        "quantity": round(buy_quantity, 8),''',
          )
          replace_once(
              path,
              '''            "decision_id": result.get("decision_id"),\n            "instrument_id": instrument_id,''',
              '''            "decision_id": result.get("decision_id"),\n            "order_action": result.get("action"),\n            "instrument_id": instrument_id,''',
          )

          path='scripts/build_portfolio_10k_usd.py'
          replace_once(
              path,
              '''def convert_position(position: dict, source: dict, usd_pln_now: float) -> dict:\n    item = copy.deepcopy(position)\n    target_weight = number(item.get("target_weight"))\n''',
              '''def source_allocation_weight(position: dict, source: dict) -> float:\n    """Use declared target weight when present, otherwise mirror executed capital."""\n    target = number(position.get("target_weight"))\n    if target > 0:\n        return target\n    starting = number(source.get("starting_capital_pln"), 10000.0)\n    entry_value = number(position.get("entry_value_pln"))\n    if starting > 0 and entry_value > 0:\n        return entry_value / starting\n    current_value = number(position.get("current_value_pln"))\n    if starting > 0 and current_value > 0:\n        return current_value / starting\n    return 0.0\n\n\ndef convert_position(position: dict, source: dict, usd_pln_now: float) -> dict:\n    item = copy.deepcopy(position)\n    target_weight = source_allocation_weight(item, source)\n''',
          )

          path='.github/workflows/portfolio-10k-hourly-prices.yml'
          replace_once(
              path,
              '      - "scripts/reconcile_portfolio_10k_executions.py"\n',
              '      - "scripts/reconcile_portfolio_10k_executions.py"\n      - "scripts/portfolio_10k_execution_ledger.py"\n',
          )
          replace_once(
              path,
              '      - "tests/test_portfolio_10k_guardian.py"\n',
              '      - "tests/test_portfolio_10k_guardian.py"\n      - "tests/test_portfolio_10k_execution_persistence.py"\n',
          )
          replace_once(
              path,
              '''            scripts/portfolio_10k_hard_gate.py \\\n            scripts/reconcile_portfolio_10k_executions.py\n''',
              '''            scripts/portfolio_10k_hard_gate.py \\\n            scripts/reconcile_portfolio_10k_executions.py \\\n            scripts/portfolio_10k_execution_ledger.py\n''',
          )
          replace_once(
              path,
              '          python -m unittest tests.test_portfolio_10k_guardian -v\n',
              '          python -m unittest tests.test_portfolio_10k_guardian -v\n          python -m unittest tests.test_portfolio_10k_execution_persistence -v\n',
          )
          PY

      - name: Test transaction-ledger authority
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/portfolio_10k_execution_ledger.py \
            scripts/reconcile_portfolio_10k_executions.py \
            scripts/brace_portfolio_execution.py \
            scripts/build_portfolio_10k_usd.py
          python -m unittest tests.test_brace_portfolio_reconciliation -v
          python -m unittest tests.test_portfolio_10k_execution_persistence -v

      - name: Repair current PL and EN portfolio state
        run: |
          set -euo pipefail
          python scripts/reconcile_portfolio_10k_executions.py
          python scripts/build_portfolio_10k_usd.py
          python scripts/fix_portfolio_10k_usd_reviews.py
          python scripts/portfolio_10k_hard_gate.py
          python scripts/render_portfolio_10k_static.py
          python scripts/render_portfolio_10k_static.py --check
          python - <<'PY'
          import json
          from pathlib import Path

          pl=json.loads(Path('data/investments/portfolio_10k.json').read_text(encoding='utf-8'))
          en=json.loads(Path('data/investments/portfolio_10k_usd.json').read_text(encoding='utf-8'))
          paper=json.loads(Path('data/portfolio10k/paper_portfolio.json').read_text(encoding='utf-8'))
          for name,payload in [('PL',pl),('EN',en)]:
              ids={str(p.get('id')) for p in payload.get('positions',[])}
              assert 'jpm' in ids, (name,ids)
              assert 'spgi' not in ids, (name,ids)
              assert len(ids) == 7, (name,ids)
          groups={}
          for tx in paper.get('transactions',[]):
              if tx.get('executed_at') and tx.get('side') in {'BUY','SELL'}:
                  groups.setdefault(tx.get('order_id') or tx.get('transaction_id'),[]).append(tx)
          latest=max(groups.values(),key=lambda rows:max(str(r.get('executed_at') or '') for r in rows))
          assert {r.get('instrument_id') for r in latest} == {'spgi','jpm'}
          assert {r.get('side') for r in latest} == {'SELL','BUY'}
          assert pl.get('execution_reconciliation',{}).get('execution_authority') == 'paper_portfolio.transactions'
          assert en.get('execution_reconciliation',{}).get('execution_authority') == 'paper_portfolio.transactions'
          print('PORTFOLIO_STATE_OK: SPGI removed, JPM active in PL+EN')
          PY

      - name: Commit repaired code, data and frontend
        id: commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-fix-portfolio-execution-persistence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/portfolio_10k_execution_ledger.py \
            scripts/reconcile_portfolio_10k_executions.py \
            scripts/brace_portfolio_execution.py \
            scripts/build_portfolio_10k_usd.py \
            tests/test_portfolio_10k_execution_persistence.py \
            .github/workflows/portfolio-10k-hourly-prices.yml \
            .github/workflows/one-shot-fix-portfolio-execution-persistence.yml \
            data/investments/portfolio_10k.json \
            data/investments/portfolio_10k_usd.json \
            pl/inwestycje/portfel-10k.html \
            en/investing/portfolio-10k.html
          git commit -m "Persist executed BRACE trades into public Portfolio 10K"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt*5))
          done
          exit 1

      - name: Request fresh Pages build
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            CODE="$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")"
            if [[ "$CODE" == "201" ]]; then exit 0; fi
            if [[ "$CODE" != "409" ]]; then cat /tmp/pages.json; exit 1; fi
            sleep 10
          done
          exit 1

      - name: Verify production PL and EN holdings
        run: |
          python - <<'PY'
          import html,json,time,urllib.request
          from pathlib import Path
          headers={'User-Agent':'BriefRooms-portfolio-execution-persistence/1.0','Cache-Control':'no-cache'}
          urls={
            'pl_data':'https://briefrooms.com/data/investments/portfolio_10k.json',
            'en_data':'https://briefrooms.com/data/investments/portfolio_10k_usd.json',
            'pl_page':'https://briefrooms.com/pl/inwestycje/portfel-10k.html',
            'en_page':'https://briefrooms.com/en/investing/portfolio-10k.html',
          }
          last_error=''
          for attempt in range(1,43):
              token=f'{int(time.time())}-{attempt}'
              try:
                  out={}
                  for key,url in urls.items():
                      req=urllib.request.Request(f'{url}?v={token}',headers=headers)
                      with urllib.request.urlopen(req,timeout=20) as r:
                          raw=r.read().decode('utf-8',errors='replace')
                      out[key]=json.loads(raw) if key.endswith('_data') else raw
                  for key in ('pl_data','en_data'):
                      ids={str(p.get('id')) for p in out[key].get('positions',[])}
                      assert 'jpm' in ids and 'spgi' not in ids and len(ids)==7, (key,ids)
                      assert out[key].get('execution_reconciliation',{}).get('execution_authority') == 'paper_portfolio.transactions'
                  for key in ('pl_page','en_page'):
                      text=out[key]
                      start=text.index('<!-- portfolio-static-snapshot:start -->')
                      end=text.index('<!-- portfolio-static-snapshot:end -->')
                      block=html.unescape(text[start:end])
                      assert 'JPMorgan Chase' in block, key
                      assert 'S&P Global' not in block, key
                  result={
                    'checked_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
                    'passed':True,
                    'authority':'paper_portfolio.transactions',
                    'pl_active_ids':sorted(str(p.get('id')) for p in out['pl_data'].get('positions',[])),
                    'en_active_ids':sorted(str(p.get('id')) for p in out['en_data'].get('positions',[])),
                    'expected_change':'SPGI.US sold; JPM.US active',
                    'last_error':'',
                  }
                  Path('data/internal/portfolio_execution_persistence_verify.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                  print('PRODUCTION_PORTFOLIO_EXECUTION_PERSISTENCE_OK')
                  raise SystemExit(0)
              except Exception as exc:
                  last_error=f'{type(exc).__name__}: {exc}'
                  print('attempt',attempt,last_error[:220])
                  time.sleep(10)
          Path('data/internal/portfolio_execution_persistence_verify.json').write_text(json.dumps({'passed':False,'last_error':last_error},indent=2)+'\n',encoding='utf-8')
          raise SystemExit(last_error)
          PY

      - name: Commit production verification
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/internal/portfolio_execution_persistence_verify.json
          git commit -m "Verify Portfolio 10K execution persistence in production"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt*5))
          done
          exit 1
