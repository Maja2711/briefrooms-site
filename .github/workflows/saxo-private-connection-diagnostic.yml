name: Verify private Saxo Worker connection (no quotes in logs)

on:
  workflow_dispatch:
  # Validate the corrected endpoint once after merging this scoped diagnostic.
  push:
    branches: [main]
    paths:
      - ".github/workflows/saxo-private-connection-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: verify-private-saxo-worker
  cancel-in-progress: true

jobs:
  authenticated-read-only-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONPATH: scripts
      SAXO_PRIVATE_BASIC_USER: admin
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SAXO_PRIVATE_BASIC_PASSWORD: ${{ secrets.SAXO_PRIVATE_BASIC_PASSWORD }}
    steps:
      - name: Checkout production adapter
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check actual GitHub runner to Cloudflare Worker connectivity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          import re
          from urllib.parse import urlsplit
          from saxo_private_feed import (
              SAXO_WORKER_URL, validate_private_saxo_snapshot
          )

          base = SAXO_WORKER_URL.rsplit("/", 1)[0]
          secret = os.environ.get("SAXO_PRIVATE_BASIC_PASSWORD", "")
          if not secret:
              print("RESULT=BLOCKED_MISSING_GITHUB_SECRET")
              raise SystemExit(2)

          username = os.environ.get("SAXO_PRIVATE_BASIC_USER", "admin")
          if not username or ":" in username or any(c in username for c in "\r\n"):
              print("RESULT=INVALID_AUTH_CONFIGURATION")
              raise SystemExit(3)

          authorization = "Basic " + base64.b64encode(
              f"{username}:{secret}".encode("utf-8")
          ).decode("ascii")

          def read(endpoint, *, authenticated=True):
              headers = {
                  "Accept": "application/json",
                  "Cache-Control": "no-store",
              }
              if authenticated:
                  headers["Authorization"] = authorization
              req = urllib.request.Request(endpoint, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=8) as res:
                      if res.status != 200:
                          return "HTTP_" + str(res.status), None
                      payload = json.loads(res.read(16385))
                      return "OK", payload
              except urllib.error.HTTPError as e:
                  if endpoint == base + "/saxo/status":
                      # Only print safe classifications, never challenge content.
                      challenge = str(e.headers.get("WWW-Authenticate", "")).strip()
                      scheme = challenge.split(" ", 1)[0].upper() if challenge else "NONE"
                      if scheme not in {"BASIC", "BEARER", "DIGEST", "NONE"}:
                          scheme = "OTHER"
                      prefix = "AUTH" if authenticated else "ANON"
                      print(prefix + "_STATUS_CHALLENGE_SCHEME=" + scheme)
                      mitigated = str(e.headers.get("Cf-Mitigated", "")).lower() == "challenge"
                      print(prefix + "_STATUS_CF_CHALLENGE=" + ("YES" if mitigated else "NO"))
                  return "HTTP_" + str(e.code), None
              except urllib.error.URLError:
                  return "NETWORK_ERROR", None
              except (ValueError, TypeError):
                  return "INVALID_JSON", None
              except Exception:
                  return "UNAVAILABLE", None

          # The real Worker route is /saxo/status, not /status.
          # Probe the public root without a password: it bypasses Basic auth
          # but not the Worker's strict origin check.
          def root_http():
              req = urllib.request.Request(base + "/", headers={"Accept": "text/plain"})
              try:
                  with urllib.request.urlopen(req, timeout=8) as response:
                      return "HTTP_" + str(response.status)
              except urllib.error.HTTPError as error:
                  return "HTTP_" + str(error.code)
              except Exception:
                  return "UNAVAILABLE"
          print("PUBLIC_ROOT_ENDPOINT=" + root_http())

          # Check hardcoded CALLBACK origin against the configured Worker host
          # without revealing source code, URLs, tokens or other Worker secrets.
          cf_account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          cf_token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          if cf_account and cf_token:
              try:
                  source_req = urllib.request.Request(
                      "https://api.cloudflare.com/client/v4/accounts/" + cf_account
                      + "/workers/scripts/briefrooms-saxo-eurusd",
                      headers={"Authorization": "Bearer " + cf_token},
                  )
                  with urllib.request.urlopen(source_req, timeout=12) as response:
                      source = response.read(2000000).decode("utf-8", "replace")
                  callback = re.search(r"""\bconst\s+CALLBACK\s*=\s*(['"\x60])([^'"\x60]+)\1""", source)
                  print("CALLBACK_LITERAL_FOUND=" + str(bool(callback)).upper())
                  if callback:
                      actual = urlsplit(base)
                      expected = urlsplit(callback.group(2))
                      is_match = (actual.scheme, actual.netloc) == (expected.scheme, expected.netloc)
                      print("CALLBACK_ORIGIN_MATCH=" + str(is_match).upper())
              except Exception:
                  print("CALLBACK_ORIGIN_AUDIT=UNAVAILABLE")
          else:
              print("CALLBACK_ORIGIN_AUDIT=MISSING_API_ACCESS")

          status, status_payload = read(base + "/saxo/status")
          if status != "OK":
              print("STATUS_ENDPOINT=" + status)
              if status in {"HTTP_401", "HTTP_403"}:
                  anonymous_status, _ = read(base + "/saxo/status", authenticated=False)
                  print("ANONYMOUS_STATUS_ENDPOINT=" + anonymous_status)
                  print("SAME_HTTP_STATUS_WITHOUT_BASIC=" + str(status == anonymous_status).upper())
              quote_status, _ = read(SAXO_WORKER_URL)
              print("QUOTE_ENDPOINT_ON_STATUS_FAILURE=" + quote_status)
              print("RESULT=BLOCKED_WORKER_AUTH_OR_NETWORK")
              raise SystemExit(4)

          if not isinstance(status_payload, dict) or not (
              status_payload.get("connected") is True
              and status_payload.get("environment") == "SIM"
              and status_payload.get("trading_enabled") is False
          ):
              print("STATUS_ENDPOINT=INVALID_OR_DISCONNECTED")
              print("RESULT=BLOCKED_SAXO_OAUTH_STATUS")
              raise SystemExit(5)
          print("STATUS_ENDPOINT=AUTHORIZED_SIM_CONNECTED")

          status, quote_payload = read(SAXO_WORKER_URL)
          if status != "OK":
              print("QUOTE_ENDPOINT=" + status)
              print("RESULT=BLOCKED_WORKER_QUOTE")
              raise SystemExit(6)

          try:
              quote = validate_private_saxo_snapshot(quote_payload)
              assert quote["source"] == "SAXO_SIM"
              assert quote["redistributable"] is False
          except Exception:
              print("QUOTE_ENDPOINT=INVALID_PRIVATE_QUOTE_CONTRACT")
              print("RESULT=BLOCKED_QUOTE_VALIDATION")
              raise SystemExit(7)
          # Never print private prices, raw response, tokens or Basic credentials.
          print("QUOTE_ENDPOINT=FRESH_BID_ASK_VALIDATED")
          print("RESULT=PASS_AUTHENTICATED_PRIVATE_SAXO_SIM_READ")
          PY
