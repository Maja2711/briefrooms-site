name: One-shot AI Tournament chart-ranking retry

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-ai-tournament-chart-link-retry.yml"
      - "scripts/patch_ai_tournament_chart_link_once.py"

permissions:
  contents: write

concurrency:
  group: ai-tournament-ui-retry
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply deterministic patch
        run: python scripts/patch_ai_tournament_chart_link_once.py
      - name: Validate JavaScript and UI contract
        run: |
          node --check scripts/ai-tournament-public.js
          python - <<'PY'
          from pathlib import Path
          text = Path('scripts/ai-tournament-public.js').read_text(encoding='utf-8')
          required = [
              'data-agent="${esc(row.agent_id)}"',
              'aitx-chart-label',
              'aitx-chart-leader',
              'function installAgentLinking()',
              "localeCompare(String(b?.session_date",
              'kolory linii odpowiadają rankingowi',
              'line colors match the ranking',
              'const width = 640, height = 215',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f'Missing UI tokens: {missing}')
          assert text.count('function installAgentLinking()') == 1
          PY
      - name: Commit production UI and clean one-shot files
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-ai-tournament-chart-link.yml
          rm -f .github/workflows/one-shot-ai-tournament-chart-link-retry.yml
          rm -f scripts/patch_ai_tournament_chart_link_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ai-tournament-public.js .github/workflows scripts/patch_ai_tournament_chart_link_once.py
          git commit -m "Link AI Tournament chart to agent ranking"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
