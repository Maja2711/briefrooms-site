name: Run Stock Trading Portfolio

on:
  workflow_dispatch:
    inputs:
      market:
        description: "Market to review"
        required: true
        default: all
        type: choice
        options: [all, GPW, US]
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock-trading-portfolio.yml"
      - "scripts/stock_trading_portfolio.py"
      - "scripts/stock_trading_quote_enricher.py"
      - "data/investments/stock_trading_policy.json"
      - "data/investments/gpw_daily_pick.json"
      - "data/investments/us_daily_stock.json"
      - "tests/test_stock_trading_portfolio.py"
      - "tests/test_stock_trading_quote_enricher.py"
  schedule:
    # GitHub Actions cron has a 5-minute minimum. The public page polls the
    # canonical JSON every minute, while this job refreshes the source quote
    # and deterministic portfolio controls at the fastest supported cadence.
    - cron: "*/5 7-21 * * 1-5"

permissions:
  contents: write
  pages: write

concurrency:
  group: stock-trading-state-writer
  cancel-in-progress: false

jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Stock Trading contract
        run: |
          set -euo pipefail
          python -m py_compile scripts/stock_trading_portfolio.py scripts/stock_trading_quote_enricher.py
          python -m json.tool data/investments/stock_trading_policy.json >/dev/null
          python -m unittest tests.test_stock_trading_portfolio tests.test_stock_trading_quote_enricher -v

      - name: Resolve market
        id: market
        shell: bash
        env:
          REQUESTED: ${{ inputs.market }}
        run: |
          set -euo pipefail
          MARKET="${REQUESTED:-all}"
          echo "value=$MARKET" >> "$GITHUB_OUTPUT"

      - name: Review positions and refresh session-aware quotes
        run: |
          set -euo pipefail
          python scripts/stock_trading_portfolio.py --mode run --market "${{ steps.market.outputs.value }}"
          python scripts/stock_trading_quote_enricher.py --market "${{ steps.market.outputs.value }}" --verify
          python scripts/stock_trading_portfolio.py --mode verify
          python -m json.tool data/investments/stock_trading_portfolio.json >/dev/null

      - name: Persist canonical Stock Trading portfolio
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/investments/stock_trading_portfolio.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update adaptive Stock Trading portfolio"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt*3))
          done
          exit 1

      - name: Request Pages refresh
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            CODE=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
            [[ "$CODE" == "201" ]] && exit 0
            [[ "$CODE" != "409" ]] && { cat /tmp/pages.json; exit 1; }
            sleep 10
          done
          exit 1
