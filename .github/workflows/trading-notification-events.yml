name: Trading Notification Events
# NO RETROACTIVE EXECUTION

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build_trading_notification_events.py"
      - "tests/test_trading_notification_events.py"
      - "data/notifications/trading-notification-config.json"
      - "data/investments/eurusd_daily_spot.json"
      - "data/investments/eurusd_daily_history.json"
      - "data/investments/stock_trading_portfolio.json"
      - ".github/workflows/trading-notification-events.yml"

permissions:
  contents: write

concurrency:
  group: trading-notification-events
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start immutable run clock
        run: |
          echo "NO_RETROACTIVE_EXECUTION=1" >> "$GITHUB_ENV"
          echo "NO_RETROACTIVE_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build Daily and Stock recovery notification transitions
        run: |
          python -m py_compile scripts/build_trading_notification_events.py
          node --check scripts/trading-notifications.js
          node --check br-trading-sw.js
          python -m unittest tests.test_trading_notification_events -v
          python scripts/build_trading_notification_events.py
      - name: Persist notification state/events only when changed
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notifications/trading-state.json data/notifications/trading-events.json
          if git diff --cached --quiet; then
            echo "No trading notification transition."
            exit 0
          fi
          python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
          git commit -m "Update trading notification events"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main; then
              python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD^ --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
              if git push origin HEAD:main; then
                exit 0
              fi
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*3))
          done
          exit 1
