name: One-shot Hot X refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-hot-x-refresh.yml"

permissions:
  contents: write

concurrency:
  group: social-content
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Hot X implementation
        run: |
          python -m py_compile scripts/hot_x_items.py scripts/update_hot_x_2x_daily.py scripts/hot_x_public_rss_fallback.py
          python -m unittest tests/test_hot_x_items.py
          node --check scripts/hot-x-render.js
          node tests/test_hot_x_render.js
      - name: Generate fresh Hot X files
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python scripts/update_hot_x_2x_daily.py > /tmp/hot_x_refresh.log 2>&1
          rc=$?
          set -e
          cat /tmp/hot_x_refresh.log
          if [[ "$rc" != "0" ]] || grep -q "HTTP Error 402" /tmp/hot_x_refresh.log; then
            echo "Direct X API unavailable; using governed public RSS fallback."
            python scripts/hot_x_public_rss_fallback.py
          fi
      - name: Validate generated feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.hot_x_items import comment_text, duplicate_free, is_direct_post, valid_item
          p = Path('data/hot_tweets.json')
          payload = json.loads(p.read_text(encoding='utf-8'))
          items = payload.get('items') or []
          assert 4 <= len(items) <= 10, len(items)
          assert duplicate_free(items)
          assert all(valid_item(item) for item in items)
          assert all(min(len(comment_text(item, lang)) for lang in ('pl','en')) >= 80 for item in items)
          assert sum(is_direct_post(item.get('tweet_url')) for item in items) >= 4
          assert payload.get('updated_at')
          print(json.dumps({'updated_at': payload.get('updated_at'), 'mode': payload.get('mode'), 'items': len(items)}, ensure_ascii=False))
          PY
      - name: Commit fresh Hot X files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hot_tweets.json data/hot_x_refresh_status.json data/hot_x_public_fallback_status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No refreshed Hot X file changes were produced."
            exit 1
          fi
          git commit -m "Update Hot X topics"
          git pull --rebase origin main
          git push origin HEAD:main
