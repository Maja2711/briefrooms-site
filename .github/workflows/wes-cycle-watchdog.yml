name: WES Cycle Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_run:
    workflows: ["WES Live Execution"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "scripts/wes_cycle_watchdog.py"
      - "scripts/wes_blocker_watchdog.py"
      - "tests/test_wes_blocker_watchdog.py"
      - "tests/test_wes_cycle_watchdog.py"
      - "data/investments/multi_instrument_exposure_policy.json"
      - ".github/workflows/wes-cycle-watchdog.yml"

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  validate-watchdog:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate WES liveness and EURUSD public execution contract
        run: |
          python -m py_compile scripts/wes_cycle_watchdog.py scripts/wes_blocker_watchdog.py
          python -m unittest tests/test_wes_cycle_watchdog.py tests/test_wes_blocker_watchdog.py -v
          node --check scripts/investments-weekly-public.js
          node --test tests/test_investments_weekly_public.js

  monitor-wes-cycle:
    if: github.event_name != 'push' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate guard before live check
        run: |
          python -m py_compile scripts/wes_cycle_watchdog.py
          python -m unittest tests/test_wes_cycle_watchdog.py tests/test_wes_blocker_watchdog.py -v
      - name: Check persisted WES preflight and postflight freshness
        id: liveness
        shell: bash
        run: |
          set +e
          python scripts/wes_cycle_watchdog.py --mode check | tee /tmp/wes-cycle-watchdog.json
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Investigate source freshness, obsolete blockers and zero-trade reasons
        id: blockers
        shell: bash
        run: |
          set +e
          python scripts/wes_blocker_watchdog.py --mode diagnose --check | tee /tmp/wes-blocker-watchdog.json
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "recovery=false" >> "$GITHUB_OUTPUT"
          else
            echo "recovery=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open one deduplicated execution incident with diagnostics
        if: steps.liveness.outputs.stale == 'true' || steps.blockers.outputs.recovery == 'true' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="WES: Weekly executor or EURUSD entry contract needs repair"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --search "$title in:title" --json number --jq '.[0].number // ""')
          if [ -z "$issue" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          def data(path):
              try: return json.loads(Path(path).read_text(encoding="utf-8"))
              except (OSError, ValueError): return {}
          cycle = data("/tmp/wes-cycle-watchdog.json")
          blockers = data("/tmp/wes-blocker-watchdog.json")
          eur = blockers.get("instruments", {}).get("eurusd", {})
          summary = {
              "wes_cycle_status": cycle.get("status"),
              "liveness_reasons": cycle.get("reasons", []),
              "blocker_status": blockers.get("status"),
              "recovery_reasons": blockers.get("recovery_reasons", []),
              "eurusd": {k: eur.get(k) for k in (
                  "status", "entry_execution_mode", "entry_plan_expires_at",
                  "entry_authorization_active", "blocker_reasons", "warnings")},
          }
          Path("/tmp/wes-incident.md").write_text(
              "Automatic execution-contract incident. **No trades, sealed decisions or safety gates were changed.**\n\n"
              "A code review is required if controlled recovery does not restore execution. "
              "Do not backfill a historical fill or override EPE/central-bank protection.\n\n"
              "```json\n" + json.dumps(summary, indent=2) + "\n```\n",
              encoding="utf-8")
          PY
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body-file /tmp/wes-incident.md
          else
            echo "Execution incident already open: #$issue (no duplicate)"
          fi
      - name: Dispatch controlled recovery (never fabricates fills)
        if: github.event_name != 'workflow_run' && (steps.liveness.outputs.stale == 'true' || steps.blockers.outputs.recovery == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dispatch() {
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/$1/dispatches" \
              -d '{"ref":"main"}'
          }
          if [ "${{ steps.liveness.outputs.stale }}" = "true" ]; then
            dispatch investments-wes.yml
          fi
          if [ "${{ steps.blockers.outputs.recovery }}" = "true" ]; then
            dispatch wes-live-execution.yml
          fi
          echo "::error::WES recovery dispatched; code incident tracked without weakening EPE or CB gates."
          exit 1
      - name: Flag upstream WES executor crash
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
        run: |
          echo "::error::WES Live Execution failed; deduplicated diagnostic issue created."
          exit 1
