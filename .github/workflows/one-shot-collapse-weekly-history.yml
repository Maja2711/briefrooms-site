name: One-shot collapse weekly history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-collapse-weekly-history.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collapse weekly history by default
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/investments-weekly-public.js')
          s = p.read_text(encoding='utf-8')
          old = '<details class="history" open>'
          new = '<details class="history">'
          if old not in s:
              raise SystemExit('Expected open history marker not found')
          s2 = s.replace(old, new, 1)
          if old in s2:
              raise SystemExit('Unexpected second open history marker remains')
          p.write_text(s2, encoding='utf-8')
          PY
          node --check scripts/investments-weekly-public.js
          node --test tests/test_investments_weekly_public.js
      - name: Commit UI change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/investments-weekly-public.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Collapse weekly position history by default"
          git pull --rebase origin main
          git push origin HEAD:main
