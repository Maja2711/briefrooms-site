name: Deploy Portfolio 10K freshness UI v5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-portfolio-freshness-ui-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-portfolio-freshness-ui-v5
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate freshness guard JavaScript
        run: node --check scripts/portfolio-10k-navigation-guard.js
      - name: Bump freshness guard asset in PL and EN
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in [Path('pl/inwestycje/portfel-10k.html'), Path('en/investing/portfolio-10k.html')]:
              text=path.read_text(encoding='utf-8')
              if 'portfolio-10k-navigation-guard.js?v=5' in text:
                  continue
              if 'portfolio-10k-navigation-guard.js?v=4' not in text:
                  raise SystemExit(f'{path}: v4 guard reference not found')
              path.write_text(text.replace('portfolio-10k-navigation-guard.js?v=4','portfolio-10k-navigation-guard.js?v=5'), encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-portfolio-freshness-ui-v5.yml
      - name: Commit deployment
        run: |
          set -euo pipefail
          git config user.name 'briefrooms-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add pl/inwestycje/portfel-10k.html en/investing/portfolio-10k.html .github/workflows/one-shot-portfolio-freshness-ui-v5.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Load Portfolio 10K freshness guard v5'
          git pull --rebase origin main
          git push origin HEAD:main
