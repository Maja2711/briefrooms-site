name: Homepage News Policy Validation

on:
  pull_request:
    paths:
      - "scripts/news-live.js"
      - "scripts/home-card-floor.js"
      - "scripts/home-briefs.js"
      - "scripts/home-intelligence-layout.js"
      - "scripts/install_news_live_runtime.py"
      - "scripts/sync_home_lab.py"
      - "scripts/dedupe_home_brief_stories.py"
      - "scripts/publish_source_expansion_v3.py"
      - "scripts/enforce_homepage_max_age.py"
      - "scripts/publish_emergency_news.py"
      - "scripts/newsroom_style.py"
      - "pl/aktualnosci.html"
      - "en/news.html"
      - "tests/home_briefs_policy.test.js"
      - "tests/home_card_floor_policy.test.js"
      - "tests/test_install_news_live_runtime.py"
      - "tests/test_homepage_static.py"
      - "tests/test_publish_live_news.py"
      - "tests/test_homepage_max_age.py"
      - "tests/test_publish_emergency_news.py"
      - ".github/workflows/homepage-news-policy-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install news test dependencies
        run: python -m pip install feedparser requests

      - name: Validate homepage policy code
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/install_news_live_runtime.py \
            scripts/sync_home_lab.py \
            scripts/dedupe_home_brief_stories.py \
            scripts/publish_source_expansion_v3.py \
            scripts/enforce_homepage_max_age.py \
            scripts/publish_emergency_news.py \
            scripts/newsroom_style.py
          python -m unittest \
            tests.test_install_news_live_runtime \
            tests.test_homepage_static \
            tests.test_publish_live_news \
            tests.test_homepage_max_age \
            tests.test_publish_emergency_news -v
          node --check scripts/news-live.js
          node --check scripts/home-card-floor.js
          node --check scripts/home-briefs.js
          node --check scripts/home-intelligence-layout.js
          node --test tests/home_briefs_policy.test.js
          node --test tests/home_card_floor_policy.test.js
          python scripts/sync_home_lab.py
          python scripts/sync_home_lab.py --check
          grep -F 'max-72h-first-display-v1' scripts/news-live.js
          grep -F 'politics-geopolitics-economy-ai-science-health-sport' scripts/news-live.js
