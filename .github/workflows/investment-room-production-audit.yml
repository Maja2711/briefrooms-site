name: Audit Investment Room Production

on:
  issues:
    types: [opened]
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"
  push:
    branches: [main]
    paths:
      - "pl/inwestycje/portfel-10k.html"
      - "en/investing/portfolio-10k.html"
      - "scripts/portfolio-10k-dashboard.js"
      - "scripts/portfolio-10k-dashboard-en.js"
      - "scripts/portfolio-10k-navigation-guard.js"
      - "scripts/audit_investment_rooms.mjs"
      - ".github/workflows/investment-room-production-audit.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: investment-room-production-audit
  cancel-in-progress: false

jobs:
  production-audit:
    if: github.event_name != 'issues' || github.event.issue.title == 'Audit Investment Room production'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Wait for the resilient controller on production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            page_pl="$(curl -fsS --max-time 20 "https://briefrooms.com/pl/inwestycje/portfel-10k.html?deploy=${GITHUB_SHA}-${attempt}" || true)"
            page_en="$(curl -fsS --max-time 20 "https://briefrooms.com/en/investing/portfolio-10k.html?deploy=${GITHUB_SHA}-${attempt}" || true)"
            controller="$(curl -fsS --max-time 20 "https://briefrooms.com/scripts/portfolio-10k-dashboard.js?deploy=${GITHUB_SHA}-${attempt}" || true)"
            if grep -q 'portfolio-10k-dashboard.js?v=9' <<<"$page_pl" \
              && grep -q 'portfolio-10k-dashboard-en.js?v=9' <<<"$page_en" \
              && grep -q "resilient-v9" <<<"$controller"; then
              echo "Production serves the resilient v9 controller."
              exit 0
            fi
            echo "Production not ready yet (attempt ${attempt}/30)."
            sleep 10
          done
          echo "Production did not publish resilient v9 within five minutes."
          exit 1

      - name: Require two consecutive complete production passes
        id: audit
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/investment-room-production
          consecutive=0
          final_code=1
          for attempt in 1 2 3; do
            attempt_dir="artifacts/investment-room-production/attempt-${attempt}"
            mkdir -p "$attempt_dir"
            echo "Production audit attempt ${attempt}/3; consecutive passes: ${consecutive}/2"
            timeout 170s env \
              AUDIT_BASE_URL=https://briefrooms.com \
              AUDIT_CONTROLLER=resilient-v9 \
              AUDIT_OUTPUT_PATH="$attempt_dir/report.json" \
              AUDIT_SCREENSHOT_DIR="$attempt_dir/screenshots" \
              node scripts/audit_investment_rooms.mjs
            code=$?
            if [ "$code" -eq 0 ]; then
              consecutive=$((consecutive + 1))
            else
              consecutive=0
            fi
            if [ "$consecutive" -ge 2 ]; then
              final_code=0
              break
            fi
            sleep 10
          done
          echo "exit_code=${final_code}" >> "$GITHUB_OUTPUT"
          echo "consecutive_passes=${consecutive}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build audit summary
        if: always()
        shell: bash
        env:
          CONSECUTIVE_PASSES: ${{ steps.audit.outputs.consecutive_passes || '0' }}
        run: |
          node <<'JS'
          const fs = require('fs');
          const path = require('path');
          const root = 'artifacts/investment-room-production';
          const reports = fs.existsSync(root)
            ? fs.readdirSync(root).filter(name => /^attempt-\d+$/.test(name)).sort().map(name => {
                const file = path.join(root, name, 'report.json');
                return fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : null;
              }).filter(Boolean)
            : [];
          const report = reports.at(-1);
          const passes = Number(process.env.CONSECUTIVE_PASSES || 0);
          const passed = passes >= 2 && Boolean(report?.passed);
          const lines = [
            `## Production Investment Room audit: ${passed ? 'PASS' : 'FAIL'}`,
            '',
            `Consecutive complete passes: **${passes}/2**`,
            `Completed attempts: **${reports.length}/3**`,
            ''
          ];
          for (const language of ['pl', 'en']) {
            const result = report?.results?.[language] || {};
            const top = (result.topTabs || []).filter(item => item.passed).length;
            const side = (result.sidebarTabs || []).filter(item => item.passed).length;
            lines.push(`- **${language.toUpperCase()}**: ${result.passed ? 'PASS' : 'FAIL'}; top ${top}/9; sidebar ${side}/9; status \`${result.data?.status || ''}\`; value \`${result.data?.portfolioValue || ''}\`; positions \`${result.data?.positions || ''}\``);
            lines.push(`  - controller/source/network/BRACE: \`${result.data?.controller || ''}\` / \`${result.data?.source || ''}\` / \`${result.data?.network || ''}\` / \`${result.data?.brace || ''}\``);
            lines.push(`  - JS/page/request/HTTP errors: ${(result.consoleErrors || []).length}/${(result.pageErrors || []).length}/${(result.criticalRequestFailures || []).length}/${(result.criticalHttpErrors || []).length}`);
          }
          if (!report) lines.push('- No report was produced before the hard timeout.');
          lines.push('', `Generated at: \`${report?.generatedAt || new Date().toISOString()}\``);
          fs.writeFileSync('/tmp/investment-room-audit.md', lines.join('\n') + '\n');
          JS

      - name: Comment result on trigger issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file /tmp/investment-room-audit.md

      - name: Upload production reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investment-room-production-audit
          path: artifacts/investment-room-production
          if-no-files-found: warn

      - name: Require the audit loop to pass
        if: always()
        shell: bash
        run: exit "${{ steps.audit.outputs.exit_code || '1' }}"
