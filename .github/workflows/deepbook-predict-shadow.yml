name: deepbook-predict-shadow
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: deepbook-predict-shadow
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --no-audit --no-fund
      - name: Collect live DeepBook Predict mainnet probabilities
        run: node scripts/deepbook_predict_shadow.mjs
      - name: Validate shadow isolation
        run: python -m pytest -q tests/test_deepbook_predict_shadow.py
      - name: Commit shadow observations
        run: |
          if git diff --quiet -- data/investments/deepbook_predict_shadow.json; then exit 0; fi
          git config user.name "briefrooms-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/investments/deepbook_predict_shadow.json
          git commit -m "data: collect DeepBook Predict shadow probabilities"
          git push
