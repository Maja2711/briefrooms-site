name: deepbook-predict-shadow
on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
permissions:
  contents: write
concurrency:
  group: deepbook-predict-shadow
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate shadow adapter
        run: python -m pytest -q tests/test_deepbook_predict_shadow.py
      - name: Collect DeepBook shadow snapshot
        env:
          DEEPBOOK_PREDICT_SHADOW_URL: ${{ vars.DEEPBOOK_PREDICT_SHADOW_URL }}
        run: python scripts/deepbook_predict_shadow.py
      - name: Commit shadow data when configured
        run: |
          if git diff --quiet -- data/investments/deepbook_predict_shadow.json; then exit 0; fi
          git config user.name "briefrooms-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/investments/deepbook_predict_shadow.json
          git commit -m "data: update DeepBook Predict shadow benchmark"
          git push
