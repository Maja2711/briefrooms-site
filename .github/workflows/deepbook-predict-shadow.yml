name: deepbook-predict-shadow-archived

# DECOMMISSIONED 2026-10-10.
# No schedule, no push trigger, no live DeepBook collection.
# Retained only for manual verification of the frozen research artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-archived-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen DeepBook research evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/investments/deepbook_predict_shadow.json")
          s=json.loads(p.read_text(encoding="utf-8"))
          assert s.get("lifecycle") == "DECOMMISSIONED_ACTIVE_RETAIN_RESEARCH_EVIDENCE"
          assert s.get("visible_in_decision_lab") is False
          assert s.get("belief_core_authority") is False
          assert s.get("execution_authority") is False
          assert s.get("automatic_promotion") is False
          v=s.get("validation",{})
          assert v.get("n") == 37
          assert v.get("learning") is False
          assert v.get("writeback") is False
          print({
            "lifecycle": s.get("lifecycle"),
            "frozen_at": s.get("frozen_at"),
            "n": v.get("n"),
            "brier": v.get("brier"),
            "accuracy": v.get("accuracy"),
          })
          PY
