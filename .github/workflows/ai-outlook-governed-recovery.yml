name: Governed AI Outlook Recovery

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  recover:
    if: github.event.issue.title == 'Run governed AI Outlook recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_GENERATION_MODEL: gemini-3.5-flash-lite
      GEMINI_REVIEW_MODEL: gemini-3.5-flash-lite
      GEMINI_MIN_INTERVAL_SECONDS: "8"
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Compile governed launcher
        run: |
          python -m py_compile \
            scripts/sitecustomize.py \
            scripts/ai_outlook_candidate_contract_patch.py \
            scripts/run_ai_outlook_gemini_governed.py \
            scripts/publish_ai_outlook_gemini.py

      - name: Generate today's governed PL and EN editions
        run: |
          set -euo pipefail
          python scripts/run_ai_outlook_gemini_governed.py --force
          python scripts/run_ai_outlook_gemini_governed.py --validate-only --require-today

      - name: Refresh only AI Outlook homepage runtime and metrics
        run: |
          set -euo pipefail
          python scripts/enforce_homepage_photo_only.py
          python scripts/ai_outlook_metrics.py
          python scripts/ai_outlook_metrics.py --validate-only

      - name: Verify local date and provider
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo('Europe/Warsaw')).date().isoformat()
          payload = json.loads(Path('data/ai_outlook.json').read_text(encoding='utf-8'))
          provider = json.loads(Path('data/ai_outlook_provider_status.json').read_text(encoding='utf-8'))
          assert payload.get('date') == today
          assert payload.get('generation_mode') == 'ai_primary'
          assert payload.get('ai_provider') == 'gemini'
          assert provider.get('status') == 'healthy'
          assert provider.get('date') == today
          assert payload['pl']['forecast_id'].startswith(today + '-pl-')
          assert payload['en']['forecast_id'].startswith(today + '-en-')
          print(today, payload['pl']['forecast_id'], payload['en']['forecast_id'])
          PY

      - name: Commit today's AI Outlook only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pl/index.html \
            en/index.html \
            data/ai_outlook.json \
            data/ai_outlook_status.json \
            data/ai_outlook_provider_status.json \
            data/ai_outlook_history \
            data/ai_outlook_metrics.json
          git add data/internal/ai_outlook_audit 2>/dev/null || true
          git commit -m "Publish verified daily Gemini AI Outlook"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          exit 1
