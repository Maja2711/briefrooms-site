name: Stock Trading v2 Production Champion
# NO RETROACTIVE EXECUTION

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Stock Trading v2 Continuous Discovery"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock-trading-v2-production.yml"
      - "scripts/stock_trading_v2_production_bridge.py"
      - "scripts/stock_trading_quote_enricher.py"
      - "scripts/stock_trading_portfolio.py"
      - "scripts/no_retroactive_execution.py"
      - "scripts/verify_no_retroactive_execution.py"
      - "data/investments/stock_trading_v2_production_config.json"
      - "data/investments/stock_trading_policy.json"
      - "tests/test_no_retroactive_execution.py"
      - "tests/test_stock_trading_quote_enricher.py"
      - "tests/test_stock_trading_portfolio.py"
      - "tests/test_stock_trading_v2_production_bridge.py"
  schedule:
    - cron: "*/10 7-21 * * 1-5"

permissions:
  contents: write
  pages: write

concurrency:
  group: stock-trading-state-writer
  cancel-in-progress: false

jobs:
  champion:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start immutable LIVE execution clock
        run: |
          echo "NO_RETROACTIVE_EXECUTION=1" >> "$GITHUB_ENV"
          echo "NO_RETROACTIVE_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Fetch latest v2 opportunity frontier
        run: |
          set -euo pipefail
          git fetch origin stock-trading-v2
          rm -f /tmp/v2-gpw.json /tmp/v2-us.json
          if git cat-file -e "origin/stock-trading-v2:data/investments/stock_trading_v2_opportunity/gpw.json" 2>/dev/null; then
            git show "origin/stock-trading-v2:data/investments/stock_trading_v2_opportunity/gpw.json" > /tmp/v2-gpw.json
          fi
          if git cat-file -e "origin/stock-trading-v2:data/investments/stock_trading_v2_opportunity/us.json" 2>/dev/null; then
            git show "origin/stock-trading-v2:data/investments/stock_trading_v2_opportunity/us.json" > /tmp/v2-us.json
          fi

      - name: Validate v2 production boundary
        run: |
          set -euo pipefail
          python -m py_compile scripts/stock_trading_v2_production_bridge.py scripts/stock_trading_portfolio.py scripts/stock_trading_quote_enricher.py scripts/no_retroactive_execution.py scripts/verify_no_retroactive_execution.py
          python -m json.tool data/investments/stock_trading_v2_production_config.json >/dev/null
          python -m json.tool data/investments/stock_trading_policy.json >/dev/null
          python -m unittest tests.test_stock_trading_v2_production_bridge tests.test_stock_trading_portfolio tests.test_stock_trading_quote_enricher tests.test_no_retroactive_execution -v
          node --check scripts/stock-trading-public.js
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/investments/stock_trading_policy.json').read_text())
          c=json.loads(Path('data/investments/stock_trading_v2_production_config.json').read_text())
          assert p['champion_engine']=='v2'
          assert p['challenger_engine']=='v1'
          assert p['legacy_candidate_admission_enabled'] is False
          assert p['markets']['GPW']['target_position_notional']==5000
          assert p['markets']['GPW']['position_currency']=='PLN'
          assert p['markets']['GPW']['fractional_quantity_allowed'] is True
          assert p['markets']['GPW']['sizing_policy_version']=='FIXED_NOTIONAL_V1'
          assert p['markets']['US']['target_position_notional']==5000
          assert p['markets']['US']['position_currency']=='USD'
          assert p['markets']['US']['fractional_quantity_allowed'] is True
          assert p['markets']['US']['sizing_policy_version']=='FIXED_NOTIONAL_V1'
          assert c['initial_phase']=='CANARY'
          assert c['canary_max_open_positions_per_market']==1
          assert c['candidate_search_policy']=='continue_ranked_candidates_until_capacity_or_exhaustion'
          print('V2_PRODUCTION_CONTRACT_OK')
          PY

      - name: Revalidate and admit v2 Champion opportunities
        run: |
          set -euo pipefail
          ARGS=()
          [[ -f /tmp/v2-gpw.json ]] && ARGS+=(--gpw-opportunity /tmp/v2-gpw.json)
          [[ -f /tmp/v2-us.json ]] && ARGS+=(--us-opportunity /tmp/v2-us.json)
          python scripts/stock_trading_v2_production_bridge.py "${ARGS[@]}"
          python scripts/stock_trading_portfolio.py --mode verify
          python scripts/stock_trading_quote_enricher.py --market all --verify

      - name: Persist canonical v2 portfolio state through NO RETROACTIVE airlock
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/investments/stock_trading_portfolio.json \
            data/investments/stock_trading_v2_production_state.json \
            2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Shadow opportunity data may inform a new decision, but may never donate a historical fill.
          python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
          git commit -m "Stock Trading: apply v2 Champion production decision"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main; then
              python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD^ --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
              if git push origin HEAD:main; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD^ --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
            sleep $((attempt*3))
          done
          exit 1

      - name: Request Pages refresh
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            CODE=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
            [[ "$CODE" == "201" ]] && exit 0
            [[ "$CODE" != "409" ]] && { cat /tmp/pages.json; exit 1; }
            sleep 10
          done
          exit 1
