name: Stock Trading MCK Quote Refresh

# Quote-only recovery path, independent from Stock v2 admission/provenance
# decisions. NEVER changes fills, SL/TP, last_mark, or non-MCK symbols.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
  workflow_run:
    workflows: ["Update Investment Room Quotes"]
    types: [completed]

permissions:
  contents: write
  pages: write

# Serialize canonical portfolio JSON writes with both Stock writers.
concurrency:
  group: stock-trading-state-writer
  cancel-in-progress: false

jobs:
  mck-quote:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate quote-only code and isolation
        run: |
          set -euo pipefail
          python -m py_compile scripts/stock_trading_quote_enricher.py
          python -m unittest tests.test_stock_trading_quote_enricher -v

      - name: Publish fresh observed MCK quote without changing other symbols
        id: write
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            # Always restart from the latest canonical portfolio before applying
            # this single-field update. Never rebase an obsolete JSON snapshot.
            git fetch origin main
            git reset --hard origin/main
            SHOULD_RUN=$(python - <<'PY'
          import json
          from datetime import datetime, time
          from pathlib import Path
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          state = json.loads(Path("data/investments/stock_trading_portfolio.json").read_text())
          positions = state.get("markets", {}).get("US", {}).get("open_positions", [])
          active = any(
              (p.get("symbol") == "MCK" or p.get("ticker") == "MCK") and
              str(p.get("status", "OPEN")).upper() == "OPEN"
              for p in positions if isinstance(p, dict)
          )
          session = now.weekday() < 5 and time(9, 25) <= now.time() <= time(16, 20)
          print("yes" if active and session else "no")
          PY
            )
            if [[ "$SHOULD_RUN" != "yes" ]]; then
              echo "MCK not open or NYSE regular-session refresh window closed"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            export NO_RETROACTIVE_EXECUTION=1
            export NO_RETROACTIVE_RUN_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            python scripts/stock_trading_quote_enricher.py --market US --symbol MCK --verify
            git add -- data/investments/stock_trading_portfolio.json
            if git diff --cached --quiet; then
              echo "MCK observation has not advanced; preserving existing mark"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
            git commit -m "Refresh only MCK observed quote in Stock Trading"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Concurrent portfolio update; retrying against latest main ($attempt/4)"
            sleep $((attempt*2))
          done
          echo "::error::MCK quote refresh could not publish due to repeated concurrent writes"
          exit 1

      - name: Request Pages refresh for updated MCK quote
        if: steps.write.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            CODE=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
            [[ "$CODE" == "201" ]] && exit 0
            [[ "$CODE" != "409" ]] && { cat /tmp/pages.json; exit 1; }
            sleep 10
          done
          exit 1
