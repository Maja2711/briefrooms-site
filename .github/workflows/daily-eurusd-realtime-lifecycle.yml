name: Daily EURUSD Realtime Lifecycle
# NO RETROACTIVE EXECUTION
#
# OPEN-position exit authority only. This workflow can never create a new
# LONG/SHORT decision or fill.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/daily_eurusd_fast_lifecycle.py"
      - "scripts/daily_eurusd_realtime_watch.sh"
      - "scripts/sync_trading_push_commit.sh"
      - "tests/test_daily_eurusd_fast_lifecycle.py"
      - ".github/workflows/daily-eurusd-realtime-lifecycle.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-eurusd-realtime-lifecycle
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate realtime lifecycle
        run: |
          set -euo pipefail
          python -m py_compile scripts/daily_eurusd_fast_lifecycle.py scripts/build_trading_notification_events.py scripts/verify_no_retroactive_execution.py
          python -m unittest tests.test_daily_eurusd_fast_lifecycle -v
          bash -n scripts/daily_eurusd_realtime_watch.sh
          bash -n scripts/sync_trading_push_commit.sh

  watch-open-position:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
      PUSH_API: https://briefrooms-trading-push.szczerbinski0577.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate exit-only authority
        run: |
          set -euo pipefail
          python -m py_compile scripts/daily_eurusd_fast_lifecycle.py scripts/build_trading_notification_events.py scripts/verify_no_retroactive_execution.py
          python -m unittest tests.test_daily_eurusd_fast_lifecycle -v
          bash -n scripts/daily_eurusd_realtime_watch.sh
          bash -n scripts/sync_trading_push_commit.sh

      - name: Start immutable realtime execution clock
        run: |
          echo "NO_RETROACTIVE_EXECUTION=1" >> "$GITHUB_ENV"
          echo "NO_RETROACTIVE_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Watch persisted OPEN position every five seconds
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/daily_eurusd_realtime_watch.sh
