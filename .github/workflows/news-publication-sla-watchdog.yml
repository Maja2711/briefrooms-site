name: News Publication SLA Watchdog
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/news-publication-sla-watchdog.yml'
      - '.github/workflows/publish-news.yml'
      - 'tests/test_news_publication_reliability.py'
      - 'scripts/news_publication_incident.py'
      - 'scripts/validate_news_cycle_sla.py'
      - 'tests/test_news_cycle_sla.py'
  schedule:
    - cron: "43 * * * *"
permissions:
  contents: read
  issues: write
jobs:
  regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install regression dependencies
        run: python -m pip install feedparser requests argostranslate langdetect
      - name: Test watchdog failure paths and publisher concurrency
        run: python -m unittest -v tests.test_news_publication_reliability tests.test_news_publication_incident tests.test_news_cycle_sla
  check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install watchdog dependencies
        run: python -m pip install feedparser requests argostranslate langdetect
      - name: Verify completed publisher cycles (90-minute SLA)
        id: health
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          python scripts/validate_news_cycle_sla.py --max-age-minutes 90 --output /tmp/news-publication-sla.json
      - name: Open or update publication incident
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/news_publication_incident.py --report /tmp/news-publication-sla.json
      - name: Mark SLA breach as failed
        if: steps.health.outcome == 'failure'
        run: exit 1
