name: Governed Weekly Paper Exposure Watch
# NO RETROACTIVE EXECUTION

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * 1-5"
    - cron: "7,37 0-6 * * 6"
  push:
    branches: [main]
    paths:
      - "scripts/investments_weekly_v2.py"
      - "scripts/investments_weekly_v5.py"
      - "scripts/investments_weekly_v5_finalize.py"
      - "scripts/investments_wes_lifecycle.py"
      - "scripts/verify_weekly_close_deadline.py"
      - "scripts/backtest_weekly_execution_parity_v5.py"
      - "scripts/apply_instrument_validation_gate.py"
      - "scripts/ensure_current_week_forecast.py"
      - "scripts/daily_position_review.py"
      - "scripts/audit_intraday_risk_exits.py"
      - "scripts/audit_weekly_model.py"
      - "scripts/audit_weekly_model_runtime.py"
      - "scripts/apply_manual_risk_exit_overrides.py"
      - "scripts/enforce_weekly_risk_exit_lock.py"
      - "scripts/render_weekly_public_pages.py"
      - "scripts/render_simple_investments.py"
      - "scripts/no_retroactive_execution.py"
      - "scripts/verify_no_retroactive_execution.py"
      - "scripts/investments-weekly-public.js"
      - "scripts/investments-weekly-governance.js"
      - "tests/test_investments_weekly_public.js"
      - "tests/test_investments_weekly_v5.py"
      - "tests/test_verify_weekly_close_deadline.py"
      - "tests/test_automation_workflow_ownership.py"
      - "tests/test_audit_weekly_integrity.py"
      - "tests/test_no_retroactive_execution.py"
      - "data/investments/manual_risk_exit_overrides.json"
      - "data/investments/public_quarantine.json"
      - "data/investments/methodology.json"
      - "data/investments/multi_instrument_exposure_policy.json"
      - ".github/workflows/investments-exposure-watch.yml"

permissions:
  contents: write

concurrency:
  group: investment-weekly-positions
  cancel-in-progress: false

jobs:
  monitor-governed-exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start immutable LIVE execution clock
        run: |
          echo "NO_RETROACTIVE_EXECUTION=1" >> "$GITHUB_ENV"
          echo "NO_RETROACTIVE_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Install market-data dependencies
        run: python -m pip install --upgrade pip yfinance pandas numpy

      - name: Settle due weekly or rolling WES positions before downstream work
        run: python scripts/investments_wes_lifecycle.py --mode close

      - name: Verify no weekly exposure survives its effective deadline
        run: python scripts/verify_weekly_close_deadline.py

      - name: Persist weekly exits before downstream audits through execution airlock
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --worktree -- data/investments/live_prices.json
          git add data/investments/weekly \
                  data/investments/multi_instrument_exposure_state_v5.json \
                  data/investments/multi_instrument_exposure_report_v5.json
          if git diff --cached --quiet; then
            echo "No weekly settlement change to persist."
          else
            python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
            git commit -m "Settle weekly paper positions at governed deadline"
            if ! git diff --quiet; then
              echo "::error::Settlement fast lane left unstaged files."
              git status --short
              exit 1
            fi
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main; then
                python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD^ --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
                if git push origin HEAD:main; then break; fi
              fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 8))
            done
          fi

      - name: Validate publication integrity code and execution invariant
        run: |
          node --check scripts/investments-weekly-public.js
          node --check scripts/investments-weekly-governance.js
          node --test tests/test_investments_weekly_public.js
          python -m py_compile scripts/investments_wes_lifecycle.py scripts/verify_weekly_close_deadline.py scripts/audit_weekly_model_runtime.py scripts/no_retroactive_execution.py scripts/verify_no_retroactive_execution.py
          python -m unittest \
            tests/test_audit_weekly_integrity.py \
            tests/test_investments_weekly_v5.py \
            tests/test_verify_weekly_close_deadline.py \
            tests.test_wes_lifecycle_expired_no_entry \
            tests.test_no_retroactive_execution \
            tests.test_automation_workflow_ownership.AutomationWorkflowOwnershipTests.test_weekly_settlement_paths_are_independent_queued_and_fail_closed

      - name: Recover a missing current-week paper forecast
        run: python scripts/ensure_current_week_forecast.py

      - name: Apply shared validation gate before any entry
        run: python scripts/apply_instrument_validation_gate.py

      - name: Apply confirmed missed threshold corrections
        run: python scripts/apply_manual_risk_exit_overrides.py

      - name: Fail-safe audit of all frozen SL TP levels
        run: python scripts/audit_intraday_risk_exits.py

      - name: Persist audited intraday risk exits before broad audits through execution airlock
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --worktree -- data/investments/live_prices.json
          git add data/investments/intraday_risk_audit.json \
                  data/investments/manual_risk_exit_overrides.json \
                  data/investments/model_audit.json \
                  data/investments/closed_week_manifest.json \
                  data/investments/weekly \
                  data/investments/multi_instrument_validation_v4.json \
                  data/investments/multi_instrument_exposure_state_v5.json \
                  data/investments/multi_instrument_exposure_report_v5.json \
                  pl/inwestycje/pozycje-tygodniowe.html \
                  en/investing/open-weekly-positions.html \
                  pl/inwestycje/prognozy-tygodniowe.html \
                  en/investing/weekly-forecasts.html
          if git diff --cached --quiet; then
            echo "No SL/TP or public-page changes to persist."
          else
            python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
            git commit -m "Apply 15-minute weekly position risk review"
            if ! git diff --quiet; then
              echo "::error::Risk review left unstaged files; refusing a partial publication."
              git status --short
              exit 1
            fi
            for attempt in 1 2 3; do
              if git pull --rebase origin main; then
                python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD^ --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
                if git push origin HEAD:main; then break; fi
              fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep $((attempt * 10))
            done
          fi

      - name: Govern same-week re-entry after SL or TP
        run: python scripts/enforce_weekly_risk_exit_lock.py

      - name: Audit ledger integrity before publication
        run: python scripts/audit_weekly_model_runtime.py

      - name: Render audited weekly positions dashboard
        run: python scripts/render_simple_investments.py

      - name: Process scheduled or material-event thesis review
        run: python scripts/daily_position_review.py

      - name: Re-evaluate exposure with NO_TRADE and WES re-entry gates
        run: python scripts/investments_wes_lifecycle.py --mode ensure-exposure

      - name: Re-apply shared validation gate as defense in depth
        run: python scripts/apply_instrument_validation_gate.py

      - name: Persist and verify v5 governance metadata
        run: python scripts/investments_weekly_v5_finalize.py

      - name: Re-audit ledger integrity after exposure changes
        run: python scripts/audit_weekly_model_runtime.py

      - name: Replay exact published execution ledger
        run: python scripts/backtest_weekly_execution_parity_v5.py

      - name: Render Polish and English public pages
        run: python scripts/render_simple_investments.py

      - name: Commit governed paper-position updates through NO RETROACTIVE airlock
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --worktree -- data/investments/live_prices.json
          git add data/investments/intraday_risk_audit.json \
                  data/investments/manual_risk_exit_overrides.json \
                  data/investments/model_audit.json \
                  data/investments/closed_week_manifest.json \
                  data/investments/weekly \
                  data/investments/daily_review_report.json \
                  data/investments/event_exit_requests.json \
                  data/investments/multi_instrument_exposure_state_v5.json \
                  data/investments/multi_instrument_exposure_report_v5.json \
                  data/investments/weekly_execution_parity_v5.json \
                  pl/inwestycje/pozycje-tygodniowe.html \
                  en/investing/open-weekly-positions.html \
                  pl/inwestycje/prognozy-tygodniowe.html \
                  en/investing/weekly-forecasts.html
          if git diff --cached --quiet; then
            echo "No governed exposure changes to commit."
          else
            # NO RETROACTIVE EXECUTION: this is the final publication boundary.
            python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
            git commit -m "Maintain governed weekly paper positions"
            if ! git diff --quiet; then
              echo "::error::Exposure update left unstaged files; refusing a partial publication."
              git status --short
              exit 1
            fi
            for attempt in 1 2 3; do
              if git pull --rebase origin main; then
                python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD^ --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
                if git push origin HEAD:main; then break; fi
              fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep $((attempt * 10))
            done
          fi
