name: Governed Weekly Paper Exposure Watch
# NO RETROACTIVE EXECUTION
# TR-05 canonical fast risk path: frozen SL/TP only. No entry authority.

on:
  workflow_dispatch:
  schedule:
    # 24/7 because BTC/USD trades through weekends. GitHub scheduling may be
    # delayed, so the monitor replays the full frozen-risk interval every run.
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/audit_intraday_risk_exits.py"
      - "scripts/investments_weekly_v2.py"
      - "scripts/enforce_weekly_risk_exit_lock.py"
      - "scripts/investments_weekly_v5_finalize.py"
      - "scripts/verify_weekly_close_deadline.py"
      - "scripts/audit_weekly_model_runtime.py"
      - "scripts/render_weekly_public_pages.py"
      - "scripts/render_simple_investments.py"
      - "scripts/no_retroactive_execution.py"
      - "scripts/verify_no_retroactive_execution.py"
      - "tests/test_audit_intraday_risk_exits.py"
      - "tests/test_automation_workflow_ownership.py"
      - "tests/test_no_retroactive_execution.py"
      - "data/investments/multi_instrument_exposure_policy.json"
      - "docs/weekly_trading_methodology_v4.md"
      - ".github/workflows/investments-exposure-watch.yml"

permissions:
  contents: write

concurrency:
  group: investment-weekly-positions
  cancel-in-progress: false

jobs:
  monitor-governed-exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start immutable LIVE execution clock
        run: |
          echo "NO_RETROACTIVE_EXECUTION=1" >> "$GITHUB_ENV"
          echo "NO_RETROACTIVE_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Validate canonical risk monitor on code changes
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          python -m py_compile \
            scripts/audit_intraday_risk_exits.py \
            scripts/investments_weekly_v2.py \
            scripts/enforce_weekly_risk_exit_lock.py \
            scripts/investments_weekly_v5_finalize.py \
            scripts/verify_weekly_close_deadline.py \
            scripts/no_retroactive_execution.py \
            scripts/verify_no_retroactive_execution.py
          python -m unittest \
            tests.test_audit_intraday_risk_exits \
            tests.test_no_retroactive_execution

      - name: Evaluate frozen SL/TP from canonical market evidence
        id: risk
        run: |
          set -euo pipefail
          python scripts/audit_intraday_risk_exits.py --persist-report on_close
          if git diff --quiet -- data/investments/weekly; then
            echo "risk_exit=false" >> "$GITHUB_OUTPUT"
          else
            echo "risk_exit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Govern re-entry state after a risk exit
        if: steps.risk.outputs.risk_exit == 'true'
        run: python scripts/enforce_weekly_risk_exit_lock.py

      - name: Finalize and verify closed risk state
        if: steps.risk.outputs.risk_exit == 'true'
        run: |
          python scripts/investments_weekly_v5_finalize.py
          python scripts/verify_weekly_close_deadline.py
          python scripts/audit_weekly_model_runtime.py
          python scripts/render_simple_investments.py

      - name: Persist risk exit atomically through NO RETROACTIVE airlock
        if: steps.risk.outputs.risk_exit == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Quote publication has a separate owner. Never let this fast safety
          # writer steal or overwrite live-price state.
          git restore --worktree -- data/investments/live_prices.json || true

          git add data/investments/intraday_risk_audit.json \
                  data/investments/model_audit.json \
                  data/investments/closed_week_manifest.json \
                  data/investments/weekly \
                  pl/inwestycje/pozycje-tygodniowe.html \
                  en/investing/open-weekly-positions.html \
                  pl/inwestycje/prognozy-tygodniowe.html \
                  en/investing/weekly-forecasts.html

          python scripts/verify_no_retroactive_execution.py \
            --baseline-ref HEAD \
            --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"

          git commit -m "Execute frozen Weekly SL TP threshold"

          if ! git diff --quiet; then
            echo "::error::Fast risk path left unstaged files; refusing partial publication."
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main; then
              python scripts/verify_no_retroactive_execution.py \
                --baseline-ref HEAD^ \
                --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
              if git push origin HEAD:main; then
                exit 0
              fi
            fi
            git rebase --abort || true
            sleep $((attempt * 4))
          done

          echo "::error::Could not persist Weekly risk exit after 5 attempts."
          exit 1
