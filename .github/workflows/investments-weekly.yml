name: Maintain Weekly Paper Positions
# NO RETROACTIVE EXECUTION

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "auto"
        type: choice
        options: [auto, forecast, close, ensure-exposure, render]
  schedule:
    - cron: "17 * * * *"
    # GitHub scheduled runs can be delayed. Add multiple Monday activation
    # opportunities across a UTC range that safely covers 08:00-10:00 Warsaw
    # in both CET and CEST without changing the execution decision timestamp.
    - cron: "4,19,34,49 5-10 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/investments_weekly*.py"
      - "scripts/investments_wes_lifecycle.py"
      - "scripts/ensure_current_week_forecast.py"
      - "scripts/daily_position_review.py"
      - "scripts/daily_review_completeness.py"
      - "scripts/apply_instrument_validation_gate.py"
      - "scripts/audit_weekly_model.py"
      - "scripts/audit_weekly_model_runtime.py"
      - "scripts/render_weekly_public_pages.py"
      - "scripts/render_simple_investments.py"
      - "scripts/investments-weekly-public.js"
      - "scripts/investments-weekly-governance.js"
      - "scripts/verify_weekly_close_deadline.py"
      - "scripts/no_retroactive_execution.py"
      - "scripts/verify_no_retroactive_execution.py"
      - "tests/test_investments_weekly*.py"
      - "tests/test_daily_review_completeness.py"
      - "tests/test_verify_weekly_close_deadline.py"
      - "tests/test_investments_weekly_public.js"
      - "tests/test_audit_weekly_integrity.py"
      - "tests/test_audit_weekly_model_runtime.py"
      - "tests/test_automation_workflow_ownership.py"
      - "tests/test_no_retroactive_execution.py"
      - "data/investments/public_quarantine.json"
      - "data/investments/methodology.json"
      - "data/investments/multi_instrument_exposure_policy.json"
      - "data/investments/daily_review_policy.json"
      - ".github/workflows/investments-weekly.yml"

permissions:
  contents: write

concurrency:
  group: investment-weekly-positions
  cancel-in-progress: false

jobs:
  maintain-weekly-positions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start immutable LIVE execution clock
        run: |
          echo "NO_RETROACTIVE_EXECUTION=1" >> "$GITHUB_ENV"
          echo "NO_RETROACTIVE_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Install market-data dependencies
        run: python -m pip install --upgrade pip yfinance pandas numpy
      - name: Fast integrity checks
        run: |
          python -m py_compile \
            scripts/investments_weekly.py scripts/investments_weekly_v2.py scripts/investments_weekly_v3.py \
            scripts/investments_weekly_v4.py scripts/investments_weekly_v5.py scripts/investments_weekly_macro.py \
            scripts/investments_wes_lifecycle.py scripts/ensure_current_week_forecast.py scripts/daily_position_review.py \
            scripts/daily_review_completeness.py scripts/apply_instrument_validation_gate.py scripts/audit_weekly_model_runtime.py \
            scripts/render_simple_investments.py scripts/verify_weekly_close_deadline.py \
            scripts/no_retroactive_execution.py scripts/verify_no_retroactive_execution.py
          node --check scripts/investments-weekly-public.js
          node --check scripts/investments-weekly-governance.js
          node --test tests/test_investments_weekly_public.js
          python -m unittest \
            tests/test_investments_weekly_v4.py tests/test_investments_weekly_v5.py tests/test_investments_weekly_macro.py \
            tests/test_daily_review_completeness.py tests/test_audit_weekly_integrity.py tests/test_verify_weekly_close_deadline.py \
            tests.test_audit_weekly_model_runtime tests.test_wes_lifecycle_expired_no_entry tests.test_no_retroactive_execution \
            tests.test_automation_workflow_ownership.AutomationWorkflowOwnershipTests.test_weekly_schedule_runs_full_lifecycle_and_blocks_weekend_exposure \
            tests.test_automation_workflow_ownership.AutomationWorkflowOwnershipTests.test_weekly_settlement_paths_are_independent_queued_and_fail_closed
      - name: Replace current-week placeholder with frozen model output
        run: python scripts/ensure_current_week_forecast.py
      - name: Apply paper-trading gate
        run: python scripts/apply_instrument_validation_gate.py
      - name: Run canonical governed WES lifecycle
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
        run: python scripts/investments_wes_lifecycle.py --mode "$MODE"
      - name: Review open positions and compute completeness
        run: |
          python scripts/daily_position_review.py
          python scripts/daily_review_completeness.py --current
      - name: Checkpoint daily review durably through NO RETROACTIVE airlock
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --worktree -- data/investments/live_prices.json || true
          git add data/investments
          if ! git diff --cached --quiet; then
            python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
            git commit -m "Checkpoint daily position review"
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main; then
                python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD^ --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
                if git push origin HEAD:main; then pushed=1; break; fi
              fi
              git rebase --abort || true
              sleep $((attempt * 4))
            done
            [[ "$pushed" == "1" ]] || { echo "::error::Could not persist daily-review checkpoint."; exit 1; }
          fi
          if ! git diff --quiet; then
            echo "::error::Daily-review checkpoint left unstaged files; refusing downstream lifecycle."
            git status --short
            exit 1
          fi
      - name: Enforce daily review completeness
        run: python scripts/daily_review_completeness.py --current --enforce --no-write
      - name: Restore governed exposure
        run: |
          python scripts/investments_wes_lifecycle.py --mode ensure-exposure
          python scripts/apply_instrument_validation_gate.py
      - name: Verify weekly position lifecycle and rolling deadlines
        run: python scripts/verify_weekly_close_deadline.py
      - name: Verify EURUSD macro governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path('data/investments/multi_instrument_exposure_policy.json').read_text(encoding='utf-8'))
          macro = policy.get('macro_context') or {}
          candidates = (policy.get('strategy_tournament') or {}).get('candidate_methods') or []
          assert macro.get('enabled') is True
          assert macro.get('oil_symbol') == 'CL=F'
          assert macro.get('us10y_symbol') == '^TNX'
          assert macro.get('require_both_sources') is True
          assert 'macro_weekly_blend' in candidates
          PY
      - name: Finalize, audit and render PL and EN
        run: |
          python scripts/investments_weekly_v5_finalize.py
          python scripts/audit_weekly_model_runtime.py
          python scripts/render_simple_investments.py
      - name: Commit weekly positions atomically through NO RETROACTIVE airlock
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --worktree -- data/investments/live_prices.json
          git add data/investments/weekly \
                  data/investments/daily_review_report.json data/investments/daily_review_completeness.json \
                  data/investments/event_exit_requests.json data/investments/model_audit.json data/investments/closed_week_manifest.json \
                  data/investments/multi_instrument_exposure_state.json data/investments/multi_instrument_exposure_report.json \
                  data/investments/multi_instrument_exposure_state_v5.json data/investments/multi_instrument_exposure_report_v5.json \
                  data/investments/multi_instrument_validation_v4.json \
                  pl/inwestycje.html pl/inwestycje/pozycje-tygodniowe.html pl/inwestycje/prognozy-tygodniowe.html \
                  en/investing.html en/investing/open-weekly-positions.html en/investing/weekly-forecasts.html
          if git diff --cached --quiet; then exit 0; fi
          python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
          git commit -m "Maintain governed weekly paper positions"
          if ! git diff --quiet; then
            echo "::error::Weekly generator left unstaged files; refusing partial publication."
            git status --short
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main; then
              python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD^ --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
              if git push; then exit 0; fi
            fi
            sleep $((attempt * 4))
          done
          exit 1
