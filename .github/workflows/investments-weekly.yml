name: Build Governed Investments Weekly Forecasts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "auto"
        type: choice
        options: [auto, forecast, close, ensure-exposure, render]
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/investments_weekly*.py"
      - "scripts/daily_position_review.py"
      - "scripts/apply_instrument_validation_gate.py"
      - "scripts/audit_weekly_model.py"
      - "scripts/backtest_weekly_execution_parity_v5.py"
      - "scripts/render_weekly_public_pages.py"
      - "scripts/render_simple_investments.py"
      - "scripts/investments-weekly-public.js"
      - "scripts/investments-weekly-governance.js"
      - "tests/test_investments_weekly*.py"
      - "tests/test_investments_weekly_public.js"
      - "tests/test_audit_weekly_integrity.py"
      - "data/investments/public_quarantine.json"
      - "data/investments/methodology.json"
      - "data/investments/multi_instrument_exposure_policy.json"
      - "data/investments/daily_review_policy.json"
      - ".github/workflows/investments-weekly.yml"

permissions:
  contents: write

concurrency:
  group: investment-weekly-positions
  cancel-in-progress: false

jobs:
  build-investments-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install market-data dependencies
        run: python -m pip install --upgrade pip yfinance pandas numpy

      - name: Validate public scripts
        run: |
          node --check scripts/investments-weekly-public.js
          node --check scripts/investments-weekly-governance.js
          node --test tests/test_investments_weekly_public.js

      - name: Test governed weekly rules
        run: |
          python -m unittest tests/test_investments_weekly_v4.py
          python -m unittest tests/test_investments_weekly_v5.py
          python -m unittest tests/test_audit_weekly_integrity.py

      - name: Recover missing current-week forecast
        run: python scripts/ensure_current_week_forecast.py

      - name: Apply shared paper-trading gate
        run: python scripts/apply_instrument_validation_gate.py

      - name: Open every missing weekly paper position
        run: python scripts/investments_weekly_v4.py --mode ensure-exposure

      - name: Run governed weekly model v5
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
        run: python scripts/investments_weekly_v5.py --mode "$MODE"

      - name: Once-daily thesis review and conditional close
        run: python scripts/daily_position_review.py

      - name: Restore continuous exposure after any close
        run: python scripts/investments_weekly_v4.py --mode ensure-exposure

      - name: Re-evaluate governed exposure
        run: python scripts/investments_weekly_v5.py --mode ensure-exposure

      - name: Re-apply shared paper-trading gate as defense in depth
        run: python scripts/apply_instrument_validation_gate.py

      - name: Verify every enabled instrument has an open or pending directional position
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo('Europe/Warsaw'))
          week_id = f"{now.isocalendar().year}-W{now.isocalendar().week:02d}"
          week = json.loads(Path(f'data/investments/weekly/{week_id}.json').read_text(encoding='utf-8'))
          policy = json.loads(Path('data/investments/multi_instrument_exposure_policy.json').read_text(encoding='utf-8'))
          required = {str(x['instrument_id']) for x in policy.get('instruments', []) if x.get('enabled')}
          rows = {str(x.get('instrument_id')): x for x in week.get('instruments', [])}
          errors = []
          for instrument_id in sorted(required):
              item = rows.get(instrument_id) or {}
              is_open = item.get('direction') in {'long', 'short'} and item.get('entry_price') is not None and item.get('exit_price') is None
              pending = item.get('pending_entry_decision') or {}
              pending_direction = (pending.get('decision') or {}).get('direction') in {'long', 'short'}
              if not is_open and not pending_direction:
                  errors.append(f'{instrument_id}: neither open nor pending directional entry')
          if errors:
              raise SystemExit('\n'.join(errors))
          print('Every enabled instrument is open or has a valid directional execution pending.')
          PY

      - name: Persist and verify v5 governance metadata
        run: python scripts/investments_weekly_v5_finalize.py

      - name: Audit model integrity and closed history
        run: python scripts/audit_weekly_model.py

      - name: Run scheduled base-model validation
        env:
          FORCE_BACKTEST: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/backtest_weekly_model_v2.py

      - name: Validate candidate methods separately
        run: python scripts/backtest_multi_strategy_v4.py

      - name: Replay exact published execution ledger
        run: python scripts/backtest_weekly_execution_parity_v5.py

      - name: Render Polish and English public pages
        run: python scripts/render_simple_investments.py

      - name: Commit validated weekly updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Quotes have a separate owner; weekly pages consume but never publish them.
          git restore --worktree -- data/investments/live_prices.json
          git add data/investments/weekly \
                  data/investments/daily_review_report.json \
                  data/investments/event_exit_requests.json \
                  data/investments/model_audit.json \
                  data/investments/closed_week_manifest.json \
                  data/investments/model_validation_v2.json \
                  data/investments/multi_instrument_exposure_state.json \
                  data/investments/multi_instrument_exposure_report.json \
                  data/investments/multi_instrument_exposure_state_v5.json \
                  data/investments/multi_instrument_exposure_report_v5.json \
                  data/investments/multi_instrument_validation_v4.json \
                  data/investments/weekly_execution_parity_v5.json \
                  pl/inwestycje.html \
                  pl/inwestycje/pozycje-tygodniowe.html \
                  pl/inwestycje/prognozy-tygodniowe.html \
                  en/investing.html \
                  en/investing/open-weekly-positions.html \
                  en/investing/weekly-forecasts.html
          if git diff --cached --quiet; then
            echo "No governed weekly changes to commit."
          else
            git commit -m "Maintain governed weekly paper positions"
            if ! git diff --quiet; then
              echo "::error::Weekly generator left unstaged files; refusing a partial publication."
              git status --short
              exit 1
            fi
            git pull --rebase origin main
            git push
          fi
