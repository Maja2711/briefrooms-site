name: Shadow Observatory Publication Validation

on:
  pull_request:
    paths:
      - ".github/workflows/shadow-engines-observatory.yml"
      - ".github/workflows/shadow-engines-watchdog.yml"
      - ".github/workflows/shadow-engines-observatory-validation.yml"
      - "scripts/build_shadow_engines_public.py"
      - "scripts/publish_shadow_snapshot.py"
      - "scripts/shadow_engines_watchdog.py"
      - "scripts/central-lab.js"
      - "tests/test_shadow_engines_public.py"
      - "tests/test_shadow_engines_observatory_workflow.py"
      - "tests/test_shadow_engines_watchdog.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Shadow status publication and independent alarm
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/build_shadow_engines_public.py \
            scripts/publish_shadow_snapshot.py \
            scripts/shadow_engines_watchdog.py
          python -m unittest \
            tests.test_shadow_engines_public \
            tests.test_shadow_engines_observatory_workflow \
            tests.test_shadow_engines_watchdog -v
          node --check scripts/central-lab.js
