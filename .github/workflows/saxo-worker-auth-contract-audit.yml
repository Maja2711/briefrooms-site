name: Audit Saxo Worker authentication contract (metadata only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/saxo-worker-auth-contract-audit.yml"

permissions:
  contents: read

concurrency:
  group: audit-saxo-worker-auth-contract
  cancel-in-progress: true

jobs:
  audit-worker-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect private Worker auth implementation without source disclosure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          if not account or not token:
              print("RESULT=BLOCKED_MISSING_CLOUDFLARE_API_SECRETS")
              raise SystemExit(1)

          base = ("https://api.cloudflare.com/client/v4/accounts/" + account +
                  "/workers/scripts/briefrooms-saxo-eurusd")

          def read(endpoint):
              req = urllib.request.Request(
                  endpoint, headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/json" if endpoint.endswith("/settings") else "*/*",
                  })
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      return "HTTP_" + str(response.status), response.read(2000000)
              except urllib.error.HTTPError as exc:
                  return "HTTP_" + str(exc.code), None
              except Exception:
                  return "NETWORK_ERROR", None

          code_status, source_bytes = read(base)
          print("WORKER_CODE_API_STATUS=" + code_status)
          if code_status == "HTTP_200" and source_bytes is not None:
              # Never print, publish or persist the Worker source. Multipart
              # responses are inspected in memory with only boolean outputs.
              source = source_bytes.decode("utf-8", errors="replace")
              checks = {
                  "STATUS_ROUTE_REFERENCE": bool(re.search(r'[/]status', source, re.I)),
                  "BASIC_SCHEME_REFERENCE": bool(re.search(r'Basic\\s|Basic |basicAuth', source, re.I)),
                  "COOKIE_OR_SESSION_REFERENCE": bool(re.search(r'cookie|session', source, re.I)),
                  "ADMIN_PASSWORD_REFERENCE": "SAXO_ADMIN_PASSWORD" in source,
                  "ACCESS_SERVICE_HEADER_REFERENCE": bool(re.search(r'CF-Access-Client-(?:Id|Secret)', source, re.I)),
              }
              for name, found in checks.items():
                  print(name + "=" + ("YES" if found else "NO"))
              print("SOURCE_DISCLOSURE=NONE")
          else:
              print("SOURCE_INSPECTION=BLOCKED")

          settings_status, settings_bytes = read(base + "/settings")
          print("WORKER_SETTINGS_API_STATUS=" + settings_status)
          if settings_status == "HTTP_200" and settings_bytes is not None:
              try:
                  payload = json.loads(settings_bytes)
                  bindings = payload.get("result", {}).get("bindings") or []
                  present = any(
                      isinstance(binding, dict) and binding.get("name") == "SAXO_ADMIN_PASSWORD"
                      for binding in bindings
                  )
                  print("SAXO_ADMIN_PASSWORD_BINDING_PRESENT=" + ("YES" if present else "NO"))
              except (TypeError, ValueError, AttributeError):
                  print("SETTINGS_CONTRACT=UNREADABLE")

          if code_status != "HTTP_200":
              print("RESULT=WORKER_SOURCE_NOT_READABLE_WITH_EXISTING_TOKEN")
              raise SystemExit(2)
          print("RESULT=WORKER_AUTH_CONTRACT_METADATA_COLLECTED")
          PY
