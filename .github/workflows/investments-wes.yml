name: Weekly Engine Star

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/instrument_registry.py"
      - "scripts/investments_weekly_v2.py"
      - "scripts/investments_weekly_v3.py"
      - "scripts/investments_weekly_v4.py"
      - "scripts/investments_weekly_v5.py"
      - "scripts/investments_weekly_macro.py"
      - "scripts/investments_weekly_ma_structure.py"
      - "scripts/investments_wes.py"
      - "scripts/investments_wes_runner.py"
      - "scripts/investments_wes_memory.py"
      - "scripts/investments_wes_spx_brace_bridge.py"
      - "scripts/investments_wes_counterfactual.py"
      - "scripts/investments-wes-public.js"
      - "scripts/render_weekly_public_pages.py"
      - "tests/test_instrument_registry.py"
      - "tests/test_instrument_registry_wes_integration.py"
      - "tests/test_investments_wes.py"
      - "tests/test_investments_wes_memory.py"
      - "tests/test_investments_wes_spx_brace_bridge.py"
      - "tests/test_investments_wes_counterfactual.py"
      - "tests/test_investments_wes_counterfactual_deadline.py"
      - "data/investments/methodology.json"
      - "data/investments/multi_instrument_exposure_policy.json"
      - "data/investments/wes_methodology.json"
      - ".github/workflows/investments-wes.yml"
  workflow_run:
    workflows: ["Governed Weekly Paper Exposure Watch"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: investment-weekly-positions
  cancel-in-progress: false

jobs:
  wes-cycle:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip yfinance pandas numpy
      - name: Validate WES code and canonical instrument routing
        run: |
          python -m py_compile \
            scripts/instrument_registry.py \
            scripts/investments_weekly_v2.py \
            scripts/investments_weekly_v3.py \
            scripts/investments_weekly_v4.py \
            scripts/investments_weekly_v5.py \
            scripts/investments_weekly_macro.py \
            scripts/investments_weekly_ma_structure.py \
            scripts/investments_wes.py \
            scripts/investments_wes_runner.py \
            scripts/investments_wes_memory.py \
            scripts/investments_wes_spx_brace_bridge.py \
            scripts/investments_wes_counterfactual.py
          python scripts/instrument_registry.py --validate-wes
          python -m unittest tests.test_instrument_registry -v
          python -m unittest tests.test_instrument_registry_wes_integration -v
          node --check scripts/investments-wes-public.js
          python -m unittest \
            tests/test_investments_wes.py \
            tests/test_investments_wes_memory.py \
            tests/test_investments_wes_spx_brace_bridge.py \
            tests/test_investments_wes_counterfactual.py \
            tests/test_investments_wes_counterfactual_deadline.py
      - name: WES preflight trigger gate
        run: python scripts/investments_wes_runner.py --mode preflight
      - name: Execute governed v5 decision after WES admission gate
        run: python scripts/investments_weekly_v5.py --mode ensure-exposure
      - name: Read BRACE-SPX G6 shadow snapshot in read-only mode
        run: |
          set +e
          git fetch --no-tags --depth=1 origin brace-spx-research:refs/remotes/origin/brace-spx-research
          git show refs/remotes/origin/brace-spx-research:data/shadow/brace_spx_generation6_shadow.json > /tmp/brace_spx_generation6_shadow.json
          if [ ! -s /tmp/brace_spx_generation6_shadow.json ]; then
            rm -f /tmp/brace_spx_generation6_shadow.json
          fi
          set -e
      - name: Freeze V5 counterfactual and BRACE-SPX point-in-time state
        run: |
          python scripts/investments_wes_spx_brace_bridge.py \
            --stage pre-wes \
            --brace-shadow /tmp/brace_spx_generation6_shadow.json
      - name: Freeze self-contained V5 replay contract
        run: python scripts/investments_wes_counterfactual.py --stage freeze
      - name: Freeze WES adaptive TP and SL after any new entry
        run: python scripts/investments_wes_runner.py --mode postflight
      - name: Freeze actual WES plan without BRACE-SPX influence
        run: |
          python scripts/investments_wes_spx_brace_bridge.py \
            --stage post-wes \
            --brace-shadow /tmp/brace_spx_generation6_shadow.json
      - name: Replay frozen V5 baseline and measure incremental alpha
        run: python scripts/investments_wes_counterfactual.py --stage evaluate
      - name: Refresh derived WES historical memory
        run: |
          python scripts/investments_wes_memory.py --write
          python scripts/investments_wes_memory.py --check
      - name: Verify no weekly exposure survives its deadline
        run: python scripts/verify_weekly_close_deadline.py
      - name: Render WES public status
        run: python scripts/render_simple_investments.py
      - name: Commit WES state and public pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --worktree -- data/investments/live_prices.json || true
          git add data/investments/weekly \
                  data/investments/wes_report.json \
                  data/investments/wes_learning.json \
                  data/investments/wes_historical_memory.json \
                  data/investments/wes_memory_report.json \
                  data/investments/wes_spx_brace_bridge.json \
                  data/investments/wes_spx_brace_alpha_report.json \
                  data/investments/wes_incremental_alpha_report.json \
                  data/investments/multi_instrument_exposure_state_v5.json \
                  data/investments/multi_instrument_exposure_report_v5.json \
                  pl/inwestycje/pozycje-tygodniowe.html \
                  en/investing/open-weekly-positions.html \
                  pl/inwestycje/prognozy-tygodniowe.html \
                  en/investing/weekly-forecasts.html
          if ! git diff --quiet; then
            echo "Unexpected unstaged WES changes block safe rebase:"
            git status --short
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No WES change to commit."
            exit 0
          fi
          git commit -m "Run Weekly Engine Star cycle"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
