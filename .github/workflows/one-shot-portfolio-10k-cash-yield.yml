name: One-shot Portfolio 10K cash yield integration

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/portfolio_10k_cash_yield.py"
      - "scripts/build_portfolio_10k_usd.py"
      - "scripts/patch_portfolio_10k_cash_yield_once.py"
      - "tests/test_portfolio_10k_cash_yield.py"
      - "data/portfolio10k/cash_yield_policy.json"
      - ".github/workflows/one-shot-portfolio-10k-cash-yield.yml"
  push:
    branches: [main]
    paths:
      - "scripts/portfolio_10k_cash_yield.py"
      - "scripts/build_portfolio_10k_usd.py"
      - "scripts/patch_portfolio_10k_cash_yield_once.py"
      - "tests/test_portfolio_10k_cash_yield.py"
      - "data/portfolio10k/cash_yield_policy.json"
      - ".github/workflows/one-shot-portfolio-10k-cash-yield.yml"

permissions:
  contents: write

concurrency:
  group: portfolio-10k-cash-yield-integration
  cancel-in-progress: false

jobs:
  validate-and-integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply deterministic integration patch in workspace
        run: python scripts/patch_portfolio_10k_cash_yield_once.py

      - name: Validate cash ledgers and public UI
        run: |
          python -m py_compile \
            scripts/portfolio_10k_cash_yield.py \
            scripts/build_portfolio_10k_usd.py \
            scripts/render_portfolio_10k_static.py \
            scripts/patch_portfolio_10k_cash_yield_once.py
          python -m unittest tests.test_portfolio_10k_cash_yield -v
          python scripts/build_portfolio_10k_usd.py
          python scripts/render_portfolio_10k_static.py
          node --check scripts/portfolio-10k-dashboard.js
          node --check scripts/portfolio-10k-dashboard-en.js
          grep -q 'portfolio-10k-dashboard.css?v=5' pl/inwestycje/portfel-10k.html
          grep -q 'portfolio-10k-dashboard.css?v=5' en/investing/portfolio-10k.html
          grep -q 'portfolio-10k-dashboard.js?v=10' pl/inwestycje/portfel-10k.html
          grep -q 'portfolio-10k-dashboard-en.js?v=10' en/investing/portfolio-10k.html
          grep -q "cashYield.label_pl" scripts/portfolio-10k-dashboard.js
          grep -q "cashYield.label_en" scripts/portfolio-10k-dashboard-en.js
          grep -q "dataStatus.classList.add('is-active')" scripts/portfolio-10k-dashboard.js

      - name: Commit integrated production files and remove one-shot helpers
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-portfolio-10k-cash-yield.yml
          rm -f scripts/patch_portfolio_10k_cash_yield_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/portfolio-10k-hourly-prices.yml \
                  .github/workflows/investment-room-production-audit.yml \
                  assets/portfolio-10k-dashboard.css \
                  scripts/portfolio-10k-dashboard.js \
                  scripts/portfolio-10k-dashboard-en.js \
                  scripts/patch_portfolio_10k_hourly_ui.py \
                  scripts/render_portfolio_10k_static.py \
                  tests/test_investment_room_resilience.py \
                  tests/test_automation_workflow_ownership.py \
                  pl/inwestycje/portfel-10k.html \
                  en/investing/portfolio-10k.html \
                  data/investments/portfolio_10k_usd.json \
                  .github/workflows/one-shot-portfolio-10k-cash-yield.yml \
                  scripts/patch_portfolio_10k_cash_yield_once.py
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git commit -m "Integrate Portfolio 10K central-bank cash yield"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
          exit 1

# manual trigger: 2026-08-10T20:38+02:00
