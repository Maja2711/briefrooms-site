name: Close Belief Lab public entry

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/close-belief-lab.yml"

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove public Belief Lab entry
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pl/inwestycje.html')
          source = path.read_text(encoding='utf-8')
          block = '''  <a class="belief-lab-entry" href="/pl/belief-lab.html" aria-label="Otwórz Belief Lab">
    <span class="belief-lab-copy">
      <span class="belief-lab-kicker">Laboratorium AI · Shadow mode</span>
      <h2>Belief Lab — Belief Core</h2>
      <p>World State, probability vs confidence, evidence, provenance, sprzeczności, audit i kalibracja. Laboratorium obserwuje — nie steruje jeszcze strategiami.</p>
    </span>
    <b>Otwórz Belief Lab →</b>
  </a>

'''
          if block not in source:
              raise SystemExit('Belief Lab public entry block not found; refusing broad edit')
          path.write_text(source.replace(block, '', 1), encoding='utf-8')
          PY
          if grep -Fq '/pl/belief-lab.html' pl/inwestycje.html; then
            echo 'Belief Lab link still present' >&2
            exit 1
          fi
      - name: Commit removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pl/inwestycje.html
          git commit -m "Remove public Belief Lab entry"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
              git rebase origin/main
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
