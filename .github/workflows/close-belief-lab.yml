name: Close Belief Lab public entry

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/close-belief-lab.yml"

permissions:
  contents: write

jobs:
  close-belief-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove public Belief Lab entry
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('pl/inwestycje.html')
          source = path.read_text(encoding='utf-8')
          pattern = r'\n  <a class="belief-lab-entry" href="/pl/belief-lab\.html" aria-label="Otwórz Belief Lab">.*?</a>\n'
          updated, count = re.subn(pattern, '\n', source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected exactly one Belief Lab public entry, found {count}')
          path.write_text(updated, encoding='utf-8')
          PY
          if grep -Fq '/pl/belief-lab.html' pl/inwestycje.html; then
            echo 'Belief Lab link still present' >&2
            exit 1
          fi
      - name: Commit removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pl/inwestycje.html
          git commit -m "Remove public Belief Lab entry"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
              git rebase origin/main
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
