name: Investment Room Live Diagnostic

on:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - 'data/investments/nav-real-click-trigger.txt'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event_name == 'push' || github.event.issue.title == 'Diagnose live Investment Room'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Diagnose PL and EN production rooms with real pointer clicks
        run: |
          node <<'JS'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const urls = {
            pl: 'https://briefrooms.com/pl/inwestycje/portfel-10k.html',
            en: 'https://briefrooms.com/en/investing/portfolio-10k.html'
          };
          const tabs = ['overview','portfolio','benchmark','agents','projections','rules','brace','analytics','history'];
          (async () => {
            const browser = await chromium.launch({headless:true});
            const report = {schema_version:'investment-room-live-diagnostic-v2', checked_at:new Date().toISOString(), pages:{}};
            for (const [lang, base] of Object.entries(urls)) {
              const context = await browser.newContext({viewport:{width:1680,height:936}});
              const page = await context.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              const failedRequests = [];
              page.on('console', msg => { if (msg.type()==='error') consoleErrors.push(msg.text()); });
              page.on('pageerror', err => pageErrors.push(String(err && err.stack || err)));
              page.on('requestfailed', req => failedRequests.push({url:req.url(), error:req.failure()?.errorText || ''}));
              let gotoError = null;
              try {
                await page.goto(`${base}?diag=${Date.now()}`, {waitUntil:'domcontentloaded', timeout:30000});
                await page.waitForTimeout(12000);
              } catch (e) { gotoError = String(e && e.message || e); }
              const info = await page.evaluate(() => ({
                title: document.title,
                datasets: {...document.body.dataset},
                data_status:(document.querySelector('#data-status')?.textContent || '').trim(),
                value:(document.querySelector('#portfolio-value')?.textContent || '').trim(),
                positions:(document.querySelector('#positions-count')?.textContent || '').trim(),
                scripts:[...document.scripts].map(s=>s.src).filter(Boolean),
                htmlLang:document.documentElement.lang,
                stableGlobal:!!window.BriefRoomsInvestmentRoom,
                guard:document.body.dataset.investmentNavigationGuard || ''
              })).catch(e => ({evaluate_error:String(e && e.message || e)}));
              const tabResults = {};
              for (const name of tabs) {
                const selector = `.i10k-tabs [data-tab="${name}"]`;
                const loc = page.locator(selector).first();
                try {
                  await loc.scrollIntoViewIfNeeded();
                  const box = await loc.boundingBox();
                  if (!box) { tabResults[name] = {exists:false}; continue; }
                  const x = box.x + box.width/2, y = box.y + box.height/2;
                  const before = await page.evaluate(({x,y,name}) => {
                    const hit=document.elementFromPoint(x,y);
                    const chain=[]; let n=hit;
                    while(n && chain.length<7){
                      const s=getComputedStyle(n);
                      chain.push({tag:n.tagName,id:n.id||'',cls:String(n.className||''),tab:n.closest?.('[data-tab]')?.dataset?.tab||'',pointer:s.pointerEvents,z:s.zIndex,pos:s.position});
                      n=n.parentElement;
                    }
                    return {hash:location.hash,hit:chain,targetRect:document.querySelector(`.i10k-tabs [data-tab="${name}"]`)?.getBoundingClientRect().toJSON?.()||null};
                  }, {x,y,name});
                  await page.mouse.click(x,y);
                  await page.waitForTimeout(350);
                  const after = await page.evaluate((name) => {
                    const p=document.querySelector(`.i10k-panel[data-panel="${name}"]`);
                    return {
                      hash:location.hash,
                      active:!!p?.classList.contains('active'),
                      display:p?getComputedStyle(p).display:'missing',
                      visible:!!p && p.getBoundingClientRect().height>0 && getComputedStyle(p).display!=='none',
                      bodyActive:document.body.dataset.investmentActiveTab||'',
                      guard:document.body.dataset.investmentNavigationGuard||''
                    };
                  }, name);
                  tabResults[name] = {exists:true,before,after};
                } catch(e) {
                  tabResults[name] = {exists:true,error:String(e && e.message || e)};
                }
              }
              const ai = await page.evaluate(() => {
                const p=document.querySelector('.i10k-panel[data-panel="agents"]');
                return {
                  text:(p?.innerText||'').slice(0,1500),
                  cards:document.querySelectorAll('#agent-cards > *').length,
                  preview:document.querySelectorAll('#agents-preview > *').length,
                  tournamentNodes:document.querySelectorAll('[data-ai-tournament-ui], .ai-tournament, .agent-card, .agent-ranking').length
                };
              }).catch(()=>({}));
              report.pages[lang] = {...info, gotoError, consoleErrors, pageErrors, failedRequests, tabResults, ai};
              await page.screenshot({path:`/tmp/${lang}-room-real-click.png`, fullPage:true}).catch(()=>{});
              await context.close();
            }
            await browser.close();
            fs.mkdirSync('data/investments', {recursive:true});
            fs.writeFileSync('data/investments/investment_room_live_diagnostic.json', JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify(report,null,2));
          })().catch(err => { console.error(err); process.exit(1); });
          JS
      - name: Publish diagnostic
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/investments/investment_room_live_diagnostic.json
          git commit -m 'Record live Investment Room pointer diagnostic' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
