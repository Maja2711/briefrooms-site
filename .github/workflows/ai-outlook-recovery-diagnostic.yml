name: Diagnose AI Outlook Recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-outlook-recovery-diagnostic.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_GENERATION_MODEL: gemini-3.5-flash-lite
      GEMINI_REVIEW_MODEL: gemini-3.5-flash-lite
      GEMINI_MIN_INTERVAL_SECONDS: "8"
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: pip install requests

      - name: Generate candidate diagnostics only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import requests
          import sitecustomize  # activates the Gemini adapter
          from comment_quality import get_ai_runtime, request_json_completion
          import ai_outlook_pl_methodology as plm
          import update_ai_outlook_v3 as v3

          moment = datetime.now(ZoneInfo('Europe/Warsaw'))
          publication_date = moment.date().isoformat()
          items = v3.source_items('pl')
          recent = v3.recent_titles('pl')
          runtime = get_ai_runtime()
          raw = request_json_completion(
              post=requests.post,
              runtime=runtime,
              messages=plm.candidate_messages(items, recent, publication_date),
              max_tokens=3600,
              temperature=0.20,
              timeout=90,
          )
          parsed = plm.parse_candidates(raw)
          rows = []
          for candidate in parsed:
              resolution = candidate.get('resolution') if isinstance(candidate.get('resolution'), dict) else {}
              rows.append({
                  'candidate_id': candidate.get('candidate_id'),
                  'area': candidate.get('area'),
                  'content_category': candidate.get('content_category'),
                  'forecast_type': candidate.get('forecast_type'),
                  'source_ids': candidate.get('source_ids'),
                  'reason': plm.candidate_rejection_reason(candidate, items, publication_date),
                  'resolution': {
                      'metric_present': bool(resolution.get('metric')),
                      'operator': resolution.get('comparison_operator'),
                      'baseline_value': resolution.get('baseline_value'),
                      'threshold': resolution.get('threshold'),
                      'unit': resolution.get('unit'),
                      'baseline_date': resolution.get('baseline_date'),
                      'resolution_date': resolution.get('resolution_date'),
                      'verification_url': resolution.get('verification_url'),
                      'verification_source': resolution.get('data_source_for_verification'),
                  },
                  'scores': {
                      key: candidate.get(key)
                      for key in (
                          'evidence_quality','measurability','causal_strength',
                          'verifiability','novelty','speculation_risk'
                      )
                  },
                  'why_now_present': bool(str(candidate.get('why_now') or '').strip()),
                  'causal_chain_present': bool(str(candidate.get('causal_chain') or '').strip()),
              })
          payload = {
              'schema_version': 'ai-outlook-candidate-diagnostic-v1',
              'date': publication_date,
              'provider': runtime.provider,
              'source_count': len(items),
              'candidate_count': len(parsed),
              'accepted_count': sum(row['reason'] is None for row in rows),
              'candidates': rows,
          }
          Path('data/ai_outlook_candidate_diagnostic.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(payload, ensure_ascii=False))
          PY

      - name: Publish diagnostic
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai_outlook_candidate_diagnostic.json
          git commit -m "Record AI Outlook candidate rejection codes"
          git pull --rebase origin main
          git push origin HEAD:main
