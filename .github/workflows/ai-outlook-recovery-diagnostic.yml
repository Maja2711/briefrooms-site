name: Diagnose AI Outlook Recovery

# Temporary diagnostic refreshed after Gemini JSON normalization.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-outlook-recovery-diagnostic.yml"

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read latest AI Outlook run and jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ai-outlook-gemini.yml/runs?branch=main&per_page=10" \
            > /tmp/runs.json
          RUN_ID="$(python - <<'PY'
          import json
          runs=json.load(open('/tmp/runs.json')).get('workflow_runs',[])
          print(runs[0]['id'] if runs else '')
          PY
          )"
          if [[ -z "$RUN_ID" ]]; then
            echo 'No AI Outlook workflow run found' >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=20" \
            > /tmp/jobs.json
          python - <<'PY'
          import json
          from pathlib import Path
          runs=json.load(open('/tmp/runs.json')).get('workflow_runs',[])
          run=runs[0]
          jobs=json.load(open('/tmp/jobs.json')).get('jobs',[])
          out={
            'schema_version':'ai-outlook-recovery-diagnostic-v1',
            'run':{
              'id':run.get('id'),
              'status':run.get('status'),
              'conclusion':run.get('conclusion'),
              'event':run.get('event'),
              'created_at':run.get('created_at'),
              'updated_at':run.get('updated_at'),
              'head_sha':run.get('head_sha'),
              'html_url':run.get('html_url'),
            },
            'jobs':[
              {
                'id':job.get('id'),
                'name':job.get('name'),
                'status':job.get('status'),
                'conclusion':job.get('conclusion'),
                'steps':[
                  {'name':step.get('name'),'status':step.get('status'),'conclusion':step.get('conclusion')}
                  for step in job.get('steps',[])
                ],
              }
              for job in jobs
            ],
          }
          path=Path('data/ai_outlook_recovery_diagnostic.json')
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False))
          PY

      - name: Publish diagnostic
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai_outlook_recovery_diagnostic.json
          git commit -m "Record AI Outlook recovery diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
