name: Emergency W32 Paper Positions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/investments-w32-emergency.yml"

permissions:
  contents: write

concurrency:
  group: investments-w32-emergency
  cancel-in-progress: true

jobs:
  recover-w32:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install market-data dependencies
        run: python -m pip install --upgrade pip yfinance pandas numpy

      - name: Validate entry engine syntax
        run: |
          python -m py_compile \
            scripts/investments_weekly.py \
            scripts/investments_weekly_v2.py \
            scripts/investments_weekly_v3.py \
            scripts/investments_weekly_v4.py \
            scripts/investments_weekly_v5.py \
            scripts/ensure_current_week_forecast.py \
            scripts/render_simple_investments.py

      - name: Replace W32 placeholder and open governed paper positions
        run: |
          set -euo pipefail
          python scripts/ensure_current_week_forecast.py
          python scripts/apply_instrument_validation_gate.py
          python scripts/investments_weekly_v4.py --mode ensure-exposure
          python scripts/investments_weekly_v5.py --mode ensure-exposure
          python scripts/investments_weekly_v4.py --mode ensure-exposure
          python scripts/investments_weekly_v5_finalize.py
          python scripts/render_simple_investments.py

      - name: Require three directional positions or honest pending executions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/investments/weekly/2026-W32.json')
          week = json.loads(path.read_text(encoding='utf-8'))
          required = {'eurusd', 'sp500_futures', 'btcusd'}
          rows = {str(row.get('instrument_id')): row for row in week.get('instruments', [])}
          problems = []
          for instrument_id in sorted(required):
              row = rows.get(instrument_id) or {}
              opened = row.get('direction') in {'long', 'short'} and row.get('entry_price') is not None and row.get('exit_price') is None
              pending = row.get('pending_entry_decision') or {}
              pending_direction = (pending.get('decision') or {}).get('direction') in {'long', 'short'}
              if not opened and not pending_direction:
                  problems.append(f'{instrument_id}: no directional open or pending paper entry')
          if problems:
              raise SystemExit('\n'.join(problems))
          print('W32 has a governed directional open or pending paper entry for all three instruments.')
          PY

      - name: Commit W32 and both language pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --worktree -- data/investments/live_prices.json || true
          git add data/investments/weekly/2026-W32.json \
                  data/investments/multi_instrument_exposure_state.json \
                  data/investments/multi_instrument_exposure_report.json \
                  data/investments/multi_instrument_exposure_state_v5.json \
                  data/investments/multi_instrument_exposure_report_v5.json \
                  data/investments/multi_instrument_validation_v4.json \
                  pl/inwestycje.html \
                  pl/inwestycje/pozycje-tygodniowe.html \
                  pl/inwestycje/prognozy-tygodniowe.html \
                  en/investing.html \
                  en/investing/open-weekly-positions.html \
                  en/investing/weekly-forecasts.html
          if git diff --cached --quiet; then
            echo "No W32 change to publish."
            exit 0
          fi
          git commit -m "Open governed W32 weekly paper positions"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
