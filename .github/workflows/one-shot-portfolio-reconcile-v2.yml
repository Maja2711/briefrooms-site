name: One-shot Portfolio 10K trade reconciliation v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-portfolio-reconcile-v2.yml"

permissions:
  contents: write

concurrency:
  group: portfolio-10k-reconcile-v2
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconcile all executed BRACE allocation actions
        run: |
          python scripts/reconcile_portfolio_10k_executions.py
          python scripts/build_portfolio_10k_usd.py
          python scripts/fix_portfolio_10k_usd_reviews.py
          python scripts/render_portfolio_10k_static.py
      - name: Validate public and paper accounting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pub=json.loads(Path('data/investments/portfolio_10k.json').read_text())
          paper=json.loads(Path('data/portfolio10k/paper_portfolio.json').read_text())
          orders=json.loads(Path('data/portfolio10k/paper_orders.json').read_text())
          pp={str(p.get('id') or p.get('instrument_id')):p for p in paper.get('positions',[])}
          up={str(p.get('id') or p.get('instrument_id')):p for p in pub.get('positions',[])}
          executed=[o for o in orders.get('orders',[]) if o.get('status')=='PAPER_EXECUTED']
          for o in executed:
              if o.get('action')=='REDUCE':
                  iid=str(o.get('sell_instrument'))
                  assert iid in pp and iid in up
                  assert abs(float(pp[iid]['quantity'])-float(up[iid]['quantity'])) < 1e-8
              if o.get('action')=='ADD':
                  iid=str(o.get('buy_instrument'))
                  assert iid in pp and iid in up
                  assert abs(float(pp[iid]['quantity'])-float(up[iid]['quantity'])) < 1e-8
          assert abs(float(pub['cash_pln'])-float(paper['cash_pln'])) < 0.01
          active=sum(float(p.get('current_value_pln') or 0) for p in pub.get('positions',[]) if p.get('status')=='active')
          assert abs(round(active+float(pub['cash_pln']),2)-float(pub['total_value_pln'])) < 0.01
          assert 8000 < float(pub['total_value_pln']) < 12000
          assert (pub.get('cash_yield') or {}).get('benchmark')=='NBP_REFERENCE_RATE'
          print('Reconciled:', pub['total_value_pln'], pub['cash_pln'], pub.get('execution_reconciliation'))
          PY
      - name: Commit corrected state and remove one-shot workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-portfolio-reconcile-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/portfolio_10k.json \
                  data/investments/portfolio_10k_usd.json \
                  pl/inwestycje/portfel-10k.html \
                  en/investing/portfolio-10k.html \
                  .github/workflows/one-shot-portfolio-reconcile-v2.yml
          git commit -m "Reconcile Portfolio 10K executed allocation changes"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 4))
          done
          exit 1
