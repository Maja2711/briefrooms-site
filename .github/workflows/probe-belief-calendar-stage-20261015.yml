name: Probe Belief calendar and stage times (read only)
on:
  pull_request:
    paths: [".github/workflows/probe-belief-calendar-stage-20261015.yml"]
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect production Belief and Daily recent runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,subprocess,tempfile
          base="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]
          auth=["-H","Authorization: Bearer "+os.environ["GH_TOKEN"],"-H","Accept: application/vnd.github+json"]
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"}),timeout=18) as resp:
                  return json.load(resp)
          for workflow in ("belief-core-shadow-live.yml","belief-epistemic-state.yml","daily-eurusd-monitor.yml","daily-eurusd-cycle-watchdog.yml"):
              rows=get("/actions/workflows/"+workflow+"/runs?branch=main&per_page=6").get("workflow_runs",[])
              print("SLA_WORKFLOW",workflow,flush=True)
              for run in rows[:4]:
                  print("SLA_RUN",json.dumps({k:run.get(k) for k in ("id","created_at","updated_at","event","status","conclusion","html_url")}),flush=True)
                  if workflow!="belief-core-shadow-live.yml" or run.get("created_at","")<"2026-10-15T18:05:00Z" or run.get("status")!="completed":
                      continue
                  jobs=get("/actions/runs/"+str(run["id"])+"/jobs?per_page=10").get("jobs",[])
                  for job in jobs:
                      print("SLA_JOB",json.dumps({k:job.get(k) for k in ("id","status","conclusion","started_at","completed_at")}),flush=True)
                      if job.get("conclusion")!="success":continue
                      with tempfile.NamedTemporaryFile(suffix=".log") as f:
                          curl=subprocess.run(["curl","-fsSL","-L",*auth,base+"/actions/jobs/"+str(job["id"])+"/logs","-o",f.name],capture_output=True)
                          if curl.returncode:
                              print("SLA_LOG_DOWNLOAD_ERROR",curl.stderr.decode(errors="replace")[:120],flush=True)
                              continue
                          data=open(f.name,"r",encoding="utf8",errors="replace").read()
                      for line in data.splitlines():
                          if any(x in line for x in ("BELIEF_STAGE_TIMING {","BELIEF_CYCLE_TIMINGS {","BELIEF_VERIFICATION_DEFERRED {","eurusd_macro_calendar_coverage","EURUSD_BELIEF_FRESHNESS")) and not "\\x1b[36;1m" in line:
                              print("SLA_LOG",line[:3000],flush=True)
          PY
