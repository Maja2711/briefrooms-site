name: Deploy BRACE decision context UI

on:
  push:
    paths:
      - '.github/workflows/one-shot-brace-decision-context.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-brace-decision-context
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate decision UI JavaScript
        run: node --check scripts/portfolio-10k-execution-finalizer.js
      - name: Bump decision UI asset version on PL and EN
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('pl/inwestycje/portfel-10k.html'),
              Path('en/investing/portfolio-10k.html'),
          ]
          old = 'portfolio-10k-execution-finalizer.js?v=3'
          new = 'portfolio-10k-execution-finalizer.js?v=4'
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'{path}: expected v3 script reference not found')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-brace-decision-context.yml
      - name: Commit deployment
        run: |
          git config user.name 'briefrooms-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add pl/inwestycje/portfel-10k.html en/investing/portfolio-10k.html .github/workflows/one-shot-brace-decision-context.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Load BRACE decision context UI v4'
          git pull --rebase origin main
          git push origin HEAD:main
