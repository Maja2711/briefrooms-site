name: Publish PL and EN News

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/publish_live_news.py"
      - "scripts/publish_live_news_filtered.py"
      - "scripts/publish_curated_news.py"
      - "scripts/publish_source_expansion_v3.py"
      - "scripts/news_source_architecture.py"
      - "scripts/news_source_expansion_v3.py"
      - "scripts/news_event_intelligence_v4.py"
      - "scripts/news_claim_intelligence.py"
      - "data/news/polish_sport_watchlist.json"
      - "scripts/enforce_homepage_max_age.py"
      - "scripts/news_quality.py"
      - "scripts/render_live_news_static.py"
      - "scripts/generate_permanent_briefs.py"
      - "scripts/news-live.js"
      - "scripts/home-briefs.js"
      - "scripts/install_news_live_runtime.py"
      - "tests/test_publish_live_news.py"
      - "tests/test_news_sport_diversity.py"
      - "tests/test_news_source_architecture.py"
      - "tests/test_source_expansion_v3.py"
      - "tests/test_event_intelligence_v4.py"
      - "tests/test_claim_intelligence.py"
      - "tests/test_homepage_max_age.py"
      - "tests/test_news_quality.py"
      - "tests/test_homepage_static.py"
      - "tests/test_install_news_live_runtime.py"
      - "tests/home_briefs_policy.test.js"
      - ".github/workflows/publish-news.yml"

permissions:
  contents: write

concurrency:
  group: news-publication
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser requests

      - name: Validate canonical news pipeline
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/publish_live_news.py \
            scripts/publish_live_news_filtered.py \
            scripts/publish_curated_news.py \
            scripts/publish_source_expansion_v3.py \
            scripts/news_source_architecture.py \
            scripts/news_source_expansion_v3.py \
            scripts/news_event_intelligence_v4.py \
            scripts/news_claim_intelligence.py \
            scripts/enforce_homepage_max_age.py \
            scripts/news_quality.py \
            scripts/render_live_news_static.py \
            scripts/generate_permanent_briefs.py \
            scripts/install_news_live_runtime.py
          python -m unittest \
            tests.test_publish_live_news \
            tests.test_news_sport_diversity \
            tests.test_news_source_architecture \
            tests.test_source_expansion_v3 \
            tests.test_event_intelligence_v4 \
            tests.test_claim_intelligence \
            tests.test_homepage_max_age \
            tests.test_news_quality \
            tests.test_install_news_live_runtime -v
          node --check scripts/news-live.js
          node --check scripts/home-briefs.js
          node --test tests/home_briefs_policy.test.js

      - name: Build fresh PL and EN news data and pages
        id: build
        run: |
          set -euo pipefail
          marker="live-news-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "marker=${marker}" >> "$GITHUB_OUTPUT"

          # Canonical publisher: provenance/dedupe v3, Event Intelligence v4,
          # independent corroboration and claim-level contradiction detection.
          python scripts/publish_source_expansion_v3.py --marker "${marker}"
          python scripts/enforce_homepage_max_age.py
          python scripts/render_live_news_static.py

          cp .cache/home_brief_pl_last_good.json pl/home_brief.json
          cp .cache/home_brief_en_last_good.json en/home_brief.json
          python scripts/generate_permanent_briefs.py

          python scripts/install_news_live_runtime.py
          python scripts/publish_source_expansion_v3.py --validate --max-age-minutes 10
          python scripts/enforce_homepage_max_age.py --validate
          python -m unittest tests.test_homepage_static -v

          for path in pl/aktualnosci.html en/news.html pl/index.html en/index.html; do
            grep -F '/scripts/news-live.js?v=5' "$path"
            grep -F "briefrooms-live-news-marker\" content=\"${marker}" "$path"
          done

      - name: Commit one atomic news publication
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/news/pl.json data/news/en.json data/news/status.json \
            data/news/homepage_exposure.json \
            data/news_publication_status.json \
            data/permanent_briefs_pl.json data/permanent_briefs_en.json \
            pl/home_brief.json en/home_brief.json \
            pl/aktualnosci.html en/news.html \
            pl/index.html en/index.html \
            pl/briefy en/briefs sitemap.xml
          if git diff --cached --quiet; then
            echo "::error::Canonical publisher produced no tracked output."
            exit 1
          fi
          git commit -m "chore(news): publish live PL and EN feed"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
              git rebase origin/main
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "::error::Could not push live news after 5 attempts."
          exit 1

      - name: Verify production data, static pages and runtime
        env:
          MARKER: ${{ steps.build.outputs.marker }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime, timedelta, timezone

          marker = os.environ['MARKER']
          base = 'https://briefrooms.com'
          json_paths = ('/data/news/pl.json', '/data/news/en.json')
          html_paths = ('/pl/aktualnosci.html', '/en/news.html', '/pl/index.html', '/en/index.html')
          headers = {'User-Agent': 'BriefRooms production verifier/8.0', 'Cache-Control': 'no-cache'}
          last = []
          for attempt in range(48):
              last = []
              for path in json_paths:
                  try:
                      req = urllib.request.Request(f'{base}{path}?v={marker}-{attempt}', headers=headers)
                      with urllib.request.urlopen(req, timeout=15) as response:
                          payload = json.loads(response.read().decode('utf-8'))
                      if payload.get('marker') != marker:
                          last.append(f'{path}: marker mismatch')
                          continue
                      generated = datetime.fromisoformat(payload['generated_at'].replace('Z', '+00:00'))
                      if datetime.now(timezone.utc) - generated > timedelta(minutes=20):
                          last.append(f'{path}: generated data is stale')
                      if payload.get('schema_version') != 'news-live-v2':
                          last.append(f'{path}: schema mismatch')
                      if payload.get('editorial_policy', {}).get('version') != 'news-value-filter-v4':
                          last.append(f'{path}: editorial policy v4 missing')
                      selection_policy = payload.get('health', {}).get('editorial_selection', {})
                      if selection_policy.get('version') != 'curated-source-tiers-v2':
                          last.append(f'{path}: curated source policy v2 missing')
                      if selection_policy.get('target_max_cards_per_source') != 3:
                          last.append(f'{path}: curated three-card target missing')
                      if selection_policy.get('emergency_max_cards_per_source') != 5:
                          last.append(f'{path}: emergency source cap missing')
                      expansion = payload.get('health', {}).get('source_expansion', {})
                      if expansion.get('version') != 'source-expansion-v3':
                          last.append(f'{path}: Source Expansion v3 missing')
                      if expansion.get('origin_detection_version') != 'source-origin-v1':
                          last.append(f'{path}: source-origin detection missing')
                      if expansion.get('dedupe_version') != 'dispatch-dedupe-v1':
                          last.append(f'{path}: dispatch dedupe missing')
                      event_policy = payload.get('health', {}).get('event_intelligence', {})
                      if event_policy.get('version') != 'event-intelligence-v4':
                          last.append(f'{path}: Event Intelligence v4 missing')
                      if event_policy.get('evidence_model_version') != 'evidence-corroboration-v1':
                          last.append(f'{path}: evidence model missing')
                      claim_policy = payload.get('health', {}).get('claim_intelligence', {})
                      if claim_policy.get('version') != 'claim-intelligence-v1':
                          last.append(f'{path}: Claim Intelligence missing')
                      if claim_policy.get('contradiction_detection_version') != 'contradiction-detection-v1':
                          last.append(f'{path}: contradiction detection missing')
                      if payload.get('homepage_policy', {}).get('version') != 'max-72h-first-display-v1':
                          last.append(f'{path}: homepage 72h first-display policy missing')
                      if any(len(items) != 9 for items in payload.get('sections', {}).values()):
                          last.append(f'{path}: section does not contain exactly 9 stories')
                      for section_id, items in payload.get('sections', {}).items():
                          counts = {}
                          event_ids = set()
                          for story in items:
                              source = str(story.get('source') or 'unknown')
                              counts[source] = counts.get(source, 0) + 1
                              if story.get('publisher_source') != story.get('source'):
                                  last.append(f'{path}/{section_id}: publisher provenance mismatch')
                                  break
                              if 'origin_source' not in story or 'provenance_role' not in story:
                                  last.append(f'{path}/{section_id}: provenance metadata missing')
                                  break
                              if story.get('dispatch_dedupe_version') != 'dispatch-dedupe-v1':
                                  last.append(f'{path}/{section_id}: dedupe metadata missing')
                                  break
                              event_id = story.get('canonical_event_id')
                              if not event_id or event_id in event_ids:
                                  last.append(f'{path}/{section_id}: canonical event id invalid or repeated')
                                  break
                              event_ids.add(event_id)
                              if story.get('event_intelligence_version') != 'event-intelligence-v4':
                                  last.append(f'{path}/{section_id}: Event Intelligence metadata missing')
                                  break
                              if story.get('claim_intelligence_version') != 'claim-intelligence-v1':
                                  last.append(f'{path}/{section_id}: Claim Intelligence metadata missing')
                                  break
                              if story.get('contradiction_detection_version') != 'contradiction-detection-v1':
                                  last.append(f'{path}/{section_id}: contradiction metadata missing')
                                  break
                              if story.get('claim_consistency_status') not in {'insufficient_evidence', 'consistent', 'evolving_update', 'disputed'}:
                                  last.append(f'{path}/{section_id}: invalid claim consistency status')
                                  break
                              if not 0 <= float(story.get('contradiction_score') or 0) <= 100:
                                  last.append(f'{path}/{section_id}: invalid contradiction score')
                                  break
                              if not 0 <= float(story.get('claim_adjusted_corroboration_score') or 0) <= 100:
                                  last.append(f'{path}/{section_id}: invalid adjusted corroboration score')
                                  break
                              if not isinstance(story.get('claim_groups'), list):
                                  last.append(f'{path}/{section_id}: claim groups missing')
                                  break
                          if counts and max(counts.values()) > 5:
                              last.append(f'{path}/{section_id}: source exceeds emergency cap: {counts}')
                              break
                      if path.endswith('/pl.json'):
                          sport_policy = payload.get('health', {}).get('sport_hot_priority', {})
                          if sport_policy.get('mode') != 'ranked_polish_athletes_plus_cross_source_heat_and_diversity':
                              last.append(f'{path}: Polish sport diversity policy missing')
                          if sport_policy.get('watchlist_version') != 'pl-sport-watchlist-v1':
                              last.append(f'{path}: Polish sport watchlist missing')
                      now = datetime.now(timezone.utc)
                      for story in payload.get('home', []):
                          first_seen_raw = story.get('homepage_first_seen_at')
                          if not first_seen_raw:
                              last.append(f'{path}: homepage first-seen timestamp missing')
                              break
                          first_seen = datetime.fromisoformat(first_seen_raw.replace('Z', '+00:00'))
                          if now - first_seen > timedelta(days=3):
                              last.append(f'{path}: homepage story exceeds 72h exposure cap')
                              break
                  except Exception as exc:
                      last.append(f'{path}: {exc}')
              for path in html_paths:
                  try:
                      req = urllib.request.Request(f'{base}{path}?v={marker}-{attempt}', headers=headers)
                      with urllib.request.urlopen(req, timeout=15) as response:
                          body = response.read().decode('utf-8', 'replace')
                      if '/scripts/news-live.js?v=5' not in body:
                          last.append(f'{path}: runtime missing')
                      if f'name="briefrooms-live-news-marker" content="{marker}"' not in body:
                          last.append(f'{path}: static marker mismatch')
                  except Exception as exc:
                      last.append(f'{path}: {exc}')
              if not last:
                  print('Production news use provenance, CanonicalEvent, independent corroboration and Claim Intelligence contradiction detection.')
                  raise SystemExit(0)
              time.sleep(10)
          raise SystemExit('Production verification failed: ' + '; '.join(last))
          PY
