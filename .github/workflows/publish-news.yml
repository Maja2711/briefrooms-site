name: Publish PL and EN News

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/publish_live_news.py"
      - "scripts/publish_live_news_filtered.py"
      - "scripts/news_quality.py"
      - "scripts/render_live_news_static.py"
      - "scripts/generate_permanent_briefs.py"
      - "scripts/homepage_news_policy.py"
      - "scripts/news-live.js"
      - "scripts/install_news_live_runtime.py"
      - "tests/test_publish_live_news.py"
      - "tests/test_news_quality.py"
      - "tests/test_homepage_static.py"
      - "tests/test_homepage_news_policy.py"
      - ".github/workflows/publish-news.yml"

permissions:
  contents: write

concurrency:
  group: news-publication
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser requests

      - name: Validate canonical news pipeline
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/publish_live_news.py \
            scripts/publish_live_news_filtered.py \
            scripts/news_quality.py \
            scripts/render_live_news_static.py \
            scripts/generate_permanent_briefs.py \
            scripts/homepage_news_policy.py \
            scripts/install_news_live_runtime.py
          python -m unittest \
            tests.test_publish_live_news \
            tests.test_news_quality \
            tests.test_homepage_news_policy -v
          node --check scripts/news-live.js

      - name: Build fresh PL and EN news data and pages
        id: build
        run: |
          set -euo pipefail
          marker="live-news-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "marker=${marker}" >> "$GITHUB_OUTPUT"

          # Preserve the last strictly reviewed homepage set before the live/source-only
          # publisher writes its compatibility home_brief files.
          python scripts/homepage_news_policy.py --snapshot-last-good

          # Build the complete live feed, then apply the homepage-only policy:
          # strategic category promotion + a hard 72-hour source-published age limit.
          python scripts/publish_live_news_filtered.py --marker "${marker}"
          python scripts/homepage_news_policy.py --apply-live
          python scripts/render_live_news_static.py

          # Restore reviewed permanent-brief input, apply the same 72-hour gate and
          # category priority, then generate the SEO/static fallback.
          cp .cache/home_brief_pl_last_good.json pl/home_brief.json
          cp .cache/home_brief_en_last_good.json en/home_brief.json
          python scripts/homepage_news_policy.py --apply-home-brief
          python scripts/generate_permanent_briefs.py
          python scripts/homepage_news_policy.py --enforce-static

          python scripts/install_news_live_runtime.py
          python scripts/publish_live_news_filtered.py --validate --max-age-minutes 10
          python -m unittest tests.test_homepage_static -v

          for path in pl/aktualnosci.html en/news.html pl/index.html en/index.html; do
            grep -F '/scripts/news-live.js?v=3' "$path"
            grep -F "briefrooms-live-news-marker\" content=\"${marker}" "$path"
          done

          # Fail closed if the publisher ever reintroduces an expired/undated story to
          # the live homepage list.
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          now = datetime.now(timezone.utc)
          for lang in ('pl', 'en'):
              payload = json.loads(Path(f'data/news/{lang}.json').read_text(encoding='utf-8'))
              policy = payload.get('homepage_policy') or {}
              if policy.get('version') != 'homepage-priority-72h-v1' or policy.get('max_age_hours') != 72:
                  raise SystemExit(f'{lang}: homepage policy missing')
              for story in payload.get('home') or []:
                  raw = story.get('published_at')
                  if not raw:
                      raise SystemExit(f'{lang}: homepage item missing published_at')
                  published = datetime.fromisoformat(str(raw).replace('Z', '+00:00'))
                  if published.tzinfo is None:
                      raise SystemExit(f'{lang}: naive homepage timestamp')
                  age = now - published.astimezone(timezone.utc)
                  if age > timedelta(days=3) or age < -timedelta(minutes=10):
                      raise SystemExit(f'{lang}: homepage item outside 72h gate: {raw}')
          PY

      - name: Commit one atomic news publication
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/news/pl.json data/news/en.json data/news/status.json \
            data/news_publication_status.json \
            data/permanent_briefs_pl.json data/permanent_briefs_en.json \
            pl/home_brief.json en/home_brief.json \
            pl/aktualnosci.html en/news.html \
            pl/index.html en/index.html \
            pl/briefy en/briefs sitemap.xml
          if git diff --cached --quiet; then
            echo "::error::Canonical publisher produced no tracked output."
            exit 1
          fi
          git commit -m "chore(news): publish live PL and EN feed"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
              git rebase origin/main
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "::error::Could not push live news after 5 attempts."
          exit 1

      - name: Verify production data, static pages and runtime
        env:
          MARKER: ${{ steps.build.outputs.marker }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime, timedelta, timezone

          marker = os.environ['MARKER']
          base = 'https://briefrooms.com'
          json_paths = ('/data/news/pl.json', '/data/news/en.json')
          html_paths = ('/pl/aktualnosci.html', '/en/news.html', '/pl/index.html', '/en/index.html')
          headers = {'User-Agent': 'BriefRooms production verifier/3.0', 'Cache-Control': 'no-cache'}
          last = []
          for attempt in range(48):
              last = []
              for path in json_paths:
                  try:
                      req = urllib.request.Request(f'{base}{path}?v={marker}-{attempt}', headers=headers)
                      with urllib.request.urlopen(req, timeout=15) as response:
                          payload = json.loads(response.read().decode('utf-8'))
                      if payload.get('marker') != marker:
                          last.append(f'{path}: marker mismatch')
                          continue
                      generated = datetime.fromisoformat(payload['generated_at'].replace('Z', '+00:00'))
                      if datetime.now(timezone.utc) - generated > timedelta(minutes=20):
                          last.append(f'{path}: generated data is stale')
                      if payload.get('schema_version') != 'news-live-v2':
                          last.append(f'{path}: schema mismatch')
                      if payload.get('editorial_policy', {}).get('version') != 'news-value-filter-v2':
                          last.append(f'{path}: editorial policy v2 missing')
                      home_policy = payload.get('homepage_policy') or {}
                      if home_policy.get('version') != 'homepage-priority-72h-v1' or home_policy.get('max_age_hours') != 72:
                          last.append(f'{path}: homepage 72h policy missing')
                      now = datetime.now(timezone.utc)
                      for story in payload.get('home') or []:
                          try:
                              published = datetime.fromisoformat(str(story['published_at']).replace('Z', '+00:00')).astimezone(timezone.utc)
                          except Exception:
                              last.append(f'{path}: homepage timestamp missing/invalid')
                              continue
                          if now - published > timedelta(days=3):
                              last.append(f'{path}: expired homepage story')
                      if any(len(items) < 4 for items in payload.get('sections', {}).values()):
                          last.append(f'{path}: incomplete section')
                  except Exception as exc:
                      last.append(f'{path}: {exc}')
              for path in html_paths:
                  try:
                      req = urllib.request.Request(f'{base}{path}?v={marker}-{attempt}', headers=headers)
                      with urllib.request.urlopen(req, timeout=15) as response:
                          body = response.read().decode('utf-8', 'replace')
                      if '/scripts/news-live.js?v=3' not in body:
                          last.append(f'{path}: runtime missing')
                      if f'name="briefrooms-live-news-marker" content="{marker}"' not in body:
                          last.append(f'{path}: static marker mismatch')
                  except Exception as exc:
                      last.append(f'{path}: {exc}')
              if not last:
                  print('Production PL and EN news are current and homepage policy 72h is active.')
                  raise SystemExit(0)
              time.sleep(10)
          raise SystemExit('Production verification failed: ' + '; '.join(last))
          PY