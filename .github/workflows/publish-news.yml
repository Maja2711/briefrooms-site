name: Publish PL and EN News

on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:
    inputs:
      recovery:
        description: "Run requested by the publication watchdog"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      recovery:
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "scripts/fetch_news_*.py"
      - "scripts/build_home_brief_*.py"
      - "scripts/news_*.py"
      - "scripts/newsroom_*.py"
      - "scripts/comment_quality.py"
      - "scripts/check_ai_provider.py"
      - "scripts/read_and_summarize_articles.py"
      - "scripts/protect_home_feed.py"
      - "scripts/normalize_home_publish_count.py"
      - "scripts/publish_news.py"
      - "scripts/verify_news_production.py"
      - "scripts/generate_permanent_briefs.py"
      - "scripts/external_media_policy.py"
      - "scripts/enforce_external_media_policy.py"
      - "scripts/external-media-guard.js"
      - "scripts/enforce_homepage_photo_only.py"
      - "scripts/homepage-photo-only.js"
      - "scripts/validate_news_home_publish.py"
      - "scripts/content_update_watchdog.py"
      - "tests/test_publish_news.py"
      - "tests/test_news_section_reserve.py"
      - "tests/test_news_story_dedupe.py"
      - "tests/test_comment_quality.py"
      - "tests/test_ai_provider_preflight.py"
      - "tests/test_fetch_news_pl.py"
      - "tests/test_protect_home_feed_count.py"
      - "tests/test_content_update_watchdog.py"
      - "tests/test_external_media_policy.py"
      - ".github/workflows/publish-news.yml"

permissions:
  contents: write

concurrency:
  group: news-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STAGE_DIR: /tmp/briefrooms-publication/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install publisher dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser python-dateutil requests

      - name: Validate publisher and content contracts
        run: |
          python -m py_compile \
            scripts/publish_news.py \
            scripts/news_section_reserve.py \
            scripts/news_publication_diagnostics.py \
            scripts/verify_news_production.py \
            scripts/content_update_watchdog.py \
            scripts/comment_quality.py \
            scripts/check_ai_provider.py
          python -m unittest \
            tests.test_ai_provider_preflight \
            tests.test_comment_quality \
            tests.test_fetch_news_pl \
            tests.test_publish_news \
            tests.test_news_story_dedupe \
            tests.test_news_section_reserve \
            tests.test_content_update_watchdog \
            tests.test_external_media_policy \
            tests.test_validate_news_home_publish -v

      - name: Check AI provider or enter approved-cache-only mode
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_AI_MODEL: gpt-4o-mini
          NEWS_AI_REVIEW_MODEL: gpt-4.1-mini
        run: python scripts/check_ai_provider.py --allow-approved-cache

      - name: Prepare one isolated PL and EN publication
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_AI_MODEL: gpt-4o-mini
          NEWS_AI_REVIEW_MODEL: gpt-4.1-mini
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --ff-only origin/main
          python scripts/publish_news.py \
            --prepare \
            --stage-dir "${STAGE_DIR}" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            git merge --ff-only origin/main
            python scripts/publish_news.py \
              --refresh-plan \
              --stage-dir "${STAGE_DIR}"
          fi

      - name: Promote the validated publication
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            git merge --ff-only origin/main
            python scripts/publish_news.py \
              --refresh-plan \
              --stage-dir "${STAGE_DIR}"
          fi
          python scripts/publish_news.py --promote --stage-dir "${STAGE_DIR}"

      - name: Commit and push one atomic PL and EN revision
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pl/aktualnosci.html pl/home_brief.json pl/index.html pl/brief.html pl/briefy \
            en/news.html en/home_brief.json en/index.html en/brief.html en/briefs \
            data/news_story_history_pl.json data/news_story_history_en.json \
            data/permanent_briefs_pl.json data/permanent_briefs_en.json \
            data/news_publication_status.json data/news_source_report.json sitemap.xml
          if [[ -d .cache ]]; then
            git add -f .cache
          fi
          if git diff --cached --quiet; then
            echo "::error::Publisher produced no manifest or publication change."
            exit 1
          fi
          git commit -m "chore(news): publish PL and EN atomically"

          for push_attempt in 1 2 3; do
            git fetch origin main
            if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
              git rebase origin/main
            fi
            if git push origin HEAD:main; then
              break
            fi
            if [[ "${push_attempt}" == "3" ]]; then
              echo "::error::Could not publish news after 3 push attempts."
              exit 1
            fi
            sleep $((push_attempt * 10))
          done

          published_sha="$(git rev-parse HEAD)"
          publication_id="$(python -c "import json; print(json.load(open('data/news_publication_status.json', encoding='utf-8'))['publication_id'])")"
          echo "published_sha=${published_sha}" >> "$GITHUB_OUTPUT"
          echo "publication_id=${publication_id}" >> "$GITHUB_OUTPUT"

      - name: Verify the exact publication on production
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_news_production.py \
            --publication-id "${{ steps.commit.outputs.publication_id }}" \
            --expected-sha "${{ steps.commit.outputs.published_sha }}" \
            --base-url https://briefrooms.com \
            --attempts 40 \
            --interval 15 \
            --timeout 20 \
            --output "${STAGE_DIR}/diagnostics/production-verification.json"

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            production_status="passed"
          else
            production_status="failed"
          fi
          if [[ -f "${STAGE_DIR:-}/diagnostics/summary.md" ]]; then
            sed "s/| pending |/| ${production_status} |/g" \
              "${STAGE_DIR}/diagnostics/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload publication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.STAGE_DIR }}/diagnostics
            ${{ env.STAGE_DIR }}/publication-plan.json
            ${{ env.STAGE_DIR }}/site/data/news_publication_status.json
            ${{ env.STAGE_DIR }}/site/data/news_source_report.json
          if-no-files-found: warn
          retention-days: 30
