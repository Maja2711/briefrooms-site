name: Refresh Portfolio 10K Analytics News

on:
  workflow_dispatch:
  issues:
    types: [opened]
  schedule:
    - cron: "17 6,10,14,18 * * 1-5"
    - cron: "17 8 * * 0,6"
  push:
    branches: [main]
    paths:
      - "scripts/portfolio_10k_news_quality.py"
      - "scripts/portfolio_10k_analysis_news_guard.py"
      - "scripts/portfolio_10k_material_reports_enrichment.py"
      - "scripts/normalize_portfolio_10k_material_reports.py"
      - "scripts/validate_portfolio_10k_analysis_news.py"
      - "tests/test_portfolio_10k_news_quality.py"
      - "tests/test_portfolio_10k_material_reports_enrichment.py"
      - ".github/workflows/portfolio-10k-analysis-news.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/portfolio_10k_news_quality.py"
      - "scripts/portfolio_10k_analysis_news_guard.py"
      - "scripts/portfolio_10k_material_reports_enrichment.py"
      - "scripts/normalize_portfolio_10k_material_reports.py"
      - "scripts/validate_portfolio_10k_analysis_news.py"
      - "tests/test_portfolio_10k_news_quality.py"
      - "tests/test_portfolio_10k_material_reports_enrichment.py"
      - ".github/workflows/portfolio-10k-analysis-news.yml"

permissions:
  contents: write

concurrency:
  group: portfolio-market-data
  cancel-in-progress: false

jobs:
  refresh-analysis-news:
    if: github.event_name != 'issues' || github.event.issue.title == 'Refresh Portfolio 10K Analytics news'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip yfinance pandas numpy pytest

      - name: Refresh and rank source headlines
        run: python scripts/portfolio_10k_news_quality.py --refresh --force-refresh --limit 5

      - name: Rebuild evidence-gated material reports
        run: |
          python scripts/portfolio_10k_material_reports_enrichment.py
          python scripts/portfolio_10k_analysis_news_guard.py
          python scripts/normalize_portfolio_10k_material_reports.py

      - name: Apply the same feed to the independent EN portfolio
        run: |
          python scripts/build_portfolio_10k_usd.py
          python scripts/fix_portfolio_10k_usd_reviews.py

      - name: Test Analytics methodology in PL and EN
        run: |
          python -m py_compile \
            scripts/portfolio_10k_news_quality.py \
            scripts/portfolio_10k_analysis_news_guard.py \
            scripts/portfolio_10k_material_reports_enrichment.py \
            scripts/validate_portfolio_10k_analysis_news.py
          python -m pytest -q \
            tests/test_portfolio_10k_news_quality.py \
            tests/test_portfolio_10k_material_reports.py \
            tests/test_portfolio_10k_material_reports_enrichment.py
          python scripts/validate_portfolio_10k_analysis_news.py
          python scripts/validate_portfolio_10k_state.py

      - name: Commit PL and EN Analytics data
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/investments/portfolio_10k.json \
            data/investments/portfolio_10k_usd.json \
            data/investments/portfolio_10k_material_reports.json
          if git diff --cached --quiet; then
            echo "Analytics news is already current."
            exit 0
          fi
          git commit -m "Refresh Portfolio 10K Analytics news"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          exit 1
