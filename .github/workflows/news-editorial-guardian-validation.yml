name: News Editorial Guardian Validation
on:
  pull_request:
    paths:
      - 'scripts/news_editorial_guard.py'
      - 'scripts/publish_source_expansion_v3.py'
      - 'scripts/dedupe_home_brief_stories.py'
      - 'scripts/validate_live_news_health.py'
      - 'tests/test_news_editorial_guard.py'
      - '.github/workflows/news-editorial-guardian-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install feedparser requests argostranslate langdetect
      - name: Validate exact candidate and regression suite
        run: |
          git rev-parse HEAD
          python -m py_compile scripts/news_editorial_guard.py scripts/publish_source_expansion_v3.py scripts/dedupe_home_brief_stories.py scripts/validate_live_news_health.py
          python -m unittest -v tests.test_news_editorial_guard tests.test_validate_live_news_health tests.test_publish_live_news tests.test_source_expansion_v3 tests.test_news_semantic_event tests.test_news_story_dedupe tests.test_public_statement_dedupe tests.test_event_intelligence_v4 tests.test_homepage_max_age tests.test_news_source_architecture tests.test_news_sport_diversity tests.test_pl_sport_priority
          python scripts/validate_architecture_bootstrap.py
