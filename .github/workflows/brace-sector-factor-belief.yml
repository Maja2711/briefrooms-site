name: BRACE Sector-Factor Belief Shadow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/brace-sector-factor-belief.yml"
      - "scripts/brace_sector_factor_belief.py"
      - "tests/test_brace_sector_factor_belief.py"
      - "docs/BRACE_SECTOR_FACTOR_BELIEF.md"
  workflow_run:
    workflows:
      - "BRACE Broad-Market Belief Shadow"
    types: [completed]
  schedule:
    - cron: "45 21 * * 1-5"

permissions:
  contents: read
  actions: read

concurrency:
  group: brace-sector-factor-belief-shadow
  cancel-in-progress: false

env:
  STATE_ARTIFACT_NAME: brace-sector-factor-belief-state

jobs:
  collect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert broad-market foundation has production state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=brace-broad-market-belief-state&per_page=100"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api" > "$RUNNER_TEMP/broad-market-artifacts.json"
          python - "$RUNNER_TEMP/broad-market-artifacts.json" <<'PY'
          import json, sys
          from pathlib import Path
          rows=[x for x in json.loads(Path(sys.argv[1]).read_text()).get('artifacts',[]) if not x.get('expired')]
          if not rows:
              raise SystemExit('PR11 blocked: broad-market shadow state has not been established yet')
          print('Broad-market prerequisite artifact: PASS')
          PY

      - name: Prepare private PR11 state directory
        run: |
          set -euo pipefail
          echo "STATE_DIR=$RUNNER_TEMP/brace_sector_factor_belief" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/brace_sector_factor_belief"

      - name: Restore prior cumulative PR11 state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${STATE_ARTIFACT_NAME}&per_page=100"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api" > "$RUNNER_TEMP/artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/artifacts.json" <<'PY'
          import json, sys
          from pathlib import Path
          rows=[x for x in json.loads(Path(sys.argv[1]).read_text()).get('artifacts',[]) if not x.get('expired')]
          rows.sort(key=lambda x:x.get('created_at',''), reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
          )
          if [ -n "$artifact_id" ]; then
            curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$RUNNER_TEMP/state.zip"
            mkdir -p "$RUNNER_TEMP/state-zip"
            unzip -q "$RUNNER_TEMP/state.zip" -d "$RUNNER_TEMP/state-zip"
            test -f "$RUNNER_TEMP/state-zip/brace-sector-factor-belief-state.tgz"
            tar -xzf "$RUNNER_TEMP/state-zip/brace-sector-factor-belief-state.tgz" -C "$STATE_DIR"
          else
            echo "No prior PR11 state; first valid run will establish activation boundary only."
          fi

      - name: Validate PR11 code
        run: |
          PYTHONPATH=scripts python -m py_compile scripts/brace_sector_factor_belief.py
          PYTHONPATH=scripts python -m unittest tests.test_brace_sector_factor_belief -v

      - name: Run prospective sector-factor layer
        run: |
          PYTHONPATH=scripts python scripts/brace_sector_factor_belief.py --state-dir "$STATE_DIR"

      - name: Assert hierarchy, WITH/WITHOUT governance and zero influence
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ['STATE_DIR'])/'BRACE_SECTOR_FACTOR_BELIEF_REPORT.json').read_text())
          assert report['mode'] == 'research_shadow'
          assert report['active_decision_influence'] is False
          assert report['safety_controls'] and all(v is False for v in report['safety_controls'].values())
          assert report['hierarchy']['active_layer'] == 'sector_factor'
          assert report['hierarchy']['company_entity_beliefs'] == 'deferred_to_pr12_plus_reviewed_framework'
          assert report['promotion_evidence_standard']['with_without_required'] is True
          assert report['promotion_evidence_standard']['automatic_promotion'] is False
          assert report['capabilities']['with_without_bridge_enabled'] is False
          assert report['capabilities']['promotion_gate_enabled'] is False
          print('PR11 hierarchy + zero-influence + promotion-evidence contract: PASS')
          print('Sample:', report['sample'])
          PY

      - name: Pack cumulative private state
        run: tar -czf "$RUNNER_TEMP/brace-sector-factor-belief-state.tgz" -C "$STATE_DIR" .

      - name: Store cumulative PR11 state
        uses: actions/upload-artifact@v4
        with:
          name: brace-sector-factor-belief-state
          path: ${{ runner.temp }}/brace-sector-factor-belief-state.tgz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
