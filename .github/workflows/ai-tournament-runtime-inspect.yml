name: Inspect AI Tournament Snapshot Runtime

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  inspect:
    if: github.event.issue.title == 'Inspect AI Tournament snapshot runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect snapshot functions
        run: |
          python - <<'PY'
          import inspect
          from pathlib import Path
          import scripts.ai_tournament_engine as engine
          names=[n for n in dir(engine) if 'snapshot' in n.lower() or 'session' in n.lower() or 'market' in n.lower()]
          lines=['NAMES: '+', '.join(names), '']
          for name in names:
              obj=getattr(engine,name,None)
              if callable(obj):
                  try:
                      lines.append(f'### {name}{inspect.signature(obj)}')
                      lines.append(inspect.getsource(obj))
                  except Exception as exc:
                      lines.append(f'UNAVAILABLE {name}: {exc}')
                  lines.append('')
          Path('data/ai_tournament/runtime_snapshot_inspect.txt').write_text('\n'.join(lines),encoding='utf-8')
          PY
      - name: Commit inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ai_tournament/runtime_snapshot_inspect.txt
          git commit -m 'Record AI Tournament snapshot runtime inspection'
          git pull --rebase origin main
          git push origin HEAD:main
