name: Monitor US Stock Trading Portfolio
# NO RETROACTIVE EXECUTION

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/us-daily-stock-position-monitor.yml"
      - "scripts/stock_trading_portfolio.py"
      - "scripts/no_retroactive_execution.py"
      - "scripts/verify_no_retroactive_execution.py"
      - "scripts/sync_trading_push_commit.sh"
      - "data/investments/stock_trading_policy.json"
      - "tests/test_stock_trading_portfolio.py"
      - "tests/test_no_retroactive_execution.py"
  schedule:
    - cron: "*/5 13-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: stock-trading-state-writer
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start immutable LIVE execution clock
        run: |
          echo "NO_RETROACTIVE_EXECUTION=1" >> "$GITHUB_ENV"
          echo "NO_RETROACTIVE_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Validate canonical multi-position lifecycle and execution invariant
        run: |
          set -euo pipefail
          python -m py_compile scripts/stock_trading_portfolio.py scripts/no_retroactive_execution.py scripts/verify_no_retroactive_execution.py
          python -m unittest tests.test_stock_trading_portfolio tests.test_no_retroactive_execution -v
          python -m json.tool data/investments/stock_trading_policy.json >/dev/null

      - name: Review all open US positions
        run: |
          set -euo pipefail
          python scripts/stock_trading_portfolio.py --mode run --market US
          python scripts/stock_trading_portfolio.py --mode verify
          python -m json.tool data/investments/stock_trading_portfolio.json >/dev/null

      - name: Persist canonical US portfolio state through NO RETROACTIVE airlock
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/investments/stock_trading_portfolio.json
          if git diff --cached --quiet; then
            echo "No US Stock Trading portfolio state change"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
          git commit -m "Monitor US Stock Trading portfolio"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main; then
              python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD^ --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
              if git push origin HEAD:main; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD^ --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
            sleep $((attempt*3))
          done
          exit 1

      - name: Dispatch persisted US Stock Trading transition to Web Push immediately
        if: steps.commit.outputs.changed == 'true'
        env:
          PUSH_API: https://briefrooms-trading-push.szczerbinski0577.workers.dev
        run: |
          set -euo pipefail
          bash -n scripts/sync_trading_push_commit.sh
          bash scripts/sync_trading_push_commit.sh "${{ steps.commit.outputs.sha }}" stock
