name: Monitor US Stock Trading Portfolio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/us-daily-stock-position-monitor.yml"
      - "scripts/stock_trading_portfolio.py"
      - "data/investments/stock_trading_policy.json"
      - "tests/test_stock_trading_portfolio.py"
  schedule:
    # Broad UTC window covers the regular US session in EDT and EST.
    - cron: "*/5 13-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: stock-trading-portfolio
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate canonical multi-position lifecycle
        run: |
          set -euo pipefail
          python -m py_compile scripts/stock_trading_portfolio.py
          python -m unittest tests.test_stock_trading_portfolio -v
          python -m json.tool data/investments/stock_trading_policy.json >/dev/null

      - name: Review all open US positions
        run: |
          set -euo pipefail
          python scripts/stock_trading_portfolio.py --mode run --market US
          python scripts/stock_trading_portfolio.py --mode verify
          python -m json.tool data/investments/stock_trading_portfolio.json >/dev/null

      - name: Persist canonical US portfolio state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/investments/stock_trading_portfolio.json
          if git diff --cached --quiet; then
            echo "No US Stock Trading portfolio state change"
            exit 0
          fi
          git commit -m "Monitor US Stock Trading portfolio"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt*3))
          done
          exit 1
