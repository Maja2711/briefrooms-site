name: Stock Trading v2 Continuous Discovery

on:
  workflow_dispatch:
    inputs:
      market:
        description: "Market to scan (AUTO, GPW, US, BOTH)"
        required: false
        default: "AUTO"
  push:
    branches:
      - stock-trading-v2
    paths:
      - ".github/workflows/stock-trading-v2-continuous-discovery.yml"
      - "scripts/stock_trading_v2_live_scan.py"
      - "scripts/stock_trading_v2_us_screener_provider.py"
      - "scripts/stock_trading_v2_discovery.py"
      - "scripts/briefrooms_market_relationship_trigger.py"
      - "scripts/stock_trading_v2_deep_evidence.py"
      - "scripts/stock_trading_v2_opportunity_engine.py"
      - "scripts/stock_trading_v2_opportunity_experience.py"
      - "data/investments/stock_trading_v2_fast_scan_config.json"
      - "data/investments/stock_trading_v2_discovery_config.json"
      - "data/investments/market_relationship_trigger_config.json"
      - "data/investments/stock_trading_v2_evidence_config.json"
      - "data/investments/stock_trading_v2_opportunity_config.json"
  schedule:
    # Broad UTC envelope; the job decides from each exchange's local clock.
    # Three staggered attempts per hour reduce exposure to scheduled-event delay/drop.
    # The independent liveness watchdog provides an event-driven recovery path.
    # Successful discovery hands production off through workflow_run on main.
    - cron: "7,27,47 6-22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: stock-trading-v2-continuous-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out Stock Trading v2
        uses: actions/checkout@v4
        with:
          ref: stock-trading-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve active market windows
        id: market_window
        env:
          REQUESTED_MARKET: ${{ github.event.inputs.market || 'AUTO' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, time, timezone
          from zoneinfo import ZoneInfo

          requested=os.environ.get('REQUESTED_MARKET','AUTO').upper()
          now=datetime.now(timezone.utc)

          def active(tz_name, start, end):
              local=now.astimezone(ZoneInfo(tz_name))
              return local.weekday() < 5 and start <= local.time().replace(tzinfo=None) <= end

          gpw=active('Europe/Warsaw', time(8,40), time(17,20))
          us=active('America/New_York', time(9,35), time(16,35))
          if requested == 'GPW':
              gpw, us = True, False
          elif requested == 'US':
              gpw, us = False, True
          elif requested == 'BOTH':
              gpw, us = True, True
          elif requested != 'AUTO':
              raise SystemExit(f'Unsupported market input: {requested}')
          print(f'gpw={str(gpw).lower()}')
          print(f'us={str(us).lower()}')
          print(f'now_utc={now.isoformat()}')
          PY

      - name: Validate v2 discovery evidence and opportunity configuration
        run: |
          set -euo pipefail
          python -m json.tool data/investments/stock_trading_v2_discovery_config.json >/dev/null
          python -m json.tool data/investments/market_relationship_trigger_config.json >/dev/null
          python -m json.tool data/investments/stock_trading_v2_evidence_config.json >/dev/null
          python -m json.tool data/investments/stock_trading_v2_opportunity_config.json >/dev/null
          python -m py_compile \
            scripts/stock_trading_v2_discovery.py \
            scripts/briefrooms_market_relationship_trigger.py \
            scripts/stock_trading_v2_deep_evidence.py \
            scripts/stock_trading_v2_opportunity_engine.py \
            scripts/stock_trading_v2_opportunity_experience.py \
            scripts/stock_trading_v2_live_scan.py \
            scripts/stock_trading_v2_us_screener_provider.py

      - name: Read current canonical portfolio and policy from main without merging main
        run: |
          set -euo pipefail
          git fetch origin main
          rm -f /tmp/stock-trading-v2-production-portfolio.json /tmp/stock-trading-v2-production-policy.json /tmp/briefrooms-event-intelligence.json
          if git cat-file -e "origin/main:data/investments/stock_trading_portfolio.json" 2>/dev/null; then
            git show "origin/main:data/investments/stock_trading_portfolio.json" > /tmp/stock-trading-v2-production-portfolio.json
          else
            printf '{"markets":{"GPW":{"open_positions":[]},"US":{"open_positions":[]}}}\n' > /tmp/stock-trading-v2-production-portfolio.json
          fi
          if git cat-file -e "origin/main:data/investments/stock_trading_policy.json" 2>/dev/null; then
            git show "origin/main:data/investments/stock_trading_policy.json" > /tmp/stock-trading-v2-production-policy.json
          fi
          if git cat-file -e "origin/main:data/investments/event_intelligence.json" 2>/dev/null; then
            git show "origin/main:data/investments/event_intelligence.json" > /tmp/briefrooms-event-intelligence.json
          else
            printf '{"events":[]}\n' > /tmp/briefrooms-event-intelligence.json
          fi

      - name: US broad stage-zero Opportunity Frontier Deep Evidence and portfolio comparison
        if: steps.market_window.outputs.us == 'true'
        run: |
          set -euo pipefail
          rm -f /tmp/stock-trading-v2-us-stage-zero.json
          python scripts/stock_trading_v2_live_scan.py \
            --universe data/investments/stock_trading_v2_universe/us.json \
            --output /tmp/stock-trading-v2-us-stage-zero.json
          python scripts/stock_trading_v2_discovery.py \
            --market US \
            --stage-zero /tmp/stock-trading-v2-us-stage-zero.json \
            --output data/investments/stock_trading_v2_frontier/us.json
          python scripts/briefrooms_market_relationship_trigger.py \
            --market US \
            --frontier data/investments/stock_trading_v2_frontier/us.json \
            --events /tmp/briefrooms-event-intelligence.json \
            --output data/investments/market_relationship_trigger/us.json \
            --history-root data/investments/market_relationship_trigger_history
          python scripts/stock_trading_v2_deep_evidence.py \
            --market US \
            --frontier data/investments/stock_trading_v2_frontier/us.json \
            --output data/investments/stock_trading_v2_evidence/us.json
          python scripts/stock_trading_v2_opportunity_engine.py \
            --market US \
            --evidence data/investments/stock_trading_v2_evidence/us.json \
            --portfolio /tmp/stock-trading-v2-production-portfolio.json \
            --output data/investments/stock_trading_v2_opportunity/us.json
          python scripts/stock_trading_v2_opportunity_experience.py \
            --market US \
            --opportunity data/investments/stock_trading_v2_opportunity/us.json \
            --evidence data/investments/stock_trading_v2_evidence/us.json

      - name: GPW broad Opportunity Frontier Deep Evidence and portfolio comparison
        if: steps.market_window.outputs.gpw == 'true'
        run: |
          set -euo pipefail
          python scripts/stock_trading_v2_discovery.py \
            --market GPW \
            --output data/investments/stock_trading_v2_frontier/gpw.json
          python scripts/stock_trading_v2_deep_evidence.py \
            --market GPW \
            --frontier data/investments/stock_trading_v2_frontier/gpw.json \
            --output data/investments/stock_trading_v2_evidence/gpw.json
          python scripts/stock_trading_v2_opportunity_engine.py \
            --market GPW \
            --evidence data/investments/stock_trading_v2_evidence/gpw.json \
            --portfolio /tmp/stock-trading-v2-production-portfolio.json \
            --output data/investments/stock_trading_v2_opportunity/gpw.json
          python scripts/stock_trading_v2_opportunity_experience.py \
            --market GPW \
            --opportunity data/investments/stock_trading_v2_opportunity/gpw.json \
            --evidence data/investments/stock_trading_v2_evidence/gpw.json

      - name: Freeze current Champion admission for newly observed opportunities
        run: |
          set -euo pipefail
          if [[ -f /tmp/stock-trading-v2-production-policy.json ]]; then
            python scripts/stock_trading_v2_admission_ledger.py --policy /tmp/stock-trading-v2-production-policy.json
          else
            python scripts/stock_trading_v2_admission_ledger.py
          fi

      - name: Validate generated frontiers evidence opportunity decisions and immutable stores
        env:
          US_ACTIVE_THIS_CYCLE: ${{ steps.market_window.outputs.us }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.stock_trading_v2_discovery import validate_frontier
          from scripts.stock_trading_v2_deep_evidence import validate_deep_evidence
          from scripts.stock_trading_v2_opportunity_engine import validate_opportunity

          us_active_this_cycle=os.environ.get('US_ACTIVE_THIS_CYCLE','false').lower() == 'true'
          for market in ('gpw','us'):
              frontier_path=Path(f'data/investments/stock_trading_v2_frontier/{market}.json')
              evidence_path=Path(f'data/investments/stock_trading_v2_evidence/{market}.json')
              opportunity_path=Path(f'data/investments/stock_trading_v2_opportunity/{market}.json')
              if not frontier_path.exists():
                  continue
              frontier=json.loads(frontier_path.read_text(encoding='utf-8'))
              validate_frontier(frontier)
              assert frontier['global_selection_cutoff'] is None
              assert frontier['governance']['production_decision_influence'] is False
              if market == 'us':
                  from scripts.briefrooms_market_relationship_trigger import load_config as load_trigger_config, validate_snapshot as validate_trigger_snapshot
                  trigger_path=Path('data/investments/market_relationship_trigger/us.json')
                  if us_active_this_cycle:
                      assert trigger_path.exists(), 'US Trigger snapshot missing from an active US discovery cycle'
                  if trigger_path.exists():
                      trigger=json.loads(trigger_path.read_text(encoding='utf-8'))
                      validate_trigger_snapshot(trigger, load_trigger_config())
                      assert trigger['governance']['production_decision_influence'] is False
                      assert trigger['governance']['deep_belief_execution'] is False
                      assert len(trigger['attention_queue']) <= 6
                      if us_active_this_cycle:
                          assert trigger['source_frontier_sha256'] == frontier['frontier_sha256']
              if evidence_path.exists():
                  evidence=json.loads(evidence_path.read_text(encoding='utf-8'))
                  validate_deep_evidence(evidence)
                  assert evidence['source_frontier_sha256'] == frontier['frontier_sha256']
              if opportunity_path.exists():
                  opportunity=json.loads(opportunity_path.read_text(encoding='utf-8'))
                  validate_opportunity(opportunity)
                  assert opportunity['governance']['production_decision_influence'] is False
                  assert opportunity['governance']['execution_ready'] is False
              print('V2_OPPORTUNITY_LOOP_OK', market.upper(), frontier['frontier_size'], frontier['generated_at'])
          PY
          python scripts/stock_trading_v2_experience_store.py --verify
          python scripts/stock_trading_v2_admission_ledger.py --verify

      - name: Commit materialized shadow opportunity loop
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/investments/stock_trading_v2_frontier \
            data/investments/stock_trading_v2_evidence \
            data/investments/stock_trading_v2_opportunity \
            data/investments/stock_trading_v2_experience \
            data/investments/stock_trading_v2_admission \
            data/investments/market_relationship_trigger \
            data/investments/market_relationship_trigger_history \
            2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No shadow opportunity changes to commit."
            exit 0
          fi
          git commit -m "Stock Trading v2: refresh continuous opportunity loop"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin stock-trading-v2 && git push origin HEAD:stock-trading-v2; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin stock-trading-v2
            git rebase origin/stock-trading-v2
            sleep $((attempt*3))
          done
          exit 1
