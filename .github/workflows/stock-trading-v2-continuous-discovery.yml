name: Stock Trading v2 Continuous Discovery

on:
  workflow_dispatch:
    inputs:
      market:
        description: "Market to scan (AUTO, GPW, US, BOTH)"
        required: false
        default: "AUTO"
  schedule:
    # Broad UTC envelope; the job decides from each exchange's local clock.
    # This avoids DST-specific cron maintenance and creates no selection cutoff.
    - cron: "40 6-22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: stock-trading-v2-continuous-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out Stock Trading v2
        uses: actions/checkout@v4
        with:
          ref: stock-trading-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve active market windows
        id: market_window
        env:
          REQUESTED_MARKET: ${{ github.event.inputs.market || 'AUTO' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, time, timezone
          from zoneinfo import ZoneInfo

          requested=os.environ.get('REQUESTED_MARKET','AUTO').upper()
          now=datetime.now(timezone.utc)

          def active(tz_name, start, end):
              local=now.astimezone(ZoneInfo(tz_name))
              return local.weekday() < 5 and start <= local.time().replace(tzinfo=None) <= end

          gpw=active('Europe/Warsaw', time(8,40), time(17,20))
          us=active('America/New_York', time(9,35), time(16,35))
          if requested == 'GPW':
              gpw, us = True, False
          elif requested == 'US':
              gpw, us = False, True
          elif requested == 'BOTH':
              gpw, us = True, True
          elif requested != 'AUTO':
              raise SystemExit(f'Unsupported market input: {requested}')
          print(f'gpw={str(gpw).lower()}')
          print(f'us={str(us).lower()}')
          print(f'now_utc={now.isoformat()}')
          PY

      - name: Validate v2 discovery configuration
        run: |
          set -euo pipefail
          python -m json.tool data/investments/stock_trading_v2_discovery_config.json >/dev/null
          python -m py_compile \
            scripts/stock_trading_v2_discovery.py \
            scripts/stock_trading_v2_live_scan.py \
            scripts/stock_trading_v2_us_screener_provider.py

      - name: US broad stage-zero and Opportunity Frontier
        if: steps.market_window.outputs.us == 'true'
        run: |
          set -euo pipefail
          rm -f /tmp/stock-trading-v2-us-stage-zero.json
          python scripts/stock_trading_v2_live_scan.py \
            --universe data/investments/stock_trading_v2_universe/us.json \
            --output /tmp/stock-trading-v2-us-stage-zero.json
          python scripts/stock_trading_v2_discovery.py \
            --market US \
            --stage-zero /tmp/stock-trading-v2-us-stage-zero.json \
            --output data/investments/stock_trading_v2_frontier/us.json

      - name: GPW broad Opportunity Frontier
        if: steps.market_window.outputs.gpw == 'true'
        run: |
          set -euo pipefail
          python scripts/stock_trading_v2_discovery.py \
            --market GPW \
            --output data/investments/stock_trading_v2_frontier/gpw.json

      - name: Validate generated frontiers
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.stock_trading_v2_discovery import validate_frontier
          for market in ('gpw','us'):
              path=Path(f'data/investments/stock_trading_v2_frontier/{market}.json')
              if not path.exists():
                  continue
              payload=json.loads(path.read_text(encoding='utf-8'))
              validate_frontier(payload)
              assert payload['global_selection_cutoff'] is None
              assert payload['governance']['production_decision_influence'] is False
              print('FRONTIER_OK', market.upper(), payload['frontier_size'], payload['generated_at'])
          PY

      - name: Commit materialized shadow frontiers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/stock_trading_v2_frontier 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No frontier changes to commit."
            exit 0
          fi
          git commit -m "Stock Trading v2: refresh continuous opportunity frontier"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin stock-trading-v2 && git push origin HEAD:stock-trading-v2; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin stock-trading-v2
            git rebase origin/stock-trading-v2
            sleep $((attempt*3))
          done
          exit 1
