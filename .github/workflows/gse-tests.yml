name: GSE Tests

on:
  pull_request:
    paths:
      - "scripts/geopolitical_scenario_engine.py"
      - "tests/test_geopolitical_scenario_engine.py"
      - ".github/workflows/gse-tests.yml"
      - ".github/workflows/gse-shadow-live.yml"
  push:
    branches: [main]
    paths:
      - "scripts/geopolitical_scenario_engine.py"
      - "tests/test_geopolitical_scenario_engine.py"
      - ".github/workflows/gse-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile GSE
        run: python -m py_compile scripts/geopolitical_scenario_engine.py
      - name: Run GSE tests
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python -m unittest tests.test_geopolitical_scenario_engine -v
