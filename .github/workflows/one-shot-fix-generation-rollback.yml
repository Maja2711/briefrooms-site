name: One-shot fix generation rollback

on:
  push:
    branches: [feat/stock-trading-v2-generation-promotion]
    paths:
      - ".github/workflows/one-shot-fix-generation-rollback.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stock-trading-v2-generation-promotion
          fetch-depth: 0
      - name: Fix zero positive-rate rollback semantics and remove one-shot workflow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/stock_trading_generation_promotion.py')
          text=path.read_text(encoding='utf-8')
          old='"positive_rate_bad": float(metrics.get("paired_net_positive_rate") or 1.0) <= float(rollback["maximum_net_positive_rate"]),'
          new='"positive_rate_bad": float(metrics.get("paired_net_positive_rate") if metrics.get("paired_net_positive_rate") is not None else 1.0) <= float(rollback["maximum_net_positive_rate"]),'
          if old not in text:
              raise SystemExit('expected rollback expression not found')
          path.write_text(text.replace(old,new), encoding='utf-8')
          PY
          git rm .github/workflows/one-shot-fix-generation-rollback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stock_trading_generation_promotion.py
          git commit -m "Fix generation rollback zero positive rate"
          git pull --rebase origin feat/stock-trading-v2-generation-promotion
          git push origin HEAD:feat/stock-trading-v2-generation-promotion
