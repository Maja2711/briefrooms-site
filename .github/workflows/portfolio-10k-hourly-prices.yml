name: Refresh Portfolio 10K Hourly Prices

on:
  workflow_dispatch:
  schedule:
    - cron: "11 6-21 * * 1-5"
  push:
    branches: [main]
    paths:
      - "scripts/portfolio_10k_hourly_prices.py"
      - "scripts/reconcile_portfolio_10k_executions.py"
      - "scripts/build_portfolio_10k_usd.py"
      - "scripts/fix_portfolio_10k_usd_reviews.py"
      - "scripts/patch_portfolio_10k_en_usd.py"
      - "scripts/patch_portfolio_10k_hourly_ui.py"
      - "scripts/portfolio-10k-*.js"
      - "scripts/brace_portfolio_execution.py"
      - "scripts/brace_portfolio_user_control.py"
      - "data/portfolio10k/paper_orders.json"
      - "data/portfolio10k/paper_portfolio.json"
      - "assets/portfolio-10k-accessibility.css"
      - "assets/portfolio-10k-decision-overlay.css"
      - "pl/inwestycje/portfel-10k.html"
      - "en/investing/portfolio-10k.html"
      - ".github/workflows/portfolio-10k-hourly-prices.yml"

permissions:
  contents: write
concurrency:
  group: portfolio-market-data
  cancel-in-progress: false

jobs:
  refresh-hourly-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install quote dependencies
        run: python -m pip install --upgrade pip yfinance pandas numpy
      - name: Reconcile already executed paper trades
        run: python scripts/reconcile_portfolio_10k_executions.py
      - name: Refresh current prices and portfolio valuation
        run: python scripts/portfolio_10k_hourly_prices.py
      - name: Build independent USD portfolio and journal
        run: |
          python scripts/build_portfolio_10k_usd.py
          python scripts/fix_portfolio_10k_usd_reviews.py
      - name: Patch public PL and EN pages
        run: |
          python scripts/patch_portfolio_10k_en_usd.py
          python scripts/patch_portfolio_10k_hourly_ui.py
      - name: Activate and retry authorised BRACE paper orders
        run: |
          python scripts/brace_portfolio_user_control.py || echo "::warning::BRACE activation deferred."
          python scripts/brace_portfolio_execution.py --network || echo "::warning::BRACE paper execution deferred; valuation publication continues."
          python scripts/brace_portfolio_user_control.py --republish || echo "::warning::BRACE public snapshot republish deferred."
      - name: Reconcile trades executed during this run
        run: python scripts/reconcile_portfolio_10k_executions.py
      - name: Validate public labels and assets
        run: |
          grep -q 'Start: lipiec 2026' pl/inwestycje/portfel-10k.html
          grep -q 'Started: July 2026' en/investing/portfolio-10k.html
          grep -q 'Kapitał startowy' pl/inwestycje/portfel-10k.html
          grep -q 'Starting capital' en/investing/portfolio-10k.html
          grep -q 'portfolio-10k-accessibility.css?v=2' pl/inwestycje/portfel-10k.html
          grep -q 'portfolio-10k-accessibility.css?v=2' en/investing/portfolio-10k.html
          grep -q 'portfolio-10k-explainers.js?v=4' pl/inwestycje/portfel-10k.html
          grep -q 'portfolio-10k-explainers.js?v=4' en/investing/portfolio-10k.html
          grep -q 'portfolio-10k-verified-material-loader.js?v=2' pl/inwestycje/portfel-10k.html
          grep -q 'portfolio-10k-verified-material-loader.js?v=2' en/investing/portfolio-10k.html
          grep -q 'portfolio-10k-decision-overlay.css?v=1' pl/inwestycje/portfel-10k.html
          grep -q 'portfolio-10k-decision-overlay.css?v=1' en/investing/portfolio-10k.html
          grep -q 'portfolio-10k-decision-overlay.js?v=2' pl/inwestycje/portfel-10k.html
          grep -q 'portfolio-10k-decision-overlay.js?v=2' en/investing/portfolio-10k.html
          grep -q 'portfolio-10k-execution-finalizer.js?v=1' pl/inwestycje/portfel-10k.html
          grep -q 'portfolio-10k-execution-finalizer.js?v=1' en/investing/portfolio-10k.html
      - name: Validate accounting and JavaScript
        run: |
          python -m py_compile scripts/reconcile_portfolio_10k_executions.py
          python scripts/validate_portfolio_10k_state.py
          node --check scripts/portfolio-10k-public.js
          node --check scripts/portfolio-10k-dashboard-en.js
          node --check scripts/portfolio-10k-usd-source.js
          node --check scripts/portfolio-10k-analytics-enhanced.js
          node --check scripts/portfolio-10k-capital-summary.js
          node --check scripts/portfolio-10k-explainers.js
          node --check scripts/portfolio-10k-control-public.js
          node --check scripts/portfolio-10k-verified-material-loader.js
          node --check scripts/portfolio-10k-decision-overlay.js
          node --check scripts/portfolio-10k-execution-finalizer.js
          python - <<'PY'
          import json
          from pathlib import Path
          public = json.loads(Path('data/portfolio10k/public/brace_engine_public.json').read_text())
          orders = json.loads(Path('data/portfolio10k/paper_orders.json').read_text())
          portfolio = json.loads(Path('data/investments/portfolio_10k.json').read_text())
          decision = next((d for d in public.get('pending_decisions', []) if d.get('instrument') == 'novo'), None)
          order = next((o for o in orders.get('orders', []) if o.get('sell_instrument') == 'novo'), None)
          assert decision and decision.get('action') == 'EXIT', 'Novo public decision must be EXIT'
          assert order and order.get('status') in {'WAITING_FOR_MARKET', 'PAPER_EXECUTED'}, 'Novo paper order must be visible'
          assert '2 zweryfikowanych raport' in decision.get('rationale_pl', ''), 'Novo rationale must preserve verified-report basis'
          if order.get('status') == 'PAPER_EXECUTED':
              assert not any(p.get('id') == 'novo' and p.get('status') == 'active' for p in portfolio.get('positions', [])), 'Executed Novo exit cannot remain active'
              assert any(p.get('id') == 'novo' for p in portfolio.get('closed_positions', [])), 'Executed Novo exit must be in closed history'
          PY
      - name: Commit hourly valuation, UI and paper state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/portfolio_10k.json \
                  data/investments/portfolio_10k_usd.json \
                  pl/inwestycje/portfel-10k.html \
                  en/investing/portfolio-10k.html
          git add -A data/portfolio10k
          if git diff --cached --quiet; then
            echo "No hourly valuation change to commit."
          else
            git commit -m "Refresh Portfolio 10K current prices"
            if ! git diff --quiet; then
              echo "::error::Updater left unstaged files; refusing a partial publication."
              git status --short
              exit 1
            fi
            git pull --rebase origin main
            git push
          fi
