name: Refresh Portfolio 10K Hourly Prices

on:
  workflow_dispatch:
  schedule:
    # Covers European and US cash sessions throughout DST changes.
    - cron: "11 6-21 * * 1-5"
  push:
    branches: [main]
    paths:
      - "scripts/portfolio_10k_hourly_prices.py"
      - "scripts/build_portfolio_10k_usd.py"
      - "scripts/patch_portfolio_10k_en_usd.py"
      - "scripts/portfolio-10k-usd-source.js"
      - "scripts/patch_portfolio_10k_hourly_ui.py"
      - "scripts/portfolio-10k-public.js"
      - "scripts/portfolio-10k-dashboard-en.js"
      - "scripts/portfolio-10k-analytics-enhanced.js"
      - "pl/inwestycje/portfel-10k.html"
      - "en/investing/portfolio-10k.html"
      - ".github/workflows/portfolio-10k-hourly-prices.yml"

permissions:
  contents: write

concurrency:
  group: portfolio-market-data
  cancel-in-progress: false

jobs:
  refresh-hourly-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install quote dependencies
        run: python -m pip install --upgrade pip yfinance pandas

      - name: Refresh current prices and portfolio valuation
        run: python scripts/portfolio_10k_hourly_prices.py

      - name: Build independent USD 10K portfolio
        run: python scripts/build_portfolio_10k_usd.py

      - name: Patch English page for native USD source
        run: python scripts/patch_portfolio_10k_en_usd.py

      - name: Apply PL and EN hourly-price UI patch
        if: ${{ hashFiles('scripts/patch_portfolio_10k_hourly_ui.py') != '' }}
        run: python scripts/patch_portfolio_10k_hourly_ui.py

      - name: Validate launch labels
        run: |
          grep -q 'Start: lipiec 2026' pl/inwestycje/portfel-10k.html
          grep -q 'Started: July 2026' en/investing/portfolio-10k.html
          grep -q 'portfolio-10k-analytics-enhanced.js?v=2' pl/inwestycje/portfel-10k.html
          grep -q 'portfolio-10k-analytics-enhanced.js?v=2' en/investing/portfolio-10k.html

      - name: Validate accounting consistency
        run: python scripts/validate_portfolio_10k_state.py

      - name: Validate public JavaScript
        run: |
          node --check scripts/portfolio-10k-public.js
          node --check scripts/portfolio-10k-dashboard-en.js
          node --check scripts/portfolio-10k-usd-source.js
          node --check scripts/portfolio-10k-analytics-enhanced.js

      - name: Commit hourly valuation and UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/portfolio_10k.json \
                  data/investments/portfolio_10k_usd.json \
                  pl/inwestycje/portfel-10k.html \
                  en/investing/portfolio-10k.html
          if git diff --cached --quiet; then
            echo "No hourly valuation change to commit."
          else
            git commit -m "Refresh Portfolio 10K current prices"
            if ! git diff --quiet; then
              echo "::error::Price updater left unstaged files; refusing a partial publication."
              git status --short
              exit 1
            fi
            git pull --rebase origin main
            git push
          fi
