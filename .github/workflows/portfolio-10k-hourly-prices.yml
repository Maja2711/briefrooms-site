name: Refresh Portfolio 10K Hourly Prices

on:
  workflow_dispatch:
  schedule:
    - cron: "11 6-21 * * 1-5"
  push:
    branches: [main]
    paths:
      - "scripts/portfolio_10k_hourly_prices.py"
      - "scripts/portfolio_10k_guardian.py"
      - "scripts/portfolio_10k_hard_gate.py"
      - "scripts/reconcile_portfolio_10k_executions.py"
      - "scripts/portfolio_10k_execution_ledger.py"
      - "scripts/sync_portfolio_10k_from_transaction_ledger.py"
      - "scripts/build_portfolio_10k_usd.py"
      - "scripts/fix_portfolio_10k_usd_reviews.py"
      - "scripts/render_portfolio_10k_static.py"
      - "scripts/validate_portfolio_10k_state.py"
      - "scripts/brace_portfolio_execution.py"
      - "scripts/brace_portfolio_user_control.py"
      - "tests/test_portfolio_10k_guardian.py"
      - "tests/test_portfolio_10k_execution_persistence.py"
      - "tests/test_validate_portfolio_10k_state.py"
      - "data/portfolio10k/paper_orders.json"
      - "data/portfolio10k/paper_portfolio.json"
      - ".github/workflows/portfolio-10k-hourly-prices.yml"

permissions:
  contents: write

concurrency:
  group: portfolio-market-data
  cancel-in-progress: false

jobs:
  publish-core-valuation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install market dependencies
        run: python -m pip install --upgrade pip yfinance pandas numpy

      - name: Reconcile durable executed paper trades
        run: |
          python scripts/sync_portfolio_10k_from_transaction_ledger.py
          python scripts/reconcile_portfolio_10k_executions.py

      - name: Mark portfolio to market
        run: python scripts/portfolio_10k_hourly_prices.py

      - name: Build independent USD portfolio
        run: |
          python scripts/build_portfolio_10k_usd.py
          python scripts/fix_portfolio_10k_usd_reviews.py

      - name: Run portfolio guardian and cash-deployment gate
        run: python scripts/portfolio_10k_guardian.py

      - name: Attempt only authorised paper orders
        run: |
          python scripts/brace_portfolio_user_control.py || echo "::warning::BRACE activation deferred; MTM publication continues."
          python scripts/brace_portfolio_execution.py --network || echo "::warning::Paper execution deferred; MTM publication continues."
          python scripts/brace_portfolio_user_control.py --republish || echo "::warning::BRACE republish deferred; MTM publication continues."

      - name: Reconcile any execution from this run
        run: |
          python scripts/sync_portfolio_10k_from_transaction_ledger.py
          python scripts/reconcile_portfolio_10k_executions.py
          python scripts/build_portfolio_10k_usd.py
          python scripts/fix_portfolio_10k_usd_reviews.py
          python scripts/portfolio_10k_guardian.py

      - name: Hard accounting publication gate
        run: |
          python -m py_compile \
            scripts/portfolio_10k_hourly_prices.py \
            scripts/portfolio_10k_guardian.py \
            scripts/portfolio_10k_hard_gate.py \
            scripts/reconcile_portfolio_10k_executions.py \
            scripts/portfolio_10k_execution_ledger.py \
            scripts/sync_portfolio_10k_from_transaction_ledger.py
          python -m unittest tests.test_portfolio_10k_execution_persistence -v
          python scripts/portfolio_10k_hard_gate.py

      - name: Verify public holdings equal durable paper ledger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          public=json.loads(Path('data/investments/portfolio_10k.json').read_text(encoding='utf-8'))
          paper=json.loads(Path('data/portfolio10k/paper_portfolio.json').read_text(encoding='utf-8'))
          public_ids={str(p.get('id') or p.get('instrument_id')) for p in public.get('positions',[]) if p.get('status') == 'active'}
          paper_ids={str(p.get('id') or p.get('instrument_id')) for p in paper.get('positions',[]) if p.get('status') in {'active','paper_active'}}
          assert public_ids == paper_ids, (public_ids,paper_ids)
          state=public.get('execution_reconciliation') or {}
          assert state.get('execution_authority') == 'paper_portfolio.transactions', state
          print('HOLDINGS_LEDGER_PARITY_OK',sorted(public_ids))
          PY

      - name: Publish core valuation immediately after hard gate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/portfolio_10k.json \
                  data/investments/portfolio_10k_usd.json
          git add -A data/portfolio10k
          if git diff --cached --quiet; then
            echo "No core valuation change to commit."
            exit 0
          fi
          git commit -m "Mark Portfolio 10K to market"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git reset --hard HEAD
            git clean -fd
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
          exit 1

      - name: Legacy and schema audit after publication
        continue-on-error: true
        run: |
          python -m py_compile scripts/validate_portfolio_10k_state.py
          python -m unittest tests.test_validate_portfolio_10k_state -v
          python -m unittest tests.test_portfolio_10k_guardian -v
          python -m unittest tests.test_brace_portfolio_reconciliation -v
          python -m unittest tests.test_portfolio_10k_execution_persistence -v
          python scripts/validate_portfolio_10k_state.py

  refresh-public-snapshots:
    needs: publish-core-valuation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Render crawlable PL and EN snapshots from committed core data
        run: |
          python scripts/render_portfolio_10k_static.py
          python - <<'PY'
          from pathlib import Path
          import re
          for path in (Path('pl/inwestycje/portfel-10k.html'), Path('en/investing/portfolio-10k.html')):
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'/scripts/portfolio-10k-control-public\.js\?v=\d+', '/scripts/portfolio-10k-control-public.js?v=4', text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate semantic UI contract without pinning asset versions
        run: |
          python scripts/render_portfolio_10k_static.py --check
          python -m unittest tests.test_investment_room_static_seo -v
          node --check scripts/portfolio-10k-public.js
          node --check scripts/portfolio-10k-dashboard.js
          node --check scripts/portfolio-10k-dashboard-en.js
          node --check scripts/portfolio-10k-control-public.js
          node --check scripts/portfolio-10k-execution-finalizer.js
          node --check scripts/portfolio-10k-navigation-guard.js
          python - <<'PY'
          from pathlib import Path
          pl=Path('pl/inwestycje/portfel-10k.html').read_text(encoding='utf-8')
          en=Path('en/investing/portfolio-10k.html').read_text(encoding='utf-8')
          assert 'Start: lipiec 2026' in pl
          assert 'Started: July 2026' in en
          assert 'Kapitał startowy' in pl and 'Starting capital' in en
          assert 'id="brace-control-root"' in pl and 'id="brace-control-root"' in en
          assert 'data-tab="projections"' not in pl and 'data-tab="projections"' not in en
          for asset in ('portfolio-10k-control-public.js','portfolio-10k-execution-finalizer.js','portfolio-10k-navigation-guard.js'):
              assert asset in pl and asset in en
          assert '/scripts/portfolio-10k-control-public.js?v=4' in pl
          assert '/scripts/portfolio-10k-control-public.js?v=4' in en
          PY

      - name: Publish static snapshots
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pl/inwestycje/portfel-10k.html en/investing/portfolio-10k.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Portfolio 10K public snapshots"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git reset --hard HEAD
            git clean -fd
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
          exit 1

# trigger: durable transaction-ledger portfolio sync 2026-08-19
