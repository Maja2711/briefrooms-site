name: Validate US Daily Position Integrity

on:
  pull_request:
    paths:
      - "scripts/us_daily_stock_integrity.py"
      - "scripts/us_daily_stock_position_monitor.py"
      - "scripts/us_daily_stock_position_lifecycle.py"
      - "scripts/us_daily_stock_runtime.py"
      - "scripts/daily-stock-position-ux.js"
      - "tests/test_us_daily_stock_integrity.py"
      - "tests/test_us_daily_stock_monitor_first_touch.py"
      - "tests/test_us_daily_stock_position_lifecycle.py"
      - "tests/test_gpw_daily_pick_ui.py"
      - ".github/workflows/us-daily-integrity-ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/us_daily_stock_integrity.py"
      - "scripts/us_daily_stock_position_monitor.py"
      - "scripts/daily-stock-position-ux.js"
      - "tests/test_us_daily_stock_integrity.py"
      - "tests/test_us_daily_stock_monitor_first_touch.py"
      - ".github/workflows/us-daily-integrity-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run US Daily ledger and first-touch tests
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_us_daily_stock_integrity \
            tests.test_us_daily_stock_monitor_first_touch \
            tests.test_us_daily_stock_position_lifecycle \
            tests.test_gpw_daily_pick_ui -v
          python -m py_compile \
            scripts/us_daily_stock_integrity.py \
            scripts/us_daily_stock_position_monitor.py \
            scripts/us_daily_stock_position_lifecycle.py \
            scripts/us_daily_stock_runtime.py
          node --check scripts/daily-stock-position-ux.js
