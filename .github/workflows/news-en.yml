name: Build EN News (6x daily)

on:
  schedule:
    - cron: "40 */4 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/fetch_news_en.py"
      - "scripts/fetch_news_en_context.py"
      - "scripts/read_and_summarize_articles.py"
      - "scripts/newsroom_articles.py"
      - "scripts/newsroom_style.py"
      - "scripts/news_story_dedupe.py"
      - "scripts/comment_quality.py"
      - "scripts/en-news-thumbs.js"
      - "scripts/add_en_news_hook.py"
      - "tests/test_comment_quality.py"
      - "tests/test_fetch_news_en.py"
      - "tests/test_validate_news_home_publish.py"
      - "scripts/validate_news_home_publish.py"
      - "scripts/build_home_brief_en.py"
      - "scripts/generate_permanent_briefs.py"
      - "scripts/protect_home_feed.py"
      - ".github/workflows/news-en.yml"

permissions:
  contents: write
  models: read

concurrency:
  # Serialize PL and EN because both use the same GitHub Models rate-limit budget.
  group: content-publishing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync latest main before generation
        run: git pull --ff-only origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser python-dateutil requests

      - name: Test strict PL and EN comment contract
        run: python -m unittest discover -s tests -p "test_comment_quality.py"

      - name: Test EN news builder
        run: python -m unittest tests.test_fetch_news_en tests.test_news_story_dedupe -v

      - name: Generate EN News with homepage-grade full-article comments
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_AI_MODEL: gpt-4o-mini
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: openai/gpt-4o-mini
          GITHUB_MODELS_REVIEW_MODEL: openai/gpt-4.1-mini
          GITHUB_MODELS_MIN_INTERVAL_SECONDS: "12"
          BR_NEWS_PERSIST_HISTORY: "1"
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt/3: python scripts/fetch_news_en_context.py && python scripts/add_en_news_hook.py"
            if python scripts/fetch_news_en_context.py && python scripts/add_en_news_hook.py; then
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "::error::python scripts/fetch_news_en_context.py && python scripts/add_en_news_hook.py failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 60))
          done

      - name: Build and validate EN homepage in the same publication
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_AI_MODEL: gpt-4o-mini
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: openai/gpt-4o-mini
          GITHUB_MODELS_REVIEW_MODEL: openai/gpt-4.1-mini
          GITHUB_MODELS_MIN_INTERVAL_SECONDS: "12"
        run: |
          python scripts/protect_home_feed.py --backup --lang en
          published=false
          for attempt in 1 2 3; do
            export BR_HOME_CANDIDATE_LIMIT=$((24 + attempt * 12))
            echo "Attempt $attempt/3: complete EN homepage publication with $BR_HOME_CANDIDATE_LIMIT candidates from the last 12 hours"
            if python scripts/build_home_brief_en.py               && python scripts/read_and_summarize_articles.py               && python scripts/enforce_brief_length.py               && python scripts/remove_urgent_badge_categories.py               && python scripts/validate_brief_quality.py               && python scripts/dedupe_home_brief_stories.py               && python scripts/hide_urgent_home_labels.py               && python scripts/patch_brief_comment_source.py               && python scripts/protect_home_feed.py --validate --lang en               && python scripts/generate_permanent_briefs.py               && python -m unittest tests.test_validate_news_home_publish tests.test_homepage_static -v               && python scripts/validate_news_home_publish.py --lang en --max-age-minutes 360; then
              published=true
              break
            fi
            sleep $((attempt * 60))
          done
          if [[ "$published" != "true" ]]; then
            echo "::error::Complete EN publication failed after exhausting 36, 48 and 60 candidate pools"
            exit 1
          fi

      - name: Commit and push the complete publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main
          if ! git diff --quiet HEAD..origin/main -- .github/workflows/news-en.yml scripts/fetch_news_en.py scripts/fetch_news_en_context.py scripts/news_story_dedupe.py scripts/read_and_summarize_articles.py scripts/newsroom_articles.py scripts/newsroom_style.py scripts/comment_quality.py tests/test_comment_quality.py tests/test_fetch_news_en.py tests/test_news_story_dedupe.py; then
            echo "::error::Generator code changed during EN publication; refusing stale output."
            exit 1
          fi
          git add en/news.html data/news_story_history_en.json en/home_brief.json en/index.html en/brief.html en/briefs data/permanent_briefs_en.json sitemap.xml .cache
          if git diff --cached --quiet; then
            echo "::error::EN publication produced no changes"
            exit 1
          fi
          git restore --worktree .
          git commit -m "chore(news-en): publish news and homepage atomically"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main
            if git push; then exit 0; fi
            sleep $((attempt * 30))
          done
          echo "::error::Could not push EN publication after 3 attempts"
          exit 1
