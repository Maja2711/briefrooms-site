name: EURUSD X shadow lab

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * 1-5"

permissions:
  contents: write

concurrency:
  group: eurusd-x-shadow
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run EURUSD X shadow cycle
        run: |
          python scripts/eurusd_x_shadow.py \
            --state data/investments/eurusd_x_state.json \
            --public data/investments/eurusd_x_public_pl.json \
            --belief-state data/investments/eurusd_abc_public_pl.json

      - name: Validate immutable X core
        run: |
          python - <<'PY'
          import json
          p=json.load(open("data/investments/eurusd_x_public_pl.json",encoding="utf-8"))
          c=p["fixed_core"]
          assert c["ma_periods"] == [30,60,100,200]
          assert c["ma_timeframes"] == ["1H","1D","1W","1M"]
          assert c["pivot"] == "classic_daily"
          assert c["bollinger"]["window"] == 20
          assert c["bollinger"]["sigma"] == 2.5
          assert c["bollinger"]["timeframes"] == ["1H","1D"]
          assert c["belief_core"] == "BriefRooms Belief Core"
          assert p["mode"] == "SHADOW ONLY"
          PY

      - name: Commit changed X shadow state
        run: |
          if git diff --quiet -- data/investments/eurusd_x_state.json data/investments/eurusd_x_public_pl.json; then
            echo "No EURUSD X change."
            exit 0
          fi
          git config user.name "briefrooms-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/investments/eurusd_x_state.json data/investments/eurusd_x_public_pl.json
          git commit -m "Update EURUSD X shadow state"
          git pull --rebase origin main
          git push origin HEAD:main
