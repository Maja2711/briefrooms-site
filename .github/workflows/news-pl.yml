name: Build PL Aktualności (6x dziennie)

on:
  schedule:
    # Czasy w UTC: co 4 godziny.
    - cron: "10 */4 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/fetch_news_pl.py"
      - "scripts/fetch_news_pl_hybrid.py"
      - "scripts/fetch_news_pl_deep.py"
      - "scripts/news_story_dedupe.py"
      - "scripts/read_and_summarize_articles.py"
      - "scripts/newsroom_articles.py"
      - "scripts/newsroom_style.py"
      - "scripts/comment_quality.py"
      - "tests/test_fetch_news_pl.py"
      - "tests/test_validate_news_home_publish.py"
      - "scripts/validate_news_home_publish.py"
      - "scripts/build_home_brief_pl.py"
      - "scripts/generate_permanent_briefs.py"
      - "scripts/protect_home_feed.py"
      - "tests/test_comment_quality.py"
      - ".github/workflows/news-pl.yml"

permissions:
  contents: write
  models: read

concurrency:
  # Shared multi-provider cooldown queue; PL is re-queued after EN completes.
  group: content-publishing
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync latest main before generation
        run: git pull --ff-only origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser python-dateutil requests

      - name: Test PL news builder
        run: python -m unittest tests.test_fetch_news_pl tests.test_news_story_dedupe -v

      - name: Test strict PL and EN comment contract
        run: python -m unittest discover -s tests -p "test_comment_quality.py"

      - name: Generate PL Aktualności with homepage-grade full-article comments
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_AI_MODEL: gpt-4o-mini
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: openai/gpt-4o-mini
          GITHUB_MODELS_REVIEW_MODEL: openai/gpt-4.1-mini
          GITHUB_MODELS_FALLBACK_MODEL: mistral-ai/mistral-medium-2505
          GITHUB_MODELS_FALLBACK_REVIEW_MODEL: cohere/cohere-command-a
          GITHUB_MODELS_MIN_INTERVAL_SECONDS: "12"
          BR_NEWS_PERSIST_HISTORY: "1"
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt/3: python scripts/fetch_news_pl_deep.py"
            if python scripts/fetch_news_pl_deep.py; then
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "::error::python scripts/fetch_news_pl_deep.py failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 60))
          done

      - name: Build and validate PL homepage in the same publication
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_AI_MODEL: gpt-4o-mini
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: openai/gpt-4o-mini
          GITHUB_MODELS_REVIEW_MODEL: openai/gpt-4.1-mini
          GITHUB_MODELS_FALLBACK_MODEL: mistral-ai/mistral-medium-2505
          GITHUB_MODELS_FALLBACK_REVIEW_MODEL: cohere/cohere-command-a
          GITHUB_MODELS_MIN_INTERVAL_SECONDS: "12"
        run: |
          python scripts/protect_home_feed.py --backup --lang pl
          for attempt in 1 2 3; do
            echo "Attempt $attempt/3: python scripts/build_home_brief_pl.py"
            if python scripts/build_home_brief_pl.py; then
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "::error::python scripts/build_home_brief_pl.py failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 60))
          done
          python scripts/read_and_summarize_articles.py
          python scripts/enforce_brief_length.py
          python scripts/remove_urgent_badge_categories.py
          python scripts/validate_brief_quality.py
          python scripts/dedupe_home_brief_stories.py
          python scripts/hide_urgent_home_labels.py
          python scripts/patch_brief_comment_source.py
          python scripts/protect_home_feed.py --validate --lang pl
          python scripts/generate_permanent_briefs.py
          python -m unittest tests.test_validate_news_home_publish tests.test_homepage_static -v
          python scripts/validate_news_home_publish.py --lang pl --max-age-minutes 360

      - name: Commit and push the complete publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main
          if ! git diff --quiet HEAD..origin/main -- .github/workflows/news-pl.yml scripts/fetch_news_pl.py scripts/fetch_news_pl_hybrid.py scripts/fetch_news_pl_deep.py scripts/news_story_dedupe.py scripts/read_and_summarize_articles.py scripts/newsroom_articles.py scripts/newsroom_style.py scripts/comment_quality.py tests/test_comment_quality.py tests/test_fetch_news_pl.py tests/test_news_story_dedupe.py; then
            echo "::error::Generator code changed during PL publication; refusing stale output."
            exit 1
          fi
          git add pl/aktualnosci.html data/news_story_history_pl.json pl/home_brief.json pl/index.html pl/brief.html pl/briefy data/permanent_briefs_pl.json sitemap.xml .cache
          if git diff --cached --quiet; then
            echo "::error::PL publication produced no changes"
            exit 1
          else
            git restore --worktree .
            git commit -m "chore(news-pl): publish news and homepage atomically"
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main
              if git push; then exit 0; fi
              sleep $((attempt * 30))
            done
            echo "::error::Could not push PL publication after 3 attempts"
            exit 1
          fi
