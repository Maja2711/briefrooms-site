name: Runtime Belief and GSE Audit

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-belief-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore latest production artifacts read-only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/belief" "$RUNNER_TEMP/gse"
          restore_latest() {
            name="$1"
            dest="$2"
            expected="$3"
            meta="$RUNNER_TEMP/${name}-artifacts.json"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" > "$meta"
            read -r artifact_id created_at updated_at size <<< "$(python - "$meta" <<'PY'
          import json,sys
          from pathlib import Path
          p=json.loads(Path(sys.argv[1]).read_text())
          rows=[x for x in p.get('artifacts',[]) if not x.get('expired')]
          rows.sort(key=lambda x:x.get('created_at',''), reverse=True)
          if rows:
              x=rows[0]
              print(x['id'], x.get('created_at',''), x.get('updated_at',''), x.get('size_in_bytes',0))
          PY
            )"
            if [ -z "${artifact_id:-}" ]; then
              echo "AUDIT_ARTIFACT name=${name} status=missing"
              return 0
            fi
            echo "AUDIT_ARTIFACT name=${name} id=${artifact_id} created_at=${created_at} updated_at=${updated_at} size=${size}"
            curl -fsSL -L \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o "$RUNNER_TEMP/${name}.zip"
            mkdir -p "$RUNNER_TEMP/${name}-zip"
            unzip -q "$RUNNER_TEMP/${name}.zip" -d "$RUNNER_TEMP/${name}-zip"
            test -f "$RUNNER_TEMP/${name}-zip/${expected}"
            tar -xzf "$RUNNER_TEMP/${name}-zip/${expected}" -C "$dest"
          }
          restore_latest "belief-core-shadow-state" "$RUNNER_TEMP/belief" "belief-core-state.tgz"
          restore_latest "gse-shadow-state" "$RUNNER_TEMP/gse" "gse-state.tgz"
          echo "BELIEF_DIR=$RUNNER_TEMP/belief" >> "$GITHUB_ENV"
          echo "GSE_DIR=$RUNNER_TEMP/gse" >> "$GITHUB_ENV"

      - name: Print actual calibration and sample counts
        run: |
          python - <<'PY'
          import json, math, os
          from collections import Counter, defaultdict
          from pathlib import Path
          from statistics import mean

          belief=Path(os.environ['BELIEF_DIR'])
          gse=Path(os.environ['GSE_DIR'])

          def j(path, default=None):
              try: return json.loads(path.read_text())
              except Exception: return {} if default is None else default
          def jl(path):
              if not path.exists(): return []
              out=[]
              for line in path.read_text().splitlines():
                  if not line.strip(): continue
                  try:
                      x=json.loads(line)
                      if isinstance(x,dict): out.append(x)
                  except Exception: pass
              return out
          def metric(rows):
              rows=[r for r in rows if bool(r.get('calibration_eligible',True)) and r.get('predicted_probability') is not None and r.get('outcome') is not None]
              if not rows: return {'count':0,'mean_brier':None,'mean_log_loss':None,'bias':None,'observed_rate':None,'mean_predicted':None}
              ps=[float(r['predicted_probability']) for r in rows]
              ys=[1.0 if bool(r['outcome']) else 0.0 for r in rows]
              b=[float(r.get('brier_score',(p-y)**2)) for r,p,y in zip(rows,ps,ys)]
              ll=[]
              for r,p,y in zip(rows,ps,ys):
                  if r.get('log_loss') is not None: ll.append(float(r['log_loss']))
                  else:
                      q=max(1e-9,min(1-1e-9,p)); ll.append(-(y*math.log(q)+(1-y)*math.log(1-q)))
              return {'count':len(rows),'mean_brier':round(mean(b),6),'mean_log_loss':round(mean(ll),6),'bias':round(mean(ps)-mean(ys),6),'observed_rate':round(mean(ys),6),'mean_predicted':round(mean(ps),6)}

          print('=== BELIEF_CALIBRATION_REPORT_ACTUAL ===')
          report=j(belief/'BELIEF_CALIBRATION_REPORT.json',{})
          if not report:
              print(json.dumps({'available':False},sort_keys=True))
          else:
              core=report.get('belief_calibration') or {}
              print(json.dumps({
                  'available':True,
                  'generated_at':report.get('generated_at'),
                  'mode':report.get('mode'),
                  'data_quality_health':(report.get('data_quality') or {}).get('health'),
                  'belief_calibration_n':core.get('count_calibration_eligible'),
                  'belief_overall':core.get('overall'),
                  'proper_scoring':report.get('proper_scoring'),
                  'promotion_gate':report.get('promotion_gate'),
                  'gse_forecast_source':{
                      'available':(report.get('gse_forecast_source') or {}).get('available'),
                      'status':(report.get('gse_forecast_source') or {}).get('status'),
                      'last_run_at':(report.get('gse_forecast_source') or {}).get('last_run_at'),
                      'runtime_age_hours':(report.get('gse_forecast_source') or {}).get('runtime_age_hours'),
                      'telemetry':(report.get('gse_forecast_source') or {}).get('telemetry'),
                      'calibration':(report.get('gse_forecast_source') or {}).get('calibration'),
                  },
              },sort_keys=True))

          print('=== GSE_V1_ACTUAL ===')
          forecasts=jl(gse/'gse_forecasts.jsonl')
          vers=jl(gse/'gse_verifications.jsonl')
          evidence=jl(gse/'gse_evidence.jsonl')
          cal=j(gse/'gse_calibration.json',{})
          state=j(gse/'gse_state.json',{})
          joint=[r for r in vers if str(r.get('asset'))=='SPX' and int(r.get('horizon_hours') or 0)==24]
          by_asset=Counter(str(r.get('asset')) for r in vers if bool(r.get('calibration_eligible',True)))
          by_h=Counter(int(r.get('horizon_hours') or 0) for r in vers if bool(r.get('calibration_eligible',True)))
          f_asset=Counter(str(r.get('asset')) for r in forecasts)
          f_h=Counter(int(r.get('horizon_hours') or 0) for r in forecasts)
          print(json.dumps({
              'last_run_at':state.get('last_run_at'),
              'last_status':state.get('last_status'),
              'evidence_rows':len(evidence),
              'forecast_rows':len(forecasts),
              'verification_rows':len(vers),
              'verification_metric_overall_recomputed':metric(vers),
              'spx_24h_joint_recomputed':metric(joint),
              'verification_n_by_asset':dict(sorted(by_asset.items())),
              'verification_n_by_horizon':{str(k):v for k,v in sorted(by_h.items())},
              'forecast_n_by_asset':dict(sorted(f_asset.items())),
              'forecast_n_by_horizon':{str(k):v for k,v in sorted(f_h.items())},
              'native_calibration':cal,
          },sort_keys=True))

          print('=== GSE_V2_ACTUAL ===')
          v2f=jl(gse/'gse_v2_forecasts.jsonl')
          v2v=jl(gse/'gse_v2_verifications.jsonl')
          v2cal=j(gse/'gse_v2_calibration.json',{})
          v2state=j(gse/'gse_v2_state.json',{})
          lib=j(gse/'gse_historical_analogue_library.json',{})
          print(json.dumps({
              'state':v2state,
              'candidate_forecast_rows':len(v2f),
              'paired_verification_rows':len(v2v),
              'paired_calibration':v2cal,
              'historical_library_coverage':lib.get('coverage'),
              'catalog_version':lib.get('catalog_version'),
              'catalog_sha256':lib.get('catalog_sha256'),
              'response_rows':len(lib.get('responses') or []),
              'event_rows':len(lib.get('events') or []),
          },sort_keys=True))
          PY
