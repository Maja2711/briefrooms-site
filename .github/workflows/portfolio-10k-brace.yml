name: BRACE Portfolio Research and Promotion

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Research depth"
        required: true
        default: "weekly"
        type: choice
        options:
          - weekly
          - monthly-deep
          - promotion-only
  schedule:
    - cron: "40 8 * * 0"
    - cron: "15 10 1 * *"
  pull_request:
    branches: [main]
    paths:
      - "scripts/brace_portfolio_*.py"
      - "scripts/portfolio-10k-control-public.js"
      - "tests/test_brace_portfolio_engine.py"
      - "data/portfolio10k/config.json"
      - "data/portfolio10k/universe.json"
      - "assets/portfolio-10k.css"
      - "pl/inwestycje/portfel-10k.html"
      - "en/investing/portfolio-10k.html"
      - ".github/workflows/portfolio-10k-brace.yml"
  push:
    branches: [main]
    paths:
      - "scripts/brace_portfolio_*.py"
      - "scripts/portfolio-10k-control-public.js"
      - "tests/test_brace_portfolio_engine.py"
      - "data/portfolio10k/config.json"
      - "data/portfolio10k/universe.json"
      - "assets/portfolio-10k.css"
      - "pl/inwestycje/portfel-10k.html"
      - "en/investing/portfolio-10k.html"
      - ".github/workflows/portfolio-10k-brace.yml"

permissions:
  contents: write

concurrency:
  group: brace-portfolio-research
  cancel-in-progress: false

jobs:
  validate-research-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: python -m pip install --upgrade pip yfinance pandas pytest

      - name: Compile deterministic engine
        run: python -m compileall -q scripts

      - name: Validate engine, promotion and public controls
        run: python -m pytest -q tests/test_brace_portfolio_engine.py

      - name: Validate public JavaScript
        run: node --check scripts/portfolio-10k-public.js && node --check scripts/portfolio-10k-control-public.js

      - name: Build weekly shadow decisions
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'promotion-only')
        env:
          BRACE_TESTS_PASSED: "1"
        run: python scripts/brace_portfolio_engine.py --mode weekly --network

      - name: Run walk-forward and robustness research
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'promotion-only')
        env:
          BRACE_TESTS_PASSED: "1"
        run: python scripts/brace_portfolio_engine.py --mode research

      - name: Re-evaluate deterministic promotion gates
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'promotion-only'
        env:
          BRACE_TESTS_PASSED: "1"
        run: python scripts/brace_portfolio_engine.py --mode monitor

      - name: Commit validated BRACE state
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio10k
          if git diff --cached --quiet; then
            echo "No BRACE research changes to commit."
            exit 0
          fi
          git commit -m "Update BRACE governed research"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brace-research-diagnostics
          path: data/portfolio10k
          retention-days: 30
