name: Bootstrap AI Tournament

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-tournament-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'Bootstrap AI Tournament'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Assemble engine and install UI
        run: |
          set -euo pipefail
          python scripts/build_ai_tournament_engine.py --cleanup
          python scripts/install_ai_tournament_ui.py
          python -m unittest tests.test_ai_tournament -v
          python -m py_compile scripts/ai_tournament_engine.py scripts/install_ai_tournament_ui.py
          node --check scripts/ai-tournament-public.js
          python scripts/ai_tournament_engine.py validate
          grep -F '/scripts/ai-tournament-public.js?v=1' pl/inwestycje/portfel-10k.html
          grep -F '/scripts/ai-tournament-public.js?v=1' en/investing/portfolio-10k.html

      - name: Commit complete engine and pages
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ai_tournament_engine.py pl/inwestycje/portfel-10k.html en/investing/portfolio-10k.html
          git add -A scripts/ai_tournament_parts
          if git diff --cached --quiet; then
            echo 'AI Tournament is already bootstrapped.'
            exit 0
          fi
          git commit -m 'Install complete AI Tournament engine and UI'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          echo '::error::Could not publish AI Tournament bootstrap.'
          exit 1
