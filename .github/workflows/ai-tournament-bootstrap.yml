name: Bootstrap AI Tournament

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: ai-tournament-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and validate AI Tournament UI
        run: |
          set -euo pipefail
          python scripts/install_ai_tournament_ui.py
          python -m unittest tests.test_ai_tournament -v
          python -m py_compile scripts/ai_tournament_engine.py scripts/install_ai_tournament_ui.py
          node --check scripts/ai-tournament-public.js
          python scripts/ai_tournament_engine.py validate
          grep -F '/scripts/ai-tournament-public.js?v=1' pl/inwestycje/portfel-10k.html
          grep -F '/scripts/ai-tournament-public.js?v=1' en/investing/portfolio-10k.html

      - name: Publish UI and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pl/inwestycje/portfel-10k.html en/investing/portfolio-10k.html
          git rm .github/workflows/ai-tournament-bootstrap.yml scripts/build_ai_tournament_engine.py
          git commit -m 'Install AI Tournament leaderboard UI'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          echo '::error::Could not publish AI Tournament UI.'
          exit 1
