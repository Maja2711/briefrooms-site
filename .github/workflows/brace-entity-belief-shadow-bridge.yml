name: BRACE Entity Belief Prospective Shadow Bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/brace_entity_belief_shadow_bridge.py"
      - "scripts/brace_entity_belief_shadow_bridge_semantic.py"
      - "scripts/entity_semantic_eligibility.py"
      - "scripts/research_state_durability.py"
      - "tests/test_brace_entity_belief_shadow_bridge.py"
      - "tests/test_entity_semantic_eligibility.py"
      - "tests/test_research_state_durability.py"
      - "docs/BRACE_ENTITY_BELIEF_SHADOW_BRIDGE.md"
      - ".github/workflows/brace-entity-belief-shadow-bridge.yml"
      - ".github/workflows/brace-entity-belief-shadow-bridge-validation.yml"
  workflow_run:
    workflows:
      - "Investment Semantics World State Shadow"
      - "BRACE Portfolio Research and Paper Control"
    types: [completed]
  schedule:
    - cron: "50 4 * * 2-6"
    - cron: "15 10 * * 0"

permissions:
  contents: read
  actions: read

concurrency:
  group: brace-entity-belief-prospective-shadow-bridge
  cancel-in-progress: false

env:
  PR15_ARTIFACT_NAME: brace-entity-belief-state-forecast-state
  WORLD_ARTIFACT_NAME: investment-semantics-world-state
  STATE_ARTIFACT_NAME: brace-entity-belief-shadow-bridge-state

jobs:
  bridge:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare private state directories
        run: |
          set -euo pipefail
          echo "PR15_DIR=$RUNNER_TEMP/pr15_entity_belief" >> "$GITHUB_ENV"
          echo "WORLD_DIR=$RUNNER_TEMP/pr16_1_world_state" >> "$GITHUB_ENV"
          echo "STATE_DIR=$RUNNER_TEMP/pr17_entity_bridge" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pr15_entity_belief" "$RUNNER_TEMP/pr16_1_world_state" "$RUNNER_TEMP/pr17_entity_bridge"
      - name: Restore latest PR15 Entity Belief state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${PR15_ARTIFACT_NAME}&per_page=100"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api" > "$RUNNER_TEMP/pr15-artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/pr15-artifacts.json" <<'PY'
          import json,sys
          from pathlib import Path
          rows=[x for x in json.loads(Path(sys.argv[1]).read_text()).get('artifacts',[]) if not x.get('expired')]
          rows.sort(key=lambda x:x.get('created_at',''), reverse=True)
          if not rows: raise SystemExit('PR17 blocked: PR15 Entity Belief state artifact is missing')
          print(rows[0]['id'])
          PY
          )
          curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$RUNNER_TEMP/pr15.zip"
          mkdir -p "$RUNNER_TEMP/pr15-zip"; unzip -q "$RUNNER_TEMP/pr15.zip" -d "$RUNNER_TEMP/pr15-zip"
          test -f "$RUNNER_TEMP/pr15-zip/brace-entity-belief-state-forecast-state.tgz"
          tar -xzf "$RUNNER_TEMP/pr15-zip/brace-entity-belief-state-forecast-state.tgz" -C "$PR15_DIR"
          test -f "$PR15_DIR/belief_core/state.json"
          test -f "$PR15_DIR/ENTITY_BELIEF_FORECAST_RUNTIME_STATE.json"
      - name: Restore latest PR16.1 World State
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${WORLD_ARTIFACT_NAME}&per_page=100"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api" > "$RUNNER_TEMP/world-artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/world-artifacts.json" <<'PY'
          import json,sys
          from pathlib import Path
          rows=[x for x in json.loads(Path(sys.argv[1]).read_text()).get('artifacts',[]) if not x.get('expired')]
          rows.sort(key=lambda x:x.get('created_at',''), reverse=True)
          if not rows: raise SystemExit('PR17 blocked: PR16.1 World State artifact is missing')
          print(rows[0]['id'])
          PY
          )
          curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$RUNNER_TEMP/world.zip"
          mkdir -p "$RUNNER_TEMP/world-zip"; unzip -q "$RUNNER_TEMP/world.zip" -d "$RUNNER_TEMP/world-zip"
          test -f "$RUNNER_TEMP/world-zip/investment-semantics-world-state.tgz"
          tar -xzf "$RUNNER_TEMP/world-zip/investment-semantics-world-state.tgz" -C "$WORLD_DIR"
          test -f "$WORLD_DIR/INVESTMENT_WORLD_STATE_RUNTIME_STATE.json"
          test -f "$WORLD_DIR/INVESTMENT_SEMANTICS_WORLD_STATE_REPORT.json"
      - name: Restore prior cumulative PR17 state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${STATE_ARTIFACT_NAME}&per_page=100"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api" > "$RUNNER_TEMP/pr17-artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/pr17-artifacts.json" <<'PY'
          import json,sys
          from pathlib import Path
          rows=[x for x in json.loads(Path(sys.argv[1]).read_text()).get('artifacts',[]) if not x.get('expired')]
          rows.sort(key=lambda x:x.get('created_at',''), reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
          )
          if [ -n "$artifact_id" ]; then
            curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$RUNNER_TEMP/pr17.zip"
            mkdir -p "$RUNNER_TEMP/pr17-zip"; unzip -q "$RUNNER_TEMP/pr17.zip" -d "$RUNNER_TEMP/pr17-zip"
            test -f "$RUNNER_TEMP/pr17-zip/brace-entity-belief-shadow-bridge-state.tgz"
            tar -xzf "$RUNNER_TEMP/pr17-zip/brace-entity-belief-shadow-bridge-state.tgz" -C "$STATE_DIR"
          else
            echo "No prior PR17 state found by legacy restore; durability guard decides whether continuity is recoverable."
          fi
      - name: Enforce durable research-state continuity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PYTHONPATH=scripts:. python scripts/research_state_durability.py restore \
            --layer "pr17_entity_bridge" \
            --state-dir "$STATE_DIR"
      - name: Validate PR17 and PR19.1 semantic code
        run: |
          set -euo pipefail
          PYTHONPATH=scripts:. python -m py_compile scripts/brace_entity_belief_shadow_bridge.py scripts/brace_entity_belief_shadow_bridge_semantic.py scripts/entity_semantic_eligibility.py scripts/research_state_durability.py
          PYTHONPATH=scripts:. python -m unittest tests.test_brace_entity_belief_shadow_bridge -v
          PYTHONPATH=scripts:. python -m unittest tests.test_entity_semantic_eligibility -v
      - name: Build semantically filtered prospective BRACE Entity WITH/WITHOUT bridge
        run: |
          set -euo pipefail
          test -f data/portfolio10k/pending_decisions.json
          test -f data/portfolio10k/analysis.json
          test -f data/investments/portfolio_10k.json
          PYTHONPATH=scripts:. python scripts/brace_entity_belief_shadow_bridge_semantic.py \
            --state-dir "$STATE_DIR" \
            --pr15-core-state "$PR15_DIR/belief_core/state.json" \
            --pr15-runtime-state "$PR15_DIR/ENTITY_BELIEF_FORECAST_RUNTIME_STATE.json" \
            --world-state "$WORLD_DIR/INVESTMENT_WORLD_STATE_RUNTIME_STATE.json" \
            --world-report "$WORLD_DIR/INVESTMENT_SEMANTICS_WORLD_STATE_REPORT.json" \
            --pending-decisions data/portfolio10k/pending_decisions.json \
            --analysis data/portfolio10k/analysis.json \
            --portfolio data/investments/portfolio_10k.json
      - name: Assert PR17 paired economics, semantic filter and zero-authority boundary
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime
          from pathlib import Path
          def dt(value): return datetime.fromisoformat(str(value).replace('Z','+00:00'))
          root=Path(os.environ['STATE_DIR'])
          report=json.loads((root/'BRACE_ENTITY_BELIEF_WITH_WITHOUT_REPORT.json').read_text())
          state=json.loads((root/'BRACE_ENTITY_BELIEF_SHADOW_BRIDGE_STATE.json').read_text())
          assert report['mode']=='research_shadow'
          assert report['bridge_phase']=='A_COMPUTED_NOT_CONSUMED'
          assert report['active_decision_influence'] is False
          assert report['entity_semantic_eligibility']['semantic_ineligible_forecast_in_new_pair'] is False
          assert report['entity_semantic_eligibility']['historical_pair_set_deleted'] is False
          assert report['entity_semantic_eligibility']['historical_pair_set_rewritten'] is False
          excluded=set(report['entity_semantic_eligibility']['excluded_belief_ids'])
          assert report['primary_modifier_contract']['engine_consumes_modifier'] is False
          assert report['promotion_readiness']['eligible_for_promotion_review'] is False
          assert report['promotion_readiness']['automatic_promotion'] is False
          assert report['safety_controls'] and all(v is False for v in report['safety_controls'].values())
          pre=set(state.get('pre_activation_decision_set_ids') or [])
          paired={x['decision_set_id'] for x in state.get('pair_sets',{}).values()}
          assert not (pre & paired)
          for pair in state.get('pair_sets',{}).values():
              assert pair['engine_consumed_belief'] is False
              assert pair['hypothetical_only'] is True
              assert pair['historical_backfill'] is False
              for item in pair['items']:
                  for forecast in item['forecasts']:
                      assert dt(forecast['forecast_at']) <= dt(pair['decision_at']) < dt(forecast['target_at'])
          print('PR17 paired WITH/WITHOUT + PR19.1 semantic filter: PASS')
          print('Excluded beliefs:', sorted(excluded))
          PY
      - name: Seal research-state checkpoint lineage
        run: |
          set -euo pipefail
          PYTHONPATH=scripts:. python scripts/research_state_durability.py seal \
            --layer "pr17_entity_bridge" \
            --state-dir "$STATE_DIR" \
            --migration-from-legacy
      - name: Pack cumulative private PR17 state
        run: tar -czf "$RUNNER_TEMP/brace-entity-belief-shadow-bridge-state.tgz" -C "$STATE_DIR" .
      - name: Store cumulative PR17 state
        uses: actions/upload-artifact@v4
        with:
          name: brace-entity-belief-shadow-bridge-state
          path: ${{ runner.temp }}/brace-entity-belief-shadow-bridge-state.tgz
          if-no-files-found: error
          retention-days: 180
          compression-level: 0
