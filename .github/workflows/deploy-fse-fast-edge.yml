name: Deploy FSE Fast Edge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/fse-fast-edge/**"
      - ".github/workflows/deploy-fse-fast-edge.yml"

permissions:
  contents: read

concurrency:
  group: deploy-fse-fast-edge
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Install and test FSE fast edge
        working-directory: workers/fse-fast-edge
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Deploy FSE fast edge
        working-directory: workers/fse-fast-edge
        run: npx wrangler deploy
      - name: Verify live FSE fast edge
        run: |
          set -euo pipefail
          url="https://briefrooms-fse-fast.szczerbinski0577.workers.dev/fse-fast"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$url?_=$RANDOM" -o /tmp/fse-fast-edge.json; then
              node - <<'NODE'
          const fs=require("fs");
          const j=JSON.parse(fs.readFileSync("/tmp/fse-fast-edge.json","utf8"));
          const instruments=new Set((j.instruments||[]).map(x=>x.instrument));
          if (j.mode!=="SHADOW_ONLY" || j.production_impact!==false || j.cadence_minutes!==5 ||
              !instruments.has("EURUSD") || !instruments.has("BTCUSD") || !instruments.has("SPX")) {
            console.error("FSE_FAST_EDGE_VERIFY_FAIL",j);
            process.exit(1);
          }
          const generated=Date.parse(j.generated_at);
          const age=(Date.now()-generated)/60000;
          if (!Number.isFinite(generated)||age<-1||age>6) {
            console.error("FSE_FAST_EDGE_GENERATED_STALE",age,j.generated_at);
            process.exit(1);
          }
          console.log("FSE_FAST_EDGE_PASS",j.generated_at,j.instruments.map(x=>[x.instrument,x.latest_fast_observed_at]));
          NODE
              exit 0
            fi
            sleep "$attempt"
          done
          echo "FSE fast edge verification failed" >&2
          exit 1
