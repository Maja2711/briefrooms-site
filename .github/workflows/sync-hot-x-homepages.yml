name: Hot X Feed Health
# Hot X data and legacy rendering code are retained, but the redesigned homepage
# no longer contains a Hot X surface. This workflow validates the feed only and
# must not rewrite pl/index.html or en/index.html.

on:
  push:
    branches: [main]
    paths:
      - "data/hot_tweets.json"
      - "scripts/sync_hot_x_homepages.py"
      - ".github/workflows/sync-hot-x-homepages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hot-x-feed-health
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate retained Hot X feed and renderer
        run: |
          set -euo pipefail
          python -m py_compile scripts/sync_hot_x_homepages.py scripts/hot_x_items.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import sync_hot_x_homepages as hotx

          data = hotx.load_feed()
          items = data.get('items') or []
          assert len(items) >= hotx.INITIAL_VISIBLE
          for lang in ('pl', 'en'):
              rendered = hotx.static_block(data, lang)
              assert '<!-- HOT_X_STATIC_START -->' in rendered
              assert '<!-- HOT_X_STATIC_END -->' in rendered
          for path in (Path('pl/index.html'), Path('en/index.html')):
              source = path.read_text(encoding='utf-8')
              assert 'class="br-home"' in source
              assert '<!-- HOT_X_STATIC_START -->' not in source
          print('Hot X feed is healthy and intentionally decoupled from the redesigned homepage.')
          PY
