name: Sync Hot X Homepages

on:
  push:
    branches: [main]
    paths:
      - "data/hot_tweets.json"
      - "scripts/sync_hot_x_homepages.py"
      - ".github/workflows/sync-hot-x-homepages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hot-x-homepage-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate synchronizer
        run: python -m py_compile scripts/sync_hot_x_homepages.py

      - name: Synchronize static Hot X cards and push
        shell: bash
        run: |
          set -euo pipefail
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/sync_hot_x_homepages.py
            python scripts/sync_hot_x_homepages.py --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pl/index.html en/index.html
            if git diff --cached --quiet; then
              echo "Homepage Hot X cards are already current."
              pushed=1
              break
            fi
            git commit -m "chore(hot-x): sync homepage cards"
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep $((attempt * 5))
          done
          if [[ "$pushed" != "1" ]]; then
            echo "::error::Could not push synchronized Hot X homepage cards."
            exit 1
          fi

      - name: Verify static Hot X cards on production
        run: |
          git fetch origin main
          git reset --hard origin/main
          python scripts/sync_hot_x_homepages.py \
            --verify-production \
            --base-url https://briefrooms.com

      - name: Commit production verification status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hot_x_homepage_production_status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(hot-x): verify homepage implementation"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
              git rebase origin/main
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not push Hot X homepage verification status."
          exit 1
