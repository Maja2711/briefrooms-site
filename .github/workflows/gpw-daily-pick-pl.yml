name: Publish PL GPW Daily Pick

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: morning
        type: choice
        options:
          - morning
          - watchdog
          - settle
          - validate
  push:
    branches: [main]
    paths:
      - ".github/workflows/gpw-daily-pick-pl.yml"
      - "scripts/gpw_daily_pick.py"
      - "scripts/gpw-daily-pick-public.js"
      - "assets/gpw-daily-pick.css"
      - "data/investments/gpw_daily_pick_config.json"
      - "tests/test_gpw_daily_pick.py"
      - "tests/test_gpw_daily_pick_ui.py"
      - "pl/inwestycje/portfel-10k.html"
  schedule:
    # Paired UTC schedules cover CET and CEST; the Warsaw-time gate admits one.
    - cron: "35 5 * * 1-5"
    - cron: "35 6 * * 1-5"
    - cron: "17 6 * * 1-5"
    - cron: "17 7 * * 1-5"
    - cron: "23 16 * * 1-5"
    - cron: "23 17 * * 1-5"

permissions:
  contents: write
  pages: write

concurrency:
  group: gpw-daily-pick-pl
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_GENERATION_MODEL: gemini-3.5-flash-lite
      GEMINI_REVIEW_MODEL: gemini-3.5-flash-lite
      GEMINI_MIN_INTERVAL_SECONDS: "8"

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Resolve Warsaw-time execution window
        id: run
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          MODE="${REQUESTED_MODE:-validate}"
          SHOULD_RUN=false
          EXTRA_ARGS=""
          LOCAL_HHMM="$(TZ=Europe/Warsaw date +%H%M)"

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            case "$EVENT_SCHEDULE" in
              "35 5 * * 1-5"|"35 6 * * 1-5")
                MODE=morning
                if (( 10#$LOCAL_HHMM >= 725 && 10#$LOCAL_HHMM <= 755 )); then SHOULD_RUN=true; fi
                ;;
              "17 6 * * 1-5"|"17 7 * * 1-5")
                MODE=watchdog
                if (( 10#$LOCAL_HHMM >= 805 && 10#$LOCAL_HHMM <= 825 )); then SHOULD_RUN=true; fi
                ;;
              "23 16 * * 1-5"|"23 17 * * 1-5")
                MODE=settle
                if (( 10#$LOCAL_HHMM >= 1720 && 10#$LOCAL_HHMM <= 1900 )); then SHOULD_RUN=true; fi
                ;;
            esac
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SHOULD_RUN=true
            EXTRA_ARGS="--allow-outside-window"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "extra_args=$EXTRA_ARGS" >> "$GITHUB_OUTPUT"
          echo "Mode=$MODE should_run=$SHOULD_RUN Warsaw=$LOCAL_HHMM"

      - name: Test fail-closed publication contract
        run: |
          set -euo pipefail
          python -m unittest tests.test_gpw_daily_pick tests.test_gpw_daily_pick_ui -v
          python -m py_compile scripts/gpw_daily_pick.py
          python -m json.tool data/investments/gpw_daily_pick_config.json >/dev/null
          python -m json.tool data/investments/gpw_daily_pick.json >/dev/null
          node --check scripts/gpw-daily-pick-public.js

      - name: Check Gemini endpoint without blocking fail-closed publication
        if: steps.run.outputs.should_run == 'true' && (steps.run.outputs.mode == 'morning' || steps.run.outputs.mode == 'watchdog')
        shell: bash
        run: |
          set +e
          python scripts/check_ai_provider.py
          STATUS=$?
          set -e
          if [[ "$STATUS" != "0" ]]; then
            echo "Gemini preflight failed; the publisher will write AWARIA_DANYCH if AI analysis is required."
          fi

      - name: Generate or settle the PL daily record
        if: steps.run.outputs.should_run == 'true'
        shell: bash
        env:
          MODE: ${{ steps.run.outputs.mode }}
          EXTRA_ARGS: ${{ steps.run.outputs.extra_args }}
        run: |
          set -euo pipefail
          python scripts/gpw_daily_pick.py --mode "$MODE" $EXTRA_ARGS
          if [[ "$MODE" == "morning" || "$MODE" == "watchdog" || "$MODE" == "validate" ]]; then
            python scripts/gpw_daily_pick.py --mode validate
          fi

      - name: Commit scoped publication files
        id: commit
        if: steps.run.outputs.should_run == 'true' && steps.run.outputs.mode != 'validate'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/investments/gpw_daily_pick.json \
            data/investments/gpw_daily_pick_metrics.json \
            data/investments/gpw_daily_pick_history
          git add data/internal/gpw_daily_pick_audit 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No GPW publication change."
            exit 0
          fi
          git commit -m "Publish PL GPW daily paper-trade record"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 4))
          done
          exit 1

      - name: Request fresh Pages build
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            CODE="$(curl --silent --show-error --output /tmp/gpw-pages.json --write-out '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")"
            if [[ "$CODE" == "201" ]]; then exit 0; fi
            if [[ "$CODE" != "409" ]]; then cat /tmp/gpw-pages.json; exit 1; fi
            sleep 10
          done
          exit 1

      - name: Verify current record on briefrooms.com
        if: steps.commit.outputs.changed == 'true' && (steps.run.outputs.mode == 'morning' || steps.run.outputs.mode == 'watchdog')
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Europe/Warsaw")).date().isoformat()
          headers = {"User-Agent": "BriefRooms-GPW-production-verifier/1.0", "Cache-Control": "no-cache"}
          for attempt in range(1, 37):
              url = f"https://briefrooms.com/data/investments/gpw_daily_pick.json?v={int(time.time())}-{attempt}"
              try:
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.load(response)
                  if payload.get("date") == today and payload.get("decision") in {"TRANSAKCJA", "BRAK_TRANSAKCJI", "AWARIA_DANYCH"}:
                      print(f"Production verified: {payload['decision']} {today}")
                      raise SystemExit(0)
              except Exception as error:
                  print(f"Attempt {attempt}: {type(error).__name__}")
              time.sleep(10)
          raise SystemExit("Production did not expose today's fail-closed GPW record in time.")
          PY
