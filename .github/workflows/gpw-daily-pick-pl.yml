name: Publish PL GPW Daily Pick

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: auto
        type: choice
        options: [auto, settle, validate]
  push:
    branches: [main]
    paths:
      - ".github/workflows/gpw-daily-pick-pl.yml"
      - "scripts/daily_stock_core.py"
      - "scripts/gpw_*.py"
      - "scripts/gpw-daily-pick-public.js"
      - "scripts/gpw-expected-value-public.js"
      - "scripts/daily-stock-markets-public.js"
      - "assets/gpw-expected-value.css"
      - "data/investments/gpw_daily_pick_config.json"
      - "data/investments/gpw_mandatory_daily_config.json"
      - "tests/test_gpw_*.py"
      - "tests/test_daily_stock_core.py"
      - "tests/test_daily_stock_rejected_candidate_freeze.py"
      - "pl/inwestycje/daily-trading.html"
      - "en/investing/daily-trading.html"
      - "pl/inwestycje/portfel-10k.html"
  schedule:
    # Multiple attempts cover CET/CEST and GitHub schedule jitter.
    - cron: "20 7 * * 1-5"
    - cron: "45 7 * * 1-5"
    - cron: "10 8 * * 1-5"
    - cron: "20 8 * * 1-5"
    - cron: "45 8 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "30 11 * * 1-5"
    - cron: "30 13 * * 1-5"
    - cron: "40 16 * * 1-5"
    - cron: "40 17 * * 1-5"

permissions:
  contents: write
  pages: write

concurrency:
  group: gpw-daily-pick-pl
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
      GEMINI_GENERATION_MODEL: gemini-3.5-flash-lite
      GEMINI_REVIEW_MODEL: gemini-3.5-flash-lite
      GEMINI_MIN_INTERVAL_SECONDS: "8"

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Resolve mode
        id: mode
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          MODE=auto
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${REQUESTED_MODE:-auto}"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            case "$EVENT_SCHEDULE" in
              "40 16 * * 1-5"|"40 17 * * 1-5") MODE=settle ;;
            esac
          fi
          echo "value=$MODE" >> "$GITHUB_OUTPUT"
          echo "GPW mode=$MODE Warsaw=$(TZ=Europe/Warsaw date +'%F %H:%M')"

      - name: Validate GPW code and contracts
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_daily_stock_core \
            tests.test_daily_stock_rejected_candidate_freeze \
            tests.test_gpw_daily_pick \
            tests.test_gpw_daily_control_loop \
            tests.test_gpw_event_layer \
            tests.test_gpw_market_data \
            tests.test_gpw_pipeline_v2 \
            tests.test_gpw_mandatory_daily \
            tests.test_gpw_daily_pick_ui -v
          python -m py_compile \
            scripts/daily_stock_core.py \
            scripts/gpw_daily_pick.py \
            scripts/gpw_daily_control_loop.py \
            scripts/gpw_event_layer.py \
            scripts/gpw_event_driven_loop.py \
            scripts/gpw_expected_value.py \
            scripts/gpw_market_data.py \
            scripts/gpw_opening_confirmation.py \
            scripts/gpw_pipeline_v2.py \
            scripts/gpw_provider_v2.py \
            scripts/gpw_reviewer_v2.py \
            scripts/gpw_mandatory_daily.py
          python -m json.tool data/investments/gpw_daily_pick_config.json >/dev/null
          python -m json.tool data/investments/gpw_mandatory_daily_config.json >/dev/null
          node --check scripts/gpw-daily-pick-public.js
          node --check scripts/gpw-expected-value-public.js
          node --check scripts/daily-stock-markets-public.js

      - name: Audit market coverage
        if: steps.mode.outputs.value == 'auto'
        run: |
          set -euo pipefail
          python - <<'PY'
          from scripts import gpw_event_driven_loop as runtime
          runtime.install()
          cfg=runtime.gpw.load_config()
          cache=runtime.provider.prefetch_market(cfg)
          minimum=int(len(cfg['universe'])*float(cfg['minimum_data_completeness'])+0.9999)
          print('GPW_COVERAGE', len(cache), '/', len(cfg['universe']), runtime.provider.LAST_AUDIT)
          if len(cache)<minimum:
              raise SystemExit(f'hard data failure: coverage={len(cache)} minimum={minimum}')
          PY

      - name: Run primary GPW engine
        if: steps.mode.outputs.value == 'auto'
        shell: bash
        run: |
          set +e
          python scripts/gpw_event_driven_loop.py --mode auto
          STATUS=$?
          set -e
          echo "Primary GPW status=$STATUS; final selector runs regardless."

      - name: Enforce final Daily GPW transaction
        if: steps.mode.outputs.value == 'auto'
        run: |
          set -euo pipefail
          python scripts/gpw_mandatory_daily.py
          python - <<'PY'
          import json
          from datetime import datetime,time as clock_time
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from scripts import gpw_daily_pick as gpw
          now=datetime.now(ZoneInfo('Europe/Warsaw'))
          cfg=gpw.load_config()
          payload=json.loads(Path('data/investments/gpw_daily_pick.json').read_text(encoding='utf-8'))
          today=now.date().isoformat()
          if payload.get('date')!=today:
              raise SystemExit(f'stale GPW publication: {payload.get("date")} != {today}')
          if gpw.is_session_day(now.date(),cfg) and now.time()>=clock_time(9,15):
              if payload.get('decision')!='TRANSAKCJA':
                  raise SystemExit(f'GPW Daily contract violated: {payload.get("decision")}: {payload.get("reason")}')
              s=payload.get('selection') or {}
              required=('symbol','entry_zone','skip_above','stop','target','reward_risk','valid_until','market_snapshot')
              missing=[k for k in required if k not in s]
              if missing:
                  raise SystemExit(f'missing setup fields: {missing}')
              if (s.get('market_snapshot') or {}).get('date')!=today:
                  raise SystemExit('execution quote is not from current GPW session')
              print('GPW_FINAL_SELECTION_OK',s.get('ticker'),s.get('reference_price'),s.get('stop'),s.get('target'),s.get('reward_risk'))
          else:
              gpw.validate_payload(payload,require_today=True,now=now)
          PY

      - name: Validate only
        if: steps.mode.outputs.value == 'validate'
        run: python scripts/gpw_mandatory_daily.py --validate

      - name: Settle historical GPW positions
        if: steps.mode.outputs.value == 'settle'
        run: python scripts/gpw_event_driven_loop.py --mode settle

      - name: Freeze candidates and rebuild history index
        if: steps.mode.outputs.value == 'auto'
        run: |
          set -euo pipefail
          python scripts/daily_stock_rejected_candidate_freeze.py --market gpw
          python scripts/daily_stock_rejected_candidate_freeze.py --market gpw --verify
          python scripts/build_daily_stock_history_index.py

      - name: Rebuild history index after settlement
        if: steps.mode.outputs.value == 'settle'
        run: python scripts/build_daily_stock_history_index.py

      - name: Cache-bust GPW client
        if: steps.mode.outputs.value == 'auto'
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path('pl/inwestycje/portfel-10k.html')
          t=p.read_text(encoding='utf-8')
          p.write_text(re.sub(r'/scripts/gpw-daily-pick-public\.js\?v=\d+','/scripts/gpw-daily-pick-public.js?v=7',t),encoding='utf-8')
          PY

      - name: Commit GPW state
        id: commit
        if: steps.mode.outputs.value != 'validate'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/gpw_daily_pick.json data/investments/gpw_daily_pick_metrics.json data/investments/gpw_daily_pick_learning.json data/investments/daily_stock_history_index.json 2>/dev/null || true
          git add data/investments/gpw_daily_pick_history data/internal/gpw_daily_pick_audit pl/inwestycje/portfel-10k.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Publish PL GPW final daily selection state"
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              CONFLICTS=$(git diff --name-only --diff-filter=U || true)
              COUNT=$(printf '%s\n' "$CONFLICTS" | sed '/^$/d' | wc -l | tr -d ' ')
              if [[ "$COUNT" == "1" && "$CONFLICTS" == "data/investments/daily_stock_history_index.json" ]]; then
                echo "Rebuilding derived history index to resolve concurrent publisher race."
                python scripts/build_daily_stock_history_index.py
                git add data/investments/daily_stock_history_index.json
                GIT_EDITOR=true git rebase --continue
              else
                echo "Unresolved publication conflict: $CONFLICTS"
                git rebase --abort || true
                exit 1
              fi
            fi
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt*4))
          done
          exit 1

      - name: Request Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            CODE=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
            [[ "$CODE" == "201" ]] && exit 0
            [[ "$CODE" != "409" ]] && { cat /tmp/pages.json; exit 1; }
            sleep 10
          done
          exit 1

      - name: Verify production GPW selection
        if: steps.commit.outputs.changed == 'true' && steps.mode.outputs.value == 'auto'
        run: |
          python - <<'PY'
          import json,time,urllib.request
          from datetime import datetime,time as clock_time
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('Europe/Warsaw'))
          today=now.date().isoformat()
          headers={'User-Agent':'BriefRooms-GPW-production-verifier/7.0','Cache-Control':'no-cache'}
          last=None
          for attempt in range(1,49):
              token=f'{int(time.time())}-{attempt}'
              try:
                  req=urllib.request.Request(f'https://briefrooms.com/data/investments/gpw_daily_pick.json?v={token}',headers=headers)
                  with urllib.request.urlopen(req,timeout=20) as r: payload=json.load(r)
                  last=payload
                  if payload.get('date')==today:
                      if now.time()>=clock_time(9,15):
                          assert payload.get('decision')=='TRANSAKCJA'
                          s=payload.get('selection') or {}
                          assert s.get('symbol') and (s.get('market_snapshot') or {}).get('date')==today
                      print('GPW_PRODUCTION_OK',payload.get('decision'),(payload.get('selection') or {}).get('ticker'))
                      raise SystemExit(0)
              except Exception as e:
                  print('verify',attempt,type(e).__name__,str(e)[:160])
              time.sleep(10)
          raise SystemExit(f'production stale or empty: {last}')
          PY

      - name: Enforce scheduled Daily SLA
        if: always() && github.event_name == 'schedule' && steps.mode.outputs.value == 'auto'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime,time as clock_time
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from scripts import gpw_daily_pick as gpw
          now=datetime.now(ZoneInfo('Europe/Warsaw'))
          cfg=gpw.load_config()
          if now.time()<clock_time(9,15) or not gpw.is_session_day(now.date(),cfg):
              raise SystemExit(0)
          p=json.loads(Path('data/investments/gpw_daily_pick.json').read_text(encoding='utf-8'))
          if p.get('date')!=now.date().isoformat() or p.get('decision')!='TRANSAKCJA':
              raise SystemExit(f'GPW Daily SLA missed: date={p.get("date")} decision={p.get("decision")} reason={p.get("reason")}')
          s=p.get('selection') or {}
          print('GPW_DAILY_SLA_OK',s.get('ticker'),s.get('reference_price'),p.get('generated_at'))
          PY
