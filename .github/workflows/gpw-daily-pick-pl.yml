name: Publish PL GPW Stock Candidate
# Recovery trigger: governed final selector, policy retry and canonical portfolio admission.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: auto
        type: choice
        options: [auto, settle, validate]
  push:
    branches: [main]
    paths:
      - ".github/workflows/gpw-daily-pick-pl.yml"
      - "scripts/daily_stock_core.py"
      - "scripts/gpw_*.py"
      - "scripts/stock_trading_portfolio.py"
      - "data/investments/stock_trading_policy.json"
      - "tests/test_stock_trading_portfolio.py"
      - "scripts/gpw-daily-pick-public.js"
      - "scripts/gpw-expected-value-public.js"
      - "scripts/gpw-full-ranking-public.js"
      - "scripts/daily-stock-markets-public.js"
      - "assets/gpw-expected-value.css"
      - "assets/gpw-full-ranking.css"
      - "data/investments/gpw_daily_pick_config.json"
      - "tests/test_gpw_*.py"
      - "tests/test_daily_stock_core.py"
      - "tests/test_daily_stock_rejected_candidate_freeze.py"
      - "pl/inwestycje/stock-trading.html"
      - "en/investing/stock-trading.html"
  schedule:
    - cron: "20 7 * * 1-5"
    - cron: "45 7 * * 1-5"
    - cron: "10 8 * * 1-5"
    - cron: "20 8 * * 1-5"
    - cron: "45 8 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "30 11 * * 1-5"
    - cron: "30 13 * * 1-5"
    - cron: "40 16 * * 1-5"
    - cron: "40 17 * * 1-5"

permissions:
  contents: write
  pages: write

concurrency:
  # GPW, US and the quote refresher all persist the canonical portfolio JSON.
  # Serialize those writers so a simultaneous market update cannot create a
  # rebase conflict and discard an otherwise valid daily decision.
  group: stock-trading-state-writer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
      GEMINI_GENERATION_MODEL: gemini-3.5-flash-lite
      GEMINI_REVIEW_MODEL: gemini-3.5-flash-lite
      GEMINI_MIN_INTERVAL_SECONDS: "8"

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Resolve mode
        id: mode
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          MODE=auto
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${REQUESTED_MODE:-auto}"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            case "$EVENT_SCHEDULE" in
              "40 16 * * 1-5"|"40 17 * * 1-5") MODE=settle ;;
            esac
          fi
          echo "value=$MODE" >> "$GITHUB_OUTPUT"

      - name: Validate GPW candidate and Stock Trading contracts
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_daily_stock_core \
            tests.test_daily_stock_rejected_candidate_freeze \
            tests.test_gpw_daily_pick \
            tests.test_gpw_daily_control_loop \
            tests.test_gpw_event_layer \
            tests.test_gpw_market_data \
            tests.test_gpw_pipeline_v2 \
            tests.test_gpw_daily_pick_ui \
            tests.test_gpw_mandatory_daily \
            tests.test_gpw_ranking_gates_momentum \
            tests.test_stock_trading_portfolio -v
          python -m py_compile \
            scripts/daily_stock_core.py \
            scripts/gpw_data_gates.py \
            scripts/gpw_daily_pick.py \
            scripts/gpw_daily_control_loop.py \
            scripts/gpw_event_layer.py \
            scripts/gpw_event_driven_loop.py \
            scripts/gpw_expected_value.py \
            scripts/gpw_full_ranking.py \
            scripts/gpw_market_data.py \
            scripts/gpw_mandatory_daily.py \
            scripts/gpw_opening_confirmation.py \
            scripts/gpw_pipeline_v2.py \
            scripts/gpw_provider_v2.py \
            scripts/gpw_reviewer_v2.py \
            scripts/stock_trading_portfolio.py
          python -m json.tool data/investments/gpw_daily_pick_config.json >/dev/null
          python -m json.tool data/investments/stock_trading_policy.json >/dev/null
          node --check scripts/gpw-daily-pick-public.js
          node --check scripts/gpw-expected-value-public.js
          node --check scripts/gpw-full-ranking-public.js
          node --check scripts/daily-stock-markets-public.js

      - name: Build full GPW ranking and enforce data coverage
        if: steps.mode.outputs.value == 'auto'
        run: |
          set -euo pipefail
          python scripts/gpw_full_ranking.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/investments/gpw_daily_candidate_ranking.json').read_text(encoding='utf-8'))
          assert len(p['rows']) == p['universe_size'], (len(p['rows']), p['universe_size'])
          assert p['data_quality']['status'] == 'healthy', p['data_quality']
          assert p['data_quality']['engine'] == 'gpw-data-gates-v1'
          assert p['relative_momentum']['engine'] == 'cross-sectional-multihorizon-v2'
          PY

      - name: Run primary and deterministic final GPW selectors
        if: steps.mode.outputs.value == 'auto'
        run: |
          set -euo pipefail
          python scripts/gpw_event_driven_loop.py --mode auto
          # The primary evidence-rich path remains first. When it misses its
          # early cutoff or returns no setup, the final selector chooses the
          # best candidate that still passes freshness, liquidity, execution,
          # risk and reward/risk hard gates. Its recovery window lasts to 16:30.
          python scripts/gpw_mandatory_daily.py

      - name: Enforce final GPW selection contract
        if: steps.mode.outputs.value == 'auto'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/investments/gpw_daily_pick.json').read_text(encoding='utf-8'))
          decision=p.get('decision')
          if decision not in {'TRANSAKCJA','BRAK_TRANSAKCJI','AWARIA_DANYCH'}:
              raise SystemExit(f'Unexpected GPW decision: {decision}')
          if decision=='TRANSAKCJA':
              s=p.get('selection') or {}
              if float(s.get('reward_risk') or 0) < 1.5:
                  raise SystemExit('GPW reward/risk below 1.5')
              required=('symbol','stop','target','risk_percent','market_snapshot')
              missing=[key for key in required if s.get(key) is None]
              if missing:
                  raise SystemExit(f'GPW qualified setup missing: {missing}')
          print('GPW_STOCK_CANDIDATE_OK',decision,(p.get('selection') or {}).get('ticker'))
          PY
          python scripts/stock_trading_portfolio.py --mode sync-candidates --market GPW
          python scripts/stock_trading_portfolio.py --mode verify

      - name: Validate only
        if: steps.mode.outputs.value == 'validate'
        run: |
          python scripts/stock_trading_portfolio.py --mode verify

      - name: Settle legacy GPW daily history only
        if: steps.mode.outputs.value == 'settle'
        run: python scripts/gpw_event_driven_loop.py --mode settle

      - name: Freeze candidate research and rebuild history index
        if: steps.mode.outputs.value == 'auto'
        run: |
          set -euo pipefail
          python scripts/daily_stock_rejected_candidate_freeze.py --market gpw
          python scripts/daily_stock_rejected_candidate_freeze.py --market gpw --verify
          python scripts/build_daily_stock_history_index.py

      - name: Rebuild history index after legacy settlement
        if: steps.mode.outputs.value == 'settle'
        run: python scripts/build_daily_stock_history_index.py

      - name: Commit GPW candidate and canonical portfolio state
        id: commit
        if: steps.mode.outputs.value != 'validate'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/gpw_daily_pick.json data/investments/gpw_daily_pick_metrics.json data/investments/gpw_daily_pick_learning.json data/investments/gpw_daily_candidate_ranking.json data/investments/daily_stock_history_index.json 2>/dev/null || true
          git add data/investments/stock_trading_portfolio.json 2>/dev/null || true
          git add data/investments/gpw_daily_pick_history data/internal/gpw_daily_pick_audit 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Publish GPW Stock Trading candidate state"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt*4))
          done
          exit 1

      - name: Request Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            CODE=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
            [[ "$CODE" == "201" ]] && exit 0
            [[ "$CODE" != "409" ]] && { cat /tmp/pages.json; exit 1; }
            sleep 10
          done
          exit 1

      - name: Enforce scheduled GPW publication SLA without forced entry
        if: always() && github.event_name == 'schedule' && steps.mode.outputs.value == 'auto'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/investments/gpw_daily_pick.json').read_text(encoding='utf-8'))
          if p.get('decision') not in {'TRANSAKCJA','BRAK_TRANSAKCJI','AWARIA_DANYCH'}:
              raise SystemExit(f'Invalid GPW candidate state: {p.get("decision")}')
          print('GPW_STOCK_SLA_OK',p.get('decision'),(p.get('selection') or {}).get('ticker'))
          PY
