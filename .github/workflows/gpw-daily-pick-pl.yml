name: Publish PL GPW Daily Pick

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - settle
          - validate
  push:
    branches: [main]
    paths:
      - ".github/workflows/gpw-daily-pick-pl.yml"
      - "scripts/gpw_daily_pick.py"
      - "scripts/gpw_daily_control_loop.py"
      - "scripts/gpw_event_layer.py"
      - "scripts/gpw_event_driven_loop.py"
      - "scripts/gpw-daily-pick-public.js"
      - "assets/gpw-daily-pick.css"
      - "data/investments/gpw_daily_pick_config.json"
      - "tests/test_gpw_daily_pick.py"
      - "tests/test_gpw_daily_control_loop.py"
      - "tests/test_gpw_event_layer.py"
      - "tests/test_gpw_daily_pick_ui.py"
      - "pl/inwestycje/portfel-10k.html"
  schedule:
    # Redundant pre-open attempts. In CEST these are 07:45-08:45 Warsaw;
    # in CET they are 06:45-07:45. Python decides whether to generate, retry,
    # no-op or fail closed after the immutable 08:30 cutoff.
    - cron: "45 5 * * 1-5"
    - cron: "0 6 * * 1-5"
    - cron: "15 6 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "45 6 * * 1-5"
    # End-of-day settlement / learning refresh, paired for CET/CEST.
    - cron: "40 16 * * 1-5"
    - cron: "40 17 * * 1-5"

permissions:
  contents: write
  pages: write

concurrency:
  group: gpw-daily-pick-pl
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_GENERATION_MODEL: gemini-3.5-flash-lite
      GEMINI_REVIEW_MODEL: gemini-3.5-flash-lite
      GEMINI_MIN_INTERVAL_SECONDS: "8"

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Resolve control-loop mode
        id: run
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          MODE="auto"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${REQUESTED_MODE:-auto}"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            case "$EVENT_SCHEDULE" in
              "40 16 * * 1-5"|"40 17 * * 1-5") MODE="settle" ;;
              *) MODE="auto" ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "GPW event control mode=$MODE Warsaw=$(TZ=Europe/Warsaw date +%H:%M) schedule=${EVENT_SCHEDULE:-push}"

      - name: Test GPW control, reports and learning contracts
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_gpw_daily_pick \
            tests.test_gpw_daily_control_loop \
            tests.test_gpw_event_layer \
            tests.test_gpw_daily_pick_ui -v
          python -m py_compile \
            scripts/gpw_daily_pick.py \
            scripts/gpw_daily_control_loop.py \
            scripts/gpw_event_layer.py \
            scripts/gpw_event_driven_loop.py
          python -m json.tool data/investments/gpw_daily_pick_config.json >/dev/null
          python -m json.tool data/investments/gpw_daily_pick.json >/dev/null
          node --check scripts/gpw-daily-pick-public.js

      - name: Check Gemini endpoint without blocking fail-closed state
        if: steps.run.outputs.mode == 'auto'
        shell: bash
        run: |
          set +e
          python scripts/check_ai_provider.py
          STATUS=$?
          set -e
          if [[ "$STATUS" != "0" ]]; then
            echo "Gemini preflight failed; control loop will retry and then publish today's fail-closed state if required."
          fi

      - name: Run event-driven self-healing PL GPW loop
        shell: bash
        env:
          MODE: ${{ steps.run.outputs.mode }}
        run: |
          set -euo pipefail
          python scripts/gpw_event_driven_loop.py --mode "$MODE"
          if [[ "$MODE" == "auto" ]]; then
            python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          today = datetime.now(ZoneInfo('Europe/Warsaw')).date().isoformat()
          payload = json.loads(Path('data/investments/gpw_daily_pick.json').read_text(encoding='utf-8'))
          if payload.get('date') == today:
              import subprocess
              subprocess.run(['python', 'scripts/gpw_event_driven_loop.py', '--mode', 'validate'], check=True)
          else:
              print('Pre-open event control run finished before publication window; no validation required yet.')
          PY
          fi

      - name: Cache-bust the Polish GPW widget
        if: steps.run.outputs.mode == 'auto'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pl/inwestycje/portfel-10k.html')
          text = path.read_text(encoding='utf-8')
          updated = text.replace(
              '/scripts/gpw-daily-pick-public.js?v=2',
              '/scripts/gpw-daily-pick-public.js?v=3',
          )
          if updated != text:
              path.write_text(updated, encoding='utf-8')
              print('Bumped GPW client asset to v3.')
          else:
              print('GPW client cache version already current.')
          PY

      - name: Commit scoped GPW state
        id: commit
        if: steps.run.outputs.mode != 'validate'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/investments/gpw_daily_pick.json \
            data/investments/gpw_daily_pick_metrics.json \
            data/investments/gpw_daily_pick_learning.json 2>/dev/null || true
          git add data/investments/gpw_daily_pick_history 2>/dev/null || true
          git add data/internal/gpw_daily_pick_audit 2>/dev/null || true
          git add pl/inwestycje/portfel-10k.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No GPW publication change."
            exit 0
          fi
          git commit -m "Publish PL GPW event-driven control state"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 4))
          done
          exit 1

      - name: Request fresh Pages build
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            CODE="$(curl --silent --show-error --output /tmp/gpw-pages.json --write-out '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")"
            if [[ "$CODE" == "201" ]]; then exit 0; fi
            if [[ "$CODE" != "409" ]]; then cat /tmp/gpw-pages.json; exit 1; fi
            sleep 10
          done
          exit 1

      - name: Verify today's PL GPW state on briefrooms.com
        if: steps.commit.outputs.changed == 'true' && steps.run.outputs.mode == 'auto'
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Europe/Warsaw")).date().isoformat()
          headers = {"User-Agent": "BriefRooms-GPW-production-verifier/3.0", "Cache-Control": "no-cache"}
          for attempt in range(1, 37):
              url = f"https://briefrooms.com/data/investments/gpw_daily_pick.json?v={int(time.time())}-{attempt}"
              try:
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.load(response)
                  if payload.get("date") == today and payload.get("decision") in {"TRANSAKCJA", "BRAK_TRANSAKCJI", "AWARIA_DANYCH"}:
                      print(f"Production verified: {payload['decision']} {today}")
                      raise SystemExit(0)
              except Exception as error:
                  print(f"Attempt {attempt}: {type(error).__name__}")
              time.sleep(10)
          raise SystemExit("Production did not expose today's GPW event-driven control state in time.")
          PY
