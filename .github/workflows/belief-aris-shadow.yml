name: Belief ARIS Shadow Diagnostics

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Belief Core Live Shadow Collection"]
    types: [completed]
  pull_request:
    paths:
      - "scripts/belief_aris_shadow.py"
      - "scripts/belief_aris_shadow_live.py"
      - "tests/test_belief_aris_shadow.py"
      - ".github/workflows/belief-aris-shadow.yml"
      - "docs/BELIEF_ARIS_SHADOW.md"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout authoritative main code after live run
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout PR or manual ref
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate ARIS shadow contract
        run: |
          python -m py_compile scripts/belief_aris_shadow.py scripts/belief_aris_shadow_live.py
          python -m unittest tests/test_belief_aris_shadow.py -v

      - name: Restore triggering Belief Core state
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/belief-state-artifact" "$RUNNER_TEMP/belief_core_state"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            > "$RUNNER_TEMP/artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/artifacts.json" <<'PY'
          import json, sys
          from pathlib import Path
          rows=json.loads(Path(sys.argv[1]).read_text()).get('artifacts', [])
          rows=[x for x in rows if x.get('name') == 'belief-core-shadow-state' and not x.get('expired')]
          print(rows[0]['id'] if rows else '')
          PY
          )
          test -n "$artifact_id"
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o "$RUNNER_TEMP/belief-state.zip"
          unzip -q "$RUNNER_TEMP/belief-state.zip" -d "$RUNNER_TEMP/belief-state-artifact"
          test -f "$RUNNER_TEMP/belief-state-artifact/belief-core-state.tgz"
          tar -xzf "$RUNNER_TEMP/belief-state-artifact/belief-core-state.tgz" -C "$RUNNER_TEMP/belief_core_state"
          echo "STATE_DIR=$RUNNER_TEMP/belief_core_state" >> "$GITHUB_ENV"

      - name: Build ARIS-inspired shadow diagnostics
        if: github.event_name == 'workflow_run'
        run: |
          python scripts/belief_aris_shadow_live.py --state-dir "$STATE_DIR" --print-summary
          test -f "$STATE_DIR/aris_belief_shadow.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ['STATE_DIR'])/'aris_belief_shadow.json').read_text())
          assert report['contract_version'] == 'belief-aris-shadow-v1'
          assert report['mode'] == 'research_shadow'
          assert report['authority']['belief_core_probability_remains_authoritative'] is True
          assert report['authority']['decision_influence'] is False
          assert report['authority']['belief_core_writeback_enabled'] is False
          assert report['authority']['automatic_tuning_enabled'] is False
          print('PR31 shadow authority invariants: PASS')
          PY

      - name: Pack diagnostics
        if: github.event_name == 'workflow_run'
        run: tar -czf "$RUNNER_TEMP/belief-aris-shadow.tgz" -C "$STATE_DIR" aris_belief_shadow.json

      - name: Store private shadow diagnostics
        if: github.event_name == 'workflow_run'
        uses: actions/upload-artifact@v4
        with:
          name: belief-aris-shadow
          path: ${{ runner.temp }}/belief-aris-shadow.tgz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
