name: Belief ARIS Shadow Diagnostics

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Belief Core Live Shadow Collection"]
    types: [completed]
  pull_request:
    paths:
      - "scripts/belief_aris_shadow.py"
      - "scripts/belief_aris_shadow_live.py"
      - "tests/test_belief_aris_shadow.py"
      - ".github/workflows/belief-aris-shadow.yml"
      - "docs/BELIEF_ARIS_SHADOW.md"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout authoritative main code after live run
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout PR or manual ref
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate ARIS shadow contract
        run: |
          python -m py_compile scripts/belief_aris_shadow.py scripts/belief_aris_shadow_live.py
          python -m unittest tests/test_belief_aris_shadow.py -v

      - name: Restore Belief Core state for replay
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/belief-state-artifact" "$RUNNER_TEMP/belief_core_state" "$RUNNER_TEMP/aris_shadow_output"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${TRIGGER_RUN_ID}/artifacts?per_page=100"
          else
            api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=belief-core-shadow-state&per_page=100"
          fi
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > "$RUNNER_TEMP/artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/artifacts.json" <<'PY'
          import json, sys
          from pathlib import Path
          rows=json.loads(Path(sys.argv[1]).read_text()).get('artifacts', [])
          rows=[x for x in rows if x.get('name') == 'belief-core-shadow-state' and not x.get('expired')]
          rows.sort(key=lambda x: x.get('created_at',''), reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
          )
          test -n "$artifact_id"
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o "$RUNNER_TEMP/belief-state.zip"
          unzip -q "$RUNNER_TEMP/belief-state.zip" -d "$RUNNER_TEMP/belief-state-artifact"
          test -f "$RUNNER_TEMP/belief-state-artifact/belief-core-state.tgz"
          tar -xzf "$RUNNER_TEMP/belief-state-artifact/belief-core-state.tgz" -C "$RUNNER_TEMP/belief_core_state"
          echo "STATE_DIR=$RUNNER_TEMP/belief_core_state" >> "$GITHUB_ENV"
          echo "ARIS_OUTPUT_DIR=$RUNNER_TEMP/aris_shadow_output" >> "$GITHUB_ENV"

      - name: Build isolated ARIS shadow diagnostics
        run: |
          set -euo pipefail
          state_hash_before=$(sha256sum "$STATE_DIR/state.json" | awk '{print $1}')
          python scripts/belief_aris_shadow_live.py \
            --state-dir "$STATE_DIR" \
            --output-dir "$ARIS_OUTPUT_DIR" \
            --print-summary
          state_hash_after=$(sha256sum "$STATE_DIR/state.json" | awk '{print $1}')
          test "$state_hash_before" = "$state_hash_after"
          test ! -e "$STATE_DIR/aris_belief_shadow.json"
          test -f "$ARIS_OUTPUT_DIR/aris_belief_shadow.json"

      - name: Assert PR31 zero-authority invariants
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ['ARIS_OUTPUT_DIR'])/'aris_belief_shadow.json').read_text())
          assert report['contract_version'] == 'belief-aris-shadow-v1'
          assert report['mode'] == 'research_shadow'
          assert report['representation_namespace'] == 'aris_shadow_only'
          authority=report['authority']
          assert authority['belief_core_probability_remains_authoritative'] is True
          assert authority['selected_representation_is_diagnostic_only'] is True
          for key in (
              'decision_influence',
              'production_decision_influence',
              'belief_core_writeback_enabled',
              'source_writeback_enabled',
              'consumer_contract_export_enabled',
              'trade_execution_enabled',
              'automatic_promotion_enabled',
              'automatic_tuning_enabled',
          ):
              assert authority[key] is False, key
          for belief_id, row in report['beliefs'].items():
              assert row['representation_namespace'] == 'aris_shadow_only', belief_id
              assert row['authority_preserved'] is True, belief_id
              for key in (
                  'decision_influence',
                  'production_decision_influence',
                  'belief_core_writeback_enabled',
                  'source_writeback_enabled',
                  'consumer_contract_export_enabled',
                  'trade_execution_enabled',
                  'automatic_promotion_enabled',
                  'automatic_tuning_enabled',
              ):
                  assert row[key] is False, (belief_id, key)
          print('PR31 hard shadow containment invariants: PASS')
          PY

      - name: Pack diagnostics
        run: tar -czf "$RUNNER_TEMP/belief-aris-shadow.tgz" -C "$ARIS_OUTPUT_DIR" aris_belief_shadow.json

      - name: Store private shadow diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: belief-aris-shadow
          path: ${{ runner.temp }}/belief-aris-shadow.tgz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
