name: Investment Room Full Audit

on:
  workflow_dispatch:
  push:
    branches:
      - fix/investment-room-full-audit-20260805
    paths:
      - "pl/inwestycje/portfel-10k.html"
      - "en/investing/portfolio-10k.html"
      - "scripts/*.js"
      - "scripts/audit_investment_rooms.mjs"
      - ".github/workflows/investment-room-full-audit.yml"
      - "data/investments/investment_room_audit_trigger.txt"

permissions:
  contents: write

concurrency:
  group: investment-room-full-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/investment-room-full-audit-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Chromium audit runtime
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/briefrooms-http.log 2>&1 &
          echo $! > /tmp/briefrooms-http.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/pl/inwestycje/portfel-10k.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/briefrooms-http.log
          exit 1

      - name: Audit every PL and EN tab
        id: browser_audit
        continue-on-error: true
        run: node scripts/audit_investment_rooms.mjs

      - name: Commit audit report and screenshots manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/investment_room_full_audit.json
          git commit -m "chore(investing): record full PL and EN audit" || exit 0
          git pull --rebase origin fix/investment-room-full-audit-20260805
          git push origin HEAD:fix/investment-room-full-audit-20260805

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: investment-room-full-audit-screenshots
          path: artifacts/*.png
          if-no-files-found: error

      - name: Fail when audit failed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/investments/investment_room_full_audit.json').read_text(encoding='utf-8'))
          if not report.get('passed'):
              raise SystemExit('Investment room full audit failed')
          print('Investment room full audit passed')
          PY
