name: Apply Portfolio 10K Material Events

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/investments/portfolio_10k_verified_material_events.json"
      - "data/investments/portfolio_10k_material_reports.json"
      - "scripts/brace_portfolio_material_overlay.py"
      - "scripts/brace_portfolio_user_control.py"
      - "scripts/brace_portfolio_decision.py"
      - "tests/test_brace_portfolio_material_overlay.py"
      - ".github/workflows/portfolio-10k-material-hotfix.yml"

permissions:
  contents: write
concurrency:
  group: portfolio-10k-material-events
  cancel-in-progress: false

jobs:
  apply-material-events:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and test material-event logic
        run: |
          python -m compileall -q scripts
          python -m pip install --upgrade pip pytest numpy pandas
          python -m pytest -q tests/test_brace_portfolio_material_overlay.py
      - name: Apply verified events to BRACE decisions
        run: |
          python scripts/brace_portfolio_material_overlay.py
          python scripts/brace_portfolio_user_control.py --republish
      - name: Verify Novo review and paper-control boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pending=json.loads(Path('data/portfolio10k/pending_decisions.json').read_text())
          public=json.loads(Path('data/portfolio10k/public/brace_engine_public.json').read_text())
          novo=next(row for row in pending.get('recommendations',[]) if row.get('instrument')=='novo')
          assert novo['action'] in {'REDUCE','EXIT'}
          assert (novo.get('material_event_context') or {}).get('report_count',0) >= 1
          assert public['controller_status']=='PROBATIONARY_CONTROL'
          assert public['source_metadata']['real_broker_connected'] is False
          print('Novo BRACE action:', novo['action'], novo['final_score'])
          PY
      - name: Commit material-aware decisions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio10k/analysis.json \
                  data/portfolio10k/pending_decisions.json \
                  data/portfolio10k/public/brace_engine_public.json
          if git diff --cached --quiet; then
            echo "No material-decision change to commit."
          else
            git commit -m "Apply verified material events to BRACE decisions"
            git pull --rebase origin main
            git push
          fi
