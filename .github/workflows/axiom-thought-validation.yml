name: AXIOM Thought Engine Validation

on:
  pull_request:
    paths:
      - 'data/home/axiom-thought.json'
      - 'data/home/axiom-thoughts-history.jsonl'
      - 'docs/axiom-thought-principles.md'
      - 'scripts/axiom_thought_guard.py'
      - 'scripts/publish_axiom_thought.py'
      - 'tests/test_axiom_thought_guard.py'
      - '.github/workflows/axiom-thought-validation.yml'
  push:
    branches: [main]
    paths:
      - 'data/home/axiom-thought.json'
      - 'data/home/axiom-thoughts-history.jsonl'
      - 'docs/axiom-thought-principles.md'
      - 'scripts/axiom_thought_guard.py'
      - 'scripts/publish_axiom_thought.py'
      - 'tests/test_axiom_thought_guard.py'
      - '.github/workflows/axiom-thought-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Thought Engine code
        run: |
          set -euo pipefail
          python -m py_compile scripts/axiom_thought_guard.py scripts/publish_axiom_thought.py
          python -m unittest tests.test_axiom_thought_guard -v
          python scripts/axiom_thought_guard.py
          grep -F 'test ciszy' docs/axiom-thought-principles.md
          grep -F 'minimum 5' docs/axiom-thought-principles.md
