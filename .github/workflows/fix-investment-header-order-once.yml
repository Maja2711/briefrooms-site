name: Fix Investment Header Order Once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply-fix:
    if: github.event.issue.title == 'Apply Investment Header Order Fix'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Move Investing next to News only inside investment rooms
        run: |
          python - <<'PY'
          from pathlib import Path

          header_path = Path('scripts/site-header.js')
          source = header_path.read_text(encoding='utf-8')
          old = "    NAVIGATION[language].forEach(function (item) {\n"
          new = """    var navigationItems = NAVIGATION[language].slice();
              if (activeSection === 'investing') {
                var investingIndex = navigationItems.findIndex(function (item) { return item.section === 'investing'; });
                if (investingIndex > 1) navigationItems.splice(1, 0, navigationItems.splice(investingIndex, 1)[0]);
              }
              navigationItems.forEach(function (item) {
          """
          if source.count(old) != 1:
              raise SystemExit(f'Expected one navigation render point, found {source.count(old)}')
          header_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          for page in (Path('pl/inwestycje.html'), Path('en/investing.html')):
              html = page.read_text(encoding='utf-8')
              old_version = '/scripts/site-header.js?v=20260801-2'
              new_version = '/scripts/site-header.js?v=20260806-3'
              if html.count(old_version) != 1:
                  raise SystemExit(f'{page}: expected one old site-header version, found {html.count(old_version)}')
              page.write_text(html.replace(old_version, new_version, 1), encoding='utf-8')
          PY

      - name: Validate header code and existing tests
        run: |
          node --check scripts/site-header.js
          node --test tests/test_site_header.js
          python - <<'PY'
          from pathlib import Path
          source = Path('scripts/site-header.js').read_text(encoding='utf-8')
          assert "if (activeSection === 'investing')" in source
          assert "navigationItems.splice(1, 0" in source
          for page in ('pl/inwestycje.html', 'en/investing.html'):
              html = Path(page).read_text(encoding='utf-8')
              assert '/scripts/site-header.js?v=20260806-3' in html
          print('Investment-room header order patch validated.')
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-investment-header-order-once.yml

      - name: Commit only the requested header-order change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/site-header.js pl/inwestycje.html en/investing.html .github/workflows/fix-investment-header-order-once.yml
          git commit -m "Place Investing next to News in investment rooms"
          git pull --rebase origin main
          git push origin main

      - name: Report completion
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Applied and validated: in PL and EN investment rooms, Investing now appears directly after News. No other navigation order is changed."
          gh issue close "$ISSUE_NUMBER" --reason completed
