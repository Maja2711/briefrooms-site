name: Belief Epistemic Causal Graph Shadow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/belief_epistemic_causal_graph.py"
      - "tests/test_belief_epistemic_causal_graph.py"
      - "docs/BELIEF_EPISTEMIC_CAUSAL_GRAPH.md"
      - ".github/workflows/belief-epistemic-causal-graph.yml"
      - ".github/workflows/belief-epistemic-causal-graph-validation.yml"
  workflow_run:
    workflows:
      - "BRACE Entity Belief State-Forecast Shadow"
    types: [completed]
  schedule:
    - cron: "45 4 * * 2-6"

permissions:
  contents: read
  actions: read

concurrency:
  group: belief-epistemic-causal-graph-shadow
  cancel-in-progress: false

env:
  PR15_ARTIFACT_NAME: brace-entity-belief-state-forecast-state
  STATE_ARTIFACT_NAME: belief-epistemic-causal-graph-state

jobs:
  run:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare private directories
        run: |
          set -euo pipefail
          echo "PR15_DIR=$RUNNER_TEMP/pr15_entity_belief" >> "$GITHUB_ENV"
          echo "STATE_DIR=$RUNNER_TEMP/pr19_epistemic_graph" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pr15_entity_belief" "$RUNNER_TEMP/pr19_epistemic_graph"

      - name: Restore latest PR15 Entity Belief state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${PR15_ARTIFACT_NAME}&per_page=100"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api" > "$RUNNER_TEMP/pr15-artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/pr15-artifacts.json" <<'PY'
          import json, sys
          from pathlib import Path
          rows=[x for x in json.loads(Path(sys.argv[1]).read_text()).get('artifacts',[]) if not x.get('expired')]
          rows.sort(key=lambda x:x.get('created_at',''), reverse=True)
          if not rows:
              raise SystemExit('PR19 blocked: PR15 Entity Belief artifact is missing')
          print(rows[0]['id'])
          PY
          )
          curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$RUNNER_TEMP/pr15.zip"
          mkdir -p "$RUNNER_TEMP/pr15-zip"
          unzip -q "$RUNNER_TEMP/pr15.zip" -d "$RUNNER_TEMP/pr15-zip"
          test -f "$RUNNER_TEMP/pr15-zip/brace-entity-belief-state-forecast-state.tgz"
          tar -xzf "$RUNNER_TEMP/pr15-zip/brace-entity-belief-state-forecast-state.tgz" -C "$PR15_DIR"
          test -f "$PR15_DIR/BRACE_ENTITY_BELIEF_STATE_FORECAST_REPORT.json"
          echo "PR15 prerequisite: PASS"

      - name: Restore prior cumulative PR19 state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${STATE_ARTIFACT_NAME}&per_page=100"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api" > "$RUNNER_TEMP/pr19-artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/pr19-artifacts.json" <<'PY'
          import json, sys
          from pathlib import Path
          rows=[x for x in json.loads(Path(sys.argv[1]).read_text()).get('artifacts',[]) if not x.get('expired')]
          rows.sort(key=lambda x:x.get('created_at',''), reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
          )
          if [ -n "$artifact_id" ]; then
            curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$RUNNER_TEMP/pr19.zip"
            mkdir -p "$RUNNER_TEMP/pr19-zip"
            unzip -q "$RUNNER_TEMP/pr19.zip" -d "$RUNNER_TEMP/pr19-zip"
            test -f "$RUNNER_TEMP/pr19-zip/belief-epistemic-causal-graph-state.tgz"
            tar -xzf "$RUNNER_TEMP/pr19-zip/belief-epistemic-causal-graph-state.tgz" -C "$STATE_DIR"
          else
            echo "No prior PR19 state; first run establishes the no-retroactive-binding boundary."
          fi

      - name: Validate PR19 code
        run: |
          set -euo pipefail
          PYTHONPATH=scripts:. python -m py_compile scripts/belief_epistemic_causal_graph.py
          PYTHONPATH=scripts:. python -m unittest tests.test_belief_epistemic_causal_graph -v

      - name: Build epistemic contracts and causal hypothesis graph
        run: |
          set -euo pipefail
          PYTHONPATH=scripts:. python scripts/belief_epistemic_causal_graph.py \
            --state-dir "$STATE_DIR" \
            --pr15-report "$PR15_DIR/BRACE_ENTITY_BELIEF_STATE_FORECAST_REPORT.json"

      - name: Assert PR19 anti-hindsight and zero-authority boundary
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path

          def dt(value):
              return datetime.fromisoformat(str(value).replace('Z','+00:00'))

          root=Path(os.environ['STATE_DIR'])
          report=json.loads((root/'BELIEF_EPISTEMIC_CAUSAL_GRAPH_REPORT.json').read_text())
          state=json.loads((root/'BELIEF_EPISTEMIC_CAUSAL_GRAPH_STATE.json').read_text())
          assert report['mode']=='research_shadow'
          assert report['active_decision_influence'] is False
          assert report['graph_runtime']['causal_status']=='UNVERIFIED_HYPOTHESIS'
          assert report['graph_runtime']['causal_proof'] is False
          assert report['graph_runtime']['correlation_to_causation_inference'] is False
          assert report['sample']['verified_causal_edges']==0
          assert report['research_boundary']['graph_edges_are_hypotheses_not_causal_proof'] is True
          assert report['research_boundary']['operational_correctness_is_not_automatically_causal_validation'] is True
          assert report['research_boundary']['entity_fundamental_correctness_is_not_economic_value'] is True
          assert report['research_boundary']['miv_score_enabled'] is False
          assert report['research_boundary']['alpha_score_enabled'] is False
          assert report['prospective_binding']['first_run_existing_forecasts_cursor_only'] is True
          assert report['prospective_binding']['graph_snapshot_must_preexist_forecast'] is True
          assert report['prospective_binding']['terminal_unbound_never_retroactively_bound'] is True
          assert report['promotion']['status']=='NOT_ELIGIBLE_FOR_PROMOTION_REVIEW'
          assert report['promotion']['eligible_for_promotion_review'] is False
          assert report['promotion']['automatic_promotion'] is False
          assert report['promotion']['effective_n_threshold_defined_here'] is False
          assert report['safety_controls'] and all(v is False for v in report['safety_controls'].values())
          pre=set(state.get('pre_activation_forecast_ids') or [])
          bound=set((state.get('forecast_bindings') or {}).keys())
          assert not (pre & bound)
          snapshots=state.get('graph_snapshots') or {}
          for binding in (state.get('forecast_bindings') or {}).values():
              assert binding['prospective'] is True
              assert binding['historical_backfill'] is False
              assert binding['retroactive_causal_classification'] is False
              assert binding['decision_influence'] is False
              snap=snapshots[binding['graph_snapshot_id']]
              assert dt(snap['created_at']) <= dt(binding['forecast_at'])
              ref=snap['contract_index'][binding['belief_id']]
              assert ref['epistemic_contract_id']==binding['epistemic_contract_id']
              assert ref['immutable_sha256']==binding['epistemic_contract_sha256']
          for row in (state.get('terminal_unbound_forecasts') or {}).values():
              assert row['terminal_no_retroactive_binding'] is True
          for edge in report['graph']['edges']:
              assert edge['causal_status']=='UNVERIFIED_HYPOTHESIS'
              assert edge['causal_proof'] is False
              assert edge['decision_influence'] is False
          for contract in report['contracts'].values():
              assert contract['causal_assumptions']
              assert contract['transmission_path']
              assert contract['falsifiers']
              assert contract['alternative_explanations']
              assert contract['unknowns']
              assert contract['regime_dependencies']
              assert any(x['machine_testable'] for x in contract['falsifiers'])
              assert contract['causal_proof'] is False
              assert contract['decision_influence'] is False
          print('PR19 epistemic + causal anti-hindsight contract: PASS')
          print('Sample:', report['sample'])
          print('Graph:', report['graph_runtime'])
          PY

      - name: Pack cumulative private PR19 state
        run: tar -czf "$RUNNER_TEMP/belief-epistemic-causal-graph-state.tgz" -C "$STATE_DIR" .

      - name: Store cumulative PR19 state
        uses: actions/upload-artifact@v4
        with:
          name: belief-epistemic-causal-graph-state
          path: ${{ runner.temp }}/belief-epistemic-causal-graph-state.tgz
          if-no-files-found: error
          retention-days: 180
          compression-level: 0
