name: Validate WES Lifecycle Outbox

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/wes_notification_outbox.py"
      - "scripts/wes_decision_ledger.py"
      - "scripts/wes_v5_history_seal.py"
      - "scripts/migrate_wes_v5_history_seals.py"
      - "tests/test_wes_v5_history_seal.py"
      - "tests/test_wes_v5_audit_seal.py"
      - "data/investments/wes_v5_history_seal_manifest.json"
      - "scripts/migrate_wes_pending_decisions.py"
      - "tests/test_wes_decision_ledger.py"
      - "tests/test_migrate_wes_pending_decisions.py"
      - "data/investments/wes_decision_ledger.json"
      - "scripts/investments_weekly_v5.py"
      - "scripts/investments_weekly_v2.py"
      - "scripts/audit_intraday_risk_exits.py"
      - "scripts/daily_position_review.py"
      - "scripts/build_trading_notification_events.py"
      - "workers/trading-push/**"
      - "scripts/trading-notifications.js"
      - "assets/trading-notifications.css"
      - "br-trading-sw.js"
      - "tests/test_wes_notification_outbox.py"
      - "tests/test_trading_notification_events.py"
      - ".github/workflows/wes-lifecycle-outbox-validation.yml"
  push:
    branches: [main]
    paths:
      - "scripts/wes_notification_outbox.py"
      - "scripts/wes_decision_ledger.py"
      - "scripts/wes_v5_history_seal.py"
      - "scripts/migrate_wes_v5_history_seals.py"
      - "tests/test_wes_v5_history_seal.py"
      - "tests/test_wes_v5_audit_seal.py"
      - "data/investments/wes_v5_history_seal_manifest.json"
      - "scripts/migrate_wes_pending_decisions.py"
      - "tests/test_wes_decision_ledger.py"
      - "tests/test_migrate_wes_pending_decisions.py"
      - "data/investments/wes_decision_ledger.json"
      - "scripts/investments_weekly_v5.py"
      - "scripts/investments_weekly_v2.py"
      - "scripts/audit_intraday_risk_exits.py"
      - "scripts/daily_position_review.py"
      - "scripts/build_trading_notification_events.py"
      - "workers/trading-push/**"
      - "scripts/trading-notifications.js"
      - "assets/trading-notifications.css"
      - "br-trading-sw.js"
      - "tests/test_wes_notification_outbox.py"
      - "tests/test_trading_notification_events.py"
      - ".github/workflows/wes-lifecycle-outbox-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install WES validation dependencies
        run: python -m pip install --upgrade pip yfinance pandas numpy

      - name: Validate Python lifecycle event path
        run: |
          set -euo pipefail
          python -m py_compile             scripts/wes_notification_outbox.py             scripts/wes_decision_ledger.py             scripts/wes_v5_history_seal.py             scripts/migrate_wes_pending_decisions.py             scripts/migrate_wes_v5_history_seals.py             scripts/audit_weekly_model.py             scripts/investments_weekly_v5.py             scripts/investments_weekly_v2.py             scripts/audit_intraday_risk_exits.py             scripts/daily_position_review.py             scripts/build_trading_notification_events.py
          python -m unittest             tests.test_wes_notification_outbox             tests.test_wes_decision_ledger             tests.test_wes_v5_history_seal             tests.test_wes_v5_audit_seal             tests.test_migrate_wes_pending_decisions             tests.test_trading_notification_events             tests.test_investments_weekly_v5 -v

      - name: Validate durable push outbox and client ACK/Inbox
        run: |
          set -euo pipefail
          node --check scripts/trading-notifications.js
          node --check br-trading-sw.js
          cd workers/trading-push
          npm install --no-audit --no-fund
          npm run check
