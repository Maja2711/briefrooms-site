name: One-shot GPW provider diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-gpw-provider-diagnostic.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe Yahoo and Stooq independently
        run: |
          python - <<'PY'
          import json, time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from scripts import gpw_market_data as m
          symbols = ['PKO.WA','PZU.WA','KGH.WA','CDR.WA','XTB.WA']
          def probe(provider, symbol):
              started=time.monotonic()
              try:
                  if provider == 'Yahoo':
                      bars=m._ORIGINAL_YAHOO_FETCHER(symbol)
                  else:
                      bars=m.fetch_stooq_daily_bars(symbol)
                  return {
                      'provider': provider, 'symbol': symbol, 'ok': True,
                      'seconds': round(time.monotonic()-started,2),
                      'count': len(bars),
                      'latest': bars[-1].day.isoformat() if bars else None,
                  }
              except Exception as exc:
                  return {
                      'provider': provider, 'symbol': symbol, 'ok': False,
                      'seconds': round(time.monotonic()-started,2),
                      'error': f'{type(exc).__name__}: {str(exc)}'[:1000],
                  }
          rows=[]
          with ThreadPoolExecutor(max_workers=10) as pool:
              fs=[pool.submit(probe,p,s) for s in symbols for p in ('Yahoo','Stooq')]
              for f in as_completed(fs): rows.append(f.result())
          payload={'date':'2026-08-19','rows':sorted(rows,key=lambda x:(x['symbol'],x['provider']))}
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          path=Path('data/internal/gpw_provider_diagnostic_2026-08-19.json')
          path.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit diagnostic and remove probe workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-gpw-provider-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/internal/gpw_provider_diagnostic_2026-08-19.json .github/workflows/one-shot-gpw-provider-diagnostic.yml
          git commit -m "Audit GPW market data providers"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
