name: Verify AI Outlook Live Content

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  verify:
    if: github.event.issue.title == 'Verify AI Outlook live content'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact live AI Outlook content
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          import urllib.request
          from pathlib import Path

          expected = json.loads(Path('data/ai_outlook.json').read_text(encoding='utf-8'))
          expected_pl = expected['pl']
          result = {
              'schema_version': 'ai-outlook-live-content-check-v1',
              'status': 'failed',
              'expected': {
                  'date': expected.get('date'),
                  'forecast_id': expected_pl.get('forecast_id'),
                  'title': expected_pl.get('title'),
                  'resolution_date': expected_pl.get('resolution', {}).get('resolution_date'),
              },
              'observed': {},
              'errors': [],
          }
          headers = {
              'User-Agent': 'BriefRooms-AI-Outlook-live-check/1.0',
              'Cache-Control': 'no-cache, no-store, max-age=0',
              'Pragma': 'no-cache',
          }
          for attempt in range(1, 49):
              token = f'{int(time.time())}-{attempt}'
              try:
                  request = urllib.request.Request(
                      f'https://briefrooms.com/data/ai_outlook.json?v={token}',
                      headers=headers,
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      live = json.loads(response.read().decode('utf-8'))
                  live_pl = live.get('pl') or {}
                  observed = {
                      'date': live.get('date'),
                      'forecast_id': live_pl.get('forecast_id'),
                      'title': live_pl.get('title'),
                      'resolution_date': (live_pl.get('resolution') or {}).get('resolution_date'),
                      'generated_at': live.get('generated_at'),
                  }
                  result['observed'] = observed
                  errors = []
                  for key, value in result['expected'].items():
                      if observed.get(key) != value:
                          errors.append(f'{key}: expected {value!r}, observed {observed.get(key)!r}')
                  if not errors:
                      result['status'] = 'passed'
                      result['errors'] = []
                      break
                  result['errors'] = errors
              except Exception as exc:
                  result['errors'] = [str(exc)]
              time.sleep(10)

          Path('data/ai_outlook_live_content_check.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(result, ensure_ascii=False))
          if result['status'] != 'passed':
              raise SystemExit('Live AI Outlook does not equal latest verified main')
          PY

      - name: Commit verification result
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai_outlook_live_content_check.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record exact AI Outlook live content check"
          git pull --rebase origin main
          git push origin HEAD:main
