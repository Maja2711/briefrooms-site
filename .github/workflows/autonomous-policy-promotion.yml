name: Autonomous Policy Promotion

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Learning Outcome Loop"
    types: [completed]
  schedule:
    - cron: "27 5 * * 1-5"
    - cron: "27 17 * * 1-5"
  pull_request:
    paths:
      - "scripts/autonomous_policy_promotion.py"
      - "scripts/autonomous_policy_promotion_v2.py"
      - "scripts/statistical_promotion_gate.py"
      - "scripts/statistical_promotion_gate_v2.py"
      - "scripts/policy_runtime_overlay.py"
      - "scripts/statistical_policy_materializer.py"
      - "scripts/autonomous_policy_observatory.py"
      - "data/investments/statistical_promotion_gate_v2_config.json"
      - "tests/test_autonomous_policy_promotion.py"
      - "tests/test_statistical_promotion_gate.py"
      - "tests/test_autonomous_policy_observatory.py"
      - "tests/test_promotion_safety_v2.py"
      - ".github/workflows/autonomous-policy-promotion.yml"

# PR-A safety freeze: this workflow may evaluate challengers and publish a
# read-only observatory snapshot, but it cannot write GPW/US production config.
permissions:
  contents: read
  actions: write

concurrency:
  group: autonomous-policy-promotion
  cancel-in-progress: false

env:
  PRIMARY_ARTIFACT: autonomous-policy-state
  CHECKPOINT_ARTIFACT: autonomous-policy-checkpoint
  ARCHIVE_NAME: autonomous-policy-state.tgz

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
    steps:
      - name: Checkout tested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate PR-A promotion safety code
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/autonomous_policy_promotion.py \
            scripts/autonomous_policy_promotion_v2.py \
            scripts/statistical_promotion_gate.py \
            scripts/statistical_promotion_gate_v2.py \
            scripts/policy_runtime_overlay.py \
            scripts/policy_repo_materializer.py \
            scripts/statistical_policy_materializer.py \
            scripts/autonomous_policy_observatory.py
          python -m json.tool data/investments/statistical_promotion_gate_v2_config.json >/dev/null
          python -m unittest \
            tests.test_autonomous_policy_promotion \
            tests.test_statistical_promotion_gate \
            tests.test_autonomous_policy_observatory \
            tests.test_promotion_safety_v2 -v

  research:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare private runtime directories
        run: |
          set -euo pipefail
          echo "POLICY_STATE_DIR=$RUNNER_TEMP/autonomous-policy" >> "$GITHUB_ENV"
          echo "LEARNING_STATE_DIR=$RUNNER_TEMP/learning-outcome-loop-readonly" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/autonomous-policy" "$RUNNER_TEMP/learning-outcome-loop-readonly"

      - name: Restore prior autonomous policy state or allow first activation
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          prior_success="$(gh run list \
            --workflow autonomous-policy-promotion.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"

          if [[ -z "$prior_success" ]]; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "No prior successful autonomous policy run; first prospective activation is allowed."
            exit 0
          fi

          echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          restored=false
          for artifact in "$PRIMARY_ARTIFACT" "$CHECKPOINT_ARTIFACT"; do
            mapfile -t candidate_runs < <(
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact}&per_page=100" \
                --jq '.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main") | .workflow_run.id'
            )
            for run_id in "${candidate_runs[@]}"; do
              [[ -n "$run_id" ]] || continue
              run_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
              run_name="$(printf '%s' "$run_meta" | python -c 'import json,sys; print(json.load(sys.stdin).get("name", ""))')"
              run_result="$(printf '%s' "$run_meta" | python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion", ""))')"
              [[ "$run_name" == "Autonomous Policy Promotion" && "$run_result" == "success" ]] || continue
              rm -rf "$RUNNER_TEMP/policy-artifact" "$POLICY_STATE_DIR"
              mkdir -p "$RUNNER_TEMP/policy-artifact" "$POLICY_STATE_DIR"
              if ! gh run download "$run_id" -n "$artifact" -D "$RUNNER_TEMP/policy-artifact"; then
                continue
              fi
              archive="$RUNNER_TEMP/policy-artifact/$ARCHIVE_NAME"
              [[ -s "$archive" ]] || continue
              tar -xzf "$archive" -C "$POLICY_STATE_DIR"
              if python scripts/autonomous_policy_promotion.py --state-dir "$POLICY_STATE_DIR" --verify; then
                restored=true
                break 2
              fi
            done
          done

          if [[ "$restored" != true ]]; then
            echo "Previous autonomous policy history exists but no valid artifact can be restored." >&2
            echo "FAIL_CLOSED: refusing a second activation boundary." >&2
            exit 1
          fi

      - name: Restore latest Learning Outcome Loop state read-only
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list \
            --workflow learning-outcome-loop.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [[ -z "$run_id" ]]; then
            echo "No Learning Outcome Loop state yet; PR-A will run with zero new evidence."
            exit 0
          fi
          rm -rf "$RUNNER_TEMP/learning-artifact"
          mkdir -p "$RUNNER_TEMP/learning-artifact"
          if ! gh run download "$run_id" -n learning-outcome-loop-state -D "$RUNNER_TEMP/learning-artifact"; then
            echo "Latest learning run has no state artifact; continuing without new evidence."
            exit 0
          fi
          archive="$RUNNER_TEMP/learning-artifact/learning-outcome-loop-state.tgz"
          [[ -s "$archive" ]] || exit 0
          tar -xzf "$archive" -C "$LEARNING_STATE_DIR"
          if [[ -f "$LEARNING_STATE_DIR/learning_ledger.jsonl" ]]; then
            python scripts/learning_outcome_loop.py --state-dir "$LEARNING_STATE_DIR" --verify
          fi

      - name: Run PR35 fixed-N prospective validation v2
        run: |
          set -euo pipefail
          python scripts/autonomous_policy_promotion_v2.py \
            --state-dir "$POLICY_STATE_DIR" \
            --learning-state-dir "$LEARNING_STATE_DIR" \
            --repo-root .
          python scripts/autonomous_policy_promotion_v2.py \
            --state-dir "$POLICY_STATE_DIR" \
            --verify

      - name: Run PR36 fresh fixed-N confirmation holdout v2
        run: |
          set -euo pipefail
          python scripts/statistical_promotion_gate_v2.py \
            --state-dir "$POLICY_STATE_DIR" \
            --repo-root .
          python scripts/statistical_promotion_gate_v2.py \
            --state-dir "$POLICY_STATE_DIR" \
            --repo-root . \
            --verify

      - name: Publish read-only observatory snapshot to private artifact only
        run: |
          set -euo pipefail
          python scripts/autonomous_policy_observatory.py \
            --state-dir "$POLICY_STATE_DIR" \
            --repo-root .
          python scripts/autonomous_policy_observatory.py \
            --state-dir "$POLICY_STATE_DIR" \
            --repo-root . \
            --verify
          test -s data/public/autonomous_policy_observatory.json
          cp data/public/autonomous_policy_observatory.json \
            "$POLICY_STATE_DIR/autonomous_policy_observatory_public.json"
          git diff --exit-code -- \
            data/investments/gpw_daily_pick_config.json \
            data/investments/us_daily_stock_config.json

      - name: Assert production promotion is frozen fail-closed
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from policy_runtime_overlay import apply_active_policy, PROMOTION_FREEZE_STATUS
          from statistical_policy_materializer import materialize

          root=Path(os.environ['POLICY_STATE_DIR'])
          registry_path=root/'policy_registry.json'
          registry=json.loads(registry_path.read_text())
          governance=registry['governance']
          assert governance['production_promotion_enabled'] is False
          assert governance['production_materialization_enabled'] is False
          assert governance['promotion_mode']=='FROZEN_FOR_PROSPECTIVE_VALIDATION'
          assert governance['promotion_methodology_version']==2

          baselines={
              'gpw_daily': json.loads(Path('data/investments/gpw_daily_pick_config.json').read_text()),
              'us_daily': json.loads(Path('data/investments/us_daily_stock_config.json').read_text()),
          }
          for engine_id, baseline in baselines.items():
              effective=apply_active_policy(engine_id, baseline, registry_path=registry_path)
              assert effective['policy_version']==baseline['policy_version']
              assert effective['_autonomous_policy']['status']==PROMOTION_FREEZE_STATUS

          result=materialize(registry_path, root/'not-required-while-frozen.json', Path('.'))
          assert result['changed'] is False
          assert result['status']==PROMOTION_FREEZE_STATUS
          print('PR_A_PROMOTION_FREEZE_PASS')
          PY

      - name: Pack private autonomous policy research state
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/$ARCHIVE_NAME" -C "$POLICY_STATE_DIR" .
          test -s "$RUNNER_TEMP/$ARCHIVE_NAME"

      - name: Store primary autonomous policy state
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-policy-state
          path: ${{ runner.temp }}/autonomous-policy-state.tgz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Store autonomous policy checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-policy-checkpoint
          path: ${{ runner.temp }}/autonomous-policy-state.tgz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Prune old autonomous policy artifacts
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          for artifact in "$PRIMARY_ARTIFACT" "$CHECKPOINT_ARTIFACT"; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact}&per_page=100" > "$RUNNER_TEMP/${artifact}.json"
            python - "$RUNNER_TEMP/${artifact}.json" <<'PY' > "$RUNNER_TEMP/delete.txt"
          import json,sys
          from pathlib import Path
          rows=[x for x in json.loads(Path(sys.argv[1]).read_text()).get('artifacts',[]) if not x.get('expired')]
          rows.sort(key=lambda x:x.get('created_at',''), reverse=True)
          for row in rows[72:]: print(row['id'])
          PY
            while read -r artifact_id; do
              [[ -n "$artifact_id" ]] || continue
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            done < "$RUNNER_TEMP/delete.txt"
          done
