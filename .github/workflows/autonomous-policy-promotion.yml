name: Autonomous Policy Promotion

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/autonomous-policy-promotion.yml"
      - ".github/workflows/stock-trading-component-promotion.yml"
      - "scripts/stock_trading_component_candidate_intake.py"
      - "scripts/stock_trading_component_bound_promotion.py"
      - "scripts/stock_trading_component_promotion.py"
      - "data/investments/stock_trading_component_promotion_config.json"
      - "data/investments/stock_trading_champion_manifest.json"
      - "data/investments/stock_trading_v2_production_config.json"

# Legacy PR35/PR36 targets (gpw_daily/us_daily) are retired as production
# destinations. Stock Trading v2 owns the production Champion/Challenger path.
# This workflow is retained only as a compatibility router: a manual invocation
# forwards to the authoritative Stock Trading Component Promotion workflow.
# Automatic Stock Trading promotion remains owned by that workflow's own
# workflow_run + schedule triggers, avoiding duplicate promotion loops.

permissions:
  contents: read
  actions: write

concurrency:
  group: autonomous-policy-promotion-router
  cancel-in-progress: false

jobs:
  validate-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert Stock Trading is the production promotion authority
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          promotion = json.loads(
              Path("data/investments/stock_trading_component_promotion_config.json").read_text()
          )
          manifest = json.loads(
              Path("data/investments/stock_trading_champion_manifest.json").read_text()
          )
          production = json.loads(
              Path("data/investments/stock_trading_v2_production_config.json").read_text()
          )

          assert promotion["schema_version"] == "stock-trading-component-promotion-config-v1"
          assert promotion["enabled"] is True
          assert promotion["require_formal_holdout_pass"] is True
          assert promotion["require_exact_production_candidate"] is True
          assert promotion["require_main_owned_deployment"] is True
          assert promotion["post_promotion_health_check"] is True
          assert promotion["automatic_health_rollback"] is True
          assert promotion["arbitrary_code_deployment_forbidden"] is True

          assert manifest["schema_version"] == "stock-trading-champion-manifest-v1"
          assert manifest["status"] == "ACTIVE"

          assert production["schema_version"] == "stock-trading-v2-production-config-v1"
          assert production["enabled"] is True
          assert production["champion_engine"] == "v2"
          assert production["challenger_engine"] == "v1"

          print("STOCK_TRADING_PROMOTION_AUTHORITY_OK")
          print("LEGACY_GPW_DAILY_US_DAILY_PRODUCTION_TARGETS_RETIRED")
          PY

      - name: Validate Stock Trading promotion machinery
        run: |
          set -euo pipefail
          python -m py_compile             scripts/stock_trading_component_candidate_intake.py             scripts/stock_trading_component_bound_promotion.py             scripts/stock_trading_component_promotion.py
          python scripts/test_stock_trading_component_promotion.py
          python scripts/test_stock_trading_component_bound_promotion.py
          python scripts/test_stock_trading_component_candidate_intake.py

  route-manual-request:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-routing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Route legacy manual invocation to Stock Trading promotion
        run: |
          set -euo pipefail
          gh workflow run stock-trading-component-promotion.yml             --repo "$GITHUB_REPOSITORY"             --ref main
          echo "ROUTED_TO_STOCK_TRADING_COMPONENT_PROMOTION"
