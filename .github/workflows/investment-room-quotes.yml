name: Update Investment Room Quotes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_investment_room_quotes.py"
      - "scripts/update_investment_room_quotes_v2.py"
      - ".github/workflows/investment-room-quotes.yml"
  schedule:
    # Room-level quote tables are secondary to Weekly current-price marks and
    # can run every 15 minutes without contending for live_prices.json.
    - cron: "4,19,34,49 * * * *"

permissions:
  contents: write

concurrency:
  group: investment-room-quotes
  # Do not cancel an in-flight run when a new scheduled run arrives. The old
  # five-minute cadence + cancellation could starve the workflow indefinitely.
  cancel-in-progress: false

jobs:
  update-investment-room-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update Investment Room secondary quotes
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import update_investment_room_quotes_v2 as updater

          # Weekly Trading now owns live_prices.json through its dedicated fast
          # workflow. Keep this slower room/bond job from racing that file.
          updater.refresh_live_prices = lambda: print("Skipping live_prices.json; owned by Update Weekly Live Prices")
          updater.main()
          PY

      - name: Validate Investment Room quote snapshot
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/investments/room_quotes.json")
          if not path.exists():
              raise SystemExit("room_quotes.json was not generated")

          data = json.loads(path.read_text(encoding="utf-8"))
          raw_updated_at = data.get("updated_at")
          if not raw_updated_at:
              raise SystemExit("room_quotes.json has no updated_at")
          updated_at = datetime.fromisoformat(raw_updated_at)
          if updated_at.tzinfo is None:
              raise SystemExit("room_quotes.json updated_at must be timezone-aware")
          age_seconds = (datetime.now(timezone.utc) - updated_at.astimezone(timezone.utc)).total_seconds()
          if age_seconds < -60 or age_seconds > 20 * 60:
              raise SystemExit(f"room_quotes.json snapshot is stale: age={age_seconds:.0f}s")

          quotes = data.get("quotes") or {}
          expected = {"eurusd", "sp500", "btcusd", "pl10y", "us10y"}
          missing = sorted(expected - set(quotes))
          if missing:
              raise SystemExit(f"room_quotes.json is missing instruments: {', '.join(missing)}")

          market_valid = []
          for key in ("eurusd", "sp500", "btcusd"):
              try:
                  if float((quotes.get(key) or {}).get("close")) > 0:
                      market_valid.append(key)
              except (TypeError, ValueError):
                  pass
          if not market_valid:
              raise SystemExit("No valid FX/index/crypto quote in room_quotes.json")
          print(f"Investment Room quote snapshot OK; age={age_seconds:.0f}s; markets={','.join(market_valid)}")
          PY

      - name: Commit Investment Room quotes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/room_quotes.json
          if git diff --cached --quiet; then
            echo "No Investment Room quote changes"
            exit 0
          fi
          git commit -m "Update investment room quotes"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            echo "Push failed (${attempt}/5); retrying..."
            sleep $((attempt * 2))
          done

          echo "Unable to push Investment Room quotes after 5 attempts" >&2
          exit 1
