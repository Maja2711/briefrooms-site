name: Shadow Engines Observatory

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Stock Trading v1 Shadow Challenger"
      - "BRACE-SPX Architecture 2 Shadow"
      - "Weekly Engine Star"
      - "FSE Fractal Structure Engine Shadow"
      - "FSE Phase & Cross-Scale Shadow"
      - "Hypothesis Shadow Engine 2.0"
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build_shadow_engines_public.py"
      - "scripts/publish_shadow_snapshot.py"
      - "scripts/audit_provenance.py"
      - "scripts/provenance_contract.py"
      - "tests/test_shadow_engines_public.py"
      - "tests/test_investments_wes_counterfactual.py"
      - "tests/test_investments_wes_spx_brace_bridge.py"
      - "scripts/investments_wes_counterfactual.py"
      - "scripts/wes_independent_weekly_baseline.py"
      - "tests/test_wes_independent_weekly_baseline.py"
      - "scripts/investments_wes_spx_brace_bridge.py"
      - "scripts/central-lab.js"
      - ".github/workflows/shadow-engines-observatory.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: shadow-engines-observatory
  # Do not cancel an in-flight publication with the next 5-minute schedule.
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate shadow registry builder and LAB frontend
        run: |
          python -m py_compile scripts/build_shadow_engines_public.py scripts/publish_shadow_snapshot.py
          node --check scripts/central-lab.js
          grep -q 'data-tab="shadow"' pl/inwestycje/decision-lab.html
          grep -q 'central-shadow-engines' pl/inwestycje/decision-lab.html

      - name: Collect latest run for every registered shadow engine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          workflows=subprocess.check_output(
              ["python","scripts/build_shadow_engines_public.py","--list-workflows"],
              text=True
          ).splitlines()
          out={}
          for workflow in workflows:
              try:
                  raw=subprocess.check_output([
                      "gh","run","list",
                      "--workflow",workflow,
                      "--branch","main",
                      "--limit","1",
                      "--json","databaseId,status,conclusion,createdAt,updatedAt"
                  ], text=True, timeout=20)
                  rows=json.loads(raw)
                  out[workflow]=rows[0] if rows else {}
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired, ValueError) as error:
                  # One failing source must not block other Shadow status rows.
                  print(f"WARNING: failed reading {workflow}: {error}", flush=True)
                  out[workflow]={}
          with open("/tmp/shadow-workflows.json","w",encoding="utf-8") as fh:
              json.dump(out,fh,ensure_ascii=False,indent=2)
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Build public Shadow Engines snapshot
        run: |
          python scripts/build_shadow_engines_public.py \
            --workflow-status /tmp/shadow-workflows.json \
            --output data/investments/shadow_engines_public.json
          python -m json.tool data/investments/shadow_engines_public.json >/dev/null

      - name: Enforce native provenance before Shadow publication
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/audit_provenance.py \
            --profile shadow \
            --file data/investments/shadow_engines_public.json

      - name: Publish read-only status using optimistic single-file API update
        run: |
          set -euo pipefail
          python scripts/publish_shadow_snapshot.py
