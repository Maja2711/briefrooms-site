name: Daily EURUSD A-B-C Live Shadow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/daily_eurusd_experiment.py"
      - "scripts/daily_eurusd_experiment_v12.py"
      - "scripts/daily_eurusd_experiment_v13.py"
      - "scripts/daily_eurusd_abc_settler.py"
      - "scripts/daily_eurusd_abc_durability.py"
      - "tests/test_daily_eurusd_experiment.py"
      - "tests/test_daily_eurusd_abc_settler.py"
      - "tests/test_daily_eurusd_abc_trade_path.py"
      - "tests/test_daily_eurusd_abc_durability.py"
      - ".github/workflows/daily-eurusd-abc-live-shadow.yml"
  schedule:
    # Full frozen A/B/C capture: Belief Core collects at :07/:37, then A/B/C at :12/:42.
    - cron: "12,42 13-22 * * 1-5"
    # Settlement-only slots: point outcomes + PR24 virtual trade path, no new captures.
    - cron: "2,7,17,22,27,32,37,47,52,57 * * * 1-5"

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: daily-eurusd-abc-live-shadow
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
  ABC_ARTIFACT_NAME: daily-eurusd-abc-live-shadow-state
  BELIEF_ARTIFACT_NAME: belief-core-shadow-state
  PR20_BOOTSTRAP_CUTOFF_UTC: "2026-08-20T23:59:59Z"
  ABC_CAPTURE_CRON: "12,42 13-22 * * 1-5"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare private runtime paths and run mode
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          echo "ABC_STATE_DIR=$RUNNER_TEMP/eurusd_abc_state" >> "$GITHUB_ENV"
          echo "BELIEF_STATE_DIR=$RUNNER_TEMP/belief_core_state" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/eurusd_abc_state" "$RUNNER_TEMP/belief_core_state"

          mode="capture"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "${EVENT_SCHEDULE:-}" != "$ABC_CAPTURE_CRON" ]; then
            mode="settle"
          fi
          echo "ABC_RUN_MODE=$mode" >> "$GITHUB_ENV"
          echo "A/B/C run mode: $mode event=$GITHUB_EVENT_NAME schedule=${EVENT_SCHEDULE:-none}"

      - name: Restore verified durable A/B/C state or establish one-time activation boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state_dir="$ABC_STATE_DIR"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ABC_ARTIFACT_NAME}&per_page=100"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > "$RUNNER_TEMP/abc-artifacts.json"

          python - "$RUNNER_TEMP/abc-artifacts.json" > "$RUNNER_TEMP/abc-candidates.txt" <<'PY'
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text())
          rows=[x for x in payload.get('artifacts', []) if not x.get('expired')]
          rows.sort(key=lambda x: x.get('created_at',''), reverse=True)
          for row in rows[:20]:
              wr=row.get('workflow_run') or {}
              if wr.get('id') and wr.get('head_branch') == 'main':
                  print(f"{row['id']}|{wr['id']}")
          PY

          artifact_id=""
          while IFS='|' read -r candidate_id run_id; do
            [ -n "$candidate_id" ] || continue
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              -o "$RUNNER_TEMP/abc-run.json"
            if python - "$RUNNER_TEMP/abc-run.json" <<'PY'
          import json, sys
          from pathlib import Path
          run=json.loads(Path(sys.argv[1]).read_text())
          ok=(
              run.get('name') == 'Daily EURUSD A-B-C Live Shadow'
              and run.get('head_branch') == 'main'
              and run.get('conclusion') == 'success'
          )
          raise SystemExit(0 if ok else 1)
          PY
            then
              artifact_id="$candidate_id"
              break
            fi
          done < "$RUNNER_TEMP/abc-candidates.txt"

          if [ -n "$artifact_id" ]; then
            echo "Restoring verified A/B/C artifact id=$artifact_id"
            curl -fsSL -L \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o "$RUNNER_TEMP/abc-state.zip"
            mkdir -p "$RUNNER_TEMP/abc-state-artifact"
            unzip -q "$RUNNER_TEMP/abc-state.zip" -d "$RUNNER_TEMP/abc-state-artifact"
            test -f "$RUNNER_TEMP/abc-state-artifact/daily-eurusd-abc-live-shadow-state.tgz"
            tar -xzf "$RUNNER_TEMP/abc-state-artifact/daily-eurusd-abc-live-shadow-state.tgz" -C "$state_dir"
            python scripts/daily_eurusd_abc_durability.py verify \
              --layer pr20_eurusd_abc \
              --state-dir "$state_dir"
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$ABC_RUN_MODE" != "capture" ]; then
            echo "PR20 state missing outside initial merge activation; FAIL_CLOSED." >&2
            exit 1
          fi

          python - <<'PY'
          from datetime import datetime, timezone
          import os
          cutoff=datetime.fromisoformat(os.environ['PR20_BOOTSTRAP_CUTOFF_UTC'].replace('Z','+00:00'))
          now=datetime.now(timezone.utc)
          if now > cutoff:
              raise SystemExit(f"PR20 bootstrap cutoff passed: now={now.isoformat()} cutoff={cutoff.isoformat()}")
          print('PR20 first-run bootstrap explicitly allowed inside activation boundary.')
          PY

      - name: Restore latest successful Belief Core state read-only for capture runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$ABC_RUN_MODE" != "capture" ]; then
            echo "Settlement-only run: Belief restore intentionally skipped."
            exit 0
          fi

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${BELIEF_ARTIFACT_NAME}&per_page=100"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > "$RUNNER_TEMP/belief-artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/belief-artifacts.json" <<'PY'
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text())
          rows=[x for x in payload.get('artifacts', []) if not x.get('expired')]
          rows.sort(key=lambda x: x.get('created_at',''), reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
          )
          if [ -z "$artifact_id" ]; then
            echo "No Belief Core shadow artifact; A/B/C parallel collection cannot be valid." >&2
            exit 1
          fi
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o "$RUNNER_TEMP/belief-state.zip"
          mkdir -p "$RUNNER_TEMP/belief-state-artifact"
          unzip -q "$RUNNER_TEMP/belief-state.zip" -d "$RUNNER_TEMP/belief-state-artifact"
          test -f "$RUNNER_TEMP/belief-state-artifact/belief-core-state.tgz"
          tar -xzf "$RUNNER_TEMP/belief-state-artifact/belief-core-state.tgz" -C "$BELIEF_STATE_DIR"
          test -f "$BELIEF_STATE_DIR/state.json"

      - name: Validate PR24 runtime and zero-authority contract
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/daily_eurusd_experiment.py \
            scripts/daily_eurusd_experiment_v12.py \
            scripts/daily_eurusd_experiment_v13.py \
            scripts/daily_eurusd_abc_settler.py \
            scripts/daily_eurusd_abc_durability.py \
            scripts/research_state_durability.py
          if [ "$ABC_RUN_MODE" = "capture" ]; then
            python -m unittest \
              tests.test_daily_eurusd_experiment \
              tests.test_daily_eurusd_abc_settler \
              tests.test_daily_eurusd_abc_trade_path \
              tests.test_daily_eurusd_abc_durability -v
          fi
          python - <<'PY'
          import daily_eurusd_experiment_v13 as abc
          assert abc.base.MODE == 'research_shadow'
          assert abc.ENGINE_VERSION == 'eurusd-daily-abc-v1.3.0'
          assert abc.BOLLINGER_WINDOW == 30
          assert abc.BOLLINGER_STDDEV_LEVELS == (1.0, 2.0, 3.0)
          assert abc.ATR_30M_WINDOW == 26
          assert abc.ATR_MULTIPLE == 1.35
          assert abc.RISK_FLOOR_PERCENT == 0.0027
          assert abc.REWARD_RISK == 1.8
          assert abc.POSITION_HORIZON_MINUTES == 1440
          assert abc.base.MODE != 'production_execution'
          print('PR24 live-shadow virtual trade-path authority boundary: PASS')
          PY

      - name: Capture or settle prospective A/B/C state
        id: cycle
        run: |
          set -euo pipefail
          if [ "$ABC_RUN_MODE" = "capture" ]; then
            python scripts/daily_eurusd_experiment_v13.py \
              --state-dir "$ABC_STATE_DIR" \
              --belief-state "$BELIEF_STATE_DIR/state.json"
            echo "state_changed=true" >> "$GITHUB_OUTPUT"
            echo "resolved_delta=capture_cycle" >> "$GITHUB_OUTPUT"
            echo "trade_path_changed=new_capture" >> "$GITHUB_OUTPUT"
          else
            output=$(python scripts/daily_eurusd_abc_settler.py --state-dir "$ABC_STATE_DIR")
            printf '%s\n' "$output"
            if printf '%s\n' "$output" | grep -q '^ABC_STATE_CHANGED=true$'; then
              echo "state_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "state_changed=false" >> "$GITHUB_OUTPUT"
            fi
            delta=$(printf '%s\n' "$output" | sed -n 's/^ABC_RESOLVED_DELTA=//p' | tail -1)
            trade=$(printf '%s\n' "$output" | sed -n 's/^ABC_TRADE_PATH_CHANGED=//p' | tail -1)
            echo "resolved_delta=${delta:-0}" >> "$GITHUB_OUTPUT"
            echo "trade_path_changed=${trade:-false}" >> "$GITHUB_OUTPUT"
          fi
          python scripts/daily_eurusd_experiment_v13.py \
            --state-dir "$ABC_STATE_DIR" \
            --validate

      - name: Assert frozen A/B/C decision, PR24 trade plan and zero production authority
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ABC_STATE_DIR'])
          state=json.loads((root/'EURUSD_DAILY_ABC_STATE.json').read_text())
          report=json.loads((root/'EURUSD_DAILY_ABC_REPORT.json').read_text())
          assert state['mode'] == 'research_shadow'
          assert state['captures']
          latest=state['captures'][-1]
          assert set(latest['arms']) == {'A','B','C'}
          unavailable=[arm_id for arm_id, arm in latest['arms'].items() if not arm.get('available')]
          if unavailable:
              raise AssertionError(f"parallel A/B/C capture incomplete; unavailable={unavailable}")
          assert latest['research_boundary']['decision_influence'] is False
          assert latest['research_boundary']['trade_execution'] is False
          assert latest['research_boundary']['belief_writeback'] is False
          assert report['decision_influence'] is False
          assert report['governance']['active_daily_engine_influence'] is False
          if latest.get('engine_version') == 'eurusd-daily-abc-v1.3.0':
              assert latest.get('trade_plan_sha256')
              assert set((latest.get('trade_plan') or {}).get('arms') or {}) == {'A','B','C'}
              assert set((latest.get('trade_path') or {}).get('arms') or {}) == {'A','B','C'}
              assert report['trade_path']['virtual_only'] is True
              assert report['trade_path']['historical_backfill'] is False
          print('Latest A/B/C:', {k:(v.get('direction'),v.get('score'),v.get('available')) for k,v in latest['arms'].items()})
          PY

      - name: Seal and verify changed PR24 research state
        if: steps.cycle.outputs.state_changed == 'true'
        run: |
          set -euo pipefail
          python scripts/daily_eurusd_abc_durability.py seal \
            --layer pr20_eurusd_abc \
            --state-dir "$ABC_STATE_DIR"
          python scripts/daily_eurusd_abc_durability.py verify \
            --layer pr20_eurusd_abc \
            --state-dir "$ABC_STATE_DIR"
          python scripts/daily_eurusd_abc_durability.py pack \
            --layer pr20_eurusd_abc \
            --state-dir "$ABC_STATE_DIR" \
            --output "$RUNNER_TEMP/daily-eurusd-abc-live-shadow-state.tgz"
          test -s "$RUNNER_TEMP/daily-eurusd-abc-live-shadow-state.tgz"

      - name: Store changed cumulative A/B/C state outside repository
        if: steps.cycle.outputs.state_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-eurusd-abc-live-shadow-state
          path: ${{ runner.temp }}/daily-eurusd-abc-live-shadow-state.tgz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Publish A/B/C live-shadow collection status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          STATE_CHANGED: ${{ steps.cycle.outputs.state_changed }}
          RESOLVED_DELTA: ${{ steps.cycle.outputs.resolved_delta }}
          TRADE_PATH_CHANGED: ${{ steps.cycle.outputs.trade_path_changed }}
        run: |
          set -euo pipefail
          state=failure
          if [ "$JOB_STATUS" = "success" ]; then state=success; fi
          description=$(python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ.get('ABC_STATE_DIR',''))
          path=root/'EURUSD_DAILY_ABC_STATE.json'
          mode=os.environ.get('ABC_RUN_MODE','?')
          changed=os.environ.get('STATE_CHANGED','false')
          delta=os.environ.get('RESOLVED_DELTA','0')
          trade=os.environ.get('TRADE_PATH_CHANGED','false')
          if not path.is_file():
              print(f'A/B/C {mode}: no capture state')
          else:
              payload=json.loads(path.read_text())
              latest=(payload.get('captures') or [{}])[-1]
              arms=latest.get('arms') or {}
              parts=[]
              for key in ('A','B','C'):
                  arm=arms.get(key) or {}
                  parts.append(f"{key}:{arm.get('direction','?')}/{arm.get('score','?')}")
              print((f"{mode} changed={changed} point={delta} trade={trade} " + ' '.join(parts))[:135])
          PY
          )
          STATE="$state" DESCRIPTION="$description" python - <<'PY'
          import json, os, urllib.request
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}"
          payload=json.dumps({
              'state': os.environ['STATE'],
              'context': 'daily-eurusd-abc-live-shadow/collection',
              'description': os.environ['DESCRIPTION'],
              'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(url, data=payload, method='POST', headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              print(response.status)
          PY
          test "$state" = success
