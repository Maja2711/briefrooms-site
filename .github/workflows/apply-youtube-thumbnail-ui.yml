name: Apply YouTube Thumbnail UI

on:
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - "scripts/apply_youtube_thumbnail_ui.py"
      - "scripts/run_youtube_thumbnail_ui.py"
      - ".github/workflows/apply-youtube-thumbnail-ui.yml"
      - "data/system/youtube-thumbnail-ui-trigger.txt"

permissions:
  contents: write

concurrency:
  group: youtube-thumbnail-ui
  cancel-in-progress: true

jobs:
  apply:
    if: github.event_name != 'issues' || github.event.issue.title == 'Apply YouTube thumbnail UI'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply thumbnail UI
        run: python scripts/run_youtube_thumbnail_ui.py

      - name: Validate generated files
        run: |
          python -m py_compile scripts/apply_youtube_thumbnail_ui.py scripts/run_youtube_thumbnail_ui.py scripts/patch_en_youtube_recommendations.py scripts/fix_static_quality.py
          python - <<'PY'
          from pathlib import Path
          checks = {
              'pl/index.html': ['youtube-pick__avatar'],
              'pl/geopolityka.html': ['youtube-pick__avatar'],
              'pl/zdrowie.html': ['health-youtube-pick__avatar'],
              'en/index.html': ['br-yt-thumb'],
              'en/health.html': ['br-yt-thumb'],
              'en/science.html': ['br-yt-thumb'],
              'en/geopolitics.html': ['br-yt-thumb'],
          }
          for file_name, needles in checks.items():
              text = Path(file_name).read_text(encoding='utf-8')
              for needle in needles:
                  assert needle in text, f'{needle} missing from {file_name}'
          print('YouTube thumbnail UI validated')
          PY

      - name: Commit thumbnail UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/patch_en_youtube_recommendations.py \
            scripts/fix_static_quality.py \
            .github/workflows/publish-en-youtube-recommendations.yml \
            pl/index.html \
            pl/geopolityka.html \
            en/index.html \
            en/health.html \
            en/science.html \
            en/geopolitics.html
          if git diff --cached --quiet; then
            echo "No thumbnail UI changes to commit."
          else
            git commit -m "Add YouTube thumbnails across recommendation cards"
            git pull --rebase origin main
            git push
          fi
