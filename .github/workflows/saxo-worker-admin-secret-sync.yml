name: Sync private Saxo Worker Basic secret and validate read-only connectivity

# One-time repair on merging this workflow. Subsequent runs are manual.
# Never prints passwords, API tokens, response bodies, private prices, or P&L.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/saxo-worker-admin-secret-sync.yml"

permissions:
  contents: read

concurrency:
  group: saxo-private-admin-secret-sync
  cancel-in-progress: false

jobs:
  sync-verify:
    if: github.repository == 'Maja2711/briefrooms-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: scripts
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SAXO_PRIVATE_BASIC_PASSWORD: ${{ secrets.SAXO_PRIVATE_BASIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize only Saxo admin secret; prove independent private SIM read
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from saxo_private_feed import SAXO_WORKER_URL, validate_private_saxo_snapshot

          api_token = os.environ.get("CLOUDFLARE_API_TOKEN") or ""
          account_id = os.environ.get("CLOUDFLARE_ACCOUNT_ID") or ""
          password = os.environ.get("SAXO_PRIVATE_BASIC_PASSWORD") or ""
          if not api_token or not account_id or not password:
              print("RESULT=BLOCKED_MISSING_REQUIRED_SECRET")
              raise SystemExit(2)
          if len(password) < 32 or any(c in password for c in "\r\n"):
              print("RESULT=BLOCKED_WEAK_OR_INVALID_SECRET_FORMAT")
              raise SystemExit(3)

          worker_path = "https://api.cloudflare.com/client/v4/accounts/" + account_id + "/workers/scripts/briefrooms-saxo-eurusd"
          headers = {
              "Authorization": "Bearer " + api_token,
              "Content-Type": "application/json",
              "Accept": "application/json",
          }

          def cf_read(url, method="GET", payload=None):
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8") if payload is not None else None,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      if response.status < 200 or response.status >= 300:
                          return "HTTP_" + str(response.status), None
                      return "OK", json.loads(response.read(32768))
              except urllib.error.HTTPError as e:
                  return "HTTP_" + str(e.code), None
              except Exception:
                  return "NETWORK_ERROR", None

          status, settings = cf_read(worker_path + "/settings")
          if status != "OK" or not isinstance(settings, dict) or settings.get("success") is False:
              print("WORKER_SETTINGS_ACCESS=" + status)
              print("RESULT=BLOCKED_CLOUDFLARE_API")
              raise SystemExit(4)
          bindings = (settings.get("result") or {}).get("bindings") or []
          if not any(isinstance(b, dict) and b.get("name") == "SAXO_ADMIN_PASSWORD" for b in bindings):
              print("RESULT=BLOCKED_UNEXPECTED_WORKER_BINDINGS")
              raise SystemExit(5)

          # Authorized admin secret rotation only; other Worker bindings and code remain untouched.
          status, reply = cf_read(
              worker_path + "/secrets", method="PUT",
              payload={"name": "SAXO_ADMIN_PASSWORD", "text": password, "type": "secret_text"}
          )
          print("CLOUDFLARE_SECRET_SYNC=" + status)
          if status != "OK" or not isinstance(reply, dict) or reply.get("success") is not True:
              print("RESULT=BLOCKED_WORKER_SECRET_WRITE")
              raise SystemExit(6)

          basic = "Basic " + base64.b64encode(("admin:" + password).encode("utf-8")).decode("ascii")
          private_headers = {
              "Authorization": basic,
              "Accept": "application/json",
              "Cache-Control": "no-store",
          }

          def worker_read(url):
              request = urllib.request.Request(url, headers=private_headers)
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      if response.status != 200:
                          return "HTTP_" + str(response.status), None
                      return "OK", json.loads(response.read(16385))
              except urllib.error.HTTPError as e:
                  return "HTTP_" + str(e.code), None
              except Exception:
                  return "UNAVAILABLE", None

          # Allow brief eventual consistency for a just-created Worker version.
          base = SAXO_WORKER_URL.rsplit("/", 1)[0]
          for attempt in range(3):
              status, state = worker_read(base + "/status")
              if status == "OK":
                  break
              if attempt < 2:
                  time.sleep(3)
          print("WORKER_STATUS_ENDPOINT=" + status)
          if status != "OK":
              print("RESULT=SYNC_WRITTEN_BUT_RUNTIME_AUTH_UNVERIFIED")
              raise SystemExit(7)

          if not isinstance(state, dict) or not (
              state.get("connected") is True
              and state.get("environment") == "SIM"
              and state.get("trading_enabled") is False
          ):
              print("RESULT=BLOCKED_SAXO_SIM_OAUTH_STATUS")
              raise SystemExit(8)
          print("SAXO_SIM_STATUS=AUTHORIZED_CONNECTED_READ_ONLY")

          status, payload = worker_read(SAXO_WORKER_URL)
          print("WORKER_QUOTE_ENDPOINT=" + status)
          if status != "OK":
              print("RESULT=BLOCKED_PRIVATE_SAXO_QUOTE_ENDPOINT")
              raise SystemExit(9)
          try:
              quote = validate_private_saxo_snapshot(payload)
              assert quote["source"] == "SAXO_SIM"
              assert quote["redistributable"] is False
          except Exception:
              print("RESULT=BLOCKED_PRIVATE_QUOTE_FRESHNESS_OR_CONTRACT")
              raise SystemExit(10)
          print("SAXO_SIM_QUOTE=FRESH_BID_ASK_VALIDATED")
          print("RESULT=PASS_SYNCHRONIZED_PRIVATE_SAXO_SIM_READ")
          PY
