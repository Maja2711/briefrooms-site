name: Validate Weekly Investment Models

on:
  workflow_dispatch:
  schedule:
    - cron: "45 2 * * 0"
  push:
    branches: [main]
    paths:
      - "scripts/backtest_weekly_model_v2.py"
      - "scripts/backtest_multi_strategy_v4.py"
      - "scripts/backtest_weekly_execution_parity_v5.py"
      - "scripts/audit_weekly_model.py"
      - "scripts/audit_weekly_model_runtime.py"
      - "tests/test_audit_weekly_integrity.py"
      - ".github/workflows/investments-weekly-validation.yml"

permissions:
  contents: write

concurrency:
  group: investment-weekly-validation
  cancel-in-progress: true

jobs:
  validate-weekly-models:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip yfinance pandas numpy

      - name: Run full integrity and validation suite
        env:
          FORCE_BACKTEST: "1"
        run: |
          python -m unittest tests/test_audit_weekly_integrity.py
          python scripts/audit_weekly_model_runtime.py
          python scripts/backtest_weekly_model_v2.py
          python scripts/backtest_multi_strategy_v4.py
          python scripts/backtest_weekly_execution_parity_v5.py

      - name: Commit validation artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/model_audit.json \
                  data/investments/closed_week_manifest.json \
                  data/investments/model_validation_v2.json \
                  data/investments/weekly_execution_parity_v5.json
          if git diff --cached --quiet; then
            echo "No validation change to commit."
            exit 0
          fi
          git commit -m "Validate weekly investment models"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1
