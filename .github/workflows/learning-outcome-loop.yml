name: Learning Outcome Loop

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
    - cron: "15 6 * * 0"
  workflow_run:
    workflows:
      - "Belief Core Live Shadow Collection"
      - "Publish EN US Daily Stock"
      - "Monitor US Daily Stock Position"
      - "Monitor Daily EURUSD"
      - "Publish PL GPW Daily Pick"
      - "Monitor PL GPW Daily Trade Outcomes"
      - "Weekly Engine Star"
      - "BRACE Portfolio Research and Paper Control"
      - "BRACE-SPX Generation 6"
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: learning-outcome-loop
  cancel-in-progress: false

env:
  PRIMARY_ARTIFACT: learning-outcome-loop-state
  CHECKPOINT_ARTIFACT: learning-outcome-loop-checkpoint
  ARCHIVE_NAME: learning-outcome-loop-state.tgz

jobs:
  collect:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate PR28 and PR29 collectors before touching durable state
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/learning_ledger.py \
            scripts/learning_outcome_loop.py \
            scripts/counterfactual_decision_gate_diagnostics.py \
            scripts/counterfactual_decision_gate_diagnostics_v29_1.py \
            scripts/daily_stock_rejected_candidate_freeze.py
          python -m unittest discover -s tests -p 'test_learning_outcome_loop*.py' -v
          python -m unittest tests.test_learning_ledger -v
          python -m unittest tests.test_counterfactual_decision_gate_diagnostics -v
          python -m unittest tests.test_daily_stock_rejected_candidate_freeze -v

      - name: Prepare private runtime directories
        run: |
          set -euo pipefail
          echo "LEARNING_STATE_DIR=$RUNNER_TEMP/learning-outcome-loop" >> "$GITHUB_ENV"
          echo "BELIEF_STATE_DIR=$RUNNER_TEMP/belief-core-readonly" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/learning-outcome-loop" "$RUNNER_TEMP/belief-core-readonly"

      - name: Restore prior Learning Outcome Loop state or establish first activation
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          prior_success="$(gh run list \
            --workflow learning-outcome-loop.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"

          if [[ -z "$prior_success" ]]; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "No prior successful PR28 run. A new prospective activation boundary is allowed."
            exit 0
          fi

          echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          restored=false
          for artifact in "$PRIMARY_ARTIFACT" "$CHECKPOINT_ARTIFACT"; do
            mapfile -t candidate_runs < <(
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact}&per_page=100" \
                --jq '.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main") | .workflow_run.id'
            )
            for run_id in "${candidate_runs[@]}"; do
              [[ -n "$run_id" ]] || continue
              run_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
              run_name="$(printf '%s' "$run_meta" | python -c 'import json,sys; print(json.load(sys.stdin).get("name", ""))')"
              run_result="$(printf '%s' "$run_meta" | python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion", ""))')"
              [[ "$run_name" == "Learning Outcome Loop" && "$run_result" == "success" ]] || continue

              rm -rf "$RUNNER_TEMP/learning-artifact" "$LEARNING_STATE_DIR"
              mkdir -p "$RUNNER_TEMP/learning-artifact" "$LEARNING_STATE_DIR"
              if ! gh run download "$run_id" -n "$artifact" -D "$RUNNER_TEMP/learning-artifact"; then
                continue
              fi
              archive="$RUNNER_TEMP/learning-artifact/$ARCHIVE_NAME"
              [[ -s "$archive" ]] || continue
              tar -xzf "$archive" -C "$LEARNING_STATE_DIR"
              if ! python scripts/learning_outcome_loop.py --state-dir "$LEARNING_STATE_DIR" --verify; then
                continue
              fi
              if python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['LEARNING_STATE_DIR'])
          activation=json.loads((root/'learning_loop_activation.json').read_text(encoding='utf-8'))
          assert activation['schema_version']=='learning-outcome-loop-v1'
          assert activation['anti_hindsight']['historical_backfill'] is False
          assert activation['anti_hindsight']['same_cycle_outcome_binding'] is False
          print('PR28_RESTORE_OK', activation['activated_at'])
          PY
              then
                restored=true
                break 2
              fi
            done
          done

          if [[ "$restored" != true ]]; then
            echo "A previous successful PR28 run exists but no valid durable state artifact could be restored." >&2
            echo "FAIL_CLOSED: refusing to create a new activation boundary." >&2
            exit 1
          fi

      - name: Restore latest Belief Core state read-only when available
        id: belief
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list \
            --workflow belief-core-shadow-live.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [[ -z "$run_id" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No successful Belief Core shadow run available; trading sources will still be collected."
            exit 0
          fi
          rm -rf "$RUNNER_TEMP/belief-artifact"
          mkdir -p "$RUNNER_TEMP/belief-artifact"
          if ! gh run download "$run_id" -n belief-core-shadow-state -D "$RUNNER_TEMP/belief-artifact"; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Belief Core artifact unavailable; no belief forecasts will be copied this cycle."
            exit 0
          fi
          archive="$RUNNER_TEMP/belief-artifact/belief-core-state.tgz"
          if [[ ! -s "$archive" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tar -xzf "$archive" -C "$BELIEF_STATE_DIR"
          test -s "$BELIEF_STATE_DIR/state.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          state=json.loads((Path(os.environ['BELIEF_STATE_DIR'])/'state.json').read_text(encoding='utf-8'))
          assert state.get('schema_version') == 2
          assert isinstance(state.get('forecasts'), list)
          assert isinstance(state.get('verifications'), list)
          print('BELIEF_CORE_READONLY_STATE_OK',len(state['forecasts']),len(state['verifications']))
          PY
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Collect prospective forecasts decisions and outcomes
        id: collect
        shell: bash
        env:
          BOOTSTRAP: ${{ steps.restore.outputs.bootstrap }}
          BELIEF_AVAILABLE: ${{ steps.belief.outputs.available }}
        run: |
          set -euo pipefail
          args=(
            --state-dir "$LEARNING_STATE_DIR"
            --investments-dir data/investments
          )
          if [[ "$BOOTSTRAP" == "true" ]]; then
            args+=(--bootstrap)
          fi
          if [[ "$BELIEF_AVAILABLE" == "true" ]]; then
            args+=(--belief-state "$BELIEF_STATE_DIR/state.json")
          fi
          python scripts/learning_outcome_loop.py "${args[@]}"
          python scripts/learning_outcome_loop.py --state-dir "$LEARNING_STATE_DIR" --verify
          changed="$(python - <<'PY'
          import json, os
          from pathlib import Path
          status=json.loads((Path(os.environ['LEARNING_STATE_DIR'])/'learning_loop_status.json').read_text(encoding='utf-8'))
          bootstrap=os.environ.get('BOOTSTRAP') == 'true'
          print('true' if bootstrap or int(status['events_after']) > int(status['events_before']) else 'false')
          PY
          )"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "PR28_STATE_CHANGED=$changed"

      - name: Freeze PR29 counterfactual decisions and refresh gate diagnostics
        id: pr29
        shell: bash
        run: |
          set -euo pipefail
          pr29_bootstrap=false
          if [[ ! -f "$LEARNING_STATE_DIR/counterfactual_activation.json" ]]; then
            pr29_bootstrap=true
          fi
          python scripts/counterfactual_decision_gate_diagnostics_v29_1.py \
            --state-dir "$LEARNING_STATE_DIR" \
            --repo-root .
          python scripts/counterfactual_decision_gate_diagnostics_v29_1.py \
            --state-dir "$LEARNING_STATE_DIR" \
            --verify
          changed="$(PR29_BOOTSTRAP="$pr29_bootstrap" python - <<'PY'
          import json, os
          from pathlib import Path
          status=json.loads((Path(os.environ['LEARNING_STATE_DIR'])/'counterfactual_status.json').read_text(encoding='utf-8'))
          bootstrap=os.environ.get('PR29_BOOTSTRAP') == 'true'
          print('true' if bootstrap or int(status['events_after']) > int(status['events_before']) else 'false')
          PY
          )"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "PR29_STATE_CHANGED=$changed"

      - name: Validate zero authority and anti-hindsight state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from learning_outcome_loop import integration_safety_controls
          from counterfactual_decision_gate_diagnostics import safety_controls as pr29_safety, verify_pr29_state
          root=Path(os.environ['LEARNING_STATE_DIR'])
          status=json.loads((root/'learning_loop_status.json').read_text(encoding='utf-8'))
          activation=json.loads((root/'learning_loop_activation.json').read_text(encoding='utf-8'))
          cf_activation=json.loads((root/'counterfactual_activation.json').read_text(encoding='utf-8'))
          assert all(value is False for value in integration_safety_controls().values())
          assert all(value is False for value in status['zero_authority'].values())
          assert all(value is False for value in pr29_safety().values())
          assert activation['anti_hindsight']['historical_backfill'] is False
          assert activation['anti_hindsight']['same_cycle_outcome_binding'] is False
          assert cf_activation['anti_hindsight']['historical_backfill'] is False
          assert cf_activation['anti_hindsight']['same_cycle_snapshot_outcome_binding'] is False
          verified=verify_pr29_state(root)
          print('PR28_ZERO_AUTHORITY_PASS', status['events_before'], status['events_after'])
          print('PR28_SOURCES', json.dumps(status.get('sources',{}), sort_keys=True))
          print('PR29_ZERO_AUTHORITY_PASS', json.dumps(verified, sort_keys=True))
          PY

      - name: Pack private cumulative learning state
        if: steps.collect.outputs.changed == 'true' || steps.pr29.outputs.changed == 'true' || github.event.schedule == '15 6 * * 0'
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/$ARCHIVE_NAME" -C "$LEARNING_STATE_DIR" .
          test -s "$RUNNER_TEMP/$ARCHIVE_NAME"
          ls -lh "$RUNNER_TEMP/$ARCHIVE_NAME"

      - name: Store primary Learning Outcome Loop state
        if: steps.collect.outputs.changed == 'true' || steps.pr29.outputs.changed == 'true' || github.event.schedule == '15 6 * * 0'
        uses: actions/upload-artifact@v4
        with:
          name: learning-outcome-loop-state
          path: ${{ runner.temp }}/learning-outcome-loop-state.tgz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Store independent PR28-PR29 checkpoint
        if: steps.collect.outputs.changed == 'true' || steps.pr29.outputs.changed == 'true' || github.event.schedule == '15 6 * * 0'
        uses: actions/upload-artifact@v4
        with:
          name: learning-outcome-loop-checkpoint
          path: ${{ runner.temp }}/learning-outcome-loop-state.tgz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
