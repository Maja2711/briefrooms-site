name: History Integrity Guard Unit Tests

on:
  push:
    branches: [main]
    paths:
      - "scripts/history_integrity_guard.py"
      - "tests/test_history_integrity_guard.py"
      - ".github/workflows/history-integrity-guard-tests.yml"
  pull_request:
    paths:
      - "scripts/history_integrity_guard.py"
      - "tests/test_history_integrity_guard.py"
      - ".github/workflows/history-integrity-guard-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify integrity guard unit tests
        run: python -m unittest tests.test_history_integrity_guard -v
