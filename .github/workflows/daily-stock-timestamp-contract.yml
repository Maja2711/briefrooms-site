name: Daily Stock Timestamp Contract

on:
  pull_request:
    paths:
      - ".github/workflows/daily-stock-timestamp-contract.yml"
      - "scripts/daily_stock_trade_timestamp_normalizer.py"
      - "scripts/daily-stock-position-ux.js"
      - "scripts/gpw_daily_outcome_monitor.py"
      - "scripts/us_daily_stock_position_monitor.py"
      - "tests/test_daily_stock_trade_timestamps.py"
      - "pl/inwestycje/daily-trading.html"
      - "en/investing/daily-trading.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timestamp-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate timestamp contract
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/daily_stock_trade_timestamp_normalizer.py \
            scripts/gpw_daily_outcome_monitor.py \
            scripts/us_daily_stock_position_monitor.py
          python -m unittest \
            tests.test_daily_stock_trade_timestamps \
            tests.test_us_daily_stock_position_lifecycle \
            tests.test_gpw_daily_outcome_monitor -v
          node --check scripts/daily-stock-position-ux.js
          grep -q '/scripts/daily-stock-position-ux.js?v=3' pl/inwestycje/daily-trading.html
          grep -q '/scripts/daily-stock-position-ux.js?v=3' en/investing/daily-trading.html
