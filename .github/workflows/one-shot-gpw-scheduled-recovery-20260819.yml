name: One-shot scheduled GPW recovery 2026-08-19

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: one-shot-gpw-scheduled-recovery-20260819
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
      GEMINI_GENERATION_MODEL: gemini-3.5-flash-lite
      GEMINI_REVIEW_MODEL: gemini-3.5-flash-lite
      GEMINI_MIN_INTERVAL_SECONDS: "8"
      GPW_RECOVERY_DATE: "2026-08-19"
      GPW_RECOVERY_CUTOFF: "13:00"

    steps:
      - name: Check date guard
        run: |
          if [[ "$(TZ=Europe/Warsaw date +%F)" != "2026-08-19" ]]; then
            echo "Outside one-shot recovery date"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Full tests and first audit
        id: audit
        continue-on-error: true
        run: |
          set +e
          python -m unittest \
            tests.test_gpw_daily_pick \
            tests.test_gpw_daily_control_loop \
            tests.test_gpw_event_layer \
            tests.test_gpw_market_data \
            tests.test_gpw_pipeline_v2 \
            tests.test_gpw_daily_pick_ui -v > /tmp/gpw-tests.log 2>&1
          TEST_CODE=$?
          python - <<'PY' > /tmp/gpw-market.log 2>&1
          import json
          from scripts import gpw_event_driven_loop as runtime
          runtime.install()
          cfg=runtime.gpw.load_config()
          cache=runtime.provider.prefetch_market(cfg)
          audit=runtime.provider.LAST_AUDIT
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          minimum=int(len(cfg['universe'])*float(cfg['minimum_data_completeness'])+0.9999)
          if len(cache)<minimum:
              raise SystemExit(f'received={len(cache)} minimum={minimum}')
          PY
          MARKET_CODE=$?
          echo "test_code=$TEST_CODE market_code=$MARKET_CODE"
          exit 0

      - name: Generate complete decision
        id: generate
        continue-on-error: true
        run: |
          set +e
          python scripts/gpw_event_driven_loop.py --mode auto > /tmp/gpw-run.log 2>&1
          RUN_CODE=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/investments/gpw_daily_pick.json')
          payload=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          PY
          DECISION=$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/investments/gpw_daily_pick.json').read_text(encoding='utf-8'))
          print(p.get('decision') or '')
          PY
          )
          DATE=$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/investments/gpw_daily_pick.json').read_text(encoding='utf-8'))
          print(p.get('date') or '')
          PY
          )
          if [[ "$RUN_CODE" == "0" && "$DATE" == "2026-08-19" && "$DECISION" == "TRANSAKCJA" ]]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Second audit
        id: second
        continue-on-error: true
        if: steps.generate.outputs.success == 'true'
        run: |
          set +e
          python scripts/gpw_event_driven_loop.py --mode validate > /tmp/gpw-second.log 2>&1
          VALIDATE_CODE=$?
          python - <<'PY' >> /tmp/gpw-second.log 2>&1
          import json
          from pathlib import Path
          p=json.loads(Path('data/investments/gpw_daily_pick.json').read_text(encoding='utf-8'))
          q=p.get('data_quality') or {}
          s=p.get('selection') or {}
          assert p.get('date')=='2026-08-19'
          assert p.get('decision')=='TRANSAKCJA'
          assert q.get('status')=='healthy',q
          assert float(q.get('complete_ratio') or 0)>=0.8,q
          assert s.get('review',{}).get('approved') is True
          assert s.get('sources')
          assert s.get('market_snapshot',{}).get('date')=='2026-08-19',s.get('market_snapshot')
          print('SECOND_AUDIT_OK',s.get('symbol'),s.get('score'),s.get('reference_price'))
          PY
          ASSERT_CODE=$?
          set -e
          if [[ "$VALIDATE_CODE" == "0" && "$ASSERT_CODE" == "0" ]]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Build persistent diagnostic
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def tail(path):
              p=Path(path)
              return p.read_text(encoding='utf-8',errors='replace')[-24000:] if p.exists() else ''
          payload={}
          p=Path('data/investments/gpw_daily_pick.json')
          if p.exists():
              try: payload=json.loads(p.read_text(encoding='utf-8'))
              except Exception as exc: payload={'parse_error':str(exc)}
          out={
              'captured_at':'2026-08-19 scheduled recovery',
              'payload':payload,
              'tests_log':tail('/tmp/gpw-tests.log'),
              'market_log':tail('/tmp/gpw-market.log'),
              'run_log':tail('/tmp/gpw-run.log'),
              'second_audit_log':tail('/tmp/gpw-second.log'),
          }
          Path('data/internal/gpw_scheduled_recovery_2026-08-19.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          PY

      - name: Commit state, diagnostic and self-remove
        id: commit
        if: always()
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-gpw-scheduled-recovery-20260819.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/internal/gpw_scheduled_recovery_2026-08-19.json
          git add data/investments/gpw_daily_pick.json data/investments/gpw_daily_pick_metrics.json data/investments/gpw_daily_pick_learning.json 2>/dev/null || true
          git add data/investments/gpw_daily_pick_history data/internal/gpw_daily_pick_audit 2>/dev/null || true
          git add .github/workflows/one-shot-gpw-scheduled-recovery-20260819.yml
          git commit -m "Complete scheduled GPW recovery audit for 2026-08-19"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt*4))
          done
          exit 1

      - name: Request Pages build
        if: steps.generate.outputs.success == 'true' && steps.second.outputs.success == 'true'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            CODE="$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${{ github.token }}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")"
            if [[ "$CODE" == "201" ]]; then exit 0; fi
            if [[ "$CODE" != "409" ]]; then cat /tmp/pages.json; exit 1; fi
            sleep 10
          done
          exit 1

      - name: Verify production frontend
        if: steps.generate.outputs.success == 'true' && steps.second.outputs.success == 'true'
        run: |
          python - <<'PY'
          import json,time,urllib.request
          headers={'User-Agent':'BriefRooms-GPW-scheduled-recovery/1.0','Cache-Control':'no-cache'}
          last=None
          for attempt in range(1,49):
              token=f'{int(time.time())}-{attempt}'
              try:
                  with urllib.request.urlopen(urllib.request.Request(f'https://briefrooms.com/data/investments/gpw_daily_pick.json?v={token}',headers=headers),timeout=20) as r:
                      p=json.load(r)
                  last=p
                  if p.get('date')=='2026-08-19' and p.get('decision')=='TRANSAKCJA':
                      symbol=(p.get('selection') or {}).get('symbol')
                      with urllib.request.urlopen(urllib.request.Request(f'https://briefrooms.com/pl/inwestycje/portfel-10k.html?v={token}',headers=headers),timeout=20) as r:
                          html=r.read().decode('utf-8',errors='replace')
                      if 'gpw-daily-pick-public.js' not in html:
                          raise RuntimeError('GPW widget missing')
                      print('PRODUCTION_OK',symbol)
                      raise SystemExit(0)
              except Exception as exc:
                  print(attempt,type(exc).__name__,str(exc)[:180])
              time.sleep(10)
          raise SystemExit(f'production verification failed: {last}')
          PY

      - name: Enforce result
        if: always()
        run: |
          if [[ "${{ steps.generate.outputs.success }}" != "true" || "${{ steps.second.outputs.success }}" != "true" ]]; then
            echo "Recovery did not yet produce a validated TRANSAKCJA. Diagnostic has been committed."
            exit 1
          fi
