name: L3 Autonomous Experience Acquisition

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Belief Question Engine Production"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  acquire:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Validate L3 orchestrator
        run: python -m unittest tests.test_l3_experience_acquisition -v
      - name: Restore latest production questions
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p "$RUNNER_TEMP/l3"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=belief-question-engine-production&per_page=20"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api" > "$RUNNER_TEMP/a.json"
          id=$(python -c "import json; x=json.load(open('$RUNNER_TEMP/a.json')); r=[a for a in x.get('artifacts',[]) if not a.get('expired')]; r.sort(key=lambda a:a.get('created_at',''),reverse=True); print(r[0]['id'] if r else '')")
          test -n "$id"
          curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$id/zip" -o "$RUNNER_TEMP/q.zip"
          unzip -q "$RUNNER_TEMP/q.zip" -d "$RUNNER_TEMP/q"
      - name: Build autonomous research intents
        run: python scripts/l3_experience_acquisition.py --questions "$RUNNER_TEMP/q/BELIEF_QUESTIONS.json" --output "$RUNNER_TEMP/l3/L3_RESEARCH_INTENTS.json"
      - name: Assert authority boundary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads((Path(os.environ["RUNNER_TEMP"])/"l3/L3_RESEARCH_INTENTS.json").read_text())
          a=p["authority"]
          assert a["automatic_question_selection"] and a["automatic_research_routing"] and a["automatic_experiment_preregistration"]
          assert not a["belief_probability_override"] and not a["engine_policy_writeback"] and not a["code_mutation"] and not a["trade_execution"] and not a["automatic_production_promotion"]
          print("L3 authority boundary PASS",p["summary"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: l3-autonomous-experience-acquisition
          path: ${{ runner.temp }}/l3/L3_RESEARCH_INTENTS.json
          retention-days: 30
