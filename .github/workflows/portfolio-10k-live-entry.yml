name: Open Fresh 10K Positions
# NO RETROACTIVE EXECUTION

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/portfolio_10k_open_live_now.py"
      - "scripts/portfolio_10k_complete_declared_positions.py"
      - "scripts/no_retroactive_execution.py"
      - "scripts/verify_no_retroactive_execution.py"
      - "tests/test_portfolio_10k_staged_entry.py"
      - "tests/test_no_retroactive_execution.py"
      - ".github/workflows/portfolio-10k-live-entry.yml"
  schedule:
    - cron: "7,22,37,52 7-16 * * 1-5"

permissions:
  contents: write

concurrency:
  group: portfolio-10k-automation
  cancel-in-progress: false

jobs:
  staged-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start immutable LIVE execution clock
        run: |
          echo "NO_RETROACTIVE_EXECUTION=1" >> "$GITHUB_ENV"
          echo "NO_RETROACTIVE_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: python -m pip install --upgrade pip yfinance pandas numpy pytest

      - name: Open positions with fresh tradable quotes
        run: python scripts/portfolio_10k_open_live_now.py

      - name: Complete declared ETF allocations from recent open-session trades
        run: python scripts/portfolio_10k_complete_declared_positions.py

      - name: Validate portfolio execution and accounting
        run: python scripts/validate_portfolio_10k_state.py

      - name: Detect confirmed material events
        run: python scripts/portfolio_10k_material_reports.py

      - name: Validate material reports
        run: python scripts/validate_portfolio_10k_material_reports.py

      - name: Run Portfolio 10K tests and execution invariant
        run: |
          python -m pytest -q tests/test_portfolio_10k*.py
          python -m unittest tests.test_no_retroactive_execution -v
          node tests/test_portfolio_10k_material_reports_ui.js

      - name: Commit validated entries and report data atomically through NO RETROACTIVE airlock
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investments/portfolio_10k.json \
                  data/investments/portfolio_10k_material_reports.json
          if git diff --cached --quiet; then
            echo "No portfolio entry or material-report changes."
          else
            # NO RETROACTIVE EXECUTION: every newly published 10K trade must belong to this run.
            python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
            git commit -m "Update validated 10K entries and material reports"
            if ! git diff --quiet; then
              echo "::error::10K entry workflow left unstaged files; refusing a partial publication."
              git status --short
              exit 1
            fi
            git pull --rebase origin main
            python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD^ --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
            git push
          fi
