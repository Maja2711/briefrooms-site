name: Validate European Macro Calendars

on:
  pull_request:
    paths:
      - "scripts/belief_macro_calendar_adapter.py"
      - "scripts/daily_eurusd_macro_fast.py"
      - "tests/test_eu_macro_calendar_regression.py"
      - "tests/test_daily_eurusd_macro_fast.py"
      - "tests/test_belief_macro_eurusd.py"
      - ".github/workflows/validate-eu-macro-calendar.yml"
  push:
    branches: [main]
    paths:
      - "scripts/belief_macro_calendar_adapter.py"
      - "scripts/daily_eurusd_macro_fast.py"
      - "tests/test_eu_macro_calendar_regression.py"
      - "tests/test_daily_eurusd_macro_fast.py"
      - "tests/test_belief_macro_eurusd.py"
      - ".github/workflows/validate-eu-macro-calendar.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install requests pypdf
      - name: Validate European calendar and fail-closed state
        run: |
          python -m py_compile scripts/belief_macro_calendar_adapter.py scripts/daily_eurusd_macro_fast.py
          python -m unittest tests.test_eu_macro_calendar_regression tests.test_daily_eurusd_macro_fast tests.test_belief_macro_eurusd -v
