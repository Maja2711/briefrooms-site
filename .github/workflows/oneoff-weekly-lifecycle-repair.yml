name: One-off Weekly Lifecycle Repair

on:
  push:
    paths:
      - '.github/workflows/oneoff-weekly-lifecycle-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply lifecycle patch
        run: python scripts/oneoff_patch_weekly_lifecycle.py

      - name: Compile and run focused lifecycle regression
        run: |
          python -m py_compile scripts/investments_wes_lifecycle.py tests/test_wes_lifecycle_expired_no_entry.py tests/test_automation_workflow_ownership.py
          python -m unittest tests.test_wes_lifecycle_expired_no_entry

      - name: Commit permanent repair
        run: |
          git config user.name 'briefrooms-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/investments_wes_lifecycle.py \
                  tests/test_wes_lifecycle_expired_no_entry.py \
                  .github/workflows/investments-weekly.yml \
                  .github/workflows/investments-exposure-watch.yml
          git commit -m 'Terminalize missed WES entries after governed deadline'
          git push origin HEAD:main
