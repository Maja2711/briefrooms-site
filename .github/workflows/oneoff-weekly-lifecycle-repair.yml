name: One-off Weekly Lifecycle Repair

on:
  push:
    paths:
      - '.github/workflows/oneoff-weekly-lifecycle-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply lifecycle patch
        run: python scripts/oneoff_patch_weekly_lifecycle.py

      - name: Compile patched files
        run: python -m py_compile scripts/investments_wes_lifecycle.py tests/test_wes_lifecycle_expired_no_entry.py

      - name: Commit repair
        run: |
          git config user.name 'briefrooms-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/investments_wes_lifecycle.py tests/test_wes_lifecycle_expired_no_entry.py
          git commit -m 'Expire unexecuted weekly decisions after governed deadline'
          git push origin HEAD:main
