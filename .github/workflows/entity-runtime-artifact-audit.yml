name: Entity Runtime Artifact Audit

on:
  pull_request:
    paths:
      - ".github/workflows/entity-runtime-artifact-audit.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit latest PR13 → PR14 → PR15 production artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_MERGED_AT: "2026-08-20T07:31:51Z"
        run: |
          python - <<'PY'
          import io, json, os, tarfile, tempfile, urllib.parse, urllib.request, zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          bootstrap_at = datetime.fromisoformat(os.environ['BOOTSTRAP_MERGED_AT'].replace('Z', '+00:00'))
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'BriefRooms-EntityRuntimeArtifactAudit/1.0',
          }

          def api_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def api_bytes(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read()

          def parse_dt(value):
              return datetime.fromisoformat(str(value).replace('Z', '+00:00'))

          def latest_artifact(name):
              q = urllib.parse.quote(name, safe='')
              data = api_json(f'https://api.github.com/repos/{repo}/actions/artifacts?name={q}&per_page=100')
              rows = [x for x in data.get('artifacts', []) if not x.get('expired')]
              rows.sort(key=lambda x: x.get('created_at', ''), reverse=True)
              if not rows:
                  raise AssertionError(f'MISSING ARTIFACT: {name}')
              return rows[0]

          def unpack_artifact(artifact, expected_tgz, destination):
              raw = api_bytes(artifact['archive_download_url'])
              zroot = destination / 'zip'
              zroot.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(io.BytesIO(raw)) as zf:
                  zf.extractall(zroot)
              tgz = zroot / expected_tgz
              if not tgz.exists():
                  raise AssertionError(f'{artifact["name"]}: missing inner {expected_tgz}; files={sorted(p.name for p in zroot.iterdir())}')
              out = destination / 'state'
              out.mkdir(parents=True, exist_ok=True)
              with tarfile.open(tgz, 'r:gz') as tf:
                  tf.extractall(out, filter='data')
              return out

          def read_json(root, relative):
              path = root / relative
              if not path.exists():
                  raise AssertionError(f'missing state file: {relative}')
              return json.loads(path.read_text(encoding='utf-8'))

          specs = {
              'PR13': ('brace-entity-primary-source-evidence-state', 'brace-entity-primary-source-evidence-state.tgz'),
              'PR14': ('brace-entity-evidence-interpretation-state', 'brace-entity-evidence-interpretation-state.tgz'),
              'PR15': ('brace-entity-belief-state-forecast-state', 'brace-entity-belief-state-forecast-state.tgz'),
          }

          artifacts = {}
          roots = {}
          runs = {}
          with tempfile.TemporaryDirectory() as tmp:
              base = Path(tmp)
              for stage, (name, tgz) in specs.items():
                  art = latest_artifact(name)
                  artifacts[stage] = art
                  wr = art.get('workflow_run') or {}
                  run_id = wr.get('id')
                  if not run_id:
                      raise AssertionError(f'{stage}: artifact has no workflow_run.id')
                  run = api_json(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}')
                  runs[stage] = run
                  if run.get('status') != 'completed' or run.get('conclusion') != 'success':
                      raise AssertionError(f'{stage}: run {run_id} not successful: {run.get("status")}/{run.get("conclusion")}')
                  root = unpack_artifact(art, tgz, base / stage.lower())
                  roots[stage] = root

              pr13_state = read_json(roots['PR13'], 'ENTITY_PRIMARY_SOURCE_EVIDENCE_STATE.json')
              pr13_report = read_json(roots['PR13'], 'BRACE_ENTITY_PRIMARY_SOURCE_EVIDENCE_REPORT.json')
              assert pr13_report['mode'] == 'research_shadow'
              assert pr13_report['anti_hindsight']['historical_backfill'] is False
              assert pr13_report['safety_controls'] and all(v is False for v in pr13_report['safety_controls'].values())

              pr14_state = read_json(roots['PR14'], 'ENTITY_EVIDENCE_INTERPRETATION_STATE.json')
              pr14_report = read_json(roots['PR14'], 'BRACE_ENTITY_EVIDENCE_INTERPRETATION_REPORT.json')
              assert pr14_report['mode'] == 'research_shadow'
              assert pr14_report['anti_hindsight']['historical_interpretation_backfill'] is False
              assert pr14_report['interpretation_boundary']['evidence_materialized_but_not_applied_to_belief_core'] is True
              assert pr14_report['safety_controls'] and all(v is False for v in pr14_report['safety_controls'].values())

              pr15_runtime = read_json(roots['PR15'], 'ENTITY_BELIEF_FORECAST_RUNTIME_STATE.json')
              pr15_report = read_json(roots['PR15'], 'BRACE_ENTITY_BELIEF_STATE_FORECAST_REPORT.json')
              pr15_core = read_json(roots['PR15'], 'belief_core/state.json')
              assert pr15_report['mode'] == 'research_shadow'
              assert pr15_report['anti_hindsight']['historical_evidence_backfill'] is False
              assert pr15_report['anti_hindsight']['historical_forecast_backfill'] is False
              assert pr15_report['state_boundary']['brace_score_or_ranking_change'] is False
              assert pr15_report['state_boundary']['brace_sizing_or_exposure_change'] is False
              assert pr15_report['state_boundary']['entity_bridge_enabled'] is False
              assert pr15_report['state_boundary']['with_without_bridge_enabled'] is False
              assert pr15_report['safety_controls'] and all(v is False for v in pr15_report['safety_controls'].values())

              # PR15.1 bootstrap must have produced fresh PR14/PR15 state after its merge.
              for stage in ('PR14', 'PR15'):
                  created = parse_dt(artifacts[stage]['created_at'])
                  if created < bootstrap_at:
                      raise AssertionError(f'{stage}: latest artifact predates PR15.1 bootstrap merge: {created.isoformat()}')

              # The healed chain should leave PR15 no older than the PR14 state it consumes.
              if parse_dt(artifacts['PR15']['created_at']) < parse_dt(artifacts['PR14']['created_at']):
                  raise AssertionError('PR15 latest artifact is older than PR14 latest artifact')

              def artifact_line(stage):
                  a = artifacts[stage]; r = runs[stage]
                  return {
                      'artifact_id': a['id'],
                      'artifact_created_at': a['created_at'],
                      'run_id': r['id'],
                      'workflow': r['name'],
                      'event': r['event'],
                      'run_created_at': r['created_at'],
                      'run_updated_at': r['updated_at'],
                      'head_sha': r['head_sha'],
                      'conclusion': r['conclusion'],
                  }

              summary = {
                  'PR13': {
                      **artifact_line('PR13'),
                      'entities': len(pr13_state.get('entities') or {}),
                      'observations': len(pr13_state.get('observations') or []),
                      'last_updated_at': pr13_state.get('last_updated_at'),
                      'sample': pr13_report.get('sample'),
                  },
                  'PR14': {
                      **artifact_line('PR14'),
                      'entities': len(pr14_state.get('entities') or {}),
                      'interpretations': len(pr14_state.get('interpretations') or []),
                      'evidence': len(pr14_state.get('evidence') or []),
                      'last_run_at': pr14_state.get('last_run_at'),
                      'sample': pr14_report.get('sample'),
                  },
                  'PR15': {
                      **artifact_line('PR15'),
                      'runtime_contract_version': pr15_runtime.get('contract_version'),
                      'definitions': len(pr15_core.get('definitions') or []),
                      'beliefs': len(pr15_core.get('beliefs') or []),
                      'evidence': len(pr15_core.get('evidence') or []),
                      'forecasts': len(pr15_core.get('forecasts') or []),
                      'verifications': len(pr15_core.get('verifications') or []),
                      'sample': pr15_report.get('sample'),
                  },
              }
              print('ENTITY_RUNTIME_ARTIFACT_AUDIT=PASS')
              print(json.dumps(summary, indent=2, sort_keys=True))
          PY
