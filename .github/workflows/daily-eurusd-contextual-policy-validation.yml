name: Validate Daily EURUSD Contextual Policy Learning

on:
  pull_request:
    paths:
      - "scripts/daily_eurusd_contextual_policy_learning.py"
      - "tests/test_daily_eurusd_contextual_policy_learning.py"
      - ".github/workflows/daily-eurusd-contextual-policy-learning.yml"
      - ".github/workflows/daily-eurusd-contextual-policy-validation.yml"
  push:
    branches: [main]
    paths:
      - "scripts/daily_eurusd_contextual_policy_learning.py"
      - "tests/test_daily_eurusd_contextual_policy_learning.py"
      - ".github/workflows/daily-eurusd-contextual-policy-learning.yml"
      - ".github/workflows/daily-eurusd-contextual-policy-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile contextual learner
        run: |
          python -m py_compile             scripts/daily_eurusd_contextual_policy_learning.py             scripts/execution_price_engine.py             scripts/belief_market_data_adapter.py
      - name: Run contextual learning tests
        run: python -m unittest tests.test_daily_eurusd_contextual_policy_learning -v
