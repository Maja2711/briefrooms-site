name: Update Hot X Topics
# Immediate refresh requested 2026-08-03T21:19:00+02:00.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6,18 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_hot_x_2x_daily.py"
      - "scripts/update_hot_x_topics.py"
      - "scripts/build_hot_x_en.py"
      - "scripts/hot_x_items.py"
      - "scripts/hot-x-render.js"
      - "scripts/patch_hot_x_loader.py"
      - "data/hot_x_editorial_pins.json"
      - "data/hot_x_emergency.json"
      - "tests/test_hot_x_items.py"
      - "tests/test_hot_x_render.js"
      - ".github/workflows/hot-x-topics.yml"

permissions:
  contents: write

concurrency:
  group: social-content
  cancel-in-progress: false

jobs:
  update-hot-x:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Hot X implementation
        run: |
          python -m py_compile scripts/hot_x_items.py scripts/update_hot_x_2x_daily.py scripts/patch_hot_x_loader.py
          python -m unittest tests/test_hot_x_items.py
          node --check scripts/hot-x-render.js
          node tests/test_hot_x_render.js

      - name: Refresh verified direct posts and preserve editorial topics
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/update_hot_x_2x_daily.py

      - name: Verify the final published Hot X feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.hot_x_items import comment_text, duplicate_free, is_direct_post, valid_item

          feed = json.loads(Path('data/hot_tweets.json').read_text(encoding='utf-8'))['items']
          assert 4 <= len(feed) <= 10
          assert duplicate_free(feed)
          assert all(valid_item(item) for item in feed)
          assert all(
              min(len(comment_text(item, lang)) for lang in ('pl', 'en')) >= 80
              for item in feed
          )
          assert sum(is_direct_post(item.get('tweet_url')) for item in feed) >= 4
          PY

      - name: Commit updated Hot X feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hot_tweets.json
          if git diff --cached --quiet; then
            echo "No Hot X changes to commit."
          else
            git commit -m "Update Hot X topics"
            git fetch origin main
            if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
              echo "::error::main changed while Hot X data was prepared; rerun from current main."
              exit 1
            fi
            git push origin HEAD:main
          fi
