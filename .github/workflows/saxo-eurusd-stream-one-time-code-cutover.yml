name: Saxo EURUSD Stream One-Time Durable Object Code Cutover

# One-time re-activation of EXISTING verified code version.
# No Worker source edits, no new version uploads, no OAuth secret changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/saxo-eurusd-stream-one-time-code-cutover.yml"

permissions:
  contents: read

jobs:
  immediate-cutover:
    if: github.repository == 'Maja2711/briefrooms-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Activate existing Saxo stream Worker version with immediate Durable Object update
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 versions deploy 90ad0b0e-166b-4030-bc85-4e38f323f20f@100% \
            --name briefrooms-saxo-eurusd-stream \
            --config workers/saxo-eurusd-stream/wrangler.toml \
            --durable-objects-code-update-mode immediate \
            --yes
          echo "SAXO_STREAM_CODE_CUTOVER=EXISTING_VERSION_IMMEDIATE"
