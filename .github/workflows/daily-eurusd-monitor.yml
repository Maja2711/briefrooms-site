name: Monitor Daily EURUSD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/daily_engine_contract.py"
      - "scripts/daily_eurusd_lifecycle.py"
      - "scripts/daily_eurusd_spot.py"
      - "scripts/daily_eurusd_spot_v12.py"
      - "scripts/daily_eurusd_spot_v13.py"
      - "scripts/daily_eurusd_spot_v14.py"
      - "scripts/daily_eurusd_experiment.py"
      - "scripts/daily_eurusd_experiment_v12.py"
      - "scripts/daily-eurusd-spot-public.js"
      - "tests/test_daily_eurusd_lifecycle.py"
      - "tests/test_daily_eurusd_direct_signal.py"
      - "tests/test_daily_eurusd_a_fallback.py"
      - "tests/test_daily_eurusd_dynamic_exit.py"
      - ".github/workflows/daily-eurusd-monitor.yml"
  schedule:
    # Independent risk monitor. Offset from round 5-minute boundaries.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: write

concurrency:
  group: daily-eurusd-monitor
  cancel-in-progress: false

jobs:
  reconcile-eurusd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate lifecycle, admission, A fallback and dynamic exits
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_daily_eurusd_lifecycle \
            tests.test_daily_eurusd_direct_signal \
            tests.test_daily_eurusd_a_fallback \
            tests.test_daily_eurusd_dynamic_exit -v
          python -m py_compile \
            scripts/daily_engine_contract.py \
            scripts/daily_eurusd_lifecycle.py \
            scripts/daily_eurusd_spot.py \
            scripts/daily_eurusd_spot_v12.py \
            scripts/daily_eurusd_spot_v13.py \
            scripts/daily_eurusd_spot_v14.py \
            scripts/daily_eurusd_experiment.py \
            scripts/daily_eurusd_experiment_v12.py
          node --check scripts/daily-eurusd-spot-public.js

      - name: Reconcile open position with dynamic exit policy
        run: |
          set -euo pipefail
          python scripts/daily_eurusd_spot_v14.py \
            --output data/investments/eurusd_daily_spot.json \
            --history data/investments/eurusd_daily_history.json
          python scripts/daily_eurusd_spot_v14.py \
            --output data/investments/eurusd_daily_spot.json \
            --history data/investments/eurusd_daily_history.json \
            --validate
          python -m json.tool data/investments/eurusd_daily_spot.json >/dev/null
          python -m json.tool data/investments/eurusd_daily_history.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('data/investments/eurusd_daily_spot.json').read_text())
          candidate=(payload.get('metadata') or {}).get('candidate') or {}
          reasons=set(candidate.get('gate_reasons') or [])
          forbidden={
              'score_below_adaptive_long_threshold',
              'score_above_adaptive_short_threshold',
              'confidence_below_minimum',
              'signal_not_persistent',
              'entry_overextended_vs_ema20',
              'latest_30m_bar_is_shock_bar',
              'post_stop_cooldown',
              'daily_entry_limit_reached',
          }
          leaked=sorted(reasons & forbidden)
          if leaked:
              raise SystemExit(f'legacy admission veto leaked into PR25 runtime: {leaked}')
          version=payload.get('engine_version')
          if version not in {'eurusd-daily-spot-v1.4.0','eurusd-daily-spot-v1.3.0','eurusd-daily-spot-v1.2.0','eurusd-daily-spot-v1.1.0'} and payload.get('status') != 'OPEN':
              raise SystemExit(f"unexpected EUR/USD engine version: {version}")
          dynamic=(payload.get('metadata') or {}).get('dynamic_exit') or {}
          if version == 'eurusd-daily-spot-v1.4.0' and not dynamic.get('enabled'):
              raise SystemExit('v1.4 output missing dynamic-exit metadata')
          source=(payload.get('metadata') or {}).get('decision_source','NATIVE_OR_FLAT')
          print('EURUSD_DYNAMIC_EXIT_OK', payload.get('direction'), candidate.get('direction'), candidate.get('accepted'), source, sorted(reasons), dynamic.get('policy'))
          PY

      - name: Persist EURUSD state and append-only outcomes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/investments/eurusd_daily_spot.json data/investments/eurusd_daily_history.json
          if git diff --cached --quiet; then
            echo "No EURUSD state change"
            exit 0
          fi
          git commit -m "Monitor Daily EURUSD position"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying after ref refresh"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          echo "Unable to persist EURUSD state after retries" >&2
          exit 1
