name: Monitor Daily EURUSD
# NO RETROACTIVE EXECUTION

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/daily_engine_contract.py"
      - "scripts/daily_eurusd_lifecycle.py"
      - "scripts/daily_eurusd_spot.py"
      - "scripts/daily_eurusd_spot_v12.py"
      - "scripts/daily_eurusd_spot_v13.py"
      - "scripts/daily_eurusd_spot_v14.py"
      - "scripts/daily_eurusd_spot_v15.py"
      - "scripts/daily_eurusd_spot_v16.py"
      - "scripts/daily_eurusd_spot_v17.py"
      - "scripts/daily_eurusd_spot_v18.py"
      - "scripts/investments_wes_macro_belief.py"
      - "scripts/daily_eurusd_contextual_policy_learning.py"
      - "scripts/execution_price_engine.py"
      - "scripts/daily_eurusd_policy.py"
      - "scripts/daily_eurusd_experiment.py"
      - "scripts/daily_eurusd_experiment_v12.py"
      - "scripts/no_retroactive_execution.py"
      - "scripts/verify_no_retroactive_execution.py"
      - "scripts/daily-eurusd-spot-public.js"
      - "scripts/daily-eurusd-live-price.js"
      - "en/investing/daily-trading.html"
      - "pl/inwestycje/daily-trading.html"
      - "tests/test_daily_eurusd_lifecycle.py"
      - "tests/test_daily_eurusd_direct_signal.py"
      - "tests/test_daily_eurusd_a_fallback.py"
      - "tests/test_daily_eurusd_dynamic_exit.py"
      - "tests/test_daily_eurusd_learning_exploration.py"
      - "tests/test_daily_eurusd_post_trade_intelligence.py"
      - "tests/test_daily_eurusd_ecb_policy.py"
      - "tests/test_execution_price_engine.py"
      - "tests/test_daily_eurusd_contextual_policy_learning.py"
      - "tests/test_daily_eurusd_contextual_production_policy.py"
      - "tests/test_no_retroactive_execution.py"
      - ".github/workflows/daily-eurusd-monitor.yml"
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: daily-eurusd-monitor
  cancel-in-progress: false

jobs:
  reconcile-eurusd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore latest Belief Core shadow state for EURUSD context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/belief_core_state"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=belief-core-shadow-state&per_page=100"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api" > "$RUNNER_TEMP/belief-artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/belief-artifacts.json" <<'PY'
          import json, sys
          from pathlib import Path
          rows=[x for x in json.loads(Path(sys.argv[1]).read_text()).get("artifacts",[]) if not x.get("expired")]
          rows.sort(key=lambda x:x.get("created_at",""), reverse=True)
          print(rows[0]["id"] if rows else "")
          PY
          )
          if [ -n "$artifact_id" ]; then
            curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$RUNNER_TEMP/belief-state.zip"
            mkdir -p "$RUNNER_TEMP/belief-state-artifact"
            unzip -q "$RUNNER_TEMP/belief-state.zip" -d "$RUNNER_TEMP/belief-state-artifact"
            tar -xzf "$RUNNER_TEMP/belief-state-artifact/belief-core-state.tgz" -C "$RUNNER_TEMP/belief_core_state"
            echo "BELIEF_CORE_STATE=$RUNNER_TEMP/belief_core_state/state.json" >> "$GITHUB_ENV"
          else
            echo "BELIEF_CORE_STATE=" >> "$GITHUB_ENV"
          fi

      - name: Start immutable LIVE execution clock
        run: |
          echo "NO_RETROACTIVE_EXECUTION=1" >> "$GITHUB_ENV"
          echo "NO_RETROACTIVE_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Validate lifecycle, admission, exits, ECB policy and execution invariant
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_daily_eurusd_lifecycle \
            tests.test_daily_eurusd_direct_signal \
            tests.test_daily_eurusd_a_fallback \
            tests.test_daily_eurusd_dynamic_exit \
            tests.test_daily_eurusd_learning_exploration \
            tests.test_daily_eurusd_post_trade_intelligence \
            tests.test_daily_eurusd_ecb_policy \
            tests.test_execution_price_engine \
            tests.test_daily_eurusd_contextual_policy_learning \
            tests.test_daily_eurusd_contextual_production_policy \
            tests.test_no_retroactive_execution -v
          python -m py_compile \
            scripts/daily_engine_contract.py \
            scripts/daily_eurusd_lifecycle.py \
            scripts/daily_eurusd_spot.py \
            scripts/daily_eurusd_spot_v12.py \
            scripts/daily_eurusd_spot_v13.py \
            scripts/daily_eurusd_spot_v14.py \
            scripts/daily_eurusd_spot_v15.py \
            scripts/daily_eurusd_spot_v16.py \
            scripts/daily_eurusd_spot_v17.py \
            scripts/daily_eurusd_spot_v18.py \
            scripts/investments_wes_macro_belief.py \
            scripts/daily_eurusd_contextual_policy_learning.py \
            scripts/execution_price_engine.py \
            scripts/daily_eurusd_policy.py \
            scripts/daily_eurusd_experiment.py \
            scripts/daily_eurusd_experiment_v12.py \
            scripts/no_retroactive_execution.py \
            scripts/verify_no_retroactive_execution.py \
            scripts/build_trading_notification_events.py
      - name: Reconcile position with v1.8 contextual entry policy
        run: |
          set -euo pipefail
          python scripts/daily_eurusd_spot_v18.py \
            --output data/investments/eurusd_daily_spot.json \
            --history data/investments/eurusd_daily_history.json
          python scripts/daily_eurusd_spot_v18.py \
            --output data/investments/eurusd_daily_spot.json \
            --history data/investments/eurusd_daily_history.json \
            --validate
          python -m json.tool data/investments/eurusd_daily_spot.json >/dev/null
          python -m json.tool data/investments/eurusd_daily_history.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('data/investments/eurusd_daily_spot.json').read_text())
          candidate=(payload.get('metadata') or {}).get('candidate') or {}
          reasons=set(candidate.get('gate_reasons') or [])
          forbidden={
              'score_below_adaptive_long_threshold',
              'score_above_adaptive_short_threshold',
              'confidence_below_minimum',
              'signal_not_persistent',
              'entry_overextended_vs_ema20',
              'latest_30m_bar_is_shock_bar',
              'post_stop_cooldown',
              'daily_entry_limit_reached',
          }
          leaked=sorted(reasons & forbidden)
          if leaked:
              raise SystemExit(f'legacy admission veto leaked into v1.8 runtime: {leaked}')
          version=payload.get('engine_version')
          if version != 'eurusd-daily-spot-v1.8.0':
              raise SystemExit(f"unexpected EUR/USD engine version: {version}")
          metadata=payload.get('metadata') or {}
          dynamic=metadata.get('dynamic_exit') or {}
          if not dynamic.get('enabled'):
              raise SystemExit('v1.8 output missing dynamic-exit metadata')
          guard=metadata.get('same_thesis_reentry_guard') or {}
          if not guard.get('enabled'):
              raise SystemExit('v1.8 output missing same-thesis re-entry guard metadata')
          contextual_policy=metadata.get('contextual_entry_policy') or {}
          position=metadata.get('position') or {}
          lifecycle_status=str(payload.get('status') or '').upper()
          terminal_close=lifecycle_status in {'CLOSED_SL','CLOSED_TP','CLOSED_TIME','CLOSED_DYNAMIC','CLOSED_EVENT'}
          if not contextual_policy and not position and not terminal_close:
              raise SystemExit('v1.8 flat/new-entry output missing contextual entry policy metadata')
          if contextual_policy and contextual_policy.get('direction_mutation_allowed') is not False:
              raise SystemExit('contextual entry policy must not own market direction')
          policy=metadata.get('ecb_policy') or {}
          if not policy.get('enabled'):
              raise SystemExit('v1.8 output missing ECB policy context')
          cb=metadata.get('central_bank_policy') or {}
          if not cb.get('new_entry_veto_enabled') or not cb.get('fail_closed_during_event_window'):
              raise SystemExit('v1.8 ECB policy safety gate is not enabled')
          data=metadata.get('data') or {}
          if 'ecb_policy_coverage' not in data:
              raise SystemExit('v1.8 output missing ecb_policy_coverage')
          source=metadata.get('decision_source','NATIVE_OR_FLAT')
          if source == 'LOW_EDGE_LEARNING_EXPLORATION':
              exploration=metadata.get('exploration') or {}
              if not metadata.get('learning_eligible'):
                  raise SystemExit('learning exploration must be learning eligible')
              if exploration.get('risk_budget_multiplier') != 0.35:
                  raise SystemExit('learning exploration risk budget must be 0.35')
          print('EURUSD_V18_OK', payload.get('direction'), candidate.get('direction'), candidate.get('accepted'), source, sorted(reasons), policy.get('status'), data.get('ecb_policy_coverage'))
          PY

      - name: Build trading notification transition from canonical Daily state
        run: |
          set -euo pipefail
          python scripts/build_trading_notification_events.py
          python -m json.tool data/notifications/trading-state.json >/dev/null
          python -m json.tool data/notifications/trading-events.json >/dev/null

      - name: Assert Daily notification coverage
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          spot=json.loads(Path("data/investments/eurusd_daily_spot.json").read_text())
          events=json.loads(Path("data/notifications/trading-events.json").read_text()).get("events", [])
          position=((spot.get("metadata") or {}).get("position") or {})
          if str(position.get("status") or "").upper() == "OPEN":
              pid=str(position.get("trade_id") or "")
              raw=f"daily|OPEN|{pid}".encode()
              expected=hashlib.sha256(raw).hexdigest()[:24]
              if not any(str(e.get("event_id") or "") == expected for e in events if isinstance(e, dict)):
                  raise SystemExit(f"OPEN position has no notification event: {pid} / {expected}")
              print("DAILY_OPEN_NOTIFICATION_EVENT_OK", pid, expected)
          else:
              print("DAILY_NOTIFICATION_STATE_OK_FLAT")
          PY

      - name: Persist EURUSD state and append-only outcomes through NO RETROACTIVE airlock
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/investments/eurusd_daily_spot.json \
            data/investments/eurusd_daily_history.json \
            data/notifications/trading-state.json \
            data/notifications/trading-events.json
          if git diff --cached --quiet; then
            echo "No EURUSD state change"
            exit 0
          fi
          python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
          git commit -m "Monitor Daily EURUSD position"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi

            echo "Push attempt ${attempt} failed; refreshing canonical EURUSD state and recomputing"
            git fetch origin main
            git reset --hard origin/main

            python scripts/daily_eurusd_spot_v18.py \
              --output data/investments/eurusd_daily_spot.json \
              --history data/investments/eurusd_daily_history.json
            python scripts/daily_eurusd_spot_v18.py \
              --output data/investments/eurusd_daily_spot.json \
              --history data/investments/eurusd_daily_history.json \
              --validate

            python scripts/build_trading_notification_events.py

            git add -- \
              data/investments/eurusd_daily_spot.json \
              data/investments/eurusd_daily_history.json \
              data/notifications/trading-state.json \
              data/notifications/trading-events.json
            if git diff --cached --quiet; then
              echo "Remote main already contains an equivalent or fresher EURUSD state"
              exit 0
            fi

            python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
            git commit -m "Monitor Daily EURUSD position"
            sleep $((attempt * 3))
          done
          echo "Unable to persist EURUSD state after retries" >&2
          exit 1

      - name: Dispatch trading notification to Web Push immediately
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/trading-push-payload.json"
          import json
          from pathlib import Path
          payload = json.loads(Path("data/notifications/trading-events.json").read_text())
          print(json.dumps({"events": payload.get("events", [])}, separators=(",", ":")))
          PY

          delivered=0
          for attempt in 1 2 3; do
            curl --fail --silent --show-error \
              --retry 2 --retry-delay 1 \
              -H "content-type: application/json" \
              --data-binary @"$RUNNER_TEMP/trading-push-payload.json" \
              "https://briefrooms-trading-push.szczerbinski0577.workers.dev/ingest" \
              -o "$RUNNER_TEMP/trading-push-response.json"

            if python - <<'PY'
          import json, os
          from pathlib import Path
          payload=json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("trading-push-response.json").read_text())
          failed=int(payload.get("failed") or 0)
          pending=int(payload.get("pending") or 0)
          ok=payload.get("ok") is True and failed == 0 and pending == 0
          print("TRADING_PUSH_ATTEMPT", payload)
          raise SystemExit(0 if ok else 1)
          PY
            then
              delivered=1
              break
            fi

            echo "Trading push delivery incomplete on attempt ${attempt}; retrying only undelivered subscriptions"
            sleep $((attempt * 2))
          done

          if [ "$delivered" -ne 1 ]; then
            echo "Trading push delivery still incomplete after retries" >&2
            cat "$RUNNER_TEMP/trading-push-response.json" >&2
            exit 1
          fi


      - name: Validate public frontend runtime after lifecycle persistence
        run: |
          set -euo pipefail
          node --check scripts/daily-eurusd-spot-public.js
          node --check scripts/daily-eurusd-live-price.js
          python - <<'PY'
          from pathlib import Path
          required_prefix = '/scripts/daily-eurusd-live-price.js?v='
          for page in ('en/investing/daily-trading.html', 'pl/inwestycje/daily-trading.html'):
              text = Path(page).read_text(encoding='utf-8')
              if required_prefix not in text:
                  raise SystemExit(f'{page} missing EUR/USD live price runtime')
          print('EURUSD_FRONTEND_LIVE_RUNTIME_OK')
          PY
