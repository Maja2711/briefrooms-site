name: Monitor Daily EURUSD
# NO RETROACTIVE EXECUTION

on:
  pull_request:
    paths:
      - "scripts/daily_eurusd_exit_intelligence_v2.py"
      - "scripts/daily_eurusd_correction_research.py"
      - "tests/test_daily_eurusd_exit_intelligence_v2.py"
      - "tests/test_daily_eurusd_correction_research.py"
      - ".github/workflows/daily-eurusd-monitor.yml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/daily_engine_contract.py"
      - "scripts/daily_eurusd_lifecycle.py"
      - "scripts/daily_eurusd_fast_lifecycle.py"
      - "scripts/daily_eurusd_macro_event_risk.py"
      - "scripts/daily_eurusd_spot.py"
      - "scripts/daily_eurusd_spot_v12.py"
      - "scripts/daily_eurusd_spot_v13.py"
      - "scripts/daily_eurusd_spot_v14.py"
      - "scripts/daily_eurusd_spot_v15.py"
      - "scripts/daily_eurusd_spot_v16.py"
      - "scripts/daily_eurusd_spot_v17.py"
      - "scripts/daily_eurusd_spot_v18.py"
      - "scripts/daily_eurusd_spot_v19.py"
      - "scripts/daily_eurusd_exit_intelligence_v2.py"
      - "scripts/daily_eurusd_correction_research.py"
      - "scripts/daily_eurusd_belief_decision.py"
      - "scripts/belief_epistemic_state.py"
      - "scripts/epistemic_consumer_interface.py"
      - "scripts/belief_core_live.py"
      - "scripts/belief_wes_assets_adapter.py"
      - "scripts/belief_news_event_adapter.py"
      - "scripts/investments_wes_macro_belief.py"
      - "scripts/daily_eurusd_contextual_policy_learning.py"
      - "scripts/execution_price_engine.py"
      - "scripts/daily_eurusd_policy.py"
      - "scripts/daily_eurusd_experiment.py"
      - "scripts/daily_eurusd_experiment_v12.py"
      - "scripts/no_retroactive_execution.py"
      - "scripts/verify_no_retroactive_execution.py"
      - "scripts/audit_provenance.py"
      - "scripts/provenance_contract.py"
      - "scripts/sync_trading_push_commit.sh"
      - "scripts/daily-eurusd-spot-public.js"
      - "scripts/daily-eurusd-live-price.js"
      - "en/investing/daily-trading.html"
      - "pl/inwestycje/daily-trading.html"
      - "tests/test_daily_eurusd_lifecycle.py"
      - "tests/test_daily_eurusd_fast_lifecycle.py"
      - "tests/test_daily_eurusd_direct_signal.py"
      - "tests/test_daily_eurusd_a_fallback.py"
      - "tests/test_daily_eurusd_dynamic_exit.py"
      - "tests/test_daily_eurusd_macro_event_risk.py"
      - "tests/test_daily_eurusd_learning_exploration.py"
      - "tests/test_daily_eurusd_post_trade_intelligence.py"
      - "tests/test_daily_eurusd_ecb_policy.py"
      - "tests/test_execution_price_engine.py"
      - "tests/test_daily_eurusd_contextual_policy_learning.py"
      - "tests/test_daily_eurusd_contextual_production_policy.py"
      - "tests/test_daily_eurusd_exit_intelligence_v2.py"
      - "tests/test_daily_eurusd_correction_research.py"
      - "tests/test_daily_eurusd_belief_first.py"
      - "tests/test_epistemic_consumer_interface.py"
      - "tests/test_belief_core_live.py"
      - "tests/test_belief_wes_assets.py"
      - "tests/test_no_retroactive_execution.py"
      - ".github/workflows/daily-eurusd-monitor.yml"
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-eurusd-monitor
  cancel-in-progress: false

jobs:
  validate-on-push:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Daily EURUSD code without mutating trading state
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_daily_eurusd_lifecycle \
            tests.test_daily_eurusd_fast_lifecycle \
            tests.test_daily_eurusd_direct_signal \
            tests.test_daily_eurusd_a_fallback \
            tests.test_daily_eurusd_dynamic_exit \
            tests.test_daily_eurusd_macro_event_risk \
            tests.test_daily_eurusd_learning_exploration \
            tests.test_daily_eurusd_post_trade_intelligence \
            tests.test_daily_eurusd_ecb_policy \
            tests.test_execution_price_engine \
            tests.test_daily_eurusd_contextual_policy_learning \
            tests.test_daily_eurusd_contextual_production_policy \
            tests.test_daily_eurusd_exit_intelligence_v2 \
            tests.test_daily_eurusd_correction_research \
            tests.test_daily_eurusd_belief_first \
            tests.test_epistemic_consumer_interface \
            tests.test_no_retroactive_execution -v
          python -m py_compile \
            scripts/daily_engine_contract.py \
            scripts/daily_eurusd_lifecycle.py \
            scripts/daily_eurusd_fast_lifecycle.py \
            scripts/daily_eurusd_macro_event_risk.py \
            scripts/daily_eurusd_spot.py \
            scripts/daily_eurusd_spot_v12.py \
            scripts/daily_eurusd_spot_v13.py \
            scripts/daily_eurusd_spot_v14.py \
            scripts/daily_eurusd_spot_v15.py \
            scripts/daily_eurusd_spot_v16.py \
            scripts/daily_eurusd_spot_v17.py \
            scripts/daily_eurusd_spot_v18.py \
            scripts/daily_eurusd_spot_v19.py \
            scripts/daily_eurusd_exit_intelligence_v2.py \
            scripts/daily_eurusd_correction_research.py \
            scripts/daily_eurusd_belief_decision.py \
            scripts/belief_epistemic_state.py \
            scripts/epistemic_consumer_interface.py \
            scripts/execution_price_engine.py
          echo "PUSH_VALIDATION_ONLY_NO_TRADING_STATE_MUTATION"

  reconcile-eurusd:
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore latest Belief Core shadow state for EURUSD context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/belief_core_state"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=belief-core-shadow-state&per_page=100"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api" > "$RUNNER_TEMP/belief-artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/belief-artifacts.json" <<'PY'
          import json, sys
          from pathlib import Path
          rows=[x for x in json.loads(Path(sys.argv[1]).read_text()).get("artifacts",[]) if not x.get("expired")]
          rows.sort(key=lambda x:x.get("created_at",""), reverse=True)
          print(rows[0]["id"] if rows else "")
          PY
          )
          if [ -n "$artifact_id" ]; then
            curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$RUNNER_TEMP/belief-state.zip"
            mkdir -p "$RUNNER_TEMP/belief-state-artifact"
            unzip -q "$RUNNER_TEMP/belief-state.zip" -d "$RUNNER_TEMP/belief-state-artifact"
            tar -xzf "$RUNNER_TEMP/belief-state-artifact/belief-core-state.tgz" -C "$RUNNER_TEMP/belief_core_state"
            echo "BELIEF_CORE_STATE=$RUNNER_TEMP/belief_core_state/state.json" >> "$GITHUB_ENV"
          else
            echo "BELIEF_CORE_STATE=" >> "$GITHUB_ENV"
          fi

      - name: Restore authoritative Epistemic State for Daily EURUSD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/belief_epistemic_state"
          echo "DAILY_EURUSD_REQUIRE_EPISTEMIC=1" >> "$GITHUB_ENV"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=belief-epistemic-state&per_page=100"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api" > "$RUNNER_TEMP/epistemic-artifacts.json"
          artifact_id=$(python - "$RUNNER_TEMP/epistemic-artifacts.json" <<'PY'
          import json, sys
          from pathlib import Path
          rows=[x for x in json.loads(Path(sys.argv[1]).read_text()).get("artifacts",[]) if not x.get("expired")]
          rows.sort(key=lambda x:x.get("created_at",""), reverse=True)
          print(rows[0]["id"] if rows else "")
          PY
          )
          if [ -n "$artifact_id" ]; then
            curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"               -o "$RUNNER_TEMP/epistemic-state.zip"
            mkdir -p "$RUNNER_TEMP/epistemic-state-artifact"
            unzip -q "$RUNNER_TEMP/epistemic-state.zip" -d "$RUNNER_TEMP/epistemic-state-artifact"
            test -f "$RUNNER_TEMP/epistemic-state-artifact/belief-epistemic-state.tgz"
            tar -xzf "$RUNNER_TEMP/epistemic-state-artifact/belief-epistemic-state.tgz" -C "$RUNNER_TEMP/belief_epistemic_state"
            test -s "$RUNNER_TEMP/belief_epistemic_state/epistemic_state.json"
            echo "BELIEF_EPISTEMIC_STATE=$RUNNER_TEMP/belief_epistemic_state/epistemic_state.json" >> "$GITHUB_ENV"
          else
            echo "BELIEF_EPISTEMIC_STATE=" >> "$GITHUB_ENV"
            echo "No Epistemic State artifact: v1.9 will fail closed to FLAT."
          fi

      - name: Start immutable LIVE execution clock
        run: |
          echo "NO_RETROACTIVE_EXECUTION=1" >> "$GITHUB_ENV"
          echo "NO_RETROACTIVE_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Validate lifecycle, admission, exits, ECB policy and execution invariant
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_daily_eurusd_lifecycle \
            tests.test_daily_eurusd_fast_lifecycle \
            tests.test_daily_eurusd_direct_signal \
            tests.test_daily_eurusd_a_fallback \
            tests.test_daily_eurusd_dynamic_exit \
            tests.test_daily_eurusd_macro_event_risk \
            tests.test_daily_eurusd_learning_exploration \
            tests.test_daily_eurusd_post_trade_intelligence \
            tests.test_daily_eurusd_ecb_policy \
            tests.test_execution_price_engine \
            tests.test_daily_eurusd_contextual_policy_learning \
            tests.test_daily_eurusd_contextual_production_policy \
            tests.test_daily_eurusd_exit_intelligence_v2 \
            tests.test_daily_eurusd_correction_research \
            tests.test_daily_eurusd_belief_first \
            tests.test_no_retroactive_execution -v
          python -m py_compile \
            scripts/daily_engine_contract.py \
            scripts/daily_eurusd_lifecycle.py \
            scripts/daily_eurusd_fast_lifecycle.py \
            scripts/daily_eurusd_macro_event_risk.py \
            scripts/daily_eurusd_spot.py \
            scripts/daily_eurusd_spot_v12.py \
            scripts/daily_eurusd_spot_v13.py \
            scripts/daily_eurusd_spot_v14.py \
            scripts/daily_eurusd_spot_v15.py \
            scripts/daily_eurusd_spot_v16.py \
            scripts/daily_eurusd_spot_v17.py \
            scripts/daily_eurusd_spot_v18.py \
            scripts/daily_eurusd_spot_v19.py \
            scripts/daily_eurusd_exit_intelligence_v2.py \
            scripts/daily_eurusd_correction_research.py \
            scripts/investments_wes_macro_belief.py \
            scripts/daily_eurusd_contextual_policy_learning.py \
            scripts/daily_eurusd_belief_decision.py \
            scripts/belief_epistemic_state.py \
            scripts/epistemic_consumer_interface.py \
            scripts/execution_price_engine.py \
            scripts/daily_eurusd_policy.py \
            scripts/daily_eurusd_experiment.py \
            scripts/daily_eurusd_experiment_v12.py \
            scripts/no_retroactive_execution.py \
            scripts/verify_no_retroactive_execution.py \
            scripts/build_trading_notification_events.py
      - name: Reconcile position with v1.9 Belief-first final decision
        run: |
          set -euo pipefail
          python scripts/daily_eurusd_spot_v19.py \
            --output data/investments/eurusd_daily_spot.json \
            --history data/investments/eurusd_daily_history.json
          python scripts/daily_eurusd_spot_v19.py \
            --output data/investments/eurusd_daily_spot.json \
            --history data/investments/eurusd_daily_history.json \
            --validate
          python -m json.tool data/investments/eurusd_daily_spot.json >/dev/null
          python -m json.tool data/investments/eurusd_daily_history.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('data/investments/eurusd_daily_spot.json').read_text())
          candidate=(payload.get('metadata') or {}).get('candidate') or {}
          reasons=set(candidate.get('gate_reasons') or [])
          forbidden={
              'score_below_adaptive_long_threshold',
              'score_above_adaptive_short_threshold',
              'confidence_below_minimum',
              'signal_not_persistent',
              'entry_overextended_vs_ema20',
              'latest_30m_bar_is_shock_bar',
              'post_stop_cooldown',
              'daily_entry_limit_reached',
          }
          leaked=sorted(reasons & forbidden)
          if leaked:
              raise SystemExit(f'legacy admission veto leaked into v1.9 runtime: {leaked}')
          version=payload.get('engine_version')
          if version != 'eurusd-daily-spot-v1.9.0':
              raise SystemExit(f"unexpected EUR/USD engine version: {version}")
          metadata=payload.get('metadata') or {}
          dynamic=metadata.get('dynamic_exit') or {}
          if not dynamic.get('enabled'):
              raise SystemExit('v1.9 output missing dynamic-exit metadata')
          guard=metadata.get('same_thesis_reentry_guard') or {}
          if not guard.get('enabled'):
              raise SystemExit('v1.9 output missing same-thesis re-entry guard metadata')
          contextual_policy=metadata.get('contextual_entry_policy') or {}
          position=metadata.get('position') or {}
          lifecycle_status=str(payload.get('status') or '').upper()
          terminal_close=lifecycle_status in {'CLOSED_SL','CLOSED_TP','CLOSED_TIME','CLOSED_DYNAMIC','CLOSED_EVENT'}
          if not contextual_policy and not position and not terminal_close:
              raise SystemExit('v1.9 flat/new-entry output missing contextual entry policy metadata')
          if contextual_policy and contextual_policy.get('direction_mutation_allowed') is not False:
              raise SystemExit('contextual entry policy must not own market direction')
          pipeline=metadata.get('belief_pipeline') or {}
          if pipeline.get('architecture') != 'BELIEF_FIRST_V1' or pipeline.get('final_decision_after_belief') is not True:
              raise SystemExit(f'v1.9 output missing Belief-first pipeline contract: {pipeline}')
          authority=metadata.get('direction_authority') or {}
          final_decision=metadata.get('final_decision') or {}
          epistemic_consumer=final_decision.get('epistemic_consumer') or {}
          # A missing/unqualified Epistemic consumer is a data-quality incident,
          # not a genuine market-neutral 50/0 decision. Never publish that state
          # over the last canonical Daily snapshot. Existing-position lifecycle
          # and terminal closes remain allowed so risk control cannot be blocked.
          if not position and not terminal_close and epistemic_consumer.get('available') is not True:
              raise SystemExit(
                  'DAILY_EURUSD_EPISTEMIC_UNAVAILABLE_NO_PUBLICATION: '
                  + str(epistemic_consumer.get('reason') or 'unknown')
              )
          if authority.get('owner') != 'NATIVE_DAILY_EURUSD_BELIEF_FIRST_DECISION_ENGINE':
              raise SystemExit(f'unexpected v1.9 direction owner: {authority}')
          if authority.get('source') != 'NATIVE_BELIEF_FIRST':
              raise SystemExit(f'v1.9 final direction owner/source is not NATIVE_BELIEF_FIRST: {authority}')
          if authority.get('epistemic_input') != 'BELIEF_CORE_CF07':
              raise SystemExit(f'v1.9 epistemic input is not Belief Core through CF-07: {authority}')
          if final_decision.get('decision_source') != 'NATIVE_BELIEF_FIRST':
              raise SystemExit(f'v1.9 final decision source is not NATIVE_BELIEF_FIRST: {final_decision}')
          if final_decision.get('epistemic_source') != 'BELIEF_CORE_CF07':
              raise SystemExit(f'v1.9 final decision lost Belief/CF-07 epistemic source: {final_decision}')
          if final_decision.get('legacy_raw_score_direction_authority') is not False:
              raise SystemExit('legacy raw EURUSD/UUP/TLT direction authority leaked into v1.9')
          shadow=metadata.get('shadow_boundary') or {}
          for name in ('A_B_C','FSE','EURUSD_X'):
              row=shadow.get(name) or {}
              if row.get('production_direction_authority') is not False:
                  raise SystemExit(f'{name} regained production direction authority: {row}')
              if row.get('production_timing_authority') is not False:
                  raise SystemExit(f'{name} regained production timing authority: {row}')
          contextual=metadata.get('contextual_entry_policy') or {}
          if contextual and contextual.get('decision_influence') is not False:
              raise SystemExit(f'legacy contextual learner still influences v1.9 production: {contextual}')
          source=authority.get('source','NATIVE_BELIEF_FIRST')
          print('EURUSD_V19_BELIEF_FIRST_OK', payload.get('direction'), final_decision.get('direction'), candidate.get('accepted'), source, sorted(reasons), final_decision.get('coverage_weight'))
          PY

      - name: Enforce native provenance before Daily persistence
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/audit_provenance.py \
            --profile daily \
            --file data/investments/eurusd_daily_spot.json

      - name: Build trading notification transition from canonical Daily state
        run: |
          set -euo pipefail
          python scripts/build_trading_notification_events.py
          python -m json.tool data/notifications/trading-state.json >/dev/null
          python -m json.tool data/notifications/trading-events.json >/dev/null

      - name: Assert Daily notification coverage
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          spot=json.loads(Path("data/investments/eurusd_daily_spot.json").read_text())
          events=json.loads(Path("data/notifications/trading-events.json").read_text()).get("events", [])
          position=((spot.get("metadata") or {}).get("position") or {})
          if str(position.get("status") or "").upper() == "OPEN":
              pid=str(position.get("trade_id") or "")
              raw=f"daily|OPEN|{pid}".encode()
              expected=hashlib.sha256(raw).hexdigest()[:24]
              if not any(str(e.get("event_id") or "") == expected for e in events if isinstance(e, dict)):
                  raise SystemExit(f"OPEN position has no notification event: {pid} / {expected}")
              print("DAILY_OPEN_NOTIFICATION_EVENT_OK", pid, expected)
          else:
              print("DAILY_NOTIFICATION_STATE_OK_FLAT")
          PY

      - name: Persist EURUSD state and append-only outcomes through NO RETROACTIVE airlock
        id: persist
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/investments/eurusd_daily_spot.json \
            data/investments/eurusd_daily_history.json \
            data/notifications/trading-state.json \
            data/notifications/trading-events.json

          if git diff --cached --quiet; then
            echo "No EURUSD state change"
            exit 0
          fi

          python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
          git commit -m "Monitor Daily EURUSD position"

          state_paths=(
            data/investments/eurusd_daily_spot.json
            data/investments/eurusd_daily_history.json
            data/notifications/trading-state.json
            data/notifications/trading-events.json
          )

          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push attempt ${attempt} failed; checking whether canonical Daily state changed remotely"
            git fetch origin main

            # Most BriefRooms commits touch unrelated outputs. If none of the
            # four canonical Daily/notification files changed since our parent,
            # rebase the already-verified Daily commit and retry immediately.
            # If any canonical file changed, fail closed to a fresh recompute
            # from origin/main so concurrent Daily transitions are never merged.
            if git diff --quiet HEAD^ origin/main -- "${state_paths[@]}"; then
              echo "Only unrelated remote commits detected; rebasing Daily state commit"
              if git rebase origin/main; then
                python scripts/verify_no_retroactive_execution.py \
                  --baseline-ref HEAD^ \
                  --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
                continue
              fi
              git rebase --abort || true
            fi

            echo "Canonical Daily state changed remotely; recomputing from latest main"
            git reset --hard origin/main

            python scripts/daily_eurusd_spot_v19.py \
              --output data/investments/eurusd_daily_spot.json \
              --history data/investments/eurusd_daily_history.json
            python scripts/daily_eurusd_spot_v19.py \
              --output data/investments/eurusd_daily_spot.json \
              --history data/investments/eurusd_daily_history.json \
              --validate
            python scripts/build_trading_notification_events.py

            git add -- "${state_paths[@]}"

            if git diff --cached --quiet; then
              echo "Remote main already contains an equivalent or fresher EURUSD state"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            python scripts/verify_no_retroactive_execution.py --baseline-ref HEAD --run-start "$NO_RETROACTIVE_RUN_STARTED_AT"
            git commit -m "Monitor Daily EURUSD position"
            sleep $((attempt * 2))
          done

          echo "Unable to persist EURUSD state after retries" >&2
          exit 1

      - name: Dispatch persisted Daily transition to Web Push immediately
        if: steps.persist.outputs.changed == 'true'
        env:
          PUSH_API: https://briefrooms-trading-push.szczerbinski0577.workers.dev
        run: bash scripts/sync_trading_push_commit.sh "${{ steps.persist.outputs.sha }}" daily

      - name: Ensure realtime lifecycle watcher is active for an OPEN position
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          is_open=$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("data/investments/eurusd_daily_spot.json").read_text())
          pos=((p.get("metadata") or {}).get("position") or {})
          print("1" if str(pos.get("status") or "").upper() == "OPEN" else "0")
          PY
          )

          if [ "$is_open" != "1" ]; then
            echo "Daily EURUSD is not OPEN; no realtime watcher required."
            exit 0
          fi

          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/daily-eurusd-realtime-lifecycle.yml/runs?per_page=20"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" -o "$RUNNER_TEMP/realtime-runs.json"

          active=$(python - <<'PY'
          import json, os
          from pathlib import Path
          rows=json.loads((Path(os.environ["RUNNER_TEMP"])/"realtime-runs.json").read_text()).get("workflow_runs", [])
          active={"queued","in_progress","pending","requested","waiting"}
          print(sum(1 for r in rows if str(r.get("status") or "") in active and str(r.get("event") or "") == "workflow_dispatch"))
          PY
          )

          if [ "$active" -gt 0 ]; then
            echo "Realtime Daily EURUSD watcher already active."
            exit 0
          fi

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/daily-eurusd-realtime-lifecycle.yml/dispatches" \
            -d '{"ref":"main"}'

          echo "Realtime Daily EURUSD watcher dispatched."

      - name: Validate public frontend runtime after lifecycle persistence
        run: |
          set -euo pipefail
          node --check scripts/daily-eurusd-spot-public.js
          node --check scripts/daily-eurusd-live-price.js
          python - <<'PY'
          from pathlib import Path
          required_prefix = '/scripts/daily-eurusd-live-price.js?v='
          for page in ('en/investing/daily-trading.html', 'pl/inwestycje/daily-trading.html'):
              text = Path(page).read_text(encoding='utf-8')
              if required_prefix not in text:
                  raise SystemExit(f'{page} missing EUR/USD live price runtime')
          print('EURUSD_FRONTEND_LIVE_RUNTIME_OK')
          PY
