name: Validate Homepage Navigation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pl/index.html"
      - "en/index.html"
      - "scripts/site-header.js"
      - ".github/workflows/homepage-navigation-order.yml"

permissions:
  contents: read

concurrency:
  group: homepage-navigation-order
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate PL and EN homepage navigation
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          expected = {
              'pl': [
                  '/pl/aktualnosci.html',
                  '/pl/inwestycje.html',
                  '/pl/nauka.html',
                  '/pl/zdrowie.html',
                  '/pl/geopolityka.html',
                  '/pl/o-projekcie.html',
              ],
              'en': [
                  '/en/news.html',
                  '/en/investing.html',
                  '/en/science.html',
                  '/en/health.html',
                  '/en/geopolitics.html',
                  '/en/about.html',
              ],
          }
          labels = {
              'pl': ['Informacje', 'Inwestycje', 'Nauka', 'Zdrowie', 'Geopolityka', 'O nas'],
              'en': ['Information', 'Investing', 'Science', 'Health', 'Geopolitics', 'About'],
          }
          nav_pattern = re.compile(r'<nav\s+class=["\']br-home-nav["\'][^>]*>(.*?)</nav>', re.I | re.S)
          link_pattern = re.compile(r'<a\b[^>]*\bhref=["\']([^"\']+)["\'][^>]*>(.*?)</a>', re.I | re.S)
          for lang in ('pl', 'en'):
              source = Path(f'{lang}/index.html').read_text(encoding='utf-8')
              match = nav_pattern.search(source)
              assert match, f'{lang}: redesigned navigation missing'
              links = link_pattern.findall(match.group(1))
              assert [href for href, _ in links] == expected[lang], links
              actual_labels = [re.sub(r'<[^>]+>', '', text).strip() for _, text in links]
              assert actual_labels == labels[lang], actual_labels
          print('Redesigned PL and EN homepage navigation is correct.')
          PY
