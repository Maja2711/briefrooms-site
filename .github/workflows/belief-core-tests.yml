name: Belief Core tests

on:
  pull_request:
    paths:
      - "scripts/belief_core.py"
      - "scripts/belief_calibration.py"
      - "scripts/belief_core_shadow.py"
      - "scripts/belief_core_verify.py"
      - "scripts/belief_core_live.py"
      - "tests/test_belief_core.py"
      - "tests/test_belief_core_live.py"
      - "docs/BELIEF_CORE.md"
      - "docs/BELIEF_CORE_SHADOW_OPERATIONS.md"
      - ".github/workflows/belief-core-tests.yml"
      - ".github/workflows/belief-core-shadow-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Belief Core
        run: python -m py_compile scripts/belief_core.py scripts/belief_calibration.py scripts/belief_core_shadow.py scripts/belief_core_verify.py scripts/belief_core_live.py
      - name: Run Belief Core unit tests
        run: python -m unittest discover -s tests -p 'test_belief_core*.py' -v
