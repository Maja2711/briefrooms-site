name: Belief Core tests

on:
  pull_request:
    paths:
      - "scripts/belief_core.py"
      - "scripts/belief_calibration.py"
      - "scripts/belief_calibration_foundation.py"
      - "scripts/belief_data_quality_adapter.py"
      - "scripts/belief_core_shadow.py"
      - "scripts/belief_core_verify.py"
      - "scripts/belief_core_live.py"
      - "scripts/belief_external_live.py"
      - "scripts/belief_geopolitical_live.py"
      - "scripts/belief_llm_interpreter.py"
      - "scripts/belief_adapter_contract.py"
      - "scripts/belief_*_adapter.py"
      - "scripts/learning_ledger.py"
      - "tests/test_belief_core*.py"
      - "tests/test_belief_geopolitical_forecast_adapter.py"
      - "tests/test_learning_ledger.py"
      - "docs/BELIEF_CORE.md"
      - "docs/BELIEF_CORE_SHADOW_OPERATIONS.md"
      - "docs/BELIEF_EVIDENCE_ADAPTERS.md"
      - "docs/BELIEF_NEWS_MACRO_ADAPTERS.md"
      - "docs/BELIEF_CALIBRATION_FOUNDATION.md"
      - "docs/BELIEF_GSE_GEOPOLITICAL_ADAPTER.md"
      - "docs/LEARNING_LEDGER_OUTCOME_LOOP_V1.md"
      - ".github/workflows/belief-core-tests.yml"
      - ".github/workflows/belief-core-shadow-live.yml"
      - ".github/workflows/belief-core-events-live.yml"
      - ".github/workflows/belief-calibration-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Belief Core and adapters
        run: |
          python -m py_compile \
            scripts/belief_core.py \
            scripts/belief_calibration.py \
            scripts/belief_calibration_foundation.py \
            scripts/belief_data_quality_adapter.py \
            scripts/belief_core_shadow.py \
            scripts/belief_core_verify.py \
            scripts/belief_adapter_contract.py \
            scripts/belief_market_data_adapter.py \
            scripts/belief_technical_adapter.py \
            scripts/belief_liquidity_adapter.py \
            scripts/belief_regime_adapter.py \
            scripts/belief_llm_interpreter.py \
            scripts/belief_news_event_adapter.py \
            scripts/belief_macro_calendar_adapter.py \
            scripts/belief_geopolitical_forecast_adapter.py \
            scripts/belief_geopolitical_live.py \
            scripts/belief_external_live.py \
            scripts/belief_core_live.py \
            scripts/learning_ledger.py
      - name: Run Belief Core unit tests
        run: |
          python -m unittest discover -s tests -p 'test_belief_core*.py' -v
          python -m unittest tests.test_belief_geopolitical_forecast_adapter -v
          python -m unittest tests.test_learning_ledger -v
